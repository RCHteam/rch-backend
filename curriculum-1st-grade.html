<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCH 1st Grade Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#F2F5F3;--bg2:#FFFFFF;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}

<script>
// 1st Grade curriculum content (original writing). Chapters 1 to 4. Source keys are explained on the Sources page.
window.CHAPTERS = [
{
 n:1, title:'Team Culture, Leadership and Fair Play', short:'Team & Leadership',
 lead:'The team belongs to the players. First graders write their own team agreement, take turns as leader of the day, run restarts, settle disagreements with a short method and learn to compare themselves with their own past, not with each other.',
 builds:[], focus:{Technical:1,Physical:1,Psychological:5,Social:5},
 grew:{pre:'Kindergarten players led simple routines (captain jobs), learned the three thirds, agreed on three team rules and began to referee short games (chapters 1 and 9).',k:'In 1st grade these two chapters merge into one. Players write the team agreement themselves, rotate as leader of the day, run restarts in their own games, use a three-step method to settle disputes and set a personal goal against their own earlier result.'},
 dev:'At 6 to 7, friendships, being liked and working as part of a team matter much more (CDC), and children begin to compare themselves with others (Erikson’s stage of industry versus inferiority, background knowledge). Soccer use: a leader job gives belonging and competence at once, and “compare with your own yesterday” protects children who are small, young or new.',
 basis:[['CDC6','Children aged 6 to 8 care more about friendships and being part of a team, want to be liked, and become more independent.'],['FA','Three ground rules and a mix of player-led and coach-led time.'],['VISEK','Players aged 8 to 19 ranked trying your best, working hard and playing well as a team above winning (winning was 40th of 81 factors).'],['SDT','Competence, autonomy and belonging drive motivation.']],
 game:'Player-led 3 v 3: the players choose teams, set two rules, play, and settle one disagreement with the three-step method while the coach only watches.',
 objectives:['Help write a team agreement of three promises and point to one in action','Take a turn as leader of the day: lead the circle, one game and the pack-up','Settle a small disagreement with the three steps: stop, say, solve','Set a personal goal compared with your own last practice, not with a friend'],
 outcomes:['Names the three team promises and gives an example of each','Leads the circle for two minutes without help','Uses “I feel … I want …” words in a disagreement','Says one thing they improved since last week'],
 concepts:[['Coach term / child language',[['Team agreement','"Our three promises"'],['Leader of the day','"I lead the circle and the pack-up"'],['Three-step method','"Stop, say, solve"'],['Restart','"Whose ball? Where do we start?"'],['Own best','"Better than my last time"'],['Fair play','"Play hard, play kind"'],['Encourager','"I cheer for my teammates"']]]],
 why:'Six- and seven-year-olds can hold a rule in mind, take another child’s point of view for a moment and feel real pride in a job. They also start to notice who is faster or better. A team that sets its own promises, shares leadership and measures progress against each child’s own past keeps every child playing, including those who are younger, smaller or new.',
 details:[
  {h:'The team agreement',p:['Kindergarten used three rules the coach introduced. In 1st grade the group writes its own agreement in the first practice: three promises in child words, drawn on a poster and signed with a hand print or a name. The FA’s three ground rules (be safe, do not disrupt other people’s learning, be respectful) are the frame; the children choose the words.','Because the children wrote it, the agreement can be used as a calm tool: “Which promise did we just keep?” or “Which one do we need to fix?” It also gives the coach one consistent response to most misbehavior.'],pts:['Ask: “What makes a good teammate?” and sort answers into three promises','Keep each promise under five words','Post the poster at every practice','Review it at the first practice of each term'],scene:'circle'},
  {h:'Leader of the day',p:['In Kindergarten, captain jobs were set-up jobs. In 1st grade one child becomes the leader of the day: leads the arrival circle, picks the opening game from two choices, calls the water break and leads the pack-up with the job captains. Every child leads at least once each cycle.','Leadership here is service, not power. The coach teaches three phrases: “Let’s go”, “Nice try” and “What do we need?”. Self-determination theory explains why this works: a job the child can do (competence), chosen from options (autonomy), that helps the group (belonging).'],pts:['Rotate by a visible list so nobody is skipped','Give a short script for the first turns','Praise how the leader helped others, not how loud they were','Let a shy child lead with a partner'],scene:'stations'},
  {h:'Restarts and the referee role',p:['Kindergarten children met the basic restarts. 1st graders now run them in their own games: ball out means a kick-in or throw-in; goal means a restart from the team’s own end; foul (hands, push, trip) means a free kick for the other team. The leader helps decide whose ball it is.','The DFB’s children’s games use no referee: coaches act as shared game leaders and step in only when needed, and out-balls restart with a dribble or pass from the side. This age group works best when players call the restarts themselves and the adult only guides.'],pts:['Practice restarts in mini-games, not in a lecture','Use the three referee signals from Kindergarten','Let the leader make the first call, then check with the group','Praise honest calls against your own team'],scene:'refsignals'},
  {h:'Stop, say, solve',p:['Disagreements are frequent at this age and are a chance to learn. The three-step method is: stop (freeze and breathe), say (each child says what happened and what they want, starting with “I”), solve (agree on a fix, such as replay the ball or switch roles). Model it first with an adult example.','US Youth Soccer guidance treats arguments between young children as part of learning. Give the pair a minute, then step in with a question rather than a decision: “What do you both need so we can keep playing?”'],pts:['Teach the method with a pretend dispute','Keep it under one minute','Do not decide who was “right” unless safety is involved','Praise the repair, not the winner'],scene:'pairs'},
  {h:'Compare with your own best',p:['Seven-year-olds notice who is faster or better, and children who think they come out behind can lose interest. The remedy is a standing habit: each child tracks one number against their own earlier result (touches in 30 seconds, balance time, cones cleared). Never show a ranking.','The relative age effect makes this important: in one age group, children can differ in age by almost two years, and the oldest often look more talented. Progress against a child’s own past is the fair measure. It also fits the finding that players rank trying your best and working hard above winning.'],pts:['Keep one private “own best” card per child','Ask: “What did you improve?”','Never read results aloud in rank order','Celebrate a new personal best loudly'],chart:'session'}
 ],
 drills:[
  ['Team Agreement Circle',8,'All','Circle 10 yd','Poster paper, markers','Children say what makes a good teammate. The coach sorts ideas into three promises. Each child adds a hand print or name.','Short words; every voice heard','Revisit at the next practice and add an example for each promise','A dominant voice: use “turn to your buddy” first, then share'],
  ['Leader of the Day',7,'All','Edge of the field','Cones, bibs, water','The leader of the day runs the circle, picks the opening game from two choices and leads the pack-up with job captains.','Say what you need in a kind voice','Add a partner-leader; the leader asks one question at the end','A child freezes: let a buddy stand beside them'],
  ['Restart Rotation Stations',9,'Teams of 4','25 x 20 yd','Balls, cones','Four stations: kick-in, goal restart, free kick and corner. Teams spend 90 seconds at each, taking turns as taker, helper and caller, then rotate.','Say the call, then show it','The caller chooses the next station; add a time limit','Confusion over a rule: show a picture card'],
  ['Player-Led 3 v 3',15,'3 v 3','25 x 20 yd','4 small goals, bibs','Players pick teams and two extra rules. They play, make their own restarts and use stop-say-solve if needed. The coach watches.','Coach speaks only to ask a question','Add a role: encourager (counts cheers) for each team','Coach steps in too early: wait 30 seconds'],
  ['Stop, Say, Solve Role-Play',6,'Pairs','Open area','None','Pairs act out a pretend disagreement over a ball and practice the three steps with “I feel … I want …”. The group guesses the solution.','Use I-words; one voice at a time','Add a third child as a helper','Giggles: allow a moment, then try again'],
  ['Own Best Card',8,'Pairs','20 x 20 yd','1 ball per pair, cards, pencils','Each child tries a 30-second challenge (touches or balance), records the number on a personal card and sets a try-for number.','Beat your own number, not your buddy’s','Add a second try after a rest','Children compare cards: keep cards private and turn them over'],
 ],
 faults:[['Children argue over who is leader','Jobs feel important','Use a visible rotation list and a leader badge'],['A leader is bossy','Copying adult commands','Teach three phrases: “Let’s go”, “Nice try”, “What do we need?”'],['A child never speaks in the circle','Shy or young for the group','Offer a buddy or a hand-sign answer before speaking'],['Disputes explode','Competitive moments, big feelings','Pause, breathe, then stop-say-solve; coach asks questions only'],['A child compares and quits','Seeing others as better','Use the own best card; praise effort and personal progress']],
 check:'Child names the team promises, leads a circle and settles a small disagreement with stop, say, solve.'
},
{
 n:2, title:'Athletic Movement', short:'Athletic Movement',
 lead:'The speed and agility window. First graders learn sprint starts, quick feet, reaction and soft landing, build body-weight strength, and begin a proper warm-up habit that protects them.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:2},
 grew:{pre:'Kindergarten added skipping, galloping, plant-and-push cuts and movement with the ball. Opposite Lights trained self-control.',k:'1st grade adds sprint starts and short sprints, quick feet over low markers, reaction games, landing from a jump with control, body-weight strength (crawls, squats, hops) and a team-led warm-up that becomes a habit.'},
 dev:'Physical skills grow quickly at 6 to 8 (CDC). Long-term athlete development models describe a fundamental stage of about 6 to 9 years for boys and 6 to 8 for girls with windows for speed and suppleness (World Rugby page, used for the general model). Soccer use: short sprints, quick feet and agility play suit this window; endurance and heavy loading do not.',
 basis:[['LTAD','Fundamental stage (about 6 to 9 boys, 6 to 8 girls) with windows for speed and suppleness, favoring a broad movement base.'],['GALL','Fundamental movement skills: stability, locomotion and manipulation.'],['CDC6','Physical skills grow quickly in this period.'],['FA','Four-corner model: the physical corner is trained through play.']],
 game:'Sprint relay with ball: teams of three sprint, dodge and tag the next runner, balance on landing.',
 objectives:['Start a sprint from a ready position and run tall for 10 to 15 yards','Step quickly over low markers with light feet','React to a sight or sound signal and move in the right direction','Land from a small jump balanced, knees soft, for two seconds'],
 outcomes:['Runs 15 yards in a straight line with arms driving','Completes a 6-marker quick-feet line without touching markers','Reacts correctly to 4 of 5 signals','Holds a balanced landing for 2 seconds on each foot'],
 concepts:[['Coach term / child language',[['Sprint start','"Ready, set, explode"'],['Quick feet','"Hot lava, tiny steps"'],['Reaction','"See it, go"'],['Landing','"Soft knees, hold it"'],['Body-weight strength','"Animal power"'],['Warm-up','"Wake up my body"'],['Recovery','"Rest and drink"']]]],
 why:'Six- and seven-year-olds can now organize arms, legs and eyes together for a short, fast action. Their bodies adapt best to varied, short, playful efforts with full rest. Sprint, jump and balance games prepare them for every other chapter, and a simple warm-up teaches the habit of caring for the body.',
 details:[
  {h:'Sprint starts and tall running',p:['Speed is one of the qualities that the fundamental-stage models say can be trained at this age, but only with short efforts and full rest. A sprint is 10 to 15 yards: long enough to reach top speed, short enough to stay fresh. The start position is simple: feet apart, knees bent, lean forward, arms ready.','Teach three cues. “Push the ground away” for the first steps, “run tall” once you are up and “pump your arms” the whole way. Use many ways to start: lying down, sitting, back to the line, on a call or a clap. Variation builds reaction as well as speed.'],pts:['10 to 15 yards, then walk back for rest','One or two cues only','Start from different positions','Never race for a whole practice: 6 to 8 sprints is plenty'],scene:'sprint'},
  {h:'Quick feet and rhythm',p:['Light, fast steps over low markers or a rope ladder improve coordination of foot, ankle and brain. The ladder is not about fancy patterns. The goal is small steps, eyes up after the first try and landing on the ball of the foot.','Make it a game: hot lava, a dance, or Copy Me with a partner. Start with a single pattern (one foot in each square) before adding hops or sideways steps. Let children choose which pattern to try.'],pts:['Low markers or chalk squares, not a tall ladder','Start slowly, add speed after rhythm is right','Eyes up after two turns','Mix patterns so children do not memorize one'],scene:'ladder'},
  {h:'Reaction and direction change',p:['Reaction games ask a child to see, decide and move. Use sound (clap), sight (a card or a colored cone) or touch (tap on the back). Children learn to be ready: knees soft, weight on the balls of the feet, eyes on the signal.','Extend the plant-and-push cut from Kindergarten into a faster version: three steps, plant the outside foot and push off. The change is made with the whole body, not only the feet. Add a ball once the movement is smooth.'],pts:['Vary the signal: sound, sight, touch','Keep the ready position visible','Start with two choices, add a third later','Add the ball only when the cut is smooth'],scene:'cut'},
  {h:'Landing, balance and strength',p:['Control of landing protects knees and ankles. The cue is “soft knees, hold it for two”. Practice small box jumps (a line on the ground), hop-and-stick, side hops and balanced stops. Always land on both feet first, then one.','Strength at this age means body-weight movement in play: crawls, bear walks, squats, wheelbarrow walks, hops. The aim is controlled movement, not heavy work. Strength follows from using the body in many ways.'],pts:['Land on two feet, then one','Hold the landing for two seconds','Use animal walks, not weights','Stop an exercise when form is lost'],scene:'balance'},
  {h:'A warm-up habit',p:['The run start remains the first part of every practice. From 1st grade, a player-led dynamic warm-up follows: leg swings, side shuffles, skips, lunges, hops. Teach why: it wakes up the body and helps avoid injury.','Structured warm-up programs for youth soccer have shown fewer injuries in adult-run studies, but the strongest evidence is for older age groups, so use this as sensible practice, not a guarantee. Keep it short, rhythmic and led by the leader of the day.'],pts:['Five to six exercises, same order each time','Leader of the day leads it','Explain the reason in one sentence','Add one new move per cycle'],chart:'balance'}
 ],
 drills:[
  ['Sprint Starts',8,'Groups of 4','Lanes 15 yd','Cones','Players start from different positions on a call (standing, sitting, back to the line) and sprint to the far cone, then walk back for rest.','Push the ground away; arms drive; run tall','Race a partner or beat your own count; start on a sound or sight','Slow reaction: use a visible signal and fewer players'],
  ['Quick Feet Lanes',8,'Groups of 4','Lanes 10 yd','Low markers or chalk','Players step quickly through a lane of markers in set patterns (one foot in each, two in, sideways) and jog back.','Small steps; light feet; eyes up','Add a ball roll at the end; add a pattern of the child’s own design','Stepping on markers: slow the pattern'],
  ['Reaction Tag',8,'Pairs','15 x 15 yd','Cones, bibs','Partners face each other; on a signal (clap or color) one turns and sprints to a cone while the other chases for a gentle tag.','Eyes on the signal; ready position','Add a third choice of signal; chase partner starts behind','Early starts: use fake signals for fun'],
  ['Sprint Relay with Ball',15,'3 v 3','20 x 15 yd','Balls, cones, 2 small goals','Teams relay: dribble to a cone, sprint back, tag the next runner. Final round: a short 3 v 3 with a quick goal.','Quick start, control, tag','Add a cut gate; add a carry task','One runner far ahead: shuffle teams'],
  ['Landing Stations',6,'Groups of 4','Four stations','Lines, small hurdles','At each station: hop, land and hold for two seconds; side hops; one-foot hop; jump and turn a quarter.','Soft knees; hold for two','Add a ball hold; close eyes for the hold','Sloppy landing: reduce height'],
  ['Animal Power Circuit',7,'Groups of 4','Circle 15 yd','None','Bear crawl, crab walk, squat jumps, wheelbarrow with a partner, frog hops, each for 20 seconds.','Control and good form','Add a short ball dribble between stations','Rushing: slow the pace and count aloud']
 ],
 faults:[['Stiff, short steps in sprints','Starting too upright or tight','Lean forward at the start; drive the arms; practice from different positions'],['Stepping on every marker','Pattern too fast or too long','Slow it down; use fewer markers; add speed later'],['Lands with straight legs','Fear or tiredness','Lower jump height; cue soft knees and hold'],['Everyone races and tires','Too much running','Limit to 6 to 8 sprints and give full rest'],['A child cannot hold balance','Growth spurt or low strength','Use hand support and shorter holds; celebrate progress']],
 check:'Child sprints 15 yards tall, steps through a 6-marker pattern, reacts to a signal and holds a landing for 2 seconds.'
},
{
 n:3, title:'Ball Mastery', short:'Ball Mastery',
 lead:'Close control with rhythm. First graders link three- and four-move sequences, change the tempo, use both feet equally and begin juggling with a bounce.',
 builds:[1,2], focus:{Technical:5,Physical:3,Psychological:3,Social:2},
 grew:{pre:'Kindergarten added the sole, inside, outside and laces, two- and three-move links, a bounce-and-stop and a 60 touches in 30 seconds target at level 6.',k:'1st grade links three and four moves, controls tempo (slow, fast, stop), uses both feet equally, juggles with a bounce and takes its first touches while moving. Touch targets rise and a ball-mastery routine is built.'},
 dev:'Hand-eye and foot-eye coordination improve and children can hold a short sequence in working memory (CDC: mental skills develop rapidly). Soccer use: short patterns of three or four moves can be learned, repeated and varied, and children can start to look up between touches.',
 basis:[['FA','Staying on the ball: ball mastery as the base for 5 to 11 year olds; touches with both feet.'],['KNVB','Coerver and KNVB approaches use many varied touches (background knowledge).'],['CDC6','Mental skills develop rapidly; children can describe what they do.'],['GALL','Manipulation skills need many repetitions in varied settings.']],
 game:'Ball Zoo Parade: players change the animal move on the coach call while keeping the ball in a small zone.',
 objectives:['Link four moves in a sequence with both feet','Change tempo: slow, fast, stop on a signal','Juggle with one bounce between touches','Look up during a sequence and name what you saw'],
 outcomes:['Does 54 touches in 30 seconds with the inside','Shows a four-move sequence on either foot','Keeps the ball up twice with a bounce','Names a color or number while dribbling in place'],
 concepts:[['Coach term / child language',[['Sequence','"A little dance with the ball"'],['Tempo','"Slow, fast, stop"'],['Both feet','"My left and my right"'],['Juggle','"Keep it up"'],['Surface','"Sole, inside, outside, laces"'],['Eyes up','"Look, then touch"'],['Rhythm','"Tap, tap, roll"']]]],
 why:'Seven-year-olds can learn patterns and repeat them. They enjoy showing a routine and improving a count. Short, rhythmic ball work with both feet builds the touch that every later chapter needs, and varied tasks prevent the boredom of repeating one move.',
 details:[
  {h:'From moves to sequences',p:['Kindergarten linked two or three touches. In 1st grade a sequence is three or four moves that the child chooses and repeats, such as sole roll, inside tap, outside push, stop. Start with a pattern the coach shows, then invite the child to invent a sequence.','Giving children the chance to create is a motivation tool. Autonomy and competence are both met when a child can perform a routine they designed.'],pts:['Show a three-move pattern; the child adds a fourth','Repeat each sequence 3 times on each foot','Invite the child to show the group one routine','Rename sequences with child names'],scene:'toetap'},
  {h:'Tempo and touch',p:['A skilled player can play the same sequence slowly or fast. Tempo means changing speed on a signal (slow, fast, stop). Start slow so the touch is clean; speed up only when the touch stays soft.','Counting touches in 30 seconds is a simple way to track progress against your own earlier result. Planning targets rise from 50 to 70 touches across the six levels, but they are illustrative and not age norms.'],pts:['Slow first, then faster','Use stop as a game signal','Count your own number, do not compare with others','Keep the ball close, within one stride'],chart:'touches'},
  {h:'Both feet',p:['The weaker foot is a habit, not a gift. Planning half the touches on each foot early prevents a one-footed child. Make it a game: “left-foot only for 20 seconds”, “switch on the whistle”.','Rotate the sequence so the left leads the first half of each round. Praise the attempt on the weaker foot loudly.'],pts:['Half the touches on each foot','Left-foot rounds and right-foot rounds','Praise the try on the weaker foot','Do not let the stronger foot do all the finishing touches'],scene:'wiper'},
  {h:'Juggling with a bounce',p:['Keep-ups are hard at this age. The bounce version makes them reachable: toss the ball, let it bounce once, then tap it back up with the thigh or laces, bounce again, and continue. The goal is two or three in a row, not a record.','Juggling builds touch and a feeling for the ball in the air. Count only your own results. Use the thigh or foot, and use the hands if the ball gets away.'],pts:['Toss, bounce, tap, bounce','Aim for 2 to 3 in a row','Use the hands to restart','Celebrate the personal best'],scene:'juggle'},
  {h:'Eyes up',p:['Once the touch is clean, children learn to look up while controlling the ball. A coach shows a number with fingers and the child calls it while dribbling in place. This is the first step to scanning (chapter 10).','Looking up between touches is a skill that must be practiced slowly. Start with a rhythm (touch, touch, look). Keep the ball within a stride so eyes can leave it.'],pts:['Touch, touch, look','Call the number or color you saw','Start with a stationary ball','Increase to moving the ball once calm'],scene:'fingers'}
 ],
 drills:[
  ['Four-Move Sequences',8,'All','20 x 20 yd','1 ball each','The coach shows a four-move pattern (sole roll, inside tap, outside push, stop). Players repeat on each foot, then create their own.','Soft touch; repeat on both feet','Add a fifth move; swap with a partner','Rushing: slow the count'],
  ['Tempo Game',8,'All','20 x 20 yd','1 ball each','Players dribble in place. The coach calls slow, fast or stop. Add a color for left foot only.','Close the ball; quick stops','Add “change feet” on a whistle','Ignoring the stop: reward the first stoppers'],
  ['Juggle with a Bounce',8,'Pairs','15 x 15 yd','1 ball each','Toss, let it bounce once and tap it back up with the thigh or laces. Count how many in a row. Partner counts.','Soft tap; eyes on the ball','Try with the weaker foot; try two in the air','Ball runs away: use shorter taps'],
  ['Ball Zoo Parade',15,'Groups of 6','20 x 20 yd zone','1 ball each, cones','Each player moves around a zone with the ball; on the coach’s call of an animal they change to its move (turtle slow, cheetah fast, crab sideways). Add 3 v 3 mini-game at the end.','Change on the call; keep the ball close','Add a sequence challenge for the group','Bumping: shrink the group size'],
  ['Count Your Touches',6,'Pairs','Open area','1 ball each, timer','30-second rounds with the inside of the foot. Partner counts. Record the personal best on the card.','Beat your own number','Add a round with the weaker foot only','Cheating on count: partner counts aloud'],
  ['Eyes-Up Dribble',8,'Pairs','20 x 20 yd','1 ball each','One child dribbles; the partner holds up fingers or a color card. The dribbler calls it while keeping the ball close.','Touch, touch, look','Add a number the dribbler must add (two numbers)','Ball runs away: slow down']
 ],
 faults:[['Touches get heavy when speeding up','Too much speed too soon','Slow down; use shorter pushes and keep it within a stride'],['Only the strong foot is used','Habit','Make weaker-foot rounds a game; praise attempts'],['Child cannot keep up the juggle','Coordination still forming','Use the bounce; celebrate two in a row; allow the hands to restart'],['Eyes stay on the ball','Fear of losing it','Practice in place first; use touch, touch, look'],['Boredom with repeated moves','Needs variety','Rotate sequences and let children invent']],
 check:'Child links four moves on either foot, changes tempo on a call and keeps the ball up twice with a bounce.'
},
{
 n:4, title:'Dribbling and Moves', short:'Dribbling',
 lead:'Dribbling with purpose. First graders run with the ball at speed, change direction and pace, use two or three moves, shield the ball and look up to find space while dribbling.',
 builds:[3], focus:{Technical:5,Physical:3,Psychological:3,Social:2},
 grew:{pre:'Kindergarten dribbled around cones, learned slow, slow, zoom, turns, shielding and photo looks.',k:'1st grade dribbles at speed with the ball out in front, links two or three moves, shields while moving and scans for space while dribbling. Dribbling now has a purpose: find space, beat a defender, or set up a pass.'},
 dev:'Eye-foot coordination, balance and attention are all improving, but tracking a moving ball while watching other players is still maturing. Soccer use: dribbling in short bursts with a look-up every few touches; do not expect constant scanning.',
 basis:[['FA','Staying on the ball and shielding; when to dribble and when to pass for 5 to 11 year olds.'],['USS','Dribbling and 1 v 1 as key technical themes in the age-group guides.'],['CDC6','Mental skills and physical skills grow rapidly.'],['FIFA','Four-goal small games create many dribbling and 1 v 1 chances.']],
 game:'Four-goal 3 v 3: each team has two goals to attack; players choose to dribble or pass.',
 objectives:['Dribble 10 yards at speed with the ball just in front','Use two moves to change direction and pace','Shield the ball for 5 seconds while a chaser tries to win it','Look up twice during a dribble and tell where there was space'],
 outcomes:['Clears 8 cones in a zigzag without a stray touch at pace','Performs two moves in a live 1 v 1','Keeps the ball for 5 seconds under a chaser','Names the open space after a dribble'],
 concepts:[['Coach term / child language',[['Speed dribble','"Push and run"'],['Move','"Fake, then zoom"'],['Shield','"Keep my body between"'],['Space','"The empty grass"'],['Change of pace','"Slow, slow, zoom"'],['Scan','"Look, then touch"'],['Turn','"Pull back and go"']]]],
 why:'First graders enjoy speed and trickery. Their eye-foot coordination and balance allow faster dribbling, but they lose the ball when the push is too big. Teaching a push-and-run touch, a few reliable moves and a look-up habit lets them use dribbling as a choice, not an automatic reaction.',
 details:[
  {h:'Speed dribbling',p:['A speed dribble uses a longer push with the laces or outside of the foot, then a run behind the ball. The ball should stay within two or three strides. Start with a short run (10 yards) and add a second push if the first is clean.','Teach “push and run”. Too many small touches slow the player; too big a push loses the ball. Lanes marked by cones help children feel the correct distance.'],pts:['Push with the laces or outside of the foot','Ball two to three strides ahead','Eyes up between pushes','Brake with the sole to stop'],scene:'zigzag'},
  {h:'Moves that change direction',p:['A move is a trick that changes direction or pace to get past a defender. In 1st grade teach two or three reliable moves rather than many: the shoulder fake (drop the shoulder, take the ball the other way), the inside hook (pull the ball back across the body) and the drag back (sole pulls the ball back, then turn).','Practice each move slowly, then at pace, then against a passive defender. A move is only useful when followed by acceleration, so always finish with “zoom”.'],pts:['Pick two moves to master','Slow, then pace, then with a defender','Always finish with a burst','Let children invent their own variation'],scene:'fake'},
  {h:'Shielding while moving',p:['Shielding in Kindergarten was done standing or slowly. Now children keep their body between the ball and the chaser while moving, using the arm for balance (not to push) and the far foot to touch the ball.','Games like Sharks and Minnows develop the habit. A pause and a turn away from the chaser is as useful as dribbling forward. Praise keeping the ball, not just beating the chaser.'],pts:['Body between ball and chaser','Arm out for balance, not for pushing','Touch with the far foot','Turn away from pressure'],scene:'shield'},
  {h:'Dribble to find space',p:['Dribbling has three jobs: go to space, beat a defender, or buy time for a teammate to move. Teach children to answer a question as they dribble: “Where is the empty grass?” This is the first link between dribbling and the awareness chapter.','Use the look-up rhythm from chapter 3: touch, touch, look. In a crowded zone, give a point for finding a corner of the space with no player.'],pts:['Dribble toward empty grass','Look up every two or three touches','Change direction when a player approaches','Talk about what you saw after the dribble'],scene:'gates'},
  {h:'When to dribble and when to pass',p:['A simple cue works at this age: if there is empty grass in front, dribble; if a teammate is open and facing you, pass; if a chaser is close behind and no pass is on, shield or turn. Practicing this cue in small games lays the foundation for decision-making.','Resist the temptation to tell children to pass all the time. Dribbling is a skill that develops through use, and the choice between passing and dribbling is a decision to practice, not a rule.'],pts:['Use the three-line cue','Let children choose in games','Ask: “What did you see?” not “Why didn’t you pass?”','Praise both good dribbles and good passes'],chart:'dribble'}
 ],
 drills:[
  ['Speed Lanes',8,'Groups of 4','Lanes 15 yd','1 ball each, cones','Players push-and-run through a lane, brake at the end cone with the sole and dribble back at a jog.','Push, run, brake','Add a gate in the middle; time against yourself','Ball runs away: shorten the push'],
  ['Two Moves and Zoom',8,'Pairs','15 x 15 yd','1 ball each, cones','The coach shows two moves (shoulder fake and inside hook). Players practice each at a cone, then use one before accelerating to the next cone.','Fake, then zoom','Add a defender cone; choose the move at the cone','Forgetting to accelerate: call zoom'],
  ['Shield and Run',8,'Pairs','15 x 15 yd','1 ball per pair','A dribbler shields the ball while a chaser tries to win it. After 5 seconds the dribbler dashes to a marked line.','Body between; arm out for balance','Add a second chaser; shorten the time to 3 seconds','Pushing: practice the arm without contact'],
  ['Four-Goal 3 v 3 Dribble Game',15,'3 v 3','25 x 20 yd','4 small goals, bibs','A normal four-goal game with a bonus point for a goal after a dribble past a defender.','Choose: dribble, pass or shoot','Add a limit of two touches per player in one round','Chasing the ball: ask for spread'],
  ['Find the Space',8,'Groups of 6','20 x 20 yd','1 ball each, cones','Players dribble in a zone. When the coach says “find space”, they dribble to the biggest empty area and hold up a hand. Coach points to the best spot.','Look up; empty grass','Add a color of the cone to find','Everyone runs to the same space: split the zone'],
  ['Gate Race',6,'All','25 x 20 yd','1 ball each, gates','Players score a point for each gate dribbled through in 60 seconds. They record a personal best.','Look for the next gate','Add a bonus for both feet; shorten to 45 seconds','Collisions: count only open gates']
 ],
 faults:[['Ball bounces away at speed','Push too big, no control','Use shorter pushes and brake with the sole'],['Only one trick used','Habit; fear of failing','Introduce a second move and ask which fits the situation'],['Shield loses the ball','Body not between','Show the position; use the far foot'],['Dribbling into trouble','Eyes down','Touch, touch, look; ask what they saw'],['Child will not try moves in games','Fear of mistakes','Praise attempts; make moves a bonus point']],
 check:'Child dribbles at speed, performs a fake or hook followed by a burst and keeps the ball for 5 seconds under a chaser.'
},

{
 n:5, title:'Receiving and First Touch', short:'First Touch',
 lead:'Control the ball at pace. First graders control rolling and bouncing balls, take the first touch away from pressure, use the thigh on a bounce, check over the shoulder and receive and turn.',
 builds:[3,4], focus:{Technical:5,Physical:3,Psychological:3,Social:3},
 grew:{pre:'Kindergarten cushioned a slow pass with the sole or inside, showed the side, took the first touch away and controlled a bounce.',k:'1st grade controls balls at pace, uses the thigh and chest height on a bounce, checks over the shoulder before the ball arrives and receives and turns in one move. The first touch now sets up the next action.'},
 dev:'Catching with the hands becomes easier at 6 to 8 (CDC), and children track a moving ball better. Following a ball while watching players is still maturing. Soccer use: a first touch with a short look before the ball arrives, practiced in calm pairs before pressure is added.',
 basis:[['FA','First touch and receiving appear in the technical corner for 5 to 11 year olds.'],['SCAN','A study of youth footballers linked more head turns before receiving the ball with faster passing performance.'],['CDC6','Catching and ball skills improve between 6 and 8.'],['USS','Receiving and passing as the core technical themes.']],
 game:'Two Zones: control the pass in the end zone to score, with a defender behind.',
 objectives:['Control a rolling pass at pace with the inside of either foot','Take the first touch away from the nearest defender','Control a bouncing ball with the thigh or inside','Check over the shoulder before the ball arrives, then receive and turn'],
 outcomes:['Controls 7 of 10 passes from 8 yards within one stride','Takes the first touch into space away from a cone defender','Controls a bounce with the thigh or inside','Names the nearest player after a peek'],
 concepts:[['Coach term / child language',[['First touch','"The touch that sets me up"'],['Cushion','"Soft foot"'],['Away touch','"Take it away from the chaser"'],['Check shoulder','"Peek behind me"'],['Receive and turn','"Catch it and go"'],['Thigh control','"Table leg"'],['Open body','"Show my side"']]]],
 why:'A good first touch turns a pass into a chance. Seven-year-olds can now watch a ball arrive, relax the foot and decide where to touch it, if the task is calm. The new part is to look first: a quick check over the shoulder tells a child where the pressure is, so the touch can go away from it.',
 details:[
  {h:'Control at pace',p:['Kindergarten used slow balls. In 1st grade passes come faster. The foot meets the ball and gives with it, like catching an egg. The body is behind the line of the ball and the receiving foot is lifted a little.','If the ball bounces off the foot, the pass was too fast for the child’s level or the foot was stiff. Reduce pace before changing technique.'],pts:['Move into the line of the ball','Lift the foot and give on contact','Use the inside; either foot','Slow the pass if control fails'],scene:'cushion'},
  {h:'Take it away',p:['The away touch moves the ball out of the reach of the nearest defender and into space. Teach it with a cone or bibbed player on one side: the first touch goes to the other side, and the next touch can be a dribble or a pass.','The cue is “away, then go”. The touch itself should be soft but directed; a heavy touch away from the player gets lost.'],pts:['Touch into the space on the far side of the defender','Touch soft but directed','Take the next touch immediately','Practice with either foot'],scene:'receive'},
  {h:'Bounces and the thigh',p:['A bouncing ball can be controlled with the sole, the inside or the thigh. For the thigh, lift the knee so the thigh is flat, then let it drop as the ball lands, like a table dropping.','Start with a toss from a partner. Seven-year-olds enjoy the challenge but need many easy tries. Do not introduce chest or head control; heading is not used.'],pts:['Toss to waist height','Thigh flat, drop on contact','Sole or inside for lower bounces','No heading'],scene:'bounce'},
  {h:'Peek before the ball arrives',p:['Scanning means looking around before receiving. A study of youth footballers linked more head turns before receiving the ball with faster passing. At this age the habit is simple: peek over the shoulder while the ball rolls toward you, then decide.','Start with a partner standing behind who holds up fingers. The receiver peeks, calls the number and then controls the ball. This rehearses the looking habit while the control is still easy.'],pts:['Peek while the ball is rolling','Call what you saw','Do the peek early so the eyes return to the ball in time','Begin with easy passes'],scene:'scan'},
  {h:'Receive and turn',p:['With a defender behind, a player who receives with the back to goal can turn in one touch. The first touch rolls the ball across the body to the open side while the body turns, then the next touch leaves with the ball.','Practice in steps: receive and stop, receive and turn gently, receive and turn at pace. The difference between a good turn and a loss of the ball is often the peek before it arrived.'],pts:['Peek, then touch across the body','Turn with the ball, not before it','Slow, then pace','Finish with a burst'],chart:'control'}
 ],
 drills:[
  ['Pass-and-Control Pairs',8,'Pairs','Lanes 8 yd','1 ball per pair','Partners pass and control, receiving with the inside of either foot and stopping the ball within one stride.','Soft foot; give with the ball','Make the pass firmer; add a second touch to a target','Bouncing off: slow the pass'],
  ['Away Touch Cones',8,'Pairs','Lanes 10 yd','Cones, balls','A cone stands one stride beside the receiver. The first touch goes away from the cone and the next touch plays back to the partner.','Take it away, then go','Use a moving cone (a passive defender) and either foot','Heavy touch: soften it'],
  ['Thigh and Bounce',8,'Pairs','10 x 10 yd','1 ball per pair','Partner tosses to waist height; receiver controls with the thigh or inside and passes it back.','Table leg; relax on contact','Add a bounce toss; try the weaker leg','Ball runs away: lower toss'],
  ['Control Corners Game',15,'4 v 4','30 x 20 yd','Cones, bibs','Each end has two corner boxes. A team scores by controlling a pass inside a corner box and playing it out to a teammate before a defender arrives.','Peek, control, play out','Add a time limit; defenders may enter after two seconds','Rushing the control: slow the pass'],
  ['Peek and Control',8,'Groups of 3','15 x 10 yd','1 ball per group','Passer plays; receiver peeks, calls the number shown by the third player and controls the ball.','Peek early','Make the passer move; the third player moves behind','Peeking too late: pass slower'],
  ['Receive and Turn',6,'Groups of 3','15 x 15 yd','Balls, cones','Receiver faces the passer with a passive defender behind. Receive, turn and play to the far cone.','Peek, across the body, go','Defender becomes active after the first touch','Turning before the ball arrives: wait']
 ],
 faults:[['Ball bounces off the foot','Stiff foot or ball too fast','Soften the foot; slow the pass'],['First touch too heavy','Pushing instead of cushioning','Cue soft foot; touch into small space first'],['Touch goes toward pressure','Not looking','Peek early; set the cone on the pressure side'],['Child turns before the ball arrives','Rushing','Wait for contact, then turn'],['Thigh control fails','Thigh not flat or ball too high','Lower toss; cue drop the thigh']],
 check:'Child controls 7 of 10 passes at pace, takes the first touch away from a defender and peeks before receiving.'
},
{
 n:6, title:'Passing', short:'Passing',
 lead:'Accurate passes at longer range. First graders drive the ball with the inside and the laces over 10 yards, try the outside of the foot, pass on the move, pass into space and pass under light pressure.',
 builds:[3,5], focus:{Technical:5,Physical:3,Psychological:3,Social:4},
 grew:{pre:'Kindergarten passed with the inside at 6 to 8 yards, called names, supported at an angle and played a simple give-and-go.',k:'1st grade passes at 10 yards with a firmer strike, tries the outside of the foot, passes while moving, passes into space ahead of a teammate and keeps a 3 v 2 going under light pressure.'},
 dev:'Leg strength, balance and timing improve at 6 to 8, and children begin to care how teammates see them (CDC). Soccer use: firmer passes over longer distance, and a team-first attitude where a good pass is celebrated like a goal.',
 basis:[['USS','Passing and receiving are core technical themes at U7 and U8.'],['FA','Passing as part of the technical and social corners.'],['CDC6','Children care more about teamwork and others’ feelings.'],['USYS','Small-sided games of 3 v 3 and 4 v 4 give more passing touches.']],
 game:'4 v 4 Passing Game: bonus point for five passes in a row, ending with a shot.',
 objectives:['Pass with the inside of the foot firmly and accurately over 10 yards','Try an outside-of-the-foot pass and a driven pass with the laces','Pass while moving and pass into space for a teammate to run on to','Keep the ball in a 3 v 2 under light pressure'],
 outcomes:['Passes 7 of 10 accurately from 10 yards','Plays an outside-foot pass to a near cone','Leads a runner with a pass in front','Completes 5 passes in a 3 v 2'],
 concepts:[['Coach term / child language',[['Inside pass','"Side of my foot"'],['Driven pass','"Hard and low with the laces"'],['Outside pass','"Flick with the outside"'],['Lead the pass','"Give it in front of the runner"'],['Pass into space','"Where they will be"'],['Support','"Be an option, make a triangle"'],['Weight of pass','"Not too soft, not too hard"']]]],
 why:'Seven-year-olds can now judge distance and speed better and can look up before a pass. They also understand “help your teammate” in a new way. A pass into space turns passing from throwing the ball at a person into a team action, an early form of the 2 v 1 ideas in chapter 9.',
 details:[
  {h:'The firm pass',p:['The inside-of-the-foot pass keeps its form: plant foot beside the ball and pointing at the target, ankle firm, toe up, follow through. The difference is speed: at 10 yards the pass must travel hard enough to arrive quickly but flat enough to be controlled.','Introduce the laces drive after the inside pass is steady: the same plant, the toe pointing down, and contact on the laces. Keep the driven pass short of full power; accuracy matters more.'],pts:['Plant foot beside the ball','Ankle firm, follow through','Keep the pass low and flat','Add distance only when accuracy is steady'],scene:'pass'},
  {h:'The outside of the foot',p:['The outside-foot pass is a quick, disguised pass over a short distance. It is a fun skill at this age and strengthens ankle control. Teach it at 5 to 6 yards first.','Not every child will master it; offer it as a choice, not a requirement. Praise attempts and let children use it in small games.'],pts:['Short distance first','Flick from the ankle','Offer as a choice','Use in small games'],scene:'pass'},
  {h:'Pass on the move',p:['Passing while moving is a leap for seven-year-olds. Teach it in steps: walk and pass, jog and pass, then run and pass. The ball stays slightly in front, the plant foot lands beside it and the pass goes out. Look up before the pass.','Pairs practicing side by side down a lane learn the timing of a moving pass. Add a target cone at the end to give a clear goal.'],pts:['Walk, then jog, then run','Look up before the pass','Ball slightly in front of the plant foot','Use a target cone'],scene:'follow'},
  {h:'Pass into space',p:['A pass to a player’s feet makes the receiver stop. A pass into space lets the receiver keep moving. The cue is “give it where they are going”. Children learn it by passing to a running partner in a lane and by passing between two cones the partner runs through.','Let the runner call “Yes!” when the pass was good. This links to give-and-go and the 2 v 1 ideas in chapter 9.'],pts:['Pass in front of the runner','Runner calls where they want it','Start with a slow runner','Celebrate the good pass'],scene:'giveandgo'},
  {h:'Passing under pressure',p:['A 3 v 2 gives the attackers a numerical advantage. The ball carrier must find the free player. The rule: one defender cannot cover two passing options, so one is always open.','Start with a big space and passive defenders. Increase pressure only when children succeed. Praise the pass and the movement of the player without the ball.'],pts:['Pass to the free player','Move to be an option','Start with passive defenders','Count passes in a row'],chart:'pass'}
 ],
 drills:[
  ['Gate Passing at 10 Yards',8,'Pairs','Lanes 10 yd','1 ball per pair, cones','Partners pass through a gate in the middle of the lane. Count how many in a row go through the gate.','Plant foot, ankle firm, follow through','Increase the distance; add the weaker foot','Weak pass: move closer'],
  ['Outside-Foot Corner',8,'Groups of 3','12 x 12 yd','Cones, balls','Passers use the outside of the foot to play to a corner cone, then rotate.','Flick from the ankle','Add a defender; try with either foot','Hitting too hard: cue the flick'],
  ['Pass on the Move',8,'Pairs','Lane 25 yd','1 ball per pair, cones','Pairs move side by side down the lane passing the ball back and forth at a walk, then jog.','Ball in front; look up','Move faster; add a cone target','Rushed pass: slow the pace'],
  ['4 v 4 Passing Game',15,'4 v 4','30 x 25 yd','4 small goals, bibs','Normal game; five passes in a row earn a bonus point. A shot after five passes earns an extra point.','Look up; give it in front','Add a rule: pass before shooting','Hogging the ball: add a touch limit'],
  ['Lead the Runner',8,'Groups of 3','20 x 15 yd','1 ball per group, cones','Passer plays into space between two cones for a runner. The runner calls “Yes” when the pass is in front.','Give it where they are going','Add a defender who starts behind','Passing to feet: place a cone in front'],
  ['3 v 2 Keep-Away',6,'5 players','15 x 15 yd','Balls, bibs','Three attackers keep the ball from two defenders. Count passes in a row.','Move to be an option','Make the defenders active; shrink the space','Standing still: reward movement']
 ],
 faults:[['Pass goes too soft','Fear of power','Practice firmer passes at short distance first'],['Pass goes wide','Plant foot not pointing at target','Check the plant foot and follow through'],['Pass to feet only','Habit','Place a cone in front of the runner; give a point for a lead pass'],['Mover stands still','Waiting for the ball','Cue: move to be an option'],['Passer looks only at the ball','Fear of losing it','Peek up before the pass; start slow']],
 check:'Child passes 7 of 10 accurately at 10 yards, leads a runner and completes 5 passes in a 3 v 2.'
},
{
 n:7, title:'Shooting and Finishing', short:'Shooting',
 lead:'Shooting with power and placement. First graders strike with the instep, finish first time, choose a corner, shoot after a dribble and finish 1 v 1 against a goalkeeper.',
 builds:[3,5,6], focus:{Technical:5,Physical:4,Psychological:4,Social:2},
 grew:{pre:'Kindergarten shot at a still ball, used the laces and the inside, followed the shot and tried the weaker foot.',k:'1st grade strikes with the instep for power, finishes a pass first time, places the ball in a corner, shoots after a dribble or a turn and finishes 1 v 1 against a goalkeeper, still without heading.'},
 dev:'Balance on the plant foot, leg strength and coordination improve, and children can aim at a target. Soccer use: a longer run-up, a firm plant foot and a target, with courage to shoot as the main habit. Emotional resilience (a missed shot is not a failure) is the key.',
 basis:[['USS','Shooting and finishing in the age-group technical themes.'],['USYS','Small goals and four-goal games give many shots.'],['DFBR','German children’s games score only from a shooting zone, which creates many shots but keeps players from shooting from the halfway line.'],['VISEK','Trying your best was ranked among the most important fun factors.']],
 game:'Shooting Zone Game: goals count only when the shot is taken inside the shooting zone.',
 objectives:['Strike the ball with the instep with a firm plant foot','Finish a pass first time without stopping it','Choose a corner and shoot to the far side','Finish a 1 v 1 against a goalkeeper by shooting early'],
 outcomes:['Hits 5 of 10 shots on target from 10 yards','Shoots first time from a rolling pass','Hits a marked corner in 3 of 10 attempts','Shoots after a dribble without stopping'],
 concepts:[['Coach term / child language',[['Instep','"Shoelaces"'],['Plant foot','"Standing foot next to the ball"'],['First time','"One touch and shoot"'],['Corner','"Aim at the corner"'],['Follow the shot','"Chase the rebound"'],['Brave shot','"Shoot, don’t wait"'],['Shooting zone','"Shoot from here"']]]],
 why:'Seven-year-olds are excited by goals but can freeze or hit with the toe. A calm routine (plant, look, strike, follow) turns excitement into control. Because most shots miss, the coach’s response to a miss decides whether a child shoots again.',
 details:[
  {h:'The instep drive',p:['The instep drive uses the laces, with the ankle locked and the toe pointing down. The plant foot is beside the ball, the knee over the ball, and the leg swings through. The aim is solid contact before power.','Children often hit with the toe because it is easy. A short run-up at an angle gives a good contact point. Start with a still ball and a target, then add a rolling ball.'],pts:['Plant foot beside the ball','Ankle locked, toe down','Look at the ball, then the target','Short run-up at an angle'],scene:'shoot'},
  {h:'First-time finish',p:['A first-time finish is a shot taken without stopping the ball. It saves a touch and surprises the keeper. It needs timing: the child watches the ball, steps into the line and strikes through.','Start with a slow rolled pass to the child’s strong side and a large goal. Add speed gradually. If control is the problem, return to chapter 5 skills.'],pts:['Watch the ball all the way','Step into the line','Strike through','Start with slow rolls'],scene:'firsttime'},
  {h:'Placement',p:['Placing the ball into a corner is more reliable than power alone. Teach it with a cone in each corner or hanging bibs. The cue is “look at the corner, then hit the ball”. Younger children find it hard to aim; accept misses.','Mark the corners by color and call a color before the shot. This turns placement into a game and adds a decision.'],pts:['Look at the corner first','Use colored targets','Aim for the far corner away from the keeper','Accept misses and celebrate attempts'],scene:'shoot'},
  {h:'Shooting after movement',p:['In a game, most shots follow a dribble, a turn or a pass. Teach the shot as part of a sequence: touch, look, shoot. After the first touch the ball is set for the strike, so there is no need for a second touch.','Start with the dribble toward the goal, then add a defender who starts behind. The decision is to shoot as soon as there is a clear view.'],pts:['Touch, look, shoot','Shoot when the view is clear','No extra touches','Use either foot'],scene:'rebound'},
  {h:'1 v 1 with the keeper',p:['Against a goalkeeper, the best habit is to shoot early, low and to a corner. Wait too long and the keeper closes the angle. Children learn the pattern through repetition.','Rotate the keeper role every turn so every child learns both sides. Praise a brave shot and the keeper’s save equally.'],pts:['Shoot early','Low and to a corner','Follow the shot','Rotate the keeper'],chart:'shoot'}
 ],
 drills:[
  ['Instep Targets',8,'Pairs','10 yd from goal','Balls, cones, goals','Shoot a still ball at a small goal with a corner cone. Count hits.','Plant foot; laces; follow through','Move back; use the weaker foot','Toe poke: cue laces'],
  ['First-Time Finish',8,'Groups of 3','Goal with feeder','Balls, goal','A feeder rolls a ball across the box. The shooter strikes first time.','Watch the ball; step in; strike through','Faster feed; the other foot','Missing the ball: slow the roll'],
  ['Color Corner',8,'Groups of 4','Goal','Colored cones, balls','The coach calls a corner color. The shooter looks, then hits the ball to that corner.','Look at the target; strike','Two colors; far corner away from the keeper','Wild shots: move closer'],
  ['Shooting Zone Game',15,'3 v 3','25 x 20 yd','4 goals, cones','Goals count only from inside the shooting zone near each goal. Players choose when to shoot.','Brave shot; follow it','Add a bonus for a first-time goal','Hesitation: praise the try'],
  ['Gate-and-Strike Circuit',8,'Groups of 4','20 yd to goal','Balls, goal, cones','Dribble through a gate, take one touch toward the corner and strike. Collect your ball and rejoin the line. A chaser starts after the gate in later rounds.','Gate, touch, strike','Add a chaser; shoot with either foot','Overdribbling: shoot at the line'],
  ['1 v 1 Keeper Duel',6,'Pairs','Small goal 10 yd','Balls, goal','The attacker starts at the line and dribbles forward; the keeper tries to save. After the shot, roles swap.','Shoot early, low, corner','Add a defender behind the attacker','Keeper dives too early: stay set']
 ],
 faults:[['Toe poke','Easy contact','Show laces and locked ankle; use a still ball'],['Shot goes high','Leaning back','Cue chest over the ball'],['Freezing before the shot','Fear of missing','Praise the try; reduce pressure'],['Overdribbling','Wanting a clear shot','Mark a line where the player must shoot'],['No follow-up','Watching the shot','Cue: follow the shot']],
 check:'Child shoots 5 of 10 on target at 10 yards, finishes first time and shoots early in a 1 v 1.'
},
{
 n:8, title:'1 v 1 Attacking and Defending', short:'1 v 1',
 lead:'The most important duel. First graders attack with three moves and a burst, defend with a jockey and a block tackle, recover quickly and win the ball and go.',
 builds:[2,4,7], focus:{Technical:4,Physical:4,Psychological:5,Social:3},
 grew:{pre:'Kindergarten tried a shoulder fake with a burst, defended side-on, jockeyed and sent the attacker to one side.',k:'1st grade attacks with three moves, defends with a jockey and a block tackle, recovers after losing the ball and wins and goes. The duel is a chance to learn bravely and kindly, not to win at all costs.'},
 dev:'Balance, agility and reaction time improve at 6 to 8. Social comparison starts to matter, so the duel is where confidence can grow or shrink. Soccer use: pair children by size and confidence, praise the attempt and rotate partners so everyone wins and loses sometimes.',
 basis:[['USS','1 v 1 as a central technical theme in the age-group guides.'],['FA','Staying on the ball and defending basics in the foundation phase.'],['VISEK','Trying your best, working hard and being active rank above winning among fun factors.'],['LTAD','Agility and speed windows support the duel.']],
 game:'1 v 1 Ladder: winners move up a grid, losers move down, handshake before and after.',
 objectives:['Attack with three moves and finish with a burst','Defend side-on, jockey and delay for three seconds','Make a safe block tackle with the inside of the foot','Recover after losing the ball and win it and go'],
 outcomes:['Tries three different moves in a live 1 v 1','Delays an attacker for 3 seconds','Wins the ball with a block tackle without fouling','Starts a counter right after winning the ball'],
 concepts:[['Coach term / child language',[['Jockey','"Dance backward, stay low"'],['Block tackle','"Foot like a wall"'],['Delay','"Make them wait"'],['Recover','"Run back fast"'],['Win and go','"Get it, then zoom"'],['Show them one way','"Close one door"'],['Brave and kind','"Try hard, play fair"']]]],
 why:'The 1 v 1 combines everything: touch, speed, deciding and courage. First graders can now do it with some control but they also feel the pressure of winning and losing. Balanced pairs, short rounds and praise for effort keep it healthy.',
 details:[
  {h:'Attacking with three moves',p:['Keep a short list of moves: shoulder fake, inside hook, drag back. Each move changes direction or pace and is followed by a burst. In a live 1 v 1, the attacker chooses a move based on the defender’s stance.','A move that works once will not always work. Children learn that variety is the answer: try something different if the first move fails.'],pts:['Pick a move that fits the defender’s position','Fake, then burst','Try a different move after a fail','Keep the ball close until the burst'],scene:'fake'},
  {h:'Defending: jockey and delay',p:['A good defender does not rush in. The jockey stance is side-on, low, with the knees bent and one foot slightly ahead, backing up as the attacker comes. The aim is to delay, force the attacker to one side and wait for a mistake.','Delay is a skill children can feel: counting “one, two, three” while holding the attacker back gives the team time to recover.'],pts:['Side-on, knees bent','Back up, stay in front','Show one way','Count the delay'],scene:'jockey'},
  {h:'The block tackle',p:['A block tackle is when the defender plants the standing foot and puts the inside of the other foot firmly on the ball, like a wall. It is safe because the foot stays low and no sliding is involved. No sliding, kicking or grabbing is allowed.','Teach it with a still ball first, then a slow roll, then a live ball. The defender should tackle when the ball is slightly away from the attacker’s foot.'],pts:['Foot like a wall','Eyes on the ball','Tackle when the ball is loose','No sliding or grabbing'],scene:'tackle'},
  {h:'Recover and win and go',p:['After losing the ball, a defender can chase to get back between the ball and the goal. This is the first step to transition (chapter 11). Recovery runs are short and the goal is to get goal-side.','Once the ball is won, the defender goes at once: win and go. Two seconds after winning the ball are when a team is most dangerous.'],pts:['Run back toward your goal','Get between the ball and goal','Win it, then go at once','Praise the recovery effort'],scene:'goalside'},
  {h:'Brave and kind',p:['The duel is where bravery and fair play meet. Teach a handshake before and after, praise a good loss as well as a win and use the ladder format so children win and lose in turn.','Compare with your own best, not with a friend: how many moves did you try, how long did you delay? The chart tracks attempts, not wins.'],pts:['Handshake before and after','Count moves attempted','Rotate opponents','Praise effort in both roles'],chart:'duel'}
 ],
 drills:[
