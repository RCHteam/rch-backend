  ['Three Moves at the Cone',8,'Pairs','15 x 15 yd','Balls, cones','Players practice the shoulder fake, inside hook and drag back at a cone, each followed by a burst.','Fake, then burst','Add a passive defender; choose the move at the cone','Forgetting the burst: call zoom'],
  ['Side-Step Slalom Defending',8,'Pairs','15 x 10 yd','Cones','The attacker zigzags without a ball between two lines of cones. The defender stays in front, side-on, and tries to touch the attacker’s hip only on the last cone.','Low, quick side steps','Add a ball; the attacker changes pace','Crossing feet: shuffle, do not cross'],
  ['Block Tackle Wall',8,'Pairs','10 x 10 yd','1 ball per pair','The coach shows the tackle on a still ball, then slow-roll. Pairs practice taking turns tackling.','Foot like a wall','Live ball with partner; light speed','Reaching in: cue wait'],
  ['1 v 1 Ladder',15,'Pairs','Several grids 8 x 5 yd','Balls, small goals','Winners move up a grid; losers move down. 30-second rounds with a handshake.','Brave and kind','Add a bonus for a move attempted','Bad losers: remind of the handshake'],
  ['Recover and Go',8,'Pairs','20 x 10 yd','Balls, 2 goals','The attacker starts a step ahead. The defender recovers and tries to win the ball, then goes the other way.','Get goal-side; win and go','Defender starts further back','Giving up: praise the chase'],
  ['Win and Go Game',6,'3 v 3','20 x 15 yd','4 goals, bibs','Play 3 v 3; points for a goal within five seconds of winning the ball.','Win and go','Add a bonus for a recovery run','Rushed shot: ask what they saw']
 ],
 faults:[['Defender dives in','Excitement','Cue wait; practice the jockey'],['Attacker stops at the defender','Hesitation','Practice the burst after the move'],['Tackle fouls','Reaching or sliding','Block tackle with the inside only; no sliding'],['Child avoids duels','Fear of losing','Match opponents; use handshake rituals'],['Defender gives up when beaten','Low resilience','Praise the recovery run']],
 check:'Child attempts three moves, delays an attacker for 3 seconds and wins and goes after a safe tackle.'
},
{
 n:9, title:'Combinations: 2 v 1, 2 v 2, 3 v 2', short:'Combinations',
 lead:'Two players working as one. This chapter is new in 1st grade: draw a defender and pass, take the give-and-go further, run past a teammate (the overlap), use width and move to a free space in 3 v 2.',
 builds:[4,6,8], focus:{Technical:4,Physical:3,Psychological:4,Social:5},
 grew:{pre:'New idea. Kindergarten met a simple give-and-go in chapter 6 and support at an angle, and played 3 v 1 keep-away, but never worked on combinations as their own topic.',k:'NEW. Players draw a defender and pass, play wall passes, overlap, use width and find the free player in 2 v 1, 2 v 2 and 3 v 2. The numerical advantage becomes something children can create and use.'},
 dev:'Between 6 and 8 children shift from mostly thinking about themselves to caring more about others (CDC). Cooperative play with a shared aim becomes possible. Soccer use: two or three players can now agree on a plan, and a pass that helps a friend feels better than a goal alone.',
 basis:[['CDC6','Children begin to care more about others and teamwork.'],['USS','2 v 1 and 2 v 2 are small-sided formats named for the youngest age groups.'],['USPDI','Four-a-side games with up to four players per side create many chances to combine.'],['FIFA','Small-sided games produce many contacts and decisions.']],
 game:'3 v 2 to Goal: attackers score a bonus point for any goal that came from a pass after drawing a defender.',
 objectives:['Draw a defender toward you, then pass to the free teammate','Play a wall pass (give-and-go) and run into the space behind the defender','Overlap: run past a teammate who has the ball and receive in space','Use width in a 3 v 2 by spreading and finding the free player'],
 outcomes:['Scores in 3 of 6 attempts in a 2 v 1','Plays a wall pass and runs past the defender','Calls “Overlap” and runs outside the ball carrier','Chooses the free player in 4 of 6 attempts in a 3 v 2'],
 concepts:[['Coach term / child language',[['Draw the defender','"Make them come to me"'],['Wall pass','"Give it and go"'],['Overlap','"Run around my friend"'],['Width','"Stay wide, make space"'],['Free player','"Who has no defender?"'],['Numbers up','"We have more players"'],['Support angle','"Be a triangle"']]]],
 why:'The main idea is that two attackers against one defender can always do something the defender cannot stop: if the defender goes to the ball, pass; if the defender stays, dribble or shoot. Seven-year-olds can discover this in a few minutes of play. It is the first tactical idea built from the rest of the program: dribbling, passing, receiving and shooting all appear in it.',
 details:[
  {h:'The 2 v 1 rule',p:['In a 2 v 1 the defender has two choices: stop the ball carrier or cover the passing lane. The ball carrier dribbles at the defender (to draw them), then passes to the free player. This is the most important idea of the chapter and it is just one sentence: “Draw the defender, then pass.”','Let children discover it. Start with a big space and a passive defender. Ask: “What did the defender do? What did your teammate do?” Then raise the pressure.'],pts:['Dribble at the defender','Pass when the defender commits','The free player moves to be an option','Shoot if the lane is open'],scene:'twovone'},
  {h:'Wall pass and overlap',p:['The wall pass (give-and-go) from chapter 6 is the first combination. The overlap is the second: the ball carrier keeps the ball while a teammate runs around them on the outside, receiving a pass in space. Both end with a run past the defender and a ball in front of the runner.','Teach the overlap with a call: “Overlap!” The ball carrier knows to wait for the run. This is a good first use of calling in a game.'],pts:['Run past, not stop','Ball in front of the runner','Call “Overlap!”','Wait for the run'],scene:'overlap'},
  {h:'Using width',p:['Width means standing wide to pull defenders apart and make space in the middle. A 3 v 2 with players spread in a triangle gives the attackers a free player almost every time.','Introduce width with a simple question: “Where is the empty grass?” Two players stay wide and one stays high; the defenders cannot cover all three. This also links to the thirds idea.'],pts:['Stand wide at the start','Move to a free space when the ball moves','Triangle shape','Ask: where is the empty grass?'],scene:'threevtwo'},
  {h:'3 v 2: find the free player',p:['In a 3 v 2, the free player is the one whose defender is busy. The ball carrier looks (scan) and passes to the free player. The free player then has time to dribble, pass or shoot.','Start with two defenders who can move only within a zone each (passive). Then let them move freely. Praise the look-up as well as the pass.'],pts:['Look before passing','Pass to the free player','Move after passing','Shoot when open'],scene:'threevtwo'},
  {h:'2 v 2: attack together, defend together',p:['In a 2 v 2, the attackers use the 2 v 1 rule and the defenders must also work together: one closes the ball, the other covers behind. This is the first time both sides meet the idea of balance.','Let children play with small goals. Pause to ask: “Who closed, who covered?” This links to chapter 11.'],pts:['Attackers: draw and pass','Defenders: close and cover','Rotate roles often','Ask questions at pauses'],chart:'combo'}
 ],
 drills:[
  ['2 v 1 Draw and Pass',8,'Groups of 3','15 x 12 yd','Balls, small goal','Two attackers vs one defender to a small goal. The carrier dribbles at the defender then passes; the receiver shoots.','Draw, pass, shoot','Defender starts closer; the carrier must decide','Passing too early: dribble at the defender first'],
  ['Wall Pass Runs',8,'Groups of 3','15 x 12 yd','Balls, cones','The passer plays to a wall player (cone or teammate), runs past a defender cone and receives in space.','Pass, run past, receive','Add a live defender; make the wall pass first-time','Stopping after the pass: keep running'],
  ['Overlap Lane',8,'Groups of 3','25 x 10 yd','Balls, cones','The ball carrier dribbles along a lane while a teammate runs around the outside. Pass in front, then shoot or cross.','Call “Overlap”; wait for the run','Add a defender; change sides','Ball carrier plays too early: wait'],
  ['3 v 2 to Goal',15,'5 players','25 x 20 yd','Goal, bibs, balls','Three attackers vs two defenders to a goal. Bonus point if a goal comes after a pass that drew a defender.','Scan, pass to the free player','Add a third defender coming from behind','Stuck on the ball: reward passing'],
  ['2 v 2 Corners',8,'4 players','15 x 15 yd','Small goals','2 v 2 with four small goals. Both teams use the 2 v 1 idea.','Draw and pass; close and cover','Add a rule: pass before shooting','Over-dribbling: cue the free player'],
  ['Width Triangle',6,'Groups of 3','20 x 15 yd','Cones, balls','Three players stay in a triangle; the ball moves around while defenders try to intercept. Players move to keep the triangle wide.','Wide triangle; move when the ball moves','Add a second ball; add a defender','Bunching up: use cones to mark the corners']
 ],
 faults:[['Passes before the defender commits','Eager to pass','Dribble at the defender first'],['Receiver stands still','Waiting','Cue: move to a free space'],['Overlapper stops behind the ball','Uncertain of the run','Use a call and a clear lane'],['Both attackers run to the ball','Chasing','Mark triangle points; cue stay wide'],['Defender watches the ball only','Tunnel vision','Ask: who is free?']],
 check:'Child draws a defender and passes in a 2 v 1, runs past after a wall pass and finds the free player in a 3 v 2.'
},
{
 n:10, title:'Game Intelligence: Seeing and Deciding', short:'Seeing & Deciding',
 lead:'Looking before acting. This chapter is new in 1st grade. Players learn a three-step scan routine, use shape and color cues, make if-then decisions and answer coaches’ questions about what they saw.',
 builds:[4,5,9], focus:{Technical:3,Physical:2,Psychological:5,Social:4},
 grew:{pre:'New idea. Kindergarten used a photo look and a peek before receiving, and a few if-you-see cues, but did not treat seeing and deciding as its own topic.',k:'NEW. Players learn a scan routine (look before, look during, look after), read shape and color cues, use if-then decision rules and answer questions that teach. The goal is a habit of looking, not memorizing tactics.'},
 dev:'Working memory, attention and the ability to describe thoughts are all growing (CDC: mental skills develop rapidly; children describe experiences better). Following a moving ball and several players at once is still maturing. Soccer use: short, simple cues and a few things to look for at a time.',
 basis:[['SCAN','A study of high-level youth players found that more head turns before receiving the ball predicted faster passing. This is evidence from older players, so we use it as a guide for the habit, not a promise.'],['CDC6','Mental skills develop rapidly; children describe thoughts and experiences better.'],['FIFA','Small-sided Funino-style games create many decisions per minute (expert perspective).'],['FA','Plan, Do, Review and questions that make players think.']],
 game:'Shape Bibs: bibs of two colors; the ball carrier must pass to the other color if a defender is close, and dribble if not.',
 objectives:['Use the scan routine: look before, look during, look after','Make a simple decision using an if-then cue','Name what you saw after a play (space, teammate, defender)','Answer a coach’s question with a short sentence'],
 outcomes:['Peeks before receiving in 6 of 10 passes','Chooses dribble, pass or shoot using a cue','Names the open space after a play','Answers “What did you see?” in one sentence'],
 concepts:[['Coach term / child language',[['Scan','"Look around like an owl"'],['Cue','"If I see this, I do that"'],['Decision','"Pass, dribble or shoot?"'],['Space','"The empty grass"'],['Pressure','"A defender close to me"'],['Open','"Nobody near me"'],['Question','"What did you see?"']]]],
 why:'Good players are not only fast, they see early. Seven-year-olds can learn a looking habit if it is made into a game. When children look and then decide, they play better, and when the coach asks questions instead of giving orders, they remember what they discover.',
 details:[
  {h:'The scan routine',p:['The routine has three parts: look before the ball arrives (peek), look while you have it (touch, touch, look) and look after you pass (where to go next). Teach one part at a time. Research on youth footballers links more head turns before receiving with faster passing, so the habit has a good reason.','Use a game: a coach holds up fingers behind the receiver. The receiver peeks, calls the number and controls. After a month, add a second call for color.'],pts:['Peek before the ball arrives','Look between touches','Look again after the pass','Call what you saw'],scene:'scan'},
  {h:'Cues and if-then rules',p:['Children cannot hold a full tactical plan, but they can hold a rule: “If there is empty grass, dribble. If a friend is open, pass. If I can see the goal, shoot.” These rules turn watching into doing.','Post the cues on a card. Use them in small games and ask afterward: “Which rule did you use?” Let children add their own rule.'],pts:['Three rules at a time','Post a cue card','Ask which rule was used','Let children add a rule'],scene:'colors'},
  {h:'Shape and color games',p:['Colored bibs and shapes make decisions visible. In Shape Bibs, the ball carrier must pass to the other color when a defender is near. In Color Call, the coach shouts a color and players must find a teammate of that color.','Games like these train the eyes and the brain without a lecture. Keep the rule simple and change it every few minutes.'],pts:['One rule per game','Change the rule often','Use two colors only','Ask: what did you see?'],scene:'colors'},
  {h:'Decision games',p:['A decision game puts a child in a situation with more than one good answer. For example, a 2 v 1 where the ball carrier can dribble, pass or shoot. There is no single correct answer. The coach’s role is to ask, not to dictate.','Aim for a quick pace: many decisions in a short time. Four-goal games give plenty of decisions per minute and are a good home for this chapter.'],pts:['Many decisions, short time','More than one good answer','Praise a clear choice','Coach asks questions'],scene:'funino'},
  {h:'Questions that teach',p:['Coaching by questions is a skill. Ask open questions: “Where was the space?”, “Who was open?”, “What did you see before you got the ball?” Wait three seconds for an answer.','Avoid “why did you not pass?” which sounds like blame. Use “what else could you try?” Questions also help the coach learn how the child sees the game.'],pts:['Open questions','Wait three seconds','No blame words','Let a child answer for the group'],chart:'scan'}
 ],
 drills:[
  ['Owl Eyes',8,'Groups of 3','15 x 10 yd','Balls, cones','Passer plays to a receiver; a third player behind holds up fingers. The receiver peeks, calls the number and controls the ball.','Peek early; call the number','Add color; add a defender cone','Peeking late: slow the pass'],
  ['Cue Card Game',8,'Groups of 4','20 x 15 yd','Balls, cones','Players dribble in a zone. When the coach shows a cue card (empty grass, friend open, goal), players act on it.','If I see this, I do that','Change the cards fast; players invent a card','Wrong cue: show it again'],
  ['Color Call',8,'Groups of 6','20 x 20 yd','Bibs, balls','Players dribble. The coach calls a color; players find a teammate in that color and pass.','Look up; find your color','Add a second color; pass first time','Chasing the ball: spread out'],
  ['Shape Bibs Game',15,'4 v 4','30 x 20 yd','Bibs (two colors per team), goals','Each team wears two colors. If a defender is close, the carrier must pass to the other color; if not, dribble or shoot.','Scan; use the cue','Add a bonus for a goal after a scan','Slow play: add a time limit'],
  ['Question Pause Game',8,'3 v 3','20 x 20 yd','4 goals','Play 3 v 3. Freeze the game twice; ask what players saw. Restart from the same spot.','Look; answer in a sentence','Ask a child to be the questioner','Long answers: use thumbs-up/down first'],
  ['Spot the Space',6,'Groups of 6','20 x 20 yd','Balls, cones','Players dribble. On freeze, they point to the biggest empty space and say a color of the nearest cone.','Find the biggest space','Dribble there and shoot','Everyone points at the same space: split']
 ],
 faults:[['Eyes stay on the ball','Habit, fear','Touch, touch, look; practice in place'],['Child says “I don’t know”','Question too big','Ask a smaller question; give two choices'],['Child freezes with options','Overload','Cut to two options'],['Looks but does not act','No decision rule','Add a cue: empty grass means go'],['Coach talks too much','Habit','Count questions; aim for more questions than statements']],
 check:'Child peeks before receiving, uses a simple cue to choose dribble, pass or shoot and names what they saw.'
},
{
 n:11, title:'Team Play: Shape, Roles and Transitions', short:'Team Play',
 lead:'Playing as a team. First graders play front, middle and back jobs that rotate, switch quickly between attack and defense, make restarts into plays and enjoy ladder match days.',
 builds:[1,8,9,10], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'Kindergarten spread out, supported at an angle, formed a triangle, closed down with a helper and rotated roles in 3 v 3 and 4 v 4.',k:'1st grade uses front, middle and back jobs that rotate, switches from attack to defense and back (transition), plays throw-ins and kick-ins as small plays, and enjoys ladder match days. Roles stay flexible; there are no fixed positions.'},
 dev:'Children care about friends and teamwork (CDC) and can hold a simple role in mind during play. They cannot yet manage long tactical plans. Soccer use: three jobs in 3 v 3 and four in 4 v 4, switched often, with the focus on helping each other.',
 basis:[['DFBR','German F-Jugend games: 3 v 3 (no goalkeeper) or 5 v 5 with rotation; rounds of up to 10 to 12 minutes; no table or referee at the youngest ages.'],['USPDI','U.S. Soccer’s 4 v 4 format for U7 and U8: 25 to 35 yards by 15 to 25 yards, no goalkeepers, quarters of 10 minutes.'],['USYS','Scramble teams so children play with and against different peers.'],['CDC6','Teamwork and friendships matter more in middle childhood.']],
 game:'Ladder Match Day: 4 v 4 games on several fields, winners move up, losers move down, every round is short.',
 objectives:['Play front, middle and back jobs and rotate them','Switch from attack to defense within three seconds of losing the ball','Take a throw-in or kick-in as a small play','Play a ladder match day with fair play and no standings'],
 outcomes:['Rotates through every job in a practice','Reacts to a lost ball within three seconds','Chooses a short play at a restart','Shakes hands and shows fair play after each match'],
 concepts:[['Coach term / child language',[['Front, middle, back','"Scorer, helper, guard"'],['Rotate','"Swap jobs"'],['Transition','"Switch fast"'],['Restart play','"Our plan for the throw-in"'],['Ladder','"Move up or down"'],['Shape','"Triangle or diamond"'],['Fair play','"Handshake, thanks"']]]],
 why:'Team play at this age is not a formation but a set of jobs and a speed of thought. Children who learn to switch fast and help each other become players who read the game. Rotating jobs prevents early specialization and gives every child experience in every role.',
 details:[
  {h:'Front, middle, back',p:['In a 3 v 3 or 4 v 4, there are three jobs: front (scorer), middle (helper) and back (guard). The jobs are described by what to do, not by position. The middle helps in attack and defense. The back protects the goal. The front tries to score.','Rotate jobs every few minutes, or after every goal in the DFB tradition. This builds understanding of what each job needs.'],pts:['Three jobs, three words','Rotate often','Describe by action, not position','Praise helping'],scene:'shapes'},
  {h:'Transition: switch fast',p:['The moment the ball changes sides is the most important moment of a game. When the team wins the ball, go. When the team loses it, defend at once. Teach it as a call: “Switch!”','Practice with a 3 v 3 where a goal within five seconds of winning the ball counts double. The same practice is used in chapter 8 with 1 v 1.'],pts:['Win it, go','Lose it, defend at once','Call “Switch!”','Praise the first three seconds'],scene:'transition'},
  {h:'Restarts as plays',p:['Throw-ins and kick-ins are chances for a small plan. A simple plan: one player takes the restart, one moves away from the defender to receive, one stays back. Children can invent the plan.','In German children’s games, the opponent restarts an out-ball with a dribble or pass from the side. U.S. Soccer’s 4 v 4 uses kick-ins at some levels. Follow your league’s rule and teach the plan within it.'],pts:['One takes, one moves, one stays','Children invent the plan','Follow your league’s restart rule','Practice in mini-games'],scene:'throwin'},
  {h:'Formats and match days',p:['At this age the best games are small: 3 v 3 or 4 v 4. The DFB uses 3 v 3 with four small goals and rounds of up to 10 minutes; U.S. Soccer’s 4 v 4 uses 25 to 35 yards by 15 to 25 yards with no goalkeepers. Both use frequent rotation and no standings.','A ladder match day means several fields and short rounds. Winners move up, losers move down, so every team plays teams of similar level. Keep the score light and play many rounds.'],pts:['3 v 3 or 4 v 4','Short rounds','Winners up, losers down','No league table'],scene:'matchday'},
  {h:'Team spirit and fair play',p:['Fair play includes handshakes, thanking the referee or game leader and helping an opponent up. The coach models it and celebrates it. Team spirit grows when each child is named and praised for helping.','The relative age effect is a reminder to rotate teams, mix pairs and not read too much into early success.'],pts:['Handshake after every round','Thank the game leader','Rotate teams','Praise helping'],scene:'circle'}
 ],
 drills:[
  ['Three Jobs Game',8,'3 v 3','25 x 20 yd','4 goals, bibs','Each player gets a job card (front, middle, back). Rotate after each goal.','Know your job; help','Add a fourth job (keeper-helper)','Forgetting the job: card on chest'],
  ['Switch!',8,'3 v 3','25 x 20 yd','4 goals, bibs','On the coach’s “Switch!” the ball becomes live for the other team. Teams must change from attack to defense at once.','React in 3 seconds','Players call “Switch!”','Slow reaction: shorter space'],
  ['Restart Plays',8,'Groups of 3','Open area','Balls, cones','Design and practice a kick-in or throw-in play: one takes it, one moves, one stays.','One takes, one moves, one stays','Invent a second play','Everyone runs to the ball: use cones'],
  ['Ladder Match Day',15,'4 v 4','Several 30 x 20 yd fields','4 goals per field, bibs','Rounds of 4 minutes. Winners move up a field, losers down. Handshake after every round.','Play your job; fair play','Add a bonus for a switch goal','Winning pressure: no table'],
  ['Diamond Rotation',8,'Groups of 4','15 x 15 yd','Balls, cones','Four players keep the ball in a diamond (back, two sides, front). After each pass the passer moves to the next point, so jobs rotate.','Move after the pass; keep the diamond wide','Add a defender in the middle','Standing still: call the rotation'],
  ['Team Cheer Round',6,'Teams of 4','Open area','None','After a match round, each team names two good things it did and gives a cheer for the other team.','Be positive','Choose a captain of the cheer','Silly cheers: set a limit']
 ],
 faults:[['All players chase the ball','Eager','Assign jobs and use cones for the back'],['Everyone stays in one job','Comfort','Rotate by a visible card'],['Slow transition','Watching','Call “Switch!”; praise the first three seconds'],['Match-day pressure','Adults and winning','Remind adults of the no-standings approach'],['One child takes all restarts','Dominance','Rotate the job by a card']],
 check:'Child plays every job in a match, switches within three seconds and shows fair play after each round.'
},
{
 n:12, title:'Goalkeeper', short:'Goalkeeper',
 lead:'Every child tries the gloves. First graders learn the set position and angles, catch with a W, dive and recover, distribute by rolling and throwing, and see how a goal child works in 4+1.',
 builds:[2,5,7], focus:{Technical:5,Physical:4,Psychological:4,Social:3},
 grew:{pre:'Kindergarten learned the ready position, stopped slow shots, caught tosses, fell to the side from the knees and rolled the ball to a target.',k:'1st grade sets a ready position and moves a little to match the ball, catches with the W-shape of the hands, dives and recovers, rolls and throws to a teammate and learns that the goalkeeper is also a player who starts the next attack.'},
 dev:'Catching with the hands is easier at 6 to 8 (CDC), reaction time and balance improve and children can learn to be brave. Soccer use: every child tries goalkeeper without pressure, and the role rotates so nobody is stuck in goal. Both US Youth Soccer and U.S. Soccer say goalkeepers should not be permanent at this age.',
 basis:[['USPDI','U7 and U8 games are 4 v 4 with no goalkeepers.'],['DFBR','In German F-Jugend 5 v 5, a goalkeeper is optional and changes each round; in 3 v 3 there is none.'],['CDC6','Catching and ball skills improve between 6 and 8.'],['USS','Goalkeeping basics are included for young players; every child should try.']],
 game:'Goalkeeper Games: shooters try to score on a keeper who rotates every two minutes; keepers earn a point for a catch and a point for a good throw.',
 objectives:['Take a ready position and a step toward the ball','Catch with a W-shape of the hands','Dive to the side and get up quickly','Roll or throw the ball to a teammate'],
 outcomes:['Stops 8 of 10 shots from 8 yards','Catches 6 of 10 chest-high shots with hands in a W','Dives to the side from a crouch and recovers','Rolls to a target within 3 yards 4 of 5 times'],
 concepts:[['Coach term / child language',[['Ready position','"Ready like a tiger"'],['W catch','"Hands make a W"'],['Dive','"Fall to the side, ball first"'],['Set','"Stop and get ready"'],['Rolling out','"Underhand to a friend"'],['Angle','"Stand between ball and goal"'],['Brave','"Face the ball"']]]],
 why:'Goalkeeping is a good way to practice bravery, catching and focus. Children who feel safe will try it. The key is to rotate the role and to praise attempts, not just saves. A keeper who starts the attack by rolling or throwing is a team player.',
 details:[
  {h:'Ready position and angles',p:['The ready position: feet shoulder-width apart, knees bent, weight on the balls of the feet, hands in front. The keeper steps toward the ball to cut the angle, staying between the ball and the goal. A step forward at the right time makes the goal look smaller.','Teach it with a rope or line: the keeper stands on a line one step off the goal line. When the ball moves, the keeper shifts to stay in the middle of the angle.'],pts:['Feet apart, knees bent','Hands in front','Step toward the ball','Stay between ball and goal'],scene:'setpos'},
  {h:'Catching with a W',p:['The W-catch is hands forming a W with thumbs close together for balls above the waist, and hands scooped with little fingers together for low balls. The ball is hugged into the chest after the catch.','Start with throws from a partner at chest height, then low and then high. Praise the shape of the hands, not only the catch.'],pts:['W for high balls','Scoop for low balls','Hug the ball into the chest','Use a soft ball first'],scene:'keeper'},
  {h:'Dive and recover',p:['Diving starts from a crouch. The keeper falls to the side, hands first, on the arm and hip, not the elbow. After the save, the keeper gets up and is ready for the next ball.','Do the dive on soft ground and from the knees first. The cue is “fall to the side, ball first, then up”. No child should be forced to dive.'],pts:['From a crouch or knees','Hands first, then side','Get up quickly','Soft surface'],scene:'dive'},
  {h:'Distribution',p:['A keeper’s save is often the start of an attack. Teach rolling out underhand to a teammate at 5 to 8 yards and an overarm throw for longer distance. Aim for the teammate’s feet or space.','Praise the roll as much as the save. A good distribution turns a defensive moment into a chance.'],pts:['Underhand roll for short passes','Overarm throw for distance','Aim at feet or space','Look up before releasing'],scene:'gkthrow'},
  {h:'The goal child in 4+1',p:['In some German children’s games a team plays four field players plus a goalkeeper or “goal child”, with the goalkeeper rotating each round. The goal child is a full part of the team and plays without the pressure of being the last line. In U.S. 4 v 4 games there are no keepers.','Use 4+1 or a similar format in practice so every child tries the role. Rotate every few minutes and praise courage, not saves.'],pts:['Rotate each round','Goal child is part of the team','Praise attempts','Check your league’s format'],chart:'gk'}
 ],
 drills:[
  ['Ready Position Tour',8,'Groups of 4','Goal','Balls, cones','Keepers practice the ready position and shuffle to follow a rolling ball between two cones.','Feet apart, knees bent, hands in front','Add a step forward; either side','Standing upright: cue knees'],
  ['W Catch',8,'Pairs','10 yd lane','Soft balls','Partner tosses to chest height. Keeper catches with a W and hugs the ball.','Hands in a W; hug','Higher, lower, to the side','Dropping the ball: use softer balls'],
  ['Dive and Recover',8,'Pairs','On soft ground','Balls, mat or grass','From knees, the keeper falls to the side to a rolled ball and gets up.','Fall to the side, ball first','From a crouch; add a second ball','Fear: start from knees'],
  ['Goalkeeper Games',15,'4 v 4','Small field with goals','Goals, bibs','Shooters try to score; keepers rotate every two minutes. Keepers earn a point for a catch and a point for a good throw.','Be brave; roll or throw','Add a second shooter','Keeper stuck in goal: rotate by card'],
  ['Roll and Throw Targets',8,'Pairs','15 x 10 yd','Cones, balls','Keeper rolls or throws to a target cone or a teammate in a gate.','Aim, step, release','Longer distance; moving target','Wild throws: shorter distance'],
  ['Goal Child 4+1',6,'5 v 5','25 x 20 yd','Goals, bibs','Four field players plus a goal child per team. The goal child rotates every round.','Everyone gets a turn','Add a bonus for a keeper start','Pressure on the keeper: no blame']
 ],
 faults:[['Keeper stands tall','Habit','Cue knees bent; weight forward'],['Drops the ball','Hands not in W','Use soft balls; check the hand shape'],['Afraid to dive','Fear of falling','Start from knees on soft ground; never force'],['Wild distribution','Rushing','Shorter distance; aim at a target'],['Same child always in goal','Willingness','Rotate by card; no permanent keepers']],
 check:'Child sets a ready position, catches with a W, dives from a crouch and rolls to a teammate.'
}

 ['Personal Best Pyramid',12,'Pairs','15 x 15 yd','Balls, cards, pencils','Each child picks one skill (touches, balance, cones) and records three tries. Partners watch for effort, not score, and mark the best try.','Compare with yourself','Write a plan: “next time I will…”; test it at the next practice','Peeking at the neighbor’s score: cover the cards',6,['pairs','Each child records three tries and circles their own best.']],

 ['Fair-Play Games Day',15,'4 v 4','30 x 20 yd','Cones, bibs','Teams play and earn a point for each fair-play act the other team sees (helping up, honest call, thanks). Goals earn nothing.','Notice good behavior loudly','Add a rule: the team with fewer fouls chooses the next game','Awarding points for friends only: ask who else helped',2,['smallgame','Teams earn points for fair-play acts, not goals.']],

 ['Number Reaction Cups',12,'Groups of 4','15 x 15 yd','Cones, number cards','Each player stands by a numbered cone. The coach calls a number and the player runs around that cone and back to a ready position.','Ready position; eyes on the coach','Call two numbers in order; add a ball touch at each cone','Moving before the call: reset and try again',4,['mirror','Players react to a called number and run around that cone.']],

<script>
// Merge the original six drills of each chapter with the exercise bank so that every practice has its own exercises.
// Result per chapter: 18 drills ordered [L1 skillA, L1 skillB, L1 game, L2 ..., L6 game]; DSCENE rebuilt in the same order.
(function(){
const CH=window.CHAPTERS,BANK=window.BANK||{},DS=window.DSCENE,out={};
const OLD_SKILL=[0,1,2,4,5],OLD_HINT=[1,1,2,3,4];
CH.forEach(c=>{
 const b=BANK[c.n];if(!b)return;
 const items=[];
 OLD_SKILL.forEach((oi,k)=>items.push({d:c.drills[oi].slice(0,9),lv:OLD_HINT[k],t:'s',sc:DS[c.n][oi]}));
 items.push({d:c.drills[3].slice(0,9),lv:1,t:'g',sc:DS[c.n][3]});
 b.forEach((x,i)=>items.push({d:x.slice(0,9),lv:x[9],t:i<7?'s':'g',sc:x[10]}));
 const drills=[],scenes=[];
 for(let l=1;l<=6;l++){
  const sk=items.filter(x=>x.lv===l&&x.t==='s'),gm=items.filter(x=>x.lv===l&&x.t==='g');
  [...sk.slice(0,2),...gm.slice(0,1)].forEach(x=>{drills.push([...x.d,l,x.t]);scenes.push(x.sc);});
 }
 c.drills=drills;out[c.n]=scenes;
});
window.DSCENE=out;
})();

</script>

const POOL=[0,1,2,4,5];
function session(s){
 const o=slot(s),c=CH[o.ch-1],l=o.level;

 const skillA=3*(l-1), skillB=3*(l-1)+1, gameI=3*(l-1)+2;
 const blocks=[];
 blocks.push({min:5,name:'Arrival and circle',how:'Greet each child by name, quick team chant, weather check, shin guards and water. Captains take their jobs. Tell the group the one idea for today: '+c.objectives[0].toLowerCase()+'.',focus:'Belonging and clarity',prog:'',watch:'Late arrivals: let them join the run start',scene:['circle','Circle up, greet, share the idea of the day.']});

 blocks.push({min:5,name:'Water and one idea',how:'Water break. Then demonstrate today\'s skill for two minutes and give one cue. Key words: '+c.concepts[0][1].map(k=>k[0]).slice(0,3).join(', ')+'.',focus:'One idea, one cue',prog:'',watch:'Keep the talk to two minutes',scene:null});
 blocks.push(drillBlock(c,skillA,l,12,'Play: skill play 1'));

 const du=DUEL[o.ch];
 {const F=FIN[l-1];blocks.push({min:10,name:'Duel finale: '+F[0],how:'Every practice ends with duels that grow with the level. '+(l>1&&F[1]!=='fin_1v1goal'?'Open with two minutes of 1 v 1 in pairs, then play today\'s format. ':'')+'Format: '+F[3]+' Grid: '+F[2]+'. Chapter twist ('+du[0]+'): '+du[1]+' In team formats the twist applies to the player on the ball.',focus:'Compete bravely and kindly; use today\'s skill under duel conditions',prog:F[4],watch:'Match players by size and confidence. No sliding, grabbing or pushing. Keep score light and praise effort.',scene:[F[1],F[0]+'. '+F[3]]});}
 blocks.push(closingBlock(s,6,'Ask three questions: what went well, what was tricky, and what is my own-best goal for next time?'));

 blocks[0].steps=[['Do','Greet each child by name. Check shin guards and water. Gather in a circle.'],['Say','Today we are working on this: '+c.objectives[0].toLowerCase()+'.'],['Watch for','Children who arrive late. Send them straight to the run.']];
 blocks[1].steps=[['Do',LAPS[l-1]],['Then','2 minutes of dynamic moves: '+DYN[o.ch]+'.'],['Say','Tall back, bent arms, light feet.'],['Watch for','Tired children can walk. Never use running as a punishment.']];
 blocks[2].steps=[['Do','Water break, about 1 minute.'],['Show','Demonstrate today\'s skill for 2 minutes. Keep your talking short.'],['Say','One cue only. Words for today: '+c.concepts[0][1].map(k=>k[0]).slice(0,3).join(', ')+'.']];
 blocks[5].steps.push(['Today\'s target',LT[o.ch][l-1]]);
 if(typeof GAMEVAR!=='undefined')blocks[5].steps.splice(4,0,['Game level',GAMEVAR[l-1]]);

 blocks[7].steps=[['Do','Gather in a circle. Share today\'s tip.'],['Tip',TP[0]+'. '+TP[1]],['Why it works',TP[2]],['End','High five each child by name, team chant, tell them when the next practice is.']];

function festival(k,day){

 } else {

  blocks.push({min:5,name:'Water',how:'Water break and short explanation of the games.',focus:'Rest',prog:'',watch:'',scene:null});

  blocks.push({min:15,name:'Parent and child game',how:'Parents join in simple games with their child: toe taps, 3 v 1 keep-away, and a scoring game.',focus:'Pride and connection',prog:'',watch:'Parents: encourage, do not coach',scene:['pairs','Parent and child pass.']});

 }
 let t=0;blocks.forEach(b=>{b.t=t+'-'+(t+b.min);t+=b.min;});
 return {s:'F'+k,festival:true,k,week:w,day,total:t,blocks,equip:'Cones, balls, bibs, small goals, assessment sheets, tally sheets, whistle, certificates',check:'Check: record Yes, Almost or Not yet for each skill.',chapter:null,term};
}
function toText(p){
 const head=p.festival?`Festival ${p.k}, week ${p.week}, ${p.day}`:`Session ${p.s}, week ${p.week}, ${p.day}. Chapter ${p.ch}: ${p.chapter.title}. Level ${p.level} (${p.levelName}). Target: ${p.target}`;

window.PLAN={LEVELS,LT,LAPS,DUEL,DUELPROG,GAMEVAR,TEACH,WEEKS,FEST,slot,session,festival,toText,N};
})();

<script>
(function(){
const CH=window.CHAPTERS, PL=window.PLAN, N=CH.length, LV=PL.LEVELS, LT=PL.LT;
const $=s=>document.querySelector(s);
const CORNERS=['Technical','Physical','Psychological','Social'];
let uid=0;const nid=()=>'x'+(++uid);

/* ---------- settings + schedule ---------- */

 const st=parseD(getStart());let d=new Date(st),i=0,g=0;const out=[];
 while(i<seq.length&&g++<900){const wd=d.getDay();if((wd===2||wd===4)&&!skip.has(iso(d))){out.push({...seq[i],date:new Date(d),iso:iso(d)});i++;}d.setDate(d.getDate()+1);}
 out.forEach(e=>{e.week=Math.floor((e.date-st)/(7*864e5))+1;e.dayName=e.date.toLocaleDateString('en-US',{weekday:'long'});e.dstr=e.date.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});});
 SCH=out;
}
const evP=s=>SCH.find(e=>e.kind==='p'&&e.s===s);
const evF=(k,day)=>SCH.find(e=>e.kind==='f'&&e.k===k&&e.day===day);
const chOf=e=>e.kind==='p'?CH[PL.slot(e.s).ch-1]:null;

/* ---------- charts ---------- */

 balance:['Planning target: single-leg balance','seconds',[10,12,14,15,16,18],'Illustrative targets for tracking a child against their own earlier results. Not age norms.'],
 touches:['Planning target: touches in 30 seconds','touches',[50,54,58,62,66,70],'Inside of the foot, one ball. Use for self-comparison only. Do not rank children.'],
 dribble:['Planning target: cones cleared with no stray touch','cones',[6,7,8,9,10,10],'Ten-cone zigzag, 1 yard apart, at a steady pace.'],
 control:['Planning target: passes controlled out of 10','of 10',[5,6,7,8,8,9],'Pass from 8 yards, controlled within one stride.'],
 pass:['Planning target: accurate partner passes out of 10','of 10',[5,6,7,8,8,9],'Partner 8 to 10 yards away, inside-foot pass.'],
 shoot:['Planning target: shots on target out of 10','of 10',[3,4,5,6,6,7],'Goal at 10 yards, still ball or short run-up, either foot.'],

 scan:['Planning target: peeks before receiving out of 10 passes','of 10',[3,4,5,6,7,8],'Coach counts visible head turns before the ball arrives. For self-comparison only.'],

};
function chartHTML(key){

 const labels=['L1','L2','L3','L4','L5','L6'],vals=c[2];
 const W=520,H=210,L=40,B=30,T=14,R=10,max=Math.ceil(Math.max(...vals)*1.15/2)*2;
 const bw=(W-L-R)/vals.length,y=v=>T+(H-T-B)*(1-v/max);let s='';
 for(let g=0;g<=4;g++){const v=max/4*g;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`;}
 vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,last=i===vals.length-1;
  s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" class="bar${last?' hi':''}" style="--d:${i*70}ms"/><text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" class="val${last?' hi':''}">${v}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="ax">${labels[i]}</text>`;});

/* ---------- small helpers ---------- */
const head=(eyebrow,title,lead,extra)=>`<header class="ph"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}${extra||''}</div></header>`;

 const t=iso(new Date()),nx=SCH.find(e=>e.iso>=t),nxt=nx?`<div class="next"><span class="eyebrow">Next practice</span><b>${nx.dstr}</b><span>${evTitle(nx)}${nx.kind==='p'?', Level '+evLevel(nx):''}</span><a class="btn pri" href="${nx.kind==='p'?'#/session/'+nx.s:'#/festival/'+nx.k+'/'+nx.day}">Open</a></div>`:'';
 return nxt+`<div class="hero"><div><div class="eyebrow">RCH Elite Training · 1st Grade · Ages 6 to 7</div><h1>Growing the Game</h1><p>Twelve chapters taught in rotation, starting at chapter 1. Every Tuesday and Thursday practice moves one chapter forward by a small step. After all twelve, the cycle returns to chapter 1 at a higher level. Each chapter builds on what the group learned in Kindergarten, and two new chapters (combinations and seeing and deciding) are added.</p><div class="stats"><div><b>12</b>chapters</div><div><b>6</b>levels</div><div><b>72</b>practices</div><div><b>75</b>min each</div></div></div><div id="hero-scene">${window.renderScene('funino',nid())}</div></div>
 <div class="cols3"><div class="card"><h4>Always start by running</h4><p>Every practice opens with running around the field and ends with a duel finale that grows by level: 1 v 1, then 2 v 1, 2 v 2, 3 v 2, 3 v 3 and finally teams with defenders.</p></div><div class="card"><h4>Mixed, not blocked</h4><p>No month of only dribbling. Each practice teaches one chapter, and the next practice teaches the next chapter.</p></div><div class="card"><h4>Six passes through the book</h4><p>Level 1 introduces each chapter. Levels 2 to 6 repeat it with more speed, less space, pressure and game play. Every chapter also links to how a 6 or 7 year old is developing.</p></div></div>
 <div class="rhythm"><h4>The cycle</h4><div class="cyc" aria-label="Chapter rotation">${CH.map(c=>`<a href="#/ch/${c.n}" title="${c.title}"><b>${c.n}</b><span>${c.short}</span></a>`).join('')}<i class="loop">back to 1, one level higher</i></div></div>
 <div class="rhythm"><h4>What grew since Kindergarten</h4>${tbl(['Chapter','In Kindergarten','Now, in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))}</div>`;

/* ---------- calendar ---------- */
let CAL=null;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function initCal(){
 const t=new Date();const f=SCH[0]?SCH[0].date:t,l=SCH.length?SCH[SCH.length-1].date:t;

  const d=new Date(y,m,r*7+c-off+1),k=iso(d),oth=d.getMonth()!==m;

}

const REM=[['Run start','Always start by running around the field, then dynamic moves.','run'],['75-minute practice','Water at minute 15 and mid-game. Always finish with 1 v 1. A ball for everyone in half the practice.','structure'],['Psychology','Praise effort, not talent. Offer small choices. One-sentence instructions.','psych'],['Safety','Check field and goals. Allow walking breaks. No heading. Watch heat and hydration.','safety']];
const firstSent=t=>t.split(/(?<=\.)\s/)[0];
function dayCard(e){

 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, skips, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','Opposite Lights (the old Traffic Lights game) is a chapter 2 exercise, not the run start','Shorten the laps in hot weather and keep water within reach'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. It follows the play, practice, play pattern and the FA’s plan, do, review loop.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, weather check, captain jobs, team chant, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Two-minute demonstration with one cue'],['20 to 32','Play: skill play 1','Chapter drill at the current level; explore and repeat'],['32 to 44','Practice: skill play 2','A second chapter drill with a progression'],['44 to 59','Play: game','Small-sided game that applies the idea; level rule from the plan'],['59 to 69','Duel finale','Always. 1 v 1 at first, growing to 2 v 2, 3 v 3 and defenders'],['69 to 75','Closing circle','A motivation and morale tip, a high five for every child by name, the team chant and the next practice']])+ul(['Aim for at least 70 percent ball-rolling time (the FA’s guide for coaches)','Change activity if children lose focus','Water at minute 15, at the middle of the game and at the end','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates','If energy is low, shorten skill play 2 and keep the duel finale'])],
 bridge:['From Kindergarten to 1st Grade','1st grade is built on the Kindergarten chapters. Kindergarten’s eleven chapters become ten (chapters 1 and 9 merge) and two new chapters are added, making twelve.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['Kindergarten','1st grade','What happened'],[['1 Team Environment and Routines, 9 Fair Play and the Referee','1 Team Culture, Leadership and Fair Play','Merged. The team agreement is written by the players; leader of the day replaces captain jobs; disputes use stop, say, solve'],['2 Movement and Agility','2 Athletic Movement','Grew: sprint starts, quick feet, reaction, landing, body-weight strength'],['3 Ball Mastery, 4 Dribbling','3 Ball Mastery, 4 Dribbling and Moves','Grew: sequences, tempo, speed dribbling, shielding while moving'],['5 Receiving, 6 Passing, 7 Shooting, 8 1 v 1','5 to 8 (same topics)','Grew: control at pace, 10-yard passing, instep and first-time finishing, block tackle and recovery'],['10 Team Play, 11 Goalkeeper','11 Team Play, 12 Goalkeeper','Grew: jobs that rotate, transition, restart plays, ladder match days, dive and distribute'],['(no chapter)','9 Combinations: 2 v 1, 2 v 2, 3 v 2','NEW: draw a defender and pass, overlap, width'],['(a peek and a few cues)','10 Game Intelligence: Seeing and Deciding','NEW: scan routine, if-then cues, decision games, questions that teach']])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Kindergarten','Now in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: leader of the day, restarts, stop-say-solve, a player-led game','Own-best goals replace comparison with other children','Seeing before doing: scan routine and questions that teach','Small combinations (2 v 1, 3 v 2) build team play from skills the children already have','Roles rotate and transitions become a habit','Every chapter links to how a 6 or 7 year old is developing (see the Development page)'])+`<h4 class="sp">Day-one checks for children arriving from Kindergarten</h4>`+ul(['Names the field thirds and follows the three signals','Balances on one foot for about 8 seconds','Links two or three ball moves on either foot','Passes with the inside of the foot at 8 yards','Attempts a move in a 1 v 1 and defends side-on','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Kindergarten','Use the first cycle (12 practices) as the baseline for everyone'])],
 develop:['How 6 and 7 Year Olds Develop','What is changing in the child, and what each change makes possible in soccer. This page links every chapter to child development.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, want to be liked, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others than only themselves. Physical skills grow quickly, and catching and ball skills become easier.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[['Friendship and belonging','Wants to be liked; picks friends; notices who is in or out','Team agreement, buddies, leader of the day, rotating partners','1, 9, 11'],['Comparing with others','Notices who is faster or better (Erikson’s industry versus inferiority; background knowledge)','Own-best cards; no rankings; praise effort','1, 8'],['Care for others','Moves from only me to also you','Passing into space, combinations, encouragers','6, 9, 11'],['Independence','Wants to do jobs alone','Leader of the day, player-led games, own warm-up','1, 2, 11'],['Working memory and attention','Can hold 2 or 3 things in mind; attention still short','Sequences of three or four moves; three cues at a time; short games','3, 10'],['Language','Can explain what happened','Questions that teach; stop, say, solve','1, 10'],['Speed and agility window','Quick gains in running, balance and coordination (LTAD: speed and suppleness windows)','Sprint starts, quick feet, landing, cuts','2, 4, 8'],['Hand and ball control','Catching and ball skills improve','W-catch, thigh control, first touch at pace','5, 12'],['Visual tracking','Following a moving ball and several players is still maturing','Peek before the ball arrives; short looks; calm drills first','5, 10'],['Resilience','Mistakes still sting; fear of failing in front of friends','Stop-say-solve, mistake of the day, praise for brave tries','1, 7, 8']])+`<h4 class="sp">Skill readiness map</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[['Sprinting and quick feet','10 to 15 yard sprints; low markers','Reaction starts from a ready position','Long runs; heavy loading'],['Ball control','Four-move sequences; control at 8 yards','Receive and turn; thigh control','Chest control; heading'],['Passing','Inside pass at 10 yards; lead a runner','Driven pass; outside foot','Long passes over 20 yards'],['Shooting','Instep with a locked ankle; first-time finish','Placement to a corner','Power shots from distance'],['Tactics','Draw and pass; free player; front, middle, back jobs','Overlap; scan routine','Fixed positions; formations'],['Goalkeeping','Ready position; W-catch; roll and throw','Dive from a crouch','Specialist keepers; punting']])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment, to be checked against your own group.</p>`],
 theory:['Game Ideas for Ages 6 to 7','Tactics are taught as simple ideas inside games, in the language children use. 1st grade adds combinations and a seeing-and-deciding routine.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, draw a defender and pass, overlap, find the free player, dribble into space or shoot. Chapters 4, 6, 7, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay goal-side, delay. Chapters 8 and 11.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and defend at once. Chapters 8 and 11.</p></div></div><p>These three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Numbers up</h4><p>In a 2 v 1 or 3 v 2, the attackers have one more player. The idea is simple: the defender cannot stop everything. Draw the defender, then pass to the free player.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A defender comes at you and a teammate is free','Draw and pass','9'],['A teammate is running past you outside','Overlap: pass in front','9'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use a move, then burst','8'],['They have the ball','Close the nearest player or cover','11'],['You win the ball','Go at once','8, 11']])+`<h4 class="sp">Jobs, not positions</h4><p>There are no fixed positions. Front, middle and back are jobs that rotate (scorer, helper, guard). Goalkeeper is a role that rotates. Formations are not taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball?','Which rule did you use: dribble, pass or shoot?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in 1st grade practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','1st grade setting','Source and note'],[['Players per team','3 v 3 or 4 v 4','DFB uses 3 v 3 (and 5 v 5) for F-Jugend (U8/U9); KNVB uses 4 v 4 for the youngest; U.S. Soccer’s 4 v 4 covers U7 and U8'],['Field size','About 25 x 20 yards (3 v 3) or 30 x 20 yards (4 v 4), up to 35 x 25','DFB 3 v 3: about 25 by 20 meters. UEFA newsletter 4 v 4: about 30 x 20 meters. U.S. Soccer: 25 to 35 yards by 15 to 25 yards for 4 v 4'],['Goals','Four small goals (3 v 3) or two goals with no keepers (4 v 4)','DFB: four mini goals no larger than 2.0 by 1.2 meters, scoring from inside a 6 meter shooting zone. U.S. Soccer: goals up to 4 by 6 feet'],['Ball','Size 3','Both sources'],['Goalkeepers','None in 3 v 3 and 4 v 4; every child tries the role in practice','DFB 3 v 3 has none; UEFA’s newsletter and U.S. Soccer 4 v 4 have none; in DFB 5 v 5 a goalkeeper is optional and changes each round'],['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 minutes (3 v 3) or 12 minutes (5 v 5); U.S. Soccer 4 v 4: four quarters of 10 minutes'],['Rotation','Rotate teams and jobs often','DFB: rotation after each goal in 3 v 3; fixed order every 3 minutes in 5 v 5'],['Referees','Coach as game leader; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],['Restarts','Kick-in or throw-in, restart from own end, free kick for hands, push or trip','DFB: opponent restarts an out-ball with a dribble or pass from the side. Follow your league and stay consistent'],['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down, with short breaks'],['Heading','Not used','U.S. Soccer age-group guidance']])+ul(['Laws taught: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake','If your league plays 7 v 7 with a goalkeeper at U9, introduce it gradually in 2nd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 6 and 7, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 6 and 7','How we train it','Chapters'],[['Speed','A key trainable window; short bursts only','10 to 15 yard sprints from varied starts with full rest','2, 4, 8'],['Agility','Plant-and-push and quick changes are improving','Cut gates, reaction tag, 1 v 1','2, 8'],['Coordination','Quick feet and rhythm are developing','Low markers, sequences, juggling','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, landing stations','2, 12'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start and the warm-up','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: animal walks, hops, squats','Animal power circuit','2'],['Reaction','Improving','Signal games, ready position','2, 12']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage of about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>Structured warm-up programs have been studied in youth soccer, but the strongest research is in older age groups. We use a short, player-led dynamic warm-up as sensible practice, and we keep landing, balance and body-weight strength in every cycle.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Seven ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Younger players valued a coach who lets them play different positions more than older players did. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 6 and 7, children start to notice who is faster or better. Erikson called this stage industry versus inferiority (background knowledge): children who feel capable gain confidence, and those who feel behind may lose it. Protect every child: use own-best cards, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two- or three-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Switch! and changing the rule every few minutes practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence is mixed, so treat this as a design guide rather than a promise.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)','Ask questions more than giving answers'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my own-best goal for next time?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay short (10 to 15 yards) with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week 26'],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],
 assess:['Assessment','Record Yes, Almost or Not yet at each festival (weeks 13, 26 and 39), plus a baseline in week 1. Assess inside normal games and do not rank children.',()=>tbl(['Chapter','Check','Wk 1','Wk 13','Wk 26','Wk 39'],CH.map(c=>[c.n+'. '+c.short,c.check,'','','','']),'grid-t asm')],
 next:['Looking Ahead to 2nd Grade','The next curriculum extends this base.',()=>`<p>2nd grade deepens the same chapters: longer passing patterns, more combinations, more team shape, more decisions and game rules, and the first moves toward larger formats such as 7 v 7. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in small-sided formats','Players take on more of the planning and the review','A first goalkeeper-specific block can be added for children who want it'])],

const GORDER=[['run','Run start'],['structure','75-minute practice'],['bridge','From Kindergarten'],['develop','Child development'],['theory','Game ideas'],['formats','Rules and formats'],['body','Body and growth'],['psych','Psychology'],['review','Plan, Do, Review'],['safety','Safety'],['team','Team chemistry'],['parents','Parents'],['assess','Assessment'],['next','Next grade'],['sources','Sources']];
function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

/* ---------- shell ---------- */
$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">1st Grade Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchg1-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchg1-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchg1-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CAL&&(CAL.sel!==null||CAL.panel)){CAL.sel=null;CAL.panel=null;if($('#drawer'))renderCal();}});
const th=$('#theme');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchg1-theme',t);}catch(e){}}
th.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark');});
try{const t=localStorage.getItem('rchg1-theme');if(t)setTheme(t);}catch(e){}
route();
})();
