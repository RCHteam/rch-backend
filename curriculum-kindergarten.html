},
{
 n:8, title:'1 v 1 Attack and Defend', short:'1 v 1',
 lead:'1 v 1 is the heart of the program and the finale of every practice. Attackers learn two moves and a change of pace; defenders learn to approach, slow down, stay side-on and win the ball safely.',
 builds:[4,5,7], focus:{Technical:4,Physical:3,Psychological:4,Social:3},
 grew:{pre:'Pre-K faked at a cone, stayed goal-side and switched from attack to defense.',k:'Kindergarten adds a second move, the change of pace, jockeying, forcing the attacker to one side and win-and-go transitions.'},
 basis:[['USS','1 v 1, 2 v 1 and 2 v 2 are the core game formats at this age.'],['KNVB','1 v 1 is central to technical development for young players.'],['FA','Stay on the ball in a 1 v 1; teach shielding and release.']],
 game:'1 v 1 Ladder: pairs duel in small grids; winners move up one grid, losers move down.',
 objectives:['Perform two moves (a shoulder fake and an inside-outside cut) and accelerate','Defend by approaching quickly, slowing down and staying low and side-on (jockeying)','Force the attacker to one side and win the ball safely with a poke','After winning the ball, attack the other way at once (win and go)'],
 outcomes:['Attempts to beat a defender in every 1 v 1','Stays on feet when defending','Switches from attack to defense within two seconds','Accepts winning and losing duels with kindness'],
 concepts:[['Coach term / child language',[['Move','"A trick"'],['Gear shift','"Slow, then zoom"'],['Jockey','"Dance backward"'],['Delay','"Slow them down"'],['Force','"Send them to the side"'],['Safe poke','"Tap the ball, not the leg"'],['Win and go','"Steal it, then go the other way"']]]],
 why:'One-versus-one duels introduce competition, and children respond differently. Some love the duel from the first minute; others find it stressful. The best 1 v 1 environment is brave and kind: clear contact rules, matched pairs, short duels and a fresh opponent every two minutes. Results matter less than the number of attempts. Children who attempt moves more often get better faster.',
 details:[
  {h:'Two moves and a gear shift',p:['A move works because of the change of pace after it, not because the fake is fancy. Kindergarten players learn two: the shoulder fake (drop a shoulder one way, take the ball the other) and the inside-outside cut (the ball moves across the body with the inside, then the outside pushes away).','After either move, accelerate for three steps. Teach this as "slow, then zoom". Practice each move at a cone before using it against a defender.'],pts:['Fake with the shoulders and eyes','Touch the ball into space','Accelerate for three steps','Practice both sides'],scene:'fake'},
  {h:'Defending: approach, jockey, delay',p:['Defending starts with closing the space quickly, then slowing down when close. The defender gets low, turns side-on and moves backward in small steps ("dance backward") while keeping eyes on the ball. This is jockeying.','The aim is to delay the attacker, not to win the ball at once. A delayed attacker gives teammates time to arrive. Stay on your feet; never dive in.'],pts:['Close quickly, slow down at two yards','Get low, side-on','Eyes on the ball','Poke only when the ball is loose'],scene:'jockey'},
  {h:'Forcing to one side',p:['A defender who stands in front of the attacker has no direction. A defender who shades slightly to one side sends the attacker toward the sideline, where space is smaller. This is forcing.','Start with a sideline as a helper: the attacker is allowed on one side only. Ask the defender to show the attacker the "open door" and close the other.'],pts:['Shade one shoulder to send the attacker','Use the touchline as a second defender','Keep the same distance as the attacker moves','Celebrate forcing even without winning the ball'],scene:'force'},
  {h:'Win and go',p:['Soccer never stops. When a defender wins the ball, the game changes at once. Win and go teaches the new attacker to take the first touch away from pressure and attack the other goal.','The same applies when an attacker loses the ball: switch immediately to defense. A call like "switch" helps at first; later, the players call it themselves.'],pts:['First touch away from the old attacker','Go to the other goal','Lose the ball? Defend at once','Use a clear signal at first'],scene:'smallgame'},
  {h:'Competing bravely and kindly',p:['The 1 v 1 finale ends every practice, so it sets the emotional tone of the day. Match pairs by size and confidence, rotate opponents, and finish with a handshake. Praise the attempt, the move, the stay-on-feet defense and the kind word equally.','The chart shows illustrative planning targets for moves attempted in a five-minute 1 v 1 block. Use it to see participation, not to rank children.'],pts:['Short duels (30 to 60 seconds)','No sliding, grabbing or pushing','Match pairs by size and confidence','Handshake after each round'],chart:'duel'}
 ],
 drills:[
  ['Gear Shift Cones',8,'All','15 x 15 yd','Cones, 1 ball each','Dribble to a cone, perform a fake, then accelerate away. Return and repeat.','Fake, touch, speed','Use both sides; add a second cone','Fake too slow: increase tempo'],
  ['Chop and Go Gates',8,'Groups of 4','15 x 15 yd','Cones, balls','Dribble toward a gate, cut the ball across the body with the inside, push away with the outside, and go through the gate.','Inside then outside; accelerate','Choose your move; add a defender who walks','Cutting too close: aim for a wider cone'],
  ['Jockey Mirror',8,'Pairs','20 x 10 yd','None','One child dribbles slowly (or walks) while the partner stays in front, side-on, matching speed without tackling.','Low, side-on, small steps','Add a ball and light pressure; change direction','Chasing from behind: slow the attacker'],
  ['1 v 1 Ladder Game',15,'Pairs','Grids 8 x 5 yd','Cones, balls','Pairs duel for 30 seconds. The winner moves up a grid; the loser moves down. A goal is a gate or a small goal.','Brave moves; stay on feet','First to three points; swap roles each round','Over-physical play: define contact rules'],
  ['Force the Side',10,'Pairs','15 x 8 yd','Cones, balls','The attacker tries to dribble past the defender toward a gate. The defender tries to force the attacker toward the sideline by shading one side.','Shade one shoulder; stay low','Add a second gate on the side; add a time limit','Defender stands flat: show the angle'],
  ['Win and Go 2 v 2',10,'2 v 2','20 x 15 yd','Small goals, bibs','Play 2 v 2. When a team wins the ball, they must attack the opposite goal within two seconds.','Win it, go the other way','Add a pass before a shot; add a third player','Confusion: simplify the call']
 ],
 faults:[['Fake too slow','Not committing','Exaggerate the shoulder drop; add a change of pace'],['Defender dives in','Excitement','Cue "stay on your feet, get low"'],['Fouls or pushes','Frustration','Set clear contact rules; rotate pairs'],['Chases from behind','Loses position','Cue "get in front, side-on"'],['Cries after losing','Low tolerance for competition','Short duels; celebrate effort; match opponents']],
 check:'Child attempts two different moves in a live 1 v 1 and stays on their feet when defending.'
},
{
 n:9, title:'Rules, Fair Play and Character', short:'Rules & Fair Play',
 lead:'Rules are learned in play. Kindergarten players know the restarts, the simple fouls and the referee signals, take turns as referee, settle small disputes themselves and show good sportsmanship.',
 builds:[1,8], focus:{Technical:1,Physical:1,Psychological:4,Social:5},
 grew:{pre:'Pre-K practiced the whistle freeze, a two-hand throw-in and the handshake line.',k:'Kindergarten learns all common restarts, simple fouls and free kicks, referee signals, a player-led way to settle disputes and growth-mindset language.'},
 basis:[['FA','Social skills: behavior, learning, teamwork, relationships and independence; alternate player-led and coach-led time.'],['USYS','Treat arguments as part of learning; players organize and solve small disputes themselves.'],['DWECK','Praise effort and strategy, and use "not yet" language.']],
 game:'Player-Led Game: children play, referee and solve disputes themselves while the coach watches and only steps in for safety.',
 objectives:['Restart correctly after the ball goes out: throw-in or kick-in, goal kick and corner','Know the kick-off and the free kick after a foul (hands, push, trip)','Read and give three referee signals','Settle a small dispute with a simple method before asking an adult'],
 outcomes:['Takes a turn as referee and supports the referee’s decisions','Shows fair play: handshake, helping a player up, saying "good game"','Uses growth words ("not yet", "I will try again")','Handles losing a game without leaving the group'],
 concepts:[['Coach term / child language',[['Throw-in / kick-in','"Back into play"'],['Goal kick','"Restart from our goal"'],['Corner kick','"From the corner"'],['Foul','"Unsafe or unfair"'],['Free kick','"A free turn"'],['Referee','"The game helper"'],['Fair play','"Play kindly"'],['Not yet','"I cannot do it yet"']]]],
 why:'Rules are understood best when met in context. A child who has just seen the ball roll out understands a throw-in better than one who has been told about it. At this age, fairness is a strong feeling, and so are small disagreements. Learning to resolve them with words is the start of character. The FA frames social skills as behavior, learning, teamwork, relationships and independence; the games in this chapter practice all five.',
 details:[
  {h:'Restarts: back into play',p:['The most important rules at this age are restarts, because they keep the game going: the throw-in (or kick-in or self-pass, depending on your league), the goal kick, the corner kick and the kick-off. Introduce one restart at a time, at the moment it is needed, and let the children practice it as a short game.','Adapt the rules to the level of the group. For example, allow a second attempt at a throw-in. Germany’s foundation phase uses a self-pass from the sideline in place of a throw-in; your league may choose differently, so follow the local rule and teach it consistently.'],pts:['Introduce rules in context','Use positive wording ("two hands, over the head")','Give a second attempt on an illegal throw-in','Practice the restart as a short game'],scene:'throwin'},
  {h:'Fouls, free kicks and referee signals',p:['At five and six, a foul is anything unsafe or unfair: using hands, pushing or tripping. After a foul, the other team gets a free kick. Keep the language kind: "free turn for the other team".','Referee signals give children a vocabulary for the game. Practice three: the direction of the throw-in, the goal kick, and the corner. A short charades game is a fun way to learn them.'],pts:['Practice three signals','Use the same signals as your league','Give the free kick with a smile, not blame','Praise the player who admits a foul'],scene:'refsignals'},
  {h:'The player-led game',p:['Children grow when they are trusted. In a player-led game, the coach sets the field and the safety rules, then stops talking. Children pick teams, referee and solve disputes. The FA recommends alternating player-led time with coach-led time and watching during player-led periods for chances to extend a child’s learning.','Take notes: who leads, who gives in, who avoids conflict. Use them in the next practice when you choose captain jobs and buddies.'],pts:['Set only the safety rules','Watch quietly and take notes','Ask questions afterward ("what happened when…?")','Step in for safety, not for scores'],scene:'circle'},
  {h:'Settling disputes and handling losing',p:['Teach a three-step method for disputes: say what happened, listen to the other child, decide with a simple method (rock-paper-scissors or a coin). If the two cannot agree, ask the referee, then an adult. This method gives children control and builds patience.','Losing is hard. Say that disappointment is normal, then guide the child to the closing routine: handshake, "good game", a water break, and a try-it goal for next time.'],pts:['Step 1: say it. Step 2: listen. Step 3: decide.','Give a calm place for upset children','Model the handshake','Avoid labeling children as bad losers']},
  {h:'Growth-mindset language',p:['Carol Dweck’s research with children contrasts praise for ability ("you are so talented") with praise for effort and strategy ("you tried a new move"). Studies in that tradition found that children praised for ability tended to avoid challenges, while children praised for effort chose harder tasks. Treat the effect as a useful guide, not a guarantee.','Use "not yet" language. When a child says "I cannot do it", answer "you cannot do it yet". Teach the group to say it too.'],pts:['Praise effort, strategy and kindness','Use "not yet" language','Show your own mistakes and fix them aloud','Avoid comparing children to each other']}
 ],
 drills:[
  ['Restart Relay',10,'Teams of 3','20 x 15 yd','Balls, cones','Teams race through restart stations: a throw-in to a target, a goal kick to a gate, a corner kick to a cone. Everyone gets a turn at each.','Correct technique first, speed second','Add a time bonus for correct form','Rushing: slow the signal, praise form'],
  ['Referee Signals Charades',8,'All','Circle','None','A child acts out a signal (throw-in, corner, goal kick) and the group names it. Then the referee makes the call in a short game.','Clear, big signals','Add free kick and foul; let children make up new signs','Confusing signals: practice one at a time'],
  ['Fair Play Tally Game',10,'3 v 3','25 x 20 yd','Small goals, bibs','A game in which the team earns a point for each fair-play action: helping a player up, passing to a teammate who has not touched the ball, saying "good try".','Notice fair play','Add a captain who counts for the team','Unfair competition about the tally: keep it positive'],
  ['Player-Led Game',15,'3 v 3 or 4 v 4','25 x 20 yd','Small goals, bibs','Children play and referee their own game. The coach sets safety rules and watches. After 15 minutes, the group shares what went well and what was tricky.','Coach quiet, players lead','Rotate the referee every 3 minutes','Coach tempted to step in: only for safety'],
  ['Win-Lose Handshake Lines',6,'All','Field edge','None','After a short game, both teams form a line and say "good game". Then a child from each team says one good thing the other team did.','Look and say it','Pair choose a compliment','Rushing: model it slowly'],
  ['Dispute Detectives',8,'Small groups','Circle','None','The coach acts out a small dispute (who got the ball first). Groups use the three-step method to solve it.','Say it, listen, decide','Children act out their own scenarios','Blaming: ask what we can do next time']
 ],
 faults:[['Ignores the whistle','Distracted','Practice freeze games; reward the first to freeze'],['One-handed throw-in','Does not know the rule','Hold the ball with two hands on a model throw'],['Arguments over decisions','Competition','Use the three-step method; coach supports the referee'],['Child quits when losing','Low tolerance for failure','Quiet space; closing routine; praise effort'],['Referee is too bossy','Power in a new role','Rotate quickly; give a clear script']],
 check:'Child restarts the game with the correct restart, gives and follows a referee signal and shakes hands after the game.'
},
{
 n:10, title:'The Team Game', short:'Team Game',
 lead:'Small-sided games are the classroom. Kindergarten players spread out, support the ball, close down together and rotate through every role in four-goal 3 v 3 and 4 v 4.',
 builds:[1,2,3,4,5,6,7,8,9], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'Pre-K spread out in 3 v 3 and tried several roles.',k:'Kindergarten plays four-goal 3 v 3 and 4 v 4, supports the ball, closes down and covers as a team, and rotates every role including goalkeeper.'},
 basis:[['DFB','Smaller teams, four goals and shooting zones give more touches, duels and shots; the German FA made these formats mandatory for younger ages (reported by Lochmann).'],['FIFA','The 3 v 3 four-goal Funino format creates frequent decisions; the evidence given is design analysis and coaching observation.'],['USYS','3 v 3 or 4 v 4 through age 8; scramble teams on game day; no standings.']],
 game:'Funino 3 v 3: two teams, four small goals, rotating every few minutes.',
 objectives:['Spread out when the team has the ball so there is space and angles','Support: stand one pass away from the ball carrier','Close down together: the nearest player presses and a teammate covers behind','Rotate through every role, including goalkeeper'],
 outcomes:['Moves into space without the ball','Passes, dribbles and shoots in a game setting','Names who is "first defender" and who is "helper"','Enjoys playing with changing teammates'],
 concepts:[['Coach term / child language',[['Spread out','"Find your patch of grass"'],['Support','"Be one pass away"'],['Triangle shape','"Make a triangle"'],['Press','"Close the door"'],['Cover','"Be the helper behind"'],['Compact','"Be close friends when defending"'],['Rotation','"Everybody plays everywhere"']]]],
 why:'Team concepts such as spacing and roles are new at age five and six. Children may still prefer to chase the ball in a pack, and that is developmentally normal: they are learning to see teammates as part of the game. The most effective teachers are the game itself and the coach’s rule design: four goals, a shooting zone and rotation produce the same decisions that a lecture on tactics would try to explain.',
 details:[
  {h:'Why four goals, why three players',p:['The Funino idea, associated with Horst Wein, is a 3 v 3 game on a small pitch with four goals, two to attack and two to defend. Because there are only three players per team, each child touches the ball often and meets attacking, defending and transition moments all the time. Equal numbers mean no free teammate, so players must create space with movement and dribbling. Two goals to attack push players to scan and choose.','Germany’s federation (DFB) adopted similar small-sided formats for younger ages, and a sport scientist reported better results on touches, duels and shots than in traditional matches. The claims in public articles are expert perspective and reported pilot results; treat them as a reason to try the format, and record your own tallies.'],pts:['3 v 3 or 4 v 4, no goalkeepers needed at first','Four small goals and a shooting zone','Rotate teams every few minutes','Equal numbers, no free player'],scene:'funino'},
  {h:'Support and spacing',p:['When the team has the ball, spread out and offer an angle to the ball carrier. Each player owns a patch of grass and stays out of the others’. The shape that emerges is a triangle, which is the simplest stable shape in soccer.','Use cones or colored zones as visual help at first, then remove them. Pause the game and ask: "Where is the empty space?"'],pts:['Ask "where is the empty space?"','Pause to show the shape','Reward players who spread','Remove the markers once the shape holds'],scene:'spread'},
  {h:'Defending as a team: close and cover',p:['When the other team has the ball, the nearest player closes down the ball carrier (first defender), and the nearest teammate stands behind and to the side (cover). The others stay close to the ball but not on top of it. This is the child version of compact defending.','Use the words "close the door" for the first defender and "helper" for the cover. Rotate roles every few minutes so children experience both.'],pts:['Nearest player closes down','Second player covers behind','Third player stays near','Rotate roles often'],scene:'cover'},
  {h:'Rotation and playing time',p:['Every child plays every role, including goalkeeper, and plays about the same amount. Teams change every few minutes (scramble teams, as US Youth Soccer calls it) so children play with and against different peers.','Equal playing time, fair rotations and no standings keep the focus on development. Parents may need an explanation; use the parent communication guide.'],pts:['Rotate teams every 3 to 4 minutes','Use colored bibs to scramble teams','Everyone tries the goalkeeper role','Keep results unimportant'],chart:'session'},
  {h:'Match day for five- and six-year-olds',p:['Match day is a festival of short games on small fields. The coach’s role changes: less instruction from the sideline, more design of rules and more watching. Pause between games to ask what went well and what was tricky.','A tally sheet (touches, shots, 1 v 1 attempts) shows how many actions each child had. It is a coach tool, not a score to share with the team.'],pts:['Short games of 6 to 10 minutes','No table and no standings','Coach observes and records tallies','Closing circle with praise and a shared snack'],scene:'matchday'}
 ],
 drills:[
  ['Spread and Support Squares',10,'4 v 2 or 3 v 1','Squares 12 x 12 yd','Bibs, balls','Players keep the ball in a square and move to an angle after each pass. The coach calls "spread" and players find a new patch.','One pass away; make a triangle','Remove cones; add a defender','Bunching: freeze and fix'],
  ['Close and Cover 2 v 1',10,'Groups of 3','15 x 10 yd','Small goal','One attacker dribbles at a goal, defended by two. The first defender closes; the second covers behind.','Close the door; helper behind','Add a second attacker; defenders swap roles','Both defenders flat: show the angle'],
  ['Rotation Roles',8,'Teams of 3','Small field','Bibs','After each goal, teams rotate roles (attacker, defender, helper). Everyone has a turn.','Everyone tries each role','Add goalkeeper; vary the order','Refusing a role: offer a short try'],
  ['Funino 3 v 3 Four Goals',15,'3 v 3','25 x 25 yd','4 small goals, bibs','Play 3 v 3 with four goals. Teams change every few minutes. Goals count only if shot from inside a shooting zone.','Look for the open goal; spread out','Add a shooting zone; add a pass before a goal','Bunching: pause and point to space'],
  ['4 v 4 Zone Shape Game',12,'4 v 4','30 x 25 yd','Small goals, bibs','Play 4 v 4 with three zones. One player from each team may leave a zone. Remove the zones when the shape holds.','Spread, support, close','Remove zones; add a goalkeeper rotation','Zones confuse: use two instead of three'],
  ['Match Day Mini-Festival',20,'Teams of 4','Several fields','Cones, bibs','Short games on several small fields. Teams rotate every 6 minutes. Parents join as supporters. No scores kept.','Fun and effort','Parents join in a game; coaches record tallies','Overcompetitive adults: set expectations']
 ],
 faults:[['All players cluster','Chasing the ball','Pause and point to empty areas; use zone markers'],['Refuses a role','Fear or preference','Offer an alternative role for a short time and rotate'],['Overcompetitive parents','High adult emphasis on results','Set expectations before the season; no table or standings'],['Defenders both rush in','No sense of cover','Name the roles: first defender and helper'],['Same children always lead','Confidence gap','Rotate captains; give quiet children defined jobs']],
 check:'Child spreads out, supports a teammate and tries at least three roles in a small-sided game.'
},
{
 n:11, title:'Goalkeeper Fundamentals', short:'Goalkeeper',
 lead:'Every child tries goalkeeping. Kindergarten adds catching at chest height, falling safely to the side from the knees, throwing and rolling out, and loud communication.',
 builds:[2,5,7,8], focus:{Technical:4,Physical:3,Psychological:5,Social:3},
 grew:{pre:'Pre-K practiced the ready position, scooping a rolled ball and rolling out.',k:'Kindergarten adds catching at chest height, a safe side fall from the knees, an overarm throw, positioning in the middle of the goal and clear calls.'},
 basis:[['USS','Goalkeeping basics at this age: passing, throwing, catching and diving with the body; every player gets a turn.'],['USYS','Do not station young players in goal for long periods; keepers are not permanent at U6 to U8.'],['GALL','Throwing and catching are manipulative skills that mature with practice.']],
 game:'Keeper Rotation Game: 3 v 3 where the team that is scored on picks a new goalkeeper.',
 objectives:['Take a ready position with hands in front, knees bent and weight forward','Catch a ball at chest height with hands behind the ball','Fall to the side from the knees onto the side of the body','Roll or throw the ball out to a teammate or target and call "mine"'],
 outcomes:['Tries the goalkeeper role without fear','Stands in the middle of the goal when the ball is far away','Uses hands only inside the goal area','Calls "mine" or "keeper" before taking the ball'],
 concepts:[['Coach term / child language',[['Ready position','"Ready like a spider"'],['Catch','"Hug the ball"'],['Side fall','"Fall like a superhero"'],['Roll out','"Bowl it to a friend"'],['Throw','"Throw like you are pitching"'],['Home spot','"Stand in the middle"'],['Call','"Mine!"']]]],
 why:'Goalkeeping can be exciting or frightening. Fear of the ball is common and developmentally normal, because tracking a fast ball is hard at this age. Start with rolled and soft balls, celebrate brave attempts, and let every child try. Permanent goalkeepers are not appropriate at this age: standing for long periods hurts development and enjoyment, and the point is to give everyone a taste of the role.',
 details:[
  {h:'Ready position and brave attitude',p:['The ready position is balanced: feet shoulder-width apart, knees bent, weight on the balls of the feet and hands out in front. It links directly to the balance work in Chapter 2. A keeper who bounces lightly reacts faster than one who stands still.','Confidence is the main theme. Celebrate every attempt, not only saves. A child who tries is progressing.'],pts:['Hands out in front, palms facing the ball','Eyes on the ball','Small bouncy steps','Cheer for brave tries'],scene:'keeper'},
  {h:'Catching at chest height',p:['A catch at chest height is made with both hands behind the ball and the thumbs close together or the hands in a "W". The hands give a little on contact and the ball is hugged into the chest. Start with a soft ball and a short toss.','Throwing and catching are manipulative skills that mature with practice. Many five-year-olds are still developing the pattern; use large soft balls and give plenty of tries.'],pts:['Get the body behind the ball','Hands behind the ball, thumbs close','Give with the ball and hug it','Use soft balls for beginners'],scene:'pairs'},
  {h:'Falling to the side',p:['A safe side fall begins on the knees. The keeper falls toward the ball onto the side of the body, with hands leading, and does not land on the elbow or the knee. Practice on soft grass or mats and start from kneeling, then from a crouch, never from a jump.','This is the first step of diving. In Kindergarten, the aim is brave and safe, not athletic.'],pts:['Start from the knees on soft ground','Hands first, land on the side','Never from a height or at speed','Praise the attempt'],scene:'dive'},
  {h:'Throwing, rolling out and calling',p:['After a save, the keeper rolls the ball out to a teammate or throws it overarm to a target. Rolling is easier and safer. Overarm throwing needs a step with the opposite foot and a follow-through toward the target.','Calling "mine" or "keeper" before taking the ball is a safety habit. It prevents collisions and builds communication from the start.'],pts:['Roll low and along the ground','Step with the opposite foot to throw','Aim at a cone or a teammate','Say "mine" loudly'],scene:'gkthrow'},
  {h:'Courage and rotation',p:['No child should be locked into goalkeeping at this age. Rotate after every goal or every few minutes. Children who refuse are given a one-minute trial and an easy job, and never forced.','The chart shows illustrative planning targets for stopping slow shots. Use it to celebrate growth in bravery and skill.'],pts:['Rotate every few minutes','Offer a one-minute trial','Use soft balls for the nervous','Celebrate bravery as loudly as a save'],chart:'gk'}

<script>
// Merge the original six drills of each chapter with the exercise bank so that every practice has its own exercises.
// Result per chapter: 18 drills ordered [L1 skillA, L1 skillB, L1 game, L2 ..., L6 game]; DSCENE rebuilt in the same order.
(function(){
const CH=window.CHAPTERS,BANK=window.BANK||{},DS=window.DSCENE,out={};
const OLD_SKILL=[0,1,2,4,5],OLD_HINT=[1,1,2,3,4];
CH.forEach(c=>{
 const b=BANK[c.n];if(!b)return;
 const items=[];
 OLD_SKILL.forEach((oi,k)=>items.push({d:c.drills[oi].slice(0,9),lv:OLD_HINT[k],t:'s',sc:DS[c.n][oi]}));
 items.push({d:c.drills[3].slice(0,9),lv:1,t:'g',sc:DS[c.n][3]});
 b.forEach((x,i)=>items.push({d:x.slice(0,9),lv:x[9],t:i<7?'s':'g',sc:x[10]}));
 const drills=[],scenes=[];
 for(let l=1;l<=6;l++){
  const sk=items.filter(x=>x.lv===l&&x.t==='s'),gm=items.filter(x=>x.lv===l&&x.t==='g');
  [...sk.slice(0,2),...gm.slice(0,1)].forEach(x=>{drills.push([...x.d,l,x.t]);scenes.push(x.sc);});
 }
 c.drills=drills;out[c.n]=scenes;
});
window.DSCENE=out;
})();

</script>

(function(){

function pitch(lines){
  let s=`<rect width="${W}" height="${H}" fill="var(--turf)"/>`;
  for(let i=0;i<10;i++) if(i%2) s+=`<rect x="${i*60}" y="0" width="60" height="${H}" fill="var(--turf2)"/>`;
  if(lines!==false) s+=`<rect x="16" y="16" width="${W-32}" height="${H-32}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  return s;
}
function motion(o,x,y){
  if(!o.pts) return '';
  const path=o.loop===false?rel(x,y,o.pts):loop(x,y,o.pts);
  const kp=o.kp?` keyPoints="${o.kp}" keyTimes="${o.kt}" calcMode="${o.spl?'spline':'linear'}"${o.spl?` keySplines="${o.spl}"`:''}`:'';

function item(o){

   case 'line': return `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.stroke||'var(--line)'}" stroke-width="${o.w||2}" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
   case 'label': return `<text x="${o.x}" y="${o.y}" class="sc-t ${o.cls||''}" text-anchor="${o.anchor||'middle'}">${o.text}</text>`;

   }

      let s=`<g transform="translate(${o.x},${o.y})"><rect x="-16" y="-44" width="32" height="88" rx="8" fill="#111c"/>`;

 return {min:time,name:label+': '+d[0],how:d[5]+' Setup: '+d[3]+', '+d[2]+'. Equipment: '+d[4]+'.',focus:d[6],prog:d[7]+' (Level focus: '+LEVELS[level-1][1]+')',watch:d[8],scene:ref(c.n,i),steps:[['Set up',d[3]+', '+d[2]+'. You need: '+d[4]+'.'],['Do',d[5]],['Say',d[6]],['Make it harder',d[7]],['Watch for',d[8]]]};

const POOL=[0,1,2,4,5];
function session(s){
 const o=slot(s),c=CH[o.ch-1],l=o.level;
 const pr=prevOf(o.ch,l),pc=CH[pr.ch-1];

 blocks.push({min:5,name:'Arrival and circle',how:'Greet each child by name, quick team chant, weather check, shin guards and water. Captains take their jobs. Tell the group the one idea for today: '+c.objectives[0].toLowerCase()+'.',focus:'Belonging and clarity',prog:'',watch:'Late arrivals: let them join the run start',scene:['circle','Circle up, greet, share the idea of the day.']});
 blocks.push({min:10,short:LAPS[l-1].replace(/\.$/,'')+'. Then 2 min dynamic moves.',name:'Run start: laps around the field',how:'Always start by running around the field. '+LAPS[l-1]+' Finish with 2 min dynamic moves: '+DYN[o.ch]+'.',focus:'Raise the heart rate; tall posture, bent arms, light feet',prog:'Level '+l+' running: '+LAPS[l-1],watch:'Children tire at different rates: allow walking. Never use running as punishment.',scene:['laps','Everyone runs around the field.']});

 {const F=FIN[l-1];blocks.push({min:10,name:'Duel finale: '+F[0],how:'Every practice ends with duels that grow with the level. '+(l>1&&F[1]!=='fin_1v1goal'?'Open with two minutes of 1 v 1 in pairs, then play today\'s format. ':'')+'Format: '+F[3]+' Grid: '+F[2]+'. Chapter twist ('+du[0]+'): '+du[1]+' In team formats the twist applies to the player on the ball.',focus:'Compete bravely and kindly; use today\'s skill under duel conditions',prog:F[4],watch:'Match players by size and confidence. No sliding, grabbing or pushing. Keep score light and praise effort.',scene:[F[1],F[0]+'. '+F[3]]});}

 blocks[0].steps=[['Do','Greet each child by name. Check shin guards and water. Gather in a circle.'],['Say','Today we are working on this: '+c.objectives[0].toLowerCase()+'.'],['Watch for','Children who arrive late. Send them straight to the run.']];
 blocks[1].steps=[['Do',LAPS[l-1]],['Then','2 minutes of dynamic moves: '+DYN[o.ch]+'.'],['Say','Tall back, bent arms, light feet.'],['Watch for','Tired children can walk. Never use running as a punishment.']];
 blocks[2].steps=[['Do','Water break, about 1 minute.'],['Show','Demonstrate today\'s skill for 2 minutes. Keep your talking short.'],['Say','One cue only. Words for today: '+c.concepts[0][1].map(k=>k[0]).slice(0,3).join(', ')+'.']];

  blocks.push({min:15,name:'Parent and child game',how:'Parents join in simple games with their child: toe taps, 3 v 1 keep-away, and a scoring game.',focus:'Pride and connection',prog:'',watch:'Parents: encourage, do not coach',scene:['pairs','Parent and child pass.']});

 }

}
function toText(p){

<script>
(function(){
const CH=window.CHAPTERS, PL=window.PLAN, N=CH.length, LV=PL.LEVELS, LT=PL.LT;
const $=s=>document.querySelector(s);
const CORNERS=['Technical','Physical','Psychological','Social'];
let uid=0;const nid=()=>'x'+(++uid);

/* ---------- settings + schedule ---------- */
const DEF_START='2026-10-13';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}

const getStart=()=>lsGet('rchk-start',DEF_START), getFirst=()=>Math.min(N,Math.max(1,+lsGet('rchk-first',1)||1));

 for(let s=first;s<=PL.TEACH;s++){seq.push({kind:'p',s});if(s%22===0){const k=s/22;seq.push({kind:'f',k,day:'Tuesday'},{kind:'f',k,day:'Thursday'});}}
 const st=parseD(getStart());let d=new Date(st),i=0,g=0;const out=[];
 while(i<seq.length&&g++<900){const wd=d.getDay();if((wd===2||wd===4)&&!skip.has(iso(d))){out.push({...seq[i],date:new Date(d),iso:iso(d)});i++;}d.setDate(d.getDate()+1);}
 out.forEach(e=>{e.week=Math.floor((e.date-st)/(7*864e5))+1;e.dayName=e.date.toLocaleDateString('en-US',{weekday:'long'});e.dstr=e.date.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});});
 SCH=out;
}
const evP=s=>SCH.find(e=>e.kind==='p'&&e.s===s);
const evF=(k,day)=>SCH.find(e=>e.kind==='f'&&e.k===k&&e.day===day);

const evColor=e=>e.kind==='p'?`hsl(${(PL.slot(e.s).ch-1)*33+8} 52% 38%)`:'hsl(34 88% 38%)';

/* ---------- charts ---------- */
const CHARTS={
 balance:['Planning target: single-leg balance','seconds',[5,6,8,10,10,12],'Illustrative targets for tracking a child against their own earlier results. Not age norms.'],
 touches:['Planning target: touches in 30 seconds','touches',[30,36,42,48,54,60],'Inside of the foot, one ball. Use for self-comparison only. Do not rank children.'],
 dribble:['Planning target: cones cleared with no stray touch','cones',[3,4,5,6,7,8],'Eight-cone zigzag, 1 yard apart.'],
 control:['Planning target: passes controlled out of 10','of 10',[3,4,5,6,7,8],'Pass from 5 to 8 yards, controlled within one stride.'],
 pass:['Planning target: accurate partner passes out of 10','of 10',[3,4,5,6,7,8],'Partner 6 to 8 yards away, inside-foot pass.'],
 shoot:['Planning target: shots on target out of 10','of 10',[2,3,4,5,6,6],'Goal at 8 to 10 yards, still ball or short run-up, either foot.'],
 duel:['Planning target: moves attempted in a 5-minute 1 v 1 block','moves',[4,6,8,10,12,14],'Counts attempts, not wins. Use to see participation.'],

function chartHTML(key){
 const c=CHARTS[key];if(!c)return '';
 const labels=['L1','L2','L3','L4','L5','L6'],vals=c[2];
 const W=520,H=210,L=40,B=30,T=14,R=10,max=Math.ceil(Math.max(...vals)*1.15/2)*2;

 for(let g=0;g<=4;g++){const v=max/4*g;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`;}

  s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" class="bar${last?' hi':''}" style="--d:${i*70}ms"/><text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" class="val${last?' hi':''}">${v}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="ax">${labels[i]}</text>`;});
 return `<figure class="chart in"><div class="ct">${c[0]}<span> (${c[1]})</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c[0]}">${s}</svg><figcaption>${c[3]}</figcaption></figure>`;

/* ---------- small helpers ---------- */
const head=(eyebrow,title,lead,extra)=>`<header class="ph"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}${extra||''}</div></header>`;

 return nxt+`<div class="hero"><div><div class="eyebrow">RCH Elite Training · Kindergarten · Ages 5 to 6</div><h1>Growing the Game</h1><p>Eleven chapters taught in rotation, starting at chapter 1. Every Tuesday and Thursday practice moves one chapter forward by a small step. After all eleven, the cycle returns to chapter 1 at a higher level. Each chapter builds on what the group learned in Pre-K.</p><div class="stats"><div><b>11</b>chapters</div><div><b>6</b>levels</div><div><b>66</b>practices</div><div><b>75</b>min each</div></div></div><div id="hero-scene">${window.renderScene('funino',nid())}</div></div>
 <div class="cols3"><div class="card"><h4>Always start by running</h4><p>Every practice opens with running around the field and ends with a duel finale that grows by level: 1 v 1, then 2 v 1, 2 v 2, 3 v 2, 3 v 3 and finally teams with defenders.</p></div><div class="card"><h4>Mixed, not blocked</h4><p>No month of only dribbling. Each practice teaches one chapter, and the next practice teaches the next chapter.</p></div><div class="card"><h4>Six passes through the book</h4><p>Level 1 introduces each chapter. Levels 2 to 6 repeat it with more speed, less space, pressure and game play.</p></div></div>

 <div class="rhythm"><h4>What grew since Pre-K</h4>${tbl(['Chapter','Pre-K','Kindergarten'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))}</div>`;

/* ---------- calendar ---------- */
let CAL=null;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function initCal(){
 const t=new Date();const f=SCH[0]?SCH[0].date:t,l=SCH.length?SCH[SCH.length-1].date:t;
 const ref=(t>=f&&t<=l)?t:f;
 CAL={y:ref.getFullYear(),m:ref.getMonth(),view:'month',sel:null,panel:null};
}

  const d=new Date(y,m,r*7+c-off+1),k=iso(d),oth=d.getMonth()!==m;

}

 n=Math.min(Math.max(1,n),N);const c=CH[n-1];if(!CTABS.some(t=>t[0]===tab))tab='preview';
 const b=c.builds.length?c.builds.map(x=>`<a href="#/ch/${x}" class="chip">Ch ${x} ${CH[x-1].short}</a>`).join(''):'<span class="chip plain">Starting point</span>';

  <div class="grewc"><div class="card"><h4>In Pre-K</h4><p>${c.grew.pre}</p></div><div class="card kgrow"><h4>Now, in Kindergarten</h4><p>${c.grew.k}</p></div></div>
  <div class="cols2"><div class="card"><h4>Research base</h4><ul class="pts">${c.basis.map(x=>`<li><a class="chip" href="#/g/sources">${SRC[x[0]]||x[0]}</a> ${x[1]}</li>`).join('')}</ul></div><div class="card"><h4>The game for this chapter</h4><p>${c.game}</p></div></div>`;
 }else if(tab==='concepts'){
  body=`<div class="tablewrap"><table class="kc"><thead><tr><th>Coach term</th><th>Say it to the child</th></tr></thead><tbody>${c.concepts[0][1].map(k=>`<tr><th scope="row">${k[0]}</th><td>${k[1]}</td></tr>`).join('')}</tbody></table></div>`;
 }else if(tab==='notes'){

  const vis=d.scene?window.renderScene(d.scene,nid()):d.chart?chartHTML(d.chart):'';
  const dots=c.details.map((x,j)=>`<a href="#/ch/${n}/notes/${j}" class="dot" aria-current="${j===i}" title="${x.h}">${j+1}</a>`).join('');

 }else if(tab==='faults'){

 }else if(tab==='progress'){
  const steps=LT[n].map((t,i)=>`<li style="--w:${(i+1)/6*100}%;--d:${i*80}ms" class="stp"><b>L${i+1}</b><span class="sn">${LV[i][0]}</span><span class="st">${t}</span><a href="#/session/${sessionNo(n,i+1)}" class="sl">Practice ${sessionNo(n,i+1)}</a></li>`).join('');
  const fc=CORNERS.map(k=>`<li><span>${k}</span><span class="fb"><i style="width:${c.focus[k]*20}%"></i></span><b>${c.focus[k]}/5</b></li>`).join('');
  const key=(c.details.find(d=>d.chart)||{}).chart;

 }else{

  body=`<div class="drillpage"><div class="dlist">${lst}</div><article class="drill"><header><h3>${d[0]}</h3><div class="meta">${d[9]?`<span>Level ${d[9]}</span><span>${d[10]==='g'?'Game':'Skill exercise'}</span>`:''}<span>${d[1]} min</span><span>${d[2]}</span><span>${d[3]}</span><span>${d[4]}</span></div></header>${ds?window.renderScene(ds[0],nid(),ds[1]):''}<dl><div><dt>Organisation</dt><dd>${d[5]}</dd></div><div><dt>Coaching points</dt><dd>${d[6]}</dd></div><div><dt>Progression</dt><dd>${d[7]}</dd></div><div><dt>Common issue</dt><dd>${d[8]}</dd></div></dl></article></div><p class="check"><b>Check for learning.</b> ${c.check}</p>`;

const WEEKEXP=[['Weeks 1 to 2','Team name, chant, buddy system, captain jobs','Parent welcome meeting; share the year plan, the Tuesday and Thursday schedule and the no-standings approach'],['Week 12','Festival 1 (end of Term 1)','Parent showcase; share first progress sheet (Yes, Almost, Not yet)'],['Weeks 13 to 14','Rebuild routines after the break','Short note about the next term'],['Week 24','Festival 2 (end of Term 2)','Family fun day; mid-year feedback'],['Weeks 25 to 26','Raise the challenge in games; players lead more','Invite parents to watch one practice'],['Week 36','Festival 3 and graduation','Certificates, final report, photos'],['Weeks 37 to 40','Off-season: optional free play','Home challenge cards; registration; handover to 1st grade']];
const SRC={USS:'U.S. Soccer',USYS:'US Youth Soccer',FA:'The FA',DFB:'DFB (Lochmann)',FIFA:'FIFA Training Centre',LTAD:'Long-term athlete development',GALL:'Gallahue',SDT:'Ryan and Deci',DWECK:'Dweck',KNVB:'KNVB / Coerver'};
const GUIDE={
 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, skips, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','Opposite Lights (the old Traffic Lights game) is a chapter 2 exercise, not the run start','Shorten the laps in hot weather and keep water within reach'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. It follows the play, practice, play pattern and the FA’s plan, do, review loop.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, weather check, captain jobs, team chant, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Two-minute demonstration with one cue'],['20 to 32','Play: skill play 1','Chapter drill at the current level; explore and repeat'],['32 to 44','Practice: skill play 2','A second chapter drill with a progression'],['44 to 59','Play: game','Small-sided game that applies the idea; level rule from the plan'],['59 to 69','Duel finale','Always. 1 v 1 at first, growing to 2 v 2, 3 v 3 and defenders'],['69 to 75','Closing circle','A motivation and morale tip, a high five for every child by name, the team chant and the next practice']])+ul(['Aim for at least 70 percent ball-rolling time (the FA’s guide for coaches)','Change activity if children lose focus','Water at minute 15, at the middle of the game and at the end','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates','If energy is low, shorten skill play 2 and keep the duel finale'])],
 bridge:['From Pre-K to Kindergarten','Kindergarten is built on the same eleven chapters. Each chapter grows: the Pre-K ideas return with a new layer.',()=>`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Pre-K','Now in Kindergarten'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: captain jobs, buddy goals, a player-led game, children referee','Longer, more varied games: 15 minutes of game time every practice','Simple tactics through game design: thirds, support, close and cover','Decisions are added gradually: a peek before receiving, shoot-or-pass cues, win and go','A review loop: the coach plans, the players do, then both review'])+`<h4 class="sp">Day-one checks for children arriving from Pre-K</h4>`+ul(['Can name the goal, sideline and middle; follows the stop signal','Balances on one foot for about 5 seconds','Toe taps with both feet; stops a slow rolled ball','Passes with the inside of the foot at 5 yards','Attempts a fake in a 1 v 1','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Pre-K','Use the first cycle (11 practices) as the baseline for everyone'])],
 theory:['Game Ideas for Ages 5 to 6','Tactics are not taught as drills of positions. They are taught as simple ideas inside games, in the language children use.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, support a teammate, dribble into space, pass or shoot. Chapters 4, 6, 7 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay between the ball and the goal. Chapters 8 and 10.</p></div><div class="card"><h4>Switch</h4><p>Win it and go the other way; lose it and defend at once. Chapters 8 and 10.</p></div></div><p>The three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">The thirds of the field</h4><p>Home (our end), middle and away (their end). Players first learn the words in Chapter 1, then use them to describe where the ball is and where the team should go.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use your move, then zoom','8'],['They have the ball','Close the nearest player or cover','10']])+`<h4 class="sp">Positions</h4><p>There are no fixed positions. Roles rotate: attacker, defender, helper (cover) and goalkeeper. The 3 v 3 triangle is the only shape taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who can help the player with the ball?','Which third are we in?','What did you see before you took the ball?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in Kindergarten practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','Kindergarten setting','Note'],[['Players per team','3 v 3, sometimes 4 v 4','DFB uses 3 v 3 (and 5 v 5 later) in its children’s forms and the KNVB uses 4 v 4 for the youngest; US Youth Soccer also uses 3 v 3 or 4 v 4 through age 8'],['Format','Four small goals, shooting zone, rotating teams','Funino as described by FIFA Training Centre: about 25 x 25 meters'],['Field size','About 25 x 20 yards (3 v 3); a bit larger for 4 v 4','DFB 3 v 3 is about 25 x 20 meters; UEFA’s grassroots newsletter gives about 30 x 20 meters for 4 v 4; US Youth Soccer lists 25 x 20 yards at U6'],['Ball','Size 3 is the common standard for this age','Check your league; we have not verified a federation document'],['Goalkeepers','Not permanent; every child rotates','DFB 3 v 3 has no goalkeepers, UEFA’s newsletter has none at 4 v 4, and U.S. Soccer agrees'],['Heading','Not used in practice or games','U.S. Soccer age-group guide; no European source we read requires it'],['Restarts','Kick-off, throw-in or kick-in, goal kick, corner kick, free kick','Germany uses a self-pass from the sideline; follow your league and stay consistent'],['Playing time','Equal; everyone plays every role','Scramble teams so children play with and against different peers'],['Results','No table, no standings','Tallies for coaches only'],['Game length','Rounds of 6 to 10 minutes','Coach adaptation']])+ul(['Laws taught in Kindergarten: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 5 and 6, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 5 and 6','How we train it','Chapters'],[['Balance','Improving; one-foot balance is still short','Balance holds, landings, ball holds','2, 11'],['Agility','Plant-and-push and direction change are new','Cut gates, mirror tag, 1 v 1','2, 8'],['Coordination','Skipping and galloping are still forming','Skip and gallop lanes, rhythm touches','2, 3'],['Speed','A key window in the next years; short bursts only','5 to 10 second efforts with full rest','2, 4, 8'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: hops, jumps, crawls','Hop circuits, animal moves','2']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage at about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Five ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which cone color, which game, which job.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Three Signals and switching rules every 30 seconds practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence base is mixed and should be treated as a design guide rather than a promise.</p>`+ul(['Give one or two steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop or wait'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Expect side-by-side play and self-focus; teach sharing through game design','Let children try to settle small disputes before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my next try-it goal?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week 24'],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],
 assess:['Assessment','Record Yes, Almost or Not yet at each festival (weeks 12, 24 and 36), plus a baseline in week 1. Assess inside normal games and do not rank children.',()=>tbl(['Chapter','Check','Wk 1','Wk 12','Wk 24','Wk 36'],CH.map(c=>[c.n+'. '+c.short,c.check,'','','','']),'grid-t asm')],
 next:['Looking Ahead to 1st Grade','The first-grade curriculum extends this base.',()=>`<p>It adds longer passing patterns, more dribbling moves, a clearer understanding of positions and space, goalkeeper skills in a game, and more formal rules. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay the same; each gets a new layer','Roles become more stable in small-sided formats','Players take on more of the planning and the review'])],

   ['<a href="https://www.fifatrainingcentre.com/en/practice/grassroots/grassroots-and-youth-football-essentials/grassroots-coaching-essentials/jene-3-dribbling-as-a-positive-start.php" target="_blank" rel="noopener">FIFA Training Centre, dribbling as a positive start (ages 4 to 8)</a>', 'Unopposed dribbling first, then light competition, then 1 v 1, 2 v 2 and 2 v 1; freedom of expression', 'Read'],

const GORDER=[['run','Run start'],['structure','75-minute practice'],['bridge','From Pre-K'],['theory','Game ideas'],['formats','Rules and formats'],['body','Body and growth'],['psych','Psychology'],['review','Plan, Do, Review'],['safety','Safety'],['team','Team chemistry'],['parents','Parents'],['assess','Assessment'],['next','Next grade'],['sources','Sources']];
function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

/* ---------- shell ---------- */
$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">Kindergarten Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchk-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchk-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchk-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CAL&&(CAL.sel!==null||CAL.panel)){CAL.sel=null;CAL.panel=null;if($('#drawer'))renderCal();}});
const th=$('#theme');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchk-theme',t);}catch(e){}}
th.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark');});
try{const t=localStorage.getItem('rchk-theme');if(t)setTheme(t);}catch(e){}
route();
})();
