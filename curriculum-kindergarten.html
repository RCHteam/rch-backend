<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCH Kindergarten Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#F2F5F3;--bg2:#FFFFFF;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}

<script>
// Kindergarten curriculum content (original writing). Chapters 1 to 4. Source keys are explained on the Sources page.
window.CHAPTERS = [
{
 n:1, title:'Team Environment and Routines', short:'Team & Routines',
 lead:'The environment is the first coach. Kindergarten players now run the routines themselves, learn the field as three thirds, agree on three team rules and set a personal try-it goal.',
 builds:[], focus:{Technical:1,Physical:2,Psychological:4,Social:5},
 grew:{pre:'Pre-K taught the field, the equipment and the stop signal. The coach led every routine.',k:'Kindergarten players lead the routines (captain jobs), see the field as home, middle and away thirds, agree on three team rules and choose a try-it goal.'},
 basis:[['FA','Three simple ground rules (safe, not disrupting learning, respectful) and a mix of player-led and coach-led time.'],['USYS','Fields of about 25 by 20 yards at this age; arguments between children are part of learning.'],['SDT','Competence, autonomy and belonging drive motivation: jobs, choices and names.']],
 game:'Free 3 v 3 with the coach watching: do players use the routines and the three rules on their own?',
 objectives:['Run the arrival routine without prompts: kit, water, circle, buddy','Name the three thirds of the field (home, middle, away) and run to each on call','Say the three team rules in their own words and show one in action','Take a small job each practice: cone captain, ball captain or water captain'],
 outcomes:['Joins the circle within one minute of the call','Responds to three signals: freeze, circle up, go','Names two teammates and one thing a teammate did well','Describes how they feel with the weather check (sunny, cloudy, stormy)'],
 concepts:[['Coach term / child language',[['Thirds of the field','"Home, middle, away"'],['Team rules','"Safe, kind, listening"'],['Three signals','"Freeze, circle up, go"'],['Roles of the day','"Captain jobs"'],['Buddy','"My practice partner"'],['Weather check','"Sunny, cloudy or stormy?"'],['Try-it goal','"Something I want to try today"']]]],
 why:'Five- and six-year-olds are building self-regulation: waiting, listening, following a two-step instruction and recovering from small disappointments. A predictable environment gives them the safety to practice those skills. Children who know the routine spend their attention on playing, not on guessing what comes next, and children with jobs feel that the team is theirs.',
 details:[
  {h:'The environment is the first coach',p:['Before any child arrives, the field is ready: cones set, balls in a bag at the edge, a water spot, a circle spot. The first minutes then belong to the children, not to setup. A practice where everyone has a ball and nobody waits in a line produces far more useful repetition than a practice built around one demonstration after another.','The FA suggests aiming for at least 70 percent ball-rolling time in a practice. For a 75-minute practice that is more than 50 minutes of real play. Use that as a self-check: count how many minutes children stood still listening.'],pts:['Set cones before arrival; use the first minutes for the circle','One ball per child in at least half of the practice','Keep groups small so nobody waits more than 20 seconds','Use the same circle spot and water spot every time'],chart:'session'},
  {h:'The field in thirds',p:['The field is a big place for a small child. Dividing it into thirds gives a simple map: home (our end), middle, and away (their end). Players first run to each third on a call, then learn that when we have the ball we want to go from home toward away.','Thirds also prepare chapter 10. A child who understands "away" knows where goals are scored, and a child who understands "home" knows where to defend. Use the words in every practice until children use them without prompts.'],pts:['Mark the thirds with cones or a line of bibs','Call a third and a way to travel (skip to away, gallop to home)','Ask: "Which third are we in now?" during a game pause','Rotate which end is home so both ends are familiar'],scene:'thirds'},
  {h:'Three signals and three rules',p:['Children need very few instructions, repeated the same way every time. Use three signals: freeze (stop where you are), circle up (come to the coach), and go (start playing). Practice them as games with fast rewards for the whole group, not as discipline.','Team rules should be short enough for a five-year-old to remember. The FA describes three ground rules: do not do anything unsafe, do not disrupt other people’s learning, and do not be disrespectful. In child language these become safe, listening and kind. Agree on them together in the first practice and refer to them when something happens.'],pts:['Use the same words and the same sound every practice','Praise the first group to respond, then everyone who did','Let children say the rules in their own words','Link a rule to a specific moment ("that was kind: you helped him up")'],scene:'freeze'},
  {h:'Jobs, choices and the try-it goal',p:['Self-determination theory describes three needs that drive motivation: competence (I can do it), autonomy (I have a say) and relatedness (I belong). A captain job gives all three at once: it is a task the child can do, chosen from a short list, and it matters to the team.','Each practice, offer a small choice (which ball, which game, which job) and let each child pick a try-it goal for the practice, such as "use my weaker foot twice" or "say my buddy’s name". Check back at the end in the closing circle. U.S. Soccer’s coaching guidance for this age also recommends giving each player personal challenges and letting players choose how they practice.'],pts:['Rotate jobs so every child gets each job during the year','Offer two choices, never an open question','Write the try-it goal in the child’s words on the sign-in sheet','Celebrate a tried goal even when it was not achieved'],scene:'circle'},
  {h:'Feelings, mistakes and fairness',p:['A weather check (sunny, cloudy, stormy) takes ten seconds and tells the coach who needs a quieter job today. It also gives children words for feelings, which is the first step toward managing them.','Mistakes and small arguments are normal at this age. US Youth Soccer guidance recommends that coaches treat arguments between children as part of learning rather than something to shut down immediately. Give the pair a minute to solve it, then step in with a question: "What do you need to do so we can keep playing?"'],pts:['Check weather at arrival and again at the closing circle','Never use running or sitting out as punishment','Let children try to solve a dispute before the coach steps in','Praise the repair ("you said sorry and passed it back")']}
 ],
 drills:[
  ['Thirds Tour',8,'All','Full field (25 x 20 yd)','Cones or bibs for the thirds','Mark home, middle and away. Call a third and a travel style (skip, gallop, bunny hop). Players travel there together.','Say the word as you arrive; slow down before the line','Add a ball each; add a color or number as well as the third','Everyone bunches at one end: split into two groups with a lane each'],
  ['Captain Jobs Setup',6,'All','Edge of the field','Cones, balls, bibs, water bottle','Three captains (cone, ball, water) lead the setup and the end-of-practice pack-up while the others do the dynamic moves.','Say the job aloud; praise helping','Add a fourth job (bib captain); choose captains by drawing a card','Children rush the job: set a 30-second challenge'],
  ['Three Signals Game',8,'All','20 x 20 yd','1 ball each','Players dribble. The coach calls freeze, circle up or go. Add an opposite-day round: when the coach says "go", players freeze, and the reverse.','Whole body stops; ball under the sole','Add a fourth signal; add a pair who call the signals','Ignoring the signal: reduce the space and praise the first to respond'],
  ['Free 3 v 3 Game',15,'3 v 3','25 x 20 yd','2 small goals, bibs','Play with no restrictions. The coach watches how children use the routines, the rules and the thirds, and pauses once to show a picture.','Watch more than you speak; count the minutes of play','Add the rule: everyone touches the ball before a shot','Coach over-instructing: allow two pauses in 15 minutes'],
  ['Weather Check Circle',5,'All','Circle 10 yd','None','Each child shows sunny, cloudy or stormy with a hand sign and a word. Then each shares their try-it goal.','Listen to each child without comment','Add a "what I did well" round at the end','Long turns: use a thumb sign and keep it quick'],
  ['Buddy Challenge',8,'Pairs','20 x 20 yd','1 ball per pair','Buddies pick a try-it goal for the practice together, then share the ball for one minute: each plays 3 touches and passes it.','Say the buddy’s name when passing','Buddies make up a 3-move routine to show the group','Pairs with a big skill gap: let the stronger child lead the explanation']
 ],
 faults:[['Child will not leave the parent','Unfamiliar place or group; a new, bigger class','Let the parent stay close at first; give the child a job and a buddy; invite and never force'],['Children ignore the signals','Signals vary or are given while the group is mid-game','Use only three signals, the same every time; practice as a game with fast rewards'],['Long explanations lose the group','Attention span is short','One sentence, one picture, then play; keep talk under two minutes'],['Arguments over who is captain','Jobs are a big deal at this age','Rotate by a visible card or list; let the group see the order'],['A child cries after a mistake','Low tolerance for failure; comparison with others','Quiet check-in; give a small job; praise the next try, not the outcome']],
 check:'Child names home, middle and away, uses the three signals and does a job without being asked.'
},
{
 n:2, title:'Movement and Agility', short:'Movement',
 lead:'The athletic base of every sport. Kindergarten players skip, gallop, hop and change direction with rhythm, react to what they see and add the ball to the movement.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:2},
 grew:{pre:'Pre-K built balance, stopping on a signal, hopping and soft landing. Traffic Lights was the main game.',k:'Kindergarten adds skipping and galloping with rhythm, plant-and-push changes of direction, reaction games and movement with the ball. Traffic Lights returns as Opposite Lights, a self-control exercise.'},
 basis:[['GALL','Fundamental movement skills: stability, locomotion and manipulation, with mature patterns still forming.'],['LTAD','The Fundamental stage (about ages 6 to 9) emphasizes a broad movement base and agility, balance, coordination and speed.'],['USS','Running, skipping, hopping, jumping and landing, and leaping are part of the technical focus; athleticism is built through ball work.']],
 game:'Mirror Tag: a tag game where the chaser and runner copy movement patterns; no one is out for long.',
 objectives:['Skip and gallop with a smooth rhythm for 15 yards','Balance on one foot for about 8 to 10 seconds on each side','Plant the outside foot and push off to change direction on a signal','Land softly from a jump or hop and stop in balance'],
 outcomes:['Moves in a crowded space without contact','Reacts to a visual signal (mirror a partner, a hand sign)','Keeps good balance while holding or touching a ball','Shows both left and right sides in movement games'],
 concepts:[['Coach term / child language',[['Skipping','"Step-hop"'],['Galloping','"Be a horse"'],['Plant and push','"Stick it and go"'],['Reaction','"Fast eyes"'],['Cross-body movement','"Touch the opposite knee"'],['Landing','"Quiet cat"'],['Rhythm','"Find the beat"']]]],
 why:'Movement skills develop through practice, not age alone. At five and six many children can run and hop but still lose rhythm in skipping, galloping and changing direction. Long-term athlete development models describe this period as an important window for speed, agility and coordination, so every practice includes short, playful movement work before the ball is added. Keep bouts short and fast with full recovery: the goal is quality, not exhaustion.',
 details:[
  {h:'Movement before the ball',p:['Gallahue’s model groups fundamental movement skills into stability (balance, landing, turning), locomotion (run, jump, hop, skip, gallop) and manipulation (kick, throw, catch). A child who has mastered the first two groups finds ball skills much easier, because the body is already organized.','In Kindergarten, movement is not a separate warm-up. It appears in the run start every practice, in the games, and in a dedicated chapter that returns six times a year at higher levels.'],pts:['Practice each pattern on both sides of the body','Use a steady beat (clap or count) for skipping and galloping','Change the pattern every 20 to 30 seconds','Keep the whole class moving; avoid lines'],scene:'lanes'},
  {h:'Speed, agility and rest',p:['Sport scientists who write about long-term athlete development describe the years from about six to nine as an important window for speed and suppleness. For a coach this means short, fast efforts (5 to 10 seconds) with plenty of rest, and games that require quick starts, stops and turns.','Balance is the foundation of agility. A child who can hold a pose for ten seconds can usually land, stop and cut with control. The chart shows planning targets for single-leg balance across the six levels; use them only to compare a child with their own earlier results.'],pts:['Work for 5 to 10 seconds, rest for 20 to 30','Finish each effort in a balanced stop','Never use running or fitness drills as a punishment','Allow walking; children tire at different rates'],chart:'balance'},
  {h:'Plant and push: changing direction',p:['To change direction quickly, a child slows with the last few steps, plants the foot on the side they are turning away from, and pushes off. Say it as "stick it and go". This is the movement skill behind every dribbling turn and every defender’s sidestep.','Start with a cone and a visual signal (a hand sign or a color), then add a ball. Check that knees are bent and the plant foot lands under the body, not in front of it.'],pts:['Slow down before the cone, then plant and push','Cue "bent knees, quiet landing"','Practice a cut to each side','Use the same cue in the run start and in dribbling'],scene:'cut'},
  {h:'Reaction and self-control games',p:['Executive function (holding a rule in mind, stopping an automatic response, switching rules) is improving quickly at this age, and games that train it also build attention for learning. Opposite Lights is a good example: red means go and green means stop. It is the old Traffic Lights game turned into a thinking game.','Mirror games add visual reaction and cooperation: one child leads with simple movements and the partner copies. Both keep movement fun while training attention and body control.'],pts:['Keep rules simple: one twist at a time','Switch the rule every 30 seconds to build flexibility','Praise the effort to stop, not only the speed','Alternate leader and follower often'],scene:'mirror'},
  {h:'Landing, joints and safe play',p:['Landing is a skill. Children should land on the balls of the feet with knees over toes and hips back, and stop in balance. Use low jumps and hops on a soft surface, and teach "quiet cat": if you can hear the landing, it is too stiff.','Warm up with dynamic moves, not static stretching. Skipping, high knees, side shuffles and bunny hops raise body temperature and practice the patterns the practice will need.'],pts:['Land softly on both feet before landing on one','Keep jumps low; no jumping from heights','Check footwear and the surface','Rest between efforts when it is hot']}
 ],
 drills:[
  ['Opposite Lights',8,'All','20 x 20 yd','None','A traffic-light exercise with a twist: green means freeze, red means run, yellow means walk. Switch the rule after 30 seconds.','Brakes on in two steps; soft knees','Add a ball; add a hand-sign version','Children revert to the usual rule: slow the calls and praise the correct stops'],
  ['Skip, Gallop and Hop Lanes',8,'All','Lanes 15 yd','Cones','Move down the lane in a pattern the coach calls: skip, gallop, hop on the left foot, hop on the right. Return in a different pattern.','Smooth rhythm; arms swing opposite to legs','Add a clap beat; add a ball carried in the hands','Unequal rhythm: slow down and say the beat out loud'],
  ['Plant and Push Gates',10,'Groups of 4','15 x 15 yd','8 cones, 4 colored markers','Run to a gate, plant and cut to the side the coach signals, then jog back. Add a ball once the footwork is clear.','Slow, plant, push; knees bent','Cut to a color on the coach’s hand; add a ball','Planting with straight legs: lower the speed'],
  ['Mirror Tag',15,'Pairs or groups','25 x 20 yd','Bibs','A chaser mirrors the runner’s moves (hop, skip, side step). Tag when you are within an arm’s length; swap roles after each tag. Not out: keep playing.','Copy moves exactly; keep eyes on your partner','Add a ball each; add a second chaser','Rough tagging: use two-finger taps on the shoulder'],
  ['Balance and Ball Hold',6,'All','Anywhere','1 ball each','Stand on one foot and hold the ball in the hands. Pass it around the body (waist, knees, head) without losing balance. Switch feet.','Eyes on a spot; arms out when needed','Close the eyes for two seconds; add a ball tap with the other foot','Dropping the foot too soon: lower the count and celebrate each second'],
  ['Hop-Land-Go Circuit',10,'3 stations','10 x 10 yd each','Hoops or flat markers','Station 1 two-foot hops, station 2 left-foot hops, station 3 right-foot hops. After each landing, hold a balanced stop for two seconds, then go. Rotate every 2 minutes.','Land quietly; hold the stop','Combine hop, stop, and sprint to a cone','Tired legs: shorten work to 20 seconds and rest in between']
 ],
 faults:[['Falls on landing','Stiff legs or too much height','Reduce height; cue quiet cat and soft knees'],['Cannot hold balance','Looking around, arms down, or tired','Eyes on a spot, arms out; shorten the hold; celebrate small gains'],['Collisions when moving','Too many players in the space','Enlarge the area or split into two groups'],['Skipping looks like running','Rhythm not established','Slow down and say the beat; practice standing first'],['Cuts with straight legs','Too fast into the turn','Slow before the cone; cue plant and push']],
 check:'Child balances 8 seconds on each foot, skips smoothly and plants and cuts on a signal.'
},
{
 n:3, title:'Ball Mastery', short:'Ball Mastery',
 lead:'Hundreds of touches every practice. Kindergarten players use the sole, the inside, the outside and the laces, link two moves into a pattern, and use both feet.',
 builds:[1,2], focus:{Technical:5,Physical:3,Psychological:3,Social:1},
 grew:{pre:'Pre-K introduced the sole, the inside and the laces with toe taps and rolls.',k:'Kindergarten adds the outside of the foot, linked two-move patterns, rhythm and counting touches in 30 seconds.'},
 basis:[['FA','Maximize touches in the early stage; start with solo touch work, then add small groups and decisions.'],['USS','Ball mastery with both feet and hands; combine movement skills with the ball.'],['KNVB','Technical development through repeated, varied touches with the ball.']],
 game:'Ball Zoo: players dribble in a space and the coach calls an animal; each animal has its own move.',
 objectives:['Use the sole, the inside, the outside and the laces on call','Link two moves (for example sole roll, then inside push) without stopping','Reach about 40 touches in 30 seconds with the inside of the foot','Use the weaker foot for half of the touches'],
 outcomes:['Moves with the ball in a crowded space without leaving the zone','Touches the ball on every step when asked','Changes direction with inside and outside touches','Starts to repeat a pattern in rhythm'],
 concepts:[['Coach term / child language',[['Outside of the foot','"The pinky side"'],['Pull-push','"Pull it back, push it forward"'],['Inside-outside','"Windshield wiper"'],['Learner foot','"My other foot"'],['Rhythm','"Tap, tap, roll"'],['Touch','"One tap"'],['Ball mastery','"The ball is my friend"']]]],
 why:'Learning at this age is mostly implicit: children improve by doing many varied touches, not by listening to explanations. A child with a ball at their feet for most of the practice gets far more useful repetition than a child waiting in a line. The key coaching question is not "how many drills" but "how many touches, and how varied".',
 details:[
  {h:'The four surfaces',p:['Each surface has a job. The sole stops and rolls the ball and is the safest for beginners. The inside guides and passes. The outside (the pinky side) pushes the ball away from a defender and changes direction. The laces drive the ball and are used for shooting.','Children learn the surfaces by name in the first level and use them on call from level 2 onward. Use child language until the names become habit, then switch to the coach terms.'],pts:['Call the surface; children show it with a tap on the ball','Practice each surface with both feet','Say "pinky side" for the outside of the foot','Never correct more than one thing at a time'],scene:'toetap'},
  {h:'Linking two moves',p:['Kindergarten moves from single touches to patterns. The windshield wiper (inside, then outside, with the same foot) and the pull-push (sole pulls the ball back, inside pushes it forward) are the first linked patterns. Link patterns with a rhythm word, such as "tap, tap, roll".','Linking is how the body learns to control the ball without thinking about every touch. Start slowly, then speed up only when the pattern stays smooth.'],pts:['Say the rhythm out loud together','Build the pattern one move at a time','Check that the ball stays within one stride','Let children choose the next move after they master two'],scene:'wiper'},
  {h:'Touch volume and quality',p:['Touch volume matters because skill grows with repetition. A well-organized ten-minute block with one ball per child can deliver hundreds of touches. Quality also matters: the ball should stay close, the touch should be light, and the head should come up when the foot is steady.','Count touches in 30 seconds as a friendly personal challenge. The chart shows illustrative planning targets for the six levels. Use it for self-comparison, never to rank children.'],pts:['One ball per child','Record the best score for each child, privately','Praise improvement over a personal best','Use the same count task at each level'],chart:'touches'},
  {h:'The learner foot',p:['Children naturally favor one foot. If only that foot works, the other will lag, and the gap makes later skills harder. Build both-foot play into every game from the start with a simple rule: every second touch uses the learner foot.','Celebrate attempts with the weaker foot as strongly as successes. Keep the task easy enough that the weaker foot can succeed.'],pts:['Alternate feet with a tick-tock rhythm','Give a bonus point for learner-foot goals','Count weaker-foot touches in the try-it goal','Avoid comparing the two feet aloud']},
  {h:'Toss, bounce and stop',p:['Skills with the ball in the air come later than skills on the ground, because visual tracking of a moving ball is still developing. Start with a toss by hand, a bounce, and a stop with the sole. This links ball mastery to receiving (chapter 5) and to hand-to-foot coordination.','Use soft, lightly inflated balls. Many children flinch from a ball in the air; praise the attempt and keep the height low.'],pts:['Toss low, about waist height','Stop the ball with the sole after the first bounce','Use a soft or slightly deflated ball for beginners','Move to a partner toss once the self-toss is secure'],scene:'bounce'}
 ],
 drills:[
  ['Wiper Touches',8,'All','20 x 20 yd','1 ball each','Tap the ball from the inside to the outside of the same foot like a windshield wiper. 30-second rounds, switching feet.','Small, quick taps; ball stays in the square','Add a step forward after each tap; add a count','Hard touches: ask for light touches'],
  ['Pull-Push Squares',10,'All','Squares 5 x 5 yd','1 ball each, 4 cones per square','Pull the ball back with the sole, then push it forward with the inside. Repeat across the square and back.','Pull, then push; use both feet','Add a turn at the end; race against yourself','Rolling forward too far: shorten the square'],
  ['Tap, Tap, Roll Rhythm',8,'All','20 x 20 yd','1 ball each','Do two toe taps followed by a sole roll, repeating in rhythm. The coach claps the beat; switch feet each round.','Hold the beat; light taps','Change the pattern (tap, roll, push)','Rhythm breaks: slow the beat'],
  ['Ball Zoo',15,'All','25 x 20 yd','1 ball each','Players dribble in the space. The coach calls an animal: snake (sole rolls), crab (side inside-outside), frog (pull-push hops), rabbit (quick taps). Switch every 20 seconds.','Switch quickly; keep the ball close','Players invent a new animal move; two animals together','Collisions: split into two zones'],
  ['Touch Count Challenge',8,'All','20 x 20 yd','1 ball each','Count touches in 30 seconds with the inside only. The coach records each child’s best privately. Repeat later in the practice.','Quick small touches','Beat your own best; add the outside','Counting aloud slows the feet: count on fingers'],
  ['Toss-Bounce-Stop',8,'All','20 x 20 yd','1 soft ball each','Toss the ball low, let it bounce once, and stop it with the sole. Then dribble away with the inside.','Eyes on the ball; soft sole','Toss to a partner; use the inside to stop','Fear of the ball: use a softer ball and a lower toss']
 ],
 faults:[['Steps on the ball','Too fast or looking away','Slow down; ask for light taps'],['Only uses the favorite foot','Habit and comfort','Every second touch with the learner foot'],['Kicks the ball far away','Touch too hard','Reduce the area; reward touches that stay in the zone'],['Pattern falls apart at speed','Linking too fast','Slow to the point where it is smooth, then speed up one step'],['Child gets bored','Same task too long','Change the task every 30 to 60 seconds; give a choice']],
 check:'Child names four foot surfaces and reaches about 40 touches in 30 seconds with the inside.'
},
{
 n:4, title:'Dribbling and Awareness', short:'Dribbling',
 lead:'Moving with the ball at different speeds, turning, protecting it and looking up to choose space. Kindergarten players add speed changes, three turns and shielding.',
 builds:[2,3], focus:{Technical:5,Physical:3,Psychological:3,Social:2},
 grew:{pre:'Pre-K taught close control, heads-up dribbling and avoiding crowds.',k:'Kindergarten adds speed changes, three simple turns, shielding the ball with the body and "photo" scanning where the child reports what they saw.'},
 basis:[['FA','Staying on the ball: shield, screen and turn when there is no safe pass, a 1 v 1 or space to carry the ball.'],['USS','Dribbling and running with the ball with both feet; move the ball forward by dribbling or short passes.'],['USYS','Keep teaching through play; avoid over-coaching.']],
 game:'Sharks and Minnows: dribblers keep the ball safe from sharks who try to win it.',
 objectives:['Dribble through 8 cones without a stray touch','Change speed on a signal: slow, slow, zoom','Perform three turns: inside hook, drag back and stop-turn','Shield the ball with the body for about 5 seconds'],
 outcomes:['Keeps the ball within a stride at medium speed','Looks up and reports what they saw (a color, a number)','Chooses open space in a crowded area','Protects the ball when a chaser comes close'],
 concepts:[['Coach term / child language',[['Speed change','"Slow, slow, zoom"'],['Turn','"U-turn"'],['Shield','"Be a wall"'],['Scan','"Take a photo"'],['Space','"Empty grass"'],['Escape','"Slip away"']]]],
 why:'Young children attend to one thing at a time, usually the ball. The head-up habit is built slowly, by lowering the demand on the feet (slower ball, bigger space) so that attention can be spared for looking around. Turns and shielding add decisions: where is the pressure, and which side should my body be on? Do not expect scanning until the ball is under control.',
 details:[
  {h:'Speed and rhythm',p:['Dribbling at one speed is easy to defend. Kindergarten players learn to vary the pace: slow while looking for space, then a burst when the way is open. The call "slow, slow, zoom" turns this into a game.','The ball must stay within a stride at every speed. If it does not, slow down. Pace comes after control.'],pts:['Inside touches at low speed, laces or outside for speed','Keep head up during the slow part','Zoom only when there is empty grass','Count cones cleared with no stray touch'],scene:'zigzag'},
  {h:'Three turns',p:['The inside hook uses the inside of the foot to pull the ball around the standing leg. The drag back uses the sole to pull the ball backward and turn. The stop-turn stops the ball with the sole and spins away. Together they let a player escape a chaser or change direction without losing the ball.','Teach one turn per practice and review the others. Use a cone as an imaginary defender and finish each turn with a burst of speed.'],pts:['Slow down before the turn','Turn the body as well as the ball','Accelerate after the turn','Practice both feet'],scene:'turn'},
  {h:'Scanning like a photo',p:['Scanning means taking a quick look around and noticing the space. Kindergarten turns scanning into a game: the coach holds up a number or color, and the dribbler takes a "photo" and says what they saw. The child learns to lift the head without losing the ball.','Over time, the photo becomes information: "there is empty grass on my left". This is the beginning of decision-making.'],pts:['Look up every three touches','Say what you saw, not what you think the coach wants','Use colors, numbers or shapes as targets','Reduce speed if eyes stay down'],scene:'fingers'},
  {h:'Shielding',p:['Shielding means keeping the body between the ball and the chaser. The child dribbles with the ball on the side away from the pressure and uses the arm out for balance (not to push). The FA lists a 1 v 1 and no safe pass as moments to stay on the ball and shield.','Start with a slow chaser who only follows. Add speed and pressure only when the child can hold the ball for five seconds.'],pts:['Sideways stance, ball on the far foot','Arm for balance, no pushing','Look over the shoulder','Stay on your feet and keep moving'],scene:'shield'},
  {h:'Dribbling in a crowd',p:['A crowded space forces choices: turn, speed up, shield or pass. Children learn that open space is where they can play freely. Keep the crowd small enough that the game is a challenge, not a collision.','The chart shows illustrative targets for clearing cones with no stray touch. Use it for self-comparison only.'],pts:['Use colored zones or bibs to show empty areas','Rotate groups to avoid crowding','Reward the player who finds space, not only the one who scores','Add gates to give a purpose to the dribble'],chart:'dribble'}
 ],
 drills:[
  ['Slow-Slow-Zoom',8,'All','20 x 20 yd','1 ball each','Dribble slowly. On the call "zoom", sprint with the ball for 5 yards, then slow down again.','Close touches at speed; look up in the slow part','Add a turn after the zoom; use only the weaker foot','Ball escapes: shorten the burst'],
  ['U-Turn Cones',10,'Groups of 4','Lanes 15 yd','Cones at each end','Dribble to the cone, perform the turn the coach has chosen (inside hook, drag back or stop-turn), and accelerate back.','Slow, turn, go','Choose your own turn; add a second cone','Turning too wide: use a tighter cone'],
  ['Photo Dribble',8,'All','20 x 20 yd','1 ball each, a bib in each hand for the coach','The coach holds up a color or a number. Dribblers take a photo and shout what they saw.','Quick look, then back to the ball','Two coaches; show a pattern (two numbers)','Looking without moving the ball: ask for both'],
  ['Sharks and Minnows',15,'All','25 x 20 yd','Balls, bibs','Two or three sharks without balls try to win a dribbler’s ball. A dribbler who loses the ball becomes a shark. Dribblers can shield.','Space, turn, shield','Add more sharks; add a second ball per dribbler','Frustration: rotate roles quickly'],
  ['Wall Shield',8,'Pairs','10 x 10 yd','1 ball per pair','The dribbler keeps the ball safe for 5 seconds while the partner follows without tackling. Swap roles.','Body between ball and chaser','Chaser tries to win the ball; add a 10-second count','Pushing: reduce the contact and reset the rules'],
  ['Gates Race',8,'All','20 x 20 yd','10 gates (2 cones each)','Dribble through as many gates as possible in 60 seconds. Never twice through the same gate in a row.','Look for open gates','Use the weaker foot only; add a color rule','Same gate repeatedly: add a rule']
 ],
 faults:[['Ball always far from feet','Large touches','Slow down; count touches per step'],['Head stays down','All attention is on the ball','Slower pace and bigger space before asking for looks'],['Dribbles into crowds','Not scanning for space','Use zones; ask "where is the empty grass?"'],['Turns lose the ball','Turn too wide or too fast','Slow before the turn; tighter cone'],['Pushes when shielding','Excitement or fear','Cue "arm for balance"; slow the chaser']],
 check:'Child dribbles through 8 cones, turns on a signal and shields the ball for 5 seconds.'
},
{
 n:5, title:'Receiving and Control', short:'Receiving',
 lead:'Controlling a passed ball and a ball that bounces, then using the first touch to go where you want. Kindergarten moves from stopping rolled balls to controlling moving balls.',
 builds:[3,4], focus:{Technical:5,Physical:2,Psychological:3,Social:3},
 grew:{pre:'Pre-K stopped slow rolled balls with the sole or inside of the foot.',k:'Kindergarten controls passed balls at moderate pace, controls a ball after one bounce, opens the body and takes the first touch into space.'},
 basis:[['USS','Receiving is part of the ball-mastery focus; both feet and hands are used to move the ball.'],['USYS','Visual tracking, especially of balls in the air, is still developing, so children often flinch.'],['FA','Add light decisions only after the technique is secure.']],
 game:'Two Zones: teams of three try to pass to a teammate in the end zone, who must control the ball before the point counts.',
 objectives:['Control a passed ball from 5 to 8 yards with the sole or the inside','Take the first touch to the side, away from a cone or defender','Control a ball after one bounce with the sole or inside','Take one quick look before the ball arrives'],
 outcomes:['Meets the ball rather than waiting for it','Keeps the ball within one stride after the first touch','Shows the side of the body (open body) when receiving','Plays the next touch with purpose'],
 concepts:[['Coach term / child language',[['Cushion','"Pillow foot"'],['Directional touch','"Receive and go"'],['Open body','"Show your side"'],['Peek','"Take a quick look"'],['Bounce control','"Soft landing for the ball"'],['Meet the ball','"Go and get it"']]]],
 why:'Receiving requires the child to judge the speed and direction of a moving object and coordinate a relaxed foot at exactly the right moment. Eye-foot tracking is still maturing at age five and six, so start with slow passes and keep success rates high before adding pace. The first touch is the link between control and the rest of the game: it decides where the next action happens.',
 details:[
  {h:'Eyes and feet: tracking a moving ball',p:['US Youth Soccer guidance notes that visual tracking of balls in the air is still developing, so children often duck or cover their faces. That is normal. The solution is not to demand bravery but to keep the ball low and slow, use soft balls, and grow the challenge in small steps.','Cushioning is the key technique: the receiving foot is relaxed and gives slightly as the ball arrives, like a pillow. Start with the sole, then the inside.'],pts:['Foot slightly off the ground, toes up','Soft ankle that gives back','Eyes on the ball until it stops','Use a soft ball for beginners'],scene:'cushion'},
  {h:'Directional first touch',p:['Instead of stopping the ball dead, Kindergarten players start to play the first touch into space: to the side, away from a cone or defender, and in the direction they want to go next. This is called a directional touch ("receive and go").','Open the body by showing the side to the passer, so the touch is natural in both directions. Start with a cone as the target for the touch, then add a defender.'],pts:['Show your side to the passer','Touch with the foot farther from the cone','Accelerate after the touch','Use both feet'],scene:'receive'},
  {h:'Bounce control',p:['A ball that bounces is harder because it changes direction and height. Teach the child to wait for the ball to drop after the first bounce, then stop it with the sole or take it with the inside. A toss from the hands to a partner is the first step.','Keep the bounce low and the pace slow. This links back to Chapter 3 (toss, bounce and stop).'],pts:['Let it bounce once, then control','Sole on top of the ball, toes up','Use soft, lightly inflated balls','Praise brave attempts'],scene:'bounce'},
  {h:'The peek',p:['Taking a quick look before the ball arrives is the first step toward good decisions. The peek lasts less than a second: eyes up, find the space, eyes back to the ball.','Children who peek early have more time on the ball. Practice it with the same photo game from Chapter 4, now with a passer feeding the ball.'],pts:['Look once before the ball arrives','Say what you saw if the coach asks','Do not let the look cost the control','Start with a slower pass'],chart:'control'}
 ],
 drills:[
  ['Pillow Foot Passes',8,'Pairs','6 yd apart','1 ball per pair','Partners pass gently. The receiver cushions the ball with the sole, then the inside, and passes back.','Relaxed foot; meet the ball','Move apart; use the weaker foot','Ball bounces away: slow the pass'],
  ['Receive and Go Gates',10,'Groups of 3','15 x 10 yd','Cones for gates','A passes to B. B takes the first touch through a side gate and dribbles to the next cone, then passes to C.','Show your side; touch and go','Add a defender who walks; add a color call for the side','Stopping the ball dead: ask for a first touch toward the gate'],
  ['Bounce Catch With Feet',8,'Pairs','5 yd apart','Soft balls','A partner tosses the ball low. The receiver lets it bounce and controls it with the sole or inside.','Eyes on the ball; sole on top','Toss slightly to the side; add a quick pass back','Fear of the ball: use a softer ball and a lower toss'],
  ['Two Zones Game',15,'3 v 3','25 x 20 yd','2 end zones, bibs','Teams try to pass a ball into the end zone to a teammate who controls it. A controlled ball scores one point.','Control first, then look','Make the zone smaller; add a bonus for a first touch forward','Passes too hard: coach a softer pass'],
  ['Peek and Turn',10,'Groups of 3','15 x 15 yd','Cones','A passes to B. B peeks, takes the first touch away from the cone, turns, and passes to C.','Look early; turn on the first touch','Add a passive defender; swap roles','Looking too late: pass slower'],
  ['Coach Feed Lanes',8,'Groups of 4','Lanes 10 yd','Balls','The coach feeds each child a pass. The child controls, dribbles around a cone and back.','Move to the ball; control and go','Faster feed; use the weaker foot','Waiting for the ball: step to meet it']
 ],
 faults:[['Ball bounces off the foot','Stiff ankle','Pillow-foot cue; slower pass'],['Waits for the ball to arrive','Passive stance','Step toward the ball as it comes'],['Stops the ball with the toe','Poor foot angle','Use the sole or inside; demonstrate a flat foot'],['Back to the passer','No open body','Show the side; start with a larger space'],['Looks away and loses the ball','Peeks too early or too long','Peek once, then back to the ball']],
 check:'Child controls 5 of 10 passes from 6 yards and takes a first touch to the side.'
},
{
 n:6, title:'Passing and Combination', short:'Passing',
 lead:'Passing becomes a team tool. Kindergarten players pass accurately with the inside of the foot, support at an angle, play a give-and-go and pass under light pressure.',
 builds:[3,5], focus:{Technical:4,Physical:2,Psychological:3,Social:5},
 grew:{pre:'Pre-K passed with the inside foot at 5 yards, called the name and moved after passing.',k:'Kindergarten adds pass weight, support angles, the give-and-go with a wall and 3 v 1 and 4 v 2 pressure.'},
 basis:[['USS','Move the ball forward by dribbling or making short passes; no fixed positions.'],['FA','Introduce decisions gradually; passing is learned in small groups and games.'],['DFB','Small teams give more touches and more passing opportunities.']],
 game:'4 v 2 Keep-Away: four players keep the ball from two defenders, with a point for five passes.',
 objectives:['Pass accurately with the inside of the foot from 8 yards','Move to an angle to support a teammate who has the ball','Play a give-and-go off a cone wall or a teammate','Pass and receive in a 3 v 1 or 4 v 2 with light pressure'],
 outcomes:['Chooses a pass when it is the best option','Uses the right weight so the pass reaches the teammate','Calls the name and moves after the pass','Understands "pass and move"'],
 concepts:[['Coach term / child language',[['Pass','"Share the ball"'],['Support angle','"Make a triangle"'],['Wall pass','"Ball bounces back"'],['Weight of pass','"Not too hard, not too soft"'],['Give and go','"Pass and run past"'],['Rondo','"Monkey in the middle"']]]],
 why:'Passing is a social behavior as much as a technical one. Five- and six-year-olds are often self-focused, and this is normal. They pass when passing leads to something fun: a point, a goal, or running past a defender. Give children reasons to pass, not instructions to share. Cooperation appears around age six and grows through game design.',
 details:[
  {h:'Weight and accuracy',p:['The inside pass is accurate because the foot has a wide, flat surface. The plant foot sits beside the ball and points to the target, the passing foot is turned out and the ankle is locked, and the leg follows through toward the target. Weight (how hard) matters as much as direction: too hard and the teammate cannot control; too soft and the pass is intercepted.','Increase the distance slowly. At 8 yards most children need a firmer ankle and a longer swing; at 5 yards a gentle push is enough.'],pts:['Plant, point, strike, follow','Lock the ankle and keep toes up','Aim to the teammate’s front foot','Increase distance only when 7 of 10 are accurate'],chart:'pass'},
  {h:'Support angles',p:['A teammate standing behind the ball carrier or directly in line is hard to pass to. Kindergarten players learn to move to an angle, which makes a triangle with the passer and the next space.','Use cones for the triangle at first, then remove them. Ask: "Where would you stand so your friend can see you?"'],pts:['Stand a few steps away, not too far','Make a triangle with the ball carrier and the free space','Call the name','Show the open side of the body'],scene:'triangle'},
  {h:'Give and go',p:['The give-and-go (or wall pass) is the simplest combination: pass to a teammate, run past a defender, and receive the ball back in space. It teaches that passing is not the end of your involvement; it is the start of a run.','Start with a cone wall that returns the ball (or a coach who acts as the wall). Then use a teammate who passes back with one touch.'],pts:['Pass, then run past the cone','Call for the return ball','Accelerate after the pass','Receive in space and dribble or shoot'],scene:'giveandgo'},
  {h:'Rondo: 3 v 1 and 4 v 2',p:['Rondo (keep-away in a small space) is a staple of European training. It creates many passes, constant decisions and a clear reason to support. At this age, keep it simple and kind: a passive defender at first, then an active one.','Rules that help: two-touch maximum, defender swaps after winning the ball, and a point for five passes in a row.'],pts:['Keep the square small enough for success','Start with a passive defender','Swap the defender after every win','Celebrate passes as much as goals'],scene:'rondo'},
  {h:'When to pass and when to dribble',p:['The decision between passing and dribbling is a lifelong learning task. For ages 5 and 6, give a few simple cues: pass if a teammate is open and facing you; dribble if there is space ahead; shield if there is pressure and no pass.','Do not force passes. A child who dribbles to lose a defender is learning, too. Praise a good decision whichever option they choose.'],pts:['Ask: "What did you see?" after the play','Reward a pass that leads to a shot','Reward a dribble that finds space','Use game rules to encourage passing without commanding it']}
 ],
 drills:[
  ['Partner Passing Gates',8,'Pairs','8 yd apart','1 ball per pair, gates','Pass through a gate to the partner. Each time the pass reaches the partner, step back one pace.','Plant, point, strike','One-touch passes; weaker foot','Passing too hard: practice speed'],
  ['Give-and-Go Cone Wall',10,'Groups of 3','15 x 10 yd','Cones for the wall','The player passes to the cone wall (or to a teammate standing at the cone), runs past it, and receives the ball back on the other side.','Pass, run past, receive','Add a passive defender; vary the angle','Stopping after the pass: use a go signal'],
  ['Triangle Rotation',10,'Groups of 3','Triangle 8 yd','1 ball per group, 3 cones','Pass to the next player and move to the next cone. After 10 passes change direction.','Call, pass, move','Add a second ball; use the weaker foot','Players stop: use a count'],
  ['4 v 2 Keep-Away',15,'4 v 2','12 x 12 yd','Balls, bibs','Four players try to make five passes without the defenders touching the ball. A defender who wins the ball swaps with the passer.','Make yourself easy to pass to','Two-touch limit; add a goal','Hogging the ball: rule of two touches'],
  ['3 v 1 Corner Squares',10,'Groups of 4','8 x 8 yd','Balls, bibs','Three players keep the ball from one defender. After five passes the passer swaps with the defender.','Support at an angle','Defender becomes active; small gate for a bonus','Defender too strong: reduce pressure'],
  ['Pass to Score Game',10,'3 v 3','25 x 20 yd','Small goals, bibs','Play 3 v 3 with a rule: a goal counts only if the team made three passes first.','Look for a teammate','Make it two passes; add a bonus for a give-and-go','Rule slows the game: shorten to two passes']
 ],
 faults:[['Passes go wide','Plant foot points elsewhere','Plant foot toward the target; shorten distance'],['Passes with the toe','Habit from kicking','Inside-of-foot cue; "kick with the side"'],['Hogs the ball','Wants to keep control','Use games that reward passing, such as 4 v 2 with five passes'],['Support stands behind the ball','No angle','Mark a triangle with cones; ask where the free space is'],['Passes too hard','Overcorrecting accuracy','Practice weight with a target zone at the feet']],
 check:'Child makes 6 of 10 accurate inside passes from 8 yards and supports at an angle.'
},
{
 n:7, title:'Shooting and Finishing', short:'Shooting',
 lead:'Every child scores often. Kindergarten players shoot with a run-up, finish with the inside of the foot, shoot after dribbling or receiving, and follow the shot for a rebound.',
 builds:[3,4,6], focus:{Technical:5,Physical:3,Psychological:4,Social:2},
 grew:{pre:'Pre-K struck a still ball with the laces at a big goal.',k:'Kindergarten adds a short run-up, the inside finish, shooting after dribbling or receiving, following the shot, and a simple rule for shot choice.'},
 basis:[['USS','Shooting games give every player many chances to score; the focus is on repeated attempts.'],['DFB','Several small goals and a shooting zone increase the number of shots.'],['SDT','Success and choice build the sense of competence that keeps children shooting.']],
 game:'Four Small Goals: 3 v 3 where each team attacks two small goals and defends two.',
 objectives:['Strike a ball with the laces after a 2 to 3 step run-up','Finish at close range with the inside of the foot','Shoot after a dribble and after receiving a pass','Follow the shot and play the rebound'],
 outcomes:['Shoots with either foot','Aims for a corner of the goal, not just the middle','Keeps playing after a shot','Chooses to shoot when there is a clear view of the goal'],
 concepts:[['Coach term / child language',[['Finish','"Pass it into the net"'],['Run-up','"Take two steps and swing"'],['Rebound','"Second chance"'],['Placement','"Aim for a corner"'],['Shot choice','"Clear view means shoot"'],['Follow the shot','"Chase your shot"']]]],
 why:'Shooting is the most motivating action in the game. Use that: keep the number of shots high and success rates fair with big goals and short distances. Praise attempts, because fear of missing is the main thing that stops young players from shooting. Confidence grows when children see that missing is normal and that rebounds give a second chance.',
 details:[
  {h:'Laces with a run-up',p:['A short run-up adds power. The last step lands the plant foot beside the ball, toes pointing at the target. The kicking foot swings through the center of the ball with the ankle locked and toes down, and the leg follows through toward the target.','Teach the run-up as "take two steps and swing". Do not worry about long distances; accuracy and a clean strike are more important than power.'],pts:['Eyes on the ball at contact','Plant beside the ball','Lock the ankle, point the toes down','Swing through the target'],scene:'shoot'},
  {h:'The inside finish',p:['At close range, the best finish is often a pass into the net. The inside of the foot is more accurate than the laces, and a simple, calm finish teaches children that scoring is not only about power.','Practice rolling the ball into a small goal from three or four yards. Add a defender, then a goalkeeper.'],pts:['Plant beside the ball, toes to the goal','Inside of the foot through the middle','Follow through low','Celebrate quiet finishes'],scene:'shoot'},
  {h:'Shooting after moving',p:['Games rarely give a still ball. Kindergarten players practice shooting after a dribble (three touches, then shoot) and after receiving a pass (control, then shoot). The skill is the same, but the timing and the decision are new.','Begin with a slow dribble and a still ball in front of the goal; build up to a shot on the move.'],pts:['Dribble, look up, then shoot','Control with one touch and shoot with the second','Use both feet in turn','Reduce goal size only after most shots hit the target'],scene:'shoot'},
  {h:'Rebounds and keep playing',p:['Many goals are scored from rebounds. Children who stop after the shot miss the second chance. Teach "chase your shot" as a habit.','This also gives a natural link to goalkeeping (chapter 11): keepers learn to hold or push the ball away from danger, and shooters learn to follow.'],pts:['Shoot, then run after the ball','Second shooter waits at the edge','Praise the chase more than the goal','Keep a rebound game going until the ball is cleared'],scene:'rebound'},
  {h:'Shot choice and mindset',p:['A simple rule for shot choice at this age: if you can see the goal and have space, shoot. If a teammate has a better chance, pass. The coach’s job is to praise both decisions.','The chart shows illustrative planning targets for shots on target. Use them for self-comparison only; missing is part of learning.'],pts:['Ask: "What did you notice?" after a miss','Cheer for all attempts','Rotate shooters so all get turns','Keep success rates fair with goal size and distance'],chart:'shoot'}
 ],
 drills:[
  ['Run-Up Strike',8,'Pairs','Goal 10 yd','1 ball per pair, small goal','Place the ball, take two steps and strike with the laces at a goal. Take 10 shots each.','Plant, laces, swing through','Move farther back; use the weaker foot','Toe poke: demonstrate laces'],
  ['Inside Finish Gates',8,'Groups of 4','Goal 4 yd','Small goals or gates','Roll the ball into a small goal with the inside of the foot from different angles.','Inside through the middle','Add a passive defender; weaker foot only','Hitting too hard: ask for a gentle touch'],
  ['Dribble, Receive, Shoot',10,'Groups of 4','20 yd','Ball, goal','Dribble three touches and shoot. Then receive a pass from a teammate at the edge and shoot.','Look up before the shot','Add a passive goalkeeper; vary angles','Slowing down before the shot: ask for a steady speed'],
  ['Four Small Goals',15,'3 v 3','25 x 20 yd','4 small goals, bibs','Each team attacks two small goals and defends two. After a goal, the other team restarts.','Shoot when there is a clear view','Add a shooting zone; no goals from outside','Shooting from too far: draw a shooting line'],
  ['Rebound Chaos',8,'Groups of 3','Goal 10 yd','Balls, goal','One shoots, one acts as a goalkeeper, one waits at the edge to chase the rebound. Rotate after each shot.','Shoot, then chase','Two balls; limit touches','Standing still after the shot: give a bonus for chasing'],
  ['Goal Fiesta',10,'All','Small field','Many small goals','Free play with many goals so everyone scores. Teams change every 2 minutes.','Encourage shots','Add team scores; add a pass before a shot','Passing too much: introduce a shot rule']
 ],
 faults:[['Toe poke','Habit and nerves','Laces cue; demonstrate the foot shape'],['Plant foot too far away','Misjudged distance','Mark a spot beside the ball with a cone'],['Does not follow through','Stops the leg at contact','Cue "swing through the goal"'],['Shoots only at the middle','Aiming is hard','Place a target cone in each corner'],['Stops after the shot','No habit of following','Add a bonus for the rebound']],
