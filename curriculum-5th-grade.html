  bridge:['From 4th Grade to 5th Grade','5th grade is built on the twelve 4th-grade chapters. Ten chapters grow in place with faster, harder and more game-like work. Two chapters are new: Set Plays (split out of the rules chapter) and Game Intelligence and Mind. Formats grow from 7 v 7 and 8 v 8 to 8 v 8 and 9 v 9.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+ul(['Chapters 1 to 8 keep their place and grow: longer sprints with full rest, volleys and crosses with the feet, zonal marking, third-man runs and overloads in the final third','Chapter 9 (Positions) becomes advanced roles: center back, full-back, holding midfielder, attacking midfielder, wide player and striker, with the numbered positions 1 to 11 as a shared language','Chapter 10 (Tactics) moves to 8 v 8 and 9 v 9 with build-up through the lines, pressing traps and transitions','Chapter 11 (Goalkeeper) adds crosses, 1 v 1 and distribution under pressure','Chapter 12 (Rules) goes deeper: the offside rule in full, penalty shoot-outs, denying a goal-scoring chance, the card ladder, added time and the assistant referee flag','Chapter 13 is new: Set Plays (corners, free kicks, throw-ins and restarts) as their own chapter, because they are the fourth phase of the game','Chapter 14 is new: Game Intelligence and Mind (scanning, decisions under pressure, review habits and self-talk)'])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In 4th grade','Now in 5th grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['More chapters: fourteen instead of twelve, so 84 practices instead of 72 and a season that runs about six weeks longer','Advanced positions: six field roles plus the goalkeeper, learned by playing them, with rotation kept (see the Positions page)','Advanced tactics: build-up through the lines, pressing traps, blocks, five shapes and a half-time plan (see the Tactics page)','More intensity: laps, sprints and duels grow, and the finale reaches 9 v 9 in Levels 5 and 6; rest stays full and power work stays light','More resources: eight new tools, including role cards, numbered bibs, a referee kit, a phone tripod, balance pods, reaction lights, a rebounder frame and a youth goal (see the Tools page)','More rules: nine new rules, including penalty shoot-outs, denying a goal-scoring chance, the card ladder, added time and the assistant referee flag (see the Rules page)','More resources for the mind: scanning counts, review with a phone clip (with parent permission) and if-then plans'])+`<h4 class="sp">Check on day one</h4>`+ul(['Can the group hold a 4th-grade shape (3-3-1 or 2-3-2) for a full round? If not, spend the first weeks of chapters 9 and 10 at Level 1 and 2 pace','Can children name the four phases and give one job in each?','Does every child know the offside rule in full? If not, use the chapter 12 Level 1 and 2 exercises as the refresher','Do you have enough bibs in four colors and numbers? Roles and numbers are used in every shape','Record birth months and any growth concerns before the first sprint practice (see the Body and Safety pages)'])],
  develop:['How 10 and 11 Year Olds Develop','What is changing in the child and what each change makes possible in soccer. Every chapter links to this page.',()=>`<p>The KNVB’s Jolles report describes children aged about ten as leaving a playful stage: they follow longer instructions and hold a role for several minutes, while self-evaluation and empathy develop mainly from early adolescence, so concrete feedback and small responsibilities work better than abstract talk. Jolles also advises against selecting players early. The FA’s Youth Development Phase principles ask for a game-based approach with many decisions, and its 12 to 16 playing philosophy shows where the road goes next. Around ten and eleven many children, especially girls, begin a growth spurt, so size, strength and coordination can change within a few months. Many coaches call ages 9 to 12 a golden age of learning technique; we treat that as a popular idea, not a proven fact, because the paper we looked for was not opened.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[
   ['Friendship and fairness','Strong sense of fairness; groups form; arguments about rules','Helper referees, rule games, fair-play points, rotating partners','1, 12'],
   ['Comparing with others','Notices who is faster or better; self-evaluation is early','Own-best targets, no rankings, position rotation for every child','1, 2, 9'],
   ['Planning ahead','Can remember a plan for a whole half and follow a fixed order','Set plays with numbers and steps, half-time plan, build-up pictures','10, 13'],
   ['Attention and focus','Longer focus, but varies','Two or three cues, scanning counts, quick looks','14'],
   ['Empathy and brain change','The brain is becoming more responsive to peers; mistakes sting more in front of friends','Kind words, mistake of the day, review in pairs','1, 14'],
   ['Coordination','Often strong, but a growth spurt can briefly make children clumsy','Ladder, dots, hurdles, balance pods, plyo boxes; repeat basics','2, 3, 4'],
   ['Eye-foot control','Tracks moving and bouncing balls well','Volleys with a soft ball, chest and thigh control, crosses with the feet','4, 5, 6'],
   ['Understanding of space','Sees the whole field and two passes ahead','Third-man runs, overloads, shapes, lanes','8, 10'],
   ['Understanding of roles','Knows what a teammate in another role does and why','Advanced positions, pressing traps, set-play jobs','9, 10, 13'],
   ['Resilience','Mistakes still sting; peer judgement matters','Mistake of the day, brave tries, a reset routine','1, 14']
  ])+`<h4 class="sp">Growth spurts and training load</h4><p>Lloyd and colleagues’ 2014 consensus statement on youth resistance training says that technique comes first, sessions are supervised, loads start at body weight or light, and training is spread across two or three non-consecutive days with full rest for power work. An intervention study abstract on the adolescent growth spurt (University of Bath) suggests that injury risk rises around peak growth and that load can be adjusted; we read only the abstract, so we use it as a pointer. In practice: watch for knee or heel pain, reduce jumping and long runs for a child who is growing quickly, and never compare children by size.</p><h4 class="sp">Skill readiness map for 5th grade</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[
   ['Sprinting and agility','30-yard sprints with full rest; cuts on a cue; box jumps with soft landings','Reaction lights; repeated sprints with partner rest; bands','Heavy resistance; long repeated runs'],
   ['Ball control','Two feints in a row; thigh and chest control; control of bouncing balls','First touch away from pressure under a time limit','Heading'],
   ['Passing','25 to 30 yard ground passes; weight of the pass; through passes','Lofted switches; combination patterns in threes and fours','Long passes over 35 yards'],
   ['Shooting','Instep power from 15 yards; half-volleys; 1 v 1 against the keeper','Volleys from a cross; finishing under a defender','Power shots from distance'],
   ['Defending','Press and cover; goal-side recovery; zonal marking in a block','Pressing traps; defending crosses','Sliding tackles'],
   ['Tactics','Roles; shapes; four phases; build-up','Changing shape in a game; set-play plans','Complex formations'],
   ['Goalkeeping','Dive both sides; narrow an angle; W-grip catch; crosses','1 v 1; distribution under pressure','Specialist training']
  ])+`<p class="note">This readiness map is our own judgment, based on the sources on the Sources page. Check it against your own group. Children can differ by nearly two years in age and by much more in size and maturity.</p>`],
  theory:['Game Ideas for Ages 10 to 11','Tactics are still taught as ideas inside games, now with the right words. 5th grade adds advanced positions, build-up through the lines, pressing traps, set plays and scanning.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Build from the keeper, find the free player, third-man runs, overloads, width and depth, finish. Chapters 5, 8, 10 and 11.</p></div><div class="card"><h4>They have the ball</h4><p>Press on a trigger or a trap, zonal marking, cover, stay compact, recover goal-side. Chapters 7 and 10.</p></div><div class="card"><h4>Switch and restart</h4><p>Win it and go within three seconds; lose it and press or drop; restarts are planned. Chapters 10 and 13.</p></div></div><p>The headings follow the four moments used in the FA’s England DNA: in possession, out of possession, transition and set plays. The FIFA Training Centre asks for simple tactical ideas added gradually with little instruction; its article on U12 players in Clearwater (USA) describes a combinative style built on short passing and support, which is what chapters 5 and 8 practise. At this age the words are still child language.</p><h4 class="sp">The four phases of play</h4>`+tbl(['Phase','Child language','What we practice'],[['Attack','We have the ball','Build from the back, support, width, depth, penetration, third-man runs, shoot'],['Defend','They have the ball','Press, trap, cover, compact, zonal marking, recover'],['Transition','Switch','Win it and go in three seconds; lose it and press or drop'],['Restart','Ball out or foul','Corners, free kicks, throw-ins, kick-off and goal kicks as planned moves']])+`<h4 class="sp">Principles, in plain words</h4>`+tbl(['Principle','Plain words','Chapter'],[['Support','Be near enough to help, at an angle the passer can see','8'],['Width','Stretch the field with players near the sidelines','8, 10'],['Depth','Someone stays in front and someone behind the ball','8, 10'],['Third man','Run to the space the pass will make, not to the ball','8'],['Overload','Play where you have more players than they do, then switch','8'],['Compactness','Stay close together when they have the ball','7, 10'],['Cover and balance','Stand behind the pressing teammate; the far player guards the far side','7, 10'],['Scan','Look before you get the ball and again after the first touch','14']])+`<h4 class="sp">Offside in 5th grade</h4><p>Children have met the idea (stay level), the last 14 yards step and the full IFAB Law 11 with interfering with play. This year adds the point that there is no offside offence from a goal kick, a throw-in or a corner kick, and the assistant referee flag. The FFF used the last 13 m only at U10 and U11; its U13 rules judge offside from the halfway line, and the KNVB 8 v 8 match form for O11 and O12 has no offside, so check what your league plays.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate facing you','Pass','5'],['The near side is crowded','Switch to the far side','5, 10'],['Empty grass ahead','Dribble and change pace','3'],['A defender in front and a gap behind them','Feint then burst, or a through pass','3, 5'],['Two players near the ball and one free runner','Third-man run: pass, then the runner receives the next pass','8'],['They have the ball and you are nearest','Press; the next player covers','7'],['A bad touch by them or a back pass','Press trigger: go together','7, 10'],['The ball goes wide and your team is behind it','Trap: close the line and press','10'],['You win the ball','Go within three seconds','10'],['The ball is out','Name the restart and the plan','13']])+`<h4 class="sp">Questions that teach</h4>`+ul(['What did you see before you got the ball? What did you see after your first touch?','Which option did you choose, and why?','Where was the free player or space?','What was the plan? What would you change at half time?'])],
  positions:['Positions: Advanced Roles','Seven roles introduced as jobs, learned by playing each one. Chapter 9 teaches them; chapters 10, 11 and 13 use them. Every child still rotates through the roles during the year.',()=>`<p>At this age we teach positions as jobs with and without the ball, not as a place a child is stuck in for life. Jolles advises against specialising or selecting early, the DFB gives goalkeepers regular time from the E-Jugend, and the KNVB lineup page treats positions as tasks tied to the shape. U.S. Soccer’s guidance (a secondary source) says to try all positions. The numbered positions (1 goalkeeper, 2 and 3 full-backs, 4 and 5 center backs, 6 holding midfielder, 7 and 11 wide players, 8 central midfielder, 9 striker, 10 attacking midfielder) are a common world-wide convention that we use as a shared language; they are background knowledge, not a rule. Position bibs and numbered bibs show the job; bibs swap when roles rotate.</p>`+tbl(['Position','With the ball','Without the ball','Good habits to praise','Where in our shapes'],[
   ['Goalkeeper (1)','Start play with a roll, throw or kick from the ground; be a safe pass for the defenders; pick the target','Narrow the angle, catch, save, talk, come out for balls over the top, organise the wall','Loud voice, early position, quick release','Ch 11; the back player in every shape'],
   ['Center back (4, 5)','Pass safely, split to receive from the keeper, step forward with the ball when there is space','Stay goal-side, cover the partner, win the header-free duel on the ground, call the line','Calm on the ball, talking, staying on their feet','2 or 3 at the back'],
   ['Full-back (2, 3)','Overlap or underlap, support the winger, cross low','Stay compact, close the wide player, recover fast','Timing of the run, honest recovery','Wide at the back in 3-3-2 or 2-4-2'],
   ['Holding midfielder (6)','Offer a safe pass, switch the play, turn quickly','Screen the defence, press the first pass, win second balls','Scanning, short passes, staying in position','Middle in 3-3-1, 3-3-2 and 2-4-2'],
   ['Central midfielder (8)','Link lines, make third-man runs, arrive in the area','Press as a group, track runners, cover','Running both ways, support angles','Middle in every shape'],
   ['Attacking midfielder (10)','Find pockets of space between lines, play the last pass, shoot','Press the first defender and block the pass into the 6','Vision, quick decisions, first-time passes','Behind the striker in 3-2-3'],
   ['Wide player (7, 11)','Stay wide, take on a defender, cross low or cut inside','Track back, help the full-back, stay compact when the ball is on the other side','Staying wide, bravery in 1 v 1, tracking back','Wide in 3-3-1, 3-3-2 and 3-2-3'],
   ['Striker (9)','Move to open a lane, finish, hold the ball and lay it off','Press the first defender, set the press trigger, block the pass','Movement before the pass, finishing, first press','At the front in every shape']
  ])+`<h4 class="sp">How we teach positions</h4>`+ul(['Learn the job in a small game first (3 v 3 or 4 v 4), then place it in an 8 v 8 or 9 v 9 shape','Rotate every child through every role, including goalkeeper, across the year; never keep a child in one place because they are big, fast or good','Say the job in one sentence, then show it: “Full-back: overlap when the winger holds the ball.”','Use role cards in the pocket and numbered bibs so children can say “my 6” and find each other','Ask the child what the job is before and after the game','Change bibs, not the idea: the same child may wear a defender bib on Tuesday and a striker bib on Thursday'])+`<h4 class="sp">Positions in our shapes</h4>`+tbl(['Format','Shape','Jobs'],[['8 v 8','3-3-1','3 defenders (center back and two full-backs), 3 midfielders (one 6 and two 8s or wide players), 1 striker, plus the goalkeeper'],['8 v 8','2-3-2','2 center backs, 3 midfielders, 2 forwards, plus the goalkeeper'],['9 v 9','3-3-2','3 defenders, 3 midfielders, 2 forwards, plus the goalkeeper'],['9 v 9','2-4-2','2 center backs, 4 midfielders (two 8s and two wide players), 2 forwards, plus the goalkeeper'],['9 v 9','3-2-3','3 defenders, a 6 and an 8 or 10, three forwards (a striker and two wide players), plus the goalkeeper']])+`<p class="note">Shape numbers are written back to front without the goalkeeper. These are practice shapes to explain jobs. The KNVB lineup page and the DFB and FFF booklets describe similar shapes; the formation your league uses may differ.</p>`],
  tactics:['Tactics: Phases, Blocks, Build-Up and Plans','Game tactics that fit 10 and 11 year olds. They are tools for understanding the game, not scripts.',()=>`<p>The FIFA Training Centre asks for simple tactical ideas added gradually, with little instruction and many chances to solve problems; its 8 to 12 pages on technical activation and small-sided games stress many touches and many decisions. The FA’s England DNA and its 12 to 16 playing philosophy use the same four moments (in possession, out of possession, transition and set plays). The KNVB’s lineup page ties shape to tasks for each line. We follow these in a children’s version.</p><h4 class="sp">The four phases and what to do in each</h4>`+tbl(['Phase','Team job','Rules we use'],[['In possession','Keep the ball and move it forward','Build from the keeper, find the free player, spread wide, offer depth, play forward when the way is open, switch when one side is crowded'],['Out of possession','Win the ball back','Press on a trigger or a trap, cover behind the presser, stay compact, keep the ball in front of you'],['Transition to attack','Go fast after winning the ball','Look up, play forward in three seconds, support the ball'],['Transition to defence','Stop the counter after losing the ball','Press the ball for three seconds, or drop behind the ball and re-form']])+`<h4 class="sp">Build-up through the lines</h4><p>The team plays from the keeper into the defenders, then into the midfield, then forward. The keeper is the extra player: the center backs split wide, the 6 drops between them if needed, the full-backs push up and the striker pins the last line. The idea is to find the free player, not to avoid risk. If the other team presses, play long to a target and win the second ball. The first step is a roll or throw from the keeper. Practised in chapters 10 and 11.</p><h4 class="sp">Pressing and traps</h4><p>A trigger tells the team to press together: a bad touch, a back pass, a pass to the sideline or a slow ball. A trap is a planned trigger: leave a pass open on purpose, then close it when the ball goes there. The nearest player presses, the next covers and the others tighten up. When there is no trigger the team holds its block. Blocks: a high block presses near the opponent’s goal, a mid block waits at the halfway line and a low block stays close to our own goal. The team chooses the block by score, time and energy.</p><h4 class="sp">Shapes</h4>`+tbl(['Format','Shape','Why we use it','What it asks of the team'],[['8 v 8','3-3-1','Balanced and easy to explain','Learning compactness and a lone striker'],['8 v 8','2-3-2','Two forwards and three midfielders','Learning attacking support'],['9 v 9','3-3-2','A solid back line with two forwards','Learning to build and to press as a team'],['9 v 9','2-4-2','A wide midfield with width on both sides','Learning width and covering the far side'],['9 v 9','3-2-3','Three forwards and a pair of holding midfielders','Learning to press high and to switch fast']])+`<h4 class="sp">The half-time plan</h4><p>Teams talk for two minutes: one thing we did well, one thing to change and one clear job for each line. The plan must fit on the tactics board. After the game, review with three questions: what worked, what did not, what do we try next.</p><h4 class="sp">Set plays</h4><p>Children plan and run corners, direct and indirect free kicks, throw-ins and kick-offs, with a passer, a runner and a decoy. Chapter 13 is dedicated to them. Each play has a number or a color name so that the team can call it.</p><h4 class="sp">Coach cautions</h4>`+ul(['Shapes are teaching tools: rotate players through every spot and change shapes often','Do not fix a team in one shape for a whole season; the FFF and DFB frame small-sided formats as a way to learn, not to win','Keep instructions short and ask questions instead of giving every answer','Praise the decision as well as the result'])],
  formats:['Rules and Game Formats','The formats used in 5th grade practices and festivals and what the European associations publish for this age. Check your league’s rules before match days.',()=>tbl(['Topic','5th grade setting','Source and note'],[
   ['Players per team','5 v 5 to 9 v 9 across the six levels, with 8 v 8 as the main game and 9 v 9 in Levels 5 and 6','KNVB: 8 v 8 for O11 and O12 (the match form we read does not cover O13). FFF U13: 8 per team plus up to four substitutes. FA: 9 v 9 at U11 and U12. SBFV (southern Baden, Germany) D-Junioren: 7 v 7 or 9 v 9 in 2024/25, and 7 v 7 only from 2025/26, so even inside Germany the choice varies'],
   ['Field size','Practice sizes: about 64 x 43 yards (8 v 8) and up to about 80 x 50 yards (9 v 9)','KNVB 8 v 8: 64 x 42.5 m. FFF U13: 60 to 65 m long and 50 m wide, or half a pitch. FA 9 v 9 (U11 to U12): 80 x 50 yards, goals 16 x 7 ft. FA 11 v 11 (U13 to U14): 90 x 55 yards, goals 21 x 7 ft. SBFV 9 v 9: 70 to 80 x 50 to 60 m, penalty spot 9 m'],
   ['Goals','Pop-up goals with rotating goalkeepers; youth goals for finales; mini cages and target nets for placement','KNVB 8 v 8: pupil goal 5 x 2 m. FFF U13: 6 x 2.10 m. FA 9 v 9: 16 x 7 ft'],
   ['Ball','Size 4 for practice; check your league','FFF U13: size 4. The KNVB 8 v 8 form advises size 5 (320 g). Check what your league uses'],
   ['Goalkeepers','Rotate; hands in the own area; back-pass rule; distribution with the hand or off the ground','KNVB 8 v 8: a marked keeper area, no pick-up of a foot back-pass (warning, then an indirect free kick). FFF U13: no pick-up of a deliberate pass or throw-in; no volleyed or half-volleyed distribution'],
   ['Game length','Rounds of 10 to 15 minutes in practice; festivals rotate teams every 10 minutes','KNVB 8 v 8: 2 x 30 minutes, time-outs after 15 minutes. FFF U13: two 30-minute matches per day'],
   ['Rotation','Rotate positions, teams and the goalkeeper; equal playing time','FFF: every player plays; DFB: rotation built into the game forms'],
   ['Referees','Children referee short games with a coach beside; adult referee in festivals; the assistant flag is taught','FFF: a substitute may be the assistant referee if there is no official'],
   ['Restarts','Throw-in by hand, goal kick from the ground, corner from the arc, free kicks with a wall, penalty from the mark, dropped ball','KNVB 8 v 8: opponents at 5 m at every restart, and restarts after a ball goes out are dribbled in. FFF U13: opponents at 6 m, penalty from 9 m. IFAB Law 13 uses 9.15 m (10 yards); our practice distance is a coaching choice'],
   ['Offside','Full rule in 8 v 8 and 9 v 9 from Level 3, with interfering with play and no offence from restarts','KNVB 8 v 8: offside does not apply. FFF U13: judged from the halfway line. SBFV 9 v 9: almost all 11 v 11 rules apply (free kicks are indirect only). The full IFAB Law 11 applies in the 11 v 11 game'],
   ['Substitutions','Rolling substitutions at stoppages, with the referee’s permission','FFF U13: allowed during a stoppage with the referee’s permission, and substituted players may return. IFAB Law 3 (background knowledge): substitutes enter at a stoppage after the leaving player is off'],
   ['Heading','Not used','The FA heading Q&A (read) sets no heading practice at U11 and under in England, and the DFB heading page (read) describes the German reform that removed most heading. We apply the same rule through 5th grade. Check your league'],
   ['Results','No table; ladder format for festivals','DFB: winners move up a pitch, losers down']
  ])+ul(['Use a whistle to start and stop, not to stop every mistake','The IFAB change on the keeper’s eight seconds is taught as “release quickly”','If your league plays 11 v 11 next year, the step is planned for 6th grade; one season at 9 v 9 is a good bridge'])],
});
Object.assign(GUIDE,{
  tools:['Training Tools','The tools used in 5th grade, where each first appears in the plan, and how to use it safely. Eight tools are new this year. Each is drawn in the exercise animation.',()=>{const f=firstUse(11);return `<p>Tools add variety, make the idea visible and give children something to explore. None is required: each has a home substitute. “Since” shows whether the tool is new this year or came from an earlier grade. “First seen” is the first practice in the plan where the tool is in an exercise. The power-work tools (bands, plyo boxes, balance pods and the medicine ball) are light on purpose; see the Safety page. The phone tripod is used only with parent permission.</p>`+tbl(['Tool','Since','What it is','First seen','Used in','Safe use','Home option'],Object.keys(TOOLINFO).filter(t=>f[t]).map(t=>{const i=TOOLINFO[t],u=f[t],nw=NEWTOOLS.includes(t);return [`<b>${t}</b>`,nw?'<b>New in 5th grade</b>':'Earlier grade',i[0],`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`,u.cnt+' exercises',i[1],i[2]];}))+`<p class="note">The tool is shown inside the animation of each exercise that uses it, and the exercise card has a New tool line.</p>`;}],
  rules:['Rules of the Game','The real rules of soccer taught inside games, with the matching IFAB Law and the first practice in which each appears. This year adds penalty shoot-outs, denying a goal-scoring chance, the card ladder, added time, the assistant referee flag, quick free kicks, the eight-second keeper rule and no offence from restarts.',()=>{const f=firstUse(12);return `<p>Rules are taught inside games, not by lecture. In 4th grade handball, free kicks, the dropped ball and substitutions arrived. In 5th grade the Laws get close to the full game: the card ladder, penalty shoot-outs, denying a goal-scoring chance and the assistant referee. The main source is the IFAB Laws of the Game; only Laws 7, 9, 11 and part of 12 were read in a hosted copy, and the other laws are used from background knowledge. The shorter distances come from the FFF and KNVB booklets for children.</p>`+tbl(['Rule','IFAB Law','What children learn','Coach note','First seen','Used in'],Object.keys(RULEINFO).filter(t=>f[t]).map(t=>{const i=RULEINFO[t],u=f[t];return [`<b>${t}</b>`,i[0],i[1],i[2],`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`,u.cnt+' exercises'];}))+`<h4 class="sp">What changes by level</h4>`+tbl(['Level','Rule focus'],[['1 Introduce','Kick-off with own-half positions, ball in and out of play, throw-in, goal kick, corner, referee signals'],['2 Practice','Assistant referee flag, offside: interfering with play, direct and indirect free kicks, free kick and wall'],['3 Develop','The full offside rule, fouls: tackling and holding, the card ladder, denying a goal-scoring chance, the eight-second keeper rule, quick free kicks, substitutions'],['4 Challenge','Added time, quick free kicks, free kick and wall, goal kick, substitutions'],['5 Combine','Handball, penalty shoot-out, no offence from restarts, direct and indirect free kicks, several restarts in one game'],['6 Perform','Penalty kick, penalty shoot-out, back-pass rule, fouls and cards; 9 v 9 with the full set of rules, run by the players']])+`<p class="note">Offside and other rules are applied step by step. Check your league for the age at which the full rules apply.</p>`;}],
  body:['Body, Movement and Growth','The physical qualities that matter at ages 10 and 11 and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 10 and 11','How we train it','Chapters'],[['Speed','Short bursts with full rest; own-best times','30-yard sprints, cone-sprint grid, timing gates, reaction lights','2, 3, 7'],['Agility','Changes of direction on a cue improve','Cuts, ladder, dots, hurdles, reaction ball','2, 3, 4'],['Coordination','A strong period for technique, with possible short clumsy phases in growth spurts','Two feints in a row, sequences, juggling','3, 4'],['Balance','Single-leg control, stable landings','Plyo box landings, balance pods, band walks, keeper dives onto a mat','2, 11'],['Flexibility','Dynamic and playful','Dynamic moves at the run start','all'],['Endurance','Built through play','Laps, games, short rests','all'],['Power','Light and skill-based: low jumps, light bands, a light medicine ball','Box step-ups and soft landings, band walks, short throws; few reps, full rest','2'],['Reaction','Improving','Reaction ball, tennis-ball catches, light and sound signals','2, 4, 11']])+`<h4 class="sp">What the sources say</h4>`+ul(['The FFF livret recommends short, varied blocks and avoiding mechanical overload because bones are still growing; the U11 booklet builds psychomotor work (balance, coordination, reaction, rhythm, footwork) into workshops','The KNVB’s Jolles report says motor development follows phases, children of one age differ widely, and playful practice speeds skill learning','A small study of U12 players (GeoSport for Society, 2022) reports improvement in speed, agility and coordination after a structured training cycle; the abstract has no sample size or control group, so it is only a pointer','Long-term athlete development models (World Rugby, used for the general model) favour a broad movement base and body-weight or light-load strength work before adolescence'])+`<h4 class="sp">Light power work</h4><p>Low plyo boxes (about 12 to 18 inches, or 30 to 45 cm), light resistance bands and a light medicine ball (about 1 to 2 lb, or 0.5 to 1 kg) carry over from 4th grade and are used a little more. They are used for a few controlled repetitions with full rest, as part of a game or circuit, with the focus on landing softly, balance and good form. They are not weight training: no heavy loads, no maximum lifts and no training to failure. The Lloyd 2014 consensus statement on youth resistance training (read) supports supervised, technique-first work spread over non-consecutive days; the loads and rep counts here are our own coaching judgement, not figures from that paper.</p><h4 class="sp">Growth spurts</h4><p>Peak growth often arrives between 10 and 13 and can come early for some children. A child in a spurt may look clumsy, lose power for a while and report knee or heel pain. An intervention-study abstract from the University of Bath suggests that load can be adjusted during the spurt to reduce injury risk (abstract only; a pointer, not a protocol). In our plan: reduce jumps, sprints and long runs for a child who reports pain, keep full rest, and ask the parents to speak to the doctor if pain lasts.</p><h4 class="sp">Warm-up and injury prevention</h4><p>FIFA 11+ Kids was tested in children’s football and is a longer structured option. Our run start and dynamic moves are a short routine that you can combine with parts of it.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and at ten and eleven many are entering growth spurts. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent, and Jolles advises against selecting children before about age 12. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence','Record progress against the child’s own results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread','If a child suddenly looks clumsy or says a leg or knee hurts, reduce jumping and running and talk to the parents'])],
 psych:['Child Psychology and Motivation','Ideas that guide coaching behavior at this age. 5th grade adds game intelligence, self-review and a calm reset after a mistake.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which tool, which pattern, which position to try next.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci; background knowledge). The Jolles report adds that extrinsic rewards alone can cause fear of failure and that intrinsic motivation is built by challenge, play and fun.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors.</p><h4 class="sp">Comparing with others</h4><p>At 10 and 11, children notice who is faster or better and peer opinion matters even more. Self-evaluation is still early, so children may judge themselves harshly or not at all. Use own-best targets, praise effort, never rank, mix partners and let children lead. Jolles advises avoiding selection before about age 12.</p><h4 class="sp">Attention and self-control</h4><p>Focus varies a great deal between children of this age. Games that change a rule every few minutes, if-then cues and quick looks practise attention while children simply play. The evidence that sport improves executive function is mixed, so treat this as a design guide, not a promise.</p><h4 class="sp">If-then plans</h4><p>An if-then cue (“If I see a free teammate, then I pass”) gives a child a short plan to use in the moment. It is a coaching idea based on implementation-intention research (background knowledge; not rechecked) and is used in chapters 9 and 14.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look','Give concrete, short feedback, not long-term goals (Jolles)'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new feint. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (FA social skills)','Keep instructions short, feedback positive and specific','Ask questions more than giving answers','Captains and helper referees practise calm voices','Rotate every child through every position, so nobody is labelled a defender or a forward at ten'])],
  safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints, equipment and children.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay at 30 yards or less with full rest; landing and diving are practised on soft ground or a crash mat and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practise earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age. The FA heading Q&A (read) sets no heading practice at U11 and under, and the DFB heading page (read) describes the German reform that removed most heading; we apply the rule through 5th grade. Air passes in this plan are kicked, thrown or controlled with the thigh and chest, with soft balls where possible','Power work is light: low foam plyo boxes (about 12 to 18 inches, or 30 to 45 cm), light bands, a 1 to 2 lb (0.5 to 1 kg) medicine ball; few repetitions, full rest, no maximum effort and nothing that hurts','Stop a power exercise when form slips: knees falling in, stiff landings or twisting. Do not use a band to pull or launch a child','Medicine-ball throws go away from other people to a clear catcher, never overhead above a partner’s head','New tools: use soft mannequins, balance pods on flat ground, a rebounder frame anchored on level ground, break-away hurdles, flexible poles and flags, level and anchored nets, mini cages and pop-up goals; use reaction balls and tennis balls on soft grass and clear stray balls at once','Safe tackling: inside of the foot, after a delay, no sliding; handball and holding calls are signs, not punishments','Check the field and anchor all goals before each practice; youth goals are anchored or weighed down every time and moved by two adults','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and dynamic moves are a simple routine. FIFA 11+ Kids is a longer structured option. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates and many have growth spurts at ten and eleven: do not compare or group by size; reduce jumping and sprints if a child reports knee or heel pain, and ask the parents to speak to the doctor if pain lasts','Video clips: use the phone tripod only with written parent permission, film play rather than faces, keep clips on the coach’s device and delete them at the end of the season','Referee children: an adult stands beside a child referee; cards are signs, never punishments, and no child is shamed for a decision'])],
  next:['Looking Ahead to 6th Grade','The next curriculum extends this base.',()=>`<p>6th grade deepens the same chapters and prepares the step to 11 v 11. Expect a bigger pitch, positions that stay more stable, more detail in build-up through the lines, the full set of Laws in every game and a stronger focus on game-model thinking and self-review. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Positions become more stable but rotation continues for as long as the league allows','Phases of play, pressing traps and set plays become team habits that players call themselves','Training tools stay; light power work grows slowly and only with good form','The Rules page grows toward the full set of Laws','Heading is not introduced in this plan; ask your league for its rule before any heading practice'])],

$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">Fifth Grade Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchg5-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchg5-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchg5-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});

function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchg5-theme',t);}catch(e){}}

route();
})();
