 dev:'At 10 and 11 children can control their bodies better and take on the leadership of the goalkeeper role, but they still need to rotate. The DFB says goalkeepers play regularly from E-Jugend and that specialised training should begin gradually, and Jolles advises against early specialisation. The KNVB advises rotating the keeper every match or two for younger pupils. The IFAB Laws give the keeper eight seconds with the ball in hands (the About the Laws notes say a corner is awarded if it is held too long). Soccer use: rotate the keeper, build confidence on a mat and teach calls.',
 basis:[['DFB','Goalkeepers play regularly in matches from E-Jugend; specialised keeper training begins gradually.'],['KNVB','Lineup page: rotate goalkeepers for younger pupils every match or every two matches; 8 v 8 keepers may hold the ball only in the marked keeper area and must not pick up a foot back-pass.'],['FFF','U13 football à 8: the keeper may not handle a deliberate pass from a teammate or a throw-in; distribution by hand or from the ground, with no volley or half-volley clearances.'],['IFAB','About the Laws (IFAB 2025/26): goalkeepers are penalised for holding the ball more than eight seconds, with a corner for the opposition.']],
 game:'Keeper’s Command 8 v 8: the keeper calls the line before each attack; a catch and a quick throw to a free player scores one, a save by foot scores one and a claimed cross scores two.',
 objectives:['Set the position and angle for a shot and for a 1 v 1','Dive to both sides onto a crash mat and save with hands and feet','Claim a cross with a W grip and a step, or punch only when forced','Start an attack with a throw or a kick from the ground and give calls'],
 outcomes:['Saves 5 of 8 moderate shots from 12 yards','Dives and holds the ball in 4 of 6 tries','Claims 3 of 6 crosses','Sends 4 of 6 throws or kicks to a free player'],
 concepts:[['Coach term / child language',[['Angle','"Stand so the shooter sees little goal"'],['W grip','"Thumbs together behind the ball"'],['Crash mat','"Dive onto the mat, roll, hold"'],['Close down','"Come out, get big, stay on your feet"'],['Distribution','"Throw or roll to a free player"'],['Call','"Keeper, away, man on, leave it"'],['Eight seconds','"Release quickly"']]]],
 why:'Goalkeeping is a role every child tries, and a mat and light balls make diving feel safe and fun. Calling and distribution make the keeper the first attacker and the last leader. The DFB says keepers should start to train gradually, so this chapter keeps rotation and playfulness.',
 details:[
 {h:'Position and angle',p:['The keeper stands on the line from the ball to the center of the goal and steps out as the shooter nears to make the angle small. Feet are shoulder width and hands are ready.','Move with shuffle steps, not crossing the feet.'],pts:['On the line to the ball','Step out to narrow','Hands ready','Shuffle'],scene:'keeper'},
 {h:'Saving with hands and feet',p:['Moderate shots are saved with the hands behind the ball and the body behind the hands. A low shot may be saved with a foot. Tennis balls and a reaction ball train fast hands.','Dive onto a crash mat so a miss is safe.'],pts:['Body behind the hands','Foot for low shots','Tennis balls for reactions','Crash mat'],scene:'dive'},
 {h:'Crosses and the W grip',p:['The keeper moves along the line, takes a step, calls “keeper” and claims the ball high with a W grip (thumbs together). If the ball cannot be caught, the keeper punches only as a last choice.','Soft balls are used for early practice.'],pts:['Call and step','W grip','High catch','Soft balls first'],scene:'rebound'},
 {h:'Closing down a 1 v 1',p:['The keeper comes out quickly but stops before the attacker shoots, stays big and on the feet and forces the shot wide. A dive at the feet is a last choice.','Rotate attackers and keepers often.'],pts:['Come out, stop, big','Stay on feet','Force wide','Rotate'],scene:'twovone'},
 {h:'Distribution and calls',p:['The keeper starts attacks with a throw, a roll or a kick from the ground to a free player. The FFF U13 rules for football à 8 allow hand or ground distribution and forbid volley or half-volley clearances. The keeper calls the shape and tells defenders who is free.','The back-pass rule means the keeper may not pick up a ball deliberately kicked back by a teammate.'],pts:['Throw, roll or ground kick','Find the free player','Call the shape','Back-pass rule'],chart:'gk'}
 ],
 drills:[],
 faults:[['Keeper stays on the line','Fear','Walk out one step on every shot'],['Falls instead of dives','No mat','Use the crash mat and start low'],['Drops crosses','Poor grip','W grip and a high catch with soft balls'],['Dives at the feet early','Panic','Stay big and wait for the touch'],['Throws to a covered player','No scan','Look up before the throw']],
 check:'Child sets an angle, dives onto a mat and starts an attack with a throw or a kick from the ground.'
},
{
 n:12, title:'Rules, Referees and Fair Play', short:'Rules & Refereeing',
 lead:'Rules grow into refereeing. Fifth graders referee short games with an assistant who raises a flag, decide between a foul, careless, reckless and excessive force, explain the reasons for yellow and red cards, understand denying a goal-scoring chance, play added time, take a quick free kick and run a penalty shoot-out fairly.',
 builds:[1], focus:{Technical:1,Physical:1,Psychological:4,Social:5},
 grew:{pre:'4th graders add interfering with play in offside, handball, direct and indirect free kicks, the dropped ball, kick-off positions and substitutions, and run corners, free kicks and throw-ins as set plays in games they referee themselves.',k:'5th graders referee short games with an assistant who raises a flag, separate careless, reckless and excessive force, give reasons for yellow and red cards, understand denying a goal-scoring chance, play added time, take a quick free kick, run a penalty shoot-out and handle the offside rule in all restarts.'},
 dev:'At 10 and 11 children have a strong sense of fairness and can understand a reason for a rule, but they still react strongly to a call against them. The KNVB 8 v 8 match form says the pupil referee is at least 13 and that a penalty is awarded only for denying a clear goal-scoring chance. The IFAB Laws (read in a hosted copy up to part of Law 12) explain careless, reckless and excessive force with the matching sanctions. Soccer use: referee with a reason, treat cards as information, and practice fair play as a skill.',
 basis:[['IFAB','Laws of the Game 2025/26 (hosted copy): careless means no sanction, reckless a caution (yellow card), excessive force a sending-off (red card); Law 7 added time; Law 9 ball in and out of play.'],['KNVB','8 v 8 match form: penalty only for denying a clear goal-scoring chance, taken from 9 m; shoot-outs after the match; back-pass warning then an indirect free kick; restarts 5 m.'],['FFF','Football à 8 at U13: offside from the halfway line, direct and indirect free kicks with opponents at 6 m, substitutions at stoppages with the referee’s permission; the FFF also runs a guide on young referees.'],['FIFA','FIFA Training Centre 8 to 12 session: let players referee their own games.']],
 game:'Referee Crew 8 v 8: a referee and an assistant run the game with flag and whistle; a call with a clear reason earns the team a fair-play point.',
 objectives:['Referee a short game with a whistle, signals and a clear reason','Use the assistant referee flag for offside and for ball out of play','Separate careless, reckless and excessive force and say the matching card','Understand and use added time, a quick free kick and a penalty shoot-out'],
 outcomes:['Calls offside and handball with a reason in 3 of 4','Names careless, reckless and excessive force with a card','Runs a shoot-out fairly','Referees a 6 v 6 for five minutes with no major disputes'],
 concepts:[['Coach term / child language',[['Careless','"No care, no card"'],['Reckless','"Too much risk, yellow card"'],['Excessive force','"Too hard, red card"'],['Denying a goal chance','"Stopping a clear chance by a foul or handball"'],['Assistant referee','"The flag helper for offside and ball out"'],['Added time','"Extra time for stops"'],['Quick free kick','"Take it fast, if the referee says"']]]],
 why:'Fifth graders enjoy fairness and want to be trusted with a real job. Refereeing with a reason teaches empathy and responsibility. Knowing why a card is shown reduces anger and arguments. The IFAB wording on careless, reckless and excessive force gives a simple three-step ladder children can use.',
 details:[
 {h:'Refereeing with a reason',p:['A referee blows, signals and says one short reason: “Handball, hand to ball.” The coach stands beside the referee for the first games.','Rotate the referee role so everyone tries it.'],pts:['Whistle, signal, reason','Coach beside','Rotate','Say it calmly'],scene:'refsignals'},
 {h:'The assistant referee and the flag',p:['The assistant referee stands on the touchline, raises the flag for offside or when the ball leaves the field and watches the last defender. The referee decides after the flag.','Practice with Offside flags on the touchline.'],pts:['Stand on the touchline','Flag up for offside','Watch the last defender','Referee decides'],scene:'matchday'},
 {h:'Careless, reckless and excessive force',p:['The IFAB Laws say a careless challenge has no sanction, a reckless one is a caution and one with excessive force is a sending-off. We teach the ladder with a story and role play.','Cards are signals of safety, not punishments.'],pts:['Careless, reckless, excessive','Matching card','Role-play','Safety first'],scene:'tackle'},
 {h:'Denying a goal-scoring chance',p:['If a foul or handball stops a clear goal-scoring chance, the referee can show a card and the KNVB 8 v 8 form awards a penalty. Children learn the picture of a clear chance: near goal, attacker in control, few defenders.','Keep the idea simple and discuss real examples.'],pts:['Near goal','Attacker in control','Few defenders','Discuss examples'],scene:'duel'},
 {h:'Added time, quick free kicks and shoot-outs',p:['Added time makes up for stops (Law 7). A quick free kick is taken at once if the referee agrees. A penalty shoot-out settles a draw: five kicks each, alternating, with a fair order.','Do not use shoot-outs to decide training games.'],pts:['Added time','Quick free kick','Alternating kicks','Fair order'],chart:'rules'}
 ],
 drills:[],
 faults:[['Referee changes calls under pressure','Fear','Say the reason and hold it'],['Assistant does not flag','Lost focus','Stand level with the last defender'],['Everyone argues','High emotion','Captain asks one question'],['Cards for small touches','Over-calling','Use the careless ladder'],['Shoot-out feels cruel','Pressure','Keep it light and rotate']],
 check:'Child referees a short game with reasons, uses the flag correctly and explains the ladder of careless, reckless and excessive force.'
},
{
 n:13, title:'Set Plays: Corners, Free Kicks, Throw-Ins and Restarts', short:'Set Plays',
 lead:'Set plays become a separate skill. Fifth graders plan and run corners, direct and indirect free kicks, throw-ins, goal kicks and kick-offs for both attack and defense, use signals, choose between zonal and player marking, take quick restarts and review what worked.',
 builds:[5,6,12], focus:{Technical:4,Physical:3,Psychological:4,Social:5},
 grew:{pre:'In 4th grade set plays were part of the rules chapter: children ran corners, free kicks and throw-ins as set plays in games they refereed themselves.',k:'5th graders plan and run corners, direct and indirect free kicks, throw-ins, goal kicks and kick-offs for attack and defense, signal the plan, choose zonal or player marking, take quick restarts and review the result.'},
 dev:'At 10 and 11 children enjoy plans with a fixed order and can remember three jobs for a few minutes. The FA playing philosophy names transitions and set plays as moments of the game, and the FFF and KNVB documents set the distances for restarts (6 m and 5 m). The KNVB 8 v 8 form lets a goal be scored directly from a kick-off, a corner and a throw-in by dribbling in. Soccer use: three jobs per plan, a signal and a quick review.',
 basis:[['KNVB','8 v 8 match form: kick-off, goal kick, corner and throw-in rules with opponents at 5 m; direct scoring from kick-off and corner.'],['FFF','Football à 8 at U13: 6 m at free kicks, goal kicks and keeper distribution rules, offside from the halfway line.'],['FA','England playing philosophy: attack, defend, transition; set plays are restarts that a team can plan.'],['IFAB','Law 13: direct and indirect free kicks and the wall distance (9.15 m in the Law); Law 17 corner kick; background knowledge, the law text was not opened.']],
 game:'Set Play Match 8 v 8: every goal-kick, corner, free kick and throw-in is a planned set play; a goal from a planned set play counts two and a clearance from a defended set play counts one.',
 objectives:['Plan and run a corner with a taker, a near-post runner, a far-post runner and a stayer','Take direct and indirect free kicks with a signal and a decoy','Take quick throw-ins and goal kicks to a free player','Defend a corner or a free kick with a clear marking plan and calls'],
 outcomes:['Runs a corner routine with four jobs in 4 of 6','Scores or shoots from a free kick in 3 of 6','Takes a quick throw-in to a free player in 4 of 6','Defends 4 of 6 corners without a shot'],
 concepts:[['Coach term / child language',[['Taker','"The player who kicks or throws it"'],['Decoy','"Runs to pull a defender away"'],['Near-post run','"Run to the nearest post"'],['Stayer','"Stays back to guard against a counter"'],['Signal','"A sign that tells us which plan"'],['Zonal at corners','"Guard a space"'],['Quick restart','"Take it fast while they are not ready"']]]],
 why:'Set plays teach teamwork, planning and communication in a form children love: a plan, a signal and a result. They also teach honesty about what worked. Defending a set play teaches focus and calling. The restarts in children’s formats use shorter distances, so we practice with the same ones.',
 details:[
 {h:'Corners for attack',p:['A corner has four jobs: taker, near-post runner, far-post runner and a stayer to guard against a counter. The taker picks the zone and calls the plan. There is no heading practice, so deliveries are low or driven to the feet and the ball is finished with the feet.','Rotate roles so every child takes a turn at each.'],pts:['Four jobs','Taker calls the plan','Low or driven to the feet','Rotate roles'],scene:'rebound'},
 {h:'Free kicks: direct and indirect',p:['A direct free kick can score at once; an indirect one must touch another player. The plan uses a signal, a decoy runner and a shooter. The wall stands 6 yards away in practice (the FFF uses 6 m; the IFAB Law uses 9.15 m).','Mannequin walls make the practice safe.'],pts:['Signal','Decoy','Shooter','Mannequin wall'],scene:'shoot'},
 {h:'Throw-ins and goal kicks',p:['A throw-in has a thrower, a near option and a far option. A goal kick goes from the ground to a free player or the keeper. Both can be taken quickly when the opponent is not ready.','The KNVB lets throw-ins be dribbled in for the youngest; at 11 and 12 we use the throw.'],pts:['Thrower and two options','Quick when ready','Ground goal kick','Look for the free player'],scene:'throwin'},
 {h:'Defending set plays',p:['At corners the team chooses zonal marking (guard a space), player marking (guard a player) or a mix. Everyone knows their job and the keeper calls. The defenders clear to a wide area, not the middle.','Review after each set play: what worked?'],pts:['Zonal, player or mix','Know your job','Keeper calls','Clear wide'],scene:'goalside'},
 {h:'Kick-offs and quick restarts',p:['At the kick-off the teams are in their own halves and the ball moves forward when kicked. A quick restart catches the opponent unprepared when the referee agrees. After a goal, teams use a planned kick-off routine.','Praise the routine and its speed.'],pts:['Own half at kick-off','Quick when the referee agrees','Planned routine','Praise speed'],chart:'combo'}
 ],
 drills:[],
 faults:[['Players forget the plan','Too many ideas','Three jobs only'],['Corner goes to the keeper','Poor delivery','Aim at a zone and use a target gate'],['Wall is too close','Not measured','Use cones for the distance'],['Quick throw is wasted','Rushing','Look first, then throw'],['Counter after a lost set play','No stayer','Always keep one stayer']],
 check:'Child plays one job in a corner, takes a free kick with a signal and defends a corner with a clear job.'
},
{
 n:14, title:'Game Intelligence and Mind: Scanning, Decisions, Pressure and Review', short:'Game Intelligence & Mind',
 lead:'Thinking becomes a trained skill. Fifth graders scan before and after receiving, decide under time pressure, name two options, stay calm after a mistake with a reset routine, use self-talk and breathing, picture a move before it happens and review a short video clip with a coach asking questions.',
 builds:[1,4,10], focus:{Technical:2,Physical:1,Psychological:5,Social:4},
 grew:{pre:'In 4th grade scanning and decisions were part of every chapter: children peeked before receiving, chose dribble, pass or shoot and used simple if-then cues.',k:'5th graders scan before and after receiving, decide under time pressure, name two options, reset calmly after a mistake, use self-talk and breathing, picture a move before it happens and review a short video clip by answering the coach’s questions.'},
 dev:'At 10 and 11 the brain is becoming more responsive to social and emotional signals, and the Jolles report calls this a social brain. Self-evaluation starts to appear, and some children manage it at 11 while others are not there until 14 or 15. Girls may doubt themselves and boys overestimate, so feedback should be realistic. The report asks for concrete questions and not abstract goal-setting. A study of visual exploration in U13 and U23 players links looking around before receiving with better passing, though it was not opened beyond the abstract. Soccer use: concrete, short mental routines inside games.',
 basis:[['JOLLES','The brain becomes more responsive to social and emotional stimuli in early adolescence; self-evaluation emerges; use concrete questions; do not expect abstract goal-setting.'],['SCAN','Visual exploration before receiving is linked with passing performance in U13 and U23 players (abstract only; not opened in full).'],['FIFA','FIFA Training Centre: coaching questions such as which goal to attack and how to react quickly after losing the ball; let players solve problems.'],['FA','Youth Development Phase: play with freedom without fear of mistakes, inside a tactical and social framework.']],
 game:'Mind Match 8 v 8: a scan before a pass earns a point for the passer, a reset routine after a mistake earns a point for the team, and a correct two-option call earns two.',
 objectives:['Scan twice before receiving and once after the first touch','Decide within two seconds and name two options','Reset calmly after a mistake with one breath and one cue word','Review a short video clip by answering three concrete questions'],
 outcomes:['Scans before receiving in 7 of 10 passes','Names two options in 3 of 5 situations','Uses the reset routine after a mistake','Answers three review questions with specific words'],
 concepts:[['Coach term / child language',[['Scan','"Look around before the ball comes"'],['Two options','"Name two good choices"'],['Reset','"Breathe, say the cue, play the next ball"'],['Self-talk','"Short helpful words to myself"'],['Picture it','"See the move before I do it"'],['Video clip','"A short film of our game to learn from"'],['Review question','"What did I see? What did I choose? What next?"']]]],
 why:'Fifth graders are starting to notice their own thinking, so short routines for scanning, calming and reviewing make the mind a trained part of the game. The Jolles report warns against abstract goal-setting, so everything is tied to a concrete moment in play. Video clips show children what they did, not what they were told.',
 details:[
 {h:'Scan before, during and after',p:['Players look around before the ball arrives, once after the first touch and again before the next pass. The coach counts head turns.','A study linking visual exploration with passing performance in older players supports the idea, but it was only seen as an abstract.'],pts:['Look before','Look after the touch','Head turns counted','Calm'],scene:'scan'},
 {h:'Decisions under time pressure',p:['A clock or a signal forces a decision within two seconds. The player says two options aloud (“pass or turn”) before choosing. Praise the decision as well as the result.','Start with easy games and tighten the time slowly.'],pts:['Two seconds','Two options aloud','Praise the choice','Tighten slowly'],scene:'firsttime'},
 {h:'Staying calm after a mistake',p:['The reset routine: one breath, one cue word (“next”) and the next action. Children practice it after a planned mistake in a game.','Never punish a mistake; normalize it as part of learning.'],pts:['One breath','Cue word','Next action','No punishment'],scene:'trafficlight'},
 {h:'Self-talk and picturing a move',p:['Self-talk is a short helpful phrase such as “look, then pass”. Picturing is imagining a move for ten seconds before doing it. Both are practised inside short games, not as separate lessons.','Keep it playful and short.'],pts:['Short phrases','Ten-second picture','Inside games','Playful'],scene:'mirror'},
 {h:'Reviewing a video clip',p:['A phone on a tripod films a short clip. The coach asks three concrete questions: what did you see, what did you choose and what next. Children watch only their own actions and only with permission from parents.','Delete clips after the review unless the club has a safeguarding policy for storing them.'],pts:['Short clips','Three questions','Own actions','Parent permission'],chart:'mind'}

window.RULETXT={
 'Kick-off: own half':'Rule in play: at kick-off every player starts in their own half and the opponents stay back (5 yards in our practice, 9.15 m in IFAB Law 8); the ball is in play when it is kicked and clearly moves, and a goal can be scored directly.',
 'Offside: interfering with play':'Rule in play: IFAB Law 11. Being in an offside position is not an offence by itself. It is an offence only if, when a teammate plays the ball, the player then plays or touches it, interferes with an opponent (blocks the view or challenges) or gains an advantage. An indirect free kick restarts play.',
 'Handball':'Rule in play: handball is deliberately touching the ball with the hand or arm, or making the body unnaturally bigger (IFAB Law 12). A direct free kick is given, or a penalty if it happens in the defending team’s own penalty area; the keeper may use the hands inside their own area.',
 'Direct and indirect free kicks':'Rule in play: a direct free kick can score straight into the goal; an indirect free kick must touch another player first and the referee raises an arm until the ball is touched or out (IFAB Law 13). Opponents stand back 6 yards in our practice (9.15 m in the Law).',
 'Dropped ball':'Rule in play: when the referee stops play for a reason not covered by another restart, the ball is dropped for one player of the team that last touched it (the keeper if it was in that team’s own penalty area); all other players stay at least four yards away until the ball touches the ground (IFAB Law 8).',
 'Fouls: tackling and holding':'Rule in play: tackling, charging, pushing, tripping or holding an opponent in a careless, reckless or too strong way is a foul (IFAB Law 12) and gives a direct free kick; sliding tackles are not taught at this age.',
 'Substitutions':'Rule in play: in our games substitutes enter at the halfway line after the ball is out of play and the player leaving has left the field; everyone plays at least half the game (the FFF asks for 75 percent playing time for all at U10 and U11).',
 'Denying a goal-scoring chance':'Rule in play: when a foul or deliberate handball stops a clear goal-scoring chance (near goal, attacker in control, few defenders), the referee can show a card and the KNVB youth form awards a penalty (IFAB Law 12; background knowledge, the exact wording was not read).',
 'Yellow and red cards: the ladder':'Rule in play: IFAB Law 12. A careless challenge has no card, a reckless challenge is a caution (yellow card) and a challenge with excessive force is a sending-off (red card). In practice the cards teach and are never a punishment.',
 'Added time':'Rule in play: IFAB Law 7. The referee adds time at the end of each half for stoppages such as substitutions, injuries, time-wasting and disciplinary actions; players play on until the referee blows the whistle.',
 'Goalkeeper eight seconds':'Rule in play: the goalkeeper may hold the ball in the hands for no more than eight seconds; the referee raises a hand and counts down the last five seconds, and the opponents get a corner kick if the ball is held too long (IFAB 2025/26, About the Laws).',
 'Assistant referee flag':'Rule in play: IFAB Law 6 (background knowledge). The assistant referee stands on the touchline level with the last defender, raises the flag for offside or when the ball leaves the field, and the referee decides.',
 'Penalty shoot-out':'Rule in play: IFAB Law 10 (background knowledge). A drawn game can be decided by alternating penalty kicks from the mark; in our practices shoot-outs are light-hearted and never used to decide training games.',
 'Ball in and out of play':'Rule in play: IFAB Law 9. The ball is out of play when the whole ball has crossed the goal line or touchline or the referee stops play; it is in play at all other times, including when it rebounds off a post or the crossbar and stays on the field.',
 'Quick free kick':'Rule in play: IFAB Law 13 (background knowledge). A free kick may be taken quickly before the opponents have set a wall if the referee agrees and the kick is safe; opponents must still be the right distance away unless they interfere.',
 'Offside: no offence from restarts':'Rule in play: IFAB Law 11. There is no offside offence if a player receives the ball directly from a goal kick, a throw-in or a corner kick.',
 'Kick-off and restarts':'Rule in play: every goal is followed by a kick-off from the center; the opponents stay back at least 5 yards and the ball is in play when it moves.',
 'Referee signals':'Rule in play: the referee shows the signal for the call (goal, throw-in, goal kick, corner, free kick, advantage, card) and says the reason in one sentence.',
 'Advantage':'Rule in play: if a foul happens but the fouled team still has a good chance, the referee lets play go on and calls "advantage".',
 'Fouls and cards':'Rule in play: careless, reckless or too strong challenges are fouls (IFAB Law 12). A yellow card cautions, a red card sends a player off; in practice the cards teach and are never a punishment.',
 'Throw-in':'Rule in play: when the ball crosses the side line the other team throws in with both hands from behind and over the head, both feet on or behind the line.',
 'Goal kick':'Rule in play: when the attackers play the ball over the end line, the defending team restarts from the goal area with the ball on the ground; the ball is in play once it moves and the opponents stay outside the area.',
 'Corner kick':'Rule in play: when the defenders play the ball over their own end line, the attackers restart from the corner arc; the ball is at rest in the arc and opponents stay back.',
 'Free kick and wall':'Rule in play: after a foul the other team takes a free kick (direct can score, indirect must touch another player first). Opponents stand back 6 yards in our practice (9.15 m in IFAB Law 13); a wall of mannequins or players blocks the shot.',
 'Penalty kick':'Rule in play: a foul by the defenders inside their area gives a penalty from the mark (9 yards in our practice); the keeper stays on the goal line until the kick and all other players stay outside the area.',
 'Back-pass rule':'Rule in play: the keeper may not pick up a ball deliberately kicked back by a teammate (first time a warning, then an indirect free kick) and may hold the ball for no more than eight seconds (IFAB Law 12).',
 'Offside: stay level':'Rule idea (practice only): an attacker should stay level with or behind the ball or the last defender when a pass is played, so runs are timed.',
 'Offside: last 14 yards':'Rule in play: offside is called only in the last 14 yards in front of the goal (the FFF uses the last 13 m at U10 and U11). A player is offside if nearer the goal line than the ball and the second-last opponent when the ball is played and takes part in play.',
 'Offside: the full rule':'Rule in play: IFAB Law 11. A player is in an offside position if nearer the goal line than both the ball and the second-last opponent. It is only an offence if the player takes part in play; there is no offence from a goal kick, throw-in or corner kick. An indirect free kick restarts play.'

function keyExtra(sc){
  const types={};let tools=[],rules=[];
  sc.items.forEach(o=>{types[o.t]=1;
    if(o.t==='label'&&typeof o.text==='string'&&/Tool:|Rule:/.test(o.text)){
      const mt=o.text.match(/Tool:\s*([^|]*)/),mr=o.text.match(/Rule:\s*(.*)$/);
      if(mt)tools=mt[1].split(',').map(x=>x.trim()).filter(Boolean);
      if(mr)rules=mr[1].split(',').map(x=>x.trim()).filter(Boolean);}});
  const r=[];
  r.push(`<li class="kx"><i class="kd ko"><svg viewBox="-8 -8 16 16" width="16" height="16"><circle r="6.5" fill="#fff" stroke="#111" stroke-width="1.6"/><circle r="2.4" fill="#111"/></svg></i><span><b>Ball</b>: the white ball. Players and the ball follow the path in the animation, and it repeats.</span></li>`);
  ['cone','goal','zone','circle','line','link','light','flash','wedge'].forEach(k=>{if(types[k])r.push(`<li class="kx"><i class="kd ko">${KEYOBJ[k][0]}</i><span>${KEYOBJ[k][1]}</span></li>`);});
  tools.forEach(t=>{if(KEYTOOL[t])r.push(`<li class="kx kt"><i class="kd ko tool">T</i><span><b>Tool: ${t}.</b> ${KEYTOOL[t]}</span></li>`);});
  rules.forEach(t=>{if(KEYRULE[t])r.push(`<li class="kx kt"><i class="kd ko rule">R</i><span><b>Rule: ${t}.</b> ${KEYRULE[t]}</span></li>`);});
  return r.join('');
}
window.howTo=function(d){
  const org=String(d[5]||'').split(/(?<=[.!?])\s+/).filter(s=>s&&!/^Rule in play/.test(s));
  const li=[];
  li.push(`<li><b>Set up.</b> Area: ${d[3]}. Players: ${d[2]}. You need: ${d[4]}.</li>`);
  org.forEach((s,i)=>li.push(`<li><b>${i===0?'Start.':'Then.'}</b> ${s}</li>`));
  li.push(`<li><b>Coach says.</b> ${d[6]}</li>`);
  li.push(`<li><b>Make it harder.</b> ${d[7]}</li>`);
  li.push(`<li><b>If it goes wrong.</b> ${d[8]}</li>`);
  return `<section class="how"><h4>How to run it</h4><ol>${li.join('')}</ol></section>`;
};

function keyHTML(sc,name){
  const num={},let_={};let hasK=false;
  sc.items.forEach(o=>{if(o.t!=='p')return;const t=o.team||'a';if(t==='k')hasK=true;const n=o.n==null?'':String(o.n);
    if(n===''||!isNaN(n))num[t]=1;else let_[t+n]=[t,n];});
  const rows=[];
  ['a','b','k','c'].forEach(t=>{if(num[t]){const c=KEYCOL[t];rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">1</i><span><b>${c[0]}</b>: ${KEYNUM[t]}</span></li>`);}});
  Object.values(let_).sort((x,y)=>'abkc'.indexOf(x[0])-'abkc'.indexOf(y[0])).forEach(([t,n])=>{
    if(t==='k'&&n==='K'&&!num.k&&Object.keys(let_).filter(z=>z[0]==='k').length===1){/* fallthrough */}
    let m=(KEYSC[name]&&KEYSC[name][n])||(KEYTC[t]&&KEYTC[t][n])||KEYLET[n];
    if(n==='T'&&!(KEYSC[name]&&KEYSC[name].T))m=hasK?'Thrower (sends the ball to the keeper)':'Tagger (chaser)';
    if(n==='L'&&t==='c')m='Ladder runner';
    if(n==='M'&&t==='a')m='Middle player';
    if(n==='F'&&t==='a')m='Front player';
    if(n==='B'&&t==='a')m='Back player';
    if(!m)return;const c=KEYCOL[t];
    rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">${n}</i><span><b>${c[0]} ${n}</b>: ${m}</span></li>`);});
  rows.push(keyExtra(sc));
  return `<details class="sc-key" open><summary>Key: colors, letters, tools and markings</summary><ul>${rows.join('')}</ul></details>`;
}

  const sc=S[name]; if(!sc) return '';
  const cap=capOverride||sc.cap;
  let body=pitch();
  sc.items.forEach(o=>{ body+= o.t==='raw'?o.svg:item(o); });
  return `<figure class="scene" id="${id}"><div class="scene-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cap}">${body}</svg><button class="pp" type="button" aria-label="Pause animation" data-for="${id}"><span class="i-pause"></span></button></div><figcaption>${cap}</figcaption>${keyHTML(sc,name)}</figure>`;
};

// Generated drill scenes: every exercise gets its own animation built from its own setup (players, area, equipment, text).
(function(){
const S=window.SCENES, CH=window.CHAPTERS, DS=window.DSCENE;
if(!S||!CH||!DS)return;
const pl=(x,y,team,n,pts,dur,o={})=>({t:'p',x,y,team,n,pts,dur,...o});
const bl=(x,y,pts,dur,o={})=>({t:'ball',x,y,pts,dur,...o});
const cn=(x,y,c)=>({t:'cone',x,y,c});
const lb=(x,y,text,o={})=>({t:'label',x,y,text,...o});
const zone=(x,y,w,h,o={})=>({t:'zone',x,y,w,h,...o});
const goal=(x,y,w,h)=>({t:'goal',x,y,w,h});
const circ=(x,y,r,o={})=>({t:'circle',x,y,r,...o});
const line=(x1,y1,x2,y2,o={})=>({t:'line',x1,y1,x2,y2,...o});
const fl=(x,y,text,dur,a)=>({t:'flash',x,y,text,dur,kt:[a,a+.02,a+.04,a+.2,a+.22].join(';')});
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const COL=['#F28C28','#F5B82E','#2fa35b','#5aa9ff','#e5484d','#c77dff'];
const TM=['a','b','c'];
// player that follows pts (first point is the start), ball that follows the same points shifted
const P=(team,n,pts,dur,begin=0)=>pl(pts[0][0],pts[0][1],team,n,pts.slice(1),dur,{begin});
const B=(pts,dur,begin=0,dx=9,dy=3)=>bl(pts[0][0]+dx,pts[0][1]+dy,pts.slice(1).map(p=>[p[0]+dx,p[1]+dy]),dur,{begin});
const ring=(cx,cy,rx,ry,n,a0=0)=>Array.from({length:n},(_,i)=>{const a=a0+i*2*Math.PI/n;return [Math.round(cx+rx*Math.cos(a)),Math.round(cy+ry*Math.sin(a))];});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function parse(d,k){
 const pf=d[2]||'',area=d[3]||'',eq=((d[4]||'')+' '+(d[5]||'')+' '+d[0]).toLowerCase();
 let np=6,vs=null,m;
 if(m=pf.match(/(\d)\s*v\s*(\d)/i)){vs=[+m[1],+m[2]];np=vs[0]+vs[1];}
 else if(/pair/i.test(pf))np=2;
 else if(m=pf.match(/(\d+)/))np=+m[1];
 else np=6;
 let w=20,h=15;if(m=area.match(/(\d+)\s*x\s*(\d+)/)){w=+m[1];h=+m[2];}
 const big=/field|goal|open/i.test(area)&&!m;
 return {name:d[0],area:area,np,vs,team:/team/i.test(pf),
  zw:clamp(w*17,250,520),zh:clamp(h*17,150,270),
  goal:/goal/.test(eq),gate:/gate|door|tunnel|window/.test(eq),hoop:/hoop|island|ring|circle/.test(eq),
  wall:/wall|rebound/.test(eq),relay:/relay|race|line up|queue/.test(eq),
  third:/third|zone/.test(eq),tag:/tag|chase|tagger|freeze|catch/.test(eq),
  lane:/lane|line/.test(eq),cones:/cone/.test(eq),shape:/triangle|square|diamond/.test(eq)};
}

 else if(f==='T'){items.push(...TAG[route(RT,txt,(idx+ch)%TAG.length)](s,b,R,idx));}
 else {items.push(...MOVE[route(RM,txt,(idx+ch)%MOVE.length)](s,b,R,idx));}

 ['Name the effort','Pick three children and say one specific effort each made ("you kept trying with your weaker foot"). Praise the effort, not the result.','Praise for effort and strategy builds persistence; praise for talent can make children avoid challenges.'],

 ['Mirror the smile','Ask children to smile at the child next to them and pass it around.','Shared smiles lift mood and group feeling.'],
 ['Silent cheer','Everyone cheers with no sound, using hands and faces. Then the loud cheer.','Playful contrast keeps the ending light.'],
 ['Growth story','Tell a one-minute story about a player who learned a hard skill step by step.','Stories show that skill grows with practice.'],
 ['Equal voices','Go around the circle so every child can speak for ten seconds. Pass is allowed.','Equal turns say every voice counts.'],
 ['Kind challenge','Challenge everyone to do one kind thing before the next practice.','Kindness tasks spread the team culture beyond practice.'],
 ['Energy gauge','Ask: “Battery low, medium or full?” Remind everyone to rest.','Naming energy teaches self-awareness and rest.'],
 ['Best teammate move','Name a teamwork move you saw (a pass, a shout, a switch) and cheer it.','Praising teamwork actions sets the standard.'],
 ['Silent thanks','Think of one person who helped you, and give them a silent thank you. Then share if you want.','Quiet reflection deepens gratitude.'],
 ['Hope for tomorrow','Ask: “What do you hope to get better at next time?”','Expressing hope keeps motivation forward-looking.'],
 ['Tough but fair','Praise the group for playing hard and fair. Ask for one example of each.','Naming both sets a balance between competing and caring.'],

 ['Everyone wins a moment','Make sure every child hears one specific win from today before they leave.','Equal recognition protects belonging.'],

 ['Team pride chant','Create a new line for your team chant and say it together.','Shared words build identity.'],

 ['Gratitude pass','Pass a ball: whoever holds it says one thing they are thankful for.','Gratitude practice raises mood.'],
 ['Bright side','Ask: “Name one good thing from a hard moment today.”','Reframing builds optimism.'],

function closingBlock(s,min,extraQ){
 const t=TIPS[(s-1)%TIPS.length];
 return {min,name:'Closing circle: motivation and morale',short:'Tip of the day: '+t[0]+'. '+t[1],how:'Tip of the day: '+t[0]+'. '+t[1]+' '+extraQ+' Finish with a high five for each child by name, the team chant and a reminder of the next practice.',focus:'Motivation and morale: '+t[2],prog:'',watch:'Keep it warm and short. Every child hears something positive.',scene:null};
}

function drillBlock(c,i,level,time,label){
 const d=c.drills[i];
 return {min:time,name:label+': '+d[0],how:d[5]+' Setup: '+d[3]+', '+d[2]+'. Equipment: '+d[4]+'.'+(d[11]?' New tool: '+d[11]+'.':'')+(d[12]?' Rule: '+d[12]+'.':''),focus:d[6],prog:d[7]+' (Level focus: '+LEVELS[level-1][1]+')',watch:d[8],scene:ref(c.n,i),steps:[['Set up',d[3]+', '+d[2]+'. You need: '+d[4]+'.'],...(d[11]?[['New tool',d[11]+' (drawn in the animation). See the Tools page for how to use it safely.']]:[]),['Do',d[5]],...(d[12]?[['Rule',d[12]+'. See the Rules page.']]:[]),['Say',d[6]],['Make it harder',d[7]],['Watch for',d[8]]]};
}
// skill pool: drills 0, 1, 2, 4, 5 (drill 3 is the game)
const POOL=[0,1,2,4,5];
function session(s){
 const o=slot(s),c=CH[o.ch-1],l=o.level;
 const pr=prevOf(o.ch,l),pc=CH[pr.ch-1];
 const skillA=3*(l-1), skillB=3*(l-1)+1, gameI=3*(l-1)+2;
 const blocks=[];
 blocks.push({min:5,name:'Arrival and circle',how:'Greet each child by name, quick team chant, weather check, shin guards and water. Captains take their jobs. Tell the group the one idea for today: '+c.objectives[0].toLowerCase()+'.',focus:'Belonging and clarity',prog:'',watch:'Late arrivals: let them join the run start',scene:['circle','Circle up, greet, share the idea of the day.']});
 blocks.push({min:10,short:LAPS[l-1].replace(/\.$/,'')+'. Then 2 min dynamic moves.',name:'Run start: laps around the field',how:'Always start by running around the field. '+LAPS[l-1]+' Finish with 2 min dynamic moves: '+DYN[o.ch]+'.',focus:'Raise the heart rate; tall posture, bent arms, light feet',prog:'Level '+l+' running: '+LAPS[l-1],watch:'Children tire at different rates: allow walking. Never use running as punishment.',scene:['laps','Everyone runs around the field.']});
 blocks.push({min:5,name:'Water and one idea',how:'Water break. Then demonstrate today\'s skill for two minutes and give one cue. Key words: '+c.concepts[0][1].map(k=>k[0]).slice(0,3).join(', ')+'.',focus:'One idea, one cue',prog:'',watch:'Keep the talk to two minutes',scene:null});
 blocks.push(drillBlock(c,skillA,l,12,'Play: skill play 1'));
 blocks.push(drillBlock(c,skillB,l,12,'Practice: skill play 2'));
 const g=drillBlock(c,gameI,l,15,'Play: game');g.how=g.how+' Water at the halfway point. Game level: '+GAMEVAR[l-1]+' Today\'s level target: '+LT[o.ch][l-1]+'.';blocks.push(g);
 const du=DUEL[o.ch];
 {const F=FIN[l-1];blocks.push({min:10,name:'Duel finale: '+F[0],how:'Every practice ends with duels that grow with the level. '+(F[1]!=='fin_1v1goal'?'Open with two minutes of 1 v 1 in pairs, then play today\'s format. ':'')+'Format: '+F[3]+' Grid: '+F[2]+'. Chapter twist ('+du[0]+'): '+du[1]+' In team formats the twist applies to the player on the ball.',focus:'Compete bravely and kindly; use today\'s skill under duel conditions',prog:F[4],watch:'Match players by size and confidence. No sliding, grabbing or pushing. Keep score light and praise effort.',scene:[F[1],F[0]+'. '+F[3]]});}
 blocks.push(closingBlock(s,6,'Ask three questions: what went well, what was tricky, and what is my own-best goal for next time?'));
 const TP=TIPS[(s-1)%TIPS.length];
 blocks[0].steps=[['Do','Greet each child by name. Check shin guards and water. Gather in a circle.'],['Say','Today we are working on this: '+c.objectives[0].toLowerCase()+'.'],['Watch for','Children who arrive late. Send them straight to the run.']];
 blocks[1].steps=[['Do',LAPS[l-1]],['Then','2 minutes of dynamic moves: '+DYN[o.ch]+'.'],['Say','Tall back, bent arms, light feet.'],['Watch for','Tired children can walk. Never use running as a punishment.']];
 blocks[2].steps=[['Do','Water break, about 1 minute.'],['Show','Demonstrate today\'s skill for 2 minutes. Keep your talking short.'],['Say','One cue only. Words for today: '+c.concepts[0][1].map(k=>k[0]).slice(0,3).join(', ')+'.']];
 blocks[5].steps.push(['Today\'s target',LT[o.ch][l-1]]);
 if(typeof GAMEVAR!=='undefined')blocks[5].steps.splice(4,0,['Game level',GAMEVAR[l-1]]);
 blocks[6].steps=[['Set up',FIN[l-1][2]+'.'],['Do',FIN[l-1][3]],['Start',FIN[l-1][1]!=='fin_1v1goal'?'Two minutes of 1 v 1 in pairs first, then the team format.':'Rotate opponents every 2 minutes.'],['Chapter twist',du[0]+': '+du[1]],['Level step',FIN[l-1][4]],['Watch for','No pushing or grabbing. Match players by size. Praise effort.']];
 blocks[7].steps=[['Do','Gather in a circle. Share today\'s tip.'],['Tip',TP[0]+'. '+TP[1]],['Why it works',TP[2]],['End','High five each child by name, team chant, tell them when the next practice is.']];
 let t=0;blocks.forEach(b=>{b.t=t+'-'+(t+b.min);t+=b.min;});
 const eq=[...new Set(blocks.slice(3,6).map(b=>(b.how.match(/Equipment: ([^.]*)\./)||[])[1]).filter(Boolean).join(', ').split(',').map(x=>x.trim().toLowerCase()).filter(x=>x&&x!=='none'))].join(', ')||'balls and cones';
 return {...o,chapter:c,target:LT[o.ch][l-1],levelName:LVLTXT(l),blocks,equip:eq,check:'Check: '+c.check,total:t,prev:pc};
}
function festival(k,day){
 const w=FEST[k-1].week,term=k;
 const blocks=[];
 const run=(min)=>({min,name:'Run start: laps around the field',how:'Always start by running around the field: 4 easy laps together, then 2 min dynamic moves.',focus:'Enthusiasm and teamwork',prog:'',watch:'Let slower runners walk the corners',scene:['laps','Everyone runs around the field.']});
 if(day==='Tuesday'){
  blocks.push({min:5,name:'Arrival and circle',how:'Greet by name. Explain that today is about showing what we can do, not a test.',focus:'Calm and welcome',prog:'',watch:'Nervous children: pair with a buddy',scene:['circle','Circle up and greet.']});
  blocks.push({...run(10)});
  blocks.push({min:5,name:'Water and instructions',how:'Water break. Explain the stations and how groups rotate.',focus:'Clarity',prog:'',watch:'',scene:null});
  const half=Math.ceil(N/2);
  blocks.push({min:25,name:'Assessment stations A (chapters 1 to '+half+')',how:'One station per chapter, groups of 3 or 4, about 4 minutes each. A coach observes and ticks the sheet. Keep it as a game.',focus:'Observe, do not correct',prog:'',watch:'Do not rank children',scene:['stations','Groups rotate between stations on the whistle.'],list:CH.slice(0,half).map(c=>c.n+'. '+c.short+': '+c.check)});
  blocks.push({min:20,name:'Assessment stations B (chapters '+(half+1)+' to '+N+')',how:'Continue the rotation through the remaining stations.',focus:'Observe, do not correct',prog:'',watch:'Allow a retry; this is a snapshot, not a verdict',scene:['stations','Groups rotate between stations on the whistle.'],list:CH.slice(half).map(c=>c.n+'. '+c.short+': '+c.check)});
  blocks.push({min:10,name:'Close',how:'Circle, praise effort, thank the children, say what next week holds.',focus:'Positive finish',prog:'',watch:'',scene:null});
 } else {
  blocks.push({min:5,name:'Arrival and circle',how:'Greet children and families. Quick team chant.',focus:'Belonging',prog:'',watch:'',scene:['circle','Circle up and chant.']});
  blocks.push({...run(10)});
  blocks.push({min:5,name:'Water',how:'Water break and short explanation of the games.',focus:'Rest',prog:'',watch:'',scene:null});
  blocks.push({min:30,name:'Festival games',how:'Short 6 v 6, 7 v 7, 8 v 8 and 9 v 9 games (with keepers, numbered positions, offside, assistant referees and the real restarts) on bigger fields, rotating teams every 8 minutes. No scores are kept. The coach records tallies (touches, shots, 1 v 1 attempts) for a few children each round.',focus:'Effort and fun',prog:'',watch:'Over-excited adults: remind them to cheer for everyone',scene:['funino','Four-goal games, rotating teams.']});
  blocks.push({min:15,name:'Parent and child game',how:'Parents join in simple games with their child: toe taps, 3 v 1 keep-away, and a scoring game.',focus:'Pride and connection',prog:'',watch:'Parents: encourage, do not coach',scene:['pairs','Parent and child pass.']});
  blocks.push({min:10,name:'Awards and snack',how:'Give every child a certificate for something they did well. Team chant, then a shared snack.',focus:'Celebration',prog:'',watch:'Every child gets praise',scene:['circle','Team circle.']});
 }
 let t=0;blocks.forEach(b=>{b.t=t+'-'+(t+b.min);t+=b.min;});
 return {s:'F'+k,festival:true,k,week:w,day,total:t,blocks,equip:'Cones, balls, bibs, small goals, assessment sheets, tally sheets, whistle, certificates',check:'Check: record Yes, Almost or Not yet for each skill.',chapter:null,term};
}
function toText(p){
 const head=p.festival?`Festival ${p.k}, week ${p.week}, ${p.day}`:`Session ${p.s}, week ${p.week}, ${p.day}. Chapter ${p.ch}: ${p.chapter.title}. Level ${p.level} (${p.levelName}). Target: ${p.target}`;
 let s=head+'\n\nEquipment: '+p.equip+'\n\n';
 p.blocks.forEach(b=>{s+=b.t+' min  '+b.name+'\n  '+b.how+'\n  Focus: '+b.focus+(b.prog?'\n  Progression: '+b.prog:'')+(b.watch?'\n  Watch for: '+b.watch:'')+'\n';});
 return s+'\n'+p.check;
}
window.PLAN={LEVELS,LT,LAPS,DUEL,DUELPROG,GAMEVAR,TEACH,WEEKS,FEST,slot,session,festival,toText,N};
})();

he group starts the corner again.", "1.14": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Before kick-off, each team plans 3 substitutions on the tactics board and writes down when they will happen. The substitutes wear numbered bibs. Teams make the changes at the planned times, and the coach checks that every player plays at least half the game.", "1.15": "Six players pass a ball around an obstacle course in a 30 x 25 yd area, set up with cones and hoops. At each hoop, the group stops for a 10-second meeting. They choose the next move on a mini tactics board. Then they go again.", "1.16": "Pairs work in a 20 x 20 yd area. One player does a skill with the ball, like passing or turning. The partner watches and gives one tip and one kind word. A phone on a tripod films one try so the player can watch it back.", "1.17": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Each captain picks the lineup, the plan and two planned substitutions using the tactics board and role cards. At half time, the captain gives one tip. After the game, the team gives 3 specific sentences about how it went.", "2.0": "Groups of 4 use balance pods and a cone sprint grid in a 25 x 10 yd area. Each player stands on a pod for 5 seconds with eyes up. The coach calls a cone, and the player sprints to it and back. Then the next player goes.", "2.1": "Players sprint through a 30 x 15 yd grid made of colored cones and discs. When the coach calls a cone color, the player stops with two small quick steps at that cone. Then the player turns and cuts toward the next color the coach calls.", "2.2": "Play 6 v 6 in a 40 x 28 yd area with a pop-up goal at each end. Before taking a shot, a player must step onto a low plyo box and jump off. If the player then sprints back to defend quickly, the team earns a point. Goals still count too.", "2.3": "Groups of 4 work in a 25 x 10 yd lane marked by discs. Each player wears a resistance band and walks sideways and diagonally down the lane. At the end, the player passes the ball to a partner, with the standing foot next to the ball.", "2.4": "Groups of 5 work in a 20 x 15 yd area with a low plyo box and a crash mat. A player steps up onto the box, jumps off and lands on the mat. The player holds the landing still with knees bent over the toes. Then the player passes the ball to the next player.", "2.5": "Play 5 v 5 in a 35 x 25 yd area with a pop-up goal at each end. Put a ball in the middle. When the reaction light turns green, the nearest player from each team sprints to the ball. The winner attacks. If the light turns red, everyone stops and goes back to their spots.", "2.6": "Partners stand facing each other in a 15 x 10 yd area marked by cones. They throw a light medicine ball chest to chest, pushing with the legs and the body, not just the arms. After each throw, both players sprint 3 steps and throw again.", "2.7": "Groups of 4 work in a 25 x 15 yd area. Set four reaction lights at different distances in the cone sprint grid. One runner waits in the middle. When a light turns on, the runner sprints to it, touches it and runs back. Then the next player goes.", "2.8": "Play 6 v 6 in a 40 x 28 yd area with a pop-up goal at each end. A balance pod sits near each team's goal. A player who wins the ball must stand on the pod for 3 seconds before attacking. Teams score by moving quickly and getting back fast to defend.", "2.9": "Groups of 6 run a circuit in a 30 x 20 yd area. The stations are an agility ladder, a band walk, a plyo box step-up and a short sprint. After each round, the group walks all the way back to the start to rest. Then the next round begins.", "2.10": "Partners stand side by side in a 15 x 10 yd area, with a disc nearby. They throw a medicine ball to each other sideways by twisting the body. After each throw, they sprint to the disc and back. Then they throw again.", "2.11": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. Set timing gates behind the line of
