e middle. When the leader calls, each player escapes away from the mannequin using the sole, outside or inside of the foot. Keep the ball close and take small steps.", "3.2": "Play 6 v 6 in a 40 x 28 yd area with a pop-up goal at each end. Use channel lines to mark three lanes. A player who dribbles past a defender in a lane earns a bonus point. If the player then passes to a free teammate, the team earns two points.", "3.3": "Set a pole with a 2-yard cone gate right behind it, and put the next pole 8 yards away. Each player dribbles at the pole, fakes one way with a body move, then goes the other way through the gate with a quick burst of speed. After the gate, sprint to the next pole and repeat.", "3.4": "Groups of 4 work in a 30 x 15 yd area with a wide lane marked by channel lines. An attacker dribbles at a mannequin in the lane and uses the sideline like a helper. Then the attacker goes inside or outside the mannequin and crosses or shoots.", "3.5": "Play 6 v 6 in a 40 x 28 yd area with a pop-up goal at each end. Mark a wide lane on each side with channel lines. A player who dribbles past a defender in a lane and then crosses to a teammate earns two points. Goals still count too.", "3.6": "Groups of 4 work in a 10 x 10 yd square marked by discs, with a mannequin as a marker. The dribbler drags the ball back with the sole of the foot, turns quickly away from the marker, and passes to a partner standing on the edge of the square.", "3.7": "Groups of 5 work in a 30 x 10 yd area. Set two mannequins in a line with poles at the end. Each player dribbles at the first mannequin and does a fake move, then does a second, faster fake at the second mannequin. After the last mannequin, sprint past the final pole.", "3.8": "Play 6 v 6 in a 40 x 28 yd area with a pop-up goal at each end. After a player dribbles past a defender, that player has 3 seconds to dribble, pass or shoot. The coach counts each good choice.", "3.9": "Groups of 4 work in a 20 x 15 yd area. A mannequin wall stands beside the dribbler, with a defender in front. The dribbler uses a chop or scissors move to cut away from the defender. Then the dribbler shoots through a gate made of two discs.", "3.10": "Play 2 v 1 in a 15 x 15 yd square marked by discs. The player with the ball may dribble past the defender or pass back to the teammate. Each time the attackers keep the ball or get past the defender, they score one point.", "3.11": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. Use channel lines to mark two take-on zones in the middle. A player who dribbles past a defender inside a zone earns a point. A goal scored right after that counts two.", "3.12": "Teams of 5 take turns in a relay in a 30 x 20 yd area. Each player dribbles fast through poles, hoops and cones, using both feet. Then the next player goes. Each child tries to beat their own best time at the timing gate.", "3.13": "Groups of 6 work in a 30 x 25 yd area with two wide lanes marked by channel lines. A player dribbles past a mannequin in one lane. Then the player looks up and passes across to the far lane. A teammate there takes on the next mannequin.", "3.14": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Each team has two 1 v 1 lanes on the wings marked by channel lines. A goal after a player dribbles past a defender counts two. Winners of a 1 v 1 move up to the next lane.", "3.15": "Groups of 4 work in a 25 x 20 yd area with a pop-up goal. The attacker dribbles at a mannequin and fakes twice to get past it. Then the attacker shoots against a keeper before the defender can get back.", "3.16": "Groups of 5 work in a 30 x 10 yd area. Set poles in a line as a slalom with cones at the ends. Each player dribbles through the poles and does one fake move. Each player tries to beat their own best time at the timing gate, and writes down only their improvement.", "3.17": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Teams play a full game. A player who dribbles past a defender in the final third earns a bonus point. A pass right after that counts two. Players take turns as referee.", "4.0": "Partners stand 20 yd apart in a lane 10 yd wide. One player passes the ball hard along the ground. The other stops it softly with the inside, outside or sole of the foot. Then the receiver sets the ball into a side gate made of two discs.", "4.1": "Groups of 4 work in a 20 x 15 yd area with cone gates. The receiver looks over the shoulder, opens the body toward the open space and uses the first touch (the way you stop the ball) to turn through a gate. Then the receiver passes to the next player.", "4.2": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. Each team lines up in three lines: back, middle and front. A player who receives a pass in the space between two lines and turns with the ball earns a point.", "4.3": "Groups of 4 work in a 15 x 10 yd area with a rebounder frame. A player passes the ball into the frame. The player stops the ball that bounces back with one touch and pushes it to the left or right. Then the player passes it again.", "4.4": "Groups of 3 work in a 20 x 15 yd area with soft balls and hoops. One player tosses a soft ball. The receiver cushions it with the thigh or chest so it drops into a hoop. Then the receiver passes it on.", "4.5": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. Mark two lines of discs to show gaps. A player who gets the ball in a gap and turns earns a point. A forward pass from there earns two points.", "4.6": "Groups of 4 work in a 10 x 10 yd square with a mannequin and discs. A defender touches the receiver on the back. The receiver rolls the ball away with the sole of the foot, runs onto it and passes to the next player.", "4.7": "Groups of 4 work in a 20 x 10 yd area marked by cones. The receiver stops the ball with the foot that is farther from the passer. This turns the body toward the field. Then the receiver passes forward with the second touch.", "4.8": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. Players choose to play the ball with one touch or with two touches. The coach stops the game and asks why the player chose that. A good choice earns a point.", "4.9": "Groups of 3 work in a 20 x 15 yd area with soft balls, discs and hoops. One player lobs a soft ball up. The receiver stops it with the chest or the top of the foot so it lands in a hoop. Then the receiver makes a pass.", "4.10": "Groups of 4 work in a 15 x 15 yd area. A defender stands close behind the receiver. The receiver looks over the shoulder, takes the ball with a half-turn and passes forward within 2 seconds.", "4.11": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Each player must pass the ball within 2 seconds of getting it. A pass that goes past a line of opponents earns two points.", "4.12": "Groups of 6 work in a 30 x 20 yd area with two lines of mannequins. A receiver stands in the gap between the lines. The receiver gets the ball, turns and passes forward to a runner. Then the group rotates positions.", "4.13": "Groups of 4 work in a 15 x 10 yd area with a rebounder frame. A player throws the ball against the frame. The player stops the bounce with the best part of the foot, thigh or chest. Then the player passes to a partner.", "4.14": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Mark a middle zone for each team with channel lines. A player who gets the ball in the zone, turns and passes forward earns a point. A goal from that move counts two.", "4.15": "Groups of 4 work in a 25 x 20 yd area with a pop-up goal and a mannequin. A feeder lofts a ball. The receiver controls it with the thigh, turns away from the mannequin and shoots within two touches.", "4.16": "Groups of 5 work in a 25 x 15 yd area split into lanes by channel lines. A defender runs at the receiver from behind. The receiver turns toward the open side and passes to a teammate in the next lane. A mannequin marks the edge of the lane.", "4.17": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Each team lines up in three lines: back, middle and front. Players must pass within 2 seconds of getting the ball. A pass that goes past a line of opponents counts two.", "5.0": "Partners stand 25 yd apart in a lane marked by cones, with a hoop at the end. One player drives the ball along the ground with the laces (the top of the shoe). The standing foot goes next to the ball. The goal is to land the ball in the hoop.", "5.1": "Groups of 3 work in a 25 x 15 yd area with a mannequin. The passer curves the ball around the mannequin using the inside of the foot. The ball goes to a partner who stands wide, on the side of the mannequin.", "5.2": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Teams earn a bonus point for any pass of 20 yd or more. They earn another bonus for 3 short passes in a row. Use discs to mark the 20-yard distance.", "5.3": "Groups of 4 work in a 25 x 15 yd area with a mannequin and cone gates. Player A passes to B, then runs past the mannequin. B passes the ball back to A through a gate. Then A passes again, and the groups rotate.", "5.4": "Groups of 4 work in a 25 x 10 yd area with hoops and discs. Players make three kinds of passes: a firm pass to feet, a soft pass to lay the ball off, and a long pass into a hoop. Before each pass, the passer calls out how hard it will be.", "5.5": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Use channel lines to mark two wide channels. A pass from one wide channel to the other earns a point. A goal scored right after that counts two.", "5.6": "Groups of 3 work in a 30 x 15 yd area with a mannequin, hoops and soft balls. The passer lofts a soft ball over the mannequin into a hoop. A partner waits there and stops the ball with the thigh or chest.", "5.7": "Groups of 5 work in a 30 x 20 yd area. Two mannequins stand in the middle as a wall. The passer plays a ball on the ground between them to a runner. The runner times the run to stay level with the last defender, then shoots or passes.", "5.8": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Use discs to mark the middle line. A pass through or over the other team's middle line to a teammate in a gap scores a point. A goal right after that scores two.", "5.9": "Groups of 4 stand at the corners of a 20 x 20 yd square marked by discs. Players pass in a set order: a hard pass along the ground, a curved pass, then a short lay-off. After each pass, the player runs to follow the ball.", "5.10": "Groups of 4 work in a 30 x 15 yd area with channel lines and a mannequin. The winger passes inside to a teammate. Then the winger runs around the outside of that teammate. The teammate passes the ball back, and the winger crosses it low into a gate.", "5.11": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Use channel lines to mark two wide channels. A pass to the far channel earns a point. A pass that goes past a line of opponents earns two. A goal counts one.", "5.12": "Groups of 4 work in a 30 x 20 yd area with hoops and a mannequin in the lane. The passer plays the ball ahead of a running partner. The partner runs through a hoop and passes it back.", "5.13": "Groups of 4 work in a 35 x 20 yd area with a mannequin wall. A defender runs at the passer. The passer plays a long pass past the mannequin wall to a runner. Then the two players swap jobs.", "5.14": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Teams earn a bonus for a wall pass (give the ball and get it back), for a run by a third player to receive a pass, and for a pass to the far side. Players say the name of the pass out loud before they play it.", "5.15": "Partners stand 25 yd apart in a 40 x 10 yd lane with hoops and cones. They pass along the ground and through the air into a hoop. Then they move back to 30 yd and try again. They rest between sets.", "5.16": "Groups of 6 work in a 35 x 25 yd area with three lines of mannequins. The group passes through the lines. They pass to the far side once and make one hard pass that goes past a line. Then they finish with a shot.", "5.17": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end and a tactics board. Each team has a plan for passing out from the back. They earn a bonus for a pass to the far side and for a pass past a line of opponents. At half time, players talk about their passes.", "6.0": "Groups of 4 work in a 25 x 15 yd lane with a pop-up goal 15 yd away. Each player runs up and drives the ball along the ground with the laces (the top of the shoe). After each shot, the player walks all the way back to rest.", "6.1": "Groups of 4 work in a 20 x 15 yd area with a target net and balls. The shooter says which corner of the net to aim at. Then the shooter kicks with the inside or outside of the foot. The next shooter picks a different corner.", "6.2": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. Every shot from outside the box earns a point. Every goal earns two points. The coach counts the shots that go on target.", "6.3": "Groups of 3 work in a 20 x 15 yd area with a pop-up goal and soft balls. A feeder tosses a soft ball. The shooter kicks it just after it bounces, with the knee over the ball. The shooter aims at a target in the goal.", "6.4": "Groups of 4 work in a 30 x 20 yd area with a pop-up goal and a target gate. The winger crosses a low ball through the gate to the near zone, close to the goal. The striker shoots first time with the feet.", "6.5": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Use channel lines to mark wide lanes. A goal from a cross counts two. A goal after a cutback (a pass pulled back from near the end line) also counts two.", "6.6": "Groups of 3 work in a 20 x 15 yd area with a mini cage and soft balls. A feeder lobs a soft ball. The shooter hits it out of the air with a flat foot into the mini cage. Keep the head still and the ball in front.", "6.7": "Groups of 4 work in a 30 x 20 yd area with a pop-up goal and a mannequin. The winger dribbles to the end line. Then the winger passes the ball back to the edge of the box. A teammate runs in and shoots first time, past the mannequin.", "6.8": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Use channel lines to mark two wide zones. A cross from a wide zone earns a bonus point. A cutback (a pass pulled back from near the end line) earns two points.", "6.9": "Groups of 4 work in a 35 x 20 yd area with a pop-up goal and a target gate. The winger drives a cross at head height through the gate to the far side. The striker stops it with the chest and then shoots.", "6.10": "Groups of 4 work in a 25 x 20 yd area with a pop-up goal. The attacker runs at the keeper. The attacker decides early to dribble around the keeper, roll the ball into a corner or chip it over. The keeper stays big and patient.", "6.11": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Near the goal, each player may only take two touches. A goal from a first-time shot (no touch before it) counts two.", "6.12": "Teams of 6 take turns in a relay in a 35 x 25 yd area with a pop-up goal and target gates. One player crosses, one runs in and one finishes with the feet. After each cross, the three players rotate jobs.", "6.13": "Groups of 5 work in a 30 x 20 yd area with a pop-up goal and a mannequin wall at the edge of the box. The shooter gets a pass. Then the shooter shoots within two touches, aiming around the mannequin wall.", "6.14": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Use channel lines to mark wide lanes. A team earns a bonus for a goal finished with the feet after a cross. A corner after a cross is a free restart, so the team can use a plan.", "6.15": "Groups of 4 work in a 20 x 20 yd area with a pop-up goal. Each player takes a penalty from 9 yd away with the same routine each time: place the ball, take a breath, step back 3 steps, look at the goal and strike. A keeper rotates in turn.", "6.16": "Groups of 4 work in a 25 x 20 yd area with a pop-up goal and a mannequin. A chasing defender starts 5 yd behind the attacker. The attacker takes one deep breath and finishes calmly. After a miss, the attacker uses the same routine again.", "6.17": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Teams play a full game. They earn bonus points for first-time shots, crosses and cutbacks (passes pulled back from near the end line). A draw may be settled with a light-hearted penalty shoot-out.", "7.0": "Seven players walk in a line at the same height in a 30 x 20 yd area, with discs, bibs and a mannequin. When the leader shows the signal to press, the whole line steps forward together. When the signal ends, they walk back together.", "7.1": "Groups of 5 work in a 25 x 15 yd area with cone gates. The attacker passes a slow ball back through a gate. That is the signal for the nearest defender to run at the ball. The other defenders move in close behind to help.", "7.2": "Play 7 v 7 in a 50 x 32 yd area with a pop-up goal at each end. The defending team picks to defend high (far up the field), in the middle or low (near its own goal). It holds that spot for 2 minutes while the attackers try to score.", "7.3": "Groups of 8 work in a 30 x 25 yd area marked by cones, with discs. Defenders at a corner either guard a space or stay close to one attacker. The coach says which. Then the corner is taken, and each defender calls out their job.", "7.4": "Groups of 4 work in a 20 x 15 yd area with a mannequin and discs. The pressing player stands in the line between the ball and the next attacker, so the pass cannot go through. This forces the pass to the outside while a teammate covers behind.", "7.5": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. Discs mark lines for the back, middle and front. A team earns a point when its lines stay within 20 yd of each other.", "7.6": "Groups of 5 work in a 30 x 20 yd area with a cone sprint grid and a mannequin. After losing the ball, the defender sprints around a cone behind the mannequin. This puts the defender between the ball and the goal. Then the defender slows down and stays in front of the attacker.", "7.7": "Pairs work in a 12 x 12 yd square marked by discs. The defender walks up to a mannequin and tackles with the front foot, keeping the body behind it. Then the defender tackles a live partner at half speed.", "7.8": "Play 8 v 8 in a 55 x 38 yd area with a pop-up goal at each end. One team defends close to its own goal in a tight group. The other team attacks. If the defenders win the ball and score within 5 seconds, the goal counts two.", "7.9": "Groups of 6 work in a 30 x 25 yd area with channel lines. The defenders block the middle, so the attacker goes to the wide lane. When the ball goes into the wide lane, the defenders squeeze in and close the space behind it.", "7.10": "Groups of 4 work in a 30 x 15 yd area with a mannequin and a cone sprint grid. The attacker gets past a defender with a long ball. The defender sprints to get between the ball and the goal. Then the defender slows down to block the shot.", "7.11": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. One team defends far up the field, near the other team's goal. When the other team makes a certain pass, all the defenders run at the ball together. A ball won in the final third that scores counts two.", "7.12": "Groups of 6 work in a 30 x 25 yd area with target gates and bibs. The attackers cross the ball into the box. Defenders protect the near post and the middle. One defender marks the far post, and one stays outside the box.", "7.13": "Groups of 4 work in a 20 x 15 yd area with two cone gates. Two defenders guard the gates and slide side to side together as the attackers pass. If the attackers pass the ball through a gate, they score.", "7.14": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Teams defend from the halfway line. A safe tackle earns a point. A foul loses a point. The referee and players talk about any foul that stops a clear chance to score.", "7.15": "Groups of 5 work in a 20 x 20 yd area with discs. Defenders face a line of 1 v 1 duels. A defender moves up the ladder after winning the ball with a safe tackle or after holding the attacker for 3 seconds.", "7.16": "Groups of 7 work in a 40 x 30 yd area with channel lines and bibs. When the trigger happens, the whole line runs at the ball. When the coach gives a signal, the line drops back together to the next line of discs.", "7.17": "Play 9 v 9 in a 65 x 42 yd area with a youth goal at each end. Before kick-off, each team chooses how far up the field it will press. Then they play a full game. The team that wins the ball back fastest scores a bonus.", "8.0": "In groups of 3, play passes in a 25 x 20 yard area marked with discs. Player A passes to B, then C runs forward to get B's next pass. A calls the signal for B to pass, and C should wait until A passes before running. After each run, the three players swap spots.", "8.1": "In groups of 4 in a 30 x 15 yard lane, a winger dribbles toward a mannequin. If the mannequin faces out, a teammate runs around the outside to get a pass. If it faces in, the teammate runs inside past the winger instead. Players take turns in each job.", "8.2": "Play 7 v 7 with pop-up goals on a 50 x 32 yard field. After one team makes two passes in the wide side lane, one player from the other team must stand out of play for 5 seconds. The attackers use their extra player to keep the ball and make a chance to score.", "8.3": "In groups of 5, mark 5 lanes with lines in a 30 x 20 yard area. The leader calls out which lane is free, and the team passes the ball into that lane. Then everyone moves close to support the player with the ball. Spread out so no one crowds into one lane.", "8.4": "In groups of 4, mark the lane between the wing and the middle of a 30 x 20 yard area. A runner moves diagonally into that lane, gets a pass from a teammate, then shoots or passes on. A mannequin acts as a defender the runner must beat.", "8.5": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. After the attacking team makes two passes, one defender must step out of play for a few seconds, so the attackers have 5 v 4. A goal scored during this time counts as 2 points.", "8.6": "In groups of 5, set a wall of mannequins with a cone gate behind it. The middle player passes, and a third player runs through the gate to get the ball. That player then shoots or crosses. Wait for the pass before you run so you stay onside, which means level with the last defender.", "8.7": "In groups of 4, a full-back runs inside past the winger to get a pass, then dribbles the ball toward the goal area. The winger stays wide near the side line. Use the lines and a mannequin in a 25 x 20 yard area. The full-back chooses the inside run each time.", "8.8": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field split into lanes by lines. A team scores 1 point each time the ball reaches a new lane. A goal scored after passing the ball to the far side lane counts as 2 points.", "8.9": "In groups of 5, work near a pop-up goal with a mannequin wall in a 30 x 25 yard area. Players play a quick one-two, where a pass is returned right away. A third teammate then runs onto the next pass, and the ball is cut back across from the wall. Finish with a quick shot.", "8.10": "In groups of 4, a winger dribbles to the end line beside a pop-up goal and passes the ball back across to a runner at the edge of the area. The runner shoots at a corner of the target net. Take turns in each job in a 30 x 20 yard area.", "8.11": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. Mark a zone in front of the goal with discs. A goal counts 1 point, but if the team made 3 or more passes inside the zone before scoring, it counts 2 points.", "8.12": "Play 6 v 3 in a 20 x 15 yard area with a small gate of discs in the middle. The 6 attackers pass to keep the ball away from the 3 defenders, who stay close together. A pass through the middle gate scores 1 point. Switch defenders often.", "8.13": "In groups of 6, mark two side lanes in a 35 x 25 yard area. The team makes 4 v 3 on one side to pull defenders over. Then they pass to a free teammate on the far side, who dribbles forward to attack.", "8.14": "Play 9 v 9 with youth goals on a 65 x 42 yard field. Teams earn bonus points for three kinds of teamwork: a runner getting a pass beyond the ball, a teammate running around the outside, and one running inside. A goal that uses two of these counts 3 points.", "8.15": "In groups of 6, run three patterns in order near a pop-up goal with a mannequin wall. First a teammate runs around the outside, then a third player runs onto a pass, then a ball is cut back across. Each pattern ends with a shot, and players say the pattern aloud.", "8.16": "In groups of 5, one player gets a pass and shoots right away at the pop-up goal, without a stop. After that shot, a second ball is passed in from the other side for another first-time shot. A mannequin sits to the side as a marker.", "8.17": "Play 9 v 9 with youth goals on a 65 x 42 yard field. Players use the teamwork patterns, and the referee explains every call. A goal counts 3 points if the team names the pattern they used, such as an outside run.", "9.0": "In groups of 8, each player wears a numbered bib. Walk to your spot for center back, full-back, midfielder, winger or striker. Each player says their job in one sentence. Use the tactics board to check who stands where.", "9.1": "In pairs, each player holds a different role card. Play a short 1 v 1 in a 20 x 15 yard area, and each player must act like the job on the card. For example, a winger stays wide near the side line. Swap cards after each round.", "9.2": "Play 7 v 7 with pop-up goals on a 50 x 32 yard field. Each player wears a numbered bib and plays the job on a role card. At half time, the bibs rotate so everyone gets a new job.", "9.3": "In groups of 4, two center backs defend against one striker in a 25 x 20 yard area. One center back steps up to press the striker, and the other stands behind to cover. Then they switch jobs.", "9.4": "In groups of 4, mark a 30 x 15 yard lane. The full-back runs around the outside of the winger when it is safe. The center back moves over to guard the space the full-back left behind.", "9.5": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. Each team has 2 center backs and 2 full-backs in the back line. They earn a bonus for standing in a straight line, and winning the ball in the back line scores 1 point.", "9.6": "In groups of 4, the holding midfielder gets the ball, turns the body to shield it from a defender, and passes forward to the number 8 player. Stay near your own defenders. Use discs and a mannequin in a 20 x 20 yard area.", "9.7": "In groups of 5, a central midfielder runs forward to help the attack, then sprints back to a disc behind the ball. The player calls out a word each way, like forward and back. Use a cone grid in a 35 x 20 yard area.", "9.8": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. Each team uses three midfielders in a triangle, the numbers 6, 8 and 10. A pass through the triangle that gets past the other team's midfield scores 1 point.", "9.9": "In groups of 5, set two lines of mannequins in a 30 x 20 yard area. The number 10 stands in the gap between the two lines and gets a pass while half turned. The 10 then passes through to the striker.", "9.10": "In groups of 4, a winger gets the ball out wide, dribbles past a mannequin, then crosses the ball low along the ground. A striker runs to the near post and shoots. Use cross target gates in a 35 x 20 yard area.", "9.11": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. When your team loses the ball, the striker runs at the ball first to win it back. If the team wins it back within 5 seconds, that counts as 2 points.", "9.12": "Play 5 v 2 in a 15 x 15 yard square. Each player holds a role card. At each whistle, two players swap cards, and everyone must play the new job. Say your job out loud.", "9.13": "In groups of 4, the striker gets a pass with a defender close behind. The striker holds the ball with the body between the defender and the ball. Then the striker passes it back to a midfielder running up, who shoots at the goal.", "9.14": "Play 9 v 9 with youth goals on a 65 x 42 yard field. Every 5 minutes, the whistle blows and players rotate jobs. Each player says the new job out loud. A goal that uses two different roles counts 2 points.", "9.15": "In groups of 8, set up a circuit with one station for each job: back, full-back, 6, 8, 10, winger and striker. Players do the job at each station. Every minute, everyone rotates to the next station.", "9.16": "In groups of 8, players walk to where their job would stand in four moments: attacking, defending, switching from one to the other, and restarts. The leader moves a ball marker on the tactics board to show where play is.", "9.17": "Play 9 v 9 with youth goals on a 65 x 42 yard field. Each bib shows a job name. After the game, the team looks over the role cards together. Players take turns being the referee.", "10.0": "In groups of 8, place discs on the floor for a 3-3-1 or a 2-3-2 shape. Players walk into their spots in the shape. The leader says what each line of players does.", "10.1": "In groups of 7, walk the ball out from the keeper. The keeper passes to a center back. The team passes through three lines, with full-backs wide and a free player in the middle.", "10.2": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. One team plays a 3-3-1 and the other a 2-3-2, then they swap at half time. A goal scored while standing in the shape counts 2 points.", "10.3": "In groups of 8, use discs and lines to show where the team stands. Walk to a high spot far up the field, a middle spot, fter each pass, the passer says a cue word, like look or turn. It tells the receiver what to do next.", "14.8": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. A light shows how many seconds a team has to shoot after winning the ball: 3, 5 or 7. A decision made in time scores 1 point.", "14.9": "In groups of 4, a player stands at the start for 10 seconds and imagines dribbling around the poles. Then the player does it and says what changed. Use poles in a line and discs to mark the start. Then the next player goes.", "14.10": "Play 5 v 2 in a 15 x 15 yard square. The coach calls a planned mistake. The player takes a breath and says a cue word. Then they make the next pass.", "14.11": "Play 8 v 8 with pop-up goals on a 55 x 38 yard field. One team presses hard for one minute. Then both teams calm down with a reset. The team that stays calm earns a point.", "14.12": "In groups of 3, pass around a triangle of discs in a 20 x 15 yard area. Before each pass arrives, look around and call out one option. A mannequin stands in as a defender.", "14.13": "In groups of 4, a dribbler goes through poles and says a short helpful word at each pole, like look or go. Then the dribbler races through again without saying it.", "14.14": "Play 9 v 9 with youth goals on a 65 x 42 yard field. Teams earn points for looking before a pass, resetting after a mistake and calling two options. The coach asks one question at a stop.", "14.15": "In groups of 6, rotate through stations, and one station films a short clip. The group watches it and answers three questions: what did we see, what did we choose and what will we try?", "14.16": "In groups of 4, the attacker shoots at a pop-up goal within 3 seconds of a light turning on. A defender closes in. After each shot, the attacker does the reset routine.", "14.17": "Play 9 v 9 with youth goals on a 65 x 42 yard field. Teams use a plan, a reset routine and a two-option call. Film a short clip. Afterward, the group answers three questions."};  return nxt+`<div class="hero"><div><div class="eyebrow">RCH Elite Training · 5th Grade · Ages 10 to 11</div><h1>Growing the Game</h1><p>Fourteen chapters taught in rotation, starting at chapter 1. Every Tuesday and Thursday practice moves one chapter forward by a small step. After all fourteen, the cycle returns to chapter 1 at a higher level. Each chapter builds on what the group learned in 4th grade. This year adds advanced positions (center back, full-back, holding and attacking midfielder, wide player and striker), build-up through the lines, pressing traps, a set-plays chapter and a game-intelligence chapter. New tools (role cards, numbered bibs, a referee kit, a phone tripod, balance pods, reaction lights, a rebounder frame and a youth goal) and new rules (penalty shoot-outs, denying a goal-scoring chance, the card ladder, added time, the assistant referee flag and more) are added step by step, and the formats grow up to 9 v 9.</p><div class="stats"><div><b>14</b>chapters</div><div><b>6</b>levels</div><div><b>84</b>practices</div><div><b>75</b>min each</div></div></div><div id="hero-scene">${window.renderScene('funino',nid())}</div></div>

 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, skips, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','The ladder, hurdles and timing gates belong to chapter 2; the run start stays simple','Shorten the laps in hot weather and keep water within reach'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. It follows the play, practice, play pattern and the FA’s plan, do, review loop.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, weather check, captain jobs, team chant, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Two-minute demonstration with one cue'],['20 to 32','Play: skill play 1','Chapter drill at the current level; explore and repeat'],['32 to 44','Practice: skill play 2','A second chapter drill with a progression'],['44 to 59','Play: game','Small-sided game that applies the idea; level rule from the plan'],['59 to 69','Duel finale','Always. Opens with 1 v 1, then grows from 6 v 6 in a shape to 7 v 7, 8 v 8 and 9 v 9 with the full Laws'],['69 to 75','Closing circle','A motivation and morale tip, a high five for every child by name, the team chant and the next practice']])+ul(['Aim for at least 70 percent ball-rolling time (the FA’s guide for coaches)','Change activity if children lose focus','Water at minute 15, at the middle of the game and at the end','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates','If energy is low, shorten skill play 2 and keep the duel finale'])],
 bridge:['From Kindergarten to 1st Grade','1st grade is built on the Kindergarten chapters. Kindergarten’s eleven chapters become ten (chapters 1 and 9 merge) and two new chapters are added, making twelve.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['Kindergarten','1st grade','What happened'],[['1 Team Environment and Routines, 9 Fair Play and the Referee','1 Team Culture, Leadership and Fair Play','Merged. The team agreement is written by the players; leader of the day replaces captain jobs; disputes use stop, say, solve'],['2 Movement and Agility','2 Athletic Movement','Grew: sprint starts, quick feet, reaction, landing, body-weight strength'],['3 Ball Mastery, 4 Dribbling','3 Ball Mastery, 4 Dribbling and Moves','Grew: sequences, tempo, speed dribbling, shielding while moving'],['5 Receiving, 6 Passing, 7 Shooting, 8 1 v 1','5 to 8 (same topics)','Grew: control at pace, 10-yard passing, instep and first-time finishing, block tackle and recovery'],['10 Team Play, 11 Goalkeeper','11 Team Play, 12 Goalkeeper','Grew: jobs that rotate, transition, restart plays, ladder match days, dive and distribute'],['(no chapter)','9 Combinations: 2 v 1, 2 v 2, 3 v 2','NEW: draw a defender and pass, overlap, width'],['(a peek and a few cues)','10 Game Intelligence: Seeing and Deciding','NEW: scan routine, if-then cues, decision games, questions that teach']])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Kindergarten','Now in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: leader of the day, restarts, stop-say-solve, a player-led game','Own-best goals replace comparison with other children','Seeing before doing: scan routine and questions that teach','Small combinations (2 v 1, 3 v 2) build team play from skills the children already have','Roles rotate and transitions become a habit','Every chapter links to how a 6 or 7 year old is developing (see the Development page)'])+`<h4 class="sp">Day-one checks for children arriving from Kindergarten</h4>`+ul(['Names the field thirds and follows the three signals','Balances on one foot for about 8 seconds','Links two or three ball moves on either foot','Passes with the inside of the foot at 8 yards','Attempts a move in a 1 v 1 and defends side-on','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Kindergarten','Use the first cycle (12 practices) as the baseline for everyone'])],
 develop:['How 6 and 7 Year Olds Develop','What is changing in the child, and what each change makes possible in soccer. This page links every chapter to child development.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, want to be liked, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others than only themselves. Physical skills grow quickly, and catching and ball skills become easier.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[['Friendship and belonging','Wants to be liked; picks friends; notices who is in or out','Team agreement, buddies, leader of the day, rotating partners','1, 9, 11'],['Comparing with others','Notices who is faster or better (Erikson’s industry versus inferiority; background knowledge)','Own-best cards; no rankings; praise effort','1, 8'],['Care for others','Moves from only me to also you','Passing into space, combinations, encouragers','6, 9, 11'],['Independence','Wants to do jobs alone','Leader of the day, player-led games, own warm-up','1, 2, 11'],['Working memory and attention','Can hold 2 or 3 things in mind; attention still short','Sequences of three or four moves; three cues at a time; short games','3, 10'],['Language','Can explain what happened','Questions that teach; stop, say, solve','1, 10'],['Speed and agility window','Quick gains in running, balance and coordination (LTAD: speed and suppleness windows)','Sprint starts, quick feet, landing, cuts','2, 4, 8'],['Hand and ball control','Catching and ball skills improve','W-catch, thigh control, first touch at pace','5, 12'],['Visual tracking','Following a moving ball and several players is still maturing','Peek before the ball arrives; short looks; calm drills first','5, 10'],['Resilience','Mistakes still sting; fear of failing in front of friends','Stop-say-solve, mistake of the day, praise for brave tries','1, 7, 8']])+`<h4 class="sp">Skill readiness map</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[['Sprinting and quick feet','10 to 15 yard sprints; low markers','Reaction starts from a ready position','Long runs; heavy loading'],['Ball control','Four-move sequences; control at 8 yards','Receive and turn; thigh control','Chest control; heading'],['Passing','Inside pass at 10 yards; lead a runner','Driven pass; outside foot','Long passes over 20 yards'],['Shooting','Instep with a locked ankle; first-time finish','Placement to a corner','Power shots from distance'],['Tactics','Draw and pass; free player; front, middle, back jobs','Overlap; scan routine','Fixed positions; formations'],['Goalkeeping','Ready position; W-catch; roll and throw','Dive from a crouch','Specialist keepers; punting']])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment, to be checked against your own group.</p>`],
 theory:['Game Ideas for Ages 6 to 7','Tactics are taught as simple ideas inside games, in the language children use. 1st grade adds combinations and a seeing-and-deciding routine.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, draw a defender and pass, overlap, find the free player, dribble into space or shoot. Chapters 4, 6, 7, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay goal-side, delay. Chapters 8 and 11.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and defend at once. Chapters 8 and 11.</p></div></div><p>These three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Numbers up</h4><p>In a 2 v 1 or 3 v 2, the attackers have one more player. The idea is simple: the defender cannot stop everything. Draw the defender, then pass to the free player.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A defender comes at you and a teammate is free','Draw and pass','9'],['A teammate is running past you outside','Overlap: pass in front','9'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use a move, then burst','8'],['They have the ball','Close the nearest player or cover','11'],['You win the ball','Go at once','8, 11']])+`<h4 class="sp">Jobs, not positions</h4><p>There are no fixed positions. Front, middle and back are jobs that rotate (scorer, helper, guard). Goalkeeper is a role that rotates. Formations are not taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball?','Which rule did you use: dribble, pass or shoot?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in 1st grade practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','1st grade setting','Source and note'],[['Players per team','3 v 3 or 4 v 4','DFB uses 3 v 3 (and 5 v 5) for F-Jugend (U8/U9); KNVB uses 4 v 4 for the youngest; U.S. Soccer’s 4 v 4 covers U7 and U8'],['Field size','About 25 x 20 yards (3 v 3) or 30 x 20 yards (4 v 4), up to 35 x 25','DFB 3 v 3: about 25 by 20 meters. UEFA newsletter 4 v 4: about 30 x 20 meters. U.S. Soccer: 25 to 35 yards by 15 to 25 yards for 4 v 4'],['Goals','Four small goals (3 v 3) or two goals with no keepers (4 v 4)','DFB: four mini goals no larger than 2.0 by 1.2 meters, scoring from inside a 6 meter shooting zone. U.S. Soccer: goals up to 4 by 6 feet'],['Ball','Size 3','Both sources'],['Goalkeepers','None in 3 v 3 and 4 v 4; every child tries the role in practice','DFB 3 v 3 has none; UEFA’s newsletter and U.S. Soccer 4 v 4 have none; in DFB 5 v 5 a goalkeeper is optional and changes each round'],['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 minutes (3 v 3) or 12 minutes (5 v 5); U.S. Soccer 4 v 4: four quarters of 10 minutes'],['Rotation','Rotate teams and jobs often','DFB: rotation after each goal in 3 v 3; fixed order every 3 minutes in 5 v 5'],['Referees','Coach as game leader; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],['Restarts','Kick-in or throw-in, restart from own end, free kick for hands, push or trip','DFB: opponent restarts an out-ball with a dribble or pass from the side. Follow your league and stay consistent'],['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down, with short breaks'],['Heading','Not used','U.S. Soccer age-group guidance']])+ul(['Laws taught: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake','If your league plays 7 v 7 with a goalkeeper at U9, introduce it gradually in 2nd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 6 and 7, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 6 and 7','How we train it','Chapters'],[['Speed','A key trainable window; short bursts only','10 to 15 yard sprints from varied starts with full rest','2, 4, 8'],['Agility','Plant-and-push and quick changes are improving','Cut gates, reaction tag, 1 v 1','2, 8'],['Coordination','Quick feet and rhythm are developing','Low markers, sequences, juggling','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, landing stations','2, 12'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start and the warm-up','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: animal walks, hops, squats','Animal power circuit','2'],['Reaction','Improving','Signal games, ready position','2, 12']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage of about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>Structured warm-up programs have been studied in youth soccer, but the strongest research is in older age groups. We use a short, player-led dynamic warm-up as sensible practice, and we keep landing, balance and body-weight strength in every cycle.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Seven ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Younger players valued a coach who lets them play different positions more than older players did. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 6 and 7, children start to notice who is faster or better. Erikson called this stage industry versus inferiority (background knowledge): children who feel capable gain confidence, and those who feel behind may lose it. Protect every child: use own-best cards, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two- or three-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Switch! and changing the rule every few minutes practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence is mixed, so treat this as a design guide rather than a promise.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)','Ask questions more than giving answers'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my own-best goal for next time?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay short (10 to 15 yards) with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week '+PL.FEST[1].week],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],

 next:['Looking Ahead to 2nd Grade','The next curriculum extends this base.',()=>`<p>2nd grade deepens the same chapters: longer passing patterns, more combinations, more team shape, more decisions and game rules, and the first moves toward larger formats such as 7 v 7. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in small-sided formats','Players take on more of the planning and the review','A first goalkeeper-specific block can be added for children who want it'])],
