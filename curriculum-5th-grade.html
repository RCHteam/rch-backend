<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCH 5th Grade Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#FFFFFF;--bg2:#F7F9F8;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}

:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}
.calw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.calmain{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}

<script>
window.CHAPTERS=[
{
 n:1, title:'Leadership, Game Management and Team Culture', short:'Leadership & Game Management',
 lead:'Leadership grows from choosing a plan to managing a whole game. Fifth graders lead a warm-up, set a lineup and a plan with a role card, call code words in play, give one useful tip to a teammate, settle a call with the referee and review a game with honest, specific words.',
 builds:[], focus:{Technical:1,Physical:1,Psychological:5,Social:5},
 grew:{pre:'4th graders choose a simple game plan on a tactics board, call short signals in play (man on, time, switch), lead a warm-up, referee with the full set of signals and review a game with three questions.',k:'5th graders manage a game from start to finish: they set a lineup with role cards, choose a plan, call code words in play, make a substitution plan, give one useful tip to a teammate, settle a call with the referee and review with specific words.'},
 dev:'At 10 and 11 peers matter more and children begin to judge themselves and others. The Jolles report says self-evaluation and empathy develop mainly from early adolescence, some children manage it at 11 and others not until 14 or 15, and a child who speaks well may still not understand what the coach means. It also says girls often doubt themselves and boys often overestimate, so both need realistic feedback. Soccer use: concrete, play-based leadership jobs, short specific feedback and no abstract goal-setting.',
 basis:[['JOLLES','Self-evaluation and empathy develop mainly from early adolescence; verbal skill can mislead adults; give concrete feedback and responsibility in small, age-appropriate ways.'],['KNVB','The KNVB lineup page asks coaches to set the lineup ahead, show it with drawings, magnets or cones, involve players with questions, plan substitutions and track playing time.'],['FIFA','FIFA Training Centre 8 to 12 session suggests letting players referee their own games and asks tactical questions such as which goal to attack.'],['FA','The FA Youth Development Phase (ages 12 to 16) asks for play with freedom inside a team framework, which this chapter starts to prepare.']],
 game:'Manager’s Match 8 v 8: each captain sets a lineup and a plan with role cards, makes two planned substitutions and gives one tip at half time; the team reviews with three specific sentences.',
 objectives:['Set a lineup and a plan with role cards and explain it in three sentences','Call a code word in play (shift, press, switch, reset) at the right moment','Give a teammate one specific tip in under ten words and receive one calmly','Settle a disputed call by asking the referee one question and accepting the answer'],
 outcomes:['Explains the team plan in three sentences','Uses two code words correctly in a game','Gives and accepts a tip without arguing','Reviews a game with one thing that worked and one to change'],
 concepts:[['Coach term / child language',[['Game plan','"Our idea for this game, said in three sentences"'],['Role card','"A card that shows my job with and without the ball"'],['Code word','"One word that tells the team what to do now"'],['Substitution plan','"Who comes on, when and for whom"'],['Peer tip','"One useful thing, said kindly, under ten words"'],['Referee question','"Ask once, listen, then play on"'],['Review','"What worked, what to change, what next"']]]],
 why:'Ten and eleven year olds care about friends and fairness and can hold a plan for several minutes, so leading a game is possible and motivating. Code words and role cards make leadership concrete, which fits the Jolles advice to link words to actions. Tips and reviews teach honest self-evaluation, an ability that is only starting at this age.',
 details:[
 {h:'The game plan and role cards',p:['Each team writes its plan on a board: the shape, one job for each line and one thing to do when the ball is won or lost. Every player holds a role card that names the job with and without the ball.','Keep it to three sentences. A plan that cannot be said aloud is too long.'],pts:['Three sentences','Job with and without the ball','One idea for winning the ball','One idea for losing it'],scene:'setpos'},
 {h:'Code words in play',p:['Four code words are used: shift (move the shape to the ball side), press (go together), switch (play to the far side) and reset (go back to the shape). One player calls and the whole team answers.','Practice each word in a short game before using all four.'],pts:['One caller at a time','Team answers with the word','Four words only','Practice before using in a game'],scene:'matchday'},
 {h:'Tips and feedback among players',p:['A peer tip is one specific thing, said kindly in under ten words: “Look before you receive.” The receiver says thanks and tries it.','Never give two tips at once and never give a tip about the person, only about the action.'],pts:['One tip, under ten words','About the action','Say thanks and try it','No lectures'],scene:'pairs'},
 {h:'Substitutions and playing time',p:['A substitution plan is made before the game on the board: who comes on, when and for whom. The KNVB lineup page asks coaches to track playing time and share it fairly.','Children manage the plan for one half with the coach beside them.'],pts:['Plan before the game','Track the minutes','Share it fairly','Say the new job on entry'],scene:'setpos'},
 {h:'Settling a call and reviewing a game',p:['If a player disagrees with a call, the captain asks the referee one question and then play goes on. After the game the team reviews: what worked, what to change, what next.','Jolles advises concrete questions and responsibility in small steps, so the review stays short and specific.'],pts:['Captain asks once','Accept the answer','Worked, change, next','Short and specific'],chart:'session'}
 ],
 drills:[],
 faults:[['Plan is too long to remember','Too many ideas','Cut it to three sentences'],['Everyone calls at once','No caller','Name one caller for each half'],['Tip becomes a lecture','Too many words','Under ten words, one action'],['Arguing with the referee','Strong feelings','Captain asks one question, then play on'],['Review turns into blame','Vague words','Use worked, change, next and name actions']],
 check:'Child explains the team plan in three sentences, uses a code word at the right time and gives one specific tip kindly.'
},
{
 n:2, title:'Speed, Agility and Athletic Development', short:'Speed & Athletics',
 lead:'Athletic work gets sharper and more careful. Fifth graders sprint 30 to 35 yards from many starts, brake and cut, land and balance on pods and low boxes, push light bands in every direction, throw a light medicine ball for the trunk and learn to notice when a growth spurt makes them clumsy.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:3},
 grew:{pre:'4th graders sprint 25 to 30 yards from many starts, cut on a cue, jump and land softly from low plyo boxes, push and pull light resistance bands, throw a light medicine ball and race their own best on timing gates.',k:'5th graders sprint 30 to 35 yards from many starts, brake and cut, balance and land on pods and boxes, use light bands in every direction, throw a light medicine ball with the trunk, react to lights and learn to adjust load when a growth spurt makes them clumsy.'},
 dev:'Around 10 and 11 some girls and many boys begin to grow fast, and the Jolles report notes that the pace of motor development differs widely between about 8 and 14. A 2014 international consensus (Lloyd et al., BJSM) says youth strength work is safe and useful when supervised, taught by technique and progressed by training age, that children should be mature enough to follow instructions and that early gains come mainly from the nervous system. A 2023 abstract in football academies found that growth-spurt injury risk was higher and that adjusting load and adding balance and landing work may reduce it. Soccer use: light, skilled power work with full rest, and a quiet check on children who suddenly look clumsy.',
 basis:[['LLOYD','2014 international consensus on youth resistance training: supervised, technique first, bodyweight to light loads, 2 to 3 non-consecutive days, full rest for power work.'],['GROWTH','2023 abstract on football academy players: growth-spurt injury risk is higher and balance, landing and strength work with modified load may reduce it (abstract only).'],['JOLLES','Children of the same age differ widely in motor development, especially between about 8 and 14; playful practice speeds learning.'],['FFF','Psychomotor workshops (balance, reaction, rhythm, footwork) and short varied blocks; avoid mechanical overload.']],
 game:'Sprint, Spring and Score 6 v 6: a box jump, band step or pod balance earns the right to shoot; a fast recovery sprint back counts as a point.',
 objectives:['Sprint 30 to 35 yards from standing, crouch, lying and moving starts with good form','Brake in two steps and cut on a cue without losing balance','Land softly from a low box and hold the balance on a pod for five seconds','Throw a light medicine ball with the legs, trunk and arms together'],
 outcomes:['Sprints 30 yards in an improving own time','Lands soft and holds the balance in 8 of 10 jumps','Brakes and cuts on the call in 6 of 8 tries','Names one sign that says to rest'],
 concepts:[['Coach term / child language',[['Brake','"Two small steps, low hips, stop"'],['Pod balance','"Stand tall, eyes up, hold five"'],['Plyo box','"Spring up, land soft, knees over toes"'],['Resistance band','"Push out, slow back"'],['Medicine ball','"Legs, trunk, arms"'],['Reaction light','"See it, go"'],['Growth spurt','"My body is changing; I slow down and tell the coach"']]]],
 why:'Fifth graders want to look strong and fast, and short skilled work teaches the control that makes speed safe. Braking and balance protect the knees and ankles when growth makes children clumsy. Own-best targets keep the focus on progress rather than comparing bodies that are at different stages.',
 details:[
 {h:'Sprint starts and braking',p:['Sprints use many starts: standing, crouch, lying, falling forward and moving. Braking is taught as two small steps with low hips, so children can stop as well as go.','Keep sprints near 30 to 35 yards and rest at least ten times the work.'],pts:['Vary the start','Two-step brake','Full rest','Tall posture in the run'],scene:'sprint'},
 {h:'Pods, boxes and landing',p:['Balance pods and low plyo boxes (about 12 to 18 inches, 30 to 45 cm) train single-leg balance and quiet landings. Children jump up and step down, never down from height.','The BJSM consensus says technique and balance should be good before the load rises.'],pts:['Hold five seconds','Land quiet on both feet','Knees over toes','Stop when form drops'],scene:'balance'},
 {h:'Bands and the medicine ball',p:['Light bands around the thighs or ankles add a gentle push in lateral and diagonal steps. A soft medicine ball (about 1 to 2 pounds) is thrown from the chest, from the side and from a split stance.','The Lloyd consensus recommends one to two sets of low load with feedback after each repetition for new lifters; our work is lighter still.'],pts:['Light bands only','Legs, trunk, arms','Feedback each rep','Full rest'],scene:'ladder'},
 {h:'Lights, cues and reactions',p:['Reaction lights and calls tell a child which way to cut or which target to sprint to. Mix easy and hard cues so every child succeeds and is challenged.','Reaction time improves with practice and playful games are the best way to practice it.'],pts:['Light, sound and number cues','Mix easy and hard','Celebrate fast reactions','Short bursts'],scene:'trafficlight'},
 {h:'Growth spurts and own-best racing',p:['Some children grow fast in this year. A fast-growing child may look clumsy, feel sore around the knee or heel, or lose speed for a while. Reduce jumping and long running, keep balance and landing work and tell the parents.','Timing gates are for racing your own best, never another child.'],pts:['Notice clumsy phases','Reduce jumping if sore','Keep balance work','Own best only'],chart:'balance'}
 ],
 drills:[],
 faults:[['Heavy landing from a box','Too high or tired','Lower the box and stop the set'],['Slow first step','Standing too tall','Low start and push the ground away'],['Falling out of a cut','Late braking','Teach two small steps before the plant'],['Band too hard to control','Band too strong','Switch to a lighter band'],['Child loses speed and coordination','Growth spurt','Cut jumping and long running, keep balance work']],
 check:'Child sprints 30 yards with good form, brakes in two steps and lands quietly from a low box.'
},
{
 n:3, title:'Dribbling, Feints and 1 v 1 Attack', short:'Dribbling & 1 v 1',
 lead:'Dribbling grows in speed, pressure and decision-making. Fifth graders dribble at pace under pressure, combine feints with a change of pace, escape in tight spaces, attack wide and central 1 v 1s with a plan and choose between dribbling, passing and shooting in 2 v 2 and 3 v 3.',
 builds:[2], focus:{Technical:5,Physical:3,Psychological:4,Social:2},
 grew:{pre:'4th graders link two feints in a row, dribble at pace through poles and mannequins, change direction under pressure with scissors and chop turns, attack a live defender with a plan and choose to dribble, pass or shoot.',k:'5th graders dribble at pace with a defender closing, combine feints with a burst, escape tight spaces with the sole, outside and inside of both feet, attack wide and central 1 v 1s with a plan and choose among dribbling, passing and shooting in 2 v 2 and 3 v 3.'},
 dev:'At 10 and 11 coordination is often strong but a growth spurt can briefly make it worse, so repetition with both feet matters more than new tricks. The FFF U11 to U13 booklet lists dribbling, feints and the shot among its technical themes and cites cues such as a low center of gravity and short efficient steps. The FA Youth Development Phase page says players learn to use their individuality for the team, which fits dribbling with a purpose. Soccer use: variety, both feet, a decision at the end of every dribble.',
 basis:[['FFF','U11 to U13 booklet technical themes: short passing, control, dribbling, feints and shooting; cues include low center of gravity, short sharp steps and information-taking.'],['FA','Youth Development Phase: play with freedom inside the team framework; individual development supports the team.'],['FIFA','FIFA 8 to 12 session: quick turns with the ball, 2 v 2 with a dribble, pass and shot, and the advice to make games harder with smaller targets or fewer players.'],['JOLLES','Broad, playful practice speeds skill learning; growth spurts make performance vary.']],
 game:'Take-On Trio 6 v 6: a dribble past a defender in a marked lane earns a bonus; a pass after the take-on to a free teammate earns two.',
 objectives:['Dribble at pace with both feet while a defender closes from the side','Link a feint with a burst of speed and a change of direction','Escape a tight space with the sole, outside or inside of the foot','Choose dribble, pass or shoot at the end of every take-on'],
 outcomes:['Dribbles 20 yards at pace in control with both feet','Beats a passive defender with a feint plus burst in 4 of 6','Escapes a tight space in 4 of 6 tries','Chooses dribble, pass or shoot well in 3 of 5 live 2 v 2s'],
 concepts:[['Coach term / child language',[['Change of pace','"Slow, slow, burst"'],['Feint plus burst','"Sell it, then go"'],['Tight space','"Small box, quick feet, close ball"'],['Wide 1 v 1','"Use the sideline as a helper"'],['Take-on lane','"My lane, my defender"'],['Decision','"Dribble, pass or shoot, then go"'],['Both feet','"Left, right, left"']]]],
 why:'Fifth graders are brave enough to try a take-on and notice when a move fails, so they need a plan and a safe place to try. Combining a feint with a burst turns tricks into attacking tools. Ending each dribble with a decision connects individual skill with team play.',
 details:[
 {h:'Dribbling at pace under pressure',p:['The dribbler pushes the ball ahead with small touches, head up, while a defender closes from the side. Speed comes from longer touches in open space and shorter touches near the defender.','Use both feet and all surfaces: laces, outside, inside and sole.'],pts:['Head up','Longer in open space','Shorter near the defender','Both feet'],scene:'zigzag'},
 {h:'Feint plus burst',p:['A feint only works if followed by speed. The sequence is approach, sell the move, accelerate away and look up. Children choose the move they like most and make it their own.','The FFF U11 to U13 booklet lists feints among its technical themes.'],pts:['Approach, sell, burst','Look up after','Own favorite move','Both sides'],scene:'fake'},
 {h:'Tight spaces and escape',p:['In a small box with a defender, the dribbler protects the ball with the body and escapes with a sole drag, an outside cut or an inside turn. The FFF cues are a low center of gravity and short efficient steps.','Start with a passive defender and increase pressure slowly.'],pts:['Low center of gravity','Short steps','Body between ball and defender','Passive then active'],scene:'shield'},
 {h:'Wide and central 1 v 1',p:['In a wide 1 v 1 the sideline helps the defender, so the attacker attacks the defender’s front foot and goes inside or outside. In a central 1 v 1 there are options both ways.','Attackers decide in the last two steps and not earlier.'],pts:['Attack the front foot','Decide late','Use the space inside and outside','Look up for a pass'],scene:'twovone'},
 {h:'Dribble, pass or shoot',p:['After a take-on the dribbler chooses to carry on, pass to a free teammate or shoot. The FIFA 8 to 12 session asks coaches to make the game harder with smaller targets or fewer players, which forces better decisions.','Praise the decision as well as the result.'],pts:['Look up after the take-on','Name the free teammate','Shoot when ready','Praise the choice'],chart:'dribble'}
 ],
 drills:[],
 faults:[['Ball runs too far after the feint','Touch too hard','Small first touch, then burst'],['Defender wins easily','Predictable move','Change pace and direction'],['Dribbler never passes','Tunnel vision','Add a call: look up after the take-on'],['Only one foot is used','Comfort','Add a rule: the other foot wins a point'],['Too many tricks, no speed','Showing off','Count the burst, not the tricks']],
 check:'Child beats a passive defender with a feint plus burst and chooses dribble, pass or shoot well in a live 2 v 2.'
},
{
 n:4, title:'First Touch, Receiving and Turning under Pressure', short:'Touch & Turning',
 lead:'First touch becomes a tool for the next action. Fifth graders control driven, lofted and bouncing balls with the right surface, receive on the half-turn between lines, turn with a defender touching their back, play first time when it is on and set the ball in the next space so they can play on within two seconds.',
 builds:[3], focus:{Technical:5,Physical:3,Psychological:3,Social:2},
 grew:{pre:'4th graders control lofted balls with the thigh and chest, receive across the body and on the back foot, play first time or take one touch by choice, turn with a defender behind them and use the first touch to play on within three seconds.',k:'5th graders control driven, lofted and bouncing balls with the right surface, receive on the half-turn between lines, turn with a defender touching their back, play first time when it is on and set the ball in the next space to play on within two seconds.'},
 dev:'Around 10 and 11 children track moving balls better and can think about the next action while receiving, but pressure still makes touches heavy. The FFF U11 to U13 booklet lists the touch, information-taking and reading the trajectory among its themes. The FIFA 8 to 12 session starts with quick turns with the ball and no-touch turns. Soccer use: look before the ball arrives, choose a surface and take the first touch into the space you want.',
 basis:[['FFF','U11 to U13 booklet: control, information-taking, reading the trajectory, juggling; cues include locked ankle and an orienting shoulder.'],['FIFA','FIFA 8 to 12 technical activation: quick turns with the ball, no-touch turns and following up for rebounds.'],['KNVB','The KNVB game form asks for a free player in build-up and quick forward play; receiving between lines supports both.'],['FA','The FA staying-on-the-ball guidance (ages 5 to 11) builds ball mastery in stages.']],
 game:'Between the Lines 7 v 7: a pass received between two discs and turned to play forward within two seconds earns two points; goals count one.',
 objectives:['Control driven and lofted balls with the right surface and set the ball into space','Receive on the half-turn between two lines of defenders','Turn away from a defender touching the back with a drag, hook or roll','Decide before the ball arrives whether to play first time or take one touch'],
 outcomes:['Controls 7 of 10 driven passes into space','Receives and turns between lines in 4 of 6','Escapes a defender at the back in 4 of 6','Plays on within two seconds in a 7 v 7'],
 concepts:[['Coach term / child language',[['Set the ball','"Touch it where I want to go next"'],['Half-turn','"Open my body so I can see both ways"'],['Between the lines','"Receive in the gap behind their middle and in front of their back line"'],['First time','"Play it with no touch when it is on"'],['Check shoulder','"Look over my shoulder before the ball comes"'],['Roll and go','"Roll the ball with the sole and run"'],['Two seconds','"Receive, decide, play"']]]],
 why:'At this age children can plan one action ahead, so a good first touch becomes the start of the next pass or dribble. Receiving between the lines is the first step toward the positional play the KNVB and FIFA describe. Pressure from behind teaches body shape and scanning early.',
 details:[
 {h:'Controlling fast and high balls',p:['Driven passes are controlled with the inside, outside or sole, with the surface cushioning the ball. Lofted balls are controlled with the thigh, chest or the instep and the first touch sets the ball into space.','Use soft balls for lofted work.'],pts:['Cushion the ball','Right surface','Set it into space','Soft balls for air work'],scene:'cushion'},
 {h:'Receiving on the half-turn',p:['The half-turn means the body is open so the receiver can see the ball and the field. The check shoulder is a quick look before the ball arrives.','Receiving across the body lets the receiver play to the far side.'],pts:['Open the body','Check shoulder','Take it across','Play forward if it is on'],scene:'receive'},
 {h:'Turning under pressure',p:['When a defender is at the back, the receiver uses a drag, a hook or a roll to turn away from the pressure. The FIFA 8 to 12 page has players practice quick turns with the ball and no-touch turns.','Start with a passive defender and add pressure slowly.'],pts:['Drag, hook or roll','Body between ball and defender','Passive then active','Accelerate after the turn'],scene:'turn'},
 {h:'Between the lines',p:['A player stands in the gap between two lines of defenders and receives on the half-turn. The next action is a forward pass, a turn or a lay-off to a free player.','This links to the free player in build-up described by the KNVB.'],pts:['Find the gap','Half-turn','Forward, turn or lay-off','Quick decision'],scene:'triangle'},
 {h:'First time or one touch',p:['The receiver decides before the ball arrives whether to play first time (one-touch) or to take one touch and pass. The choice depends on the defender’s distance and the next player’s position.','Praise a good choice even when the pass is not perfect.'],pts:['Decide early','First time when it is on','One touch when pressed','Praise the choice'],chart:'scan'}
 ],
 drills:[],
 faults:[['Ball bounces away on control','Stiff foot','Relax the ankle and cushion'],['Turns with the back to the field','Poor orientation','Check shoulder before the ball'],['Defender steals on the turn','Slow turn','Turn on the first touch'],['Stays between the lines too long','No decision','Count to two and play'],['Plays first time every time','Habit','Ask: what does the defender do?']],
 check:'Child controls a driven pass into space, receives on the half-turn and plays on within two seconds.'
},
{
 n:5, title:'Passing: Combination, Long Passing and Switching', short:'Passing & Combination',
 lead:'Passing grows in range, speed and purpose. Fifth graders pass 25 to 30 yards on the ground and in the air, drive the ball with the laces, bend a pass with the inside of the foot, play one-two combinations at speed, switch the play on purpose and break a line with a forward pass.',
 builds:[4], focus:{Technical:5,Physical:2,Psychological:3,Social:3},
 grew:{pre:'4th graders pass 20 to 25 yards on the ground and in the air, set the weight of a pass for the receiver, play a through pass into a gap and keep quick passing patterns in threes and fours.',k:'5th graders pass 25 to 30 yards on the ground and in the air, drive and bend the ball, play one-two combinations at speed, switch the play on purpose and break a line with a forward pass.'},
 dev:'By 10 and 11 children can judge distance and weight better and can see a teammate two passes ahead. The FFF U11 to U13 booklet lists short passing and the cues locked ankle, orienting shoulder, arms for balance and a slightly bent standing knee. The KNVB O10 and O11 themes include positional and depth play in build-up. The FIFA Clearwater article describes passing sequences through a number 10 and a number 9, with firm passes into feet for forward play and lighter ones for lay-offs. Soccer use: choose the right weight for the next player.',
 basis:[['FFF','Booklet cues for passing: locked ankle, orienting shoulder, arms for balance, slightly bent standing knee, surface suited to the pass.'],['FIFA','FIFA Training Centre U12 combinative play: timing runs with communication, weight of the pass, reading the partner’s movement to create angles.'],['KNVB','O10 and O11: positional and depth play in build-up and attacking the 1 v 1.'],['DFB','Small-sided forms give many passes; a German regional D-Junioren slide set (SBFV, 2024/25) gives 9 v 9 on about 70 x 55 m and 7 v 7 on about 55 x 35 m.']],
 game:'Switch and Break 8 v 8: a switch of play to the far channel earns a point, a pass that breaks a line earns two; goals count one.',
 objectives:['Pass 25 to 30 yards on the ground and in the air with good technique','Drive the ball with the laces and bend a pass around a mannequin','Play a one-two combination at speed and run into the return','Switch the play to the far side and break a line with a forward pass'],
 outcomes:['Passes 6 of 10 over 25 yards to a target','Bends 3 of 6 passes around a mannequin','Completes 4 of 6 one-twos at speed','Switches or breaks a line in 3 of 5 tries in a game'],
 concepts:[['Coach term / child language',[['Driven pass','"Laces, low and fast"'],['Bend','"Inside foot, wrap around the ball"'],['One-two','"Pass, run, get it back"'],['Switch','"Change the side of the field"'],['Line-breaking pass','"Pass through or over their line"'],['Weight','"Firm into feet, soft for a lay-off"'],['Lay-off','"One touch back to the player behind"']]]],
 why:'Ten and eleven year olds can play longer passes and understand why a switch or a line-breaking pass helps the team. The weight of the pass shows respect for the teammate. Combinations teach timing and communication, two skills that grow quickly at this age.',
 details:[
 {h:'Long and driven passes',p:['A driven pass uses the laces and a firm strike through the middle of the ball; the standing foot points at the target. Lofted passes use a leaning-back strike under the ball.','Passes over 25 yards need a run-up and a strong core; keep reps low.'],pts:['Standing foot beside the ball','Locked ankle','Follow through at the target','Low reps, full recovery'],scene:'pass'},
 {h:'Bending the ball',p:['A bent pass wraps the inside of the foot around the ball so it curves around a defender. It is used for passing to a runner outside the defender.','Start with a short distance and a big target.'],pts:['Inside of the foot, wrap','Aim wide of the target','Follow through across','Short distance first'],scene:'pairs'},
 {h:'One-two combinations at speed',p:['The passer plays into the partner, runs past the defender and gets the ball back. The first pass is firm, the return is into the path of the runner. The FIFA Clearwater article stresses timing runs with communication.','Speed makes the combination work: slow ones are easy to defend.'],pts:['Firm first pass','Run into the return','Talk','Fast timing'],scene:'giveandgo'},
 {h:'Switching the play',p:['When the ball side is crowded, a switch to the far side finds space. The passer scans, chooses a surface and plays the ball with the right weight.','The far player must be ready and wide.'],pts:['Scan first','Far player stays wide','Right weight','Call switch'],scene:'spread'},
 {h:'Breaking a line',p:['A line-breaking pass goes through or over a line of defenders to a teammate in a gap. The receiver opens the body and plays on within two seconds.','This links to the KNVB build-up themes.'],pts:['Spot the gap','Firm pass','Receiver on the half-turn','Play on'],chart:'pass'}
 ],
 drills:[],
 faults:[['Ball floats or dies','Wrong contact point','Strike through the middle with the laces'],['Pass too soft to the runner','Weak weight','Aim in front and firm'],['One-two is too slow','Waiting','Pass and move at once'],['Switch is played into pressure','No scan','Scan before the switch'],['Line-break pass is intercepted','Late pass','Play when the gap opens']],
 check:'Child passes 25 yards to a target, plays a one-two at speed and switches or breaks a line in a game.'
},
{
 n:6, title:'Finishing: Volleys, Crosses and Composure', short:'Finishing & Crosses',
 lead:'Finishing grows in power, variety and calm. Fifth graders shoot with the instep and the outside of the foot, strike bouncing balls, finish from low and driven crosses with the feet, deliver a cross into three target zones, score 1 v 1 against a keeper and keep calm in penalties. There is still no heading practice.',
 builds:[5], focus:{Technical:5,Physical:3,Psychological:4,Social:2},
 grew:{pre:'4th graders add power with the instep, strike rolling and bouncing balls (half-volleys), finish 1 v 1 against a keeper, shoot early and score from low crosses with the feet. There is no heading practice at this age.',k:'5th graders add the outside-foot shot, half-volleys and soft volleys, finish from low and driven crosses with the feet, deliver crosses into three target zones, score 1 v 1 against a keeper and stay calm in a penalty. There is no heading practice.'},
 dev:'At 10 and 11 children can shoot harder, but power without accuracy wastes chances, and growth spurts can change timing from week to week. The FFF U11 to U13 booklet lists shooting among its technical themes with a locked ankle and the right surface. The DFB page on heading says its children’s game forms nearly rule heading out and asks that heading be age-appropriate; the FA advises coaches not to train heading in the youngest age groups. Soccer use: accuracy before power, crosses finished with the feet, and many shots in small-sided games.',
 basis:[['FFF','Booklet: shooting is a technical theme; locked ankle and the right surface for the strike.'],['DFB','Small-sided and game forms make children take many shots; the DFB heading page says the game forms nearly rule out heading and heading training should be age-appropriate, low volume and with lighter balls.'],['FA','FA heading guidance (Q&A page): training is not banned but should match the amount of heading in matches; repetitive heading should be reduced; the guidance is precautionary.'],['KNVB','O10 and O11: creating and finishing chances after the ball reaches the end line.']],
 game:'Crossing Match 8 v 8: a goal from a cross counts two, a goal after a cutback counts two, and long shots count one.',
 objectives:['Shoot with the instep for power and the inside or outside for placement','Strike a bouncing ball with a half-volley and a soft volley without leaning back','Deliver a low and a driven cross into the near, middle and far zones and finish crosses with the feet','Score 1 v 1 against a keeper and keep a routine in a penalty'],
 outcomes:['Hits 6 of 10 on target from 15 yards','Half-volleys 3 of 6 on target','Finishes 3 of 6 crosses first time with the feet','Scores 3 of 6 in 1 v 1s and 3 of 5 penalties'],
 concepts:[['Coach term / child language',[['Instep shot','"Laces, locked ankle, hit the middle"'],['Placement','"Pick the corner before the touch"'],['Half-volley','"Hit it just as it bounces"'],['Cross zones','"Near post, middle, far post"'],['Cutback','"Pass it back to the edge"'],['Composure','"Breathe, look, then strike"'],['Penalty routine','"Same steps every time"']]]],
 why:'Fifth graders enjoy scoring and want to hit the ball hard, so they need a purpose: accuracy first, then power. Crossing and finishing with the feet gives them the real game picture without heading. A routine for penalties teaches calm under pressure, a skill that carries into school and life.',
 details:[
 {h:'Instep power and placement',p:['The instep shot uses the laces, a locked ankle and a standing foot beside the ball. For placement the inside or outside of the foot guides the ball into a corner.','Rest between shots; power shots from distance are not needed at this age.'],pts:['Laces, locked ankle','Standing foot beside the ball','Pick a corner','Rest between shots'],scene:'shoot'},
 {h:'Half-volleys and soft volleys',p:['A half-volley strikes the ball just after it bounces, with the knee over the ball. A soft volley meets a gentle lob with a flat foot. Start with soft balls tossed by a partner.','Keep the head still and the body over the ball.'],pts:['Knee over the ball','Head still','Soft balls','Toss, then strike'],scene:'bounce'},
 {h:'Crosses and finishing with the feet',p:['A low cross travels along the ground to the near or middle zone. A driven cross flies at head height to the far post and is finished with the foot, chest or thigh. The coach marks three zones.','Heading is not practiced at this age: the FA advises coaches against training it in the youngest groups and the DFB asks for age-appropriate heading.'],pts:['Three target zones','Low or driven','Finish with the feet','No heading practice'],scene:'rebound'},
 {h:'1 v 1 against the keeper',p:['The attacker decides early: dribble round the keeper, place the ball in a corner or chip when the keeper comes out. The keeper stays big and patient.','Practice both sides and both feet.'],pts:['Decide early','Place the ball','Look at the keeper once','Both sides'],scene:'twovone'},
 {h:'Composure and penalties',p:['A penalty routine is the same every time: place the ball, take a breath, take three steps back, look at the corner and strike. A save or a miss is followed by the same routine.','Penalty practice stays light-hearted and no child takes the fifth kick to decide anything.'],pts:['Same routine each time','One breath','Pick a corner','Light-hearted'],chart:'shoot'}
 ],
 drills:[],
 faults:[['Shot goes high','Leaning back','Knee over the ball'],['Volley skews','Head moves','Eyes on the ball until contact'],['Cross floats behind the zone','Poor angle','Run up from the side and aim at the zone'],['Attacker waits for the keeper','No decision','Decide before the last touch'],['Penalty taker rushes','Pressure','Follow the routine and breathe']],
 check:'Child hits the target with the instep, finishes a low cross with the feet and uses a routine in a penalty.'
},
{
 n:7, title:'Defending: Pressing Systems, Zonal Marking and Recovery', short:'Pressing & Zonal Defending',
 lead:'Defending becomes a team skill. Fifth graders press as a line, choose between pressing and dropping, mark space in a zone and a player at a corner, stay compact between the lines, recover goal-side at speed and tackle safely with the front foot and body.',
 builds:[6], focus:{Technical:4,Physical:4,Psychological:4,Social:4},
 grew:{pre:'4th graders press on a trigger (bad touch, back pass, sideline), keep the team compact, recover goal-side in a sprint, defend 2 v 2 and 3 v 3 and defend crosses with a safe position and a safe tackle.',k:'5th graders press as a line on a trigger, choose to press or drop, mark space in a zone and a player at a corner, keep the team compact between the lines, recover goal-side at speed and tackle safely.'},
 dev:'At 10 and 11 children can understand how a team defends together but need clear, simple pictures. The KNVB O10 and O11 themes name disturbing and winning the ball, defending the 1 v 1 and defending depth play, plus transitions to defence. The FFF U11 to U13 booklet lists defending to slow progress, organize to protect the goal and recover or clear the ball. The FA phases include high, mid and low blocks out of possession. Soccer use: one team picture, one trigger and one job at a time.',
 basis:[['KNVB','O10 and O11 defending themes: disturb and win the ball, defend the 1 v 1, defend depth play, transitions from attack to defence.'],['FFF','Booklet tactical themes: oppose progression, slow the attack, organize to protect the goal, win or clear the ball.'],['FA','England playing philosophy: out of possession a team defends in a high, mid or low block; transitions are moments to gain an advantage.'],['IFAB','Law 12: reckless challenges are cautioned and excessive force is sent off; teach tackling the ball, not the person.']],
 game:'Block Battle 8 v 8: a team that wins the ball in its chosen block and scores within five seconds earns a bonus; a safe tackle earns a point.',
 objectives:['Press as a line on a trigger and drop together when there is no trigger','Mark space in a zone and a player at a corner, and know the difference','Keep the team compact between the lines and close the central lane','Recover goal-side at speed and tackle safely without fouling'],
 outcomes:['Presses as a line on the trigger in 4 of 6','Marks the right player at a corner in 3 of 4','Stays inside a 20-yard block for two minutes','Wins the ball safely in 3 of 8 duels'],
 concepts:[['Coach term / child language',[['Pressing line','"All together, same height, same speed"'],['Zonal marking','"I guard my space and the player who enters it"'],['Man marking','"I stay with my player"'],['Compact','"Short distance between players and between lines"'],['Cover shadow','"Stand so the ball cannot go through me"'],['Recover','"Run back and get goal-side"'],['High, mid, low block','"Where we start defending: high, middle or low"']]]],
 why:'Fifth graders can hold an idea about space and feel pride in winning the ball back together. Pressing as a line replaces the single heroic defender with a team habit. Safe tackling and clear rules at corners keep the work fair and keep children out of fouls and injury.',
 details:[
 {h:'The pressing line',p:['A pressing line is a row of players at the same height that move forward together on a trigger such as a bad touch or a back pass. If there is no trigger, the line holds its place.','The KNVB themes disturb and win the ball and transition to defence cover this idea.'],pts:['Same height','Go on the trigger','Hold if no trigger','Talk'],scene:'cover'},
 {h:'High, mid and low block',p:['A block is where the team starts defending: high (near the opponent’s goal), mid (around halfway) or low (near our goal). The FA playing philosophy names these blocks. Teams choose one for each game and stay compact.','Use the discs and channel lines to show the height of the block.'],pts:['Choose the block','Stay compact','Show it on the board','Change at half time'],scene:'shapes'},
 {h:'Zonal and player marking',p:['In zonal marking each player guards a space and the player who enters it; in player marking the defender stays with an opponent. At corners we teach both and ask the children which they prefer and why.','Zonal marking needs talking and a clear zone.'],pts:['Know your zone','Call the runner','Zone or player','Talk'],scene:'goalside'},
 {h:'Compactness and cover shadow',p:['A compact team keeps short distances between players and between lines, which closes the central lane. A cover shadow is standing so the ball cannot go through you to the next player.','The pressing player forces the ball outside, away from the center.'],pts:['Short distances','Close the center','Cover shadow','Force outside'],scene:'jockey'},
 {h:'Recovery and safe tackling',p:['After losing the ball the defender runs back goal-side and then slows down to jockey. A safe tackle uses the front foot, strikes the ball and keeps the body behind it. The IFAB Law 12 treats reckless tackles as cautions and excessive force as sending-off offences.','Tackle the ball, never the person.'],pts:['Sprint, then slow','Front foot','Body behind','Ball, not person'],chart:'duel'}
 ],
 drills:[],
 faults:[['Press is not together','No trigger or no call','Name the trigger and call go'],['Defenders chase the ball','No zone','Draw the zone and name the job'],['Gap between lines','Too spread','Use the 20-yard discs'],['Slide tackle','Eagerness','No sliding; stay on feet'],['Slow recovery','Walking back','Sprint to goal-side first']],
 check:'Child presses as a line on the trigger, marks the right player or zone at a corner and tackles safely.'
},
{
 n:8, title:'Attacking: Combination Play, Overloads and the Final Third', short:'Attacking & Final Third',
 lead:'Attacking grows from support to patterns. Fifth graders play third-man runs, overlaps and underlaps, create overloads, use the five channels, play through and around a block and finish the final third with combinations, cutbacks and quick shots.',
 builds:[7], focus:{Technical:4,Physical:3,Psychological:4,Social:4},
 grew:{pre:'4th graders choose support angles, stretch the field with width, offer depth for forward passes, play combinations on purpose and attack numbers-up in 4 v 3 and 5 v 4 with a plan.',k:'5th graders play third-man runs, overlaps and underlaps, create overloads, use the five channels, play through and around a block and finish the final third with combinations, cutbacks and quick shots.'},
 dev:'At 10 and 11 children can see two passes ahead and understand a pattern with three players. The KNVB O10 and O11 themes include positional and depth play in build-up and creating and finishing chances after reaching the end line. The FIFA numeric-progression and Clearwater materials use overloads such as 4 v 3 to break a press. The FFF booklet lists playing between the lines and in the gaps. Soccer use: three-player patterns, numbers-up games and a plan for the final third.',
 basis:[['KNVB','O10 and O11 attacking themes: positional play and depth play in build-up, 1 v 1 attacking, creating and finishing chances.'],['FIFA','FIFA Training Centre: 5 v 5 with an overload (4 v 3 after two passes) to break a press; numeric-progression games for ages 8 to 12.'],['FFF','Booklet tactical themes: create and use space (width, depth), play in the gaps and between lines, progress with vertical play.'],['FA','England playing philosophy: in possession build, create and finish; intelligently dominate possession and territory.']],
 game:'Overload Match 8 v 8: after two passes a defender from the other team must stay out, creating a 5 v 4 for a few seconds; a goal in the overload counts two.',
 objectives:['Play a third-man run, an overlap and an underlap with a clear signal','Create and use an overload (a 3 v 2, 4 v 3 or 5 v 4) and say why it works','Use the five channels to find the free lane','Finish the final third with a combination, a cutback or a quick shot'],
 outcomes:['Completes 4 of 6 third-man runs','Chooses overlap or underlap correctly in 3 of 5','Scores in 3 of 6 overloads','Names the free channel in a game'],
 concepts:[['Coach term / child language',[['Third-man run','"Pass, and a third player runs onto the next ball"'],['Overlap','"Run outside the player on the ball"'],['Underlap','"Run inside the player on the ball"'],['Overload','"More of us than them in one place"'],['Channel','"One of five lanes up and down the field"'],['Final third','"The last part of the field before the goal"'],['Cutback','"Pass it back from the goal line to the edge"']]]],
 why:'Fifth graders enjoy puzzles that need teamwork: three players, two passes and a run. Overloads show why numbers matter in a very visible way. Channels give a simple map of the field, and the final third teaches patience and quick decisions at the same time.',
 details:[
 {h:'Third-man runs',p:['Player A passes to B, and C runs onto B’s next ball, usually behind the defender. The signal is eye contact or a call.','Start without defenders, then add one.'],pts:['A to B, C runs','Signal early','Pass into the run','Add a defender'],scene:'triangle'},
 {h:'Overlaps and underlaps',p:['An overlap runs outside the player with the ball; an underlap runs inside. The player on the ball chooses by looking at the defender: if the defender follows the overlap, play inside.','Wingers and full-backs practice both.'],pts:['Outside or inside','Call it','Read the defender','Both sides'],scene:'overlap'},
 {h:'Overloads',p:['An overload means one more player in a part of the field. The FIFA Clearwater article uses a 4 v 3 after two passes to break a press; the extra player draws a defender and frees a teammate.','The team chooses where to create the overload by scanning.'],pts:['Scan first','Draw a defender','Free a teammate','Say why'],scene:'threevtwo'},
 {h:'The five channels',p:['Five lanes run up and down the field: two wide channels, two half-space channels and the center. The team looks for the free channel and moves the ball there.','Channel lines of discs make the lanes visible.'],pts:['Five lanes','Find the free one','Move the ball there','Use discs to see'],scene:'lanes'},
 {h:'Finishing in the final third',p:['In the final third players combine quickly: a one-two, a third-man run, a cutback or a shot from the edge. The KNVB themes mention creating and finishing chances after reaching the end line.','Praise the pass that makes the goal.'],pts:['Quick combinations','Cutback to the edge','Shoot when ready','Praise the pass'],chart:'combo'}
 ],
 drills:[],
 faults:[['Third man runs too early','No signal','Wait for the pass and then go'],['Overlap and winger collide','No call','Call overlap or underlap'],['Overload is not used','No scan','Scan and name the free player'],['Everyone stays in one channel','Fear of space','Mark the channels with discs'],['Final third is rushed','Excitement','Count two passes, then decide']],
 check:'Child plays a third-man run or overlap with a call, uses an overload and names the free channel.'
},
{
 n:9, title:'Advanced Positions and Roles: Full-Backs, Center Backs, Holding and Attacking Midfielders, Wide Players and Strikers', short:'Advanced Positions',
 lead:'Positions grow from five groups into specific roles with their own jobs in each phase. Fifth graders learn the center back, full-back, holding midfielder, central and attacking midfielder, winger and striker, play each with and without the ball, use the shirt numbers and still rotate through all of them during the year.',
 builds:[7,8], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'4th graders name the jobs of the goalkeeper, defender, midfielder, winger and forward, play each position with and without the ball and rotate through every position during the year.',k:'5th graders split the five groups into specific roles: center back, full-back, holding midfielder, central midfielder, attacking midfielder, winger and striker, play each job with and without the ball, use shirt numbers 1 to 11 and still rotate through every role.'},
 dev:'Between 10 and 11 children can understand that one position has different jobs in different moments, but they also change fast in size and skill. The KNVB lineup page says O11 and O12 can be introduced to a specific formation, that the tasks of each position should give structure without becoming rigid, that older pupils can rotate through positions and that the same lineup should not start every game. The FA Youth Development Phase says a player may be placed in a position to develop a part of their game, while learning to be a good teammate. Soccer use: teach the job, rotate often and never label.',
 basis:[['KNVB','Lineup page: O11 and O12 can be introduced to a specific formation; state the tasks of each position or ask the players; do not use the same lineup every time; give every player enough playing time.'],['FA','Youth Development Phase: a player may be placed in a position to develop a part of their game; roles are relative to position and system; stages should not be skipped.'],['FIFA','FIFA Clearwater article: a number 9 receives and lays off, a number 10 creates angles and finishes; roles are learned inside small-sided games.'],['FFF','Football à 8 at U12 and U13 (U13 rules): 8 v 8 on 60 to 65 x 50 m with offside from the halfway line and 6 m for free kicks.']],
 game:'Role Match 8 v 8: each player wears a numbered bib and plays the job on a role card; every ten minutes the numbers rotate; a goal that uses two roles counts two.',
 objectives:['Name the job of the center back, full-back, holding midfielder, central midfielder, attacking midfielder, winger and striker','Play three different roles in a game with the right job in each phase','Use shirt numbers 1 to 11 to say who plays where','Explain how a job changes between attack, defense and transition'],
 outcomes:['Names the job of five roles','Plays three roles in one session with the right jobs','Rotates on the call within ten seconds','Explains how one role changes with the ball and without it'],
 concepts:[['Coach term / child language',[['Center back (4, 5)','"Defend the middle, win duels and start the attack"'],['Full-back (2, 3)','"Guard the side and join the attack when it is safe"'],['Holding midfielder (6)','"Protect the defense and pass forward"'],['Central midfielder (8)','"Run both ways and link the lines"'],['Attacking midfielder (10)','"Find space between the lines and create chances"'],['Winger (7, 11)','"Stretch the field, take on and cross"'],['Striker (9)','"Score, hold the ball and press first"']]]],
 why:'Names alone confuse children, but a job with a verb makes sense. Seeing how a role changes with and without the ball gives children the real game picture. Rotation keeps the experience fair and prevents early labels. The KNVB and FA both ask coaches to keep roles flexible at this age.',
 details:[
 {h:'Defenders: center backs and full-backs',p:['Center backs (4 and 5) defend the middle, win duels and start the attack with a pass. Full-backs (2 and 3) guard the side and join the attack when it is safe. When a full-back goes forward the center back covers.','Rotate children into these roles, including goalkeeper.'],pts:['Center backs hold the middle','Full-backs guard and join','Cover when someone goes','Start the attack'],scene:'setpos'},
 {h:'Midfielders: 6, 8 and 10',p:['The holding midfielder (6) protects the defense and passes forward. The central midfielder (8) runs both ways and links the lines. The attacking midfielder (10) finds space between the lines and creates chances. The FIFA Clearwater article describes a 10 who creates angles for a 9.','These are jobs, not stars.'],pts:['6 protects','8 links','10 creates','Rotate through all three'],scene:'triangle'},
 {h:'Wide players and strikers',p:['Wingers (7 and 11) stay wide, take on a defender and cross or cut inside. The striker (9) scores, holds the ball for teammates and presses first. The two roles often work together: the winger crosses and the striker arrives.','Wingers and strikers swap sides to learn both jobs.'],pts:['Wingers stay wide','Striker scores and presses','Swap sides','Cross and arrive'],scene:'spread'},
 {h:'Jobs in each phase',p:['Every role has a job when the team has the ball, when the other team has it and in transition. A full-back attacks in possession, defends the wide channel out of possession and recovers in transition.','Role cards list the three jobs for each position.'],pts:['Three jobs per role','Role cards','Ask: what is my job now?','Say it aloud'],scene:'transition'},
 {h:'Rotation and fair playing time',p:['Over the year every child plays every role. The KNVB lineup page says do not start the same lineup every time and share playing time fairly. A rotation chart on the tactics board shows who plays where in each half.','No child is only a defender or only a striker.'],pts:['Rotation chart','Different lineups','Fair playing time','No labels'],chart:'roles'}
 ],
 drills:[],
 faults:[['Players only want to be strikers','Wanting goals','Rotate roles and give goals for assists'],['Full-back never comes back','Excitement','Role card: recover first'],['Midfielders drift to the ball','No job','Name 6, 8 and 10 jobs aloud'],['Role cards ignored','Too many words','One verb per job'],['Rotation takes too long','No plan','Rotate on a whistle and keep a chart']],
 check:'Child names the job of five roles, plays three roles with the right jobs and rotates on the call.'
},
{
 n:10, title:'Team Tactics: Formations, Build-Up, Pressing and Transitions in 8 v 8 and 9 v 9', short:'Team Tactics',
 lead:'Tactics grow from shapes into a game model. Fifth graders play 8 v 8 and 9 v 9 shapes, build out from the goalkeeper through three lines, press as a team from a high, mid or low block, switch quickly in transitions and make a plan and a change.',
 builds:[1,7,8,9], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'4th graders play a shape in 7 v 7 (2-3-1 and 3-2-1) and 8 v 8 (3-3-1 and 2-3-2), play the four phases of the game, use press triggers, stay compact and make a plan and a change at half time.',k:'5th graders play 8 v 8 and 9 v 9 shapes (3-3-1, 2-3-2, 3-3-2, 2-4-2, 3-2-3), build out from the goalkeeper through three lines, press from a high, mid or low block, switch fast in transitions and make a plan and a change at half time.'},
 dev:'At 10 and 11 children can remember a team picture for a whole game but forget it under pressure, so one idea at a time works best. The KNVB 8 v 8 match form for O11 and O12 uses a 64 x 42.5 m pitch with pupil goals (5 x 2 m), no offside and 2 x 30 minutes. The FFF U13 football à 8 uses 60 to 65 x 50 m, 6 x 2.10 m goals and offside from the halfway line. The FA pitch table gives 9 v 9 as 80 x 50 yards at U11 and U12, and a German regional slide set gives 9 v 9 as about 70 x 55 m. Soccer use: choose one shape, one pressing height and one build-up idea per game.',
 basis:[['KNVB','8 v 8 match form for O11 and O12: 64 x 42.5 m, pupil goals 5 x 2 m, size 5 ball advised, no offside, 5 m at restarts, back-pass warning; the lineup page gives 1-2-3-2 and 1-3-1-3 as examples.'],['FFF','Football à 8 at U13: 60 to 65 x 50 m, goals 6 x 2.10 m, offside from the halfway line, 6 m at free kicks, substitutions at stoppages with permission.'],['FA','Pitch and goalpost sizes 2025/26: 9 v 9 at U11 and U12 is 80 x 50 yards with 7 x 16 ft goals; the playing philosophy names high, mid and low blocks.'],['FIFA','FIFA Clearwater article: build-up with a numerical advantage (4 v 3) to break a press, keep the ball moving with quick combinations.']],
 game:'Plan and Change 9 v 9: each captain sets a shape, a pressing height and a build-up idea, then changes one thing at half time and explains why.',
 objectives:['Play the 3-3-1, 2-3-2, 3-3-2, 2-4-2 and 3-2-3 shapes and say the job of each line','Build out from the goalkeeper through the back, middle and front lines','Press from a high, mid or low block and drop together when needed','Switch between attack and defense within five seconds and say what changed'],
 outcomes:['Walks two shapes and names the lines','Builds out in 3 of 5 tries against light pressure','Holds a block for two minutes in a game','Counters within five seconds in 3 of 5 tries'],
 concepts:[['Coach term / child language',[['Formation','"How many in each line, back to front"'],['Build-up','"Moving the ball from the keeper to the front"'],['Block','"How high we defend"'],['Pressing trap','"Show them one way, then win the ball there"'],['Transition','"Win it and go, lose it and react"'],['Half-space','"The lane between the wing and the middle"'],['Game model','"Our team’s plan in four moments"']]]],
 why:'Fifth graders can think about a team picture for a whole game, and they enjoy deciding things together. A shape makes the game easier to read, and a pressing height gives a clear team idea. Transitions teach quick thinking, one of the biggest gains between 10 and 12. The FA says stages should not be skipped, so shapes stay flexible and are changed often.',
 details:[
 {h:'Shapes for 8 v 8 and 9 v 9',p:['Shapes are written back to front without the goalkeeper: 3-3-1 and 2-3-2 for 8 v 8; 3-3-2, 2-4-2 and 3-2-3 for 9 v 9. The KNVB lineup page gives 1-2-3-2 and 1-3-1-3 as 8 v 8 examples.','Change shapes often so children understand the lines and not just one picture.'],pts:['Back to front','Name the lines','Change often','Show on the board'],scene:'shapes'},
 {h:'Building out from the keeper',p:['The keeper passes to a center back; the full-backs spread wide and the holding midfielder offers in the middle. The team moves the ball through three lines and looks for the free player. The KNVB 7 v 7 game form asks for a free player in build-up.','Start with no pressure and add a press later.'],pts:['Keeper starts','Spread wide','Free player in the middle','Add a press later'],scene:'thirds'},
 {h:'High, mid and low blocks',p:['The team chooses where to start defending. A high block presses near the opponent’s goal; a low block drops near our own. The FA names the three blocks. The block is chosen before the game and may change at half time.','Show the height with channel lines and discs.'],pts:['Choose before the game','Same height for all','Compact lines','Change at half time'],scene:'shapes'},
 {h:'Pressing traps and transitions',p:['A pressing trap shows the opponent one side and wins the ball there with a squeeze. In a transition the team has five seconds to counter or to recover. The FIFA Clearwater article uses overloads to break a press; we use the same idea to counter.','Call the trigger before you go.'],pts:['Show one side','Squeeze there','Five seconds','Call the trigger'],scene:'transition'},
 {h:'Plan, change and review',p:['Each captain sets the shape, the block and the build-up idea in three sentences. At half time the team changes one thing and says why. After the game they review with worked, change and next.','This links to chapter 1 and uses the tactics board.'],pts:['Three sentences','One change','Say why','Worked, change, next'],chart:'shape'}
 ],
 drills:[],
 faults:[['Players forget the shape','Too much information','One idea per game'],['Build-up is rushed','Pressure','Keeper waits for the free player'],['Pressing line breaks','No call','Call the trigger and go together'],['Transition is slow','Standing','Five seconds on the clock'],['Change is random','No reason','Say what and why']],
 check:'Child names the lines of two shapes, builds out from the keeper and presses from a chosen block.'
},
{
 n:11, title:'The Goalkeeper: Shot-Stopping, Crosses, 1 v 1 and Distribution', short:'Goalkeeper',
 lead:'Goalkeeping grows in range and leadership. Fifth graders set a position and an angle, save with hands and feet, dive on a crash mat, claim crosses with a W grip and a step, close down a 1 v 1, start attacks with throws and kicks from the ground and organise the defense with calls, while every child still takes a turn in goal.',
 builds:[7,10], focus:{Technical:5,Physical:4,Psychological:4,Social:3},
 grew:{pre:'4th graders move to narrow the angle, catch crosses with a W grip and a step, save with hands and feet, throw and kick from the ground to start attacks and talk to the defenders.',k:'5th graders set a position and an angle, save with hands and feet, dive onto a crash mat, claim crosses with a W grip and a step, close down a 1 v 1, start attacks with throws and kicks from the ground and organise the defense with calls.'},
