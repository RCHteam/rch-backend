<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCH 3rd Grade Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#FFFFFF;--bg2:#F7F9F8;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}

:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}
.calw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.calmain{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ctb{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ctb h3{margin:0 8px;font:600 20px var(--body);text-transform:none;letter-spacing:0;flex:1;min-width:140px}.vsw{display:flex;gap:0}.vsw .btn:first-child{border-radius:6px 0 0 6px}.vsw .btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.mg{overflow-x:auto}.mh,.mr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px}
.mh span{padding:8px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;border-bottom:1px solid var(--line)}
.mc{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}.mc:nth-child(7n){border-right:0}
.mc.oth{background:var(--bg3);opacity:.7}.dnum{font:500 12px var(--mono);color:var(--mute);align-self:flex-end;padding:1px 5px;border-radius:99px}
.mc.today .dnum{background:var(--accent);color:var(--accent-ink)}.mc.skipped{background:repeating-linear-gradient(45deg,transparent 0 8px,color-mix(in srgb,var(--line) 60%,transparent) 8px 9px)}
.ev{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:5px;background:var(--c);color:#fff;padding:3px 6px;cursor:pointer;font:inherit;width:100%;min-width:0}
.ev b{font:600 11.5px/1.25 var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;word-break:break-word}.ev small{font:500 10px var(--mono);opacity:.85}.ev:hover{filter:brightness(1.12)}.ev.on{outline:2px solid var(--ink);outline-offset:1px}
.nop{border:0;background:none;font:500 10px var(--mono);color:var(--mute);cursor:pointer;text-align:left;padding:2px}
.ag{padding:6px 14px 14px;display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto}.agm{margin:14px 0 4px}
.agr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:9px 6px;cursor:pointer;font:inherit}.agr:hover,.agr.on{background:var(--bg3)}.agr.past{opacity:.5}
.agd{font:500 12px var(--mono);color:var(--mute)}.agc{display:grid;grid-template-columns:12px minmax(0,1fr);gap:0 8px;align-items:center}.agc i{width:12px;height:12px;border-radius:99px;background:var(--c)}.agc b{font-weight:600}.agc small{grid-column:2;color:var(--mute);font-size:12.5px}
.caldet{position:sticky;top:16px}.dp{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.dp-bar{height:6px;margin:-16px -18px 10px}.dp h3{margin:0;font-size:22px}.dsub{margin:0;color:var(--mute);font-size:13px}.dp p{margin:4px 0;font-size:14px}.dp label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.dp input,.dp select{font:13px var(--body);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.lnk{border:0;background:none;color:var(--accent);font:500 12px var(--mono);cursor:pointer;padding:0;text-align:left}
.mini{list-style:none;margin:6px 0;padding:0;display:grid;gap:3px;font-size:13px}.mini span{font:500 11px var(--mono);color:var(--accent);display:inline-block;width:52px}
.skl{margin:0;padding-left:1.1em;font-size:13px}
.leg2{display:grid;gap:3px;font-size:12.5px}.leg2 a{text-decoration:none;display:flex;align-items:center;gap:8px}.leg2 i{width:10px;height:10px;border-radius:99px;display:inline-block}
@media (max-width:900px){.calw{grid-template-columns:minmax(0,1fr)}.caldet{position:static}.agr{grid-template-columns:90px minmax(0,1fr)}}
.calw{grid-template-columns:minmax(0,1fr)!important}.mc.has{cursor:pointer}.mc.has:hover{background:color-mix(in srgb,var(--accent) 6%,var(--bg2))}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 40px #0004;z-index:9;overflow:auto;padding:0}
.drawer[hidden]{display:none}
.dcard,.drawer>.dp{padding:0 22px 28px;display:flex;flex-direction:column;gap:6px;position:relative}
.drawer>.dp{padding-top:50px}
.dcard .dp-bar{height:8px;margin:0 -22px 14px}
.x{position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;z-index:2}.x:hover{border-color:var(--accent)}
.dcard h3{margin:2px 0 0;font-size:26px;padding-right:40px}.dcard .lvl{margin:4px 0 0;font-size:14px}
.rems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rem{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:8px;background:var(--bg2);text-decoration:none;font-size:12.5px;color:var(--mute);line-height:1.4}.rem b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}.rem:hover{border-color:var(--accent)}
.dcb{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dch h4{margin:0;font:600 14px var(--body);text-transform:none;letter-spacing:0}
.dcb p{margin:0;font-size:13.5px}.dcf{color:var(--mute);font-size:12.5px!important}
.dcb .scene{margin-top:4px}
@media (max-width:600px){.rems{grid-template-columns:minmax(0,1fr)}}

.grewc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.grewc .card.kgrow{border-color:var(--accent)}
.grewc .card h4{margin:0 0 6px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.cols2 .chip{display:inline-block;margin-right:4px}
@media (max-width:700px){.grewc,.cols2{grid-template-columns:minmax(0,1fr)}}
.dsteps{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:6px}.dsteps li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;font-size:13.5px;line-height:1.45}.dsteps b{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding-top:3px}@media (max-width:600px){.dsteps li{grid-template-columns:minmax(0,1fr);gap:1px}}
</style>
<style>.devc{margin-top:14px}.devc h4{margin-top:0}</style>
<style>.dlv{margin:12px 0 4px;font:600 11px/1.2 var(--mono,monospace);text-transform:uppercase;letter-spacing:.08em;color:var(--muted,#667)}.dlist .dlv:first-child{margin-top:0}
.sc-key{margin:.5rem 0 0;font-size:.82rem;line-height:1.35;border:1px solid var(--line,#ccd);border-radius:8px;padding:.35rem .6rem;background:var(--card,transparent)}
.sc-key summary{cursor:pointer;font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.sc-key ul{list-style:none;margin:.35rem 0 .1rem;padding:0;display:grid;gap:.3rem}
.sc-key li{display:flex;gap:.5rem;align-items:flex-start}
.sc-key .kd{flex:none;width:1.45rem;height:1.45rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.75rem;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.sc-key li.kx{opacity:.8;padding-left:2rem}

.sc-key .kd.ko{background:#2C7A4D;border-color:#fff;color:#fff}
.sc-key .kd.tool{background:#7a4a00}
.sc-key .kd.rule{background:#444}
.sc-key li.kx{padding-left:0}
.how{margin:.8rem 0;padding:.7rem .9rem;border:1px solid var(--line,#ccd);border-radius:10px}
.how h4{margin:0 0 .4rem;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}
.how ol{margin:0;padding-left:1.3rem;display:grid;gap:.35rem;font-size:.95rem;line-height:1.4}

<script>
window.CHAPTERS=[
{
 n:1, title:'Leadership, Communication and Team Culture', short:'Leadership & Culture',
 lead:'Leadership grows from taking a job to guiding a team. Third graders run a team talk, referee a short game, lead a restart plan, give and receive feedback with kind words and keep the team promise without a reminder.',
 builds:[], focus:{Technical:1,Physical:1,Psychological:5,Social:5},
 grew:{pre:'2nd graders choose captains by a fair rotation, wear a bibbed role (attacker, defender, helper, keeper) in every game, run restarts with the referee signals, set a team goal for the cycle and take a turn as helper referee.',k:'3rd graders captain a full game, referee a short game with the helper-referee signals, lead a team talk of three sentences, give feedback with a kind word and a tip, and run a restart plan.'},
 dev:'Between 8 and 10 children care a great deal about friends and fairness and begin to compare themselves with others. Self-evaluation and empathy are still early before about age 10 (Jolles report for the KNVB), and verbal children can seem more mature than they are. Soccer use: short, concrete leadership jobs, feedback in small steps, and no early rankings.',
 basis:[['JOLLES','Self-evaluation and empathy are still early; keep feedback concrete and short, and do not assume verbal children understand everything.'],['FA','Social corner: ground rules, player-led and coach-led time, and plan, do, review.'],['FFF','Life rules and game rules are taught together: fair play, refereeing and respect; parents encourage and do not coach from the sideline.'],['DFB','Coaches act as joint game leaders and step in only when needed; children decide on the pitch themselves.']],
 game:'Captains Cup: 4 v 4 where each captain makes the half-time plan, calls restarts and rotates jobs; the team earns a fair-play point for a kind word or an honest call.',
 objectives:['Lead a three-sentence team talk before a game','Referee a short game with clear signals and explain a call in one sentence','Give a teammate feedback with a kind word and one tip','Run a restart plan (throw-in, corner, free kick) as captain'],
 outcomes:['Leads a team talk without a script','Refs two minutes with 80 percent correct calls','Gives a kind-word-and-tip feedback twice in a practice','Leads a restart plan with the group following'],
 concepts:[['Coach term / child language',[['Team talk','"Three sentences: our plan, our job, our promise"'],['Referee call','"Signal, say, restart"'],['Kind word and a tip','"First what was good, then one idea"'],['Restart plan','"Who throws, who runs, who stays"'],['Fair-play point','"A point for being honest"'],['Captain rotation','"Everyone leads once"'],['Team promise','"Safe, kind, listening, brave"']]]],
 why:'Eight- and nine-year-olds like real responsibility and can follow a clear job card. Short scripts help children who are verbally strong but still learning to see other people’s feelings. Kind words and a tip make feedback safe, and refereeing teaches rules from the inside.',
 details:[
 {h:'The team talk',p:['A team talk is three short sentences: the plan, my job and our promise. Children practise it first in pairs, then in front of the team. The coach models one first.','Keep it under a minute. Praise the clear sentence, not the loud voice.'],pts:['Plan, job, promise','Practise in pairs first','Under one minute','Praise clarity'],scene:'circle'},
 {h:'Refereeing a short game',p:['Referees use the signals taught in 2nd grade and add the call and a short reason: "Hands, free kick." The coach stands beside the pitch and helps only if the game stops. Referees rotate every round so everyone sees how hard the job is.','Praise honest calls against your own team most of all.'],pts:['Signal, say, restart','Short reason','Rotate referees','Praise honest calls'],scene:'refsignals'},
 {h:'Kind word and a tip',p:['Feedback between children has two parts: something good first, then one idea to try. Children practise the two parts with a sentence frame such as "I liked... next time try...".','The Jolles report says self-evaluation is still early, so keep feedback short and concrete and never ask a child to rank a teammate.'],pts:['Good first','One idea only','Sentence frame','No ranking'],scene:'pairs'},
 {h:'Restart plans',p:['A restart plan names three jobs: who takes the restart, who moves into space and who stays back. Captains decide the plan in ten seconds and say it aloud. The plan is used for throw-ins, corners and free kicks and is taught in chapter 12.','Plans stay simple and change each round so every child gets a job.'],pts:['Taker, mover, stayer','Ten seconds to decide','Say it aloud','Rotate jobs'],scene:'stations'},
 {h:'Fair play and honest points',p:['A fair-play point is awarded for an honest call, a kind word or helping an opponent up. Points are counted in the closing circle, never used to rank children, and never replace the score in a game.','The FFF links the rules of life and the rules of the game; this is the same idea for 8 and 9 year olds.'],pts:['Honest calls','Kind words','Helping an opponent','Count in the circle'],chart:'session'}
 ],
 drills:[],
 faults:[['Captain bosses others','Confusing leading with ordering','Practise asking questions: "What do you think?"'],['Referee ignores own team’s fouls','Fear of friends','Praise honest calls; rotate referees often'],['Feedback becomes teasing','No frame to follow','Use the sentence frame and model it'],['Team talk too long','Nerves','Limit to three sentences and a clap'],['Restart plan forgotten','Too many instructions','One job per child, say it aloud twice']],
 check:'Child leads a team talk, refs a short game with correct signals, gives a kind word and a tip and runs a restart plan.'
},
{
 n:2, title:'Speed, Agility and Power', short:'Speed & Power',
 lead:'Athletic movement becomes faster and more explosive. Third graders sprint over 20 to 25 yards from different starts, use cone-sprint grids and speed rings, run ladder and hurdle circuits, react to a ball that bounces unpredictably and time themselves against their own best.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:3},
 grew:{pre:'2nd graders add agility ladders and low hurdles, run 15 to 20 yard sprints from varied starts, cut at speed, react to two signals at once and use timing gates to compare themselves with their own earlier time.',k:'3rd graders sprint 20 to 25 yards, move through cone-sprint grids and speed rings, combine ladder, hurdles and dots in short circuits, react to a reaction ball and use timing gates for repeated sprints against their own best.'},
 dev:'Motor coordination improves quickly between 8 and 10; many European coaching sources call this a strong period for learning movement and technique, but the evidence for exact sensitive windows is limited and children of one age differ widely (Jolles; World Rugby LTAD for the general model). The FFF livret asks for short blocks and no mechanical overload because bones are still growing. Soccer use: varied, playful speed work with full rests.',
 basis:[['LTAD','Fundamental movement skills first; agility, balance, coordination and speed trained through play.'],['FFF','Short, varied blocks; avoid mechanical overload; psychomotor work (balance, coordination, reaction, rhythm, footwork) is built into workshops.'],['JOLLES','Children of the same age differ widely in coordination; playful practice speeds learning and builds motivation.'],['FIFA11','A structured warm-up (FIFA 11+ Kids) can be combined with the dynamic moves.']],
 game:'Sprint and Score: 4 v 4 where a sprint through a cone gate earns the right to shoot at a pop-up goal; the fastest recovery counts as a point.',
 objectives:['Sprint 20 to 25 yards from standing, crouch, lying and moving starts','Run a ladder, hurdle and dots circuit with light feet','React to an unpredictable bounce and change direction','Compare your own times on a timing gate across the season'],
 outcomes:['Runs a 20-yard sprint in an improving own time','Completes a three-tool circuit without a touch','Catches or controls 3 of 5 reaction-ball bounces','Keeps good running form at the end of a set'],
 concepts:[['Coach term / child language',[['Cone-sprint grid','"Sprint to the cone you hear"'],['Speed rings','"Quick feet in the ring"'],['Agility dots','"Touch each dot with the right foot"'],['Reaction ball','"Be ready for a funny bounce"'],['Timing gate','"Race your own best"'],['Power hop','"Spring up, land soft"'],['Full rest','"Walk back, then go again"']]]],
 why:'Third graders enjoy racing themselves and trying new equipment. Short sprints with full rests build speed without tiring them. A reaction ball and dots make the body listen to the eyes. Landing soft keeps joints safe.',
 details:[
 {h:'Sprint starts and the cone grid',p:['Starts come from standing, a crouch, lying down and a moving jog. A cone-sprint grid has three or four cones at 5, 10 and 15 yards; the coach calls a colour and the child sprints to it and back.','Keep sprints at 20 to 25 yards and rest at least ten times the work.'],pts:['Vary the start','Call a colour','Full rest','Tall posture'],scene:'sprint'},
 {h:'Ladder, dots and rings',p:['Ladder patterns (two feet in, in and out, sideways), dots (touch each with a named foot) and speed rings (quick feet in and out) make footwork a rhythm game.','Keep the set to ten seconds and change the pattern each turn.'],pts:['Ten-second sets','Name the foot','New pattern each turn','Light feet'],scene:'ladder'},
 {h:'Hurdles and power',p:['Low hurdles teach stepping, hopping and soft landing. Power work is body-weight only: hops, bounds and squat jumps in play form, never repeated to tiredness.','Stop if landings become heavy or the child’s knees collapse inward.'],pts:['Low hurdles','Land soft on both feet','Body weight only','Stop when form drops'],scene:'balance'},
 {h:'Reaction ball and signals',p:['A reaction ball bounces unpredictably, so the child has to read and react. Signals include a colour, a number, a clap or a light, and children react with a sprint, a cut or a catch.','Start from a ready position and make the first reaction easy.'],pts:['Ready position','One signal at a time','Easy first reaction','Celebrate quick eyes'],scene:'trafficlight'},
 {h:'Racing your own best',p:['Timing gates or a stopwatch give each child a personal time. Children try to beat their own best, never someone else’s. Times stay private and are used to notice progress.','The aim is progress against the self; it also protects children born late in the year who may be smaller.'],pts:['One card per child','Own best only','Keep results private','Praise improvement'],chart:'balance'}
 ],
 drills:[],
 faults:[['Heavy, flat landings','Fatigue or weak control','Lower the volume and focus on soft landing'],['Sprint form collapses','Too many repetitions','Shorter sets and longer rest'],['Child dreads the timing gate','Fear of being slow','Use own-best only and keep times private'],['Reaction late','Not ready','Cue the ready position before each signal'],['Knees fall inward on jumps','Weak control','Use low hurdles and a lower jump height']],
 check:'Child sprints 20 yards with good form, completes a ladder, hurdle and dots circuit and reacts to a bounce.'
},
{
 n:3, title:'Dribbling, Feints and 1 v 1 Attack', short:'Dribbling & Feints',
 lead:'Dribbling becomes a weapon. Third graders carry the ball at speed with both feet, learn the step-over, the Cruyff turn, the stop-and-go and the body feint, weave poles and slalom sets, and attack a defender in a 1 v 1 with a plan.',
 builds:[2], focus:{Technical:5,Physical:3,Psychological:4,Social:2},
 grew:{pre:'2nd graders dribble through poles on both feet, add a drag back and a simple step-over, change pace twice in one run, shield and turn out of pressure, and keep the head up to choose a target.',k:'3rd graders add feints (step-over, body feint, Cruyff turn, stop-and-go), dribble through slalom sets at speed, attack a live defender with a plan and know when to dribble and when to pass.'},
 dev:'Children of 8 and 9 can link several movements and are keen to copy skills they see. They enjoy trying a move on a friend. The FA’s staying-on-the-ball guidance supports ball mastery with a clear progression and shielding, and the FIFA dribbling page asks for freedom of expression. Soccer use: lots of unopposed work, then light pressure, then a real 1 v 1.',
 basis:[['FIFA','Dribbling: unopposed first, then light competition, then 1 v 1; freedom of expression.'],['FA','Ball mastery progression, when to stay on the ball and shielding.'],['FFF','Workshops move from an analytical exercise to an adaptive one to a situation and a game.'],['JOLLES','Playful practice speeds skill learning and builds intrinsic motivation.']],
 game:'Dribble Duel Square: 4 v 4 with a rule that each player must complete one feint before shooting; a goal after a feint counts double.',
 objectives:['Dribble through a slalom set at speed with both feet','Perform a step-over, a Cruyff turn and a stop-and-go','Use a body feint to beat a mannequin','Decide in a 1 v 1 whether to dribble, shield or pass'],
 outcomes:['Dribbles a ten-pole set with no stray touch','Performs three feints on request','Beats a mannequin in 4 of 6 tries','Chooses to pass when a teammate is free'],
 concepts:[['Coach term / child language',[['Step-over','"Show the ball to one side, go the other"'],['Cruyff turn','"Fake a pass, drag it behind your standing leg"'],['Stop-and-go','"Freeze the ball, then burst"'],['Body feint','"Move your shoulders, not only your feet"'],['Slalom set','"Weave without touching"'],['Speed dribble','"Push it ahead and run"'],['Take on or pass','"Look first: is a friend free?"']]]],
 why:'Third graders have the balance and rhythm to try feints and love to surprise a partner. A mannequin makes the first attempts safe. Slalom sets and poles build touch and speed, while a rule like one feint before a shot links the move to the game.',
 details:[
 {h:'Slalom sets and speed',p:['Slalom sets use poles, cones or discs in straight, zigzag and curved lines. Children use the inside and outside of both feet and push the ball a little further each time as speed grows.','Praise the quiet, close touches before praising speed.'],pts:['Inside and outside','Both feet','Push further with speed','Quiet touches'],scene:'zigzag'},
 {h:'Feints: step-over and Cruyff turn',p:['The step-over (a foot goes around the ball) and the Cruyff turn (fake a pass, drag the ball behind the standing leg) are learned first slowly and without pressure. Then they are used against a mannequin and finally a live defender.','Keep each feint to three coaching words.'],pts:['Slow first','Mannequin next','Live defender last','Three words'],scene:'fake'},
 {h:'Stop-and-go and the body feint',p:['A stop-and-go freezes the ball with the sole, then bursts. A body feint moves shoulders and hips one way and takes the ball the other. Both change the defender’s balance.','Teach the burst after the feint: a good feint with a slow burst fails.'],pts:['Freeze with the sole','Shoulders move first','Burst after the feint','Look at the defender'],scene:'cut'},
 {h:'Shielding and running with the ball',p:['Shielding puts the body between the defender and the ball, arms soft and low. Running with the ball uses long pushes and eyes up. Both keep the ball in a crowded space.','The FA’s guidance on staying on the ball is the basis for this progression.'],pts:['Body between','Arms soft','Eyes up','Change pace'],scene:'shield'},
 {h:'Take on or pass',p:['A good dribbler also knows when to pass. A simple cue: if a teammate is free and facing forward, pass; if space is ahead and the defender is slow, go. Children practise the choice in small games and tell the coach what they saw.','The goal is a player who uses the dribble as one of several tools.'],pts:['Look first','Teammate free: pass','Space ahead: go','Say what you saw'],chart:'dribble'}
 ],
 drills:[],
 faults:[['Ball runs away on speed dribble','Pushes too hard','Smaller pushes, then longer'],['Feint without burst','Stops after the fake','Count one-two-go'],['Always dribbles','Likes the ball','Praise a pass as a skill and use a pass-rule'],['Head down','Focus on the ball','Hold up fingers for the child to call'],['Shielding with arms out','Fear of contact','Soft arms, body low, no pushing']],
 check:'Child dribbles a ten-pole set, performs three feints and beats a mannequin in 4 of 6 tries.'
},
{
 n:4, title:'First Touch, Turning and Playing Under Pressure', short:'First Touch & Pressure',
 lead:'Receiving moves from controlling the ball to playing under pressure. Third graders control a bouncing and a driven pass, take the first touch away from a mannequin or a chaser, receive on the half-turn, and use rebound boards and bounce-back nets for many repeated touches.',
 builds:[3], focus:{Technical:5,Physical:2,Psychological:4,Social:3},
 grew:{pre:'2nd graders use a rebound board for repeated control, receive across the body, take the first touch into the next action, receive and turn with a passive then live defender, and control balls from different angles.',k:'3rd graders control faster passes and bouncing balls, receive on the half-turn, take a first touch away from pressure, use a bounce-back net for repetitions and turn with a drag back or inside hook under light pressure.'},
 dev:'Eye-foot coordination and visual tracking keep improving between 8 and 10, so children can follow a moving ball while thinking about the next action. Children differ widely; some still need calm repetition. The FFF booklet lists trajectory reading and first touch as core workshops. Soccer use: many controlled repetitions, then pressure, then a decision.',
 basis:[['FFF','Psychomotor workshops include trajectory reading, juggling, perception and information-taking; technical workshops include ball control and first touch.'],['FA','Perception and technique are trained together; random, variable practice beats repeated blocks.'],['FIFA','Small games give many touches and game-like situations.'],['CDC6','Catching and ball skills become easier; visual tracking is still developing.']],
 game:'Turn and Score: 4 v 4 where a goal counts double only if the scorer received on the half-turn; a teammate calls "turn" when space is ahead.',

 details:[
 {h:'Controlling faster and bouncing balls',p:['Passes are faster and balls bounce. Children cushion with the inside of the foot, the thigh or the sole and decide quickly which part to use. They first learn to control the ball in one stride, then to control and turn.','Use soft passes first and increase pace only when control is steady.'],pts:['Cushion','Choose the surface','One stride','Pace up slowly'],scene:'receive'},
 {h:'The half-turn',p:['A half-turn means standing open, with the body side-on, so the receiver can see both the passer and the field. It makes the first touch forward easier.','Practise with a partner who calls "turn" or "back" depending on the space.'],pts:['Open body','See both','First touch forward','Partner calls'],scene:'turn'},
 {h:'First touch away from pressure',p:['A mannequin or a gentle chaser provides pressure. The child takes the first touch away from the defender, with the foot farthest from them. The touch should leave the ball in a place where the next action is easy.','Increase pressure slowly: still mannequin, walking, jogging.'],pts:['Foot farthest away','Ball in the next space','Slow pressure','Praise good touches'],scene:'shield'},
 {h:'Bounce-back net and rebound board',p:['A bounce-back net or rebound board returns the ball. Children work for 30 to 45 seconds and count clean controls. Surfaces and pace change every set.','Move the net back to lengthen the pass only when control is steady.'],pts:['30 to 45 seconds','Count clean controls','Change surface','Move back slowly'],scene:'rebound'},
 {h:'Look before the ball arrives',p:['A quick look before the ball arrives gives the receiver information for the first touch. Children practise by checking over the shoulder and naming what they saw: a free player, space or a defender.','A study of older players linked more head turns before receiving with faster passing; it is only a guide at this age.'],pts:['Look before','Say what you saw','Praise the look','Use short looks'],chart:'scan'}

{
 n:5, title:'Passing: Long, Short and Switching', short:'Passing & Switching',
 lead:'Passing grows in distance and purpose. Third graders pass 15 to 20 yards with the laces, play firm short passes under light pressure, switch the point of attack with a long pass, pass into a runner’s path and use the outside and the weaker foot as normal choices.',
 builds:[3,4], focus:{Technical:5,Physical:2,Psychological:3,Social:4},
 grew:{pre:'2nd graders pass 12 to 15 yards with the right weight, hit rings and arcs, play patterns in a triangle with a third player, pass with both feet and use the outside foot in a game.',k:'3rd graders pass 15 to 20 yards, switch the play to the other side, pass under light pressure, lead a runner with a pass into the path, use passing arcs and rings at longer range and play with both feet in 5 v 5.'},
 dev:'Leg strength and timing continue to improve between 8 and 10, and children understand better where a teammate will be a moment later, but reading intentions is still limited. The FIFA numeric-progression page uses 2 v 1 possession games where the player who loses the ball swaps with the defender, which keeps every child involved. Soccer use: passes with a purpose, partners who call and show, and many repetitions in games.',
 basis:[['FIFA','Numeric progression: 2 v 1 keep-ball where the loser swaps with the defender; the coach does not need to intervene.'],['DFB','The game is the teacher; keep the number of themes small.'],['KNVB','6 v 6 pupil games give many pass options and many touches.'],['JOLLES','Limited empathy before about age 10: partners must talk and show where they want the ball.']],
 game:'Switch Game: 5 v 5 with two side zones; a pass that switches from one side zone to the other earns a bonus before the team can score.',
 objectives:['Pass 15 to 20 yards with the laces and a clear follow-through','Pass firmly under light pressure with the inside foot','Switch the play with a long pass to the free side','Lead a runner with a pass into the path'],
 outcomes:['Hits the target in 6 of 10 passes from 18 yards','Completes 8 of 10 short passes under light pressure','Switches the play in 3 of 5 tries','Leads a runner in 4 of 6 passes'],
 concepts:[['Coach term / child language',[['Switch','"Change the side with one long pass"'],['Laces pass','"Hit the ball low and long with the laces"'],['Into the path','"Pass where the runner will be"'],['Under pressure','"Pass early before the defender arrives"'],['Weight','"Not too soft, not too hard"'],['Outside foot','"A quick pass without turning"'],['Call and show','"Say my name and show the space"']]]],
 why:'Nine-year-olds can kick a ball 15 to 20 yards with some control and can picture where a teammate will be. Long passes need space, so the switch game uses zones. Calling and showing helps the passer when empathy is still early.',
 details:[
 {h:'The laces pass',p:['The laces pass is a low, firm pass over 15 to 20 yards. The plant foot sits beside the ball, the ankle is locked and the foot follows through. Children learn it first on a still ball, then on a rolling one.','Do not stretch distance too fast: accurate beats far.'],pts:['Plant beside the ball','Lock the ankle','Follow through','Accurate before far'],scene:'pass'},
 {h:'Short passes under pressure',p:['Pressure means the pass must come sooner. A mannequin, a walking defender and later a jogging one add pressure in steps. The receiver checks and shows.','Praise early passes more than clever ones.'],pts:['Pass early','Use the inside foot','Receiver shows','Add pressure slowly'],scene:'triangle'},
 {h:'Switching the play',p:['A switch is a long pass from a crowded side to an open side. Children learn to look for the empty side first and then pass. Side zones in a game make the switch visible.','The idea is simple: if one side is crowded, go to the side with space.'],pts:['Find the empty side','Look then pass','Use side zones','Cheer the switch'],scene:'spread'},
 {h:'Leading a runner',p:['A pass into the path of a runner means passing to where the runner will be, not to where they stand. Children learn to pass slightly ahead of the runner and in front of the defender.','The runner calls and moves; the passer waits one beat and leads.'],pts:['Pass ahead','Runner calls and moves','Wait one beat','Rotate roles'],scene:'follow'},
 {h:'Both feet and the outside foot',p:['Passing with the weaker foot is practised in every session. The outside of the foot is added for quick passes to the side. Children choose the surface in games.','Praise the try before the result.'],pts:['Weaker foot daily','Outside foot as a choice','Choose the surface','Praise the try'],chart:'pass'}
 ],
 drills:[],
 faults:[['Pass too soft','Fear of power','Practise firmer passes at short distance'],['Pass lofted by mistake','Leaning back','Cue: lean over the ball'],['Switch too late','Eyes on the ball','Peek early at the other side'],['Runner stands still','Waiting for the ball','Call and move'],['Weaker foot ignored','Comfort','Count weaker-foot passes']],
 check:'Child passes 6 of 10 from 18 yards, switches the play and leads a runner into the path.'
},
{
 n:6, title:'Finishing: Angles, Cutbacks and Rebounds', short:'Finishing',
 lead:'Finishing grows from clean strikes to scoring in game situations. Third graders shoot from different angles, finish cutbacks and low crosses first time, follow up rebounds, finish after a dribble and use small cages and target nets to aim at corners.',
 builds:[4,5], focus:{Technical:5,Physical:3,Psychological:4,Social:3},
 grew:{pre:'2nd graders shoot with both feet from a run-up, place shots in a pop-up goal, finish from different angles, score rebounds, finish after a dribble and a pass, and shoot early in a 1 v 1.',k:'3rd graders shoot from angles and after a dribble, finish cutbacks and low crosses first time, follow up rebounds and aim at corners of mini cages and target nets with both feet.'},
 dev:'Between 8 and 10 children can combine a run, a plant foot and a strike more reliably, and they are willing to try a risky shot when mistakes are cheered. The DFB game forms use small goals and a shooting zone to get many shots; the FFF lists shooting, finishing and crossing as technical workshops. Soccer use: many shots in games, targets for placement and praise for brave tries.',
 basis:[['DFB','Mini goals and a shooting zone create many shots and goals.'],['FFF','Technical workshops: shooting, finishing and crossing; analytical, adaptive, situation, game.'],['FIFA','Small-sided games give many chances; keep sessions fun and effective.'],['KNVB','Small pupil goals (5 x 2 m) make placement matter.']],
 game:'Cage and Cutback Game: 4 v 4 with two pop-up goals and two mini cages; goals scored from a cutback or a first-time finish count double.',
 objectives:['Shoot from different angles with either foot','Finish a cutback or a low cross first time','Follow up a rebound in a game','Place a shot at a corner target or a mini cage'],
 outcomes:['Hits 6 of 10 shots on target from 12 yards','Finishes 4 of 8 cutbacks first time','Scores one rebound in 5 tries','Hits a corner target in 3 of 8 tries'],
 concepts:[['Coach term / child language',[['Angle','"Look where the goal is from where you stand"'],['Cutback','"A pass back from the goal line"'],['Low cross','"Along the ground to the middle"'],['Rebound','"Follow the shot"'],['Mini cage','"A tiny goal for placement"'],['Target net','"Aim at the corner target"'],['Early shot','"Shoot before they close you"']]]],
 why:'Third graders enjoy aiming at a corner and are ready for angles and quick finishes. Cages and target nets give feedback for placement. Cutbacks teach them to see a passer and a runner as one move.',
 details:[
 {h:'Shooting from angles',p:['From a wide angle the shot goes low and across to the far post or low at the near post. Children test how the angle changes the target.','Move the starting point every round so the problem changes.'],pts:['Look at the goal','Low and across','Change the angle','Both feet'],scene:'shoot'},
 {h:'Cutbacks and low crosses',p:['A cutback is a pass back from near the goal line to a runner. The finisher arrives, looks and strikes first time. Low crosses go along the ground to the same space.','Teach the runner’s timing: arrive late, not early.'],pts:['Pass back','Arrive late','First time','Look then strike'],scene:'firsttime'},
 {h:'Follow the shot',p:['Rebounds come from saves and posts. A follow-up runner chases every shot and finishes the rebound. Children learn that the second chance is worth chasing.','Praise the chase as much as the finish.'],pts:['Chase every shot','Finish the rebound','Stay alert','Praise the chase'],scene:'rebound'},
 {h:'Mini cages and target nets',p:['A mini cage is a tiny goal; a target net or sheet hangs corner targets in the goal. Children aim for a called target. Hits are counted by each child for themselves.','Use a bigger target first; shrink it as accuracy rises.'],pts:['Called target','Count your own hits','Big then small','Cheer the hit'],scene:'colors'},
 {h:'Shoot early',p:['An early shot is taken before the defender closes in. Children learn the cue: space and a clear view. They also learn not to shoot if a teammate is free in a better place.','Praise the choice, not only the goal.'],pts:['Space and a view','Shoot early','Teammate free: pass','Praise the choice'],chart:'shoot'}
 ],
 drills:[],
 faults:[['Shoots into the keeper','Aims at the middle','Aim at a corner target'],['Cutback runner arrives too early','Leaves too soon','Cue: wait for the ball to roll'],['Stops the ball on a first-time chance','Fear','Start with softer balls'],['Ignores rebound','Watches the shot','Chase every shot'],['Shoots too far out','Excitement','Mark a shooting zone']],
 check:'Child hits 6 of 10 shots on target, finishes cutbacks first time and follows up a rebound.'
},
{
 n:7, title:'Defending: Pressure, Cover and Winning the Ball', short:'Pressing & Defending',
 lead:'Defending becomes a team skill. Third graders close the ball quickly, jockey side-on, cover a teammate, keep goal-side, make a safe tackle on a moving ball and work with a partner in a 2 v 2 using a pressure and cover pattern.',
 builds:[2,3], focus:{Technical:4,Physical:4,Psychological:4,Social:4},
 grew:{pre:'2nd graders jockey a moving attacker, delay for three seconds and guide to one side, make a block tackle on a rolling ball, recover goal-side, and learn what a fair challenge is.',k:'3rd graders close down fast and jockey, cover a teammate, defend in pairs with pressure and cover, use a mannequin wall against free kicks and learn the idea of a foul and a card.'},
 dev:'Between 8 and 10, children can read an attacker’s movement better and can coordinate with a partner, but anticipation and empathy are still developing. The FFF lists defending the goal, recovering the ball and pressing as tactical workshops. Soccer use: patient, safe defending with partner roles and no sliding.',

 game:'Press and Cover Game: 5 v 5 where the nearest defender presses and a second defender covers; a won ball scores if played through the mannequin gate.',

 concepts:[['Coach term / child language',[['Press','"The nearest player closes fast"'],['Cover','"The second player stands behind and helps"'],['Jockey','"Stay side-on and wait"'],['Goal-side','"Stay between ball and goal"'],['Mannequin wall','"A wall to block a free kick"'],['Foul','"Careless, reckless or too strong"'],['Card','"A sign to protect players"']]]],

 details:[
 {h:'Close down, then jockey',p:['The first defender runs quickly to close the ball and then slows down, side-on, with knees bent. The jockey delays the attacker until a teammate arrives.','The coach counts seconds aloud. Three seconds is a success.'],pts:['Fast then slow','Side-on, knees bent','Delay','Count aloud'],scene:'jockey'},
 {h:'Pressure and cover',p:['Pressure and cover are a pair: one presses the ball, the other stands a few steps behind and to the side to help. The cover player speaks: "I have cover".','Rotate the pair so both roles are learned.'],pts:['One presses, one covers','Speak up','Few steps behind','Rotate'],scene:'cover'},
 {h:'Safe tackling',p:['The tackle uses the inside of the foot on a moving ball, with a firm ankle, and comes after a delay. Sliding tackles are not taught. A player who loses the tackle recovers goal-side.','Safe tackles are practised slowly against a mannequin first.'],pts:['Inside of the foot','After a delay','No sliding','Recover goal-side'],scene:'tackle'},
 {h:'The mannequin wall and free kicks',p:['A wall of mannequins gives a safe picture of a free-kick wall. Children learn that opponents stand back a set distance (6 yards in our small pitch) and that a wall blocks the shot. IFAB Law 13 sets the world rule at 9.15 m.','Players call who stands where, and the keeper tells the wall to move.'],pts:['Wall of mannequins','Opponents back 6 yards','Keeper calls the wall','Stay still until the kick'],scene:'setpos'},
 {h:'Fouls and cards',p:['A foul is careless, reckless or too strong. A yellow card is a caution; a red card sends a player off. In practice, children learn the signals and one sentence for each, with a funny card game that always ends in a kind word.','Cards are never used to punish children in practice; they teach the rule.'],pts:['Careless, reckless, too strong','Yellow caution, red off','Signals and sentences','Kind word at the end'],chart:'duel'}
 ],

{
 n:8, title:'Combination Play: Overlaps, Third-Man Runs and 4 v 2', short:'Combinations',

 outcomes:['Completes a wall pass in 4 of 6 tries','Plays an overlap in 3 of 5 tries','Keeps a 4 v 2 for 10 passes','Marks a triangle with discs'],
 concepts:[['Coach term / child language',[['Wall pass','"Give and go"'],['Overlap','"Run around the outside"'],['Third man','"The player who arrives last into space"'],['4 v 2','"Four keep it, two chase"'],['Width','"Spread wide"'],['Depth','"One player in front, one behind"'],['Triangle','"Always make a triangle"']]]],

 {h:'The third-man run',p:['The third man arrives late into space after two players play a short pass. It is the hardest pattern; children first walk it, then jog and then play it.','Name the three players: first, second and third.'],pts:['Walk, jog, play','Name the players','Arrive late','Use space'],scene:'overlap'},
 {h:'4 v 2 possession',p:['In a 4 v 2 four players keep the ball against two defenders. A player who loses it swaps with a defender. The number of passes counts.','The FIFA page uses a similar swap rule in 2 v 1.'],pts:['Four keep, two chase','Swap on loss','Count passes','Move and show'],scene:'threevtwo'},

 {h:'Width and depth',p:['Width pulls defenders apart and depth gives forward options. Children learn to stand wide on one side and deep on the other. The pair of ideas gives a simple shape.','The aim is a shape that changes with the ball.'],pts:['Stand wide','Stand deep','Change with the ball','Praise the shape'],chart:'combo'}
 ],

{
 n:9, title:'Scanning, Decisions and Playing Forward', short:'Scanning & Decisions',

 objectives:['Scan before the ball arrives and again after the first touch','Name two options (free player, space) before receiving','Choose between a safe pass and a forward pass','Say what you saw and why in one sentence'],
 outcomes:['Scans before receiving in 7 of 10 passes','Names two options in 5 of 8 receptions','Plays a forward pass when it is on in 4 of 6 cases','Gives a reason in one sentence'],
 concepts:[['Coach term / child language',[['Scan','"Look around like a lighthouse"'],['Two options','"Name two before the ball comes"'],['Safe pass','"A pass that keeps the ball"'],['Forward pass','"A pass that goes toward the goal"'],['If-then cue','"If I see this, then I do that"'],['Free player','"Someone with space"'],['Say why','"I passed because…"']]]],

 {h:'Name two options',p:['Before receiving, the child names two options: the free player and the space. Naming makes the choice real and shows the coach what the child sees.','Start with two cones as options, then use players.'],pts:['Name two','Cones first','Then players','Short words'],scene:'fingers'},

{

 why:'Third graders enjoy being part of a team shape and can hold a role for a few minutes. Zones and discs make the picture visible. Three seconds keeps the transition simple. A keeper who passes short teaches the whole team to play out.',
 details:[
 {h:'Roles, not positions',p:['Roles are jobs: the back protects the goal, the middle links, the front attacks and the keeper guards. Children rotate roles after a goal or a restart so everyone learns all jobs.','Formations are not taught; the point is the job.'],pts:['Back, middle, front','Rotate roles','Say the job','No formations'],scene:'setpos'},
 {h:'Shape with zones and discs',p:['Zones and discs show where players stand: a back line, a middle line and a front line. The shape stays tight when the ball is on one side and spreads when the team has the ball.','Move the discs with the ball to show the shape changing.'],pts:['Zones with discs','Tight without the ball','Spread with it','Move discs'],scene:'spread'},
 {h:'Transition in three seconds',p:['When the team wins the ball it plays forward at once; when it loses the ball the nearest player presses and the others fall back. The coach counts three seconds aloud.','The count turns a tactical idea into a game children can feel.'],pts:['Win it and go','Lose it and press','Count three','Praise quick reactions'],scene:'transition'},
 {h:'Building from the keeper',p:['The keeper rolls or passes to a back player and the team moves forward in a shape. Restarts with the hand or foot from the ground follow the FFF and KNVB habit for this age.','Back players show an angle so the keeper has a clear pass.'],pts:['Keeper rolls or passes','Back players show','Team moves forward','Start slowly'],scene:'gkthrow'},
 {h:'Formats and rotation',p:['The formats vary between countries: 6 v 6 in the Netherlands, 7 v 7 in England, 5 v 5 or 7 v 7 in Germany and 7 v 7 plus keeper at U11 in France. We use 6 v 6 and 7 v 7 in the second half of the year and rotate players often so every child plays every role.','Check your league’s rules before match days.'],pts:['6 v 6 and 7 v 7','Rotate roles','Equal playing time','Check your league'],chart:'session'}

{
 n:11, title:'Goalkeeper: Shot-Stopping, 1 v 1s and Playing Out', short:'Goalkeeper',
 lead:'The keeper becomes part of the team. Third graders catch and parry shots, dive to both sides, come out to close a 1 v 1, throw and roll to start attacks, kick from the ground and use the back-pass rule.',
 builds:[2,4,6], focus:{Technical:4,Physical:3,Psychological:5,Social:3},
 grew:{pre:'2nd graders learn angle and position, catch higher balls, dive and recover on both sides, throw overarm and roll underarm to a target, and learn when the keeper may and may not use the hands.',k:'3rd graders dive to both sides, close a 1 v 1, parry and catch, start attacks with a roll or a throw, kick from the ground, handle crosses on the ground and use hands and feet by the back-pass rule.'},
 dev:'Eight- and nine-year-olds can combine a ready position, a dive and a catch, but fear of a hard shot is common. The DFB says goalkeepers play regularly from E-Jugend and specialised training should begin gradually. Soccer use: every child tries the role, in soft conditions, with praise for brave tries.',
 basis:[['DFB','Goalkeepers play regularly in matches from E-Jugend; specialised goalkeeper training should only start gradually.'],['FFF','Keepers distribute by hand or foot after placing the ball on the ground; no volleys or half-volleys from the hands at U11.'],['KNVB','Keeper may handle only in the keeper area; a ball deliberately played back with the foot may not be picked up.'],['IFAB','Law 12: keepers who hold the ball for more than eight seconds give away a corner kick (2025/26).']],
 game:'Keeper Game: 5 v 5 with two rotating keepers; a save followed by a roll to a free player in the middle zone scores a point.',
 objectives:['Dive to both sides and get up quickly','Come out and close a 1 v 1 with a wide, low body','Parry and catch with the hands in a W','Start an attack with a roll or a throw and use the back-pass rule'],
 outcomes:['Stops 7 of 10 moderate shots','Closes a 1 v 1 in 3 of 6 tries','Catches 5 of 10 shots chest-high','Plays a back-pass correctly in a game'],
 concepts:[['Coach term / child language',[['Ready position','"Knees bent, hands ready"'],['Big W','"Hands like a W"'],['Come out','"Close the angle with a big body"'],['Roll to a friend','"Start the attack on the ground"'],['Back-pass rule','"No hands on a pass from a friend’s foot"'],['Eight seconds','"Do not hold the ball too long"'],['Brave dive','"Dive to the side, get up fast"']]]],
 why:'Third graders enjoy the keeper role when conditions are soft and the shots are fair. A rolling start and a back-pass rule make the keeper part of the team. Praise for brave tries keeps them willing to dive.',
 details:[
 {h:'Dive and get up',p:['Dives start from a crouch on soft grass. The keeper pushes sideways, lands on the side and gets up fast. Dives are never forced and always at a gentle pace first.','Count good dives, not saves.'],pts:['Soft grass','Crouch and push','Get up fast','Count the dives'],scene:'dive'},
 {h:'Closing a 1 v 1',p:['In a 1 v 1 the keeper comes out and makes a wide, low body to close the angle. Timing matters: go when the attacker’s touch is long.','Do not ask children to dive at the feet at this age; stay on the feet and block.'],pts:['Come out','Wide and low','Go on a long touch','Block with the body'],scene:'setpos'},
 {h:'Parry and catch',p:['Catching uses a W with the hands, with the thumbs behind the ball. A parry deflects the ball away from the goal. Children learn to choose by speed: catch easy shots, parry hard ones.','Use soft balls for the first attempts.'],pts:['Big W','Thumbs behind','Catch easy, parry hard','Soft balls first'],scene:'keeper'},
 {h:'Rolling, throwing and kicking out',p:['A roll starts the attack on the ground; a throw reaches a wing player; a kick from the ground goes longer. The FFF asks keepers to place the ball on the ground before kicking; no half-volleys at U11.','The keeper looks before choosing.'],pts:['Roll or throw','Ball on the ground to kick','Look first','Aim to a free player'],scene:'gkthrow'},
 {h:'Back-pass rule and eight seconds',p:['A keeper may not pick up a ball deliberately played back with the foot, and holds the ball for no more than eight seconds. The KNVB’s pupil rules warn a first back-pass and then give an indirect free kick; IFAB Law 12 sets the corner for eight seconds.','In practice, play it as a game of rule detectives.'],pts:['No hands on a foot back-pass','Eight seconds','Warn first','Rule detectives'],chart:'gk'}

{
 n:12, title:'Rules, Offside and Set Plays', short:'Rules & Set Plays',
 lead:'The rules grow into the real game. Third graders learn the offside rule step by step (stay level, the last 14 yards, then the full rule), take throw-ins, goal kicks, corners, free kicks and penalties, understand fouls and cards, use advantage and run simple set plays.',
 builds:[1,7,10,11], focus:{Technical:2,Physical:2,Psychological:4,Social:5},
 grew:{pre:'2nd graders learn the throw-in technique, goal kick, corner kick, direct and indirect free kicks, handball, advantage and the idea of staying level with the ball, using the laws of the game as the main reference.',k:'3rd graders move from the offside idea to the real rule, take free kicks with a wall, run corners and throw-ins with a plan, take penalties from a fixed mark and understand fouls, cards and advantage.'},
 dev:'Eight- and nine-year-olds can follow a rule with a reason and love to detect when it is broken, but they can argue about fairness. Self-evaluation is still early (Jolles), so rules are taught inside games with short examples. The FFF applies offside only in the last 13 m at U10 and U11, which is a good model for a step-by-step approach. Soccer use: rule games, helper referees and short plays.',
 basis:[['IFAB','Law 11: offside position is not an offence; the offence is becoming involved in active play; no offence from a goal kick, throw-in or corner kick.'],['FFF','U10 and U11: offside flagged only from the last 13 m; free kicks direct or indirect with opponents at 6 m; hands for throw-ins; keeper restarts from the ground.'],['KNVB','6 v 6: opponents at least 5 m at restarts; back-pass rule; penalty from 7 m for denying a clear chance.'],['DFB','In 7 v 7 play restarts with a throw-in for the first time; in smaller forms it restarts by dribbling.']],
 game:'Rules Game: 6 v 6 where each restart is named and taken correctly by the right team; a point for a correct restart and a kind word.',
 objectives:['Understand offside step by step: stay level, the last 14 yards, then the full rule','Take a throw-in, a goal kick, a corner kick, a free kick and a penalty correctly','Understand fouls, cards and advantage','Run a simple set play with three jobs'],
 outcomes:['Explains offside in a sentence','Takes a legal throw-in in 4 of 5','Names every restart in a game','Runs a corner set play with three jobs'],
 concepts:[['Coach term / child language',[['Offside','"Do not wait behind the last defender"'],['Offside line','"Run when the ball is played"'],['Throw-in','"Two hands over the head, both feet on the line"'],['Goal kick','"Ball on the ground, opponents outside"'],['Corner kick','"Ball in the arc, opponents back"'],['Free kick','"Direct or indirect, opponents back"'],['Penalty','"One kick against the keeper from the mark"']]]],
 why:'Third graders can understand the offside rule when it is built step by step and tested in games. A step-by-step approach, like the FFF’s last-13-metre line, makes the real rule easy. Rule games build respect for referees and fair play.',
 details:[
 {h:'Offside step by step',p:['Step one: stay level or behind the ball. Step two: offside applies only in the last 14 yards (the FFF uses the last 13 m at U10 and U11). Step three: the full rule from IFAB Law 11 in 7 v 7: a player is offside if nearer the goal line than the ball and the second-last opponent when the ball is played, and becomes involved in play.','There is no offence from a goal kick, throw-in or corner kick.'],pts:['Level or behind','Last 14 yards','Full rule later','No offence from restarts'],scene:'overlap'},
 {h:'Throw-ins, goal kicks and corners',p:['The throw-in uses both hands, behind and over the head with both feet on or behind the line. A goal kick is taken from the goal area with the ball on the ground. A corner is taken from the arc with opponents back. Distances are smaller on small pitches.','Keep restarts quick so the game continues.'],pts:['Throw-in: two hands, feet down','Goal kick: ball on the ground','Corner: ball in the arc','Quick restarts'],scene:'throwin'},
 {h:'Free kicks, walls and penalties',p:['A free kick is direct (can score) or indirect (must touch another player first). Opponents stay back 6 yards in our practice (9.15 m in IFAB Law 13; the FFF uses 6 m at U10 and U11). A penalty is one kick from a fixed mark (9 yards in our practice; KNVB 7 m at 6 v 6). The keeper stays on the line until the kick.','Penalties are taught as a game of fair turns.'],pts:['Direct or indirect','Wall 6 yards','Penalty from the mark','Keeper stays on the line'],scene:'setpos'},
 {h:'Fouls, cards and advantage',p:['A foul is careless, reckless or too strong. Cards show the severity. Advantage means the referee lets play go on when the fouled team still has a good chance. Referees explain with one sentence.','Children take turns as referee so they learn how hard the job is.'],pts:['Careless, reckless, too strong','Cards are a sign','Advantage','Referees explain'],scene:'refsignals'},
 {h:'Set plays',p:['A set play is a short plan for a restart: three jobs and a signal. Corners and free kicks use a taker, a runner and a blocker. The captain names the plan.','Plans change each round so every child gets a job.'],pts:['Three jobs','A signal','Captain names it','Rotate jobs'],scene:'matchday'}
 ],
 drills:[],
 faults:[['Offside confusion','Too many parts','Teach in three steps with a marked line'],['Throw-in with one hand','Habit','Hold the ball with both hands before'],['Wall creeps forward','Excitement','Mark the line with a pole'],['Penalty taker rushes','Nerves','Count three breaths'],['Referee afraid to whistle','Fear of friends','Praise honest calls']],
 check:'Child explains offside, takes a legal throw-in, names every restart and runs a set play.'
}

window.RULETXT={
 'Kick-off and restarts':'Rule in play: every goal is followed by a kick-off from the center; the opponents stay back at least 5 yards and the ball is in play when it moves.',
 'Referee signals':'Rule in play: the referee shows the signal for the call (goal, throw-in, goal kick, corner, free kick, advantage, card) and says the reason in one sentence.',
 'Advantage':'Rule in play: if a foul happens but the fouled team still has a good chance, the referee lets play go on and calls "advantage".',
 'Fouls and cards':'Rule in play: careless, reckless or too strong challenges are fouls (IFAB Law 12). A yellow card cautions, a red card sends a player off; in practice the cards teach and are never a punishment.',
 'Throw-in':'Rule in play: when the ball crosses the side line the other team throws in with both hands from behind and over the head, both feet on or behind the line.',
 'Goal kick':'Rule in play: when the attackers play the ball over the end line, the defending team restarts from the goal area with the ball on the ground; the ball is in play once it moves and the opponents stay outside the area.',
 'Corner kick':'Rule in play: when the defenders play the ball over their own end line, the attackers restart from the corner arc; the ball is at rest in the arc and opponents stay back.',
 'Free kick and wall':'Rule in play: after a foul the other team takes a free kick (direct can score, indirect must touch another player first). Opponents stand back 6 yards in our practice (9.15 m in IFAB Law 13); a wall of mannequins or players blocks the shot.',
 'Penalty kick':'Rule in play: a foul by the defenders inside their area gives a penalty from the mark (9 yards in our practice); the keeper stays on the goal line until the kick and all other players stay outside the area.',
 'Back-pass rule':'Rule in play: the keeper may not pick up a ball deliberately kicked back by a teammate (first time a warning, then an indirect free kick) and may hold the ball for no more than eight seconds (IFAB Law 12).',
 'Offside: stay level':'Rule idea (practice only): an attacker should stay level with or behind the ball or the last defender when a pass is played, so runs are timed.',
 'Offside: last 14 yards':'Rule in play: offside is called only in the last 14 yards in front of the goal (the FFF uses the last 13 m at U10 and U11). A player is offside if nearer the goal line than the ball and the second-last opponent when the ball is played and takes part in play.',
 'Offside: the full rule':'Rule in play: IFAB Law 11. A player is in an offside position if nearer the goal line than both the ball and the second-last opponent. It is only an offence if the player takes part in play; there is no offence from a goal kick, throw-in or corner kick. An indirect free kick restarts play.'
};
