<script>
// Animated tactical-board scenes (SVG + SMIL). Coordinates in a 600 x 340 board.
(function(){
const W=600,H=340;
const rel=(x,y,pts)=>'M0,0 '+pts.map(p=>'L'+(p[0]-x)+','+(p[1]-y)).join(' ');
const loop=(x,y,pts)=>rel(x,y,pts.concat([[x,y]]));
const pl=(x,y,team,n,pts,dur,o={})=>({t:'p',x,y,team,n,pts,dur,...o});
const bl=(x,y,pts,dur,o={})=>({t:'ball',x,y,pts,dur,...o});
const cn=(x,y,c)=>({t:'cone',x,y,c});
const lb=(x,y,text,o={})=>({t:'label',x,y,text,...o});

function pitch(lines){
  let s=`<rect width="${W}" height="${H}" fill="var(--turf)"/>`;
  for(let i=0;i<10;i++) if(i%2) s+=`<rect x="${i*60}" y="0" width="60" height="${H}" fill="var(--turf2)"/>`;
  if(lines!==false) s+=`<rect x="16" y="16" width="${W-32}" height="${H-32}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  return s;
}
function motion(o,x,y){
  if(!o.pts) return '';
  const path=o.loop===false?rel(x,y,o.pts):loop(x,y,o.pts);
  const kp=o.kp?` keyPoints="${o.kp}" keyTimes="${o.kt}" calcMode="${o.spl?'spline':'linear'}"${o.spl?` keySplines="${o.spl}"`:''}`:'';
  return `<animateMotion dur="${o.dur}s" begin="${o.begin||0}s" repeatCount="indefinite" path="${path}"${kp}/>`;
}
const TEAM={a:'var(--ta)',b:'var(--tb)',k:'var(--tk)',c:'var(--tc)'};
function item(o){
  switch(o.t){
   case 'cone': return `<g transform="translate(${o.x},${o.y})"><path d="M-7,6 L0,-8 L7,6 Z" fill="${o.c||'var(--cone)'}" stroke="#0006" stroke-width="1"/></g>`;
   case 'goal': return `<g transform="translate(${o.x},${o.y})"><rect x="${-o.w/2}" y="${-o.h/2}" width="${o.w}" height="${o.h}" fill="#ffffff22" stroke="#fff" stroke-width="3"/><path d="M${-o.w/2},${-o.h/2} L${o.w/2},${o.h/2} M${o.w/2},${-o.h/2} L${-o.w/2},${o.h/2}" stroke="#fff5" stroke-width="1"/></g>`;
   case 'zone': return `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="4" fill="${o.fill||'none'}" stroke="${o.stroke||'#fff8'}" stroke-width="2" stroke-dasharray="${o.dash||'6 5'}">${o.pulse?'<animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>':''}</rect>`+(o.label?`<text x="${o.x+o.w/2}" y="${o.y+o.h/2+4}" class="sc-t" text-anchor="middle">${o.label}</text>`:'');
   case 'circle': return `<circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${o.fill||'none'}" stroke="${o.stroke||'var(--line)'}" stroke-width="2" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
   case 'line': return `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.stroke||'var(--line)'}" stroke-width="${o.w||2}" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
   case 'label': return `<text x="${o.x}" y="${o.y}" class="sc-t ${o.cls||''}" text-anchor="${o.anchor||'middle'}">${o.text}</text>`;
   case 'link': {
      const xs=o.pts.map(p=>p[0]).concat([o.pts[0][0]]).join(';'), ys=o.pts.map(p=>p[1]).concat([o.pts[0][1]]).join(';');
      const kt=o.kt?` keyTimes="${o.kt}"`:'';
      return `<line x1="${o.x1}" y1="${o.y1}" x2="${o.pts[0][0]}" y2="${o.pts[0][1]}" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="x2" values="${xs}" dur="${o.dur}s" repeatCount="indefinite"${kt}/><animate attributeName="y2" values="${ys}" dur="${o.dur}s" repeatCount="indefinite"${kt}/></line>`;
   }
   case 'light': {
      const c=['#e5484d','#f5b82e','#2fa35b']; const d=o.dur;

function keyExtra(sc){
  const types={};let tools=[],rules=[];
  sc.items.forEach(o=>{types[o.t]=1;
    if(o.t==='label'&&typeof o.text==='string'&&/Tool:|Rule:/.test(o.text)){
      const mt=o.text.match(/Tool:\s*([^|]*)/),mr=o.text.match(/Rule:\s*(.*)$/);
      if(mt)tools=mt[1].split(',').map(x=>x.trim()).filter(Boolean);
      if(mr)rules=mr[1].split(',').map(x=>x.trim()).filter(Boolean);}});
  const r=[];
  r.push(`<li class="kx"><i class="kd ko"><svg viewBox="-8 -8 16 16" width="16" height="16"><circle r="6.5" fill="#fff" stroke="#111" stroke-width="1.6"/><circle r="2.4" fill="#111"/></svg></i><span><b>Ball</b>: the white ball. Players and the ball follow the path in the animation, and it repeats.</span></li>`);
  ['cone','goal','zone','circle','line','link','light','flash','wedge'].forEach(k=>{if(types[k])r.push(`<li class="kx"><i class="kd ko">${KEYOBJ[k][0]}</i><span>${KEYOBJ[k][1]}</span></li>`);});
  tools.forEach(t=>{if(KEYTOOL[t])r.push(`<li class="kx kt"><i class="kd ko tool">T</i><span><b>Tool: ${t}.</b> ${KEYTOOL[t]}</span></li>`);});
  rules.forEach(t=>{if(KEYRULE[t])r.push(`<li class="kx kt"><i class="kd ko rule">R</i><span><b>Rule: ${t}.</b> ${KEYRULE[t]}</span></li>`);});
  return r.join('');
}
window.howTo=function(d){
  const org=String(d[5]||'').split(/(?<=[.!?])\s+/).filter(s=>s&&!/^Rule in play/.test(s));
  const li=[];
  li.push(`<li><b>Set up.</b> Area: ${d[3]}. Players: ${d[2]}. You need: ${d[4]}.</li>`);
  org.forEach((s,i)=>li.push(`<li><b>${i===0?'Start.':'Then.'}</b> ${s}</li>`));
  li.push(`<li><b>Coach says.</b> ${d[6]}</li>`);
  li.push(`<li><b>Make it harder.</b> ${d[7]}</li>`);
  li.push(`<li><b>If it goes wrong.</b> ${d[8]}</li>`);
  return `<section class="how"><h4>How to run it</h4><ol>${li.join('')}</ol></section>`;
};

function keyHTML(sc,name){
  const num={},let_={};let hasK=false;
  sc.items.forEach(o=>{if(o.t!=='p')return;const t=o.team||'a';if(t==='k')hasK=true;const n=o.n==null?'':String(o.n);
    if(n===''||!isNaN(n))num[t]=1;else let_[t+n]=[t,n];});
  const rows=[];
  ['a','b','k','c'].forEach(t=>{if(num[t]){const c=KEYCOL[t];rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">1</i><span><b>${c[0]}</b>: ${KEYNUM[t]}</span></li>`);}});
  Object.values(let_).sort((x,y)=>'abkc'.indexOf(x[0])-'abkc'.indexOf(y[0])).forEach(([t,n])=>{
    if(t==='k'&&n==='K'&&!num.k&&Object.keys(let_).filter(z=>z[0]==='k').length===1){/* fallthrough */}
    let m=(KEYSC[name]&&KEYSC[name][n])||(KEYTC[t]&&KEYTC[t][n])||KEYLET[n];
    if(n==='T'&&!(KEYSC[name]&&KEYSC[name].T))m=hasK?'Thrower (sends the ball to the keeper)':'Tagger (chaser)';
    if(n==='L'&&t==='c')m='Ladder runner';
    if(n==='M'&&t==='a')m='Middle player';
    if(n==='F'&&t==='a')m='Front player';
    if(n==='B'&&t==='a')m='Back player';
    if(!m)return;const c=KEYCOL[t];
    rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">${n}</i><span><b>${c[0]} ${n}</b>: ${m}</span></li>`);});
  rows.push(keyExtra(sc));
  return `<details class="sc-key" open><summary>Key: colors, letters, tools and markings</summary><ul>${rows.join('')}</ul></details>`;
}

window.renderScene=function(name,id,capOverride){
  const sc=S[name]; if(!sc) return '';
  const cap=capOverride||sc.cap;
  let body=pitch();
  sc.items.forEach(o=>{ body+= o.t==='raw'?o.svg:item(o); });
  return `<figure class="scene" id="${id}"><div class="scene-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cap}">${body}</svg><button class="pp" type="button" aria-label="Pause animation" data-for="${id}"><span class="i-pause"></span></button></div><figcaption>${cap}</figcaption>${keyHTML(sc,name)}</figure>`;
};
})();

<script>

 const t=iso(new Date()),nx=SCH.find(e=>e.iso>=t),nxt=nx?`<div class="next"><span class="eyebrow">Next practice</span><b>${nx.dstr}</b><span>${evTitle(nx)}${nx.kind==='p'?', Level '+evLevel(nx):''}</span><a class="btn pri" href="${nx.kind==='p'?'#/session/'+nx.s:'#/festival/'+nx.k+'/'+nx.day}">Open</a></div>`:'';
 return nxt+`<div class="hero"><div><div class="eyebrow">RCH Elite Training · 3rd Grade · Ages 8 to 9</div><h1>Growing the Game</h1><p>Twelve chapters taught in rotation, starting at chapter 1. Every Tuesday and Thursday practice moves one chapter forward by a small step. After all twelve, the cycle returns to chapter 1 at a higher level. Each chapter builds on what the group learned in 2nd grade. New tools (reaction balls, mini cages, bounce-back nets, mannequin walls, offside flags) and the real rules, including offside, are added step by step, and the formats grow to 7 v 7.</p><div class="stats"><div><b>12</b>chapters</div><div><b>6</b>levels</div><div><b>72</b>practices</div><div><b>75</b>min each</div></div></div><div id="hero-scene">${window.renderScene('funino',nid())}</div></div>
 <div class="cols3"><div class="card"><h4>Always start by running</h4><p>Every practice opens with running around the field and ends with a duel finale that grows by level: 4 v 4 with keepers, 5 v 5 with roles, 5 v 5 with offside in the last 14 yards, 6 v 6 with zones, 7 v 7 with shape and set plays and finally 7 v 7 with the full offside rule (every finale opens with a 1 v 1 round).</p></div><div class="card"><h4>Mixed, not blocked</h4><p>No month of only dribbling. Each practice teaches one chapter, and the next practice teaches the next chapter.</p></div><div class="card"><h4>Six passes through the book</h4><p>Level 1 introduces each chapter. Levels 2 to 6 repeat it with more speed, less space, pressure and game play. Every chapter also links to how a 7 or 8 year old is developing.</p></div></div>
 <div class="rhythm"><h4>The cycle</h4><div class="cyc" aria-label="Chapter rotation">${CH.map(c=>`<a href="#/ch/${c.n}" title="${c.title}"><b>${c.n}</b><span>${c.short}</span></a>`).join('')}<i class="loop">back to 1, one level higher</i></div></div>
 <div class="rhythm"><h4>What grew since 2nd grade</h4>${tbl(['Chapter','In 2nd grade','Now, in 3rd grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))}</div>`;
}

/* ---------- calendar ---------- */
let CAL=null;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function initCal(){
 const t=new Date();const f=SCH[0]?SCH[0].date:t,l=SCH.length?SCH[SCH.length-1].date:t;
 const ref=(t>=f&&t<=l)?t:f;
 CAL={y:ref.getFullYear(),m:ref.getMonth(),view:'month',sel:null,panel:null};
}
function chip(e,idx){const o=e.kind==='p'?`Ch ${chOf(e).n} ${chOf(e).short}`:evTitle(e);return `<button type="button" class="ev${CAL.sel===idx?' on':''}" data-act="ev" data-k="${idx}" style="--c:${evColor(e)}" title="${o}"><b>${o}</b>${e.kind==='p'?`<small>Level ${evLevel(e)}</small>`:''}</button>`;}
function monthGrid(){
 const {y,m}=CAL,first=new Date(y,m,1),off=first.getDay(),days=new Date(y,m+1,0).getDate(),rows=Math.ceil((off+days)/7);
 const skip=new Set(getSkip()),today=iso(new Date());
 let h='<div class="mg"><div class="mh">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<span>${d}</span>`).join('')+'</div>';
 for(let r=0;r<rows;r++){h+='<div class="mr">';for(let c=0;c<7;c++){
  const d=new Date(y,m,r*7+c-off+1),k=iso(d),oth=d.getMonth()!==m;
  const evs=SCH.map((e,i)=>e.iso===k?chip(e,i):'').join('');
  const ei=SCH.findIndex(e=>e.iso===k);h+=`<div class="mc${oth?' oth':''}${k===today?' today':''}${skip.has(k)?' skipped':''}${ei>=0?' has':''}"${ei>=0?` data-act="ev" data-k="${ei}"`:''}><span class="dnum">${d.getDate()===1?MONTHS[d.getMonth()].slice(0,3)+' ':''}${d.getDate()}</span>${evs}${skip.has(k)?`<button type="button" class="nop" data-act="unskip" data-iso="${k}">No practice (restore)</button>`:''}</div>`;}
  h+='</div>';}
 return h+'</div>';
}
function agenda(){
 let h='<div class="ag">',last='';const today=iso(new Date());
 SCH.forEach((e,i)=>{const mk=e.date.getFullYear()+'-'+e.date.getMonth();if(mk!==last){last=mk;h+=`<h4 class="agm">${MONTHS[e.date.getMonth()]} ${e.date.getFullYear()}</h4>`;}
  h+=`<button type="button" class="agr${e.iso<today?' past':''}${CAL.sel===i?' on':''}" data-act="ev" data-k="${i}" style="--c:${evColor(e)}"><span class="agd">${e.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span class="agc"><i></i><b>${evTitle(e)}</b>${e.kind==='p'?`<small>Level ${evLevel(e)} ${LV[evLevel(e)-1][0]} · ${LT[chOf(e).n][evLevel(e)-1]}</small>`:''}</span></button>`;});
 return h+'</div>';
}
function calMain(){
 const title=CAL.view==='month'?`${MONTHS[CAL.m]} ${CAL.y}`:'All practices';

 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, skips, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','The ladder, hurdles and timing gates belong to chapter 2; the run start stays simple','Shorten the laps in hot weather and keep water within reach'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. It follows the play, practice, play pattern and the FA’s plan, do, review loop.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, weather check, captain jobs, team chant, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Two-minute demonstration with one cue'],['20 to 32','Play: skill play 1','Chapter drill at the current level; explore and repeat'],['32 to 44','Practice: skill play 2','A second chapter drill with a progression'],['44 to 59','Play: game','Small-sided game that applies the idea; level rule from the plan'],['59 to 69','Duel finale','Always. Opens with 1 v 1, then grows from 4 v 4 with keepers to 5 v 5, 6 v 6 and 7 v 7 with the offside rule'],['69 to 75','Closing circle','A motivation and morale tip, a high five for every child by name, the team chant and the next practice']])+ul(['Aim for at least 70 percent ball-rolling time (the FA’s guide for coaches)','Change activity if children lose focus','Water at minute 15, at the middle of the game and at the end','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates','If energy is low, shorten skill play 2 and keep the duel finale'])],
 bridge:['From Kindergarten to 1st Grade','1st grade is built on the Kindergarten chapters. Kindergarten’s eleven chapters become ten (chapters 1 and 9 merge) and two new chapters are added, making twelve.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['Kindergarten','1st grade','What happened'],[['1 Team Environment and Routines, 9 Fair Play and the Referee','1 Team Culture, Leadership and Fair Play','Merged. The team agreement is written by the players; leader of the day replaces captain jobs; disputes use stop, say, solve'],['2 Movement and Agility','2 Athletic Movement','Grew: sprint starts, quick feet, reaction, landing, body-weight strength'],['3 Ball Mastery, 4 Dribbling','3 Ball Mastery, 4 Dribbling and Moves','Grew: sequences, tempo, speed dribbling, shielding while moving'],['5 Receiving, 6 Passing, 7 Shooting, 8 1 v 1','5 to 8 (same topics)','Grew: control at pace, 10-yard passing, instep and first-time finishing, block tackle and recovery'],['10 Team Play, 11 Goalkeeper','11 Team Play, 12 Goalkeeper','Grew: jobs that rotate, transition, restart plays, ladder match days, dive and distribute'],['(no chapter)','9 Combinations: 2 v 1, 2 v 2, 3 v 2','NEW: draw a defender and pass, overlap, width'],['(a peek and a few cues)','10 Game Intelligence: Seeing and Deciding','NEW: scan routine, if-then cues, decision games, questions that teach']])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Kindergarten','Now in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: leader of the day, restarts, stop-say-solve, a player-led game','Own-best goals replace comparison with other children','Seeing before doing: scan routine and questions that teach','Small combinations (2 v 1, 3 v 2) build team play from skills the children already have','Roles rotate and transitions become a habit','Every chapter links to how a 6 or 7 year old is developing (see the Development page)'])+`<h4 class="sp">Day-one checks for children arriving from Kindergarten</h4>`+ul(['Names the field thirds and follows the three signals','Balances on one foot for about 8 seconds','Links two or three ball moves on either foot','Passes with the inside of the foot at 8 yards','Attempts a move in a 1 v 1 and defends side-on','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Kindergarten','Use the first cycle (12 practices) as the baseline for everyone'])],
 develop:['How 6 and 7 Year Olds Develop','What is changing in the child, and what each change makes possible in soccer. This page links every chapter to child development.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, want to be liked, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others than only themselves. Physical skills grow quickly, and catching and ball skills become easier.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[['Friendship and belonging','Wants to be liked; picks friends; notices who is in or out','Team agreement, buddies, leader of the day, rotating partners','1, 9, 11'],['Comparing with others','Notices who is faster or better (Erikson’s industry versus inferiority; background knowledge)','Own-best cards; no rankings; praise effort','1, 8'],['Care for others','Moves from only me to also you','Passing into space, combinations, encouragers','6, 9, 11'],['Independence','Wants to do jobs alone','Leader of the day, player-led games, own warm-up','1, 2, 11'],['Working memory and attention','Can hold 2 or 3 things in mind; attention still short','Sequences of three or four moves; three cues at a time; short games','3, 10'],['Language','Can explain what happened','Questions that teach; stop, say, solve','1, 10'],['Speed and agility window','Quick gains in running, balance and coordination (LTAD: speed and suppleness windows)','Sprint starts, quick feet, landing, cuts','2, 4, 8'],['Hand and ball control','Catching and ball skills improve','W-catch, thigh control, first touch at pace','5, 12'],['Visual tracking','Following a moving ball and several players is still maturing','Peek before the ball arrives; short looks; calm drills first','5, 10'],['Resilience','Mistakes still sting; fear of failing in front of friends','Stop-say-solve, mistake of the day, praise for brave tries','1, 7, 8']])+`<h4 class="sp">Skill readiness map</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[['Sprinting and quick feet','10 to 15 yard sprints; low markers','Reaction starts from a ready position','Long runs; heavy loading'],['Ball control','Four-move sequences; control at 8 yards','Receive and turn; thigh control','Chest control; heading'],['Passing','Inside pass at 10 yards; lead a runner','Driven pass; outside foot','Long passes over 20 yards'],['Shooting','Instep with a locked ankle; first-time finish','Placement to a corner','Power shots from distance'],['Tactics','Draw and pass; free player; front, middle, back jobs','Overlap; scan routine','Fixed positions; formations'],['Goalkeeping','Ready position; W-catch; roll and throw','Dive from a crouch','Specialist keepers; punting']])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment, to be checked against your own group.</p>`],
 theory:['Game Ideas for Ages 6 to 7','Tactics are taught as simple ideas inside games, in the language children use. 1st grade adds combinations and a seeing-and-deciding routine.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, draw a defender and pass, overlap, find the free player, dribble into space or shoot. Chapters 4, 6, 7, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay goal-side, delay. Chapters 8 and 11.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and defend at once. Chapters 8 and 11.</p></div></div><p>These three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Numbers up</h4><p>In a 2 v 1 or 3 v 2, the attackers have one more player. The idea is simple: the defender cannot stop everything. Draw the defender, then pass to the free player.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A defender comes at you and a teammate is free','Draw and pass','9'],['A teammate is running past you outside','Overlap: pass in front','9'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use a move, then burst','8'],['They have the ball','Close the nearest player or cover','11'],['You win the ball','Go at once','8, 11']])+`<h4 class="sp">Jobs, not positions</h4><p>There are no fixed positions. Front, middle and back are jobs that rotate (scorer, helper, guard). Goalkeeper is a role that rotates. Formations are not taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball?','Which rule did you use: dribble, pass or shoot?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in 1st grade practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','1st grade setting','Source and note'],[['Players per team','3 v 3 or 4 v 4','DFB uses 3 v 3 (and 5 v 5) for F-Jugend (U8/U9); KNVB uses 4 v 4 for the youngest; U.S. Soccer’s 4 v 4 covers U7 and U8'],['Field size','About 25 x 20 yards (3 v 3) or 30 x 20 yards (4 v 4), up to 35 x 25','DFB 3 v 3: about 25 by 20 meters. UEFA newsletter 4 v 4: about 30 x 20 meters. U.S. Soccer: 25 to 35 yards by 15 to 25 yards for 4 v 4'],['Goals','Four small goals (3 v 3) or two goals with no keepers (4 v 4)','DFB: four mini goals no larger than 2.0 by 1.2 meters, scoring from inside a 6 meter shooting zone. U.S. Soccer: goals up to 4 by 6 feet'],['Ball','Size 3','Both sources'],['Goalkeepers','None in 3 v 3 and 4 v 4; every child tries the role in practice','DFB 3 v 3 has none; UEFA’s newsletter and U.S. Soccer 4 v 4 have none; in DFB 5 v 5 a goalkeeper is optional and changes each round'],['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 minutes (3 v 3) or 12 minutes (5 v 5); U.S. Soccer 4 v 4: four quarters of 10 minutes'],['Rotation','Rotate teams and jobs often','DFB: rotation after each goal in 3 v 3; fixed order every 3 minutes in 5 v 5'],['Referees','Coach as game leader; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],['Restarts','Kick-in or throw-in, restart from own end, free kick for hands, push or trip','DFB: opponent restarts an out-ball with a dribble or pass from the side. Follow your league and stay consistent'],['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down, with short breaks'],['Heading','Not used','U.S. Soccer age-group guidance']])+ul(['Laws taught: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake','If your league plays 7 v 7 with a goalkeeper at U9, introduce it gradually in 2nd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 6 and 7, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 6 and 7','How we train it','Chapters'],[['Speed','A key trainable window; short bursts only','10 to 15 yard sprints from varied starts with full rest','2, 4, 8'],['Agility','Plant-and-push and quick changes are improving','Cut gates, reaction tag, 1 v 1','2, 8'],['Coordination','Quick feet and rhythm are developing','Low markers, sequences, juggling','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, landing stations','2, 12'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start and the warm-up','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: animal walks, hops, squats','Animal power circuit','2'],['Reaction','Improving','Signal games, ready position','2, 12']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage of about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>Structured warm-up programs have been studied in youth soccer, but the strongest research is in older age groups. We use a short, player-led dynamic warm-up as sensible practice, and we keep landing, balance and body-weight strength in every cycle.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Seven ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Younger players valued a coach who lets them play different positions more than older players did. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 6 and 7, children start to notice who is faster or better. Erikson called this stage industry versus inferiority (background knowledge): children who feel capable gain confidence, and those who feel behind may lose it. Protect every child: use own-best cards, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two- or three-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Switch! and changing the rule every few minutes practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence is mixed, so treat this as a design guide rather than a promise.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)','Ask questions more than giving answers'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my own-best goal for next time?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay short (10 to 15 yards) with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week 26'],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],
 assess:['Assessment','Record Yes, Almost or Not yet at each festival (weeks 13, 26 and 39), plus a baseline in week 1. Assess inside normal games and do not rank children.',()=>tbl(['Chapter','Check','Wk 1','Wk 13','Wk 26','Wk 39'],CH.map(c=>[c.n+'. '+c.short,c.check,'','','','']),'grid-t asm')],
 next:['Looking Ahead to 2nd Grade','The next curriculum extends this base.',()=>`<p>2nd grade deepens the same chapters: longer passing patterns, more combinations, more team shape, more decisions and game rules, and the first moves toward larger formats such as 7 v 7. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in small-sided formats','Players take on more of the planning and the review','A first goalkeeper-specific block can be added for children who want it'])],

const firstUse=(field)=>{const m={};CH.forEach(c=>c.drills.forEach((d,i)=>{const v=d[field];if(!v)return;v.split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>{const lv=d[9],s=(lv-1)*N+c.n;if(!m[t]||s<m[t].s)m[t]={s,ch:c.n,lv,name:d[0],cnt:0};});}));CH.forEach(c=>c.drills.forEach(d=>{const v=d[field];if(!v)return;v.split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>{if(m[t])m[t].cnt++;});}));return m;};

 'Agility ladder':['A flat ladder for quick, light feet','Lay it flat and straight; check for loose rungs.','Home option: chalk squares'],
 'Speed hurdles':['Low, light hurdles (about 15 to 30 cm)','Choose break-away hurdles; keep them low.','Home option: two cones with a pool noodle'],

 bridge:['From 2nd Grade to 3rd Grade','3rd grade is built on the twelve 2nd-grade chapters. Every chapter grows in place with more speed, pressure and real game structure; formats grow from 4 v 4 to 7 v 7 and the offside rule becomes real.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['2nd grade','3rd grade','What happened'],[

  ['8 Small-Group Play','8 Combination Play','Grew: third-man runs, overlaps, 4 v 2, triangles and diamonds with discs'],
  ['9 Scanning, Space and Decisions','9 Scanning, Decisions and Playing Forward','Grew: scan twice, name two options, safe or forward, if-then cues, reasons'],
  ['10 Team Shape in 5 v 5','10 Team Shape, Roles and Transitions in 6 v 6 and 7 v 7','Grew: bigger formats, zones, three-second transition, build from the keeper'],

 ])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In 2nd grade','Now in 3rd grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['More intensity: more laps, short sprints with full rest and fewer pauses','More variety: new tools in every chapter (see the Tools page)','More real rules: the offside rule arrives in three steps, plus free kicks with a wall, penalties and cards (see the Rules page)','Bigger formats: 4 v 4 to 7 v 7 with keepers, in line with European associations','Players run more: captains, helper referees, restart plans and set plays','Decisions get reasons: say what you saw and why'])+`<h4 class="sp">Day-one checks for children arriving from 2nd grade</h4>`+ul(['Sprints 15 to 20 yards with good form','Links a feint after a pole run','Passes 12 yards with the inside of the foot','Scans before receiving in about half the passes','Plays a 5 v 5 with a simple role','If most children pass these checks, use the Challenge progression line in each exercise during the first cycle'])],
 develop:['How 8 and 9 Year Olds Develop','What is changing in the child and what each change makes possible in soccer. Every chapter links to this page.',()=>`<p>The KNVB’s Jolles report describes children under about ten as playful and not yet well focused on the field, with focus changing a lot over about three years. Planning is short term, and self-evaluation and empathy are at an early stage; strong verbal skills can make children seem more mature than they are. Motor development follows phases, children of one age differ widely in coordination, and playful practice speeds learning. The FFF U10 and U11 material asks for 75 percent playing time for all, and for play as the main vehicle: children develop technically, tactically, physically and mentally through play.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[
  ['Friendship and fairness','Strong sense of fairness; arguments about rules','Helper referees, rule games, fair-play points','1, 12'],
  ['Comparing with others','Notices who is faster or better; early self-evaluation','Own-best targets, timing gates against your own time, no rankings','1, 2'],
  ['Short-term planning','Plans in minutes, not weeks','Three-sentence team talk, if-then cues, plan-do-review','1, 9'],
  ['Attention and focus','Playful; focus varies a lot','Short activities, quick looks, variety','all'],
  ['Empathy still early','May not see what a partner needs','Call and show; kind word and a tip','1, 5, 8'],
  ['Coordination','Quick improvement but wide differences','Ladder, dots, rings, hurdles, reaction ball','2, 3, 4'],
  ['Eye-foot and eye-hand control','Tracking improves; catching easier','Bounce-back net, reaction ball, keeper work','4, 11'],
  ['Understanding rules','Can follow a rule with a reason','Offside in three steps, restarts, penalty and free kicks','12'],
  ['Team understanding','Can hold a role for a few minutes','Back, middle, front, keeper; shape and transition','10'],
  ['Resilience','Mistakes still sting; peer judgement matters','Mistake of the day, brave tries, kind words','1, 3, 9']
 ])+`<h4 class="sp">Skill readiness map for 3rd grade</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[
  ['Sprinting and agility','20 to 25 yard sprints; ladder, dots, rings','Reaction ball; 2-signal reactions','Long runs; heavy loading'],

  ['Passing','15 yard laces pass; switch with room','Passing under pressure; leading a runner','Long passes over 30 yards'],
  ['Shooting','Placement; cutbacks; rebounds','First-time finishing at pace','Power shots from distance'],
  ['Defending','Jockey; press and cover; block tackle','Recover goal-side at speed','Sliding tackles'],

 ])+`<p class="note">This readiness map is our own judgment, based on the sources on the Sources page. Check it against your own group.</p>`],
 theory:['Game Ideas for Ages 8 to 9','Tactics are taught as simple ideas inside games, in child language. 3rd grade adds pressing and cover, pattern play, scanning with reasons, 6 v 6 and 7 v 7 shapes and offside.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Switch the play, third-man runs, overlaps, width and depth, cutbacks, build from the keeper. Chapters 3, 5, 6, 8, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Press, cover, jockey, goal-side, wall for free kicks. Chapters 7 and 12.</p></div><div class="card"><h4>Switch</h4><p>Win it and go in three seconds; lose it and press or fall back. Chapters 7 and 10.</p></div></div><p>These headings follow the phases used in the FA’s England DNA. At this age they are taught in child language, not as formal tactics. The FIFA numeric-progression page also asks for simple tactical ideas added gradually with minimal instruction and many chances to solve problems.</p><h4 class="sp">Pressing and cover</h4><p>The nearest player presses; the second player covers behind and speaks. A third player balances. Children rotate through the three jobs.</p><h4 class="sp">Shape in 6 v 6 and 7 v 7</h4><p>Back, middle and front are jobs. Zones and discs show the shape. Players rotate roles after a goal. No formations are taught.</p><h4 class="sp">Offside in three steps</h4><p>Step one: stay level with or behind the ball. Step two: offside only in the last 14 yards in front of the goal (the FFF uses the last 13 m at U10 and U11). Step three: the full IFAB Law 11 in 7 v 7. An offside position is not an offence by itself; the player must take part in play.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate facing you','Pass','5'],['The near side is crowded','Switch to the far side','5, 10'],['Empty grass ahead','Dribble and change pace','3'],['A defender in front and a mannequin-like gap','Feint then burst','3'],['A teammate runs outside','Overlap','8'],['Two players pass and a third is free','Third-man run','8'],['They have the ball and you are nearest','Press','7'],['They have the ball and a teammate presses','Cover behind and call','7'],['You win the ball','Go within three seconds','10'],['The ball is out','Name the restart and the plan','12']])+`<h4 class="sp">Questions that teach</h4>`+ul(['What did you see before you got the ball? What did you see after?','Which option did you choose, and why?','Where was the free player or space?','What would you try next time?'])],
 formats:['Rules and Game Formats','The formats used in 3rd grade practices and festivals and what the European associations publish for this age. Check your league’s rules before match days.',()=>tbl(['Topic','3rd grade setting','Source and note'],[
  ['Players per team','4 v 4 up to 7 v 7 across the six levels','The FA plays 7 v 7 at U9 and U10; the KNVB plays 6 v 6 at O8 to O10; the DFB plays 5 v 5 or 7 v 7 at E-Jugend (U10 and U11); the FFF plays 7 v 7 plus a goalkeeper at U10 and U11'],
  ['Field size','Our practice sizes: about 42 x 28 yards (6 v 6) and 50 x 32 yards (7 v 7); up to 55 x 35 yards in festivals','FA: 7 v 7 on 60 x 40 yards. KNVB 6 v 6: 42.5 x 30 m. DFB 7 v 7: 55 x 35 m. FFF: half an 11-a-side pitch'],
  ['Goals','Two pop-up goals with rotating goalkeepers; mini cages for placement work','FA: 12 x 6 foot goals at U9 and U10. KNVB: 5 x 2 m pupil goals. FFF U11: 6 x 2.10 m'],
  ['Ball','Size 3 or 4 for practice; check your league','KNVB advises size 4 (290 g) in 6 v 6; FFF U11 uses size 4. No FA ball size was found in the document we read'],
  ['Goalkeepers','Rotate; play regularly in the 6 v 6 and 7 v 7; hands only in the own area; back-pass rule','DFB: goalkeepers play regularly from E-Jugend and specialised training should begin gradually. KNVB: keeper may handle only in the keeper area and not a ball played back with the foot. FFF: keepers distribute from the ground and no volleys'],
  ['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB E-Jugend tournaments: 2 x 12 minutes. FFF U11: 50 minutes total, aiming for 75 percent playing time for all. KNVB 6 v 6: 2 x 20 or 25 minutes'],

  ['Restarts','Throw-in by hand, goal kick from the ground, corner from the arc, free kick with a wall, penalty from the mark','FFF: opponents at 6 m, penalty from 9 m; KNVB 6 v 6: 5 m at restarts and penalty from 7 m; DFB: in 7 v 7 play restarts with a throw-in'],
  ['Offside','Step by step: stay level, then the last 14 yards, then the full rule','FFF applies offside only from the last 13 m at U10 and U11; the KNVB booklet does not mention offside for 6 v 6 and says it does not apply in 8 v 8 (check your league); IFAB Law 11 is the rule for the full game'],
  ['Heading','Not used','U.S. Soccer age-group guidance; the DFB reform also removed most heading'],
  ['Results','No table; ladder format for festivals','DFB: winners move up a pitch, losers down']
 ])+ul(['Use a whistle to start and stop, not to stop every mistake','The IFAB 2025/26 change on the keeper’s eight seconds is taught as “release quickly”','If your league plays 8 v 8 or 9 v 9 at the next age, a gradual step is planned for 4th grade'])],
 tools:['Training Tools','The tools used in 3rd grade, where each first appears in the plan, and how to use it safely. Nine tools are new this year. Each is drawn in the exercise animation.',()=>{const f=firstUse(11);return `<p>Tools add variety, make the idea visible and give children something to explore. None is required: each has a home substitute. “Since” shows whether the tool is new this year or came from 2nd grade. “First seen” is the first practice in the plan where the tool is in an exercise.</p>`+tbl(['Tool','Since','What it is','First seen','Used in','Safe use','Home option'],Object.keys(TOOLINFO).map(t=>{const i=TOOLINFO[t],u=f[t],nw=NEWTOOLS.includes(t);return [`<b>${t}</b>`,nw?'<b>New in 3rd grade</b>':'2nd grade',i[0],u?`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`:'—',u?u.cnt+(u.cnt==1?' exercise':' exercises'):'—',i[1],i[2]];}))+`<p class="note">The tool is shown inside the animation of each exercise that uses it, and the exercise card has a New tool line.</p>`;}],
 rules:['Rules of the Game','The real rules of soccer taught inside games, with the matching IFAB Law and the first practice in which each appears. The big step this year is offside.',()=>{const f=firstUse(12);return `<p>Rules are taught inside games, not by lecture. In 2nd grade children met the restarts and the offside idea. In 3rd grade offside becomes real in three steps, and free kicks, walls, penalties, cards and the keeper’s rules are added. The main source is the IFAB Laws of the Game; the shorter distances come from the FFF and KNVB booklets for children.</p>`+tbl(['Rule','IFAB Law','What children learn','Coach note','First seen','Used in'],Object.keys(RULEINFO).map(t=>{const i=RULEINFO[t],u=f[t];return [`<b>${t}</b>`,i[0],i[1],i[2],u?`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`:'—',u?u.cnt+(u.cnt==1?' exercise':' exercises'):'—'];}))+`<h4 class="sp">What changes by level</h4>`+tbl(['Level','Rule focus'],[['1 Introduce','Kick-off, referee signals, offside step one (stay level), throw-in'],['2 Practice','Goal kick, corner kick, advantage'],['3 Develop','Offside step two (last 14 yards), free kick with a wall'],['4 Challenge','Penalty, fouls and cards, back-pass rule'],['5 Combine','Several restarts in one game; offside full rule in 7 v 7'],['6 Perform','7 v 7 with the full offside rule, run by the players']])+`<p class="note">Offside is applied step by step. Check your league for the age at which the full rule applies.</p>`;}],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 8 and 9 and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 8 and 9','How we train it','Chapters'],[['Speed','Short bursts with full rest; own-best times','20 to 25 yard sprints, cone-sprint grid, timing gates','2, 3, 7'],['Agility','Quick changes of direction improve','Cuts, ladder, dots, rings, reaction ball','2, 3, 4'],['Coordination','A strong period for learning technique','Feints, sequences, juggling','3, 4'],['Balance','Longer holds; stable landings','Hurdle landings, keeper dives','2, 11'],['Flexibility','Dynamic and playful','Dynamic moves at the run start','all'],['Endurance','Built through play','Laps, games, short rests','all'],['Power','Body weight only','Hops, bounds, low jumps','2'],['Reaction','Improving','Reaction ball, light and sound signals','2, 4, 11']])+`<h4 class="sp">What the sources say</h4>`+ul(['The FFF livret recommends short, varied blocks and avoiding mechanical overload because bones are still growing; the U11 booklet builds psychomotor work (balance, coordination, reaction, rhythm, footwork) into workshops','The KNVB’s Jolles report says motor development follows phases, children of one age differ widely, and playful practice speeds skill learning','A small study of U12 players (GeoSport for Society, 2022) reports improvement in speed, agility and coordination after a structured training cycle; the abstract has no sample size or control group, so it is only a pointer','Long-term athlete development models (World Rugby, used for the general model) favour a broad movement base'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>FIFA 11+ Kids was tested in children’s football and is a longer structured option. Our run start and dynamic moves are a short routine that you can combine with parts of it.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent, and Jolles advises against selecting children before about age 12. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence','Record progress against the child’s own results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Ideas that guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which tool, which pattern, which role.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci; background knowledge). The Jolles report adds that extrinsic rewards alone can cause fear of failure and that intrinsic motivation is built by challenge, play and fun.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors.</p><h4 class="sp">Comparing with others</h4><p>At 8 and 9, children notice who is faster or better and peer opinion matters more. Self-evaluation is still early, so children may judge themselves harshly or not at all. Use own-best targets, praise effort, never rank, mix partners and let children lead. Jolles advises avoiding selection before about age 12.</p><h4 class="sp">Attention and self-control</h4><p>Focus varies a great deal between children of this age. Games that change a rule every few minutes, if-then cues and quick looks practise attention while children simply play. The evidence that sport improves executive function is mixed, so treat this as a design guide, not a promise.</p><h4 class="sp">If-then plans</h4><p>An if-then cue (“If I see a free teammate, then I pass”) gives a child a short plan to use in the moment. It is a coaching idea based on implementation-intention research (background knowledge; not rechecked) and is used in chapter 9.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look','Give concrete, short feedback, not long-term goals (Jolles)'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new feint. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (FA social skills)','Keep instructions short, feedback positive and specific','Ask questions more than giving answers','Captains and helper referees practise calm voices'])],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints, equipment and children.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay at 20 to 25 yards with full rest; landing and diving are practised on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practise earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','New tools: use soft mannequins, break-away hurdles, flexible poles and flags, level and anchored nets, mini cages and pop-up goals; use reaction balls on soft grass away from other groups','Safe tackling: inside of the foot, after a delay, no sliding; cards are signs, not punishments','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and dynamic moves are a simple routine. FIFA 11+ Kids is a longer structured option. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 next:['Looking Ahead to 4th Grade','The next curriculum extends this base.',()=>`<p>4th grade deepens the same chapters and prepares the step to 8 v 8 and 9 v 9: longer build-up, more positional play with rotating roles, specialist goalkeeper blocks, set plays run by the players and the full offside rule in most games. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in 7 v 7 and then 8 v 8','Players take on more of the planning, refereeing and review','Training tools stay; new ones (agility poles, bigger cages, small hurdles with bands) can be added','The Rules page grows with the full set of Laws, including more cards and substitutions'])]
});

function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">Third Grade Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchg3-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchg3-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchg3-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);

function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchg3-theme',t);}catch(e){}}

route();
