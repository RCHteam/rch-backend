const GUIDE={
 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, skips, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','The ladder, hurdles and timing gates belong to chapter 2; the run start stays simple','Shorten the laps in hot weather and keep water within reach'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. It follows the play, practice, play pattern and the FA’s plan, do, review loop.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, weather check, captain jobs, team chant, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Two-minute demonstration with one cue'],['20 to 32','Play: skill play 1','Chapter drill at the current level; explore and repeat'],['32 to 44','Practice: skill play 2','A second chapter drill with a progression'],['44 to 59','Play: game','Small-sided game that applies the idea; level rule from the plan'],['59 to 69','Duel finale','Always. Opens with 1 v 1, then grows from 2 v 2 to 3 v 3, defenders, keepers and 5 v 5'],['69 to 75','Closing circle','A motivation and morale tip, a high five for every child by name, the team chant and the next practice']])+ul(['Aim for at least 70 percent ball-rolling time (the FA’s guide for coaches)','Change activity if children lose focus','Water at minute 15, at the middle of the game and at the end','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates','If energy is low, shorten skill play 2 and keep the duel finale'])],
 bridge:['From Kindergarten to 1st Grade','1st grade is built on the Kindergarten chapters. Kindergarten’s eleven chapters become ten (chapters 1 and 9 merge) and two new chapters are added, making twelve.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['Kindergarten','1st grade','What happened'],[['1 Team Environment and Routines, 9 Fair Play and the Referee','1 Team Culture, Leadership and Fair Play','Merged. The team agreement is written by the players; leader of the day replaces captain jobs; disputes use stop, say, solve'],['2 Movement and Agility','2 Athletic Movement','Grew: sprint starts, quick feet, reaction, landing, body-weight strength'],['3 Ball Mastery, 4 Dribbling','3 Ball Mastery, 4 Dribbling and Moves','Grew: sequences, tempo, speed dribbling, shielding while moving'],['5 Receiving, 6 Passing, 7 Shooting, 8 1 v 1','5 to 8 (same topics)','Grew: control at pace, 10-yard passing, instep and first-time finishing, block tackle and recovery'],['10 Team Play, 11 Goalkeeper','11 Team Play, 12 Goalkeeper','Grew: jobs that rotate, transition, restart plays, ladder match days, dive and distribute'],['(no chapter)','9 Combinations: 2 v 1, 2 v 2, 3 v 2','NEW: draw a defender and pass, overlap, width'],['(a peek and a few cues)','10 Game Intelligence: Seeing and Deciding','NEW: scan routine, if-then cues, decision games, questions that teach']])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Kindergarten','Now in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: leader of the day, restarts, stop-say-solve, a player-led game','Own-best goals replace comparison with other children','Seeing before doing: scan routine and questions that teach','Small combinations (2 v 1, 3 v 2) build team play from skills the children already have','Roles rotate and transitions become a habit','Every chapter links to how a 6 or 7 year old is developing (see the Development page)'])+`<h4 class="sp">Day-one checks for children arriving from Kindergarten</h4>`+ul(['Names the field thirds and follows the three signals','Balances on one foot for about 8 seconds','Links two or three ball moves on either foot','Passes with the inside of the foot at 8 yards','Attempts a move in a 1 v 1 and defends side-on','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Kindergarten','Use the first cycle (12 practices) as the baseline for everyone'])],
 develop:['How 6 and 7 Year Olds Develop','What is changing in the child, and what each change makes possible in soccer. This page links every chapter to child development.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, want to be liked, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others than only themselves. Physical skills grow quickly, and catching and ball skills become easier.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[['Friendship and belonging','Wants to be liked; picks friends; notices who is in or out','Team agreement, buddies, leader of the day, rotating partners','1, 9, 11'],['Comparing with others','Notices who is faster or better (Erikson’s industry versus inferiority; background knowledge)','Own-best cards; no rankings; praise effort','1, 8'],['Care for others','Moves from only me to also you','Passing into space, combinations, encouragers','6, 9, 11'],['Independence','Wants to do jobs alone','Leader of the day, player-led games, own warm-up','1, 2, 11'],['Working memory and attention','Can hold 2 or 3 things in mind; attention still short','Sequences of three or four moves; three cues at a time; short games','3, 10'],['Language','Can explain what happened','Questions that teach; stop, say, solve','1, 10'],['Speed and agility window','Quick gains in running, balance and coordination (LTAD: speed and suppleness windows)','Sprint starts, quick feet, landing, cuts','2, 4, 8'],['Hand and ball control','Catching and ball skills improve','W-catch, thigh control, first touch at pace','5, 12'],['Visual tracking','Following a moving ball and several players is still maturing','Peek before the ball arrives; short looks; calm drills first','5, 10'],['Resilience','Mistakes still sting; fear of failing in front of friends','Stop-say-solve, mistake of the day, praise for brave tries','1, 7, 8']])+`<h4 class="sp">Skill readiness map</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[['Sprinting and quick feet','10 to 15 yard sprints; low markers','Reaction starts from a ready position','Long runs; heavy loading'],['Ball control','Four-move sequences; control at 8 yards','Receive and turn; thigh control','Chest control; heading'],['Passing','Inside pass at 10 yards; lead a runner','Driven pass; outside foot','Long passes over 20 yards'],['Shooting','Instep with a locked ankle; first-time finish','Placement to a corner','Power shots from distance'],['Tactics','Draw and pass; free player; front, middle, back jobs','Overlap; scan routine','Fixed positions; formations'],['Goalkeeping','Ready position; W-catch; roll and throw','Dive from a crouch','Specialist keepers; punting']])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment, to be checked against your own group.</p>`],
 theory:['Game Ideas for Ages 6 to 7','Tactics are taught as simple ideas inside games, in the language children use. 1st grade adds combinations and a seeing-and-deciding routine.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, draw a defender and pass, overlap, find the free player, dribble into space or shoot. Chapters 4, 6, 7, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay goal-side, delay. Chapters 8 and 11.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and defend at once. Chapters 8 and 11.</p></div></div><p>These three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Numbers up</h4><p>In a 2 v 1 or 3 v 2, the attackers have one more player. The idea is simple: the defender cannot stop everything. Draw the defender, then pass to the free player.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A defender comes at you and a teammate is free','Draw and pass','9'],['A teammate is running past you outside','Overlap: pass in front','9'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use a move, then burst','8'],['They have the ball','Close the nearest player or cover','11'],['You win the ball','Go at once','8, 11']])+`<h4 class="sp">Jobs, not positions</h4><p>There are no fixed positions. Front, middle and back are jobs that rotate (scorer, helper, guard). Goalkeeper is a role that rotates. Formations are not taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball?','Which rule did you use: dribble, pass or shoot?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in 1st grade practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','1st grade setting','Source and note'],[['Players per team','3 v 3 or 4 v 4','DFB uses 3 v 3 (and 5 v 5) for F-Jugend (U8/U9); KNVB uses 4 v 4 for the youngest; U.S. Soccer’s 4 v 4 covers U7 and U8'],['Field size','About 25 x 20 yards (3 v 3) or 30 x 20 yards (4 v 4), up to 35 x 25','DFB 3 v 3: about 25 by 20 meters. UEFA newsletter 4 v 4: about 30 x 20 meters. U.S. Soccer: 25 to 35 yards by 15 to 25 yards for 4 v 4'],['Goals','Four small goals (3 v 3) or two goals with no keepers (4 v 4)','DFB: four mini goals no larger than 2.0 by 1.2 meters, scoring from inside a 6 meter shooting zone. U.S. Soccer: goals up to 4 by 6 feet'],['Ball','Size 3','Both sources'],['Goalkeepers','None in 3 v 3 and 4 v 4; every child tries the role in practice','DFB 3 v 3 has none; UEFA’s newsletter and U.S. Soccer 4 v 4 have none; in DFB 5 v 5 a goalkeeper is optional and changes each round'],['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 minutes (3 v 3) or 12 minutes (5 v 5); U.S. Soccer 4 v 4: four quarters of 10 minutes'],['Rotation','Rotate teams and jobs often','DFB: rotation after each goal in 3 v 3; fixed order every 3 minutes in 5 v 5'],['Referees','Coach as game leader; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],['Restarts','Kick-in or throw-in, restart from own end, free kick for hands, push or trip','DFB: opponent restarts an out-ball with a dribble or pass from the side. Follow your league and stay consistent'],['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down, with short breaks'],['Heading','Not used','U.S. Soccer age-group guidance']])+ul(['Laws taught: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake','If your league plays 7 v 7 with a goalkeeper at U9, introduce it gradually in 2nd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 6 and 7, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 6 and 7','How we train it','Chapters'],[['Speed','A key trainable window; short bursts only','10 to 15 yard sprints from varied starts with full rest','2, 4, 8'],['Agility','Plant-and-push and quick changes are improving','Cut gates, reaction tag, 1 v 1','2, 8'],['Coordination','Quick feet and rhythm are developing','Low markers, sequences, juggling','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, landing stations','2, 12'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start and the warm-up','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: animal walks, hops, squats','Animal power circuit','2'],['Reaction','Improving','Signal games, ready position','2, 12']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage of about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>Structured warm-up programs have been studied in youth soccer, but the strongest research is in older age groups. We use a short, player-led dynamic warm-up as sensible practice, and we keep landing, balance and body-weight strength in every cycle.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Seven ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Younger players valued a coach who lets them play different positions more than older players did. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 6 and 7, children start to notice who is faster or better. Erikson called this stage industry versus inferiority (background knowledge): children who feel capable gain confidence, and those who feel behind may lose it. Protect every child: use own-best cards, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two- or three-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Switch! and changing the rule every few minutes practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence is mixed, so treat this as a design guide rather than a promise.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)','Ask questions more than giving answers'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my own-best goal for next time?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay short (10 to 15 yards) with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week 26'],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],

  ['1 Team Culture, Leadership and Fair Play','1 Leadership, Roles and Fair Play','Grew: captains by fair rotation, role bibs in every game, referee signals, helper referee'],

  ['3 Ball Mastery, 4 Dribbling and Moves','3 Control, Dribbling and Change of Pace','Merged and grown: poles, cut, drag back, step-over, change of pace, shielding'],
  ['5 Receiving','4 Receiving, Turning and Orientation','Grew: rebound board, across-the-body control, turning away from pressure'],
  ['6 Passing','5 Passing Range, Patterns and Weight','Grew: 12 to 15 yards, passing arc, wall pass, third-player run'],
  ['7 Shooting','6 Finishing and Shooting Variety','Grew: pop-up goal, placement, first-time finish, follow-up'],
  ['8 1 v 1','7 Defending: 1 v 1, Jockey, Tackle and Recover','Grew: mannequin, jockey, block tackle, recovery goal-side'],
  ['9 Combinations','8 Small-Group Play: 2 v 1, 3 v 2 and 3 v 3','Grew: width and support angles with discs, third-player runs'],
  ['10 Game Intelligence','9 Scanning, Space and Decisions','Rebuilt: scan twice, name two options, if-then cues, say what you saw'],
  ['11 Team Play','10 Team Shape, Roles and Transitions in 5 v 5','Rebuilt: three roles, shape with discs, transition in 3 seconds, build from the keeper'],
  ['12 Goalkeeper','11 Goalkeeper: Positioning, Handling and Distribution','Grew: position on the line, dive both sides, roll and throw, hands in or out of the area'],
  ['(rules only inside games)','12 Rules of the Game and Restarts','NEW: throw-in, goal kick, corner, free kick, handball, offside idea']
 ])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In 1st grade','Now in 2nd grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['New training tools appear in the animations and in the exercise cards (see the Tools page)','Real rules are added gradually inside games (see the Rules page)','Formats grow from 2 v 2 up to 5 v 5 with goalkeepers over the six levels','Players run more of the practice: captain, helper referee, restarts, plan and review','Scanning becomes a two-step routine, before and after the first touch','Children give a one-sentence reason for a choice'])+`<h4 class="sp">Day-one checks for children arriving from 1st grade</h4>`+ul(['Sprints 10 yards tall and cuts on a signal','Links four ball moves on either foot','Passes with the inside of the foot at 10 yards','Peeks before receiving in about half the passes','Plays a 3 v 2 and finds the free player','If most children pass these checks, use the Challenge progression line in each exercise during the first cycle'])],
 develop:['How 7 and 8 Year Olds Develop','What is changing in the child and what each change makes possible in soccer. Every chapter links to this page.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others. The KNVB’s Jolles report adds that self-evaluation and empathy are still early before about age 10 and that planning is short term, so feedback should come in small steps and without early rankings. The FFF livret warns against mechanical overload because bones are still growing, and notes that children tire fast but recover fast.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[
  ['Friendship and belonging','Wants to be liked; has best friends; notices who is in or out','Rotating partners, buddies, shared team jobs','1, 8, 10'],
  ['Comparing with others','Notices who is faster or better','Own-best targets, timing gates against your own time, no rankings','1, 2, 7'],
  ['Empathy still early','May not see what a partner needs before about 10 (Jolles)','Partners must talk and show where they want the ball','5, 8, 10'],
  ['Short-term planning','Can plan the next step, not a long sequence','Two or three cues at a time; if-then cues','9, 10'],
  ['Language and reasons','Can explain what happened in a sentence','Say what you saw and why','1, 9, 12'],
  ['Speed and agility window','Quick gains in running, balance and coordination','Ladders, hurdles, short sprints, cuts','2, 3, 7'],
  ['Hand and ball control','Catching and ball skills become easier','W-catch, rebound control, first touch','4, 11'],
  ['Visual tracking','Following a ball and several players is still maturing','Short looks, calm drills before pressure, scan twice','4, 9'],
  ['Understanding rules','Can follow a rule with a reason; may argue about fairness','Rules taught inside games, helper referee, restart plans','1, 12'],
  ['Resilience','Mistakes still sting in front of friends','Stop-say-solve, mistake of the day, praise brave tries','1, 7, 9']
 ])+`<h4 class="sp">Skill readiness map for 2nd grade</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[
  ['Sprinting and agility','15 to 20 yard sprints; ladder patterns; low hurdles','Cuts at speed; reaction to two signals','Long runs; heavy loading'],
  ['Ball control','Poles on both feet; cut and drag back','Step-over at pace; turning away from pressure','Chest control; heading'],
  ['Passing','Inside pass at 12 yards; wall pass','Laces pass over 15 yards; outside foot; weight','Long balls over 25 yards'],
  ['Shooting','Instep with a short run-up; far-side placement','First-time finish; follow-up','Power shots from distance'],
  ['Defending','Jockey and delay; block tackle on a rolling ball','Recovery goal-side; cover','Sliding tackles'],
  ['Tactics','Free player; width; roles in 5 v 5','Third-player run; switch; build from the keeper','Fixed positions; formations'],
  ['Goalkeeping','Ready position; W-catch; roll and throw','Dive to both sides; position on the line','Specialist keepers; punting']
 ])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment; check it against your own group.</p>`],
 theory:['Game Ideas for Ages 7 to 8','Tactics are taught as simple ideas inside games, in the language children use. 2nd grade adds width and support, third-player runs, two-step scanning, simple roles and the first rule-based restarts.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, make a pass angle, pass and move, wall pass, overlap, third-player run, switch the side, dribble into space or shoot. Chapters 3, 4, 5, 6, 8 and 9.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, jockey, cover behind, stay goal-side, recover. Chapters 7 and 10.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and press or fall back within three seconds. Chapters 7 and 10.</p></div></div><p>These headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Width, depth and support</h4><p>A good support spot is a pass away and at an angle, not in front of the ball and not directly behind a defender. Discs mark the spots so children can see them.</p><h4 class="sp">Roles in 5 v 5</h4><p>Back, side and front are three jobs that rotate after every goal. The goalkeeper rotates too. A marked halfway line and an orange offside-idea line help children feel where the last defender is. The roles are not positions and no formation is taught.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate facing you','Pass','5'],['Empty grass ahead','Dribble and change pace','3'],['A clear view and a free shot','Shoot early','6'],['A defender comes at you and a teammate is free','Draw and pass','8'],['A teammate runs past you outside','Overlap: pass in front','8'],['The pass is blocked and a third player is free','Wall pass then third-player run','5, 8'],['A chaser close behind','Shield or turn away','3, 4'],['A defender in front','Cut or drag back, then burst','3'],['They have the ball','Close the nearest player, jockey, cover','7'],['You win the ball','Go at once, or pass to the keeper and build','10, 11'],['Out of play','Name the restart and who takes it','12']])+`<h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball? What did you see after?','Which rule did you use: dribble, pass or shoot, and why?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats used in 2nd grade practices and festivals, and what the European associations publish for this age. Check your league’s rules before match days.',()=>tbl(['Topic','2nd grade setting','Source and note'],[
  ['Players per team','2 v 2 up to 5 v 5 (the finale grows with the level); 3 v 3 and 4 v 4 stay in practice','The FA plays 5 v 5 at the youngest ages; DFB uses small forms such as 3 v 3 and 5 v 5 for these ages; KNVB plays 6 v 6 for O8 to O10; the FFF uses small formats and forbids tackles in the U8 to U9 format. Always check your own league'],
  ['Field size','About 28 x 18 yards (4 v 4) and 35 x 22 yards (5 v 5)','Our practice size. League sizes differ between countries; use theirs on match days'],
  ['Goals','Four small goals (3 v 3); two goals with rotating goalkeepers (5 v 5); pop-up goals in finishing','KNVB 6 v 6 uses small goals (5 x 2 m); DFB uses small goals with a shooting zone in 3 v 3'],
  ['Ball','Size 3','Check your league; some move to size 4 around age 9'],
  ['Goalkeepers','Rotating each round in 5 v 5; hands only in the own area','Law 12 (handball), IFAB'],
  ['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 to 12 minutes in small forms'],
  ['Rotation','Rotate teams, roles and the goalkeeper often','DFB: rotation after goals or on a fixed order'],
  ['Referees','Coach and helper referee; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],
  ['Restarts','Kick-off, throw-in with hands, goal kick, corner kick and free kick as taught in chapter 12','IFAB Laws 8, 12, 15, 16 and 17, with shorter distances on small pitches'],
  ['Offside','Not enforced. An offside-idea line is used in the 5 v 5 finale at Level 6','IFAB Law 11; many children’s formats do not apply it. Teach the idea only'],
  ['Heading','Not used','U.S. Soccer age-group guidance'],
  ['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down']
 ])+ul(['Use a whistle to start and stop, not to stop every mistake','The IFAB 2025/26 Laws changed the keeper rule: a keeper who controls the ball with the hands for more than eight seconds can give away a corner kick. We teach “release quickly” without punishing it in practice','If your league plays 7 v 7 at the next age, a gradual step to larger fields is planned for 3rd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 7 and 8, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 7 and 8','How we train it','Chapters'],[['Speed','A key trainable window; short bursts with full rest','15 to 20 yard sprints from standing, crouch and lying starts; timing gates','2, 3, 7'],['Agility','Plant-and-push and quick changes improve','Cuts, ladder, reaction signals, 1 v 1','2, 3, 7'],['Coordination','Quick feet and rhythm develop','Ladder patterns, low hurdles, ball sequences','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, hurdle landings, keeper dives','2, 11'],['Flexibility','Dynamic and playful, not static','Dynamic moves at the run start','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: hops, jumps, low landings','Hurdle hops and squats in play form','2'],['Reaction','Improving','Light and sound signals, ready position','2, 7, 11']])+`<h4 class="sp">What the sources say</h4>`+ul(['The FFF livret recommends short, varied activity blocks and avoiding mechanical overload because bones are still growing','Long-term athlete development models (World Rugby, used for the general model) describe a fundamental stage with a broad movement base, agility, balance, coordination and speed through play','Children who play several sports and games tend to build a broader base than those who specialise early (the sampling idea of Côté; background knowledge)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>FIFA 11+ Kids was tested in a trial in children’s football and is a longer structured option. Our run start and dynamic moves are a short routine that you can combine with parts of it.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger and more confident. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Ideas that guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which tool, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci; background knowledge). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 7 and 8, children notice who is faster or better. The Jolles report notes that self-evaluation is still early, so children may judge themselves harshly or not at all. Protect every child: use own-best targets, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory, inhibitory control and flexibility are all developing quickly. Games such as Switch, changing the rule every few minutes and if-then cues practice them while the children simply play. Research links sport with executive function but the evidence is mixed, so treat this as a design guide rather than a promise.</p><h4 class="sp">If-then plans</h4><p>An if-then cue (“If I see a free teammate, then I pass”) is a short plan a child can use in the moment. It is a coaching idea based on implementation-intention research (background knowledge; not rechecked) and is used in chapter 9.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (FA social skills)','Keep instructions short, feedback positive and specific','Ask questions more than giving answers','Captains and helper referees practice calm voices: a clear, kind sentence'])],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints, equipment and children.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay at 15 to 20 yards with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','New tools: use low, break-away hurdles; flexible poles with soft tops; lay ladders flat; anchor pop-up goals and rebound boards; use a soft mannequin and teach a safe approach','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and dynamic moves are a simple routine. FIFA 11+ Kids (tested in a trial in children’s football) is a longer structured option. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 next:['Looking Ahead to 3rd Grade','The next curriculum extends this base.',()=>`<p>3rd grade deepens the same chapters and prepares the step to larger formats such as 7 v 7: longer passing patterns, more combinations, real positions that still rotate, a first goalkeeper-specific block, throw-ins and set plays run by the players, and the offside rule as a taught rule where your league uses it. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in 5 v 5 and then 7 v 7','Players take on more of the planning and the review','Training tools stay and new ones (agility poles, small cages, rebounders) can be added','The Rules page grows with offside and the advantage rule'])],
 tools:['Training Tools','The tools introduced in 2nd grade, where each first appears in the plan, and how to use it safely. Each tool is drawn in the exercise animation.',()=>{const f=firstUse(11);return `<p>Tools are used to add variety, make the idea visible and give children something new to explore. None is required: each has a home substitute. “First seen” is the first practice in the plan where the tool is in an exercise.</p>`+tbl(['Tool','What it is','First seen','Used in','Safe use','Home option'],Object.keys(TOOLINFO).map(t=>{const i=TOOLINFO[t],u=f[t];return [`<b>${t}</b>`,i[0],u?`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`:'—',u?u.cnt+' exercises':'—',i[1],i[2]];}))+`<p class="note">The tool is shown inside the animation of each exercise that uses it, and the exercise card has a New tool line.</p>`;}],
 rules:['Rules of the Game','The real rules of soccer introduced gradually inside games, with the matching IFAB Law and the first practice in which each appears.',()=>{const f=firstUse(12);return `<p>Rules are taught inside games, not by lecture. In 1st grade children learned ball in and out, hands, push and trip. In 2nd grade each restart gets its own game and a short, child-language rule. Distances are shortened for small pitches. The main source is the IFAB Laws of the Game, the rule book for the whole world.</p>`+tbl(['Rule','IFAB Law','What children learn','Coach note','First seen','Used in'],Object.keys(RULEINFO).map(t=>{const i=RULEINFO[t],u=f[t];return [`<b>${t}</b>`,i[0],i[1],i[2],u?`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`:'—',u?u.cnt+' exercises':'—'];}))+`<h4 class="sp">What changes by level</h4>`+tbl(['Level','Rule focus'],[['1 Introduce','Kick-off, referee signals, throw-in with the right hands and feet'],['2 Practice','Goal kick, corner kick, free kick distance'],['3 Develop','Fouls and handball with the word deliberate; advantage'],['4 Challenge','Players restart without the coach; helper referee calls'],['5 Combine','Several restarts in one game; the leader names the restart and the taker'],['6 Perform','5 v 5 with all restarts and the offside idea line, run by the players']])+`<p class="note">Offside is taught as an idea in this grade, not enforced. Check your league for the age at which it applies.</p>`;}]

const GORDER=[['run','Run start'],['structure','75-minute practice'],['bridge','From 1st grade'],['develop','Child development'],['theory','Game ideas'],['formats','Rules and formats'],['tools','Training tools'],['rules','Rules of the game'],['body','Body and growth'],['psych','Psychology'],['review','Plan, Do, Review'],['safety','Safety'],['team','Team chemistry'],['parents','Parents'],['assess','Assessment'],['next','Next grade'],['sources','Sources']];

function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

/* ---------- shell ---------- */
$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">Second Grade Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchg2-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchg2-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchg2-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CAL&&(CAL.sel!==null||CAL.panel)){CAL.sel=null;CAL.panel=null;if($('#drawer'))renderCal();}});
const th=$('#theme');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchg2-theme',t);}catch(e){}}
th.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark');});
try{const t=localStorage.getItem('rchg2-theme');if(t)setTheme(t);}catch(e){}
route();
})();
