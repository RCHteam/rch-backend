<script>
// 2nd Grade curriculum content (original writing). Chapters 1 to 4. Source keys are explained on the Sources page.
window.CHAPTERS = [
{
 n:1, title:'Leadership, Roles and Fair Play', short:'Leadership & Fair Play',
 lead:'Second graders move from taking part to taking responsibility. They elect rotating captains, own a role in every game, help run restarts with the real signals, work out disagreements with a short method and begin to set a small goal for the whole team.',
 builds:[], focus:{Technical:1,Physical:1,Psychological:5,Social:5},
 grew:{pre:'1st graders wrote a team agreement, took a turn as leader of the day, called restarts and settled disputes with stop, say, solve.',k:'2nd graders choose captains by a fair rotation, wear a bibbed role (attacker, defender, helper, keeper) in every game, run restarts with the referee signals, set a team goal for the cycle and take a turn as helper referee.'},
 dev:'Between about 7 and 9, children can still plan only a short way ahead (days, not months), find it hard to judge themselves and often cannot yet read other people’s intentions well (Jolles report for the KNVB). The CDC adds that children aged 6 to 8 care more about friendships and being part of a team. Soccer use: give real jobs that last one practice, give feedback in small steps, and never ask a child to think about the season, only about today and the next practice.',
 basis:[['JOLLES','Self-evaluation and empathy are still early before about age 10; planning is short term; keep feedback in small steps and avoid early rankings.'],['FA','Three ground rules (safe, respectful, no disruption) and a mix of player-led and coach-led time.'],['FFF','Individualise the relationship with each child, offer short varied activity, and teach rules of life and rules of the game together.'],['DFB','Coaches and officials act as joint game leaders and step in only when needed; children decide on the pitch themselves.']],
 game:'Roles Game: 3 v 3 where each child wears a role bib (attacker, defender, helper). Roles swap after every goal and a child calls the restart with the referee signal.',
 objectives:['Take the captain role with a fair rotation and say the three captain jobs','Wear a role bib in a game and name the job of that role','Call and show restarts with the referee signals (ball out, goal, free kick, advantage)','Use stop, say, solve with a teammate and set one team goal for the cycle'],
 outcomes:['Names the three captain jobs and does one without help','Says what the role bib means before the game starts','Shows two referee signals and calls the restart','Helps the team set a goal and says if it was reached'],
 concepts:[['Coach term / child language',[['Captain of the day','"I help everyone feel part of the team"'],['Role bib','"My bib is my job today"'],['Team goal','"One thing we will do better together"'],['Referee signal','"I show it so everyone can see"'],['Advantage','"Let the play go on"'],['Stop, say, solve','"Freeze, tell, fix"'],['Own best','"Better than my last time"']]]],
 why:'Seven- and eight-year-olds enjoy being trusted with a clear job. They can follow a rule they helped to write and can take a short turn in charge. Their view of their own ability is still forming, so giving every child a role that does not depend on speed or size keeps all of them in the game. Real signals give them a first, simple picture of how a match is run.',
 details:[
 {h:'Captains who serve',p:['In 1st grade every child led as leader of the day. In 2nd grade the captain gets three clear jobs: welcome everyone, help run the warm-up and make sure the equipment is packed. Captains come from a visible rotation list, so everyone has a turn and nobody is picked for being good.','The KNVB’s Jolles report notes that children this age are not yet good at judging themselves or reading others, so the captain role is practical (do three things), not about speeches. The coach models the words and the child copies them.'],pts:['Use a rotation list that is on show at every practice','Give the captain a card with the three jobs','Praise what the captain did for others','Pair a shy child with a partner for the first turn'],scene:'circle'},
 {h:'Roles with bibs',p:['Coloured bibs tell children who they are in a game: attacker, defender, helper (the player who supports) and later keeper. The bib is a tool, not a position. It lets a child know the job without a long explanation, and it lets the coach see at a glance who is doing what.','Roles change after every goal or round, so every child tries every job. This follows the DFB idea of broad training without early specialisation and the FA’s mix of player-led and coach-led play.'],pts:['Show the bibs and what each job means in one sentence','Change roles after a goal or two minutes','Let the group agree when a role has been played well','Keep the roles the same for every child over the cycle'],scene:'shapes'},
 {h:'Restarts with the real signals',p:['Children meet the signals a referee uses: arm out for a kick-in or throw-in, point to the goal for a goal, flat hand for a free kick, and the sweep forward for advantage. In practice the captain or helper referee shows the signal and the group follows. This is the first step of the Rules chapter (chapter 12).','The FFF teaches rules of the game and rules of life together, and the DFB leaves the early calls to children with coaches stepping in only when needed. We copy both: children call, adults guide.'],pts:['Practise each signal in a game, not in a lecture','Use the same signal and word every time','Praise honest calls against your own team','Let a child be helper referee for one round'],scene:'refsignals'},
 {h:'Stop, say, solve',p:['Disagreements will still happen in games with real jobs. The three steps are stop (freeze and breathe), say (each child says what happened and what they want, starting with “I”) and solve (agree a fix, such as replay or swap roles). The coach models it once with an adult example.','Give the pair a minute before stepping in. Children aged 7 to 8 are developing empathy, and a short, guided conversation is how it grows.'],pts:['Model the steps with an adult example','Give a minute before stepping in','Use “I feel … I want …”','Praise the pair that solved it'],scene:'pairs'},
 {h:'A goal for the team',p:['At about 7 to 8, children are better at short goals than long ones. Every cycle the team picks one simple goal (for example “everyone touches the ball in every game”) and checks it at the end of each practice. A team goal is shared, so it protects children who do not feel fast or skilled.','Keep the language about today and the next practice. Long-term goals, rankings or talk about championships mean little at this age (Jolles).'],pts:['One goal per cycle, three to six words','Check it at the closing circle','Celebrate when it is reached','Never compare one child with another'],chart:'session'}
 ],
 drills:[],
 faults:[['Same children always captain','Choosing by confidence','Use the rotation list; the list decides'],['Children ignore the role bib','Role not explained or not changed','Say the job in one sentence and rotate after each goal'],['Signals are copied wrongly','Not practised in play','Use the signal in a short game with a real restart'],['Arguments grow','No agreed method','Stop, say, solve with an adult model first'],['Team goal is forgotten','Too long or too many','One goal in three to six words, checked every practice']],
 check:'Child names the captain jobs, says what their bib means, shows two referee signals and takes part in stop, say, solve.'
},
{
 n:2, title:'Agility, Speed and Rhythm', short:'Agility & Speed',
 lead:'Athletic movement grows with new tools. Second graders use agility ladders and low hurdles, run longer sprints from varied starts, change direction at speed, react to a signal and time themselves against their own earlier result.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:3},
 grew:{pre:'1st graders sprinted 10 to 15 yards, stepped through low markers, reacted to a clap and landed balanced.',k:'2nd graders add agility ladders and low hurdles, run 15 to 20 yard sprints from varied starts, cut at speed, react to two signals at once and use timing gates to compare themselves with their own earlier time.'},
 dev:'Children of about 7 to 9 are in the stage some models call the fundamental or learn-to-play stage, when a broad base of movement skills, speed and agility is easiest to build (long-term athlete development models, World Rugby page read). The FFF warns against mechanical overload because bones and growth plates are still developing and recommends movement courses and short bursts of effort. Soccer use: lots of short, varied, playful runs and jumps, with full rest, and no long repetitive drills.',
 basis:[['FFF','Short activity blocks, motor-skill courses, avoid mechanical overload because bones are still growing, children tire fast but recover fast.'],['LTAD','The fundamental stage favours a broad movement base, agility, balance, coordination and speed through play.'],['FIFA','Sessions should be fun, safe and effective, with warm-ups that include the ball.'],['FIFA11','A structured injury-prevention warm-up (FIFA 11+ Kids) was tested in children’s football and can be used as a longer option.']],
 game:'Relay Racing Game: teams of four run an agility ladder and hurdle course with a ball, then a sprint to tag the next runner. Teams race against their own best time, not against each other.',
 objectives:['Run through an agility ladder with quick, light feet in two or three patterns','Clear low hurdles with a soft, balanced landing','Sprint 15 to 20 yards from a standing, crouch or lying start','React to a sight or sound signal and cut in the called direction'],
 outcomes:['Runs a ladder pattern without touching the rungs','Lands from a hurdle hop and holds for two seconds','Sprints 15 yards tall and compares with their own time','Reacts to a signal in 3 of 4 tries'],
 concepts:[['Coach term / child language',[['Agility ladder','"A ladder on the grass for quick feet"'],['Hurdle hop','"Jump, land, freeze"'],['Ready position','"Knees bent, eyes up"'],['Cut','"Plant and push the other way"'],['Reaction','"See it, go"'],['Timing gate','"Beat my own time"'],['Full rest','"Walk back and breathe"']]]],
 why:'Seven- and eight-year-olds are at a stage where quick feet, balance and rhythm come easily when they are practised as games. Ladders and low hurdles give a clear picture of what quick, light movement looks like. Timing against their own earlier result shows progress without comparing children, which matters at an age when some are almost two years older than others.',
 details:[
 {h:'Quick feet on a ladder',p:['The agility ladder is introduced as a pattern tool: one foot in each square, two feet in each square, in and out, and a sideways step. Start slowly and keep the head up after the first try; the goal is rhythm, not speed.','Patterns change every practice so the brain, not only the legs, is working. Add a ball only when the pattern is automatic.'],pts:['Walk the pattern first','Small, quick steps; eyes up','Change the pattern each practice','Add a ball only when ready'],scene:'ladder'},
 {h:'Hurdles and landings',p:['Low hurdles (about the height of a shin or lower) teach children to jump and land with soft knees. A balanced landing held for two seconds is the safety skill that protects knees and ankles; it connects to the injury prevention ideas in FIFA 11+ Kids.','Spacing is wide at first and narrow later. Keep jumps low and the number of repeats small; rest fully between turns.'],pts:['Low hurdles only','Land softly, hold two seconds','Full rest between turns','Stop if a child is tired'],scene:'balance'},
 {h:'Speed from different starts',p:['Sprints are short (15 to 20 yards) and begin from different positions: standing, crouched, lying face down, sitting. This builds reaction and the first three steps. Rest is long compared with the run so quality stays high.','The FFF notes that children tire quickly but recover quickly, so short bursts with real recovery fit better than long running.'],pts:['15 to 20 yard sprints','Change the start position','Full rest between runs','Run tall with bent arms'],scene:'sprint'},
 {h:'Cut and react',p:['A cut is a plant and push in a new direction. The child slows, plants the outside foot, pushes off and accelerates. Second graders react to a coach’s colour or number, then to two signals at once (for example colour for direction and clap for go).','Reaction games also train attention and self-control (stopping an automatic response), which are still developing at this age.'],pts:['Slow, plant, push','One signal, then two','Look at the coach, not the feet','Keep rounds short'],scene:'cut'},
 {h:'Beat your own time',p:['Timing gates (two cones with a beam or a coach with a stopwatch) let each child see their own time over a short course. They record it on a card and try to beat it, never someone else’s.','The aim is progress against the self; it also protects children who were born late in the year and are smaller than others.'],pts:['One card per child','Compare only with your own earlier time','Praise improvement and effort','Keep results private'],chart:'balance'}
 ],
 drills:[],
 faults:[['Children touch the rungs','Too fast too soon','Slow down and walk the pattern'],['Heavy landings','Fatigue or height too high','Lower hurdles and rest longer'],['Slow first step','Standing upright','Cue: knees bent, first step short'],['Late reaction','Looking at feet','Look at the coach before the signal'],['Comparing times with friends','Public results','Keep cards private; compare with yourself']],
 check:'Child runs a ladder pattern cleanly, lands from a hurdle with balance, sprints 15 yards tall and reacts to a signal.'
},
{
 n:3, title:'Control, Dribbling and Change of Pace', short:'Control & Dribbling',
 lead:'Ball mastery and dribbling join in 2nd grade. Players dribble with both feet around poles and cones, change pace and direction with a cut, a drag back or a simple step-over, shield from a chaser and look up to find space.',
 builds:[2], focus:{Technical:5,Physical:3,Psychological:3,Social:2},
 grew:{pre:'1st graders linked four moves, changed tempo, juggled with a bounce, dribbled 10 yards at speed, used two moves and shielded for five seconds.',k:'2nd graders dribble through poles on both feet, add a drag back and a simple step-over, change pace twice in one run, shield and turn out of pressure, and keep the head up to choose a target.'},
 dev:'Coordination and body control keep improving between 7 and 9, and children now enjoy mastering a trick and showing it to friends. The FIFA Training Centre’s dribbling page (ages 4 to 8) starts with unopposed dribbling, adds light competition and then 1 v 1, 2 v 2 and 2 v 1, and says freedom of expression is a core part of it. Soccer use: lots of touches, space to invent, and a slow build to opposed play.',
 basis:[['FIFA','Dribbling for ages 4 to 8: unopposed first, then light competition, then 1 v 1, 2 v 2 and 2 v 1; freedom of expression.'],['FA','Ball mastery progression, when to stay on the ball, shielding.'],['DFB','The game is the teacher: practices are linked to game situations.'],['KNVB','Variety and play: training that feels like a game suits this age.']],
 game:'Pole Slalom Match: 3 v 3 where a goal after dribbling around a pole counts double. Players choose to dribble or pass.',
 objectives:['Dribble around poles and cones on both feet at a steady pace','Use a cut, a drag back and a simple step-over to change direction','Change pace twice in one run: slow, fast, slow','Shield the ball from a chaser and look up to find space'],
 outcomes:['Dribbles six poles with no stray touch on either foot','Shows a cut, a drag back and a step-over in a sequence','Changes pace on a call twice in 20 yards','Shields for 5 seconds and turns away from a chaser'],
 concepts:[['Coach term / child language',[['Slalom','"Weave in and out of the poles"'],['Cut','"Plant and push the other way"'],['Drag back','"Pull the ball back with my sole"'],['Step-over','"Circle my foot over the ball"'],['Change of pace','"Slow, then burst"'],['Shield','"Keep my body between ball and chaser"'],['Head up','"Peek at the space"']]]],
 why:'Eight-year-olds can control the ball with both feet, think about two things at once and enjoy inventing moves. Poles and cones give clear paths for the ball and show whether the touch was close or loose. Pace changes, drag backs and step-overs are the first tools to beat a defender with space, building on the moves of 1st grade without repeating them.',
 details:[
 {h:'Poles and both feet',p:['Poles (slim sticks in the ground or on bases) make the path visible and punish loose touches. Children dribble slalom with the right foot, the left foot and then alternate. Poles are spaced wide at first and closer later.','The FIFA Training Centre starts dribbling unopposed so each child can try things without pressure. Keep the first rounds slow and quiet.'],pts:['Wide spacing first','Both feet, then alternate','Close touches, ball under control','Count clean runs, not speed'],scene:'zigzag'},
 {h:'Drag back and step-over',p:['The drag back pulls the ball back with the sole and turns away. The simple step-over circles the foot over the ball and pushes away with the other foot. Both are learned still, slow and then in a short run. They are tools, not tricks to show off.','Offer them as choices and ask children to invent their own. Second graders enjoy naming moves, which also helps memory.'],pts:['Learn still, then slow, then at pace','Name the move','Teach as a choice','Never force a move'],scene:'fake'},
 {h:'Change of pace',p:['Changing speed beats a defender as well as changing direction. A child dribbles slowly, then bursts after a call or a cone. The first touch after the burst is longer, then touches shorten again.','Combine pace and direction: slow, cut, burst. Keep the head up on the burst to find the space.'],pts:['Slow, then burst','Longer touch to start the burst','Shorten touches after','Head up on the burst'],scene:'trafficlight'},
 {h:'Shield and turn',p:['Shielding uses the body between the ball and the chaser, with the arm out for balance. Add a turn when the chaser leans one way. Chasers use gentle taps to start; no pushing or grabbing.','Shielding and turning give a second option when there is no pass. They connect to receiving and turning in chapter 4.'],pts:['Body between ball and chaser','Arm out, ball on the far foot','Turn when the chaser leans','Gentle chasing only'],scene:'shield'},
 {h:'Head up and decide',p:['Looking up while dribbling is a skill. Second graders peek between touches, name the space or a teammate and choose to dribble, pass or shoot. Cue cards or a coach holding up fingers train the habit.','The FA notes that coaches help decision-making when practices include perception as well as technique, and the DFB wants practices linked to the game, so decision games are used from level 3 on.'],pts:['Peek between touches','Name the space','Use a coach signal','Add decisions from level 3'],chart:'dribble'}
 ],
 drills:[],
 faults:[['Ball runs away from the feet','Touches too hard','Shorter touches; slow down'],['Moves look stiff','Trying to copy a trick','Let children invent and name their own move'],['No speed change','Same pace all the time','Call “slow, burst” and use a cone as the trigger'],['Shield collapses','Body too upright or facing the chaser','Body sideways, arm out, ball on far foot'],['Head always down','Fear of losing the ball','Add a peek cue and start slow']],
 check:'Child dribbles six poles with both feet, shows a cut, drag back and step-over, changes pace twice and shields for five seconds.'
},
{
 n:4, title:'Receiving, Turning and Orientation', short:'Receiving & Turning',
 lead:'Receiving moves from stopping the ball to using the first touch to set up the next action. Second graders use a rebound board, receive across the body, take a directional first touch, receive and turn and peek before the ball arrives.',
 builds:[3], focus:{Technical:5,Physical:2,Psychological:3,Social:3},
 grew:{pre:'1st graders controlled a rolling pass at pace, took the touch away from a cone, used the thigh on a bounce and peeked over the shoulder.',k:'2nd graders use a rebound board for repeated control, receive across the body, take the first touch into the next action, receive and turn with a passive then live defender, and control balls from different angles.'},
 dev:'Eye-hand and eye-foot coordination keep improving between 7 and 9, and children follow moving objects better but still struggle to track several things at once (CDC for ages 6 to 8; FA decision-maker article on perception). Soccer use: calm the first rounds, add the peek early, and let the touch decide where to go next.',
 basis:[['FA','Perception and technique are trained together; random, variable practice and playing forms beat repeated blocked drills.'],['DFB','The game is the teacher; keep the number of themes small.'],['FIFA','Mini-games give many touches and game-like situations.'],['CDC6','Catching and ball skills become easier at 6 to 8; visual tracking is still developing.']],
 game:'Receive and Turn Game: 3 v 3 where a goal counts double if the scorer received and turned before shooting.',
 objectives:['Control a pass from the board or a partner with either foot and in the called direction','Receive across the body with the far foot and open the hips','Take a first touch that moves the ball into the next action','Peek before the ball arrives and receive and turn away from a passive defender'],
 outcomes:['Controls 7 of 10 balls from the rebound board within one stride','Receives across the body and plays on with the next touch','Peeks in 6 of 10 passes before the ball arrives','Receives and turns past a passive defender in 4 of 6 tries'],
 concepts:[['Coach term / child language',[['Rebound board','"A wall that gives the ball back"'],['Open body','"Face the field, not the passer"'],['Across the body','"Control with the foot far from the passer"'],['Directional touch','"Touch it where you want to go next"'],['Turn','"Peek, touch, turn"'],['Peek','"Look before the ball comes"'],['Soft foot','"Pillow, not a brick"']]]],
 why:'Second graders can now think about where the next action goes while the ball is still moving. Receiving becomes a first step of play, not a stop. A rebound board gives repeated, safe practice at all speeds and needs no partner. The FA’s decision-maker article suggests perception is trained with technique, so the peek is part of every receive.',
 details:[
 {h:'The rebound board',p:['A rebound board (a flat board or net that returns the ball at an angle) gives many touches in a short time. Children pass to the board and control the return with a soft foot. Distance and angle change the speed and difficulty.','Start close and slow; add distance and angle later. Use the board in pairs so each child gets rest between turns.'],pts:['Start close and flat','Soft foot, ball under control','Change angles and distance','Rest between turns'],scene:'rebound'},
 {h:'Open body, across the body',p:['Children receive with the far foot (the foot away from the passer) so the hips open to the field. This lets them see more and pass or turn faster. It feels strange at first; start without a defender and then add one.','Open body is one of the clearest habits that make later play easier. Use short cues and demonstrate with one child.'],pts:['Far foot receives','Hips face the field','Start without a defender','Praise the open body'],scene:'receive'},
 {h:'Directional first touch',p:['The first touch moves the ball into the next action: toward a goal, a teammate, a gate or away from a defender. A coach or card shows the direction a moment before the ball arrives. This links perception and technique.','Keep touches soft but not stopped. Count the touches to the next pass: the aim is one.'],pts:['Touch where you want to go','Direction shown before the ball arrives','Soft but moving','One touch to the next action'],scene:'receive'},
 {h:'Receive and turn',p:['A turn lets a child face the goal after receiving with the back to it. Start with a passive defender, then a live one. The child peeks, touches the ball away from the defender and turns.','Turns connect to shielding in chapter 3 and to 1 v 1 in chapter 7. Keep rounds short and praise brave tries.'],pts:['Peek first','Touch away from pressure','Passive, then live defender','Praise the try'],scene:'turn'},
 {h:'Peek before the ball arrives',p:['A peek is a quick look over the shoulder before the ball arrives. Coaches count visible head turns. The aim is to peek in most passes by the end of the cycle. A scanning study of older players found that more head turns before receiving was linked to faster passing (abstract read); use it as a guide, not a rule for children.','Keep the peek simple: look, then ball.'],pts:['Look, then ball','Count head turns','Start slow','Praise the peek'],chart:'scan'}
 ],
 drills:[],
 faults:[['Ball bounces off the foot','Stiff foot','Cue: pillow foot, relax the ankle'],['Child faces the passer','Closed body','Cue: show your side, far foot receives'],['Touch stops the ball dead','Fear of losing it','Touch toward the next action'],['Turn is slow','No peek first','Peek before the ball arrives'],['Head never moves','Fear of missing the ball','Start slow; count peeks together']],
 check:'Child controls balls from a rebound board, receives across the body, takes a directional touch and receives and turns.'
},
{
 n:5, title:'Passing Range, Patterns and Weight', short:'Passing',
 lead:'Passing becomes a pattern. Second graders pass over 12 to 15 yards, pass through passing arcs and rings, play wall passes and third-player runs in a triangle, judge the weight of a pass and pass with both feet.',
 builds:[3,4], focus:{Technical:5,Physical:2,Psychological:3,Social:4},
 grew:{pre:'1st graders passed firmly over 10 yards, tried the outside of the foot, passed on the move and into space, and kept the ball in a 3 v 2.',k:'2nd graders pass 12 to 15 yards with the right weight, hit rings and arcs, play patterns in a triangle with a third player, pass with both feet and use the outside foot in a game.'},
 dev:'Leg strength and timing continue to improve between 7 and 9, and children begin to think about what a teammate will do next, though empathy and the reading of other people’s intentions are still maturing (Jolles report for the KNVB; CDC for ages 6 to 8). Soccer use: passing with clear targets, partners who talk, and patterns that make everyone part of the move.',
 basis:[['FIFA','Mini-games give many passing touches; keep practices ball-centred.'],['FA','Passing as part of the technical and social corners; practices closer to the game are more useful.'],['KNVB','6 v 6 pupil games give many pass options for ages 8 to 10.'],['JOLLES','Limited empathy before about age 10: partners must talk and show where they want the ball.']],
 game:'Rings and Arcs Game: 4 v 4 where a pass through an arc or into a ring earns a bonus point before the team shoots.',
 objectives:['Pass accurately over 12 to 15 yards with the inside and the laces','Pass through a passing arc and into a ring with the right weight','Play a wall pass and a third-player run in a triangle','Pass with the weaker foot and the outside of the foot in a game'],
 outcomes:['Passes 7 of 10 accurately from 12 yards with either foot','Hits a ring from 10 yards in 4 of 8 tries','Completes a triangle pattern with a third runner','Plays an outside-foot pass in a small game'],
 concepts:[['Coach term / child language',[['Passing arc','"A pass that goes through the gate"'],['Ring','"Hit the target"'],['Weight','"Not too soft, not too hard"'],['Wall pass','"Give and go"'],['Third player','"The player who runs into the space"'],['Both feet','"Right, left, right"'],['Call and show','"Say my name and show where"']]]],
 why:'Eight-year-olds can judge distance and speed and can work out where a teammate will be. They understand a pattern as a small team play. Arcs and rings give clear targets and make weight of pass visible. Calling and showing makes up for limited empathy by making the receiver’s wish clear.',
 details:[
 {h:'Weight and distance',p:['The right weight of a pass depends on distance, grass and the receiver’s speed. Children learn it by passing the same distance repeatedly and noticing what happens. Rings and cones give instant feedback: too soft stops short, too hard runs past.','Move the target back only when accuracy is steady. Use the weaker foot at short distance first.'],pts:['Repeat the same distance','Feedback from the target','Weaker foot at short range','Move back when steady'],scene:'pass'},
 {h:'Arcs and rings',p:['A passing arc (a curved gate or a pair of cones) and a ring (a hoop or ring on the ground) add a small target. Passing through an arc teaches height and direction. A ring teaches weight because the ball must stop inside or near it.','Rings are placed in front of a runner or at the end of a lane. Count hits to make it a game.'],pts:['Start close','Count hits','Use both feet','Change the target every few turns'],scene:'gates'},
 {h:'Triangle patterns',p:['In a triangle of three players, the passer follows the pass, the receiver passes to the third player and the ball moves around. Patterns include give-and-go (wall pass) and a third-player run into space.','Patterns are taught slowly, then at pace. Keep the group small so every child is busy.'],pts:['Pass and follow','Walk the pattern first','Name the third player','Rotate every minute'],scene:'triangle'},
 {h:'Both feet, outside foot',p:['Second graders pass with the weaker foot every practice and use the outside of the foot in a game as a choice. The outside foot pass is quick and hidden, useful for short passes to a teammate on the side.','Offer it, never force it. A child who succeeds a few times will use it more.'],pts:['Weaker foot every practice','Outside foot as a choice','Short distances first','Praise the try'],scene:'pass'},
 {h:'Call and show',p:['A receiver who calls the passer’s name and shows where they want the ball (hand or foot) helps the passer with a simple signal. The KNVB’s Jolles report notes that children this age are still learning to read others’ intentions, so a clear call and show is a good substitute.','Praise good calls as much as good passes.'],pts:['Say the name','Show the space','Praise the call','Keep it quick'],chart:'pass'}
 ],
 drills:[],
 faults:[['Pass too soft','Fear of power','Practice firmer passes at short distance'],['Pass wide','Plant foot not pointing at target','Check plant foot and follow-through'],['Pass to feet only','Habit','Place a ring in front of the runner'],['Receiver stands still','Waiting for the ball','Cue: call and show'],['Weaker foot ignored','Comfort','Weaker foot in every practice; reward tries']],
 check:'Child passes 7 of 10 over 12 yards, hits a ring, plays a triangle pattern and uses the weaker foot in a game.'
},
{
 n:6, title:'Finishing and Shooting Variety', short:'Finishing',
 lead:'Finishing grows from one clean strike to a set of ways to score. Second graders use pop-up goals, shoot with a short run-up with both feet, finish from a pass first time, place the ball far side, finish rebounds and shoot early in a 1 v 1.',
 builds:[4,5], focus:{Technical:5,Physical:3,Psychological:4,Social:3},
 grew:{pre:'1st graders struck with the instep, finished first time from a slow roll, shot to a called corner and finished a 1 v 1 against a keeper.',k:'2nd graders shoot with both feet from a run-up, place shots in a pop-up goal, finish from different angles, score rebounds, finish after a dribble and a pass, and shoot early in a 1 v 1.'},
 dev:'Children of 7 to 9 are more willing to shoot when mistakes are cheered and when shots come in a safe, fun game. Strength and balance on one leg are improving, but power is still limited. Soccer use: many shots, small goals that give feedback, and cheers for brave shots.',
 basis:[['FIFA','Funino and mini-goals encourage many shots; keep practices fun and game-like.'],['DFB','Four mini-goals with scoring from inside a shooting zone is the German game form for the youngest children.'],['FA','Praise effort and keep the number of themes small.'],['KNVB','Pupil goals are small (5 x 2 m in the 6 v 6 form), which makes placement matter.']],
 game:'Pop-Up Goal Game: 3 v 3 with two pop-up goals at each end; goals count only from inside a shooting zone and a first-time goal counts double.',
 objectives:['Strike with the instep after a two- or three-step run-up with either foot','Place a shot to the far side of a pop-up goal','Finish a pass first time without stopping it','Shoot early in a 1 v 1 and follow up a rebound'],
 outcomes:['Hits 5 of 10 shots on target from 12 yards','Places 3 of 8 shots to a called corner','Finishes 3 of 8 first-time balls','Follows up a rebound in 2 of 5 tries'],
 concepts:[['Coach term / child language',[['Pop-up goal','"A small goal that folds and pops up"'],['Run-up','"Two steps then strike"'],['Far side','"Aim for the corner farthest from the keeper"'],['First time','"Shoot without stopping the ball"'],['Rebound','"Follow the shot"'],['Shooting zone','"Score from inside the lines"'],['Early shot','"Shoot before the defender arrives"']]]],
 why:'Second graders can coordinate a run-up, a plant foot and a strike, and they enjoy shooting at goals that look real. Pop-up goals are light, safe and the right size. Variety (angles, speeds, ways to start) means every child gets many different shots and keeps trying.',
 details:[
 {h:'Run-up and strike',p:['A short run-up of two or three steps gives rhythm without losing balance. The plant foot lands beside the ball, the ankle is locked and the follow-through goes to the target. Use both feet in every practice.','Start from a still ball; add a rolling ball later. Count good strikes, not goals.'],pts:['Two or three steps','Plant beside the ball','Ankle firm, follow through','Both feet'],scene:'shoot'},
 {h:'Pop-up goals and placement',p:['Pop-up goals are small, so placement matters. Children aim for the far side and the corners. A coloured cone or flag in each corner gives a target.','Move the goal angle and distance each round so the problem changes.'],pts:['Aim far side','Use corner targets','Change angle and distance','Count hits'],scene:'colors'},
 {h:'First-time finishing',p:['First-time finishing means shooting without stopping the ball. The child lines up the run before the ball arrives and strikes through it. Start with slow rolls and then pass from the side.','Praise brave attempts even when the ball misses.'],pts:['Line up before the ball','Strike through it','Slow rolls first','Praise attempts'],scene:'firsttime'},
 {h:'Rebounds and follow-ups',p:['Rebounds (from a keeper, a post or a board) create second chances. Children learn to follow the shot and finish a loose ball. A rebound board can simulate it.','Follow-ups teach persistence and reading the game.'],pts:['Follow the shot','Be ready to strike again','Use a board or a coach','Cheer the follow-up'],scene:'rebound'},
 {h:'Shoot early in a 1 v 1',p:['Shooting early gives the keeper or defender less time. The child dribbles, takes one touch and shoots before the defender arrives. A mannequin (introduced in chapter 7) can stand in as a dummy defender.','Mix early shots with dribbling and passing so children choose.'],pts:['One touch, then shoot','Look at the goal','Mix with dribbling and passing','Praise brave decisions'],chart:'shoot'}
 ],
 drills:[],
 faults:[['Toe kick','Leaning back or no plant foot','Plant beside the ball; lock the ankle'],['Miss to the same side','Looking at the ball only','Look at the target, then the ball'],['Stopping the ball before the shot','Fear of missing','Slow rolls and praise attempts'],['Standing and watching the shot','No follow-up habit','Cue: follow your shot'],['Waiting too long in a 1 v 1','Fear of the keeper','Shoot after one touch; cheer attempts']],
 check:'Child strikes with either foot from a run-up, places a shot, finishes first time and follows up a rebound.'
},
{
 n:7, title:'Defending: 1 v 1, Jockey, Tackle and Recover', short:'Defending',
 lead:'Defending becomes a skill in its own right. Second graders use mannequins to learn the jockey, delay and cover, make a safe block tackle, recover goal-side after losing the ball and play 1 v 1 with real rules about fair challenges.',
 builds:[2,3], focus:{Technical:4,Physical:4,Psychological:4,Social:3},
 grew:{pre:'1st graders attacked with three moves, defended side-on, made a safe block tackle on a still ball and recovered after a loss.',k:'2nd graders jockey a moving attacker, delay for three seconds and guide to one side, make a block tackle on a rolling ball, recover goal-side, and learn what a fair challenge is.'},
 dev:'Children of 7 to 9 have better balance and can change direction quickly, but many still find it hard to judge speed and distance, so defending must be learned slowly (CDC for ages 6 to 8). The FIFA Training Centre’s dribbling page puts 1 v 1 after unopposed work, and the FFF’s U8 to U9 rules forbid tackles in matches. Soccer use: teach the jockey and the block tackle as skills in practice, but keep contact light and never tackle in games for this age if your league forbids it.',
 basis:[['FFF','In the French U8 to U9 format tackles are forbidden; shin pads are mandatory.'],['FIFA','Dribbling and 1 v 1 follow unopposed practice and light competition.'],['IFAB','Law 12: fouls include charging, pushing, tripping, holding and tackling carelessly; free kicks restart play.'],['FA','Praise effort and keep the number of themes small.']],
 game:'Mannequin Defence Game: 3 v 3 where two mannequins act as fixed defenders in the middle; attackers must pass around or dribble past them; real defenders cannot reach in.',
 objectives:['Jockey: stay side-on, knees bent and delay an attacker for three seconds','Use a mannequin to practise the jockey, close and cover','Make a block tackle with the inside of the foot on a rolling ball','Recover goal-side after losing the ball and know what a fair challenge is'],
 outcomes:['Delays an attacker for 3 seconds in 3 of 5 tries','Closes down a mannequin side-on without reaching','Wins a rolled ball with a block tackle in 3 of 6 tries','Recovers and gets goal-side in 3 seconds'],
 concepts:[['Coach term / child language',[['Jockey','"Stay low and shuffle"'],['Delay','"Slow them down"'],['Mannequin','"A dummy defender that stands still"'],['Block tackle','"Inside of the foot, firm"'],['Goal-side','"Between the ball and my goal"'],['Cover','"Stand behind my friend"'],['Fair challenge','"Play the ball, not the player"']]]],
 why:'Defending is hard to learn if attackers are fast and unpredictable. Mannequins give a fixed, safe target for jockeying, closing and cover. Real 1 v 1s follow in a small space. Children learn that the aim of defending is to delay and win the ball safely, not to rush in.',
 details:[
 {h:'Jockey and delay',p:['The jockey is a low, side-on stance with knees bent and weight on the front foot. The child shuffles backward in small steps and keeps the attacker in front. Delaying for three seconds gives teammates time to help.','Start with a walking attacker and a passive defender, then add speed.'],pts:['Side-on, knees bent','Small shuffles','Delay for three seconds','Attacker slows at first'],scene:'jockey'},
 {h:'Mannequins',p:['A mannequin is a dummy defender, a stand-up figure that does not move. It lets attackers practise beating a defender and lets defenders practise their position (close, side-on, cover) without contact. Mannequins can be placed in lines to show cover.','Use two or three mannequins to simulate a defence in a small game.'],pts:['Place mannequins to show cover','Attackers beat them with a move','Defenders copy the position','Use them in games'],scene:'cover'},
 {h:'The block tackle',p:['A block tackle is a firm inside-of-the-foot contact with the ball, never the player. Start with a rolling ball and a stationary partner, then a slow dribble. Fair play means playing the ball.','The IFAB laws penalise careless, reckless or excessive tackles; the FFF forbids tackles in U8 to U9 matches. Teach it as a skill, but follow your league.'],pts:['Inside of the foot, firm','Play the ball, not the player','Rolling ball first','Follow your league’s rule'],scene:'tackle'},
 {h:'Recover goal-side',p:['After losing the ball a defender runs back to get between the ball and the goal (goal-side) and then jockeys. Recovery runs are short sprints with a clear target.','Praise recovery as much as winning the ball.'],pts:['Turn and run','Get between ball and goal','Jockey then','Praise recovery'],scene:'goalside'},
 {h:'Fair challenges',p:['Children learn what is fair: play the ball, no pushing, holding or tripping. They also learn that a free kick restarts play after a foul. This is the first step into chapter 12.','Praise players who stop and say sorry; they model good play.'],pts:['Play the ball','No push, hold or trip','Free kick after a foul','Praise honesty'],chart:'duel'}
 ],
 drills:[],
 faults:[['Defender rushes in','Fear of the ball being lost','Cue: slow down, side-on'],['Reaching with the foot','Late arrival','Jockey first, tackle on a signal'],['Tackle hits the player','Poor timing','Rolling ball first; play the ball'],['Defender stands up straight','No knee bend','Cue: knees bent'],['Recovery run is slow','Giving up','Praise recovery runs; short races']],
 check:'Child jockeys for three seconds, closes a mannequin side-on, makes a block tackle on a rolling ball and recovers goal-side.'
},
{
 n:8, title:'Small-Group Play: 2 v 1, 3 v 2 and 3 v 3', short:'Small-Group Play',
 lead:'Combinations grow into small-group play. Second graders use the free player in 2 v 1, 3 v 2 and 3 v 3, play wall passes, overlaps and third-player runs, use width and begin to hear the idea of staying level with the ball (the first step toward offside).',
 builds:[5,7], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'1st graders drew a defender and passed, played wall passes and overlaps, used width in a 3 v 2 and attacked together in 2 v 2.',k:'2nd graders play 3 v 3 with support angles, third-player runs, overlaps and width, use mannequins and discs as markers, and begin to hear the idea of staying level with the ball.'},
 dev:'Between 7 and 9 children move from playing alone to playing with others and start to think about what a teammate will do (CDC for ages 6 to 8; KNVB Jolles report on limited empathy before age 10). Soccer use: give simple team jobs, mark spaces with discs, use mannequins to simulate defenders and keep groups small.',
 basis:[['FIFA','Small mini-games (3 v 3, 5 v 5) with space and no fixed timings; the FIFA once-a-week page suggests 3 v 3 plus neutral players to create numbers up.'],['DFB','Funino and 5 v 5 give many chances to attack in small groups.'],['FA','Three-phase thinking (in possession, out of possession, transition) in child language.'],['FFF','4 v 4 and 5 v 5 with no offside for ages 7 to 8.']],
 game:'3 v 3 + 2 Neutral Game: two neutral players on the sidelines always play with the team in possession, creating a 5 v 3.',
 objectives:['Find the free player in a 2 v 1 and a 3 v 2','Play a wall pass, an overlap and a third-player run in a 3 v 3','Use width and support angles with marked discs','Stay level with or behind the ball when the team is attacking (the idea, not the law)'],
 outcomes:['Finds the free player in 4 of 6 tries','Plays a wall pass and runs into space in 4 of 6 tries','Spreads to marked discs without reminders','Explains “stay level with the ball” in a sentence'],
 concepts:[['Coach term / child language',[['Free player','"The one with no defender"'],['Support angle','"Stand where I can get the ball"'],['Width','"Spread out wide"'],['Overlap','"Run past my friend on the outside"'],['Third player','"The one who comes into space"'],['Neutral','"A helper who plays for both"'],['Level with the ball','"Do not run ahead of the ball"']]]],
 why:'Second graders can now hold two team ideas at once: where the ball is and where a teammate will go. Small groups mean everyone is involved. Marked discs make spacing visible, and neutral players create a numbers-up game where success comes from passing and moving.',
 details:[
 {h:'Numbers up: 2 v 1 and 3 v 2',p:['In numbers-up games the attackers have one more player. The rule is simple: draw the defender and pass to the free player. Start with a passive defender and a big space, then add pressure.','The FIFA Training Centre once-a-week page shows a 3 v 3 plus two neutrals game that creates a 5 v 3 for the team with the ball; we use it as the main game of this chapter.'],pts:['Draw the defender','Pass to the free player','Passive then live defender','Rotate roles'],scene:'twovone'},
 {h:'Wall pass and overlap',p:['A wall pass (give and go) uses a teammate as a wall: pass, run past the defender and receive the return. An overlap runs around the outside of a teammate who has the ball. Both create a free player.','Walk the pattern first, then add speed and a defender.'],pts:['Pass, run, receive','Call overlap','Walk then run','Add a defender last'],scene:'giveandgo'},
 {h:'Width and angles',p:['Players spread to create space: one wide left, one wide right, one in the middle. Discs mark where the wide players stand. A support angle is a position where a teammate can pass without a defender in the way.','Use discs and mannequins to make the shapes visible.'],pts:['Spread to the discs','Stand at an angle to the ball','Mannequins show defenders','Switch sides'],scene:'spread'},
 {h:'3 v 3 and neutrals',p:['3 v 3 on a small field gives many touches. Two neutral players on the sides always join the team with the ball, so the attackers have numbers and the defenders must work together.','Rotate neutrals every two minutes so everyone plays every role.'],pts:['Neutrals play with the ball','Rotate every two minutes','Count passes','Praise movement'],scene:'funino'},
 {h:'Level with the ball (first step to offside)',p:['In European youth formats at ages 7 to 8 (FA 5 v 5, FFF 4 v 4, KNVB 6 v 6, DFB 3 v 3 and 5 v 5) offside is not applied. We therefore teach only the idea: do not run far ahead of the ball and stay level or behind when your team is attacking. The real Law 11 is explained in chapter 12.','This idea helps teams stay compact and prepares children for larger formats later.'],pts:['Idea only, not enforced','Stay level or behind','Use a line of cones','Explain in one sentence'],chart:'combo'}
 ],
 drills:[],
 faults:[['Dribbling into the defender','Habit','Cue: draw and pass'],['Standing behind the defender','Not moving to be an option','Cue: move to an angle'],['Everyone runs to the ball','Excitement','Use discs to show spreading'],['Overlap too early','Timing','Walk the pattern first'],['Running far ahead','Fear of missing a chance','Use a line of cones; explain level with the ball']],
 check:'Child finds the free player, plays a wall pass and an overlap, spreads to the discs and explains staying level with the ball.'
},
{
 n:9, title:'Scanning, Space and Decisions', short:'Scanning & Decisions',
 lead:'Seeing becomes a habit. Second graders scan before and after the ball arrives, name the free player and the open space, use if-then cues in games, take decisions under a light clock and answer questions that explain what they saw.',
 builds:[4,8], focus:{Technical:3,Physical:2,Psychological:5,Social:4},
 grew:{pre:'1st graders used the scan routine (look before, during, after), simple if-then cues, shape and colour games and answered a coach’s question.',k:'2nd graders scan before and after, name two options before the ball arrives, use cues in 3 v 3 and 5 v 5, decide under a short clock and explain a decision in a sentence.'},
 dev:'Attention span and working memory keep growing between 7 and 9, but planning is short term and self-evaluation is early (Jolles report for the KNVB). The FA’s decision-maker article says coaches develop decisions by training perception with technique, using varied, game-like practice and good questions. Soccer use: scanning games with few rules, fast restarts and questions that help children say what they saw.',
 basis:[['FA','Develop perception alongside technique; random and variable practice and playing forms; ask good questions.'],['JOLLES','Short-term planning and early self-evaluation before about age 10; give feedback in small steps.'],['DFB','The game is the teacher; keep the number of themes small.'],['FIFA','Do not over-coach: encourage creativity and freedom of expression to support decisions.']],
 game:'Count and Decide Game: 4 v 4 where the coach calls a number between 1 and 3; the team must decide to pass that many times before shooting.',
 objectives:['Scan before the ball arrives and again after the first touch','Name two options (free player and space) before receiving','Use an if-then cue to choose pass, dribble or shoot in a small game','Say in one sentence what you saw and why you chose it'],
 outcomes:['Peeks in 7 of 10 passes before the ball arrives','Names two options in 4 of 6 plays','Follows the cue in 4 of 6 decisions','Explains a decision in one sentence'],
 concepts:[['Coach term / child language',[['Scan','"Look around like a lighthouse"'],['Two options','"Pass or dribble?"'],['Cue','"If I see this, I do that"'],['Free player','"Who has no defender?"'],['Space','"Where is the empty grass?"'],['Clock','"Think before the whistle"'],['What I saw','"I saw… so I chose…"']]]],
 why:'Second graders are ready to look more than once and to hold two options in mind. Short clocks and cues add a little pressure so decisions become quick. Asking them to say what they saw builds the link between seeing and doing, and gives the coach clear insight into their thinking.',
 details:[
 {h:'Scan before and after',p:['A scan has two parts: look before the ball arrives and look again after the first touch. The aim is to make the head turn a habit. Coaches count visible head turns and share the count with the child, not the group.','Start with slow games and few defenders. Praise the peek, not the result.'],pts:['Look before the ball','Look again after the touch','Count head turns privately','Praise the peek'],scene:'scan'},
 {h:'Two options',p:['Before the ball arrives, the child names two options (for example “pass to blue or dribble to the space”). This keeps the plan simple and builds a habit of choosing. Cards or fingers held by the coach help.','Keep rounds short; ask one question at a pause.'],pts:['Name two options','Use a card or fingers','Keep rounds short','Ask one question'],scene:'fingers'},
 {h:'If-then cues',p:['Cues turn decisions into simple rules: if there is a free teammate, pass; if there is space ahead, dribble; if there is a clear view of goal, shoot. Children memorise two or three cues and use them in games. Cues are not strict; they help beginners until the habit forms.','Add new cues slowly, one per cycle.'],pts:['Two or three cues','Use them in games','Add one per cycle','Praise the right idea even if it failed'],scene:'colors'},
 {h:'Decisions under a clock',p:['A light clock (three seconds to pass, or a countdown) adds pressure. The coach calls numbers or colours and the team responds. This trains attention and self-control, which are developing at this age.','Keep the clock short and friendly; the aim is to practise, not to stress.'],pts:['Short, friendly clocks','Call a number or colour','Praise quick decisions','Never punish a slow one'],scene:'trafficlight'},
 {h:'Questions that teach',p:['Good questions help children say what they saw: Where was the free player? What did you see first? What could you try next? The FA suggests matching the question to the player and pairing it with feedback.','Give children a moment to answer, and accept short answers.'],pts:['Ask one question at a pause','Accept short answers','Pair with feedback','Praise good thinking'],chart:'scan'}
 ],
 drills:[],
 faults:[['Head never moves','Fear of missing the ball','Start slow; praise peeks'],['Names only one option','Habit','Ask for two options'],['Cues are ignored','Too many cues','Use two cues only'],['Panic under the clock','Clock too short','Lengthen the clock'],['One-word answers','Shyness','Ask smaller questions; let a friend help']],
 check:'Child peeks before the ball arrives, names two options, follows a cue and says what they saw.'
},
{
 n:10, title:'Team Shape, Roles and Transitions in 5 v 5', short:'Team Shape & 5 v 5',
 lead:'Team play moves to the 5 v 5 format used in many European youth leagues at this age. Second graders learn a simple shape (back, two sides, front), roles with bibs, a three-second transition, how to build from the keeper and how to restart with a plan.',
 builds:[1,8,9], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'1st graders played front, middle and back jobs in 4 v 4, switched within three seconds of losing the ball, planned restarts and played a ladder match day.',k:'2nd graders play 5 v 5 with a simple shape, bibbed roles, a three-second transition, build-up from the keeper and restarts as short plays; they also learn what the match-day format will look like.'},
 dev:'Seven- and eight-year-olds can hold a simple shape if it is explained as jobs and shown on the field. The FA lists 5 v 5 as the maximum format for U8 and U9, the DFB offers 5 v 5 with four mini-goals or two goals and a keeper, and the KNVB uses 6 v 6. Soccer use: teach shape through small, repeated games with bibs and discs, and keep the language simple.',
 basis:[['FA','5 v 5 is the maximum format for U8s and U9s; smaller formats can still be used.'],['DFB','5 v 5 with four mini-goals or with two goals and an optional keeper; no tables; coaches as game leaders.'],['KNVB','6 v 6 on 42.5 x 30 m with 5 x 2 m goals for O8 to O10; keeper area marked at 7 m.'],['FFF','4 v 4 with a keeper on 30 x 20 m for U8 and U9; no offside; rotations of 10 minutes.']],
 game:'5 v 5 Shape Game: bibs show back, left, right and front jobs; roles rotate every goal; two small goals and an optional keeper.',
 objectives:['Take a role (back, side, front) and say the job in one sentence','Keep a simple shape with discs and rotate roles after a goal','Transition from attack to defence in three seconds and back','Build from the keeper with a roll or a short pass and restart with a plan'],
 outcomes:['Names their role and the next job after a rotation','Spreads to the shape without reminders in 4 of 5 rounds','Reacts within three seconds to a change of possession','Plays a restart plan with one taker and two movers'],
 concepts:[['Coach term / child language',[['Shape','"A picture of where we stand"'],['Back','"The guard who stays behind"'],['Side','"The wide helpers"'],['Front','"The finisher who stays up"'],['Transition','"Switch fast"'],['Build-up','"Start with the keeper"'],['Restart plan','"One takes, two move"']]]],
 why:'A shape is a set of jobs on a map. Seven- and eight-year-olds learn it best through short games, marked discs and bibs. Rotating roles after every goal protects all children from being stuck in one job and builds the habit of helping.',
 details:[
 {h:'A simple shape',p:['A 5 v 5 shape for children is back (one), sides (two) and front (one) plus the keeper or a rotating goal child. Discs mark the positions at first. Children move as the ball moves, but the picture stays: someone behind, someone wide on each side, someone up.','The shape is taught as jobs, not positions: the back stays behind the ball, the sides give width, the front is the finisher.'],pts:['Back, sides, front','Use discs','Move with the ball','Rotate after a goal'],scene:'shapes'},
 {h:'Roles with bibs',p:['Bibs make roles visible and give the coach a quick way to rotate children. Children say their role before the whistle and swap after a goal. This protects every child from permanent positions and follows the DFB idea of broad education without early specialisation.','Coaches can also give a role a small challenge (for example “back: win the ball three times”).'],pts:['Bibs show the job','Rotate after a goal','Say the role aloud','Give small challenges'],scene:'shapes'},
 {h:'Transition in three seconds',p:['When the ball is lost, players react within three seconds: the nearest closes, the others get goal-side. When the ball is won, players spread and go. The coach calls “switch” in practice; children later call it themselves.','Keep it light; the goal is a habit of reacting.'],pts:['Three-second rule','Nearest player closes','Others get goal-side','Call “switch”'],scene:'transition'},
 {h:'Build from the keeper',p:['Building from the keeper means the goalkeeper (or the child in goal) starts with a roll or short pass to a teammate. The team spreads to receive. In the FFF format the keeper’s distribution zone is protected: opponents must stay out until a teammate has controlled the ball.','Use the same idea in practice with discs and a line.'],pts:['Roll or short pass','Spread to receive','Protected zone','Opponents wait'],scene:'gkthrow'},
 {h:'Restart plans and match days',p:['Throw-ins, corner kicks and goal kicks become small plays: one child takes, two move, one stays back. A match day uses short rounds on several fields. In the KNVB and FFF formats a rotation or round is about 10 minutes.','No table is kept; coaches record touches and shots for a few children.'],pts:['One takes, two move, one stays','Short rounds','Rotate teams','No table'],chart:'combo'}
 ],
 drills:[],
 faults:[['Everyone chases the ball','Excitement','Use discs and roles'],['Same child always in one role','Habit','Rotate after every goal'],['Slow reaction on a lost ball','Watching','Call “switch”'],['Keeper start is rushed','Pressure','Use a protected zone'],['Restarts are chaos','No plan','Practise one plan per cycle']],
 check:'Child names their role, keeps the shape, reacts within three seconds and takes part in a restart plan.'
},
{
 n:11, title:'Goalkeeper: Positioning, Handling and Distribution', short:'Goalkeeper',
 lead:'Goalkeeping becomes a skill for everyone. Second graders learn to stand on the line between ball and goal, handle low and chest-high shots, dive and recover, throw and roll with accuracy, understand the back-pass rule and the time limit.',
 builds:[2,4,6], focus:{Technical:4,Physical:3,Psychological:5,Social:3},
 grew:{pre:'1st graders took the ready position, caught with a W, dived from a crouch and rolled or threw to a teammate.',k:'2nd graders learn angle and position, catch higher balls, dive and recover on both sides, throw overarm and roll underarm to a target, and learn when the keeper may and may not use the hands.'},
 dev:'Children of 7 to 9 are braver when the ball is soft and the ground is soft, and they enjoy having a special job. The KNVB’s 6 v 6 rules keep a goalkeeper area at 7 m and forbid picking up a ball passed back with the foot; the FFF protects the keeper’s distribution inside 8 m and bans volleyed distribution. Soccer use: rotate keepers, use soft balls and soft ground, and teach the rules that protect the game.',
 basis:[['KNVB','Keeper area 7 m from the goal line; a keeper may not pick up a back pass played with the foot (warning, then indirect free kick); distribution from the ground.'],['FFF','Keeper’s distribution is protected inside 8 m; volleyed and half-volleyed distribution banned.'],['IFAB','From 2025/26 a keeper who controls the ball with the hands for more than eight seconds gives away a corner kick; the keeper cannot be challenged while controlling the ball.'],['DFB','In 5 v 5 a goalkeeper is optional and rotates.']],
 game:'Keeper Rotation Game: shooters try to score on a keeper who rotates every two minutes; keepers earn a point for a catch and a point for a good throw.',
 objectives:['Stand on the line between ball and goal and move to the ball’s side','Catch low and chest-high shots with the hands in a W','Dive to both sides from a crouch and get up quickly','Roll or throw to a target and explain when the hands may be used'],
 outcomes:['Stops 7 of 10 slow shots from 10 yards','Catches 5 of 10 chest-high balls','Dives to both sides and recovers in 3 of 5 tries','Rolls or throws to a target in 4 of 5 tries'],
 concepts:[['Coach term / child language',[['Angle','"Stand between ball and goal"'],['W hands','"Hands like a W"'],['Dive','"Fall to the side, hands first"'],['Distribution','"Roll or throw to a friend"'],['Back pass','"No hands after a foot pass back"'],['Eight seconds','"Do not hold it too long"'],['Keeper area','"My zone"']]]],
 why:'Every child should try the keeper role, and the rules that protect keepers and the game are best learned through play. Soft balls and soft ground reduce fear. Rotating the role means no child is stuck as the permanent keeper and everyone learns the rules.',
 details:[
 {h:'Position and angle',p:['The keeper stands between the ball and the goal and moves to the side the ball goes. A cone or hoop on the ground marks the best spot. Children learn by moving along a line (a rope or the goal line) in time with the ball.','Short, quick steps keep balance; the keeper stays on the toes.'],pts:['Between ball and goal','Move along a line','Small quick steps','Hands up and ready'],scene:'setpos'},
 {h:'Handling',p:['Catches use a W shape for chest-high balls and a scoop for low balls. The keeper watches the ball into the hands and brings it to the chest. Practise with soft balls first and add pace slowly.','Good handling is trust: praise catches and brave tries equally.'],pts:['W for chest-high','Scoop for low','Watch the ball into the hands','Soft balls first'],scene:'keeper'},
 {h:'Dive and recover',p:['A dive starts from a crouch and falls to the side with hands first. Soft ground or mats are used. After the dive the keeper stands quickly. Both sides are practised.','Never force a dive; kneeling falls are fine for beginners.'],pts:['Start from a crouch','Hands first','Soft ground','Get up quickly'],scene:'dive'},
 {h:'Distribution',p:['Rolling underarm and throwing overarm to a target are the main ways to start an attack. Targets are cones or hoops. The FFF protects distribution inside 8 m and bans volleyed distribution; the KNVB takes distribution from the ground.','Praise accuracy and speed of the second action.'],pts:['Roll underarm','Throw overarm','Hit the target','Start the attack fast'],scene:'gkthrow'},
 {h:'Rules that protect the keeper',p:['Under the IFAB laws a keeper who controls the ball with the hands for more than eight seconds gives away a corner (from 2025/26) and cannot be challenged while controlling it. Many youth formats also forbid picking up a ball passed back with the foot. Teach these rules in games, then check the rule of your league.','Keeping the rules simple helps the keeper and the team.'],pts:['No hands after a foot pass back','Do not hold more than eight seconds','Check your league','Practise in games'],chart:'gk'}
 ],
 drills:[],
 faults:[['Keeper stands on the line and does not move','Fear','Use a rope line and move with the ball'],['Ball slips through the hands','Hands apart','W shape and watch the ball'],['Dive is stiff','Fear or hard ground','Soft ground; start kneeling'],['Throws go wide','No target','Use a cone or hoop'],['Same child always keeper','Habit','Rotate by timer']],
 check:'Child stands between ball and goal, catches with a W, dives from a crouch and rolls or throws to a target.'
},
{
 n:12, title:'Rules of the Game and Restarts', short:'Rules & Restarts',
 lead:'Second graders meet the real laws through play: throw-in, goal kick, corner kick, fouls and free kicks, handball, offside as an idea and the referee signals. Each rule is taught inside a game where breaking it has a fair, simple consequence.',
 builds:[1,7,10], focus:{Technical:2,Physical:2,Psychological:4,Social:5},
 grew:{pre:'1st graders learned restarts (kick-in or throw-in), free kicks for hands, push or trip and acted as game leaders; offside and advanced fouls were not taught.',k:'2nd graders learn the throw-in technique, goal kick, corner kick, direct and indirect free kicks, handball, advantage and the idea of staying level with the ball, using the laws of the game as the main reference.'},
 dev:'Seven- and eight-year-olds can follow a rule they understand and can use simple consequences, but they cannot hold long rule lists or read complex situations (Jolles report for the KNVB). European youth formats at this age use no offside and often simplify restarts: the KNVB uses a dribble-in instead of a throw-in at O8 to O10, the FFF uses a pass or dribble, and the DFB lets children restart with a dribble or a pass. Soccer use: teach one rule at a time, in a game, and say clearly which version your league uses.',
 basis:[['IFAB','Laws 11 (offside), 12 (fouls and free kicks), 15 (throw-in), 16 (goal kick), 17 (corner kick), and the 2025/26 changes.'],['KNVB','6 v 6 rules: dribble-in instead of throw-in, corners by dribble or pass, free kick distance 5 m, no offside noted for 8 v 8.'],['FFF','4 v 4 rules: throw-in by pass or dribble, free kick distance 4 m, no offside, tackles forbidden.'],['DFB','Children restart out-balls with a dribble or pass; coaches act as game leaders.']],
 game:'Whistle and Signal Game: 5 v 5 with a child helper referee who shows the signal for each restart; the coach adds one rule per level.',
 objectives:['Take a legal throw-in with both hands over the head and both feet on or behind the line','Know a goal kick, a corner kick and a free kick and who takes each','Explain the difference between a direct and an indirect free kick in simple words','Understand handball, advantage, the offside idea and the referee signals'],
 outcomes:['Takes a legal throw-in in 6 of 8 tries','Says who takes a goal kick, corner and free kick in 3 of 3 cases','Explains a foul and a free kick in one sentence','Shows three referee signals'],
 concepts:[['Coach term / child language',[['Throw-in','"Both hands, over the head"'],['Goal kick','"My team kicks from our goal"'],['Corner kick','"They kicked it out over our goal line"'],['Free kick','"A foul, play restarts"'],['Handball','"Hands off the ball"'],['Advantage','"The play goes on"'],['Level with the ball','"First idea of offside"']]]],
 why:'Rules make the game fair. Second graders enjoy knowing the real rules and are ready to try the signals. Teaching one rule per game, with a simple consequence, helps them remember and builds respect for the referee. Seeing which rules their league uses avoids confusion.',
 details:[
 {h:'Throw-in',p:['The IFAB law says the thrower faces the field, has part of each foot on or behind the touchline, and throws with both hands from behind and over the head. A goal cannot be scored directly from a throw-in. Opponents stand at least 2 m away. Practise the technique with soft balls.','Check whether your league uses a dribble-in or pass-in instead.'],pts:['Both hands, over the head','Feet on or behind the line','No direct goal','Check your league'],scene:'throwin'},
 {h:'Goal kick and corner kick',p:['A goal kick is awarded when the attackers put the ball over the goal line; the defenders kick it from inside the goal area. A corner kick is awarded when the defenders put the ball over their own goal line; the attackers kick from the corner. Opponents stay 9.15 m (10 yards) from the corner arc in the full laws; many youth formats use less.','Use cones to mark the areas and let children decide whose kick it is.'],pts:['Who last touched?','Mark the areas','Opponents give space','Check your league'],scene:'matchday'},
 {h:'Fouls and free kicks',p:['A direct free kick is given for careless, reckless or excessive fouls such as pushing, tripping, kicking, holding and handball. An indirect free kick covers dangerous play, impeding without contact and dissent. Opponents stay back at the free kick distance (9.15 m in the laws; 4 m in the FFF format and 5 m in the KNVB format).','Explain it as “a foul means a free kick for the other team.” The direct and indirect difference is a later idea.'],pts:['Play the ball, not the player','Free kick for the other team','Opponents give space','Say sorry and play on'],scene:'refsignals'},
 {h:'Handball and advantage',p:['Handball is a deliberate touch with the hand or arm, or touching it when the arm makes the body unnaturally bigger. Advantage means the referee lets play go on when stopping it would help the fouling team. The referee signals advantage with a sweep forward.','Practise both in short games where the helper referee shows the signal.'],pts:['Hands off the ball','Advantage: play on','Helper referee signals','Praise honest calls'],scene:'refsignals'},
 {h:'Offside as an idea',p:['Law 11 says a player is in an offside position if any part of the head, body or feet is in the opponents’ half and nearer to the goal line than both the ball and the second-last opponent; it is an offence only when involved in play, and there is no offside from a goal kick, throw-in or corner kick. European formats at ages 7 to 8 apply no offside, so we teach only the idea: stay level with or behind the ball when your team is attacking.','We introduce the line and the language in level 5 and 6 without enforcing it.'],pts:['Idea only, not enforced','Stay level or behind','Use a line of cones','Explain Law 11 simply'],chart:'duel'}
 ],
 drills:[],
 faults:[['Throw-in with one hand','Habit','Show the two-hand shape; use a soft ball'],['Wrong team restarts','Unsure who touched last','Say “who last touched it?”'],['Free kick taken too close','Excitement','Place a cone at the distance'],['Handball argued','Unclear rule','Replay and explain deliberate touch'],['Offside idea confuses','Too abstract','Use a line of cones and move with the ball']],
 check:'Child takes a legal throw-in, says who takes a goal kick, corner and free kick, explains a foul and shows three referee signals.'
}
];

["Helper Referee Rounds",15,"3 v 3","25 x 20 yd","Bibs, small goals, signal cards","A helper referee stands at the side with signal cards and shows the signal for each restart. The helper changes every two minutes. The coach only helps if both teams ask.","Show, say, play on","Helper adds the advantage signal","Helper is shy: pair two helpers",2,"g","smallgame","Bibs","Advantage"],

["Role Swap Rush",15,"4 v 4","30 x 20 yd","Bibs, small goals, whistle","Each child has a role bib. On the coach whistle all bibs swap one place. The captain calls the swap in the next round. Scoring continues after each swap.","Swap fast, find your job","The captain decides when to swap","Forgetting the new job: say it aloud",4,"g","smallgame","Bibs","Kick-off and restarts"],

["Team Plan Huddle",12,"Groups of 5","25 x 20 yd","Bibs, goals","The group has 60 seconds in a huddle to plan an attack with three jobs. They then try the plan against passive defenders and report what worked.","Plan, try, tell","Add a second plan to choose from","Planning too long: set a timer",5,"s","funino","Bibs",""],

// Merge the 2nd-grade exercises into the chapters. Drill tuple: [name,min,players,area,equipment,organisation,focus,progression,watch,level,kind,tool,rule]
window.RULETXT={
 'Kick-off and restarts':'Rule in play: every goal is followed by a kick-off from the center; the team that conceded starts, and the ball must move forward or sideways, not back to the taker.',
 'Referee signals':'Rule in play: the leader shows the signal for the call (goal, throw-in, goal kick, corner, free kick) and everyone points the right way before restarting.',
 'Advantage':'Rule in play: if a foul happens but the fouled team still has the ball in a good spot, the leader calls "advantage" and play goes on.',
 'Fouls and free kicks':'Rule in play: pushing, tripping and holding are fouls. The other team gets a free kick from the spot, and the opponents stand back about 5 yards.',
 'Handball and advantage':'Rule in play: no hands on purpose (the keeper may use hands in the own area). A deliberate handball gives a free kick; play on if the team keeps the advantage.',
 'Throw-in':'Rule in play: when the ball crosses the side line, the other team throws in with both feet on or behind the line and both hands behind the head.',
 'Goal kick':'Rule in play: when the attackers send the ball over the end line outside the goal, the defending team restarts with a goal kick from the goal area; the ball is in play once it moves.',
 'Corner kick':'Rule in play: when the defenders send the ball over their own end line, the attackers restart from the corner arc, and the ball must be at rest in the arc.',
 'Offside idea':'Rule idea (practice only, not enforced at this age): an attacker should not wait behind the last defender. Use a marked line so players feel the idea and learn to time the run.'
};

 });

<script>
(function(){

}
const evP=s=>SCH.find(e=>e.kind==='p'&&e.s===s);
const evF=(k,day)=>SCH.find(e=>e.kind==='f'&&e.k===k&&e.day===day);

 dribble:['Planning target: poles cleared with no stray touch','poles',[8,8,9,10,10,10],'Ten poles, 1 yard apart, steady pace, both feet.'],

 const open=e.kind==='p'?`#/session/${e.s}`:`#/festival/${e.k}/${e.day}`;

 n=Math.min(Math.max(1,n),N);const c=CH[n-1];if(!CTABS.some(t=>t[0]===tab))tab='preview';

 }else if(tab==='concepts'){

 }else if(tab==='notes'){
  const i=Math.min(Math.max(0,idx),c.details.length-1),d=c.details[i];
  const vis=d.scene?window.renderScene(d.scene,nid()):d.chart?chartHTML(d.chart):'';

  body=`<div class="drillpage"><div class="dlist">${lst}</div><article class="drill"><header><h3>${d[0]}</h3><div class="meta">${d[9]?`<span>Level ${d[9]}</span><span>${d[10]==='g'?'Game':'Skill exercise'}</span>`:''}<span>${d[1]} min</span><span>${d[2]}</span><span>${d[3]}</span><span>${d[4]}</span>${d[11]?`<span class="tl">Tool: ${d[11]}</span>`:''}${d[12]?`<span class="tl">Rule: ${d[12]}</span>`:''}</div></header>${ds?window.renderScene(ds[0],nid(),ds[1]):''}<dl><div><dt>Organisation</dt><dd>${d[5]}</dd></div><div><dt>Coaching points</dt><dd>${d[6]}</dd></div><div><dt>Progression</dt><dd>${d[7]}</dd></div>${d[11]?`<div><dt>New tool</dt><dd>${d[11]} (shown in the animation). <a href="#/g/tools">Tools page</a></dd></div>`:''}${d[12]?`<div><dt>Rule</dt><dd>${d[12]}. <a href="#/g/rules">Rules page</a></dd></div>`:''}<div><dt>Common issue</dt><dd>${d[8]}</dd></div></dl></article></div><p class="check"><b>Check for learning.</b> ${c.check}</p>`;
 }
