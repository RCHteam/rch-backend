 7:['Duel to the goal','Attacker shoots at a small goal; defender starts a step behind.'],
 8:['Pure 1 v 1','Fake and beat the defender; defender stays goal-side and pokes the ball away.'],
 9:['Fair-play duel','No hands, shake hands after each duel, say "good game".'],
 10:['Team duel','Each win scores a point for the team; the team spreads out around the grids.'],
 11:['Duel with a keeper','Attacker shoots; the defender plays goalkeeper when the shot comes.']
};
const DUELPROG=['Defender is passive (walks) and the attacker succeeds often.','Defender jogs and may poke the ball away.','Defender is active but no contact; short 30-second duels.','Real 1 v 1; keep score by gate or goal.','First to three points; winners move to the next grid.','Ladder: winners move up, losers move down; players run the rotation.'];
const LVLTXT=l=>LEVELS[l-1][0]+': '+LEVELS[l-1][1];
// ---- slots ----
const TEACH=66, WEEKS=40;
function slot(s){const week=Math.ceil(s/2)+Math.floor((s-1)/22);const day=s%2?'Tuesday':'Thursday';const ch=(s-1)%N+1;const level=Math.floor((s-1)/N)+1;return {s,week,day,ch,level};}
const FEST=[{k:1,week:12},{k:2,week:24},{k:3,week:36}];
function prevOf(ch,level){return ch===1?{ch:N,level:Math.max(1,level-1)}:{ch:ch-1,level};}
function ref(n,i){const a=(window.DSCENE||{})[n];return a&&a[i]?[a[i][0],a[i][1]]:null;}
function drillBlock(c,i,level,time,label){
 const d=c.drills[i];
 return {min:time||15,name:label+': '+d[0],how:d[5]+' Setup: '+d[3]+', '+d[2]+'. Equipment: '+d[4]+'.',focus:d[6],prog:level===1?'Start simple: slow pace and a big space.':d[7]+' (Level focus: '+LEVELS[level-1][1]+')',watch:d[8],scene:ref(c.n,i)};
}
function session(s){
 const o=slot(s),c=CH[o.ch-1],l=o.level,r=(l-1)%3;
 const pr=prevOf(o.ch,l),pc=CH[pr.ch-1];
 const skillA=[0,1,2][r], skillB=[1,2,0][r];
 const blocks=[];
 blocks.push({min:5,name:'Arrival and circle',how:'Greet each child by name, quick team chant, check shin guards and water. Tell the group the one idea for today: '+c.objectives[0].toLowerCase()+'.',focus:'Belonging and clarity',prog:'',watch:'Late arrivals: let them join the run start',scene:['circle','Circle up, greet, share the idea of the day.']});
 blocks.push({min:10,short:LAPS[l-1].replace(/\.$/,'')+'. Then 2 min dynamic moves.',name:'Run start: laps around the field',how:'Always start by running around the field. '+LAPS[l-1]+' Finish with 2 min dynamic moves: high knees, heel flicks, side shuffles, bunny hops.',focus:'Raise the heart rate; tall posture, bent arms, light feet',prog:'Level '+l+' running: '+LAPS[l-1],watch:'Children tire at different rates: allow walking. Never use running as punishment.',scene:['laps','Everyone runs around the field.']});
 blocks.push({min:5,name:'Water and one idea',how:'Water break. Then demonstrate today\'s skill for two minutes and give one cue. Key words: '+c.concepts[0][1].map(k=>k[0]).slice(0,3).join(', ')+'.',focus:'One idea, one cue',prog:'',watch:'Keep the talk to two minutes',scene:null});
 blocks.push(drillBlock(c,skillA,l,15,'Skill play 1'));
 blocks.push(drillBlock(c,skillB,l,10,'Skill play 2'));
 const g=drillBlock(c,3,l,10,'Game');g.how=g.how+' Water at the halfway point. Today\'s level target: '+LT[o.ch][l-1]+'.';blocks.push(g);
 const du=DUEL[o.ch];
 blocks.push({min:10,name:'1 v 1 finale: '+du[0],how:'Every practice ends with 1 v 1. Pairs of similar size duel in small grids (about 8 x 5 yards) with a gate or small goal. Rotate opponents every 2 minutes. Chapter twist: '+du[1],focus:'Compete bravely and kindly; try today\'s skill under duel conditions',prog:DUELPROG[l-1],watch:'Match pairs by size and confidence. No sliding, grabbing or pushing. Keep score light and praise effort.',scene:["duel",du[0]+'. '+du[1]]});
 const rd=pc.drills[0];
 blocks.push({min:10,name:'Review and close',how:'5 min review of Chapter '+pc.n+' ('+pc.short+') at level '+pr.level+': '+rd[0]+'. '+rd[5]+' Then 5 min closing circle: ask what they learned, praise effort, team chant, remind the group when the next practice is.',focus:'Spiral review and praise',prog:'',watch:'Keep the review light and playful',scene:ref(pc.n,0)});
 let t=0;blocks.forEach(b=>{b.t=t+'-'+(t+b.min);t+=b.min;});
 const eq=[...new Set(blocks.slice(3,6).map(b=>(b.how.match(/Equipment: ([^.]*)\./)||[])[1]).concat([(rd[4])]).filter(Boolean).join(', ').split(',').map(x=>x.trim().toLowerCase()).filter(x=>x&&x!=='none'))].join(', ')||'balls and cones';
 return {...o,chapter:c,target:LT[o.ch][l-1],levelName:LVLTXT(l),blocks,equip:eq,check:'Check: '+c.check,total:t,prev:pc};
}
function festival(k,day){
 const w=FEST[k-1].week,term=k;
 const blocks=[];
 const run=(min)=>({min,name:'Run start: laps around the field',how:'Always start by running around the field: 4 easy laps together, then 2 min dynamic moves.',focus:'Enthusiasm and teamwork',prog:'',watch:'Let slower runners walk the corners',scene:['laps','Everyone runs around the field.']});
 if(day==='Tuesday'){
  blocks.push({min:5,name:'Arrival and circle',how:'Greet by name. Explain that today is about showing what we can do, not a test.',focus:'Calm and welcome',prog:'',watch:'Nervous children: pair with a buddy',scene:['circle','Circle up and greet.']});
  blocks.push({...run(10)});
  blocks.push({min:5,name:'Water and instructions',how:'Water break. Explain the stations and how groups rotate.',focus:'Clarity',prog:'',watch:'',scene:null});
  const half=Math.ceil(N/2);
  blocks.push({min:25,name:'Assessment stations A (chapters 1 to '+half+')',how:'One station per chapter, groups of 3 or 4, about 4 minutes each. A coach observes and ticks the sheet. Keep it as a game.',focus:'Observe, do not correct',prog:'',watch:'Do not rank children',scene:['stations','Groups rotate between stations on the whistle.'],list:CH.slice(0,half).map(c=>c.n+'. '+c.short+': '+c.check)});
  blocks.push({min:20,name:'Assessment stations B (chapters '+(half+1)+' to '+N+')',how:'Continue the rotation through the remaining stations.',focus:'Observe, do not correct',prog:'',watch:'Allow a retry; this is a snapshot, not a verdict',scene:['stations','Groups rotate between stations on the whistle.'],list:CH.slice(half).map(c=>c.n+'. '+c.short+': '+c.check)});
  blocks.push({min:10,name:'Close',how:'Circle, praise effort, thank the children, say what next week holds.',focus:'Positive finish',prog:'',watch:'',scene:null});
 } else {
  blocks.push({min:5,name:'Arrival and circle',how:'Greet children and families. Quick team chant.',focus:'Belonging',prog:'',watch:'',scene:['circle','Circle up and chant.']});
  blocks.push({...run(10)});
  blocks.push({min:5,name:'Water',how:'Water break and short explanation of the games.',focus:'Rest',prog:'',watch:'',scene:null});
  blocks.push({min:30,name:'Festival games',how:'Short 3 v 3 and 4 v 4 games on small fields, rotating teams every 6 minutes. No scores are kept.',focus:'Effort and fun',prog:'',watch:'Over-excited adults: remind them to cheer for everyone',scene:['smallgame','Mini games, rotating teams.']});
  blocks.push({min:15,name:'Parent and child game',how:'Parents join in simple games with their child: toe taps, pass the treasure, and a scoring game.',focus:'Pride and connection',prog:'',watch:'Parents: encourage, do not coach',scene:['pairs','Parent and child pass.']});
  blocks.push({min:10,name:'Awards and snack',how:'Give every child a certificate for something they did well. Team chant, then a shared snack.',focus:'Celebration',prog:'',watch:'Every child gets praise',scene:['circle','Team circle.']});
 }
 let t=0;blocks.forEach(b=>{b.t=t+'-'+(t+b.min);t+=b.min;});
 return {s:'F'+k,festival:true,k,week:w,day,total:t,blocks,equip:'Cones, balls, bibs, assessment sheets, whistle, certificates',check:'Check: record Yes, Almost or Not yet for each skill.',chapter:null,term};
}
function toText(p){
 const head=p.festival?`Festival ${p.k}, week ${p.week}, ${p.day}`:`Session ${p.s}, week ${p.week}, ${p.day}. Chapter ${p.ch}: ${p.chapter.title}. Level ${p.level} (${p.levelName}). Target: ${p.target}`;
 let s=head+'\n\nEquipment: '+p.equip+'\n\n';
 p.blocks.forEach(b=>{s+=b.t+' min  '+b.name+'\n  '+b.how+'\n  Focus: '+b.focus+(b.prog?'\n  Progression: '+b.prog:'')+(b.watch?'\n  Watch for: '+b.watch:'')+'\n';});
 return s+'\n'+p.check;
}
window.PLAN={LEVELS,LT,LAPS,DUEL,DUELPROG,TEACH,WEEKS,FEST,slot,session,festival,toText,N};
})();
</script>
<script>
(function(){
const CH=window.CHAPTERS, PL=window.PLAN, N=CH.length, LV=PL.LEVELS, LT=PL.LT;
const $=s=>document.querySelector(s);
const CORNERS=['Technical','Physical','Psychological','Social'];
let uid=0;const nid=()=>'x'+(++uid);

/* ---------- settings + schedule ---------- */
const DEF_START='2026-10-13';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const getStart=()=>lsGet('rch-start',DEF_START), getFirst=()=>Math.min(N,Math.max(1,+lsGet('rch-first',2)||2));
const getSkip=()=>{try{return JSON.parse(lsGet('rch-skip','[]'));}catch(e){return [];}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseD=s=>new Date(s+'T12:00:00');
let SCH=[];
function buildSchedule(){
 const first=getFirst(),skip=new Set(getSkip()),seq=[];
 for(let s=first;s<=PL.TEACH;s++){seq.push({kind:'p',s});if(s%22===0){const k=s/22;seq.push({kind:'f',k,day:'Tuesday'},{kind:'f',k,day:'Thursday'});}}
 const st=parseD(getStart());let d=new Date(st),i=0,g=0;const out=[];
 while(i<seq.length&&g++<900){const wd=d.getDay();if((wd===2||wd===4)&&!skip.has(iso(d))){out.push({...seq[i],date:new Date(d),iso:iso(d)});i++;}d.setDate(d.getDate()+1);}
 out.forEach(e=>{e.week=Math.floor((e.date-st)/(7*864e5))+1;e.dayName=e.date.toLocaleDateString('en-US',{weekday:'long'});e.dstr=e.date.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});});
 SCH=out;
}
const evP=s=>SCH.find(e=>e.kind==='p'&&e.s===s);
const evF=(k,day)=>SCH.find(e=>e.kind==='f'&&e.k===k&&e.day===day);
const chOf=e=>e.kind==='p'?CH[PL.slot(e.s).ch-1]:null;
const evColor=e=>e.kind==='p'?`hsl(${(PL.slot(e.s).ch-1)*33+8} 52% 38%)`:'hsl(34 88% 38%)';
const evTitle=e=>e.kind==='p'?`Ch ${chOf(e).n} ${chOf(e).short}`:(e.day==='Tuesday'?'Festival '+e.k+': assessment':'Festival '+e.k+': games');
const evLevel=e=>e.kind==='p'?PL.slot(e.s).level:0;

/* ---------- charts ---------- */
const CHARTS={
 balance:['Planning target: single-leg balance','seconds',[2,3,3,4,5,5],'Illustrative targets for tracking a child against their own earlier results. Not age norms.'],
 touches:['Planning target: touches in 30 seconds','touches',[10,16,22,28,34,40],'Use for self-comparison only. Do not rank children.'],
 dribble:['Planning target: cones cleared with no stray touch','cones',[1,2,3,4,5,5],'Five-cone zigzag, 1 yard apart.'],
 control:['Planning target: rolled balls controlled out of 10','of 10',[2,4,5,6,7,8],'Slow roll from 5 yards, controlled within one step.'],
 pass:['Planning target: accurate partner passes out of 10','of 10',[2,4,5,6,7,8],'Partner 5 yards away, inside-foot pass.'],
 shoot:['Planning target: shots on target out of 10','of 10',[1,2,3,4,5,6],'Large goal at 8 yards, still ball, either foot.'],
 session:['Planning target: minutes of actual playing time','min',[40,44,48,52,54,56],'Out of a 75-minute practice; most of it should be play.']
};
function chartHTML(key){
 const c=CHARTS[key];if(!c)return '';
 const labels=['L1','L2','L3','L4','L5','L6'],vals=c[2];
 const W=520,H=210,L=40,B=30,T=14,R=10,max=Math.ceil(Math.max(...vals)*1.15/2)*2;
 const bw=(W-L-R)/vals.length,y=v=>T+(H-T-B)*(1-v/max);let s='';
 for(let g=0;g<=4;g++){const v=max/4*g;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`;}
 vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,last=i===vals.length-1;
  s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" class="bar${last?' hi':''}" style="--d:${i*70}ms"/><text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" class="val${last?' hi':''}">${v}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="ax">${labels[i]}</text>`;});
 return `<figure class="chart in"><div class="ct">${c[0]}<span> (${c[1]})</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c[0]}">${s}</svg><figcaption>${c[3]}</figcaption></figure>`;
}

/* ---------- small helpers ---------- */
const head=(eyebrow,title,lead,extra)=>`<header class="ph"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}${extra||''}</div></header>`;
const tabsHTML=(items,active,base)=>`<nav class="tabs" role="tablist">${items.map(t=>`<a role="tab" href="${base}/${t[0]}" aria-selected="${t[0]===active}">${t[1]}</a>`).join('')}</nav>`;
const ul=a=>`<ul class="pts">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const tbl=(head,rows,cls='grid-t')=>`<div class="tablewrap"><table class="${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const sessionNo=(ch,level)=>(level-1)*N+ch;

/* ---------- overview ---------- */
function overview(){
 buildSchedule();
 const t=iso(new Date()),nx=SCH.find(e=>e.iso>=t),nxt=nx?`<div class="next"><span class="eyebrow">Next practice</span><b>${nx.dstr}</b><span>${evTitle(nx)}${nx.kind==='p'?', Level '+evLevel(nx):''}</span><a class="btn pri" href="${nx.kind==='p'?'#/session/'+nx.s:'#/festival/'+nx.k+'/'+nx.day}">Open</a></div>`:'';
 return nxt+`<div class="hero"><div><div class="eyebrow">RCH Elite Training · Pre-K and Kindergarten</div><h1>Foundations of the Game</h1><p>Eleven chapters taught in rotation, starting now at chapter 2. Every Tuesday and Thursday practice moves one chapter forward by a small step. After all eleven, the cycle returns to chapter 1 at a higher level.</p><div class="stats"><div><b>11</b>chapters</div><div><b>6</b>levels</div><div><b>66</b>practices</div><div><b>75</b>min each</div></div></div><div id="hero-scene">${window.renderScene('triangle',nid())}</div></div>
 <div class="cols3"><div class="card"><h4>Always start by running</h4><p>Every practice opens with running around the field and ends with 1 v 1.</p></div><div class="card"><h4>Mixed, not blocked</h4><p>No month of only dribbling. Each practice teaches one chapter, and the next practice teaches the next chapter.</p></div><div class="card"><h4>Six passes through the book</h4><p>Level 1 introduces each chapter. Levels 2 to 6 repeat it with more speed, less space, pressure and game play.</p></div></div>
 <div class="rhythm"><h4>The cycle</h4><div class="cyc" aria-label="Chapter rotation">${CH.map(c=>`<a href="#/ch/${c.n}" title="${c.title}"><b>${c.n}</b><span>${c.short}</span></a>`).join('')}<i class="loop">back to 1, one level higher</i></div></div>`;
}

/* ---------- calendar ---------- */
let CAL=null;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function initCal(){
 const t=new Date();const f=SCH[0]?SCH[0].date:t,l=SCH.length?SCH[SCH.length-1].date:t;
 const ref=(t>=f&&t<=l)?t:f;
 CAL={y:ref.getFullYear(),m:ref.getMonth(),view:'month',sel:null,panel:null};
}
function chip(e,idx){const o=e.kind==='p'?`Ch ${chOf(e).n} ${chOf(e).short}`:evTitle(e);return `<button type="button" class="ev${CAL.sel===idx?' on':''}" data-act="ev" data-k="${idx}" style="--c:${evColor(e)}" title="${o}"><b>${o}</b>${e.kind==='p'?`<small>Level ${evLevel(e)}</small>`:''}</button>`;}
function monthGrid(){
 const {y,m}=CAL,first=new Date(y,m,1),off=first.getDay(),days=new Date(y,m+1,0).getDate(),rows=Math.ceil((off+days)/7);
 const skip=new Set(getSkip()),today=iso(new Date());
 let h='<div class="mg"><div class="mh">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<span>${d}</span>`).join('')+'</div>';
 for(let r=0;r<rows;r++){h+='<div class="mr">';for(let c=0;c<7;c++){
  const d=new Date(y,m,r*7+c-off+1),k=iso(d),oth=d.getMonth()!==m;
  const evs=SCH.map((e,i)=>e.iso===k?chip(e,i):'').join('');
  const ei=SCH.findIndex(e=>e.iso===k);h+=`<div class="mc${oth?' oth':''}${k===today?' today':''}${skip.has(k)?' skipped':''}${ei>=0?' has':''}"${ei>=0?` data-act="ev" data-k="${ei}"`:''}><span class="dnum">${d.getDate()===1?MONTHS[d.getMonth()].slice(0,3)+' ':''}${d.getDate()}</span>${evs}${skip.has(k)?`<button type="button" class="nop" data-act="unskip" data-iso="${k}">No practice (restore)</button>`:''}</div>`;}
  h+='</div>';}
 return h+'</div>';
}
function agenda(){
 let h='<div class="ag">',last='';const today=iso(new Date());
 SCH.forEach((e,i)=>{const mk=e.date.getFullYear()+'-'+e.date.getMonth();if(mk!==last){last=mk;h+=`<h4 class="agm">${MONTHS[e.date.getMonth()]} ${e.date.getFullYear()}</h4>`;}
  h+=`<button type="button" class="agr${e.iso<today?' past':''}${CAL.sel===i?' on':''}" data-act="ev" data-k="${i}" style="--c:${evColor(e)}"><span class="agd">${e.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span class="agc"><i></i><b>${evTitle(e)}</b>${e.kind==='p'?`<small>Level ${evLevel(e)} ${LV[evLevel(e)-1][0]} · ${LT[chOf(e).n][evLevel(e)-1]}</small>`:''}</span></button>`;});
 return h+'</div>';
}
function calMain(){
 const title=CAL.view==='month'?`${MONTHS[CAL.m]} ${CAL.y}`:'All practices';
 return `<div class="ctb"><button type="button" class="btn" data-act="today">Today</button>${CAL.view==='month'?'<button type="button" class="btn sq" data-act="prev" aria-label="Previous month">&lsaquo;</button><button type="button" class="btn sq" data-act="next" aria-label="Next month">&rsaquo;</button>':''}<h3>${title}</h3><button type="button" class="btn" data-act="settings">Settings</button><div class="vsw"><button type="button" class="btn${CAL.view==='month'?' on':''}" data-act="vm">Month</button><button type="button" class="btn${CAL.view==='agenda'?' on':''}" data-act="va">Agenda</button></div></div>${CAL.view==='month'?monthGrid():agenda()}`;
}
function legend(){return `<div class="leg2">${CH.map(c=>`<a href="#/ch/${c.n}"><i style="background:hsl(${(c.n-1)*33+8} 52% 38%)"></i>${c.n}. ${c.short}</a>`).join('')}<a href="#/festival/1"><i style="background:hsl(34 88% 38%)"></i>Festival weeks</a></div>`;}
function settingsPanel(){
 const skip=getSkip();
 return `<div class="dp"><h4>Schedule settings</h4><label for="startd">First practice date</label><input type="date" id="startd" value="${getStart()}"><label for="firstch">Currently on chapter</label><select id="firstch">${CH.map(c=>`<option value="${c.n}"${c.n===getFirst()?' selected':''}>${c.n}. ${c.title}</option>`).join('')}</select><p class="note">Practices run on Tuesdays and Thursdays. The group already knows the field, so the cycle starts at chapter ${getFirst()}; earlier chapters return at the next level.</p>${skip.length?`<h4 class="sp">Skipped days</h4><ul class="skl">${skip.sort().map(d=>`<li>${parseD(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} <button type="button" class="lnk" data-act="unskip" data-iso="${d}">restore</button></li>`).join('')}</ul>`:''}<h4 class="sp">Legend</h4>${legend()}</div>`;
}
const REM=[['Run start','Always start by running around the field, then dynamic moves.','run'],['75-minute practice','Water at minute 15 and mid-game. Always finish with 1 v 1. A ball for everyone in half the practice.','structure'],['Psychology','Praise effort, not talent. Offer small choices. One-sentence instructions.','psych'],['Safety','Check field and goals. Allow walking breaks. No heading. Watch heat and hydration.','safety']];
const firstSent=t=>t.split(/(?<=\.)\s/)[0];
function dayCard(e){
 const col=evColor(e),p=e.kind==='p'?PL.session(e.s):PL.festival(e.k,e.day),l=e.kind==='p'?p.level:0;
 const blocks=p.blocks.filter(b=>b.name.indexOf('Arrival')!==0);
 const head=e.kind==='p'?`<span class="eyebrow">Practice ${e.s} of ${PL.TEACH} · Week ${e.week} · 75 min</span><h3>Chapter ${p.ch}: ${p.chapter.title}</h3><p class="dsub">${e.dstr}</p><p class="lvl"><b>Level ${l}, ${LV[l-1][0]}.</b> Target: ${p.target}.</p>`:`<span class="eyebrow">Festival ${e.k} · Week ${e.week} · 75 min</span><h3>${e.day==='Tuesday'?'Assessment stations':'Festival games'}</h3><p class="dsub">${e.dstr}</p>`;
 const rem=`<div class="rems">${REM.map(r=>`<a href="#/g/${r[2]}" class="rem"><b>${r[0]}</b><span>${r[1]}</span></a>`).join('')}</div>`;
 const bl=blocks.map(b=>{const sid=nid();return `<section class="dcb"><div class="dch"><span class="bt2">${b.t} min</span><h4>${b.name}</h4></div><p>${b.short||firstSent(b.how)}</p>${b.focus?`<p class="dcf"><b>Focus:</b> ${b.focus}${b.watch?` · <b>Watch:</b> ${b.watch}`:''}</p>`:''}${b.scene?window.renderScene(b.scene[0],sid,b.scene[1]):''}</section>`;}).join('');
 const open=e.kind==='p'?`#/session/${e.s}`:`#/festival/${e.k}/${e.day}`;
 return `<div class="dcard"><div class="dp-bar" style="background:${col}"></div><button type="button" class="x" data-act="back" aria-label="Close">&times;</button>${head}<div class="pbar"><a class="btn pri" href="${open}">Open full practice</a><button type="button" class="btn" data-act="skip" data-iso="${e.iso}">Skip this day</button></div><h4 class="sp">Reminders</h4>${rem}<h4 class="sp">Running to the end</h4><p class="dsub">Before the run start: 0 to 5 min arrival and circle.</p>${bl}</div>`;
}
function renderCal(){
 $('#calmain').innerHTML=calMain();const d=$('#drawer');
 if(CAL.sel!==null&&SCH[CAL.sel]){d.hidden=false;d.innerHTML=dayCard(SCH[CAL.sel]);}
 else if(CAL.panel==='settings'){d.hidden=false;d.innerHTML='<button type="button" class="x" data-act="back" aria-label="Close">&times;</button>'+settingsPanel();}
 else{d.hidden=true;d.innerHTML='';}
}
function yearPage(){
 buildSchedule();if(!CAL)initCal();
 const last=SCH[SCH.length-1];
 return head('Pre-K Calendar · Tuesdays and Thursdays','Practice Calendar',`${PL.TEACH-getFirst()+1} practices and 3 festival weeks, ${SCH[0]?SCH[0].date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):''} to ${last?last.date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):''}.`)+`<div class="calw"><div id="calmain" class="calmain"></div></div><div id="drawer" class="drawer" hidden></div>`;
}
function calAfter(){if($('#calmain'))renderCal();}

/* ---------- session page ---------- */
let CUR=null;
function blockDetail(b,id){
 return `<div class="bd"><div class="bd-h"><span class="bt2">${b.t} min</span><h3>${b.name}</h3></div><p class="bd-how">${b.how}</p>${b.list?`<ul class="pts">${b.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<dl class="bd-dl"><div><dt>Coaching focus</dt><dd>${b.focus}</dd></div>${b.prog?`<div><dt>Progression</dt><dd>${b.prog}</dd></div>`:''}${b.watch?`<div><dt>Watch for</dt><dd>${b.watch}</dd></div>`:''}</dl>${b.scene?window.renderScene(b.scene[0],id,b.scene[1]):''}</div>`;
}
function planPage(p,back){
 const total=p.total;
 const segs=p.blocks.map((b,i)=>`<button type="button" class="seg c${i%5}${i===0?' on':''}" style="flex:${b.min}" data-i="${i}" title="${b.name}"><span>${b.t}</span></button>`).join('');
 const list=p.blocks.map((b,i)=>`<button type="button" class="bsel${i===0?' on':''}" data-i="${i}"><span class="bm">${b.t}</span><span class="bn">${b.name}</span></button>`).join('');
 CUR={p,id:nid()};
 return `<div class="pbody"><div class="ptl" role="group" aria-label="Practice timeline">${segs}</div><div class="pgrid"><div class="blist">${list}<p class="eqp"><b>Equipment:</b> ${p.equip}</p></div><div class="bpanel" id="bpanel">${blockDetail(p.blocks[0],CUR.id+'0')}</div></div><p class="check"><b>${p.check.split(':')[0]}.</b>${p.check.slice(p.check.indexOf(':')+1)}</p></div>`;
}
function sessionPage(s){
 const fs=getFirst();s=Math.min(Math.max(fs,s),PL.TEACH);
 const p=PL.session(s),ev=evP(s);
 const prev=s>fs?`<a class="btn" href="#/session/${s-1}">Previous</a>`:'<span class="btn off">Previous</span>';
 const next=s<PL.TEACH?`<a class="btn" href="#/session/${s+1}">Next</a>`:'<span class="btn off">Next</span>';
 const title=`Chapter ${p.ch}: ${p.chapter.title}`;
 return head(`Practice ${s} of ${PL.TEACH}${ev?' · '+ev.dstr+' · Week '+ev.week:''} · 75 min`,title,`Level ${p.level} (${LV[p.level-1][0]}). Target: ${p.target}.`,`<div class="pbar"><a class="btn" href="#/year">Calendar</a>${prev}${next}<button type="button" class="btn" id="copyp">Copy plan</button><a class="btn" href="#/ch/${p.ch}">Open chapter</a></div>`)+planPage(p);
}
function festivalPage(k,day){
 k=Math.min(3,Math.max(1,k));day=day==='Thursday'?'Thursday':'Tuesday';
 const p=PL.festival(k,day);const ev=evF(k,day);
 const tabs=`<nav class="tabs"><a href="#/festival/${k}/Tuesday" aria-selected="${day==='Tuesday'}">Day 1: assessment</a><a href="#/festival/${k}/Thursday" aria-selected="${day==='Thursday'}">Day 2: festival games</a></nav>`;
 return head(`Festival ${k}${ev?' · '+ev.dstr+' · Week '+ev.week:''} · 75 min`,'Festival Week',k===1?'End of Term 1. Level 1 and 2 skills are shown.':k===2?'End of Term 2. Level 3 and 4 skills are shown.':'End of the year. Level 5 and 6 skills are shown.',`<div class="pbar"><a class="btn" href="#/year">Calendar</a><button type="button" class="btn" id="copyp">Copy plan</button></div>`)+tabs+planPage(p);
}

/* ---------- levels ---------- */
function levelsPage(){
 return head('Progression','Level Ladder','The same eleven chapters are taught six times. Move a child or group up only when the target at the current level is met.')+
 `<div class="lvh">${LV.map((l,i)=>`<div><b>L${i+1} ${l[0]}</b><span>${l[1]}</span></div>`).join('')}</div>`+
 tbl(['Chapter',...LV.map((l,i)=>'L'+(i+1))],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,...LT[c.n]]),'grid-t lad');
}

/* ---------- chapter page ---------- */
const CTABS=[['preview','Preview'],['concepts','Key concepts'],['notes','Teaching notes'],['faults','Faults and fixes'],['progress','Progress'],['drills','Exercises']];
function chapterPage(n,tab,idx){
 n=Math.min(Math.max(1,n),N);const c=CH[n-1];if(!CTABS.some(t=>t[0]===tab))tab='preview';
 const b=c.builds.length?c.builds.map(x=>`<a href="#/ch/${x}" class="chip">Ch ${x} ${CH[x-1].short}</a>`).join(''):'<span class="chip plain">Starting point</span>';
 let body='';
 if(tab==='preview'){
  body=`<div class="cols3"><div class="card"><h4>Objectives</h4>${ul(c.objectives)}</div><div class="card"><h4>Expected outcomes</h4>${ul(c.outcomes)}</div><div class="card why"><h4>How children aged 4 to 6 learn this</h4><p>${c.why}</p></div></div>`;
 }else if(tab==='concepts'){
  body=`<div class="tablewrap"><table class="kc"><thead><tr><th>Coach term</th><th>Say it to the child</th></tr></thead><tbody>${c.concepts[0][1].map(k=>`<tr><th scope="row">${k[0]}</th><td>${k[1]}</td></tr>`).join('')}</tbody></table></div>`;
 }else if(tab==='notes'){
  const i=Math.min(Math.max(0,idx),c.details.length-1),d=c.details[i];
  const vis=d.scene?window.renderScene(d.scene,nid()):d.chart?chartHTML(d.chart):'';
  const dots=c.details.map((x,j)=>`<a href="#/ch/${n}/notes/${j}" class="dot" aria-current="${j===i}" title="${x.h}">${j+1}</a>`).join('');
  body=`<div class="notes"><div class="pager"><span>${i+1} of ${c.details.length}</span><div>${dots}</div><div class="pn">${i>0?`<a class="btn" href="#/ch/${n}/notes/${i-1}">Back</a>`:''}${i<c.details.length-1?`<a class="btn" href="#/ch/${n}/notes/${i+1}">Next</a>`:''}</div></div><h3>${d.h}</h3><div class="detail-grid"><div class="txt">${d.p.map(p=>`<p>${p}</p>`).join('')}${ul(d.pts)}</div>${vis?`<div class="vis">${vis}</div>`:''}</div></div>`;
 }else if(tab==='faults'){
  body=tbl(['What you see','Likely cause','What to do'],c.faults,'grid-t faults');
 }else if(tab==='progress'){
  const steps=LT[n].map((t,i)=>`<li style="--w:${(i+1)/6*100}%;--d:${i*80}ms" class="stp"><b>L${i+1}</b><span class="sn">${LV[i][0]}</span><span class="st">${t}</span><a href="#/session/${sessionNo(n,i+1)}" class="sl">Practice ${sessionNo(n,i+1)}</a></li>`).join('');
  const fc=CORNERS.map(k=>`<li><span>${k}</span><span class="fb"><i style="width:${c.focus[k]*20}%"></i></span><b>${c.focus[k]}/5</b></li>`).join('');
  const key=(c.details.find(d=>d.chart)||{}).chart;
  body=`<div class="prog"><div class="card"><h4>Six levels across the year</h4><ol class="stairs">${steps}</ol></div><div class="stack"><div class="card"><h4>Emphasis in this chapter</h4><ul class="focus">${fc}</ul></div>${key?chartHTML(key):''}</div></div>`;
 }else{
  const i=Math.min(Math.max(0,idx),c.drills.length-1),d=c.drills[i];
  const ds=(window.DSCENE||{})[n]&&window.DSCENE[n][i];
  const lst=c.drills.map((x,j)=>`<a href="#/ch/${n}/drills/${j}" class="dsel" aria-current="${j===i}"><span class="dn">D${j+1}</span><span>${x[0]}</span><small>${x[1]} min</small></a>`).join('');
  body=`<div class="drillpage"><div class="dlist">${lst}</div><article class="drill"><header><h3>${d[0]}</h3><div class="meta"><span>${d[1]} min</span><span>${d[2]}</span><span>${d[3]}</span><span>${d[4]}</span></div></header>${ds?window.renderScene(ds[0],nid(),ds[1]):''}<dl><div><dt>Organisation</dt><dd>${d[5]}</dd></div><div><dt>Coaching points</dt><dd>${d[6]}</dd></div><div><dt>Progression</dt><dd>${d[7]}</dd></div><div><dt>Common issue</dt><dd>${d[8]}</dd></div></dl></article></div><p class="check"><b>Check for learning.</b> ${c.check}</p>`;
 }
 return `<header class="ph chh"><div class="ch-no"><span>Chapter</span>${String(n).padStart(2,'0')}</div><div><h2>${c.title}</h2><p class="lead">${c.lead}</p><div class="chips"><span class="chips-l">Builds on</span>${b}</div></div></header>${tabsHTML(CTABS,tab,'#/ch/'+n)}<div class="pbody2">${body}</div>`;
}

/* ---------- guide ---------- */
const WEEKEXP=[['Weeks 1 to 2','Team name, chant, buddy system','Parent welcome meeting; share the year plan and the Tuesday and Thursday schedule'],['Week 12','Festival 1 (end of Term 1)','Parent showcase; share first progress sheet'],['Weeks 13 to 14','Rebuild routines after the break','Short note about the next term'],['Week 24','Festival 2 (end of Term 2)','Family fun day; mid-year feedback'],['Weeks 25 to 26','Raise the challenge in games','Invite parents to watch one practice'],['Week 36','Festival 3 and graduation','Certificates, final report, photos'],['Weeks 37 to 40','Off-season: optional free play','Home challenge cards; registration; handover to Grade 1']];
const GUIDE={
 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','Traffic Lights is a chapter 2 exercise, not the run start'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. The practice repeats on Tuesdays and Thursdays.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, team chant, kit and water check, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Short demonstration of the skill with one cue'],['20 to 35','Skill play 1','Chapter drill at the current level'],['35 to 45','Skill play 2','Second chapter drill with progression'],['45 to 55','Game','Small-sided game applying the idea'],['55 to 65','1 v 1 finale','Always. Duels in small grids with a chapter twist'],['65 to 75','Review and close','5 minutes reviewing the previous chapter, 5 minutes closing circle']])+ul(['Change activity if children lose focus','Water at minute 15, between the game and the 1 v 1, and at the end','If energy is low, shorten skill play 2 and keep the 1 v 1 finale','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates'])],
 psych:['Child Psychology and Motivation','Three ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which cone color, which game.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div>`+ul(['Praise effort and strategy ("you kept your head up"), not talent','Use "not yet" language to support a growth mindset','Expect egocentric play; teach sharing through game design','If a child is upset, give a calm job and let them rejoin when ready','Seventy-five minutes is long for this age: keep activities short and varied'])],
 safety:['Physical Development and Safety','Practice twice a week with a strong running start. Protect joints and manage heat.',()=>ul(['Emphasise fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Short running bouts with rests; allow walking','Monitor heat and hydration; shorten the run start in hot weather','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week 24'],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance)','Report progress using the level targets in positive, specific language'])],
 assess:['Assessment','Record Yes, Almost or Not yet at each festival (weeks 12, 24 and 36), plus a baseline in week 1. Assess inside normal games and do not rank children.',()=>tbl(['Chapter','Check','Wk 1','Wk 12','Wk 24','Wk 36'],CH.map(c=>[c.n+'. '+c.short,c.check,'','','','']),'grid-t asm')],
 next:['Looking Ahead to 1st Grade','The first-grade curriculum extends this base.',()=>`<p>It adds simple passing patterns, more dribbling moves, first goalkeeper skills and a clearer understanding of the rules. Use the level ladder to see which chapters need more time before the group moves on.</p>`],
 sources:['Frameworks and Sources','The content is original writing informed by the frameworks below. It has not been checked against the original documents. Verify any specific figure or quotation before using it publicly.',()=>tbl(['Source','Used for'],[['FIFA','Grassroots coaching and Football for Schools materials'],['US Soccer','Player development guidelines and best practices for coaching youth soccer'],['The FA (England)','Youth development framework and the four-corner model'],['KNVB / Coerver','Technical development approach for young players'],['Balyi, I. et al.','Long-term athlete development model'],['Gallahue, D.','Understanding Motor Development: fundamental movement skills'],['Ryan, R. and Deci, E. (2000)','Self-determination theory'],['Dweck, C. (2006)','Mindset: growth versus fixed mindset']])]
};
const GORDER=[['run','Run start'],['structure','75-minute practice'],['psych','Psychology'],['safety','Safety'],['team','Team chemistry'],['parents','Parents'],['assess','Assessment'],['next','Next grade'],['sources','Sources']];
function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

/* ---------- shell ---------- */
$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">Pre-K Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rch-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rch-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rch-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CAL&&(CAL.sel!==null||CAL.panel)){CAL.sel=null;CAL.panel=null;if($('#drawer'))renderCal();}});
const th=$('#theme');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rch-theme',t);}catch(e){}}
th.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark');});
try{const t=localStorage.getItem('rch-theme');if(t)setTheme(t);}catch(e){}
route();
})();
</script>
