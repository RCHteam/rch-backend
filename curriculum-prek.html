<title>RCH Pre-K Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#F2F5F3;--bg2:#FFFFFF;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}
.calw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

<script>

window.CHAPTERS = [
{
 n:1, title:'The Game and the Environment', short:'Game & Environment',
 lead:'Orientation. Players learn the field, the equipment, the routines and the people. Safety and belonging come before skill.',
 builds:[], focus:{Technical:1,Physical:2,Psychological:4,Social:5},
 objectives:['Name and point to the goal, sideline and middle of the field','Follow a simple routine: bag, shin guards, water, line up','Separate from parents and join the group within the first 10 minutes'],
 outcomes:['Arrives ready to play with minimal prompting','Knows the names of coach and at least two teammates','Understands a stop signal (whistle, "freeze")'],
 concepts:[
  ['Coach term / child language',[['Field of play','"The big green space"'],['Touchline','"The sideline"'],['Goal','"The net we shoot at"'],['Equipment','"My soccer bag"'],['Stop signal','"Freeze like a statue"']]],
 ],
 details:[
  {h:'Why orientation comes first',p:['Children aged 4 to 6 are still building trust in new adults and new groups. A child who feels safe will try new movements; a child who feels uncertain will hold back. Belonging is the first developmental task of the season.','Use the first sessions to set the routines that every later chapter depends on: a start ritual, a stop signal, a water break, and a closing circle. Consistency matters more than variety at this stage.'],pts:['Greet every child by name at arrival, at eye level','Use one stop signal for the whole season and practice it as a game','Keep instructions to one sentence and demonstrate rather than explain'],scene:'field'},
  {h:'Space, size and safety',p:['Play on a small field so every child is near the action. A commonly used guide for the youngest ages is a field of roughly 30 by 20 yards with small goals; scale the area to the number of players and adjust to your national federation guidance.','Check the area before each session for holes, glass and unsecured goals. Use cones or flat markers, never hard objects, to mark boundaries.'],pts:['Anchor movable goals and never let children hang on them','Water break every 8 to 10 minutes, more often in heat','Keep first-aid kit and parent contact list on site']},
  {h:'Practice structure for ages 4 to 6',p:['A typical session lasts 40 to 45 minutes and is built from short activities of 5 to 10 minutes, because attention at this age is brief. Most of the time should be playing, with every child having a ball whenever possible.','The suggested split below is a planning guide. Keep playing time high and waiting time close to zero.'],pts:['Warm-up game 5 to 8 minutes','Skill play 15 to 20 minutes','Small-sided game 10 to 15 minutes','Closing circle 3 to 5 minutes'],chart:'session'}
 ],
 drills:[
  ['Field Tour',8,'All','Full field','Cones','Players hold hands in a line behind the coach and "tour" the field: touch the sideline, walk the center circle, stand in each goal.','Name each part as you touch it; ask children to repeat','Let children lead the tour in pairs','Rushing; skipping the naming'],
  ['Cone Colors',10,'All','20 x 20 yd','4 colors of cones','Four cone corners with different colors. Coach calls a color; players run to it. Add "freeze" signal.','Praise listening; ask for the color name','Call two colors in a row; add animal movements','Everyone bunches at one corner: add more corners'],
  ['Name Pass',10,'6 to 10','Circle 10 yd','1 ball per 6','In a circle, roll the ball to a player after saying their name. Receiver says thanks and passes on.','Look, say name, then roll','Two balls at once','Children grab the ball back: use a "wait for your name" rule'],
  ['First Mini-Game',12,'4 v 4 max','25 x 15 yd','Small goals, bibs','Free play with no restrictions. Coach restarts play with a new ball if it leaves the field.','Watch more than you speak; note who is hesitant','Add a second ball','Coach over-instructing'],
 ],
 check:'Child can point to the goal and sideline and respond to the stop signal.'
},
{
 n:2, title:'Movement Foundations', short:'Movement',
 lead:'Fundamental movement skills are the base for every sport. Balance, running, stopping, jumping and hopping come before ball technique.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:2},
 objectives:['Balance on one foot for about 5 seconds on each side','Run, change direction and stop on signal without falling','Jump with two feet and land softly with bent knees'],
 outcomes:['Controlled stopping on a visual or sound cue','Hops on both feet, alternating','Confident running in a crowded space without contact'],
 concepts:[['Coach term / child language',[['Static balance','"Flamingo"'],['Deceleration','"Brakes on"'],['Agility','"Change direction fast"'],['Landing','"Quiet like a cat"'],['Spatial awareness','"Bubble around me"']]]],
 details:[
  {h:'Fundamental movement skills first',p:['Research in motor development describes stability (balance), locomotor (run, jump, hop, skip) and manipulative skills (kick, throw, catch). Children who master the first two groups find ball skills easier.','At ages 4 to 6, most children are still developing mature running and jumping patterns. Use games that repeat the movement many times without making it feel like a drill.'],pts:['Teach one movement at a time','Demonstrate; then let children try; then add one cue','Celebrate effort and improvement, not perfection'],scene:'trafficlight'},
  {h:'Balance and body control',p:['Balance supports every soccer action: a plant foot for a kick, a stop before a turn, a block before a tackle. Start with static balance, then add movement.','Use short repetitions. A challenge to hold a pose for five seconds works better than a long drill.'],pts:['Arms out, eyes on a fixed spot','Switch feet and compare: both sides matter','Add a ball in the hands, then at the foot'],chart:'balance'},
  {h:'Stopping and landing',p:['Stopping safely requires bent knees and a low center of mass. Landing from a jump with soft knees protects joints and builds the base for later receiving skills.','Reinforce with the phrase "brakes on" for stops and "quiet landing" for jumps.'],pts:['Land on the balls of the feet with knees over toes','Avoid long jump challenges onto hard surfaces','Keep groups small so each child gets many repetitions']}
 ],
 drills:[
  ['Traffic Lights',10,'All','20 x 20 yd','None','Coach calls green (run), yellow (walk) and red (freeze). Add a "puddle" call to jump.','Reward the first to freeze, then everyone who freezes; bent knees on red','Add change of direction on yellow','Players bump: widen the space'],
  ['Flamingo Challenge',6,'All','Anywhere','None','Stand on one foot and count to 5. Switch. Add arm movements, then eyes closed for 2 seconds.','Eyes on a spot, arms out','Hold a beanbag on the head','Dropping the foot too soon: reduce the count'],
  ['Animal Run',10,'All','25 x 15 yd','Cones','Run to the far line as a bear, frog, snake or rabbit. Combine with jump and hop.','Make each animal a different movement pattern','Race against a "coach monster"','Overlong lines: use several lanes'],
  ['Hop and Land Circuit',10,'3 stations','10 x 10 yd each','Hoops or flat markers','Station 1 two-foot jumps, 2 hop on left, 3 hop on right. Rotate every 2 minutes.','Quiet landing, soft knees','Combine jump and stop on a signal','Fatigue: shorten work to 20 seconds']
 ],
 check:'Child balances 5 seconds on each foot and stops on signal within two steps.'
},
{
 n:3, title:'Ball Familiarization', short:'Ball Familiarization',
 lead:'The ball becomes familiar. Players learn the surfaces of the foot and make hundreds of touches in a short time.',
 builds:[1,2], focus:{Technical:5,Physical:3,Psychological:3,Social:1},
 objectives:['Name sole, inside and laces; use each deliberately','Perform toe taps and sole rolls with both feet','Keep the ball in a small area for several touches'],
 outcomes:['Comfortable moving with a ball in a crowded space','Uses both feet in play','Starts to self-correct touch strength'],
 concepts:[['Coach term / child language',[['Sole','"Bottom of my foot"'],['Inside of the foot','"Inside, near the big toe"'],['Laces','"Top of my foot"'],['Touch','"One tap"'],['Both feet','"Left and right"']]]],
 details:[
  {h:'Surfaces of the foot',p:['The inside is used for passing and controlled dribbling. The sole is used to stop and roll the ball. The laces are used to shoot and drive the ball. Start with the first two, which are the most reliable for young children.','Surface names should be consistent between coaches and the textbook so that children hear the same words all season.'],pts:['Touch the surface with a hand before the foot','Ask "which part of your foot touched the ball?"','Introduce the outside only after the inside is secure'],scene:'toetap'},
  {h:'Touch volume and rhythm',p:['Skill at this age grows through large numbers of repetitions in a playful setting. Games where every child has a ball can deliver hundreds of touches in a ten-minute window.','Rhythm games (tap, tap, roll) help children link movements and develop coordination.'],pts:['One ball per child','Count touches in 30 seconds as a friendly personal challenge','Praise effort and improvement, not comparison'],chart:'touches'},
  {h:'Left and right',p:['Early habits form quickly. If children only use their favored foot, the weaker foot will lag. Build both-foot play into every game from the start.','A simple rule helps: every second touch with the other foot.'],pts:['Alternate feet with the "tick tock" cue','Do not correct more than one thing at a time','Celebrate weaker-foot attempts']}
 ],
 drills:[
  ['Toe Taps',8,'All','20 x 20 yd','1 ball each','Alternate tapping the top of the ball with each foot. 30-second rounds.','Quick light taps; eyes up at times','Add a move forward and back','Stepping on the ball: lower the pace'],
  ['Sole Rolls',8,'All','20 x 20 yd','1 ball each','Roll the ball side to side and forward and back with the sole.','Soft sole, ball stays close','Roll into a space and stop','Heavy foot: ask for "feather" touches'],
  ['Ball Shop',10,'All','20 x 20 yd','Balls, cones','Players dribble around "shopping" in cones that are the items; stop on call and touch a cone.','Look for space; keep the ball close','Different cone colors for different tasks','Collisions: define lanes'],
  ['Touch Count Game',8,'All','20 x 20 yd','1 ball each','Count touches in 30 seconds with the inside only. Coach records the best score for each child.','Use quick, small touches','Beat a personal best','Counting out loud interferes: use fingers']
 ],
 check:'Child can name three foot surfaces and perform 20 toe taps in 30 seconds.'
},
{
 n:4, title:'Dribbling and Awareness', short:'Dribbling',
 lead:'Moving with the ball under control while seeing the environment. Head up, change of direction and use of space.',
 builds:[2,3], focus:{Technical:5,Physical:3,Psychological:3,Social:2},
 objectives:['Dribble with small touches in a straight line and around cones','Look up between touches to find space','Change direction with the inside and outside of the foot'],
 outcomes:['Keeps the ball close at moderate pace','Avoids other players while dribbling','Chooses open space'],
 concepts:[['Coach term / child language',[['Dribbling','"Run with the ball"'],['Close control','"Ball glued to feet"'],['Scanning','"Heads up"'],['Space','"Empty grass"'],['Change of direction','"Turn like a car"']]]],
 details:[
  {h:'Close control',p:['The ball should stay within about a step of the player. Small, frequent touches keep it close; large touches push it away and invite pressure.','Teach pace in stages: walk with the ball, jog with the ball, then run. The ball should always move with the player.'],pts:['Inside of the foot first','Touch every step if needed','Count how many cones in a row with no stray touch'],scene:'zigzag'},
  {h:'Head up and scanning',p:['Beginner dribblers watch the ball. Encourage a quick glance up, then back down, then up again. Use a visual game: the coach holds up fingers, and players say the number while dribbling.','This is the first link between technical skill and decision making.'],pts:['Look up every 3 touches','Use the coach as the "spotter"','Make the ball slower so eyes can be lifted'],scene:'fingers'},
  {h:'Space and direction',p:['Children learn that open space is where they can play freely. Introduce the concept with games that reward moving into empty areas and avoiding crowds.','Dribbling with a turn is the first tactical skill: change direction to escape pressure.'],pts:['Point out empty areas with a hand','Rotate groups to avoid crowding','Add gates to dribble through for variety'],chart:'dribble'}
 ],
 drills:[
  ['Zigzag Dribble',10,'Groups of 4','15 yd lanes','5 cones, balls','Players dribble through a line of cones using inside touches. Return along the outside.','Small touches, change foot at each cone','Use only the weaker foot; add outside touches','Ball escapes: reduce speed'],
  ['Gates Game',10,'All','20 x 20 yd','10 gates (2 cones each)','Dribble through as many gates as possible in 60 seconds. Count and try to beat the score.','Look for open gates','Only gates of a certain color','Same gate repeatedly: add a rule'],
  ['Heads Up',8,'All','20 x 20 yd','1 ball each','Coach shows fingers, children call the number while dribbling.','Quick glance, then back to the ball','Add colors or shapes','Looking without moving the ball: ask for both'],
  ['Shark Tank',10,'All','20 x 20 yd','Balls, a few bibs','Two players are "sharks" without a ball. Dribblers keep the ball away. If caught, they swap.','Use space and change direction','Increase the number of sharks','Frustration: keep roles rotating']
 ],
 check:'Child dribbles through 5 cones without losing the ball and glances up at least twice.'
},
{
 n:5, title:'Receiving and Control', short:'Receiving',
 lead:'Stopping and controlling the ball under pressure of time. Cushioning, positioning the body and first touch.',
 builds:[3,4], focus:{Technical:5,Physical:2,Psychological:3,Social:3},
 objectives:['Stop a rolled ball with the sole or the inside of the foot','Cushion the ball by relaxing the receiving foot','Drag the ball back and turn'],
 outcomes:['Controls a rolled ball within one step','Positions the body behind the line of the ball','Starts to receive with the inside rather than the toe'],
 concepts:[['Coach term / child language',[['Receiving','"Catching with your foot"'],['Cushioning','"Pillow foot"'],['First touch','"The first tap"'],['Drag back','"Pull it toward me"'],['Body shape','"Face the ball"']]]],
 details:[
  {h:'Cushioning',p:['A relaxed foot absorbs the ball energy. Children who tense the leg make the ball bounce away. Use the picture of a pillow or sponge to help.','Start with slow rolled balls, then add small speed.'],pts:['Foot slightly off the ground, toes up','Soft ankle','Eyes on the ball until it stops'],scene:'cushion'},
  {h:'Body position',p:['The player should line up behind the ball and face the passer. Moving to the ball (not waiting) gives more time and control.','Introduce the idea of "show for the ball": step toward the passer when the ball comes.'],pts:['Feet shoulder-width apart','Knees slightly bent','Take one step toward the ball']},
  {h:'Control and turn',p:['A drag back with the sole pulls the ball out of pressure and starts a change of direction. This is the first move combining control and turning.','Practice in a stationary form first, then in motion.'],pts:['Sole on top of the ball','Pull back and turn the body','Dribble away with the inside'],chart:'control'}
 ],
 drills:[
  ['Pillow Foot',8,'Pairs','5 yd apart','1 ball per pair','Partners roll to each other. Receiver stops the ball under the sole and rolls back.','Relax the foot','Use the inside to stop','Ball bounces away: slow the roll'],
  ['Stop and Go',10,'All','20 x 20 yd','1 ball each','Dribble and on the whistle stop the ball with the sole. Then go again.','Stop the ball, not only the feet','Stop with the inside','Overrunning the ball: slow the pace'],
  ['Drag and Turn',10,'All','15 x 15 yd','Balls, cones','Drag back with the sole and turn to dribble to the next cone.','Pull with the sole, turn the body','Use both feet','Pushing instead of pulling: demonstrate'],
  ['Catch the Roll',8,'Groups of 3','5 yd line','1 ball','Coach rolls to each child who stops the ball and passes it back.','Move to the ball','Increase roll speed','Waiting: step toward the ball']
 ],
 check:'Child stops 4 out of 5 slow rolled balls within one step.'
},
{
 n:6, title:'Passing and Cooperation', short:'Passing',
 lead:'The first team skill. Passing with the inside of the foot, calling for the ball and moving to a new position.',
 builds:[3,5], focus:{Technical:4,Physical:2,Psychological:3,Social:5},
 objectives:['Pass accurately to a partner 5 yards away using the inside of the foot','Call for the ball and make eye contact','Move after passing'],
 outcomes:['Passes and receives in pairs and threes','Shares the ball in small groups','Understands "pass and move"'],
 concepts:[['Coach term / child language',[['Pass','"Share the ball"'],['Inside of foot pass','"Pass with the inside"'],['Call','"Say my name"'],['Support','"Be a friend"'],['Pass and move','"Pass and run"']]]],
 details:[
  {h:'The inside foot pass',p:['The plant foot points toward the target and sits beside the ball. The kicking foot is turned out and the ankle locked. Contact is with the center of the ball and the follow through is toward the target.','Break into steps: plant, point, strike, follow.'],pts:['Look at the target before and after the pass','Ankle firm, toe up','Start with a standing ball'],scene:'pass'},
  {h:'Communication and eye contact',p:['Passing is a social act. Children learn to call a teammate by name or say "here". This builds trust and the habit of cooperative play.','The simple rule is: look, call, pass.'],pts:['Praise good calling','Use partners who like to talk','Let children choose their partners'],scene:'triangle'},
  {h:'Pass and move',p:['After passing, the player moves to a new space. This creates the basic structure of combination play and prepares for later concepts such as the triangle.','Use markers so children know where to run.'],pts:['Use cones for positions','Rotate positions after each pass','Add a second ball once the pattern is secure'],chart:'pass'}
 ],
 drills:[
  ['Partner Pass',10,'Pairs','6 yd apart','1 ball per pair','Pass back and forth with the inside, trying to keep the ball moving.','Plant, point, strike','Move apart; use one touch','Wild passes: shorten distance'],

  ['Pass the Treasure',10,'3 v 1','10 x 10 yd','Ball','Three players keep the ball from one defender, who is passive at first.','Make yourself easy to pass to','Defender becomes active','Hogging the ball: rule of 2 touches max'],
  ['Pass Through Gates',10,'Pairs','Several gates','Balls, cones','Pass through a gate to your partner.','Look at the gate and partner','Smaller gates','Passing too hard: practice speed']
 ],
 check:'Child makes 5 of 10 passes to a partner using the inside of the foot.'
},
{
 n:7, title:'Shooting and Scoring', short:'Shooting',
 lead:'Striking the ball with the laces toward a target, scoring goals and celebrating respectfully.',
 builds:[3,4,6], focus:{Technical:5,Physical:3,Psychological:4,Social:2},
 objectives:['Strike a ball with the laces toward a goal','Aim at corners and targets','Follow through with the kicking leg'],
 outcomes:['Shoots after a short dribble','Shoots with either foot','Celebrates scoring without disrespect'],
 concepts:[['Coach term / child language',[['Shot','"Kick it at the goal"'],['Laces','"The top of my shoe"'],['Plant foot','"Standing foot"'],['Follow through','"Swing through"'],['Target','"The corner"']]]],

 'Children aged 4 to 6 settle when the environment is predictable. Familiar routines reduce anxiety and free attention for learning, so the first chapter is about trust, not technique. Expect some children to cling to a parent or watch from the side for several sessions; invite, never force.',
 'Fundamental movement skills develop through practice, not through age alone. Balance, running, jumping and landing form the physical literacy that later sports skills sit on. Short, repeated, playful bouts work better than long drills because attention and muscular endurance are limited at this age.',
 'Learning at this age is mostly implicit: children improve by doing many varied touches, not by listening to explanations. A child with a ball at their feet for most of the session gets far more useful repetition than one waiting in a line. Aim for hundreds of touches per session.',
 'Young children focus on one thing at a time, usually the ball. The "head up" habit is built slowly by lowering the demand on the feet (slower ball, more space) so that attention can be spared to look around. Do not expect scanning before the ball is under control.',
 'Receiving requires the child to judge speed and direction of a moving object and coordinate a soft foot at the right moment. Eye-foot tracking is still maturing, so start with slow, rolled balls and keep success rates high before adding pace.',
 'Passing is a social behavior as much as a technical one. Four- to six-year-olds are often self-focused, and this is normal. Give them reasons to pass (games where passing earns points or opens goals) rather than instructions to share.',
 'Shooting is the most motivating action in the game. Use that: keep the number of shots high and success rates fair with large goals and short distances. Praise attempts, because fear of missing is the main thing that stops young players from shooting.',
 'One-versus-one duels introduce competition. Some children enjoy it immediately and others find it stressful. Keep contact rules clear, rotate partners so that results are balanced, and make the first duels about learning moves, not winning.',
 'Rules are understood best when met in context. A child who has just seen the ball roll out understands a throw-in better than one who has been told about it in advance. Keep the explanations short and give children a chance to act as referees.',
 'Team concepts such as spacing and roles are early in development at this age. Children may still prefer to chase the ball in a pack. Visual markers, small groups and frequent rotation are more effective than tactical explanations.',
