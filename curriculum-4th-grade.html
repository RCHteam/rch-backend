 run:['Always Start by Running','Every practice opens by running around the field. It warms the body, burns off arrival energy and builds stamina and coordination.',()=>`<div class="cols3"><div class="card"><h4>Minutes 5 to 13</h4><p>Laps around the field. Pace and number of laps follow the level (below).</p></div><div class="card"><h4>Minutes 13 to 15</h4><p>Dynamic moves: high knees, heel flicks, side shuffles, skips, bunny hops.</p></div><div class="card"><h4>Then</h4><p>Water, then one idea and the first skill drill.</p></div></div><h4 class="sp">Laps by level</h4>`+tbl(['Level','Laps and pace'],LV.map((l,i)=>[`Level ${i+1} ${l[0]}`,PL.LAPS[i]]))+ul(['Allow walking for tired children; never use running as punishment','Keep the whole group moving in the same direction','The ladder, hurdles and timing gates belong to chapter 2; the run start stays simple','Shorten the laps in hot weather and keep water within reach'])],
 structure:['The 75-Minute Practice','A fixed structure so children know what happens next. It follows the play, practice, play pattern and the FA’s plan, do, review loop.',()=>tbl(['Minutes','Part','What happens'],[['0 to 5','Arrival and circle','Greet by name, weather check, captain jobs, team chant, one idea for the day'],['5 to 15','Run start','Always. Laps around the field, then dynamic moves'],['15 to 20','Water and one idea','Two-minute demonstration with one cue'],['20 to 32','Play: skill play 1','Chapter drill at the current level; explore and repeat'],['32 to 44','Practice: skill play 2','A second chapter drill with a progression'],['44 to 59','Play: game','Small-sided game that applies the idea; level rule from the plan'],['59 to 69','Duel finale','Always. Opens with 1 v 1, then grows from 5 v 5 with roles to 6 v 6, 7 v 7 and 8 v 8 with the full rules'],['69 to 75','Closing circle','A motivation and morale tip, a high five for every child by name, the team chant and the next practice']])+ul(['Aim for at least 70 percent ball-rolling time (the FA’s guide for coaches)','Change activity if children lose focus','Water at minute 15, at the middle of the game and at the end','Everyone has a ball in at least half of the practice','Rotate groups so each child plays with different teammates','If energy is low, shorten skill play 2 and keep the duel finale'])],
 bridge:['From Kindergarten to 1st Grade','1st grade is built on the Kindergarten chapters. Kindergarten’s eleven chapters become ten (chapters 1 and 9 merge) and two new chapters are added, making twelve.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['Kindergarten','1st grade','What happened'],[['1 Team Environment and Routines, 9 Fair Play and the Referee','1 Team Culture, Leadership and Fair Play','Merged. The team agreement is written by the players; leader of the day replaces captain jobs; disputes use stop, say, solve'],['2 Movement and Agility','2 Athletic Movement','Grew: sprint starts, quick feet, reaction, landing, body-weight strength'],['3 Ball Mastery, 4 Dribbling','3 Ball Mastery, 4 Dribbling and Moves','Grew: sequences, tempo, speed dribbling, shielding while moving'],['5 Receiving, 6 Passing, 7 Shooting, 8 1 v 1','5 to 8 (same topics)','Grew: control at pace, 10-yard passing, instep and first-time finishing, block tackle and recovery'],['10 Team Play, 11 Goalkeeper','11 Team Play, 12 Goalkeeper','Grew: jobs that rotate, transition, restart plays, ladder match days, dive and distribute'],['(no chapter)','9 Combinations: 2 v 1, 2 v 2, 3 v 2','NEW: draw a defender and pass, overlap, width'],['(a peek and a few cues)','10 Game Intelligence: Seeing and Deciding','NEW: scan routine, if-then cues, decision games, questions that teach']])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Kindergarten','Now in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: leader of the day, restarts, stop-say-solve, a player-led game','Own-best goals replace comparison with other children','Seeing before doing: scan routine and questions that teach','Small combinations (2 v 1, 3 v 2) build team play from skills the children already have','Roles rotate and transitions become a habit','Every chapter links to how a 6 or 7 year old is developing (see the Development page)'])+`<h4 class="sp">Day-one checks for children arriving from Kindergarten</h4>`+ul(['Names the field thirds and follows the three signals','Balances on one foot for about 8 seconds','Links two or three ball moves on either foot','Passes with the inside of the foot at 8 yards','Attempts a move in a 1 v 1 and defends side-on','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Kindergarten','Use the first cycle (12 practices) as the baseline for everyone'])],
 develop:['How 6 and 7 Year Olds Develop','What is changing in the child, and what each change makes possible in soccer. This page links every chapter to child development.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, want to be liked, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others than only themselves. Physical skills grow quickly, and catching and ball skills become easier.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[['Friendship and belonging','Wants to be liked; picks friends; notices who is in or out','Team agreement, buddies, leader of the day, rotating partners','1, 9, 11'],['Comparing with others','Notices who is faster or better (Erikson’s industry versus inferiority; background knowledge)','Own-best cards; no rankings; praise effort','1, 8'],['Care for others','Moves from only me to also you','Passing into space, combinations, encouragers','6, 9, 11'],['Independence','Wants to do jobs alone','Leader of the day, player-led games, own warm-up','1, 2, 11'],['Working memory and attention','Can hold 2 or 3 things in mind; attention still short','Sequences of three or four moves; three cues at a time; short games','3, 10'],['Language','Can explain what happened','Questions that teach; stop, say, solve','1, 10'],['Speed and agility window','Quick gains in running, balance and coordination (LTAD: speed and suppleness windows)','Sprint starts, quick feet, landing, cuts','2, 4, 8'],['Hand and ball control','Catching and ball skills improve','W-catch, thigh control, first touch at pace','5, 12'],['Visual tracking','Following a moving ball and several players is still maturing','Peek before the ball arrives; short looks; calm drills first','5, 10'],['Resilience','Mistakes still sting; fear of failing in front of friends','Stop-say-solve, mistake of the day, praise for brave tries','1, 7, 8']])+`<h4 class="sp">Skill readiness map</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[['Sprinting and quick feet','10 to 15 yard sprints; low markers','Reaction starts from a ready position','Long runs; heavy loading'],['Ball control','Four-move sequences; control at 8 yards','Receive and turn; thigh control','Chest control; heading'],['Passing','Inside pass at 10 yards; lead a runner','Driven pass; outside foot','Long passes over 20 yards'],['Shooting','Instep with a locked ankle; first-time finish','Placement to a corner','Power shots from distance'],['Tactics','Draw and pass; free player; front, middle, back jobs','Overlap; scan routine','Fixed positions; formations'],['Goalkeeping','Ready position; W-catch; roll and throw','Dive from a crouch','Specialist keepers; punting']])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment, to be checked against your own group.</p>`],
 theory:['Game Ideas for Ages 6 to 7','Tactics are taught as simple ideas inside games, in the language children use. 1st grade adds combinations and a seeing-and-deciding routine.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, draw a defender and pass, overlap, find the free player, dribble into space or shoot. Chapters 4, 6, 7, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay goal-side, delay. Chapters 8 and 11.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and defend at once. Chapters 8 and 11.</p></div></div><p>These three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Numbers up</h4><p>In a 2 v 1 or 3 v 2, the attackers have one more player. The idea is simple: the defender cannot stop everything. Draw the defender, then pass to the free player.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A defender comes at you and a teammate is free','Draw and pass','9'],['A teammate is running past you outside','Overlap: pass in front','9'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use a move, then burst','8'],['They have the ball','Close the nearest player or cover','11'],['You win the ball','Go at once','8, 11']])+`<h4 class="sp">Jobs, not positions</h4><p>There are no fixed positions. Front, middle and back are jobs that rotate (scorer, helper, guard). Goalkeeper is a role that rotates. Formations are not taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball?','Which rule did you use: dribble, pass or shoot?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in 1st grade practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','1st grade setting','Source and note'],[['Players per team','3 v 3 or 4 v 4','DFB uses 3 v 3 (and 5 v 5) for F-Jugend (U8/U9); KNVB uses 4 v 4 for the youngest; U.S. Soccer’s 4 v 4 covers U7 and U8'],['Field size','About 25 x 20 yards (3 v 3) or 30 x 20 yards (4 v 4), up to 35 x 25','DFB 3 v 3: about 25 by 20 meters. UEFA newsletter 4 v 4: about 30 x 20 meters. U.S. Soccer: 25 to 35 yards by 15 to 25 yards for 4 v 4'],['Goals','Four small goals (3 v 3) or two goals with no keepers (4 v 4)','DFB: four mini goals no larger than 2.0 by 1.2 meters, scoring from inside a 6 meter shooting zone. U.S. Soccer: goals up to 4 by 6 feet'],['Ball','Size 3','Both sources'],['Goalkeepers','None in 3 v 3 and 4 v 4; every child tries the role in practice','DFB 3 v 3 has none; UEFA’s newsletter and U.S. Soccer 4 v 4 have none; in DFB 5 v 5 a goalkeeper is optional and changes each round'],['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 minutes (3 v 3) or 12 minutes (5 v 5); U.S. Soccer 4 v 4: four quarters of 10 minutes'],['Rotation','Rotate teams and jobs often','DFB: rotation after each goal in 3 v 3; fixed order every 3 minutes in 5 v 5'],['Referees','Coach as game leader; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],['Restarts','Kick-in or throw-in, restart from own end, free kick for hands, push or trip','DFB: opponent restarts an out-ball with a dribble or pass from the side. Follow your league and stay consistent'],['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down, with short breaks'],['Heading','Not used','U.S. Soccer age-group guidance']])+ul(['Laws taught: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake','If your league plays 7 v 7 with a goalkeeper at U9, introduce it gradually in 2nd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 6 and 7, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 6 and 7','How we train it','Chapters'],[['Speed','A key trainable window; short bursts only','10 to 15 yard sprints from varied starts with full rest','2, 4, 8'],['Agility','Plant-and-push and quick changes are improving','Cut gates, reaction tag, 1 v 1','2, 8'],['Coordination','Quick feet and rhythm are developing','Low markers, sequences, juggling','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, landing stations','2, 12'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start and the warm-up','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: animal walks, hops, squats','Animal power circuit','2'],['Reaction','Improving','Signal games, ready position','2, 12']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage of about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>Structured warm-up programs have been studied in youth soccer, but the strongest research is in older age groups. We use a short, player-led dynamic warm-up as sensible practice, and we keep landing, balance and body-weight strength in every cycle.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Seven ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Younger players valued a coach who lets them play different positions more than older players did. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 6 and 7, children start to notice who is faster or better. Erikson called this stage industry versus inferiority (background knowledge): children who feel capable gain confidence, and those who feel behind may lose it. Protect every child: use own-best cards, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two- or three-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Switch! and changing the rule every few minutes practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence is mixed, so treat this as a design guide rather than a promise.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)','Ask questions more than giving answers'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my own-best goal for next time?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay short (10 to 15 yards) with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week 26'],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],

 next:['Looking Ahead to 2nd Grade','The next curriculum extends this base.',()=>`<p>2nd grade deepens the same chapters: longer passing patterns, more combinations, more team shape, more decisions and game rules, and the first moves toward larger formats such as 7 v 7. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in small-sided formats','Players take on more of the planning and the review','A first goalkeeper-specific block can be added for children who want it'])],

  'Dropped ball':['Law 8','The referee drops the ball after a stoppage; it is in play when it touches the ground','New in 4th grade; restart after an injury stop'],
  'Fouls: tackling and holding':['Law 12','Kicking, tripping, pushing and holding are offences; tackle the ball, not the person','New in 4th grade; separate from the general fouls and cards idea'],
  'Substitutions':['Law 3','Players come on and off at a stoppage with the referee’s permission, after the leaving player is off the field','New in 4th grade; used for rotating positions']
};Object.assign(GUIDE,{
  bridge:['From 3rd Grade to 4th Grade','4th grade is built on the twelve 3rd-grade chapters. Every chapter grows in place with more speed, more power work, group play and real game structure. Two chapters are reshaped: positions and team tactics now have their own chapters, and formats grow from 7 v 7 to 8 v 8.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['3rd grade','4th grade','What happened'],[
   ['1 Leadership, Communication and Team Culture','1 Leadership, Communication and Team Plans','Grew: a game plan on the tactics board, short in-play calls, leading a warm-up, full referee signals, a three-question review'],
   ['2 Speed, Agility and Power','2 Speed, Agility and Power','Grew: 25 to 30 yard sprints, light bands, low plyo boxes, a light medicine ball; strength work stays light and short'],
   ['3 Dribbling, Feints and 1 v 1 Attack','3 Dribbling, Feints and 1 v 1 Attack','Grew: two feints in a row, scissors and chop turns, a plan against a live defender'],
   ['4 First Touch, Turning and Playing Under Pressure','4 First Touch, Receiving and Turning on the Move','Grew: thigh and chest control for lofted balls, receive across the body, play on within three seconds'],
   ['5 Passing: Long, Short and Switching','5 Passing: Range, Weight and Lofted Balls','Grew: 20 to 25 yards, ground and air, weight of the pass, through passes'],
   ['6 Finishing: Angles, Cutbacks and Rebounds','6 Finishing: Power, Placement and Composure','Grew: instep power, half-volleys, 1 v 1 against the keeper, early shots; no heading'],
   ['7 Defending: Pressure, Cover and Winning the Ball','7 Defending as a Group: Pressing, Cover and Recovery','Grew: press triggers, compact team, goal-side recovery, 2 v 2 and 3 v 3'],
   ['8 Combination Play','8 Attacking Principles: Support, Width, Depth and Penetration','Grew: support angles, width, depth, numbers-up play in 4 v 3 and 5 v 4'],
   ['9 Scanning, Decisions and Playing Forward','9 Positions and Roles','Replaced: scanning and decisions are now built into every chapter; this chapter introduces the five positions'],
   ['10 Team Shape, Roles and Transitions','10 Team Tactics: Shape, Phases of Play and Transitions','Grew: named shapes (2-3-1, 3-2-1, 3-3-1, 2-3-2), four phases, press triggers, half-time plan'],
   ['11 Goalkeeper','11 The Goalkeeper: Positioning, Crosses and Distribution','Grew: angles, crosses with a W grip, distribution, talking to the defence'],
   ['12 Rules, Offside and Set Plays','12 Rules, Referees and Set Plays','Grew: interfering with play, handball, direct and indirect free kicks, dropped ball, substitutions']
  ])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In 3rd grade','Now in 4th grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Positions arrive: goalkeeper, defender, midfielder, winger and forward, each learned by playing it and rotating through all of them (see the Positions page)','Game tactics arrive: the four phases of play, simple shapes, press triggers and a half-time plan (see the Tactics page)','More intensity: 6 to 8 laps, longer sprints with full rest, and duels that grow into 8 v 8 finales','More resources: nine new tools, including a tactics board, light bands, low plyo boxes and a light medicine ball (see the Tools page)','More rules: handball, direct and indirect free kicks, dropped ball, kick-off positions, substitutions and interfering with play (see the Rules page)','Players run more: they choose a plan, call signals, referee and review','No heading practice at this age'])+`<h4 class="sp">Day-one checks for children arriving from 3rd grade</h4>`+ul(['Sprints 20 to 25 yards with good form','Links a feint after a pole run','Passes 15 yards with the inside or laces','Scans before receiving in most passes','Plays a 6 v 6 or 7 v 7 with a simple role','Knows the offside idea in the last 14 yards','If most children pass these checks, use the Challenge progression line in each exercise during the first cycle'])],
  develop:['How 9 and 10 Year Olds Develop','What is changing in the child and what each change makes possible in soccer. Every chapter links to this page.',()=>`<p>The KNVB’s Jolles report describes children under about ten as playful and not yet well focused on the field, with focus changing a lot over about three years; planning is short term and self-evaluation and empathy are at an early stage. Around nine and ten, children begin to leave that stage: they follow longer instructions, hold a role for several minutes and compare themselves with others more. The FFF U10 and U11 material asks for 75 percent playing time for all and for play as the main vehicle. Many coaches call ages 9 to 12 a golden age of learning technique; we treat that as a popular idea, not a proven fact, because the paper we looked for was not opened.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[
   ['Friendship and fairness','Strong sense of fairness; groups form; arguments about rules','Helper referees, rule games, fair-play points, rotating partners','1, 12'],
   ['Comparing with others','Notices who is faster or better; early self-evaluation','Own-best targets, no rankings, position rotation for every child','1, 2, 9'],
   ['Planning ahead','Can plan a few minutes ahead and follow a simple team plan','Tactics board, half-time plan, three-question review','1, 10'],
   ['Attention and focus','Longer focus than at 8, still variable','Two or three cues, quick looks, variety','all'],
   ['Empathy','Starting to see what a teammate needs','Call and show, support angles, talking in defence','1, 8, 11'],
   ['Coordination','Fast improvement; growth spurts can briefly make children clumsy','Ladder, dots, hurdles, plyo boxes, bands; repeat basics','2, 3, 4'],
   ['Eye-foot control','Tracks lofted balls better','Thigh and chest control, volleys with a soft ball','4, 5, 6'],
   ['Understanding of space','Can see the whole field better, in 2D at first','Shapes, lanes, width and depth, phases of play','8, 9, 10'],
   ['Understanding of roles','Can hold a role and know what a teammate in another role does','Positions, rotating jobs, press triggers','9, 10'],
   ['Resilience','Mistakes still sting; peer judgement matters','Mistake of the day, brave tries, kind words','1, 3, 12']
  ])+`<h4 class="sp">Skill readiness map for 4th grade</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[
   ['Sprinting and agility','25 to 30 yard sprints; cuts on a cue; low box jumps','Bands; medicine-ball throws; 2-signal reactions','Heavy resistance; long repeated runs'],
   ['Ball control','Two feints in a row; thigh and chest control','Controlling on the back foot; first time play','Heading'],
   ['Passing','20 to 25 yard ground passes; weight of the pass','Lofted passes; through passes in a gap','Long passes over 35 yards'],
   ['Shooting','Instep power from 12 to 15 yards; early shots','Half-volleys; 1 v 1 against the keeper','Power shots from distance'],
   ['Defending','Press and cover; goal-side recovery','Press on a trigger; defending crosses','Sliding tackles'],
   ['Tactics','Roles; shapes; four phases','Changing shape at half time; offside timing','Complex formations'],
   ['Goalkeeping','Dive both sides; narrow an angle; W-grip catch','Crosses; distribution','Specialist training']
  ])+`<p class="note">This readiness map is our own judgment, based on the sources on the Sources page. Check it against your own group. Children can differ by nearly two years in age and by much more in size and maturity.</p>`],
  theory:['Game Ideas for Ages 9 to 10','Tactics are taught as simple ideas inside games, in child language. 4th grade adds positions, the four phases of the game, simple shapes in 7 v 7 and 8 v 8, press triggers and a half-time plan.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Support angles, width, depth, penetration, build from the keeper, combinations. Chapters 5, 8 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Press on a trigger, cover, stay compact, recover goal-side, defend crosses. Chapters 7 and 10.</p></div><div class="card"><h4>Switch</h4><p>Win it and go within three seconds; lose it and press or drop. Chapters 7 and 10.</p></div></div><p>The three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. 4th grade also names the fourth phase, the restart (set plays), so that the children know all four. At this age the phases are taught in child language, not as formal tactics. The FIFA numeric-progression page asks for simple tactical ideas added gradually with minimal instruction and many chances to solve problems.</p><h4 class="sp">The four phases of play</h4>`+tbl(['Phase','Child language','What we practice'],[['Attack','We have the ball','Support, width, depth, penetration, shoot'],['Defend','They have the ball','Press, cover, compact, recover'],['Transition','Switch','Win it and go in three seconds; lose it and press or drop'],['Restart','Ball out or foul','Corner, free kick, throw-in, kick-off and goal kick plans']])+`<h4 class="sp">Principles, in plain words</h4>`+tbl(['Principle','Plain words','Chapter'],[['Support','Be near enough to help, at an angle the passer can see','8'],['Width','Stretch the field with players near the sidelines','8, 10'],['Depth','Someone stays in front and someone behind the ball','8, 10'],['Penetration','Play forward when the way is open','8'],['Compactness','Stay close together when they have the ball','7, 10'],['Cover','Stand behind the pressing teammate and talk','7'],['Balance','The third player stays back to guard the far side','7, 10']])+`<h4 class="sp">Offside in 4th grade</h4><p>Children know the idea (stay level), the last 14 yards step (the FFF uses the last 13 m at U10 and U11) and the full IFAB Law 11 from 3rd grade. This year adds interfering with play: an offside position is only an offence when the player takes part in play. Teach it with flags and discs; the referee decides at the moment the pass is played.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate facing you','Pass','5'],['The near side is crowded','Switch to the far side','5, 10'],['Empty grass ahead','Dribble and change pace','3'],['A defender in front and a gap behind them','Feint then burst, or a through pass','3, 5'],['A teammate runs wide','Width: pass out, then support','8'],['A teammate is in front with space','Penetrate: pass forward','8'],['They have the ball and you are nearest','Press','7'],['A bad touch by them','Press trigger: go together','7, 10'],['You win the ball','Go within three seconds','10'],['The ball is out','Name the restart and the plan','12']])+`<h4 class="sp">Questions that teach</h4>`+ul(['What did you see before you got the ball? What did you see after?','Which option did you choose, and why?','Where was the free player or space?','What was the plan? What would you change at half time?'])],
  positions:['Positions: Who Does What','Five position groups introduced as jobs, learned by playing each one. Chapter 9 teaches them; chapters 10 and 11 use them. Every child rotates through every position during the year.',()=>`<p>At this age we teach positions as jobs with and without the ball, not as a place a child is stuck in for life. U.S. Soccer’s 7 v 7 guidance says players should be encouraged to try all positions (a secondary U.S. source), and the KNVB 7 v 7 teaching game asks for width and depth and a free player in build-up. Jolles advises against specialising or selecting early. Position bibs show the group; bibs swap when the roles rotate.</p>`+tbl(['Position','With the ball','Without the ball','Good habits to praise','Where in our shapes'],[
   ['Goalkeeper','Start play with a roll, throw or kick from the ground; be a safe pass for the defenders','Narrow the angle, catch, save, talk, come out for balls over the top','Loud voice, early position, quick release','Ch 11; the back player in every shape'],
   ['Defender','Pass safely, build from the back, step into the midfield with the ball when there is space','Stay goal-side, press the nearest attacker, cover a teammate, win the ball safely','Calm on the ball, talking, staying on their feet','2 or 3 at the back'],
   ['Midfielder','Link defence and attack; show for a pass; switch the play; turn quickly','Screen, press as a group, win second balls, track runners','Scanning, short passes, running both ways','2 or 3 in the middle'],
   ['Winger','Stay wide, take on a defender, cross low or cut inside to shoot','Track back, help the fullback, stay compact when the ball is on the other side','Staying wide, bravery in 1 v 1, tracking back','Wide in 3-3-1 and 2-3-1'],
   ['Forward','Stay high, move to open a lane, finish chances, hold the ball and lay it off','Press the first defender, set the press trigger, block the pass','Movement before the pass, finishing, first press','1 at the front']
  ])+`<h4 class="sp">How we teach positions</h4>`+ul(['Learn the job in a small game first (3 v 3 or 4 v 4), then place it in a 7 v 7 or 8 v 8 shape','Rotate every child through every position, including goalkeeper, across the year; never keep a child in one place because they are big, fast or good','Say the job in one sentence, then show it: “Winger: stay wide, take your defender on.”','Ask the child what the job is before and after the game','Change bibs, not the idea: the same child may wear a defender bib on Tuesday and a forward bib on Thursday'])+`<h4 class="sp">Positions in our shapes</h4>`+tbl(['Format','Shape','Jobs'],[['7 v 7','2-3-1','2 defenders, 3 midfielders (one central, two wide), 1 forward, plus the goalkeeper'],['7 v 7','3-2-1','3 defenders, 2 midfielders, 1 forward, plus the goalkeeper'],['8 v 8','3-3-1','3 defenders, 3 midfielders, 1 forward, plus the goalkeeper'],['8 v 8','2-3-2','2 defenders, 3 midfielders, 2 forwards, plus the goalkeeper']])+`<p class="note">Shape numbers are written back to front without the goalkeeper. These are practice shapes to explain jobs. The DFB and KNVB describe 7 v 7 teaching games with similar shapes; the formation your league uses may differ.</p>`],
  tactics:['Tactics: Phases, Shapes and Plans','Simple game tactics that fit 9 and 10 year olds. They are tools for understanding the game, not scripts.',()=>`<p>The FIFA Training Centre asks for simple tactical ideas added gradually, with little instruction and many chances to solve problems. The FA’s England DNA uses the same four moments (in possession, out of possession, transition and set plays). The KNVB’s O10 and O11 themes name the same ideas: disturb and win the ball, defend the 1 v 1, defend depth play, and make the transition from attack to defence. We follow these in a children’s version.</p><h4 class="sp">The four phases and what to do in each</h4>`+tbl(['Phase','Team job','Simple rules we use'],[['In possession','Keep the ball and move it forward','Spread wide, offer depth, keep a free player, play forward when the way is open, switch when one side is crowded'],['Out of possession','Win the ball back','Press on a trigger, cover behind the presser, stay compact, keep the ball in front of you'],['Transition to attack','Go fast after winning the ball','Look up, play forward in three seconds, support the ball'],['Transition to defence','Stop the counter after losing the ball','Press the ball for three seconds, or drop behind the ball and re-form']])+`<h4 class="sp">Press triggers</h4><p>A trigger is a signal that tells the team to press together. In our practices the triggers are a bad touch, a back pass, a pass to the sideline and a slow ball. When the trigger happens the nearest player presses, the next covers and the others tighten up. When there is no trigger the team holds its shape.</p><h4 class="sp">Shapes</h4>`+tbl(['Format','Shape','Why we use it','What it asks of the team'],[['7 v 7','2-3-1','Wide midfielders give width and the central midfielder links','Good for learning width and the free player'],['7 v 7','3-2-1','A solid back line with two midfielders','Good for learning to defend as a group'],['8 v 8','3-3-1','Balanced and easy to explain','Good for learning compactness'],['8 v 8','2-3-2','Two forwards and three midfielders','Good for learning attacking support']])+`<h4 class="sp">The half-time plan</h4><p>Teams talk for two minutes: one thing we did well, one thing to change and one clear job for each line. The plan must fit on the tactics board. After the game, review with three questions: what worked, what did not, what do we try next.</p><h4 class="sp">Set plays</h4><p>Children plan and run simple corners, free kicks, throw-ins and kick-offs, with a passer, a runner and a decoy. They referee their own set plays under the Laws on the Rules page.</p><h4 class="sp">Coach cautions</h4>`+ul(['Shapes are teaching tools: rotate players through every spot and change shapes often','Do not fix a team in one shape for a whole season; the FFF and DFB frame small-sided formats as a way to learn, not to win','Keep instructions short and ask questions instead of giving every answer','Praise the decision as well as the result'])],
  formats:['Rules and Game Formats','The formats used in 4th grade practices and festivals and what the European associations publish for this age. Check your league’s rules before match days.',()=>tbl(['Topic','4th grade setting','Source and note'],[
   ['Players per team','4 v 4 up to 8 v 8 across the six levels, with 7 v 7 as the main game','DFB: 5 v 5 or 7 v 7 at E-Jugend (U10 and U11), six field players plus the keeper. FFF: football à 8 at U10 and U11, on half a pitch. FA: 7 v 7 at U9 and U10, 9 v 9 at U11 and U12. KNVB: a 7 v 7 teaching game for O10 and O11. U.S. Soccer (secondary): 7 v 7 at U9 and U10 with a 1-3-2-1'],
   ['Field size','Practice sizes: about 55 x 35 yards (7 v 7) and up to about 60 x 40 yards (8 v 8)','DFB 7 v 7: 55 x 35 m. FA 7 v 7: 60 x 40 yards. FFF football à 8: half a standard pitch. Check the exact size with your league'],
   ['Goals','Two pop-up goals with rotating goalkeepers; mini cages and target nets for placement work','FA: 12 x 6 foot goals at U9 and U10. FFF U11: 6 x 2.10 m. DFB: junior goals at E-Jugend'],
   ['Ball','Size 4 for practice; check your league','KNVB advises size 4 for the age group; FFF U11 uses size 4. FA ball size for 7 v 7 was not found in the documents we read'],
   ['Goalkeepers','Rotate; play regularly in the 7 v 7 and 8 v 8; hands in the own area; back-pass rule','DFB: goalkeepers play regularly from E-Jugend and specialised training begins gradually. Jolles advises against early specialisation'],
   ['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 8 minutes','DFB E-Jugend tournaments: 2 x 12 minutes. FFF U11: 50 minutes total, aiming for 75 percent playing time for all'],
   ['Rotation','Rotate positions, teams and the goalkeeper; equal playing time','FFF: every player plays; DFB: rotation built into the game forms; U.S. Soccer: try all positions'],
   ['Referees','Children referee short games with a coach beside; adult referee in festivals','FFF suggests young referees briefed on the 8-a-side rules'],
   ['Restarts','Throw-in by hand, goal kick from the ground, corner from the arc, free kicks with a wall, penalty from the mark, dropped ball','FFF: opponents at 6 m, penalty from 9 m. IFAB Law 13 uses 9.15 m (10 yards); our practice distance is a coaching choice'],
   ['Offside','Full rule in 7 v 7 and 8 v 8 from Level 4, with interfering with play','FFF applies offside only from the last 13 m at U10 and U11; the full IFAB Law 11 applies in the 11 v 11 game'],
   ['Substitutions','Rolling substitutions at stoppages, with the referee’s permission','IFAB Law 3 (background knowledge): substitutes enter at a stoppage after the leaving player is off'],
   ['Heading','Not used','The FA guidance (read in a news report) says no heading practice at U11 and under; the DFB reform also removed most heading. Check your league'],
   ['Results','No table; ladder format for festivals','DFB: winners move up a pitch, losers down']
  ])+ul(['Use a whistle to start and stop, not to stop every mistake','The IFAB 2025/26 change on the keeper’s eight seconds is taught as “release quickly”','If your league plays 9 v 9 at the next age, a gradual step is planned for 5th grade'])],
  tools:['Training Tools','The tools used in 4th grade, where each first appears in the plan, and how to use it safely. Nine tools are new this year. Each is drawn in the exercise animation.',()=>{const f=firstUse(11);return `<p>Tools add variety, make the idea visible and give children something to explore. None is required: each has a home substitute. “Since” shows whether the tool is new this year or came from an earlier grade. “First seen” is the first practice in the plan where the tool is in an exercise. The power-work tools (bands, plyo boxes and the medicine ball) are light on purpose; see the Safety page.</p>`+tbl(['Tool','Since','What it is','First seen','Used in','Safe use','Home option'],Object.keys(TOOLINFO).filter(t=>f[t]).map(t=>{const i=TOOLINFO[t],u=f[t],nw=NEWTOOLS.includes(t);return [`<b>${t}</b>`,nw?'<b>New in 4th grade</b>':'Earlier grade',i[0],`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`,u.cnt+' exercises',i[1],i[2]];}))+`<p class="note">The tool is shown inside the animation of each exercise that uses it, and the exercise card has a New tool line.</p>`;}],
  rules:['Rules of the Game','The real rules of soccer taught inside games, with the matching IFAB Law and the first practice in which each appears. This year adds interfering with play, handball, free kicks, dropped ball, substitutions and the kick-off.',()=>{const f=firstUse(12);return `<p>Rules are taught inside games, not by lecture. In 3rd grade offside became real and free kicks, penalties and cards arrived. In 4th grade the Laws get closer to the full game. The main source is the IFAB Laws of the Game; only Law 11 was read in a hosted copy, and the other laws are used from background knowledge. The shorter distances come from the FFF and KNVB booklets for children.</p>`+tbl(['Rule','IFAB Law','What children learn','Coach note','First seen','Used in'],Object.keys(RULEINFO).filter(t=>f[t]).map(t=>{const i=RULEINFO[t],u=f[t];return [`<b>${t}</b>`,i[0],i[1],i[2],`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`,u.cnt+' exercises'];}))+`<h4 class="sp">What changes by level</h4>`+tbl(['Level','Rule focus'],[['1 Introduce','Kick-off with own-half positions, throw-in, goal kick, referee signals'],['2 Practice','Corner kick, fouls: tackling and holding, dropped ball'],['3 Develop','Offside last 14 yards, handball, free kick with a wall'],['4 Challenge','Direct and indirect free kicks, penalty kick, back-pass rule, offside interfering with play'],['5 Combine','Several restarts in one game; substitutions; the full offside rule'],['6 Perform','8 v 8 with the full set of rules, run by the players']])+`<p class="note">Offside and other rules are applied step by step. Check your league for the age at which the full rules apply.</p>`;}],
  body:['Body, Movement and Growth','The physical qualities that matter at ages 9 and 10 and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 9 and 10','How we train it','Chapters'],[['Speed','Short bursts with full rest; own-best times','25 to 30 yard sprints, cone-sprint grid, timing gates','2, 3, 7'],['Agility','Changes of direction on a cue improve','Cuts, ladder, dots, hurdles, reaction ball','2, 3, 4'],['Coordination','A strong period for technique, with possible short clumsy phases in growth spurts','Two feints in a row, sequences, juggling','3, 4'],['Balance','Single-leg control, stable landings','Plyo box landings, band walks, keeper dives onto a mat','2, 11'],['Flexibility','Dynamic and playful','Dynamic moves at the run start','all'],['Endurance','Built through play','Laps, games, short rests','all'],['Power','Light and skill-based: low jumps, light bands, a light medicine ball','Box step-ups and soft landings, band walks, short throws; few reps, full rest','2'],['Reaction','Improving','Reaction ball, tennis-ball catches, light and sound signals','2, 4, 11']])+`<h4 class="sp">What the sources say</h4>`+ul(['The FFF livret recommends short, varied blocks and avoiding mechanical overload because bones are still growing; the U11 booklet builds psychomotor work (balance, coordination, reaction, rhythm, footwork) into workshops','The KNVB’s Jolles report says motor development follows phases, children of one age differ widely, and playful practice speeds skill learning','A small study of U12 players (GeoSport for Society, 2022) reports improvement in speed, agility and coordination after a structured training cycle; the abstract has no sample size or control group, so it is only a pointer','Long-term athlete development models (World Rugby, used for the general model) favour a broad movement base and body-weight or light-load strength work before adolescence'])+`<h4 class="sp">Light power work</h4><p>This year adds low plyo boxes (about 12 to 18 inches, or 30 to 45 cm), light resistance bands and a light medicine ball (about 1 to 2 lb, or 0.5 to 1 kg). They are used for a few controlled repetitions with full rest, as part of a game or circuit, with the focus on landing softly, balance and good form. They are not weight training: no heavy loads, no maximum lifts and no training to failure. This is a coaching judgement based on LTAD ideas, not a rule from a source we opened.</p><h4 class="sp">Warm-up and injury prevention</h4><p>FIFA 11+ Kids was tested in children’s football and is a longer structured option. Our run start and dynamic moves are a short routine that you can combine with parts of it.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and at nine and ten some are entering growth spurts. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent, and Jolles advises against selecting children before about age 12. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence','Record progress against the child’s own results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread','If a child suddenly looks clumsy or says a leg or knee hurts, reduce jumping and running and talk to the parents'])],
 psych:['Child Psychology and Motivation','Ideas that guide coaching behavior at this age. Positions and tactics add a new topic: fairness in who plays where.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which tool, which pattern, which position to try next.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci; background knowledge). The Jolles report adds that extrinsic rewards alone can cause fear of failure and that intrinsic motivation is built by challenge, play and fun.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors.</p><h4 class="sp">Comparing with others</h4><p>At 9 and 10, children notice who is faster or better and peer opinion matters even more. Self-evaluation is still early, so children may judge themselves harshly or not at all. Use own-best targets, praise effort, never rank, mix partners and let children lead. Jolles advises avoiding selection before about age 12.</p><h4 class="sp">Attention and self-control</h4><p>Focus varies a great deal between children of this age. Games that change a rule every few minutes, if-then cues and quick looks practise attention while children simply play. The evidence that sport improves executive function is mixed, so treat this as a design guide, not a promise.</p><h4 class="sp">If-then plans</h4><p>An if-then cue (“If I see a free teammate, then I pass”) gives a child a short plan to use in the moment. It is a coaching idea based on implementation-intention research (background knowledge; not rechecked) and is used in chapter 9.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look','Give concrete, short feedback, not long-term goals (Jolles)'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new feint. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (FA social skills)','Keep instructions short, feedback positive and specific','Ask questions more than giving answers','Captains and helper referees practise calm voices','Rotate every child through every position, so nobody is labelled a defender or a forward at nine'])],
  safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints, equipment and children.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay at 25 to 30 yards with full rest; landing and diving are practised on soft ground or a crash mat and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practise earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age. The FA guidance (read through a news report, not the FA page itself) says no heading practice at U11 and under, and the DFB reform removed most heading; air passes in this plan are kicked, thrown or controlled with the thigh and chest, with soft balls where possible','Power work is light: low foam plyo boxes (about 12 to 18 inches, or 30 to 45 cm), light bands, a 1 to 2 lb (0.5 to 1 kg) medicine ball; few repetitions, full rest, no maximum effort and nothing that hurts','Stop a power exercise when form slips: knees falling in, stiff landings or twisting. Do not use a band to pull or launch a child','Medicine-ball throws go away from other people to a clear catcher, never overhead above a partner’s head','New tools: use soft mannequins, break-away hurdles, flexible poles and flags, level and anchored nets, mini cages and pop-up goals; use reaction balls and tennis balls on soft grass and clear stray balls at once','Safe tackling: inside of the foot, after a delay, no sliding; handball and holding calls are signs, not punishments','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and dynamic moves are a simple routine. FIFA 11+ Kids is a longer structured option. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates and some have growth spurts at nine and ten: do not compare or group by size; reduce jumping if a child reports knee or heel pain'])],
  next:['Looking Ahead to 5th Grade','The next curriculum extends this base.',()=>`<p>5th grade deepens the same chapters and prepares the step to 9 v 9 and, later, 11 v 11. Expect a bigger pitch, longer build-up through the lines, more stable positions with specialist keeper blocks, set plays run by the players, the full offside rule in every game and more game-model thinking. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Positions become more stable but rotation continues','Phases of play and press triggers become team habits that players call themselves','Training tools stay; light power work grows slowly','The Rules page grows toward the full set of Laws, including more detail on fouls and misconduct'])],
});

function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchg4-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchg4-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchg4-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CAL&&(CAL.sel!==null||CAL.panel)){CAL.sel=null;CAL.panel=null;if($('#drawer'))renderCal();}});
const th=$('#theme');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchg4-theme',t);}catch(e){}}
th.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||'light';setTheme(cur==='dark'?'light':'dark');});
try{const t=localStorage.getItem('rchg4-theme');if(t)setTheme(t);}catch(e){}
route();
})();
