{
 n:11, title:'The Goalkeeper: Positioning, Crosses and Distribution', short:'Goalkeeper',
 lead:'Goalkeeping grows in positioning and leadership. Fourth graders narrow the angle, catch crosses with soft hands, save with hands and feet, start attacks with the hands or the foot from the ground and organise the defenders with a loud voice.',
 builds:[2,4,6], focus:{Technical:4,Physical:3,Psychological:5,Social:3},
 grew:{pre:'3rd graders dive to both sides, close a 1 v 1, parry and catch, start attacks with a roll or a throw, kick from the ground, handle crosses on the ground and use hands and feet by the back-pass rule.',k:'4th graders move to narrow the angle, catch crosses with a W grip and a step, save with hands and feet, throw and kick from the ground to start attacks and talk to the defenders.'},
 dev:'At 9 and 10 children can learn goalkeeper technique in play and many want to try the position, but a goalkeeper faces more pressure than anyone else. The DFB expects goalkeepers to play regularly from E-Jugend (with 7 v 7), and the FFF asks for distribution from the ground, with goalkeeper volleys banned at U10 and U11. Soccer use: rotate every child through goal, protect confidence and praise decisions and voice as much as saves.',
 basis:[['DFB','Goalkeepers play regularly in matches from E-Jugend (7 v 7).'],['FFF','At U10 and U11 goalkeeper distribution is by hand or foot from the ground; volleys on distribution are not allowed.'],['KNVB','Dutch youth theory includes the goalkeeper in build-up and in defending the 1 v 1 and in depth play.'],['IFAB','Law 12: the keeper may not handle a ball deliberately kicked by a teammate and may hold the ball for no more than eight seconds.']],
 game:'Keeper Command 6 v 6: the keeper organises a wall or a line before each corner and free kick; a clean catch and a throw to a free player scores a point.',
 objectives:['Move to narrow the angle and set before the shot','Catch a cross with a W grip and a step','Save with the hands and with the feet','Start an attack with a throw or a kick from the ground'],
 outcomes:['Stops 6 of 10 moderate shots','Catches 4 of 8 crosses cleanly','Saves with the feet in 3 of 5 close shots','Starts an attack to a free teammate in 4 of 6'],
 concepts:[['Coach term / child language',[['Narrow the angle','"Step out so the shooter sees less goal"'],['W grip','"Thumbs together behind the ball"'],['Set position','"Feet apart, knees bent, ready before the shot"'],['Distribution','"Throw, roll or kick from the ground"'],['Organise','"Talk to your team: line up, man on, time"'],['Eight seconds','"Release the ball within eight seconds"'],['Back-pass rule','"No hands to a teammate’s kick"']]]],
 why:'Many children like to dive, and positioning gives every keeper something to be proud of before the shot. A keeper who talks makes the whole team better. Rotation protects confidence and shows every child the job.',
 details:[
 {h:'Positioning and the set position',p:['The keeper stands on the line between the ball and the center of the goal and steps out as the shooter nears. Feet shoulder-width apart, knees bent, weight forward, hands ready.','Practise stepping out and back with a partner on the ball.'],pts:['Between ball and goal','Set before the shot','Step out, step back','Hands ready'],scene:'keeper'},
 {h:'Catching crosses',p:['Crosses start low and slow. The keeper steps toward the ball, takes it high with a W grip (thumbs together) and brings it into the body. Use tennis balls first, then a soft ball.','Call the ball loudly so defenders know it is yours.'],pts:['Step to the ball','W grip','Bring it in','Call "keeper"'],scene:'dive'},
 {h:'Saving with hands and feet',p:['Hands for shots at the body or sides; feet for low close shots (a block with the leg or foot). A crash mat helps children dive without fear.','Alternate both sides and alternate hands and feet.'],pts:['Hands for most shots','Feet for close low shots','Crash mat for dives','Both sides'],scene:'dive'},
 {h:'Starting the attack',p:['Distribution is by throw (overarm for distance, underarm for accuracy) or a kick from the ground. The goal is a free teammate, not a long hoof.','Remember the FFF rule: no volleys on distribution at U10 and U11.'],pts:['Throw or kick from the ground','Free teammate','Overarm for distance','No volleys'],scene:'gkthrow'},
 {h:'Organising the team',p:['The keeper sees the whole field and so speaks first: line up, man on, time, switch. A short call before each corner and free kick helps the wall form.','Praise the voice as much as the save.'],pts:['Short calls','Wall before free kicks','Praise the voice','Rotate keepers'],chart:'gk'}
 ],
 drills:[],
 faults:[['Keeper stands on the line','No step','Step out as the shooter nears'],['Cross drops through the hands','Fingers not in W','Thumbs together behind the ball'],['Keeper dives too early','Guessing','Wait for the strike and stay set'],['Distribution always long','No look','Pick a free teammate first'],['Keeper silent','Shy','Use set calls and praise the voice']],
 check:'Child narrows the angle, catches a cross, starts an attack to a free teammate and organises the team with a call.'
},
{
 n:12, title:'Rules, Referees and Set Plays', short:'Rules & Set Plays',
 lead:'Rules deepen and become tools. Fourth graders learn what offside really means (interfering with play), handball, direct and indirect free kicks, the dropped ball, kick-off and substitutions, then use them to run set plays for corners, free kicks and throw-ins.',
 builds:[1,7,10,11], focus:{Technical:2,Physical:2,Psychological:4,Social:5},
 grew:{pre:'3rd graders moved from the offside idea to the real rule, took free kicks with a wall, ran corners and throw-ins with a plan, took penalties from a fixed mark and understood fouls, cards and advantage.',k:'4th graders add interfering with play in offside, handball, direct and indirect free kicks, the dropped ball, kick-off positions and substitutions, and run corners, free kicks and throw-ins as set plays in games they referee themselves.'},
 dev:'At 9 and 10 children understand rules as shared agreements and many enjoy knowing the real laws. Fairness is a strong feeling, so disagreement about calls is common and also a chance to practise respect. Soccer use: rules taught inside games, referees rotate and explain a call in one sentence. The FFF names fair play, refereeing and the laws of the game as a priority at U10 and U11, and flags offside from the last 13 metres.',
 basis:[['IFAB','Laws of the Game: Law 11 (offside), Law 12 (fouls and misconduct, handball), Law 13 (free kicks), Law 8 (kick-off and dropped ball). Law 11 was read in a hosted copy; other laws are used from background knowledge and the IFAB site could not be opened.'],['FFF','U10 and U11: offside from the last 13 metres, free kicks direct or indirect with opponents 6 metres away, hands for throw-ins and keeper distribution from the ground.'],['KNVB','Dutch youth materials teach rules through game forms and refereeing by players.'],['DFB','E-Jugend 7 v 7 uses throw-ins, goal kicks and goalkeepers; referees are often the coaches or players.']],
 game:'Referees’ Match 7 v 7: a rotating referee runs every restart; each team plays one set play (corner, free kick or throw-in) per half and explains it in a sentence.',
 objectives:['Explain offside as interfering with play and spot an example','Show and say the signal for handball and for direct and indirect free kicks','Take a kick-off and a dropped ball correctly','Run a set play for a corner, a free kick and a throw-in'],
 outcomes:['Explains offside in two sentences','Calls handball correctly in 3 of 4 tries','Takes a kick-off, a dropped ball and a free kick correctly','Runs three set plays in a game'],
 concepts:[['Coach term / child language',[['Offside','"Ahead of the ball and the second-last defender and playing"'],['Interfering with play','"Touching or playing the ball when it is passed"'],['Handball','"Deliberate hand or arm touch, or making your body bigger"'],['Direct free kick','"You can score straight from it"'],['Indirect free kick','"Someone else must touch it first"'],['Dropped ball','"The referee drops the ball for one player"'],['Set play','"A plan for a restart"']]]],
 why:'Knowing the real rules builds respect for the game and makes children better referees and teammates. Set plays give a team a clear job at restarts, and rotating referees teach children what an honest call feels like.',
 details:[
 {h:'Offside: interfering with play',p:['A player is in an offside position when nearer to the goal line than the ball and the second-last opponent. It is an offence only if the player plays or touches a ball passed by a teammate, interferes with an opponent or gains an advantage. There is no offence from a goal kick, throw-in or corner kick (IFAB Law 11).','Practise with flags and a walking game before a real game.'],pts:['Nearer than the ball and second-last opponent','Offence only if involved','Not from goal kick, throw-in or corner','Flags and walking first'],scene:'overlap'},
 {h:'Fouls and handball',p:['Careless, reckless or too strong challenges are fouls. Handball is a deliberate touch with the hand or arm, or making the body unnaturally bigger. The keeper may use hands inside their own area but not for a teammate’s deliberate kick.','Practise the signals and the reason.'],pts:['Careless, reckless, too strong','Handball is deliberate','Keeper rules','Signal and say why'],scene:'refsignals'},
 {h:'Free kicks, kick-off and dropped ball',p:['A direct free kick can score; an indirect free kick needs another touch first. At kick-off all players start in their own half and opponents stay back. A dropped ball goes to one player of the team that last touched the ball (or to the keeper if it was in the area).','In our practice opponents stand back 6 yards (the FFF distance); the IFAB Law uses 9.15 m.'],pts:['Direct can score','Indirect needs a second touch','Own half at kick-off','Dropped ball to one player'],scene:'setpos'},
 {h:'Set plays: corners, free kicks and throw-ins',p:['Each set play has three jobs: the taker, the runner and the stayer. A corner can go short or long; a free kick can go to a runner or a shooter; a throw-in can go to feet or into space.','Practise the plan walking first, then at pace.'],pts:['Taker, runner, stayer','Short or long','Feet or space','Walk, then pace'],scene:'matchday'},
 {h:'Referees and substitutions',p:['Referees show signals and say a reason. In youth games substitutes usually enter at the halfway line when the ball is out of play, and every child plays at least half. The referee also keeps time.','Rotate the referee and praise honest calls.'],pts:['Signal and say','Enter at the halfway line','Everyone plays','Rotate referees'],chart:'rules'}
 ],
 drills:[],
 faults:[['Calls offside for a player behind the ball','Offside idea only','Use the flag and the second-last opponent'],['Whistle for every touch','Over-calling','Teach advantage and a short reason'],['Free kick taken from the wrong spot','Rushing','Place the ball at the spot and wait'],['Set play forgotten','Too many jobs','Taker, runner, stayer only'],['Referee gives in to friends','Fear','Rotate and praise honest calls']],
 check:'Child explains offside, takes a legal restart, calls handball with a reason and runs a set play.'
}
];

<script>
// Merge the 4th-grade exercises into the chapters. Drill tuple: [name,min,players,area,equipment,organisation,focus,progression,watch,level,kind,tool,rule]
window.RULETXT={
 'Kick-off: own half':'Rule in play: at kick-off every player starts in their own half and the opponents stay back (5 yards in our practice, 9.15 m in IFAB Law 8); the ball is in play when it is kicked and clearly moves, and a goal can be scored directly.',
 'Offside: interfering with play':'Rule in play: IFAB Law 11. Being in an offside position is not an offence by itself. It is an offence only if, when a teammate plays the ball, the player then plays or touches it, interferes with an opponent (blocks the view or challenges) or gains an advantage. An indirect free kick restarts play.',
 'Handball':'Rule in play: handball is deliberately touching the ball with the hand or arm, or making the body unnaturally bigger (IFAB Law 12). A direct free kick is given, or a penalty if it happens in the defending team’s own penalty area; the keeper may use the hands inside their own area.',
 'Direct and indirect free kicks':'Rule in play: a direct free kick can score straight into the goal; an indirect free kick must touch another player first and the referee raises an arm until the ball is touched or out (IFAB Law 13). Opponents stand back 6 yards in our practice (9.15 m in the Law).',
 'Dropped ball':'Rule in play: when the referee stops play for a reason not covered by another restart, the ball is dropped for one player of the team that last touched it (the keeper if it was in that team’s own penalty area); all other players stay at least four yards away until the ball touches the ground (IFAB Law 8).',
 'Fouls: tackling and holding':'Rule in play: tackling, charging, pushing, tripping or holding an opponent in a careless, reckless or too strong way is a foul (IFAB Law 12) and gives a direct free kick; sliding tackles are not taught at this age.',
 'Substitutions':'Rule in play: in our games substitutes enter at the halfway line after the ball is out of play and the player leaving has left the field; everyone plays at least half the game (the FFF asks for 75 percent playing time for all at U10 and U11).',
 'Kick-off and restarts':'Rule in play: every goal is followed by a kick-off from the center; the opponents stay back at least 5 yards and the ball is in play when it moves.',
 'Referee signals':'Rule in play: the referee shows the signal for the call (goal, throw-in, goal kick, corner, free kick, advantage, card) and says the reason in one sentence.',
 'Advantage':'Rule in play: if a foul happens but the fouled team still has a good chance, the referee lets play go on and calls "advantage".',
 'Fouls and cards':'Rule in play: careless, reckless or too strong challenges are fouls (IFAB Law 12). A yellow card cautions, a red card sends a player off; in practice the cards teach and are never a punishment.',
 'Throw-in':'Rule in play: when the ball crosses the side line the other team throws in with both hands from behind and over the head, both feet on or behind the line.',
 'Goal kick':'Rule in play: when the attackers play the ball over the end line, the defending team restarts from the goal area with the ball on the ground; the ball is in play once it moves and the opponents stay outside the area.',
 'Corner kick':'Rule in play: when the defenders play the ball over their own end line, the attackers restart from the corner arc; the ball is at rest in the arc and opponents stay back.',
 'Free kick and wall':'Rule in play: after a foul the other team takes a free kick (direct can score, indirect must touch another player first). Opponents stand back 6 yards in our practice (9.15 m in IFAB Law 13); a wall of mannequins or players blocks the shot.',
 'Penalty kick':'Rule in play: a foul by the defenders inside their area gives a penalty from the mark (9 yards in our practice); the keeper stays on the goal line until the kick and all other players stay outside the area.',
 'Back-pass rule':'Rule in play: the keeper may not pick up a ball deliberately kicked back by a teammate (first time a warning, then an indirect free kick) and may hold the ball for no more than eight seconds (IFAB Law 12).',
 'Offside: stay level':'Rule idea (practice only): an attacker should stay level with or behind the ball or the last defender when a pass is played, so runs are timed.',
 'Offside: last 14 yards':'Rule in play: offside is called only in the last 14 yards in front of the goal (the FFF uses the last 13 m at U10 and U11). A player is offside if nearer the goal line than the ball and the second-last opponent when the ball is played and takes part in play.',
 'Offside: the full rule':'Rule in play: IFAB Law 11. A player is in an offside position if nearer the goal line than both the ball and the second-last opponent. It is only an offence if the player takes part in play; there is no offence from a goal kick, throw-in or corner kick. An indirect free kick restarts play.'
};

function keyExtra(sc){
  const types={};let tools=[],rules=[];
  sc.items.forEach(o=>{types[o.t]=1;
    if(o.t==='label'&&typeof o.text==='string'&&/Tool:|Rule:/.test(o.text)){
      const mt=o.text.match(/Tool:\s*([^|]*)/),mr=o.text.match(/Rule:\s*(.*)$/);
      if(mt)tools=mt[1].split(',').map(x=>x.trim()).filter(Boolean);
      if(mr)rules=mr[1].split(',').map(x=>x.trim()).filter(Boolean);}});
  const r=[];
  r.push(`<li class="kx"><i class="kd ko"><svg viewBox="-8 -8 16 16" width="16" height="16"><circle r="6.5" fill="#fff" stroke="#111" stroke-width="1.6"/><circle r="2.4" fill="#111"/></svg></i><span><b>Ball</b>: the white ball. Players and the ball follow the path in the animation, and it repeats.</span></li>`);
  ['cone','goal','zone','circle','line','link','light','flash','wedge'].forEach(k=>{if(types[k])r.push(`<li class="kx"><i class="kd ko">${KEYOBJ[k][0]}</i><span>${KEYOBJ[k][1]}</span></li>`);});
  tools.forEach(t=>{if(KEYTOOL[t])r.push(`<li class="kx kt"><i class="kd ko tool">T</i><span><b>Tool: ${t}.</b> ${KEYTOOL[t]}</span></li>`);});
  rules.forEach(t=>{if(KEYRULE[t])r.push(`<li class="kx kt"><i class="kd ko rule">R</i><span><b>Rule: ${t}.</b> ${KEYRULE[t]}</span></li>`);});
  return r.join('');
}
window.howTo=function(d){
  const org=String(d[5]||'').split(/(?<=[.!?])\s+/).filter(s=>s&&!/^Rule in play/.test(s));
  const li=[];
  li.push(`<li><b>Set up.</b> Area: ${d[3]}. Players: ${d[2]}. You need: ${d[4]}.</li>`);
  org.forEach((s,i)=>li.push(`<li><b>${i===0?'Start.':'Then.'}</b> ${s}</li>`));
  li.push(`<li><b>Coach says.</b> ${d[6]}</li>`);
  li.push(`<li><b>Make it harder.</b> ${d[7]}</li>`);
  li.push(`<li><b>If it goes wrong.</b> ${d[8]}</li>`);
  return `<section class="how"><h4>How to run it</h4><ol>${li.join('')}</ol></section>`;
};

function keyHTML(sc,name){
  const num={},let_={};let hasK=false;
  sc.items.forEach(o=>{if(o.t!=='p')return;const t=o.team||'a';if(t==='k')hasK=true;const n=o.n==null?'':String(o.n);
    if(n===''||!isNaN(n))num[t]=1;else let_[t+n]=[t,n];});
  const rows=[];
  ['a','b','k','c'].forEach(t=>{if(num[t]){const c=KEYCOL[t];rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">1</i><span><b>${c[0]}</b>: ${KEYNUM[t]}</span></li>`);}});
  Object.values(let_).sort((x,y)=>'abkc'.indexOf(x[0])-'abkc'.indexOf(y[0])).forEach(([t,n])=>{
    if(t==='k'&&n==='K'&&!num.k&&Object.keys(let_).filter(z=>z[0]==='k').length===1){/* fallthrough */}
    let m=(KEYSC[name]&&KEYSC[name][n])||(KEYTC[t]&&KEYTC[t][n])||KEYLET[n];
    if(n==='T'&&!(KEYSC[name]&&KEYSC[name].T))m=hasK?'Thrower (sends the ball to the keeper)':'Tagger (chaser)';
    if(n==='L'&&t==='c')m='Ladder runner';
    if(n==='M'&&t==='a')m='Middle player';
    if(n==='F'&&t==='a')m='Front player';
    if(n==='B'&&t==='a')m='Back player';
    if(!m)return;const c=KEYCOL[t];
    rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">${n}</i><span><b>${c[0]} ${n}</b>: ${m}</span></li>`);});
  rows.push(keyExtra(sc));
  return `<details class="sc-key" open><summary>Key: colors, letters, tools and markings</summary><ul>${rows.join('')}</ul></details>`;
}

window.renderScene=function(name,id,capOverride){
  const sc=S[name]; if(!sc) return '';
  const cap=capOverride||sc.cap;
  let body=pitch();
  sc.items.forEach(o=>{ body+= o.t==='raw'?o.svg:item(o); });
  return `<figure class="scene" id="${id}"><div class="scene-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cap}">${body}</svg><button class="pp" type="button" aria-label="Pause animation" data-for="${id}"><span class="i-pause"></span></button></div><figcaption>${cap}</figcaption>${keyHTML(sc,name)}</figure>`;
};
})();

 else if(f==='P'){const i=route(RP,txt,(idx+ch*2)%PASS.length);items.push(...PASS[i](s,b,R,idx));}

// Closing-circle motivation and morale tips (psychology). [title, what to do and say, why it works]
const TIPS=[
 ['Name the effort','Pick three children and say one specific effort each made ("you kept trying with your weaker foot"). Praise the effort, not the result.','Praise for effort and strategy builds persistence; praise for talent can make children avoid challenges.'],
 ['Shout-outs','Each child gives one teammate a shout-out ("thanks for passing to me"). Start by modeling one.','Appreciation from peers builds belonging, the strongest driver of staying in a team.'],
 ['Mistake of the day','Share one mistake you or a child made today and what it taught. Say "mistakes are how we grow".','Normalizing mistakes lowers fear of failure, so children try harder skills.'],
 ['The power of not yet','When a child says "I cannot do it", answer "not yet". Have the whole group say it once together.','Not-yet language supports a growth mindset: ability is something you build.'],
 ['We did it together','Share one team number ("we made 20 passes, we all touched the ball"). Cheer as a group.','Shared success builds team identity and moral beyond individual results.'],
 ['Goodbye by name','Say each child\'s name with a high five and eye contact as they leave. No one is skipped.','Being seen and named tells a child they matter to the group.'],
 ['Choose tomorrow','Offer two games and let the group vote for one to open the next practice.','Small choices satisfy the need for autonomy and raise motivation.'],
 ['Butterflies are normal','Say that everyone feels nervous sometimes, and brave means trying anyway. Ask who tried something a little scary today.','Naming feelings reduces their power and makes trying safe.'],
 ['Spot the brave try','Tell a short story of a brave attempt today, even if it did not work.','Rewarding courage keeps children taking healthy risks.'],
 ['End on a win','Finish the circle by recalling something the whole group did well today.','People remember how an experience ended; a positive ending raises the wish to return.'],
 ['Thank you','Thank the children for listening, helping and trying. Invite them to thank a teammate or a parent who brought them.','Gratitude builds warmth and a positive culture.'],
 ['Look how far we have come','Remind them of something they could not do at the start of the season and can do now.','Seeing progress builds a sense of competence, a core motivator.'],
 ['Kindness spotlight','Name one kind act you saw (helping someone up, sharing a ball). Cheer it as loudly as a goal.','What the coach celebrates becomes what the team values.'],
 ['Three calm breaths','Take three slow breaths together before leaving: smell the flower, blow the candle.','A calm end helps children regulate big feelings after intense play.'],
 ['Something to look forward to','Give a teaser for next practice ("next time we will play a new game").','Anticipation builds excitement and attendance.'],
 ['A quiet word','Take one child aside for a private, specific compliment. Choose someone who has not had one lately.','Private praise feels genuine and protects quieter children.'],
 ['Team promise','Say the team promise together: safe, kind and listening. Ask which one we showed best today.','Shared rules said aloud strengthen group norms.'],
 ['Win or lose, we learn','After a game, ask what we learned, not who won. Keep the score out of the circle.','Focusing on learning protects motivation after a loss.'],
 ['Include everyone','Check your own list: has every child been praised this week? Give a specific compliment to anyone missed.','Every child needs a regular signal that they are valued.'],
 ['Tiny home challenge','Give one tiny challenge to try at home with family (10 toe taps, balance for 5 seconds). Ask them to tell the group next time.','Small, achievable challenges build confidence and connect family to the team.'],
 ['I believe in you','Tell the group one thing you believe they can do by the end of the season.','High, kind expectations raise effort and confidence.'],
 ['Compare with yourself','Ask each child to name one thing they do better than at the start of the season. No child compares with another.','Self-comparison protects motivation at the age when children start to notice who is faster or better.'],
 ['Fun first','Ask the group what was the most fun part of today. Cheer it. Note it for next time.','Young players rank trying your best, working hard and playing well as a team above winning (Visek and colleagues).'],
 ['Leader thank-you','Thank the leader of the day for one specific thing, and let the group add one.','Specific thanks tell children that service to the team is valued.'],
 ['Courage count','Ask who tried something they were not sure about. Count the brave tries together.','Naming courage makes risk-taking normal and keeps children trying new skills.'],
 ['Mood check','Ask for a thumbs up, middle or down on how they feel. Thank honest answers.','Giving feelings a place at the end lets children leave settled.'],
 ['Highs and lows','Each child shares one high (best moment) and one low (hardest moment) from today. Thank every answer.','Naming a hard moment next to a good one builds emotional skill and trust.'],
 ['Pass the compliment','Start a compliment and pass it around the circle by tossing a ball; the catcher adds a new one.','Peer appreciation spreads belonging and makes praise a group habit.'],
 ['What I learned from a friend','Ask each child to name one thing they learned from a teammate today.','Seeing teammates as teachers strengthens cooperation and respect.'],
 ['Strong body, strong mind','Ask: “What did you do today when it got hard?” Celebrate staying with it.','Linking effort to perseverance builds resilience.'],
 ['Rate your effort','Hold up one to five fingers for how hard you tried. Tell the group that five is about trying, not about winning.','Self-rating of effort puts the focus on what children control.'],
 ['Secret helper','Name a child who helped someone today without being asked. Ask the group to guess how it helped.','Spotlighting quiet kindness rewards prosocial behavior.'],
 ['Goal for the week','Each child states one small goal for the next practice and tells a buddy.','Specific short goals raise a sense of control and commitment.'],
 ['Surprise thanks','Thank a parent, a helper or the field with a group cheer.','Gratitude expands the circle of belonging beyond the team.'],
 ['Team heartbeat','Everyone claps the same slow rhythm for ten seconds, then speeds up and stops together.','Moving in sync builds closeness and a calm, shared ending.'],
 ['Pride moment','Ask: “What are you proud of today?” Allow a pass.','Pride from effort strengthens intrinsic motivation.'],
 ['Fix it forward','Ask: “What would you do differently next time?” Let each child answer with one action.','Looking forward after a mistake keeps it from sticking.'],
 ['Role model','Name a way someone showed good sportsmanship. Ask the group to copy it next time.','Describing models gives children a clear picture to follow.'],
 ['I noticed','Say “I noticed…” and give a detail about three children (a smile, a try, a kind word).','Specific noticing says every child is seen.'],
 ['Fun rating','Ask for a fun rating with a thumb. Ask what made it a thumbs-up.','Fun is a top reason children keep playing, so check it.'],
 ['Take a bow','Each child takes a small bow while the group cheers.','Silly celebration reduces fear of attention and shares joy.'],
 ['Team promise check','Ask which promise was strongest today and which needs help.','Revisiting group rules keeps them alive.'],
 ['Calm landing','Ask children to sit and take five slow breaths, counting on their fingers.','A short breathing routine helps children settle before they leave.'],
 ['Letter of the day','Pick a letter and ask for a team word that starts with it (for example: “brave”, “bold”).','Positive words become part of the team language.'],
 ['Mistake museum','Show a funny “mistake” you made and explain what you learned. Invite one volunteer to share.','Adults modeling mistakes lowers fear.'],
 ['High five line','Children line up and give each other a high five and a name.','Physical connection and names strengthen belonging.'],
 ['Show and tell a skill','One child shows a skill they worked on at home. The group cheers.','Practice at home is celebrated and spreads.'],
 ['Brave breath','Say: “When I feel nervous, I breathe in for three and out for three.” Do it twice.','A simple breathing tool gives a skill for stress.'],
 ['Next practice vote','Offer two warm-up games and let the group vote.','Choice supports autonomy and anticipation.'],
 ['Thank your partner','Pairs thank each other for one thing they did well together.','Two-way thanks builds friendships.'],
 ['Mirror the smile','Ask children to smile at the child next to them and pass it around.','Shared smiles lift mood and group feeling.'],
 ['Silent cheer','Everyone cheers with no sound, using hands and faces. Then the loud cheer.','Playful contrast keeps the ending light.'],
 ['Growth story','Tell a one-minute story about a player who learned a hard skill step by step.','Stories show that skill grows with practice.'],
 ['Equal voices','Go around the circle so every child can speak for ten seconds. Pass is allowed.','Equal turns say every voice counts.'],
 ['Kind challenge','Challenge everyone to do one kind thing before the next practice.','Kindness tasks spread the team culture beyond practice.'],
 ['Energy gauge','Ask: “Battery low, medium or full?” Remind everyone to rest.','Naming energy teaches self-awareness and rest.'],
 ['Best teammate move','Name a teamwork move you saw (a pass, a shout, a switch) and cheer it.','Praising teamwork actions sets the standard.'],
 ['Silent thanks','Think of one person who helped you, and give them a silent thank you. Then share if you want.','Quiet reflection deepens gratitude.'],
 ['Hope for tomorrow','Ask: “What do you hope to get better at next time?”','Expressing hope keeps motivation forward-looking.'],
 ['Tough but fair','Praise the group for playing hard and fair. Ask for one example of each.','Naming both sets a balance between competing and caring.'],
 ['Your story, your number','Remind each child of their own personal best and ask for a next target.','Progress against yourself builds competence.'],
 ['Everyone wins a moment','Make sure every child hears one specific win from today before they leave.','Equal recognition protects belonging.'],
 ['Smile and wave','Count down from three, then everyone smiles and waves to the group.','A joyful ritual makes goodbyes positive.'],
 ['Learning detectives','Ask: “What did you discover today?” Accept any answer.','Curiosity as a goal makes mistakes part of the game.'],
 ['Helping hands','Ask children to show with their hands how they helped (a high five, a pat, a pass).','Embodied recall makes kindness concrete.'],
 ['One word','Each child says one word about how they feel. No explaining.','A one-word check is quick and safe.'],
 ['Coach admits','Say something you learned from the children today.','Reversed learning shows respect and builds trust.'],
 ['Team pride chant','Create a new line for your team chant and say it together.','Shared words build identity.'],
 ['Stand tall','Everyone stands tall for three seconds as the “team of the day”.','Posture shapes feeling and closes with confidence.'],
 ['Gratitude pass','Pass a ball: whoever holds it says one thing they are thankful for.','Gratitude practice raises mood.'],
 ['Bright side','Ask: “Name one good thing from a hard moment today.”','Reframing builds optimism.'],
 ['Ready for next time','Ask: “What will help you be ready next time?” (sleep, water, shoes).','Preparation habits build independence.'],
 ['Cheer for effort','Give a group cheer for the hardest-working moment of the day.','Celebrating effort over outcome keeps all children included.'],
 ['Together tower','Everyone puts a hand in the middle, counts to three and lifts.','A shared physical ritual closes the session as a team.']
];

function festival(k,day){

 }

 return {s:'F'+k,festival:true,k,week:w,day,total:t,blocks,equip:'Cones, balls, bibs, small goals, assessment sheets, tally sheets, whistle, certificates',check:'Check: record Yes, Almost or Not yet for each skill.',chapter:null,term};
}

 the receiver. The receiver looks over the shoulder, then takes the pass and turns away from the defender. The receiver then passes the ball within 3 seconds.", "4.10": "Set up two lines of defenders 5 yards apart. The receiver moves into the space between the two lines. The receiver takes one touch and then passes through or around the defenders.", "4.11": "Mark a zone in the middle with discs, between the defenders and the attackers. Play 6 v 6 with pop-up goals. Attackers must receive the ball in the zone and turn before passing forward. Defenders may pressure only after the first touch.", "4.12": "Players use one touch to set the ball past a mannequin and a second touch to pass. On some balls, the coach calls \"first time\", and the player must pass with one touch.", "4.13": "Four corners each hold a 1 v 1 with a cone gate nearby. The receiver stops the pass, turns and sprints through the gate. The defender starts chasing only after a count of 2. Rotate roles after each try.", "4.14": "Play 7 v 7 with pop-up goals and mannequins. A player who gets a pass under pressure must stop it with one touch and pass within 3 seconds. If not, the other team gets a free kick.", "4.15": "A server plays a high ball, and then a hard low ball, to a receiver. The receiver stops each one with the best part of the body or foot. Then the receiver turns around a mannequin and passes on.", "4.16": "A server passes the ball in, and two players race for it. The player who controls it first takes it, turns and passes through a gate. The other player defends and tries to win the ball. Swap roles after each try.", "4.17": "Play 7 v 7 with pop-up goals and mannequins. In the attacking third, every goal must come after a controlled first touch and a quick turn. Referees show signals for handball and free kicks.", "5.0": "Partners stand 15 yards apart with a hoop in front of each of them. They drive passes along the ground with the laces, aiming for the hoop in front of the partner. After 5 clean passes in a row, they move back to 20 yards.", "5.1": "Partners stand 10 yards apart with a cone or mannequin in between. They pass the ball in a short high arc over it. The receiver lets the ball bounce once, then passes back along the ground.", "5.2": "Play 5 v 5 with pop-up goals and passing arcs. A goal counts only after one pass of more than 12 yards or through a passing arc. Take the kick-off from your own half.", "5.3": "The receiver either waits at a disc or runs along a lane. The passer chooses a soft pass for a partner who is waiting, or a firm pass for a partner who is running. The passer says which one before passing.", "5.4": "One partner passes against a rebound board from 12 yards, and later from 16 yards. The partner stops the ball coming back with one touch, then passes to the other partner, who repeats.", "5.5": "Play 6 v 6 with pop-up goals and a hoop in each half. A team can score only after a pass through a hoop or a pass longer than 15 yards. A pass between two defenders that gets a teammate past them earns a bonus point.", "5.6": "A player kicks a high pass 12 yards so it lands in a hoop. The partner catches it on the foot or chest with a soft touch, and kicks it back. Use cones to mark the lane.", "5.7": "Set two mannequins as a gap. The passer plays a pass between them to a runner. The runner starts running at the moment the pass is played, and takes the ball while still moving.", "5.8": "Play 6 v 6 with pop-up goals. Set two pairs of mannequins in the middle, each pair making a gate. Every attack must pass the ball between a pair to a running teammate. Only then may the team shoot.", "5.9": "A passer drives the ball hard along the ground 18 yards to a partner. At the same time, a defender runs in from the side. The partner stops the ball and passes it back within two touches.", "5.10": "Three players stand on each side of the grid and pass among themselves. When the coach calls \"switch\", a player makes one long pass to the far side. The receiver stops the ball.", "5.11": "Play 6 v 6 with pop-up goals. A goal counts only after a pass to the far side or a high pass. A soft pass to a waiting teammate or a firm pass to a running teammate earns a bonus.", "5.12": "Three players make a triangle with hoops as targets. One player passes into a hoop, then runs after the pass. The third player always moves to a spot where a teammate can pass to them.", "5.13": "A passer plays the ball through a passing arc to a runner. The runner dribbles past a mannequin and passes to the next player in line. The next passer goes when the coach calls, and everyone rotates a spot.", "5.14": "Play 7 v 7 with pop-up goals and mannequins. A team can score only after at least 6 passes in a row. One of the passes must be a high pass or a pass between defenders. A handball gives the other team a free kick.", "5.15": "A passer plays the ball to a runner through two mannequins, while a live defender chases from behind. The runner stops the ball and passes it to a target player. Rotate the jobs after each try.", "5.16": "Two teams of 4 play keep-away in a square, with hoops and discs marking the sides. A pass of 15 yards to the far side counts 2 points. A pass between two defenders also counts 2 points.", "5.17": "Play 7 v 7 with pop-up goals and a passing arc in each half. A pass through an arc earns a bonus. The keeper starts attacks with a throw or a short pass, and goal kicks are taken with the ball on the ground.", "6.0": "Players take turns shooting from 12 yards into a pop-up goal. Discs mark the two corners as targets. Each shot is hit with the laces, the top part of the foot. After each shot, the next player goes.", "6.1": "A partner tosses a soft ball so it bounces once. The shooter kicks it with the laces right after it bounces. The shooter aims into a mini goal marked by cones.", "6.2": "Play 5 v 5 with pop-up goals. Every attack must end in a shot within 8 seconds. A goal scored from a half-volley (kicked just after a bounce) or a first-time shot counts double.", "6.3": "A crosser plays a low ball through a target gate. A finisher runs to the near post and shoots first time at the pop-up goal. The finisher starts running as the crosser kicks.", "6.4": "Players shoot into a corner of a target net, first with the inside of the foot and then with the outside. Before each shot, the player says out loud which corner is the target.", "6.5": "Play 6 v 6 with pop-up goals and target gates. A goal counts double if it comes right after a cross through a target gate. If the attackers miss over the end line, the defending team takes a goal kick.", "6.6": "A striker faces a keeper from 12 yards. The striker looks at the keeper, then chooses to shoot at a corner or dribble around the keeper. The striker says the choice out loud.", "6.7": "A striker shoots at the pop-up goal. A rebound board stands behind the goal and bounces the ball back out. A second striker runs in and shoots it first time. Then the two strikers swap places.", "6.8": "Play 6 v 6 with pop-up goals. A goal scored from a half-volley or a first-time shot counts double. After the ball crosses the side line, the other team restarts with a throw-in.", "6.9": "A winger runs to the end line and passes the ball back toward the middle. A finisher runs in from the middle and shoots first time at the pop-up goal. A mannequin guards the near post.", "6.10": "A player dribbles past a mannequin, then shoots from 14 yards into a corner of the target net. A hard shot into a corner earns 2 points, and any other goal earns 1 point.", "6.11": "Play 6 v 6 with pop-up goals. Set one target gate on each wing. A goal that follows a cross, a cutback or a half-volley counts double. A handball gives a free kick to the other team.", "6.12": "A player receives a pass in a corner zone and shoots within 2 touches. The defenders start late, so the attacker has time and must shoot quickly. Groups of 5 take turns.", "6.13": "A crosser plays the ball through a target gate. A finisher shoots, and the rebound board sends the ball back. A second finisher shoots again. Three attackers make a chain of crosser and two finishers.", "6.14": "Play 7 v 7 with pop-up goals. Every attack must end with a shot within 8 seconds. Goals from crosses, cutbacks and half-volleys count double. Set target gates on the wings for crosses.", "6.15": "A striker receives a pass, dribbles past a mannequin and tries to score against a keeper. A chaser starts running after a count of 2. The striker may dribble or shoot.", "6.16": "A player shoots at a target net from 14 yards. Before each shot, the player calls out which corner. Each time the ball goes in the called corner, the player earns a point on a private card.", "6.17": "Play 7 v 7 with pop-up goals. Goals that come from a cross, a cutback or a half-volley count double. Referees use all the signals. The keeper restarts play with the ball on the ground.", "7.0": "Four players use a 20 x 15 yard grid marked with discs. One passer plays the ball to a receiver while two defenders stand nearby. If the receiver takes a heavy touch and the ball bounces away, the nearest defender runs at the ball. The second defender stands a few steps behind to back up the first. Defenders wait for that heavy touch before they move.", "7.1": "Mark two lines of discs 15 yards apart inside the 25 x 20 yard area. Six defenders walk between the lines as one tight group. The coach moves a ball to the left or the right. The whole group walks across to that side together and keeps the gaps between players small.", "7.2": "Play 5 v 5 with a pop-up goal at each end of the 30 x 20 yard area. When your team loses the ball, everyone chases it hard for 5 seconds. If the ball is not won back, run back to get between the ball and your goal. If you do win it, score by dribbling or passing through a 2-yard cone gate.", "7.3": "Two pairs share the 25 x 15 yard area, one pair at a time. The attacker dribbles away toward a cone goal. The defender starts 3 yards behind, sprints back to get between the attacker and the goal, then turns to look at the ball. After each try, the pair swap jobs.", "7.4": "Work in pairs in a 15 x 10 yard area, with a mannequin standing at one end. The attacker walks toward the mannequin with the ball. The defender stays on their feet and either blocks the ball with the inside of the foot or pokes it away. No sliding. Swap jobs after a few tries.", "7.5": "Play 6 v 6 with a pop-up goal at each end and discs marking the sidelines. A team may only run at the ball when the other team takes a heavy touch, passes backward, or the ball gets close to the sideline. Until then, defenders stay back in a tight group. Win the ball with a fair block, never by holding or tripping.", "7.6": "In a 20 x 20 yard square, three defenders make a triangle around the ball while the coach moves it. One defender runs at the ball. One stands behind that player to back them up. The third stands on the far side to watch for a long pass. Swap jobs when the whistle blows.", "7.7": "Use cones to mark a lane 25 yards long. An attacker dribbles down the lane with the ball. The defender starts a few yards behind, sprints back to get between the attacker and the goal, and slows the attacker for 3 seconds without diving in. Then a teammate runs in from the side to help.", "7.8": "Play 6 v 6 with a pop-up goal at each end. When your team defends, all of its players must stay inside a zone 20 yards long, marked with discs. If a team scores while the other team has players outside that zone, the goal counts as 2 goals.", "7.9": "Line up mannequins as a wall in front of a goal, and have the defenders stand behind it as for a free kick. The coach shows different hand and arm touches, some on purpose and some by accident. Players shout handball only when the touch was on purpose.", "7.10": "Play 2 v 2 in a 20 x 20 yard square with a cone gate at one end. The attackers try to pass the ball through the gate. One defender runs at the ball and the other stands behind to back them up. After 5 seconds, the two defenders swap jobs.", "7.11": "Play 6 v 6 with a pop-up goal at each end. Wide players pass crosses into the middle through a cross gate. The nearest defender goes to the player crossing. The other defenders guard the near post and the middle. The keeper shouts when taking the ball.", "7.12": "Mark a sideline zone with discs. Three attackers pass the ball while three defenders stand together and guide the ball toward that zone. When it arrives, two defenders close in from two sides to win the ball or make the attacker pass backward. The others stay close.", "7.13": "The coach kicks the ball away to start each round. All 5 players sprint back to get between the ball and their goal. One player runs over to back up a teammate. Then one player does a block tackle on a mannequin with the inside of the foot. The group walks back to the start.", "7.14": "Play 7 v 7 with a pop-up goal at each end. When a team wins the ball, it has 5 seconds to score. The other team must run back and bunch up close together in 5 seconds. Keep all players on the field and play on after each goal.", "7.15": "Play 3 v 3 in a 30 x 20 yard area, with a line of mannequins behind the defenders as their goal line. The 3 defenders work together. One runs at the ball, one backs up that player, and one guards the far side. If they win the ball, they pass it to the coach, who is the target player.", "7.16": "Play 2 v 2 in a 20 x 20 yard square. When a team loses the ball, it has 3 seconds to win it back. One player runs at the ball while the other backs up. A fair block with the inside of the foot counts as winning the ball.", "7.17": "Play 7 v 7 with a pop-up goal at each end. When defending, each team keeps all its players inside a 20-yard zone marked with discs. Players run at the ball only after a trigger, like a heavy touch. A team earns a bonus point if it wins the ball and passes forward within 5 seconds.", "8.0": "Place four discs in a diamond shape inside the 20 x 15 yard area. Four players pass the ball around the discs. The player who supports the ball carrier stands 3 to 5 yards away at an angle, never in a straight line with the ball.", "8.1": "Use channel lines to mark a wide lane along each sideline. Two wingers stay in the wide lanes while 3 central players pass in the middle. When a winger gets the ball, the winger dribbles down the lane or crosses the ball into the middle.", "8.2": "Play 5 v 5 with a pop-up goal at each end and a wide lane along each sideline. A team must pass to a player in a wide lane before it can shoot. A teammate who stands at an angle to help the ball carrier earns a bonus point.", "8.3": "Two defenders stand in the middle of the 25 x 15 yard area. A deep player stands ahead of the ball, between the two defenders, and shows for the pass. The ball carrier passes forward to that player. If nobody shows, the carrier passes backward instead.", "8.4": "Set two mannequins 3 yards apart as a gate. The ball carrier dribbles or passes through the gate. A teammate runs past the gate into the open space behind it and receives the ball. The group then rotates jobs.", "8.5": "Play 6 v 6 with a pop-up goal at each end and wide lanes along the sidelines. Each team must keep a player in each wide lane and one player further forward than the ball. A goal scored right after a pass to the far side of the field counts as 2 goals.", "8.6": "Mark spots with discs in the 25 x 18 yard area. Player A passes to B and runs forward to get the ball back (a wall pass). Then C runs around the outside of the ball carrier to receive (an overlap). Everyone moves to a new spot, and the next player starts.", "8.7": "Play 4 v 3 inside a square, with a cone gate on each far side. The 4 attackers keep the ball away from the 3 defenders. When the defenders squeeze to one side, pass to the free player on the far side. That player dribbles through a gate to score.", "8.8": "Play 5 v 4 with a pop-up goal at each end. The extra attacker is always the player farthest from the ball. A goal scored after a pass to the far side counts as 2 goals. The defenders may only run at the ball after a trigger, like a heavy touch.", "8.9": "One ball carrier is chased by a defender in the 25 x 20 yard area. Two supporters move to angles, not straight lines, to help. Mannequins stand in the area as obstacles. The carrier passes to the supporter with the better open angle.", "8.10": "Set up a line of mannequins with a gap in the middle. The passer looks up. A runner waits behind the mannequin line, then runs through the gap as the pass is played. The passer follows the pass forward.", "8.11": "Play 6 v 5 with a pop-up goal at each end and wide lanes. The 6 attackers spread wide, keep a player ahead of the ball, help each other, and shoot quickly. The coach stops the game once and asks which idea the attackers just used.", "8.12": "Make two groups of 3. One group plays a quick move, like a wall pass or an overlap run. Then a runner dashes into the open space behind and shoots into a small goal made with two discs.", "8.13": "Eight players pass the ball from side to side. After every second pass, the next pass goes to the far side. The wide players stay in their lanes marked by channel lines. When a gap opens, one runner attacks it.", "8.14": "Play 7 v 6 with a pop-up goal at each end and wide lanes. Before each attack, the coach names the extra player. A team can only score after using the wide lanes, a player ahead of the ball, and a pass to the far side.", "8.15": "Set two lines of mannequins in front of the goal as defenders. Before each try, the attackers pick one idea, like width or support. Then they pass through, dribble around, or chip the ball over the mannequins. They finish with a shot.", "8.16": "The passer plays to a wall player, who passes it straight back with one touch. A third attacker runs into the open space behind and receives that return pass. Then everyone swaps jobs for the next round.", "8.17": "Play 7 v 7 with a pop-up goal at each end and wide lanes. Before shooting, a team must use the wide lanes, a player ahead of the ball, and a pass to the far side. A goal after all three counts as 2. Offside is only called in the last 14 yards.", "9.0": "Seven children each wear a position bib. They walk to the spots on the tactics board for the goalkeeper, defenders, midfielders, wingers and forward. Then the group says what each job is in one sentence.", "9.1": "Use cones to mark three lines: back, middle and front. Players stand in the lines and pass the ball from line to line. The receiver says the name of their line and their job before passing on.", "9.2": "Play 5 v 5 with a pop-up goal at each end. Each player wears a position bib and plays that job for one half. Start with a kick-off in your own half. At half time, switch bibs and play your new job.", "9.3": "A defender wearing a back bib follows an attacker down a lane marked by mannequins. The defender stays between the attacker and the goal. When the defender wins the ball, they pass to a midfielder to start an attack.", "9.4": "Set two discs as a gate. A defender passes to the midfielder, who stands between the discs. The midfielder turns and passes to the forward. Then the midfielder moves to a new spot at an angle to help again.", "9.5": "Play 6 v 6 with a pop-up goal at each end. Every player has a position. When the coach blows the whistle, everyone moves to the next position on the rotation chart. The game keeps going without stopping.", "9.6": "A winger stays in the wide lane. A midfielder passes the ball to the winger. The winger plays a low cross, a pass along the ground into the middle, to a forward. The forward runs to the near post, the post closest to the ball, and shoots into a cone goal.", "9.7": "A forward stands with their back to the goal and a mannequin close behind. A teammate passes to the forward, who shields the ball and passes it back to a midfielder. If the other team gets the ball, the forward sprints to chase it right away.", "9.8": "Play 6 v 6 with a pop-up goal at each end. Use channel lines to split the field into back, middle and front zones. In the first half, players stay in their own zone. A player may leave it after a pass to a teammate in the next zone. A goal does not count if the shot came from outside the lines.", "9.9": "The goalkeeper and the defenders stand in a line in front of the goal. The coach moves the ball left and right. The defenders slide across together. The keeper shouts left, right, line up, or man on, which means an attacker is close.", "9.10": "Two midfielders take turns in a circuit marked with discs. One wins the ball from the coach. Then they pass forward through the lines to the forward. The other midfielder moves to an angle to support. Rotate jobs so everyone tries each one.", "9.11": "Play 7 v 7 with a keeper and six field players in a 2-3-1, which is 2 defenders, 3 midfielders and 1 forward. Before the kick-off in your own half, every player says their job aloud. The coach pauses the game once and asks, what is your job now?", "9.12": "A winger gets the ball in the wide lane and plays a low cross. The forward shoots at the pop-up goal. The second winger and a midfielder run in for any rebound. After each attack, the group rotates positions.", "9.13": "Two defenders and two midfielders start with the ball at the back. Two forwards run at them to win it. The team passes through the lines of players to a target forward at the far end.", "9.14": "Play 7 v 7 with a pop-up goal at each end. The game has three rounds. In each round, every player plays a different position, and the keeper rotates too. Use the rotation chart on the tactics board to see who goes where.", "9.15": "Pass the ball through a defender, then a midfielder, then a winger or forward. Each player does their job with a mannequin close by as pressure. Then the group finishes with a shot.", "9.16": "Play a small game with two cone goals. When the coach holds up a card, players swap jobs. Each player says the new job aloud and starts playing it right away.", "9.17": "Play 7 v 7 with every position named. Switch positions at half time. Referees show signals for substitutions and handball. After the game, the team explains each job to the coach in a few words. Keep the positions the same until half time.", "10.0": "Seven players place discs where each position goes in the 2-3-1 shape on the tactics board. They walk to their discs. The coach moves the ball left and right. The team moves together and keeps the same shape.", "10.1": "The group walks through four parts of a game: build-up (starting from the back), attack, defend and transition (when the ball is lost or won). The coach shouts a part. The group walks to the right place on the field and says its job.", "10.2": "Play 5 v 5 with a pop-up goal at each end. Each team has 2 defenders, 2 midfielders and 1 forward. The keeper starts each attack by rolling the ball out. Players say the phase aloud: build, attack, defend or transition. Kick-off is in your own half.", "10.3": "Defenders wait for a trigger. It is a heavy touch, a back pass, or the ball near the sideline. Then they all run at the ball together. When the ball is passed away, they move back into a tight group.", "10.4": "The keeper starts the attack with a throw or a pass on the ground to a back player. That player passes to a midfielder. Two forwards chase the ball. The team passes around them.", "10.5": "Play 6 v 6 with a pop-up goal at each end. Substitutes swap in at the halfway line when the ball is out of play. After each goal, the captain moves the team's shape on the tactics board.", "10.6": "Seven players stay inside a zone 20 yards long, marked with a line of discs. The coach passes a ball from one side to the other. The players squeeze together and slide across with the ball. They keep the gaps between them small.", "10.7": "A team wins the ball from the coach. It then has 5 seconds to pass forward and shoot at a cone goal. The other team must run back and bunch up close together in 5 seconds.", "10.8": "Play 7 v 7 with a pop-up goal at each end. Each team lines up as 2-3-1 or 3-2-1 (defenders, midfielders, forward). Run at the ball only after a trigger, then drop back into a tight group. A goal scored within 5 seconds of winning the ball counts as 2.", "10.9": "Seven players start with the ball at the back. They face three mannequins and one live defender. They pass through or around them to a target forward at the far end.", "10.10": "Use discs to mark the third of the field nearest the team's goal. The team defends there in a tight group and runs at the ball together to win it. When they win it, they pass forward quickly.", "10.11": "Play 7 v 7 with a pop-up goal at each end. Before the game, each captain picks one plan, like chasing the ball after a back pass, and shows it on the tactics board. At half time, each captain makes one change. The referee explains one call per half.", "10.12": "Eight players place discs where each position goes in a 3-3-1 or 2-3-2 shape, with seven field players and a keeper. They walk to their discs. Then they move together as the ball moves.", "10.13": "Set up four stations with cones: build, attack, defend and transition. The team stands at one station. The coach calls out a phase. The team has 5 seconds to move to the right station and take that shape.", "10.14": "Play 8 v 8 with a pop-up goal at each end. Each team lines up as 3-3-1 or 2-3-2, with seven field players and a keeper. The coach pauses the game once and asks, what phase is it, and what is your job?", "10.15": "Seven players try to keep the ball against eight defenders. The eighth defender is a mannequin. The team waits for a trigger, passes around the mannequin, and keeps a tight shape. They counter-attack when they win the ball.", "10.16": "The team wins the ball and starts a counter-attack. It makes three passes forward in 5 seconds. If it fails, everyone sprints back into a tight group within 5 seconds.", "10.17": "Play 8 v 8 with a pop-up goal at each end. Each team has a plan and makes one change at half time. Substitutes swap in at the halfway line. After the game, players answer three review questions.", "11.0": "The keeper stands ready in a pop-up goal, with a crash mat behind it. A shooter dribbles toward the goal. As the shooter gets closer, the keeper steps out to make the goal look smaller. Then the keeper saves the shot.", "11.1": "A server throws a tennis ball to the keeper at chest and head height. The keeper catches it with a W grip. That means hands make a W shape, with thumbs together behind the ball. A crash mat sits behind for safety.", "11.2": "Play 5 v 5 with a keeper in each goal. Before each corner and free kick, the keeper tells teammates where to stand. If the keeper catches the ball and throws it to a free teammate, the team earns a bonus point.", "11.3": "Place discs in an arc in front of the pop-up goal. A shooter takes a turn at each disc. The keeper moves along with the ball and steps out to make the goal look smaller. Then the keeper stays set for the shot.", "11.4": "A crosser kicks a soft cross through a cross gate toward the goal. The keeper steps toward the ball and catches it high with a W grip. Then the keeper pulls the ball in to the chest.", "11.5": "Play 6 v 6 with a keeper in each goal. The keeper must start every attack by throwing or passing on the ground to a free teammate. If a teammate passes back to the keeper with a foot, the keeper may not pick it up.", "11.6": "The keeper dives to one side onto the crash mat. Then the keeper gets up fast and gets set. A shooter takes a second shot from the other side. The keeper faces it, then swaps with a teammate.", "11.7": "A shooter strikes low shots at the mini cage from 5 yards, marked with a disc. The keeper stands in front of the cage. The keeper blocks the shots with a leg or foot and stays on their feet.", "11.8": "Play 6 v 6 with a pop-up goal at each end. Teams cross the ball through cross gates and take corners. The keeper catches crosses, shouts keeper, and throws to a free player. After a saved shot, the attackers get a corner.", "11.9": "A server crosses a tennis ball toward the goal. A mannequin stands in front of the keeper. The keeper reaches high over the mannequin, steps through, and catches the ball. Then the keeper pulls it in.", "11.10": "A shooter shoots from an angle with mannequins guarding the goal. The keeper saves the shot with a hand or a foot. Then the keeper gets up and saves a second shot from the other side.", "11.11": "Play 7 v 7 with a pop-up goal at each end. The keeper must start every attack with a pass on the ground, no long kicks from the hands, to a back player. A team earns a bonus point for making three passes before the halfway line.", "11.12": "Place a wall of mannequins in front of the goal for a free kick. The keeper shouts left, right or line up to place the wall. Then the keeper steps over to cover the near post, the post closest to the ball. A shooter tries to score.", "11.13": "A teammate plays a long pass behind the defender. The keeper runs out early. The keeper clears the ball with the feet or catches it with the hands when it is safe.", "11.14": "Play 7 v 7 with a keeper in each goal. Keepers tell teammates where to stand for corners and free kicks. Every attack starts with a throw or a pass on the ground. Keepers may not pick up a back pass from a teammate's foot.", "11.15": "Place a cone 9 yards from the goal as the penalty spot. A shooter takes a penalty. The keeper stays on the goal line until the kick, then dives to a side or stays in the middle. After each try, the keeper explains the choice.", "11.16": "A crosser sends a ball through a cross gate. The keeper catches it and throws it to a target player. Then the keeper quickly gets set to face a shot. After each round, players rotate roles.", "11.17": "Play 7 v 7 with a pop-up goal at each end. Keepers use hands and feet, catch crosses, and start attacks with passes on the ground. Keepers also tell teammates where to stand on corners and free kicks. Referees check the back-pass rule and the eight-second limit.", "12.0": "Set a line of flags to mark the second-last defender. Attackers walk with the ball. When a pass is played, check whether a teammate is closer to the goal than the flag line. Call offside only if that player touches the ball.", "12.1": "Practice a throw-in. Hold the ball with both hands and throw it from behind and over the head, with both feet on or behind the line. Then the coach stops play. The ball is dropped for one player, and the referee says which team gets it.", "12.2": "Play 5 v 5 with a pop-up goal at each end. One player at a time is the referee and uses the full signals. The referee raises a flag for offside in the last 14 yards. Each team explains one call per half.", "12.3": "The coach shows different hand and arm touches. The group decides if each touch was on purpose. If it was, they call handball and take a free kick from that spot. A mannequin stands in as a defender.", "12.4": "The referee calls each free kick as direct or indirect. Arm up means indirect. A mannequin wall stands back from the ball. On a direct kick, the taker may shoot. On an indirect kick, the taker must pass to a teammate first.", "12.5": "Play 6 v 6 with a pop-up goal at each end. A player acts as referee and calls handball and free kicks. The referee also lets play go on when the fouled team still has the ball (advantage). Teams earn a fair-play point for honest calls.", "12.6": "Plan a corner on the tactics board with a taker, a runner and a stayer. Then run it. The taker plays the ball short to a nearby teammate or long into the middle. Each player says their job aloud before the corner is taken.", "12.7": "The attackers pick a shooter, a runner and a passer for a free kick over a mannequin wall. The keeper tells the wall where to stand. The taker calls the plan before the kick.", "12.8": "Play 6 v 6 with a pop-up goal at each end. In each half, each team plays one corner, one free kick and one throw-in routine (a planned move). The team explains it in one sentence. A goal from a routine counts as 2.", "12.9": "The coach plays a pass. The group calls offside only if the offside player touches the ball, blocks the keeper's view, or challenges a defender. Otherwise, everyone plays on. Take turns being the one who makes the call.", "12.10": "A referee watches a challenge inside the penalty area and decides if it is a foul. If it is, the team gets a penalty from 9 yards. The group then talks about the call and the card sign.", "12.11": "Play 7 v 7 with a pop-up goal at each end. A rotating referee makes offside, handball and free kick calls. Teams use planned set plays. After each call, the team explains it.", "12.12": "Practice three restarts. For a kick-off, all players stand in their own half. For a substitution, the new player enters at the halfway line after the ball stops. For a dropped ball, the coach drops the ball for one player.", "12.13": "Attackers take a short or a long corner. Defenders organize with a keeper call, and each one marks an attacker. Both teams then explain what they did. Each team gets a turn to attack and defend.", "12.14": "Play 7 v 7 with a pop-up goal at each end, with referees and the full offside rule. In each half, each team plays three set plays (planned moves) and explains them.", "12.15": "A rotating referee runs a fast 4 v 4 while the rest of the group watches. The referee makes offside, handball and free kick calls. The referee explains each call in one sentence.", "12.16": "The attackers run a corner, a free kick and a throw-in, one after the other, against defenders who organize. After each set play, the attackers explain it in one sentence.", "12.17": "Play 8 v 8 with a pop-up goal at each end. Use the full offside rule and make handball, free kick and dropped-ball calls. Teams use set plays and substitutes. Players take turns as referee and explain each call."};CHAPTERS.forEach(c=>c.drills.forEach((d,i)=>{const t=R[c.n+'.'+i];if(!t)return;const o=String(d[5]||'');const m=o.search(/Rule (in play|idea)/);d[5]=t+(m>=0?' '+o.slice(m):'');const ds=(window.DSCENE||{})[c.n];if(ds&&ds[i]){const f=t.match(/^[^.!?]*[.!?]/);let x=(f?f[0]:t).trim();ds[i][1]=x.length>150?x.slice(0,147)+'…':x;}}));})();

<script>
(function(){
const CH=window.CHAPTERS, PL=window.PLAN, N=CH.length, LV=PL.LEVELS, LT=PL.LT;
const $=s=>document.querySelector(s);
const CORNERS=['Technical','Physical','Psychological','Social'];

/* ---------- settings + schedule ---------- */

function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}

 for(let s=first;s<=PL.TEACH;s++){seq.push({kind:'p',s});if(s%(2*N)===0){const k=s/(2*N);seq.push({kind:'f',k,day:'Tuesday'},{kind:'f',k,day:'Thursday'});}}
 const st=parseD(getStart());let d=new Date(st),i=0,g=0;const out=[];
 while(i<seq.length&&g++<900){const wd=d.getDay();if((wd===2||wd===4)&&!skip.has(iso(d))){out.push({...seq[i],date:new Date(d),iso:iso(d)});i++;}d.setDate(d.getDate()+1);}
 out.forEach(e=>{e.week=Math.floor((e.date-st)/(7*864e5))+1;e.dayName=e.date.toLocaleDateString('en-US',{weekday:'long'});e.dstr=e.date.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});});
 SCH=out;
}
const evP=s=>SCH.find(e=>e.kind==='p'&&e.s===s);

/* ---------- charts ---------- */
const CHARTS={

 balance:['Planning target: 25-yard sprint, tenths of a second saved against own first time','tenths',[1,2,3,4,5,6],'Timing gates; each child compares only with their own earlier time. Not an age norm.'],
 dribble:['Planning target: poles cleared with a feint and no stray touch','poles',[8,9,10,10,10,10],'Ten poles, 1 yard apart, one feint between poles 5 and 6, both feet.'],
 scan:['Planning target: peeks before receiving out of 10 passes','of 10',[6,7,7,8,8,9],'Coach counts visible head turns before the ball arrives. Self-comparison only.'],

};
function chartHTML(key){

 const labels=['L1','L2','L3','L4','L5','L6'],vals=c[2];
 const W=520,H=210,L=40,B=30,T=14,R=10,max=Math.ceil(Math.max(...vals)*1.15/2)*2;
 const bw=(W-L-R)/vals.length,y=v=>T+(H-T-B)*(1-v/max);let s='';
 for(let g=0;g<=4;g++){const v=max/4*g;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`;}
 vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,last=i===vals.length-1;
  s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" class="bar${last?' hi':''}" style="--d:${i*70}ms"/><text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" class="val${last?' hi':''}">${v}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="ax">${labels[i]}</text>`;});

 return nxt+`<div class="hero"><div><div class="eyebrow">RCH Elite Training · 4th Grade · Ages 9 to 10</div><h1>Growing the Game</h1><p>Twelve chapters taught in rotation, starting at chapter 1. Every Tuesday and Thursday practice moves one chapter forward by a small step. After all twelve, the cycle returns to chapter 1 at a higher level. Each chapter builds on what the group learned in 3rd grade. This year adds the five positions, the four phases of the game and simple team tactics. New tools (a tactics board, light bands, low plyo boxes, a light medicine ball, crash mat, cross target gates, tennis balls, channel lines and position bibs) and new rules (handball, free kicks, dropped ball, substitutions) are added step by step, and the formats grow up to 8 v 8.</p><div class="stats"><div><b>12</b>chapters</div><div><b>6</b>levels</div><div><b>72</b>practices</div><div><b>75</b>min each</div></div></div><div id="hero-scene">${window.renderScene('funino',nid())}</div></div>

function yearPage(){

 }else if(tab==='concepts'){

 }else if(tab==='faults'){

 }else if(tab==='progress'){
  const steps=LT[n].map((t,i)=>`<li style="--w:${(i+1)/6*100}%;--d:${i*80}ms" class="stp"><b>L${i+1}</b><span class="sn">${LV[i][0]}</span><span class="st">${t}</span><a href="#/session/${sessionNo(n,i+1)}" class="sl">Practice ${sessionNo(n,i+1)}</a></li>`).join('');

  body=`<div class="drillpage"><div class="dlist">${lst}</div><article class="drill"><header><h3>${d[0]}</h3><div class="meta">${d[9]?`<span>Level ${d[9]}</span><span>${d[10]==='g'?'Game':'Skill exercise'}</span>`:''}<span>${d[1]} min</span><span>${d[2]}</span><span>${d[3]}</span><span>${d[4]}</span>${d[11]?`<span class="tl">Tool: ${d[11]}</span>`:''}${d[12]?`<span class="tl">Rule: ${d[12]}</span>`:''}</div></header>${ds?window.renderScene(ds[0],nid(),ds[1]):''}${window.howTo(d)}<dl>${d[11]?`<div><dt>New tool</dt><dd>${d[11]} (shown in the animation). <a href="#/g/tools">Tools page</a></dd></div>`:''}${d[12]?`<div><dt>Rule</dt><dd>${d[12]}. <a href="#/g/rules">Rules page</a></dd></div>`:''}</dl></article></div><p class="check"><b>Check for learning.</b> ${c.check}</p>`;
 }
