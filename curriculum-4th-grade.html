<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCH 4th Grade Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#FFFFFF;--bg2:#F7F9F8;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}

:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}
.calw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.calmain{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ctb{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ctb h3{margin:0 8px;font:600 20px var(--body);text-transform:none;letter-spacing:0;flex:1;min-width:140px}.vsw{display:flex;gap:0}.vsw .btn:first-child{border-radius:6px 0 0 6px}.vsw .btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.mg{overflow-x:auto}.mh,.mr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px}
.mh span{padding:8px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;border-bottom:1px solid var(--line)}
.mc{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}.mc:nth-child(7n){border-right:0}
.mc.oth{background:var(--bg3);opacity:.7}.dnum{font:500 12px var(--mono);color:var(--mute);align-self:flex-end;padding:1px 5px;border-radius:99px}
.mc.today .dnum{background:var(--accent);color:var(--accent-ink)}.mc.skipped{background:repeating-linear-gradient(45deg,transparent 0 8px,color-mix(in srgb,var(--line) 60%,transparent) 8px 9px)}
.ev{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:5px;background:var(--c);color:#fff;padding:3px 6px;cursor:pointer;font:inherit;width:100%;min-width:0}
.ev b{font:600 11.5px/1.25 var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;word-break:break-word}.ev small{font:500 10px var(--mono);opacity:.85}.ev:hover{filter:brightness(1.12)}.ev.on{outline:2px solid var(--ink);outline-offset:1px}
.nop{border:0;background:none;font:500 10px var(--mono);color:var(--mute);cursor:pointer;text-align:left;padding:2px}
.ag{padding:6px 14px 14px;display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto}.agm{margin:14px 0 4px}
.agr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:9px 6px;cursor:pointer;font:inherit}.agr:hover,.agr.on{background:var(--bg3)}.agr.past{opacity:.5}
.agd{font:500 12px var(--mono);color:var(--mute)}.agc{display:grid;grid-template-columns:12px minmax(0,1fr);gap:0 8px;align-items:center}.agc i{width:12px;height:12px;border-radius:99px;background:var(--c)}.agc b{font-weight:600}.agc small{grid-column:2;color:var(--mute);font-size:12.5px}
.caldet{position:sticky;top:16px}.dp{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.dp-bar{height:6px;margin:-16px -18px 10px}.dp h3{margin:0;font-size:22px}.dsub{margin:0;color:var(--mute);font-size:13px}.dp p{margin:4px 0;font-size:14px}.dp label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.dp input,.dp select{font:13px var(--body);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.lnk{border:0;background:none;color:var(--accent);font:500 12px var(--mono);cursor:pointer;padding:0;text-align:left}
.mini{list-style:none;margin:6px 0;padding:0;display:grid;gap:3px;font-size:13px}.mini span{font:500 11px var(--mono);color:var(--accent);display:inline-block;width:52px}
.skl{margin:0;padding-left:1.1em;font-size:13px}
.leg2{display:grid;gap:3px;font-size:12.5px}.leg2 a{text-decoration:none;display:flex;align-items:center;gap:8px}.leg2 i{width:10px;height:10px;border-radius:99px;display:inline-block}
@media (max-width:900px){.calw{grid-template-columns:minmax(0,1fr)}.caldet{position:static}.agr{grid-template-columns:90px minmax(0,1fr)}}
.calw{grid-template-columns:minmax(0,1fr)!important}.mc.has{cursor:pointer}.mc.has:hover{background:color-mix(in srgb,var(--accent) 6%,var(--bg2))}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 40px #0004;z-index:9;overflow:auto;padding:0}
.drawer[hidden]{display:none}
.dcard,.drawer>.dp{padding:0 22px 28px;display:flex;flex-direction:column;gap:6px;position:relative}
.drawer>.dp{padding-top:50px}
.dcard .dp-bar{height:8px;margin:0 -22px 14px}
.x{position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;z-index:2}.x:hover{border-color:var(--accent)}
.dcard h3{margin:2px 0 0;font-size:26px;padding-right:40px}.dcard .lvl{margin:4px 0 0;font-size:14px}
.rems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rem{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:8px;background:var(--bg2);text-decoration:none;font-size:12.5px;color:var(--mute);line-height:1.4}.rem b{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}.rem:hover{border-color:var(--accent)}
.dcb{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dch h4{margin:0;font:600 14px var(--body);text-transform:none;letter-spacing:0}
.dcb p{margin:0;font-size:13.5px}.dcf{color:var(--mute);font-size:12.5px!important}
.dcb .scene{margin-top:4px}
@media (max-width:600px){.rems{grid-template-columns:minmax(0,1fr)}}

.grewc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.grewc .card.kgrow{border-color:var(--accent)}
.grewc .card h4{margin:0 0 6px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.cols2 .chip{display:inline-block;margin-right:4px}
@media (max-width:700px){.grewc,.cols2{grid-template-columns:minmax(0,1fr)}}
.dsteps{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:6px}.dsteps li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;font-size:13.5px;line-height:1.45}.dsteps b{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding-top:3px}@media (max-width:600px){.dsteps li{grid-template-columns:minmax(0,1fr);gap:1px}}
</style>
<style>.devc{margin-top:14px}.devc h4{margin-top:0}</style>
<style>.dlv{margin:12px 0 4px;font:600 11px/1.2 var(--mono,monospace);text-transform:uppercase;letter-spacing:.08em;color:var(--muted,#667)}.dlist .dlv:first-child{margin-top:0}
.sc-key{margin:.5rem 0 0;font-size:.82rem;line-height:1.35;border:1px solid var(--line,#ccd);border-radius:8px;padding:.35rem .6rem;background:var(--card,transparent)}
.sc-key summary{cursor:pointer;font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;opacity:.75}

.sc-key .kd{flex:none;width:1.45rem;height:1.45rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.75rem;border:2px solid #fff;box-shadow:0 0 0 1px #0003}

.sc-key .kd.ko{background:#2C7A4D;border-color:#fff;color:#fff}
.sc-key .kd.tool{background:#7a4a00}
.sc-key .kd.rule{background:#444}
.sc-key li.kx{padding-left:0}
.how{margin:.8rem 0;padding:.7rem .9rem;border:1px solid var(--line,#ccd);border-radius:10px}
.how h4{margin:0 0 .4rem;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}
.how ol{margin:0;padding-left:1.3rem;display:grid;gap:.35rem;font-size:.95rem;line-height:1.4}

<script>
window.CHAPTERS=[
{
 n:1, title:'Leadership, Communication and Team Plans', short:'Leadership & Plans',
 lead:'Leadership grows from running a game to running the team’s plan. Fourth graders choose a simple plan on a tactics board, call short signals during play, lead a warm-up, referee with the full set of signals and review a game with three questions.',
 builds:[], focus:{Technical:1,Physical:1,Psychological:5,Social:5},
 grew:{pre:'3rd graders captain a full game, referee a short game with the helper-referee signals, lead a three-sentence team talk, give feedback with a kind word and a tip, and run a restart plan.',k:'4th graders choose a simple game plan on a tactics board, call short signals in play (man on, time, switch), lead a warm-up, referee with the full set of signals and review a game with three questions.'},
 dev:'Between 9 and 10 children care strongly about friends, fairness and belonging, and they start to see a situation from another person’s side. Self-evaluation and empathy are still developing (Jolles report for the KNVB), so jobs must stay short, concrete and shared. Soccer use: rotating leadership jobs, two-step plans, feedback in small steps, and no early rankings. The FFF names education of behaviour (life rules and game rules, fair play and refereeing) as a priority at U10 and U11.',
 basis:[['JOLLES','Self-evaluation and empathy are still early; keep feedback concrete and short and do not assume verbal children understand everything.'],['FFF','At U10 and U11 education of behaviour is a priority: life rules and game rules (fair play, refereeing, laws of the game); 75 percent playing time for all.'],['FA','Social corner: ground rules, player-led and coach-led time, plan, do, review.'],['DFB','Coaches act as joint game leaders and step in only when needed; children decide on the pitch themselves.']],
 game:'Coach for Five: 5 v 5 where each captain sets one plan on a tactics board before the game and one change at half time; a helper referee shows the signals and every honest call earns a fair-play point.',
 objectives:['Choose a simple game plan and explain it in two sentences','Call short signals during play (man on, time, switch)','Lead a four-minute warm-up for the group','Review a game with three questions: what worked, what was tricky, what is our next step'],
 outcomes:['Explains the plan before and after a game','Uses at least two signals in a game without a reminder','Leads a warm-up with a clear order and kind words','Names one thing the team did well and one next step'],
 concepts:[['Coach term / child language',[['Game plan','"One thing we will do and one thing we will stop"'],['Signal','"A short word the team knows: man on, time, switch"'],['Tactics board','"Our picture of the plan"'],['Warm-up leader','"Show it, say it, keep it safe"'],['Review','"What worked, what was tricky, what next"'],['Fair-play point','"A point for an honest call"'],['Captain rotation','"Everyone leads once"']]]],
 why:'Nine- and ten-year-olds want real responsibility and respond to a clear job card. Two-step plans fit their growing planning skills, and a tactics board turns an idea into a picture. Short, kind review questions keep feedback safe and build the habit of learning from a game.',
 details:[
 {h:'The game plan on a tactics board',p:['A plan has one thing we will do and one thing we will stop. Children move magnets or discs on a small tactics board, then explain it in two sentences. The coach models one first.','Keep it under a minute. Praise a clear plan, not a clever one.'],pts:['One thing to do, one to stop','Show it on the board','Two sentences','Praise clarity'],scene:'circle'},
 {h:'Signals in play',p:['Three short signals help a team talk while moving: man on (a defender is close), time (you have space) and switch (play to the other side). Practise them in a walking game before a real game.','The same word every time, loud and clear, and always used for the team, never against a teammate.'],pts:['Man on, time, switch','Same word every time','Walking game first','Team words only'],scene:'pairs'},
 {h:'Leading a warm-up',p:['Each child leads four minutes: three moves, a safe order and a kind word. The group copies. Leaders choose from a card of moves rather than inventing new ones.','Leading a warm-up builds voice and organisation without the pressure of a match.'],pts:['Three moves from a card','Safe order','Kind words','Four minutes'],scene:'stations'},
 {h:'Refereeing with full signals',p:['Referees use the signals for goal, throw-in, goal kick, corner, free kick, advantage and a yellow-card sign. They show the signal and say a one-sentence reason.','Rotate referees often and praise honest calls even when they go against a friend.'],pts:['Signal, say, restart','One-sentence reason','Rotate often','Honest calls praised'],scene:'refsignals'},
 {h:'Review in three questions',p:['After a game the team answers three questions: what worked, what was tricky and what is our next step? The captain writes a word for each on the board.','Do not rank teams or players. The review is about learning, not about winning.'],pts:['Worked, tricky, next','Captain writes it','No rankings','Short and kind'],chart:'session'}
 ],
 drills:[],
 faults:[['Plan is too complicated','Trying to cover everything','One thing to do and one to stop'],['Signals shouted at teammates','Frustration','Team words only; model a kind tone'],['Referee gives in to friends','Fear of upsetting them','Rotate often; praise honest calls'],['Warm-up leader forgets the order','Too many moves','Use the move card and three moves'],['Review becomes blame','No frame','Use the three questions and write them down']],
 check:'Child explains the plan, uses two signals, leads a warm-up and reviews a game with the three questions.'
},
{
 n:2, title:'Speed, Agility and Power', short:'Speed & Power',
 lead:'Athletic movement becomes stronger and sharper. Fourth graders sprint 25 to 30 yards from many starts, change direction on a cue, jump and land softly from low boxes, throw a light medicine ball for power and race their own best on timing gates.',
 builds:[1], focus:{Technical:2,Physical:5,Psychological:3,Social:3},
 grew:{pre:'3rd graders sprint 20 to 25 yards, move through cone-sprint grids and speed rings, combine ladder, hurdles and dots in short circuits, react to a reaction ball and use timing gates for repeated sprints against their own best.',k:'4th graders sprint 25 to 30 yards from many starts, cut on a cue, jump and land softly from low plyo boxes, push and pull light resistance bands, throw a light medicine ball and race their own best on timing gates.'},
 dev:'Between 9 and 10 coordination improves and many European sources call this a strong age for learning movement and technique, but the evidence for exact sensitive windows is limited and children of one age differ widely (Jolles; the FFF livret). Bones and joints are still growing, so power work stays playful and body-weight or very light: low boxes, light bands and a soft medicine ball. Soccer use: varied, short, fast work with full rests.',
 basis:[['LTAD','Fundamental movement skills first; speed, agility, balance and coordination built through play; strength work with body weight and light loads.'],['FFF','Short, varied blocks; avoid mechanical overload; psychomotor work (balance, coordination, reaction, rhythm, footwork) in workshops.'],['JOLLES','Children of the same age differ widely in coordination; playful practice speeds learning and builds motivation.'],['FIFA11','A structured warm-up such as FIFA 11+ Kids can be combined with the dynamic moves.']],
 game:'Sprint and Spring: 5 v 5 where a sprint through a cone gate or a box jump earns the right to shoot at a pop-up goal; fast recoveries count as a point.',
 objectives:['Sprint 25 to 30 yards from standing, crouch, lying and moving starts','Jump up to a low box and land softly on both feet','Change direction on a cue without losing balance','Beat your own time on a timing gate across the season'],
 outcomes:['Sprints 25 yards in an improving own time','Lands soft from a low box in 8 of 10 jumps','Cuts and accelerates on the call in 6 of 8 tries','Keeps good running form at the end of a set'],
 concepts:[['Coach term / child language',[['Sprint start','"Low, push, drive"'],['Plyo box','"Spring up, land soft, knees over toes"'],['Resistance band','"Push against the band, slow back"'],['Medicine ball','"Throw it with the whole body"'],['Cut','"Plant, push, go"'],['Timing gate','"Race your own best"'],['Full rest','"Walk back, then go again"']]]],
 why:'Fourth graders enjoy testing themselves and trying new equipment. Short sprints with full rests build speed without tiring them. A low box and a light ball teach the body to spring and push, and soft landings keep joints safe. Own-best targets keep the focus on progress, not on rank.',
 details:[
 {h:'Sprint starts and cuts',p:['Starts come from standing, a crouch, lying, falling forward and a moving jog. A cut is plant, push and go: the outside foot plants and the body drives the other way.','Keep sprints at 25 to 30 yards and rest at least ten times the work.'],pts:['Vary the start','Plant, push, go','Full rest','Tall posture'],scene:'sprint'},
 {h:'Low boxes and soft landings',p:['A low plyo box (about 12 to 18 inches, 30 to 45 cm) teaches a spring up and a soft landing on both feet. Children jump up, not down from height, and step down.','Stop if landings become heavy or the knees fall inward.'],pts:['Jump up, step down','Land soft on both feet','Knees over toes','Stop when form drops'],scene:'balance'},
 {h:'Bands and the medicine ball',p:['Light bands around the ankles or in the hands add a gentle push in lateral steps and arm pulls. A soft medicine ball (about 1 to 2 pounds) is thrown from the chest, overhead or sideways for power.','Light loads only. The goal is movement quality and fun, not strength numbers.'],pts:['Light bands only','Whole-body throws','Quality before power','Full rest'],scene:'ladder'},
 {h:'Reacting and changing direction',p:['Signals come by sound, color and number. A cone-color call, a reaction-ball bounce or a partner’s hand tells the child which way to cut.','Mix easy and hard cues so every child succeeds sometimes and is challenged sometimes.'],pts:['Sound, color, number','Plant, push, go','Mix easy and hard','Celebrate fast reactions'],scene:'trafficlight'},
 {h:'Racing your own best',p:['Timing gates let each child race an earlier time, never another child. The coach writes only the personal best on a private card.','Never post a ranking and always celebrate improvement.'],pts:['Own best only','Private card','No rankings','Celebrate improvement'],chart:'balance'}
 ],
 drills:[],
 faults:[['Heavy landing from a jump','Too high a box or tired legs','Lower the box; jump up and step down'],['Slow first step','Standing too tall','Low start and push the ground away'],['Slipping in a cut','Planting the wrong foot','Plant the outside foot first'],['Band too hard to use','Band too strong','Switch to a lighter band'],['Medicine ball throw is arm only','No leg drive','Start with the legs and throw from the middle']],
 check:'Child sprints 25 yards with good form, lands softly from a low box and cuts on a call.'
},
{
 n:3, title:'Dribbling, Feints and 1 v 1 Attack', short:'Dribbling & 1 v 1',
 lead:'Dribbling grows in speed and in thinking. Fourth graders dribble at pace through slalom sets, link two feints, change direction under pressure, attack a live defender with a plan and know when to dribble, pass or shoot.',
 builds:[2], focus:{Technical:5,Physical:3,Psychological:4,Social:2},
 grew:{pre:'3rd graders add feints (step-over, body feint, Cruyff turn, stop-and-go), dribble through slalom sets at speed, attack a live defender with a plan and know when to dribble and when to pass.',k:'4th graders link two feints in a row, dribble at pace through poles and mannequins, change direction under pressure with scissors and chop turns, attack a live defender with a plan and choose to dribble, pass or shoot.'},
 dev:'Coordination is strong at 9 and 10, so children can learn more complex moves if the first practice is slow and varied. Confidence matters: children who lose the ball can stop trying a move. Soccer use: practise a move slowly, then at pace, then against a passive defender, and praise brave attempts that fail (FIFA grassroots and FA technical corner).',
 basis:[['FIFA','Grassroots football: technical skills are developed through games, with many ball contacts and repetition in game-like situations.'],['FA','Technical corner: dribbling with both feet and 1 v 1 attacking taught through games.'],['FFF','Workshops with the ball and 1 v 1 and 2 v 2 situations teach confidence and creativity.'],['KNVB','Dutch youth coaching teaches 1 v 1 attacking as a basic task: dribble past the defender and score.']],
 game:'Take-On Cup: 5 v 5 where each player must take on a defender once before passing, with a goal after a successful take-on counting double.',
 objectives:['Link two feints in a row and finish with a change of pace','Dribble through poles and around mannequins at pace with both feet','Change direction under pressure with a scissors or a chop','Choose to dribble, pass or shoot and say why'],
 outcomes:['Dribbles a ten-pole set with both feet at jogging pace','Beats a mannequin with a feint in 4 of 6 tries','Keeps the ball in a 1 v 1 for four seconds','Chooses a good option in 3 of 5 tries'],
 concepts:[['Coach term / child language',[['Feint','"Fake one way, go the other"'],['Scissors','"Foot over, foot over, go"'],['Chop','"Cut it behind your standing leg"'],['Change of pace','"Slow, slow, fast"'],['Shield','"Body between you and the defender"'],['Take on','"Go at the defender and past"'],['Dribble, pass or shoot','"Look first, then choose"']]]],
 why:'Fourth graders like to show a new move to friends, which keeps repetition fun. A slow-then-fast order lets every child succeed, and a passive defender adds challenge step by step. Praise for brave tries keeps risk-taking alive.',
 details:[
 {h:'Slalom sets at pace',p:['Poles and cones in a zigzag or a straight set teach quick, small touches at a speed that rises over the year. Both feet take turns.','Keep the ball within a stride. Start walking, then jog, then run.'],pts:['Small touches','Both feet','Walk, jog, run','Ball within a stride'],scene:'zigzag'},
 {h:'Scissors, chop and linking two feints',p:['The scissors goes over the ball and away; the chop cuts the ball behind the standing leg. Two feints in a row (for example a step-over then a chop) fool a defender more than one.','Practise slowly, then at pace, then against a mannequin.'],pts:['Slow then fast','Two feints in a row','Mannequin first','Praise brave tries'],scene:'fake'},
 {h:'Changing direction under pressure',p:['A defender approaching from the side makes the child choose a turn: drag back, inside hook or chop. The first touch is away from the defender.','Start with a passive defender and add pressure only when success is high.'],pts:['Touch away from the defender','Drag, hook or chop','Passive defender first','Add pressure slowly'],scene:'cut'},
 {h:'Shielding and running with the ball',p:['Shielding keeps the body between the ball and the defender with an arm out for balance. Running with the ball means long touches into space when no defender is close.','Teach when: short touches near a defender, long touches into space.'],pts:['Body between','Arm out for balance','Long touches into space','Short touches near a defender'],scene:'shield'},
 {h:'Dribble, pass or shoot',p:['A good dribbler looks up first. If a teammate is free, pass; if a shot is on, shoot; if neither, take on the defender. Children say the choice aloud.','Reward good choices, not only good results.'],pts:['Look first','Free teammate, pass','Shot on, shoot','Say the choice'],chart:'dribble'}
 ],
 drills:[],
 faults:[['Ball runs away','Touches too hard','Smaller touches and slow down'],['Feint is slow','Stiff body','Show the body move first, then the foot'],['Child never passes','Wants to show a move','Add a pass-bonus rule'],['Child avoids the defender','Fear of losing the ball','Praise the try; start with a passive defender'],['Weak foot unused','Habit','Count weak-foot touches']],
 check:'Child links two feints, dribbles ten poles with both feet, beats a mannequin in 4 of 6 tries and chooses dribble, pass or shoot.'
},
{
 n:4, title:'First Touch, Receiving and Turning on the Move', short:'Touch & Turning',
 lead:'Receiving becomes faster and more purposeful. Fourth graders control driven and lofted balls with different surfaces, receive across the body and on the back foot, turn with a defender close and use the first touch to start the next action.',
 builds:[3], focus:{Technical:5,Physical:2,Psychological:4,Social:3},
 grew:{pre:'3rd graders control faster passes and bouncing balls, receive on the half-turn, take a first touch away from pressure, use a bounce-back net for repetitions and turn with a drag back or inside hook under light pressure.',k:'4th graders control lofted balls with the thigh and chest, receive across the body and on the back foot, play first time or take one touch by choice, turn with a defender behind them and use the first touch to play on within three seconds.'},
 dev:'Eye-foot coordination keeps improving at 9 and 10, but children still differ widely and need many varied repetitions. Scanning habits are fragile and disappear under stress; children learn them in small steps (the scanning research is a US study and is used here as secondary). Soccer use: more repetitions, varied passes, a look before the ball arrives and tasks that are easy to succeed at before pressure is added.',
 basis:[['FFF','Workshops with and without the ball build control and orientation; play is the main vehicle.'],['FA','Technical corner: receiving and passing in small-sided games with many repetitions.'],['FIFA','Grassroots football: many ball contacts in game-like situations improve technique.'],['SCAN','Scanning before receiving relates to better decisions in elite players (US study, secondary).']],
 game:'Touch and Turn 6 v 6: a goal counts only after a controlled first touch inside a marked zone; first-time goals count double.',
 objectives:['Control lofted balls with the thigh and chest','Receive across the body and on the back foot','Choose first time or one touch by what the game gives','Turn away from a defender behind you and play on within three seconds'],

 details:[
 {h:'Lofted balls: thigh and chest',p:['A ball that falls from the air is controlled by giving with the thigh or the chest. The surface moves down and back as the ball arrives, then the ball is on the ground and ready.','Use soft balls and throws first. No heading practice at this age.'],pts:['Give with the surface','Soft ball first','Thigh and chest','Ball ready on the ground'],scene:'cushion'},
 {h:'Across the body and on the back foot',p:['Receiving across the body means opening the hips so the ball goes away from the defender. Receiving on the back foot (the foot far from the passer) keeps the chest open to the field.','Practise with a still defender first, then with a moving one.'],pts:['Open the hips','Far foot receives','Away from the defender','Still defender first'],scene:'receive'},
 {h:'First time or one touch',p:['A first-time pass is right when a teammate is free and the defender is close. One touch to set and one to play is right when there is space. Children pick by looking.','Both choices are good; the coach asks why.'],pts:['Look, then choose','First time when pressed','Set and play with space','Say why'],scene:'firsttime'},
 {h:'Turning with a defender behind',p:['The back of the child is to a defender. Turns are the half-turn, the drag back and the inside hook, always on the side away from the defender.','Add a verbal call ("man on") from a teammate so the child knows where the pressure is.'],pts:['Turn away from the defender','Half-turn, drag, hook','Teammate calls "man on"','Play on in three seconds'],scene:'turn'},

{
 n:5, title:'Passing: Range, Weight and Lofted Balls', short:'Passing Range & Weight',
 lead:'Passing grows in distance, speed and variety. Fourth graders pass 20 to 25 yards on the ground and in the air, choose the weight of the pass for the teammate, play through gaps with a through pass and keep passing quickly in groups of three.',
 builds:[3,4], focus:{Technical:5,Physical:2,Psychological:3,Social:4},
 grew:{pre:'3rd graders pass 15 to 20 yards, switch the play to the other side, pass under light pressure, lead a runner with a pass into the path, use passing arcs and rings at longer range and play with both feet in 5 v 5.',k:'4th graders pass 20 to 25 yards on the ground and in the air, set the weight of a pass for the receiver, play a through pass into a gap and keep quick passing patterns in threes and fours.'},
 dev:'Leg strength and coordination allow longer passes at 9 and 10, but children differ widely in strength and many cannot yet lift the ball far; so lofted passes start short and low, and the goal is accuracy before distance. Soccer use: choose the distance to fit the child, change partners often and praise a good decision as much as a good pass (FA and DFB game forms).',
 basis:[['FIFA','Grassroots football: passing and receiving skills improve in small-sided games with many touches.'],['DFB','Game forms in children’s football give many ball contacts and decisions; formats are larger from E-Jugend (7 v 7 on 55 x 35 m).'],['KNVB','Dutch youth theme at O10 and O11: learning to act together purposefully with the ball (positional and depth play in build-up).'],['JOLLES','Children differ widely in strength and coordination; play and variety speed learning.']],
 game:'Range Rovers 6 v 6: a goal only counts after at least one pass over 15 yards, and a through pass that breaks a line earns a bonus point.',
 objectives:['Pass 20 to 25 yards accurately along the ground','Pass 12 to 15 yards in the air with a short lofted pass','Choose the weight of a pass for a teammate who is waiting or running','Play a through pass into a gap between two defenders'],
 outcomes:['Passes 6 of 10 over 20 yards','Hits a ring or arc in 4 of 8 lofted passes over 12 yards','Plays a through pass to a runner in 3 of 5 tries','Keeps a 4 v 2 for 8 passes'],
 concepts:[['Coach term / child language',[['Weight of pass','"Soft for a waiting foot, firm for a runner"'],['Lofted pass','"Lean back, strike under the ball, follow through"'],['Through pass','"Pass into the gap, not at the player"'],['Driven pass','"Strike through the middle with the laces"'],['Switch','"Change the side with one big pass"'],['Weak foot','"Use both feet"'],['Quick pass','"Pass, move, pass"']]]],
 why:'Nine- and ten-year-olds enjoy testing how far a pass can go, so distance is a natural challenge. Giving a clear reason for the weight of a pass (waiting or running) turns technique into a decision. Short chains of three keep everyone involved and moving.',
 details:[
 {h:'The laces pass over 20 yards',p:['A driven pass uses the laces, a firm plant foot beside the ball and a full follow-through. Start at 15 yards and move out as accuracy improves.','Targets such as rings or gates make the aim clear.'],pts:['Plant foot beside the ball','Laces through the middle','Follow through','Start at 15 yards'],scene:'pass'},
 {h:'The lofted pass',p:['A lofted pass strikes under the ball with the instep and leans the body slightly back. Start short and low (12 yards) over a cone or mannequin, then go longer.','Use a lighter ball for children who cannot yet lift a size 4 ball.'],pts:['Lean back a little','Strike under the ball','Over a mannequin first','Lighter ball if needed'],scene:'bounce'},
 {h:'Weight of the pass',p:['A pass can be soft (to a waiting teammate) or firm (to a runner). Children learn to see which they need and practise both with a partner at changing distances.','Ask the passer: who is waiting and who is running?'],pts:['Waiting: soft','Running: firm','Who is waiting?','Change distances'],scene:'follow'},
 {h:'Through passes and gaps',p:['A through pass goes into the space between two defenders for a teammate who is running. The teammate starts as the pass is played, not before.','Start with mannequins as defenders, then use live ones.'],pts:['Pass into the gap','Runner starts on the pass','Mannequins first','Aim for the far foot'],scene:'triangle'},
 {h:'Quick passing in threes',p:['In a group of three players pass and move: the passer follows the pass and the third player always shows. Patterns vary with colored cones.','Tempo rises as accuracy rises, never before.'],pts:['Pass and move','Third player shows','Change the pattern','Tempo after accuracy'],chart:'pass'}
 ],
 drills:[],
 faults:[['Pass dies before the target','Too soft or standing leg too far','Plant foot beside the ball and strike through'],['Lofted pass goes too high','Leaning back too far','Strike under the middle and lean a little'],['Pass is always the same weight','No look at the receiver','Ask: waiting or running?'],['Through pass is offside-like early run','Runner starts too soon','Start on the pass'],['Passer stands still','Forgot to move','Pass and follow']],
 check:'Child passes 6 of 10 over 20 yards, plays a lofted pass to a ring and plays a through pass to a runner.'

{
 n:6, title:'Finishing: Power, Placement and Composure', short:'Finishing',
 lead:'Finishing grows in power and calm. Fourth graders shoot with the instep and the inside of the foot from many angles, strike a rolling or bouncing ball, finish 1 v 1 against a keeper and score from crosses with their feet.',
 builds:[4,5], focus:{Technical:5,Physical:3,Psychological:4,Social:3},
 grew:{pre:'3rd graders shoot from angles and after a dribble, finish cutbacks and low crosses first time, follow up rebounds and aim at corners of mini cages and target nets with both feet.',k:'4th graders add power with the instep, strike rolling and bouncing balls (half-volleys), finish 1 v 1 against a keeper, shoot early and score from low crosses with the feet. There is no heading practice at this age.'},
 dev:'Leg strength and balance improve at 9 and 10, so children can strike harder, but accuracy still falls when they hurry. Composure in front of goal is learned: children who miss early can start to avoid shooting. Soccer use: many shots in game-like settings, praise for the attempt and a calm, cheerful reaction to a miss. The FA asks that heading is not practised in training for children in the foundation phase (under 7 to under 11).',
 basis:[['DFB','Small-sided and game forms create many shots and goals; goalkeepers play regularly from E-Jugend.'],['FFF','Finishing is taught inside 1 v 1, 2 v 2 and small games with real goals.'],['FIFA','Grassroots football: practice should be game-like and fun, with many chances to score.'],['FA','No deliberate heading practice in training for the under 7 to under 11 foundation phase (FA guidance, reported by Training Ground Guru).']],
 game:'Goal Rush 5 v 5: three goals count (a goal, a half-volley or a first-time finish); every attack must end in a shot within eight seconds.',
 objectives:['Strike with power and accuracy with the instep','Strike a rolling or bouncing ball cleanly','Finish a 1 v 1 against a keeper with a calm choice','Score from a low cross with the foot'],
 outcomes:['Hits 6 of 10 shots on target from 14 yards','Half-volleys 3 of 8 bouncing balls on target','Scores 3 of 6 in a 1 v 1 against a keeper','Finishes 3 of 8 low crosses first time'],
 concepts:[['Coach term / child language',[['Instep drive','"Laces through the middle of the ball"'],['Half-volley','"Strike right after the bounce"'],['Composure','"Look at the keeper, then choose a corner"'],['Near post and far post','"Near is quick, far is wide"'],['Cross and finish','"Run to the space, not to the ball"'],['Shoot early','"If it is on, shoot"'],['Follow the shot','"Run to the rebound"']]]],
 why:'Fourth graders want to hit the ball hard, which is motivating if accuracy is also rewarded. A calm look at the keeper before choosing a corner teaches composure. Running to the space for a cross builds timing and teamwork.',
 details:[
 {h:'The instep drive',p:['The instep drive strikes through the middle of the ball with the laces. The plant foot sits beside the ball, the ankle is firm and the body leans over the ball.','Start at 12 yards and move back to 15 as accuracy improves.'],pts:['Plant beside the ball','Laces, firm ankle','Lean over the ball','Follow through'],scene:'shoot'},
 {h:'Rolling and bouncing balls',p:['A rolling ball is struck at the right moment with a controlled approach. A half-volley meets the ball just after it bounces. Start with a ball tossed by a partner.','Use soft balls for the first tries and strike through the middle.'],pts:['Time the approach','Half-volley after the bounce','Toss from a partner','Soft ball first'],scene:'rebound'},
 {h:'1 v 1 against a keeper',p:['A calm 1 v 1 means looking at the keeper, then choosing a corner or a dribble around. Children say which they chose.','Alternate keeper roles so everyone feels both sides.'],pts:['Look, then choose','Corner or dribble around','Say your choice','Rotate keepers'],scene:'cut'},
 {h:'Crosses and finishing',p:['Crossers deliver low balls across the goal. The finisher runs to the near post, the far post or the penalty spot and strikes first time with the foot.','Remind children that heading is not practised at this age.'],pts:['Low cross','Near, far or spot','First time with the foot','No heading practice'],scene:'firsttime'},
 {h:'Shoot early',p:['Early shots surprise keepers and defenders. Children set a rule: if it is on, shoot. Games count shots, not only goals.','Praise the decision to shoot even when it misses.'],pts:['If it is on, shoot','Count shots','Praise the try','Reset quickly'],chart:'shoot'}
 ],
 drills:[],
 faults:[['Shot goes over the bar','Leaning back','Lean over the ball and strike the middle'],['Shot too soft','Pushing it','Laces and follow through'],['Child shoots at the keeper','No look','Look at the keeper, then pick a corner'],['Misses the cross','Starts too late','Start as the crosser plays'],['Child does not shoot','Fear of missing','Count shots and praise the try']],
 check:'Child hits 6 of 10 on target from 14 yards, half-volleys a bounce and finishes a low cross with the foot.'
},
{
 n:7, title:'Defending as a Group: Pressing, Cover and Recovery', short:'Group Defending',
 lead:'Defending becomes a team job. Fourth graders press on a trigger, cover a teammate, keep the team close together, recover goal-side and win the ball with a safe tackle in 2 v 2 and 3 v 3.',
 builds:[2,3], focus:{Technical:4,Physical:4,Psychological:4,Social:4},
 grew:{pre:'3rd graders close down fast and jockey, cover a teammate, defend in pairs with pressure and cover, use a mannequin wall against free kicks and learn the idea of a foul and a card.',k:'4th graders press on a trigger (bad touch, back pass, sideline), keep the team compact, recover goal-side in a sprint, defend 2 v 2 and 3 v 3 and defend crosses with a safe position and a safe tackle.'},
 dev:'At 9 and 10 children can follow a group plan and compare actions with a partner, but they still need short instructions and clear jobs. Tackling needs timing, not size; pressing needs a shared cue. Soccer use: use one trigger at a time, praise delay and cover as much as winning the ball, and match children by size (KNVB teamwork themes at O10 and O11, FFF game rules and fair play).',
 basis:[['KNVB','O10 and O11 defending themes: disturbing and winning the ball, defending the 1 v 1 and defending depth play, and transitions from attack to defence.'],['FFF','Defending taught through game forms with real fouls, referees and fair play.'],['FA','Defending corner: pressure, cover and balance taught through small-sided games.'],['IFAB','Law 12: tackles and challenges that are careless, reckless or with excessive force are fouls.']],
 game:'Press and Recover 6 v 6: when the ball is lost the team presses for five seconds; if it does not win the ball it recovers behind the ball, and a won ball scores through a gate.',
 objectives:['Press on a trigger and stop when the cover is not there','Keep the team compact within a 20-yard block','Recover goal-side in a sprint after losing the ball','Defend a cross with the body between ball and goal'],
 outcomes:['Presses on the trigger in 4 of 6 tries','Stays within a 20-yard block in a 6 v 6','Recovers goal-side within three seconds in 4 of 6','Wins the ball without a foul in 3 of 8 duels'],
 concepts:[['Coach term / child language',[['Press trigger','"A bad touch, a back pass or the sideline"'],['Cover','"Stand behind your teammate, ready to help"'],['Compact','"Stay close together, like a small cloud"'],['Goal-side','"Be between the ball and the goal"'],['Recovery run','"Sprint back, then turn and look"'],['Safe tackle','"Block with the inside foot, no sliding"'],['Delay','"Slow the attacker down until help arrives"']]]],
 why:'A shared signal turns pressing into teamwork instead of chasing. Nine- and ten-year-olds enjoy being part of a plan if the job is short and clear. Praising delay and cover keeps weaker defenders confident and the team safe.',
 details:[
 {h:'Press triggers',p:['A trigger tells the team when to press: a heavy touch, a back pass or a pass toward the sideline. One trigger at a time keeps the idea simple.','The nearest player presses; the others cover and balance.'],pts:['One trigger at a time','Nearest player presses','Others cover','Stop if cover is missing'],scene:'cover'},
 {h:'Compact and close',p:['Compact means the team stays within a block, about 20 yards from the back to the front in 7 v 7. Children use discs to see the block and move together when the ball moves.','A compact team has fewer gaps to pass through.'],pts:['Block of about 20 yards','Move with the ball','Fewer gaps','Use discs to see it'],scene:'thirds'},
 {h:'Recovery runs',p:['After a lost ball players sprint back goal-side, then turn and look. Recovery is a sprint plus a look, not a jog.','Praise the run even if the ball is not won.'],pts:['Sprint back','Goal-side','Turn and look','Praise the effort'],scene:'goalside'},
 {h:'Tackling safely',p:['A safe tackle is a block with the inside of the foot or a poke when the attacker is off balance. Sliding tackles are not taught at this age.','Use a mannequin first, then a slow live defender.'],pts:['Block with the inside foot','Poke when off balance','No sliding','Mannequin first'],scene:'tackle'},
 {h:'Defending crosses',p:['When the ball is wide, defenders move to protect the goal: the nearest defender goes to the crosser, the others protect the near post and the middle. The keeper calls.','Keep it a game of 4 v 3 with a wide crosser.'],pts:['Nearest to the crosser','Protect near post and middle','Keeper calls','Body between ball and goal'],chart:'duel'}
 ],
 drills:[],
 faults:[['Everyone presses','No cover','Only the nearest presses; others cover'],['Team spread out','No block','Use discs to mark a 20-yard block'],['Recovery run is a jog','No urgency','Sprint back, then look'],['Slide tackle attempts','Copying television','Stand up, block with the inside foot'],['Defender watches the ball','Forgot the attacker','Look at both the ball and the attacker']],
 check:'Child presses on a trigger, covers a teammate, recovers goal-side and makes a safe tackle in a 2 v 2.'
},
{
 n:8, title:'Attacking Principles: Support, Width, Depth and Penetration', short:'Attacking Principles',
 lead:'Attacking becomes a team idea. Fourth graders support the ball carrier at good angles, stretch the field with width, offer depth for forward passes, use quick combinations and play through or around a defending team in 4 v 3 and 5 v 4.',
 builds:[5,7], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'3rd graders play third-man runs and overlaps in 3 v 3 and 4 v 2, build triangles and diamonds with discs, use width and depth together and switch roles in the pattern.',k:'4th graders choose support angles, stretch the field with width, offer depth for forward passes, play combinations on purpose and attack numbers-up in 4 v 3 and 5 v 4 with a plan.'},
 dev:'From about 9 or 10 many children can hold two ideas at once (my teammate and the space) and plan a few seconds ahead, but under pressure they return to the ball. Teaching works best with a picture on the field (discs, bibs, a tactics board) and a simple rule. Soccer use: the four ideas support, width, depth and penetration, taught one at a time (FA and KNVB attacking themes).',
 basis:[['KNVB','O10 and O11 attacking themes: positional and depth play in build-up, 1 v 1 attacking, creating and finishing chances after the ball reaches the end line.'],['FA','Tactical corner: attacking principles such as support, width and penetration through small-sided games.'],['DFB','Game forms with a free player and overloads (3 v 2, 4 v 3) teach attacking choices.'],['FFF','Small games with a numbers-up situation teach children to see and use space.']],
 game:'Overload Match 5 v 4: the extra attacker is always the player furthest from the ball; a goal after a switch counts double.',
 objectives:['Choose a support angle and distance for the ball carrier','Stretch the field with width and offer depth','Play a combination and then move to a new spot','Attack in a 4 v 3 or 5 v 4 with a named idea'],
 outcomes:['Supports at a good angle in 4 of 6 tries','Stays wide or deep on request in a 5 v 5','Completes a combination in 3 of 5 tries','Creates a chance with a named idea in a 5 v 4'],
 concepts:[['Coach term / child language',[['Support','"Show for the ball at an angle, not in line"'],['Width','"Stretch the field, stay near the side line"'],['Depth','"Be ahead of the ball, give a forward option"'],['Penetration','"Pass or dribble into the space behind"'],['Overload','"More attackers than defenders: use it"'],['Mobility','"Move after you pass"'],['Combination','"Pass, move, receive in a new place"']]]],
 why:'Nine- and ten-year-olds like to show an idea to their friends, so a named idea (support, width, depth) gives the game a language. Overloads let children succeed, which keeps them willing to try risky passes. Moving after the pass trains teamwork.',
 details:[
 {h:'Support at an angle',p:['A supporting player stands at a diagonal angle and a comfortable passing distance so the pass is easy and a defender cannot cover both. Straight lines are easy to block.','Children test distances with discs: close enough to pass, far enough to need a defender to choose.'],pts:['Diagonal angle','Passing distance','Not in a straight line','Discs show the spot'],scene:'triangle'},
 {h:'Width: stretch the field',p:['Wide players stay near the side lines so defenders must spread out and gaps open in the middle. A wide player can cross, dribble or pass inside.','Mark wide lanes with channel lines so children can see them.'],pts:['Stay near the side line','Defenders must spread','Cross, dribble or pass inside','Channel lines show lanes'],scene:'spread'},
 {h:'Depth: offer a forward option',p:['A deep player stands ahead of the ball so a forward pass is possible. If no deep player shows, the ball stays behind the defenders.','Combine width and depth in a diamond shape of four players.'],pts:['Show ahead of the ball','Stay onside in the idea','Diamond of four','Forward pass if on'],scene:'overlap'},
 {h:'Combinations and moving after the pass',p:['A combination is a short pattern such as a wall pass or an overlap followed by a run into space. Players always move after a pass.','Name the pattern before the game so everybody knows the plan.'],pts:['Name the pattern','Pass and move','Receive in a new place','Plan before the game'],scene:'giveandgo'},
 {h:'Overloads: 4 v 3 and 5 v 4',p:['With one more attacker the team can play around or through the defenders. The furthest player is the free player and may switch the play.','Count passes and shots to see if the overload is used.'],pts:['One free attacker','Switch if blocked','Look for the free player','Count passes and shots'],chart:'combo'}
 ],
 drills:[],
 faults:[['Players stand in a line','No angle','Move to a diagonal'],['Everyone crowds the ball','No width','Mark wide lanes with channel lines'],['Nobody offers depth','Fear of being too far from the ball','Ask a deep player to show with an open hand'],['Players stand after passing','No mobility','Pass and move to a new spot'],['Overload not used','No look for the free player','Ask: who is free?']],
 check:'Child supports at an angle, stays wide or deep on request and plays a combination in a 4 v 3.'
},
{
 n:9, title:'Positions and Roles: Defender, Midfielder, Winger and Forward', short:'Positions & Roles',
 lead:'Positions arrive as jobs, not labels. Fourth graders learn what a goalkeeper, a defender, a midfielder, a winger and a forward do with and without the ball, and every child tries every position so that nobody is stuck in one place.',
 builds:[7,8], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'3rd graders play roles (back, middle and front) in 6 v 6 and 7 v 7, keep a shape with zones and discs, transition in three seconds, build out from the keeper and play with the offside line as an idea.',k:'4th graders name the jobs of the goalkeeper, defender, midfielder, winger and forward, play each position with and without the ball and rotate through every position during the year.'},
 dev:'At 9 and 10 children can understand a job that changes with the situation, but they still enjoy trying everything and change quickly in size, skill and interest. US Soccer asks that players in 7 v 7 try all positions at U9 and U10, and the FA, DFB and KNVB all keep youth players flexible. Soccer use: teach the job of each position, rotate often and never label a child as only a defender or only a forward.',
 basis:[['USS','U.S. Soccer 7 v 7 (U9 to U10) recommends a 1-3-2-1 and says players should be encouraged to try all positions (secondary US source).'],['KNVB','Dutch teaching frames play in phases (attack, defend, transitions) with a task for each line; O10 and O11 learn to act together purposefully with the ball.'],['FA','Youth guidance asks for flexible roles and equal playing time; positions are introduced gradually with the move from 7 v 7 to 9 v 9.'],['FFF','At U10 and U11 every child plays (75 percent playing time for all) in football à 8.']],
 game:'Position Switch 7 v 7: every player plays one half in a new position, and the coach pauses once to ask, what is your job now?',
 objectives:['Name the job of each position with and without the ball','Play a defender, a midfielder and a forward with a clear job','Switch positions after a goal or a whistle and say the new job','Explain the idea of lines (back, middle, front) and of left, right and center'],
 outcomes:['Names the jobs of three positions','Plays two positions in a 7 v 7 with the right job','Switches position within ten seconds of the call','Explains left, right and center in the lines'],
 concepts:[['Coach term / child language',[['Goalkeeper','"Last line: stop shots, start attacks, talk to the team"'],['Defender','"Protect our goal and start the attack"'],['Midfielder','"Link the team: win, pass and support"'],['Winger','"Stretch the field and cross or take on"'],['Forward','"Score, hold the ball and press first"'],['Line','"Back, middle and front"'],['Rotate','"Everyone tries every job"']]]],
 why:'Position names without jobs confuse children, while jobs they can say in a sentence make sense. Trying every position builds understanding of teammates’ roles and prevents early labels. Rotation keeps playing time fair and the game interesting.',
 details:[
 {h:'The goalkeeper and the defenders',p:['The goalkeeper stops shots, starts attacks and talks to the defenders. Defenders protect the goal, win the ball and start the attack with a safe pass. A center back is in the middle; a full back guards the side.','Show both jobs on a tactics board and then in a walking game.'],pts:['Keeper stops and starts','Defenders protect and start','Center back and full back','Show on a board first'],scene:'setpos'},
 {h:'Midfielders: the link',p:['Midfielders connect defense and attack. A holding midfielder stays near the defenders and protects; a central midfielder runs and supports. Midfielders find space between the lines.','Rotate children through these jobs, not into a fixed one.'],pts:['Link defense and attack','Holding or central','Find space between lines','Rotate often'],scene:'shapes'},
 {h:'Wingers and forwards',p:['Wingers stay wide and stretch the field; they cross, take on or pass inside. A forward scores, holds the ball for teammates and presses first when the ball is lost.','Wingers and forwards swap sides to see both jobs.'],pts:['Wingers stay wide','Forward scores and presses','Hold the ball up','Swap sides'],scene:'spread'},
 {h:'Left, right, center and lines',p:['Children learn left, right and center on the field and the three lines (back, middle, front) with channel lines and discs. The words make it easy to say where to go.','Use the words in a simple call: left back, right wing, center forward.'],pts:['Left, right, center','Back, middle, front','Use channel lines','Say the call'],scene:'thirds'},
 {h:'Trying every position',p:['Over the year every child plays every position, including goalkeeper. A rotation chart on the tactics board shows who plays where in each half.','Never label a child as only a defender or only a forward.'],pts:['Every child, every position','Rotation chart','Include goalkeeper','No fixed labels'],chart:'roles'}
 ],
 drills:[],
 faults:[['Child says "I am only a defender"','Early label','Use the rotation chart for every half'],['Players leave their lines too early','Excitement','Use channel lines and name the job'],['Winger stays too close to the ball','No width','Mark the side lane with channel lines'],['Forward waits for the ball','Not pressing','Give the job: press first'],['Rotation takes too long','No plan','Rotate on a whistle and keep a chart']],
 check:'Child names the job of three positions, plays two positions with the right job and switches on the call.'
},
{
 n:10, title:'Team Tactics: Shape, Phases of Play and Transitions', short:'Team Tactics',
 lead:'Tactics begin as simple team ideas. Fourth graders learn a shape for 7 v 7 and 8 v 8, the four phases of the game (build up, attack, defend and transition), pressing triggers and compactness, and they choose a plan, then change it at half time.',
 builds:[1,7,8,9], focus:{Technical:3,Physical:3,Psychological:4,Social:5},
 grew:{pre:'3rd graders play roles in 6 v 6 and 7 v 7, keep a shape with zones and discs, transition in three seconds, build out from the keeper and play with the offside line as an idea.',k:'4th graders play a shape in 7 v 7 (2-3-1 and 3-2-1) and 8 v 8 (3-3-1 and 2-3-2), play the four phases of the game, use press triggers, stay compact and make a plan and a change at half time.'},
 dev:'Between 9 and 10 children can follow a simple plan, but they forget it under excitement. A team picture (a tactics board, bibs, discs) and one idea per game work better than many ideas. Soccer use: one tactic at a time, repeated across games, and frequent changes of position. The DFB plays 7 v 7 on 55 x 35 m with six field players and a keeper at E-Jugend; the FFF plays football à 8 at U10 and U11; the FA uses 7 v 7 at under 9 and 10 and 9 v 9 at under 11 and 12.',
 basis:[['KNVB','A 7 v 7 teaching game with a 1-3-2-1 against a 1-2-2-2 asks the team to use full width and depth, create a free player in build-up and play forward quickly (KNVB game page); O10 and O11 also practise transitions.'],['DFB','E-Jugend plays 7 v 7 on 55 x 35 m with six field players and a goalkeeper; game forms give many decisions.'],['FFF','U10 and U11 play football à 8 and offside is flagged from the last 13 metres; every child plays.'],['USS','US Soccer 7 v 7 formation 1-3-2-1 with all positions tried (secondary).']],
 game:'Plan and Change 7 v 7: each captain sets a plan before the game and one change at half time, and the coach rewards a team that explains why the change helped.',
 objectives:['Hold a 7 v 7 or 8 v 8 shape in the four phases of the game','Press on a trigger and stay compact','Counter-attack within five seconds of winning the ball','Choose a plan, explain it and change it at half time'],
 outcomes:['Holds the shape for two minutes in a 7 v 7','Presses on a trigger in 4 of 6 tries','Starts a counter within five seconds in 3 of 5','Explains the plan and the change in two sentences'],
 concepts:[['Coach term / child language',[['Shape','"Where we stand when we start"'],['Phase of play','"Build up, attack, defend, transition"'],['Press trigger','"A bad touch, a back pass or the sideline"'],['Compact','"Stay close, like a small cloud"'],['Counter','"Go fast in five seconds after we win it"'],['Plan and change','"One idea, then one change"'],['Formation','"2-3-1 means two back, three in the middle, one up"']]]],
 why:'A shape on the board gives every child a place to start and a job to do. The four phases give a simple language for what the team is doing. A plan and a change teach children that tactics are tools they can choose, not orders.',
 details:[
 {h:'Shape in 7 v 7 and 8 v 8',p:['In 7 v 7 the team has six field players and a keeper: 2-3-1 (two back, three midfield, one front) or 3-2-1. In 8 v 8 the team has seven field players: 3-3-1 or 2-3-2. The numbers describe lines from back to front, not the keeper.','Start with one shape, play it for a month, then try another.'],pts:['2-3-1 or 3-2-1 in 7 v 7','3-3-1 or 2-3-2 in 8 v 8','One shape at a time','Keeper not counted'],scene:'setpos'},
 {h:'The four phases of the game',p:['Build up (we start with the ball from the keeper), attack (we try to score), defend (we try to win the ball) and transition (the moment the ball changes team). Each phase has one job for the team.','Walk through the phases with a tactics board and then play them.'],pts:['Build up','Attack','Defend','Transition'],scene:'transition'},
 {h:'Press triggers and compactness',p:['The team presses on a trigger: a bad touch, a back pass or the ball near the sideline. When the ball is passed away, the team falls back and stays compact.','Use discs to mark the compact block.'],pts:['Pick one trigger','Press as a team','Fall back compact','Use discs'],scene:'cover'},
 {h:'Counter-attack and winning the ball',p:['When the team wins the ball the first pass goes forward within five seconds if space is there; otherwise it keeps the ball. The goal is to attack before the opponents are back.','Practise with a 5-second clock in small games.'],pts:['Five seconds','Forward if there is space','Otherwise keep the ball','Attack before they are back'],scene:'threevtwo'},
 {h:'A plan and a change',p:['Before a game the captain picks one plan (for example press on a back pass). At half time they review and make one change. The coach asks why.','Keep it simple and celebrate the reasoning more than the result.'],pts:['One plan','One change','Say why','Celebrate reasoning'],chart:'shape'}
 ],
 drills:[],
 faults:[['Players forget their places','Too many ideas','One idea per game; show it on the board'],['Everyone chases the ball','No trigger','Use one trigger and a cover'],['Team falls apart after a goal','No reset','Walk back to the shape and take a breath'],['Counter goes wrong','Rushing','Count five seconds and look first'],['Plan ignored','Not on the board','Show the plan on the board before and after']],
 check:'Child holds the shape in a 7 v 7, presses on a trigger, counters within five seconds and explains a plan and a change.'
