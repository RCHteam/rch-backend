 bridge:['From Kindergarten to 1st Grade','1st grade is built on the Kindergarten chapters. Kindergarten’s eleven chapters become ten (chapters 1 and 9 merge) and two new chapters are added, making twelve.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+tbl(['Kindergarten','1st grade','What happened'],[['1 Team Environment and Routines, 9 Fair Play and the Referee','1 Team Culture, Leadership and Fair Play','Merged. The team agreement is written by the players; leader of the day replaces captain jobs; disputes use stop, say, solve'],['2 Movement and Agility','2 Athletic Movement','Grew: sprint starts, quick feet, reaction, landing, body-weight strength'],['3 Ball Mastery, 4 Dribbling','3 Ball Mastery, 4 Dribbling and Moves','Grew: sequences, tempo, speed dribbling, shielding while moving'],['5 Receiving, 6 Passing, 7 Shooting, 8 1 v 1','5 to 8 (same topics)','Grew: control at pace, 10-yard passing, instep and first-time finishing, block tackle and recovery'],['10 Team Play, 11 Goalkeeper','11 Team Play, 12 Goalkeeper','Grew: jobs that rotate, transition, restart plays, ladder match days, dive and distribute'],['(no chapter)','9 Combinations: 2 v 1, 2 v 2, 3 v 2','NEW: draw a defender and pass, overlap, width'],['(a peek and a few cues)','10 Game Intelligence: Seeing and Deciding','NEW: scan routine, if-then cues, decision games, questions that teach']])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In Kindergarten','Now in 1st grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['Players lead more: leader of the day, restarts, stop-say-solve, a player-led game','Own-best goals replace comparison with other children','Seeing before doing: scan routine and questions that teach','Small combinations (2 v 1, 3 v 2) build team play from skills the children already have','Roles rotate and transitions become a habit','Every chapter links to how a 6 or 7 year old is developing (see the Development page)'])+`<h4 class="sp">Day-one checks for children arriving from Kindergarten</h4>`+ul(['Names the field thirds and follows the three signals','Balances on one foot for about 8 seconds','Links two or three ball moves on either foot','Passes with the inside of the foot at 8 yards','Attempts a move in a 1 v 1 and defends side-on','If most children pass these checks, use the Challenge progression line in each drill during the first cycle'])+`<h4 class="sp">Children who are new to the program</h4>`+ul(['Pair each newcomer with a buddy for the first month','Teach routines and signals first; skills will follow','Do not compare newcomers with children who were in Kindergarten','Use the first cycle (12 practices) as the baseline for everyone'])],
 develop:['How 6 and 7 Year Olds Develop','What is changing in the child, and what each change makes possible in soccer. This page links every chapter to child development.',()=>`<p>The CDC describes middle childhood (about 6 to 8) as a time when children become more independent, care more about friendships and being part of a team, want to be liked, develop mental skills quickly, get better at describing thoughts and feelings, and begin to care more about others than only themselves. Physical skills grow quickly, and catching and ball skills become easier.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[['Friendship and belonging','Wants to be liked; picks friends; notices who is in or out','Team agreement, buddies, leader of the day, rotating partners','1, 9, 11'],['Comparing with others','Notices who is faster or better (Erikson’s industry versus inferiority; background knowledge)','Own-best cards; no rankings; praise effort','1, 8'],['Care for others','Moves from only me to also you','Passing into space, combinations, encouragers','6, 9, 11'],['Independence','Wants to do jobs alone','Leader of the day, player-led games, own warm-up','1, 2, 11'],['Working memory and attention','Can hold 2 or 3 things in mind; attention still short','Sequences of three or four moves; three cues at a time; short games','3, 10'],['Language','Can explain what happened','Questions that teach; stop, say, solve','1, 10'],['Speed and agility window','Quick gains in running, balance and coordination (LTAD: speed and suppleness windows)','Sprint starts, quick feet, landing, cuts','2, 4, 8'],['Hand and ball control','Catching and ball skills improve','W-catch, thigh control, first touch at pace','5, 12'],['Visual tracking','Following a moving ball and several players is still maturing','Peek before the ball arrives; short looks; calm drills first','5, 10'],['Resilience','Mistakes still sting; fear of failing in front of friends','Stop-say-solve, mistake of the day, praise for brave tries','1, 7, 8']])+`<h4 class="sp">Skill readiness map</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[['Sprinting and quick feet','10 to 15 yard sprints; low markers','Reaction starts from a ready position','Long runs; heavy loading'],['Ball control','Four-move sequences; control at 8 yards','Receive and turn; thigh control','Chest control; heading'],['Passing','Inside pass at 10 yards; lead a runner','Driven pass; outside foot','Long passes over 20 yards'],['Shooting','Instep with a locked ankle; first-time finish','Placement to a corner','Power shots from distance'],['Tactics','Draw and pass; free player; front, middle, back jobs','Overlap; scan routine','Fixed positions; formations'],['Goalkeeping','Ready position; W-catch; roll and throw','Dive from a crouch','Specialist keepers; punting']])+`<p class="note">The CDC page is a general child-development summary, not a soccer document. The readiness map is our own judgment, to be checked against your own group.</p>`],
 theory:['Game Ideas for Ages 6 to 7','Tactics are taught as simple ideas inside games, in the language children use. 1st grade adds combinations and a seeing-and-deciding routine.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Spread out, draw a defender and pass, overlap, find the free player, dribble into space or shoot. Chapters 4, 6, 7, 9 and 10.</p></div><div class="card"><h4>They have the ball</h4><p>Close the nearest player, cover behind, stay goal-side, delay. Chapters 8 and 11.</p></div><div class="card"><h4>Switch</h4><p>Win it and go; lose it and defend at once. Chapters 8 and 11.</p></div></div><p>These three headings follow the phases used in the FA’s England DNA: in possession, out of possession and transition. At this age they are taught in child language, not as formal tactics.</p><h4 class="sp">Numbers up</h4><p>In a 2 v 1 or 3 v 2, the attackers have one more player. The idea is simple: the defender cannot stop everything. Draw the defender, then pass to the free player.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate who is facing you','Pass','6'],['Empty grass ahead','Dribble and speed up','4'],['A clear view of the goal','Shoot','7'],['A defender comes at you and a teammate is free','Draw and pass','9'],['A teammate is running past you outside','Overlap: pass in front','9'],['A chaser close behind and no pass','Shield or turn','4'],['A defender in front','Use a move, then burst','8'],['They have the ball','Close the nearest player or cover','11'],['You win the ball','Go at once','8, 11']])+`<h4 class="sp">Jobs, not positions</h4><p>There are no fixed positions. Front, middle and back are jobs that rotate (scorer, helper, guard). Goalkeeper is a role that rotates. Formations are not taught.</p><h4 class="sp">Questions that teach</h4>`+ul(['Where is the empty space?','Who is free?','What did you see before you got the ball?','Which rule did you use: dribble, pass or shoot?','What could you try next time?'])],
 formats:['Rules and Game Formats','The formats and rules used in 1st grade practices and festivals. Check your league’s rules before match days.',()=>tbl(['Topic','1st grade setting','Source and note'],[['Players per team','3 v 3 or 4 v 4','DFB uses 3 v 3 (and 5 v 5) for F-Jugend (U8/U9); KNVB uses 4 v 4 for the youngest; U.S. Soccer’s 4 v 4 covers U7 and U8'],['Field size','About 25 x 20 yards (3 v 3) or 30 x 20 yards (4 v 4), up to 35 x 25','DFB 3 v 3: about 25 by 20 meters. UEFA newsletter 4 v 4: about 30 x 20 meters. U.S. Soccer: 25 to 35 yards by 15 to 25 yards for 4 v 4'],['Goals','Four small goals (3 v 3) or two goals with no keepers (4 v 4)','DFB: four mini goals no larger than 2.0 by 1.2 meters, scoring from inside a 6 meter shooting zone. U.S. Soccer: goals up to 4 by 6 feet'],['Ball','Size 3','Both sources'],['Goalkeepers','None in 3 v 3 and 4 v 4; every child tries the role in practice','DFB 3 v 3 has none; UEFA’s newsletter and U.S. Soccer 4 v 4 have none; in DFB 5 v 5 a goalkeeper is optional and changes each round'],['Game length','Rounds of 8 to 12 minutes in practice; festivals rotate teams every 6 minutes','DFB: rounds up to 10 minutes (3 v 3) or 12 minutes (5 v 5); U.S. Soccer 4 v 4: four quarters of 10 minutes'],['Rotation','Rotate teams and jobs often','DFB: rotation after each goal in 3 v 3; fixed order every 3 minutes in 5 v 5'],['Referees','Coach as game leader; players call restarts','DFB: coaches act as joint game leaders and step in only when needed'],['Restarts','Kick-in or throw-in, restart from own end, free kick for hands, push or trip','DFB: opponent restarts an out-ball with a dribble or pass from the side. Follow your league and stay consistent'],['Results','No table; ladder format for match days','DFB: winners move up a pitch, losers down, with short breaks'],['Heading','Not used','U.S. Soccer age-group guidance']])+ul(['Laws taught: ball in and out, restarts, hands, push and trip','Offside and advanced fouls are not taught at this age','Use a whistle to start and stop, not to stop every mistake','If your league plays 7 v 7 with a goalkeeper at U9, introduce it gradually in 2nd grade'])],
 body:['Body, Movement and Growth','The physical qualities that matter at ages 6 and 7, and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 6 and 7','How we train it','Chapters'],[['Speed','A key trainable window; short bursts only','10 to 15 yard sprints from varied starts with full rest','2, 4, 8'],['Agility','Plant-and-push and quick changes are improving','Cut gates, reaction tag, 1 v 1','2, 8'],['Coordination','Quick feet and rhythm are developing','Low markers, sequences, juggling','2, 3'],['Balance','Longer single-leg holds; balanced landings','Balance holds, landing stations','2, 12'],['Flexibility','Dynamic and playful, not static','Dynamic moves in the run start and the warm-up','all'],['Endurance','Built through play, not long runs','Laps, games, short rests','all'],['Strength and power','Body weight only: animal walks, hops, squats','Animal power circuit','2'],['Reaction','Improving','Signal games, ready position','2, 12']])+`<h4 class="sp">What the models say</h4>`+ul(['Gallahue groups skills into stability, locomotion and manipulation; all three are practiced in every practice','Long-term athlete development models describe a fundamental stage of about 6 to 9 years (boys) and 6 to 8 (girls) that favors a broad movement base, agility, balance, coordination and speed, with light structure and many sports','Children who play several sports and games tend to build a broader base than children who specialize early (the sampling idea of Côté)'])+`<h4 class="sp">Warm-up and injury prevention</h4><p>Structured warm-up programs have been studied in youth soccer, but the strongest research is in older age groups. We use a short, player-led dynamic warm-up as sensible practice, and we keep landing, balance and body-weight strength in every cycle.</p><h4 class="sp">Growth and relative age</h4><p>Children in one age group can differ in age by nearly two years, and the oldest often look stronger, more confident and more talented. FIFA’s relative age effect summary (Verbeek) warns that early maturity can be mistaken for lasting talent. Do not group by size, rotate pairs and teams, and notice improvement against the child’s own earlier results.</p>`+ul(['Mix pairs by size and confidence in 1 v 1','Record progress against the child’s own earlier results','Praise effort and strategy, not size or speed','Note birth months in the roster so you remember the age spread'])],
 psych:['Child Psychology and Motivation','Seven ideas guide coaching behavior at this age.',()=>`<div class="cols3"><div class="card"><h4>Competence</h4><p>Design tasks so that most attempts succeed. Reduce difficulty if success falls below about half; add challenge when it is routine.</p></div><div class="card"><h4>Autonomy</h4><p>Offer small choices: which ball, which game, which job, which move.</p></div><div class="card"><h4>Belonging</h4><p>Names, rituals, buddies and a team identity. This is the strongest source of retention.</p></div></div><p>These three needs come from self-determination theory (Ryan and Deci). They explain why choice, success and friendship matter more than lectures.</p><h4 class="sp">What makes it fun</h4><p>Visek and colleagues asked soccer players aged 8 to 19 what makes sport fun. Trying your best, working hard, staying active and playing well together as a team mattered most; winning ranked 40th of 81 factors. Younger players valued a coach who lets them play different positions more than older players did. Our schedule reflects this: rotating jobs, many touches, team games and no standings.</p><h4 class="sp">Comparing with others</h4><p>At 6 and 7, children start to notice who is faster or better. Erikson called this stage industry versus inferiority (background knowledge): children who feel capable gain confidence, and those who feel behind may lose it. Protect every child: use own-best cards, praise effort, never rank, mix partners and let children lead.</p><h4 class="sp">Attention and self-control</h4><p>Working memory (holding a two- or three-step instruction), inhibitory control (stopping an automatic response) and flexibility (switching rules) are all developing quickly. Games such as Opposite Lights, Switch! and changing the rule every few minutes practice them while the children simply play. Research reviews link sport and games with executive function, but the evidence is mixed, so treat this as a design guide rather than a promise.</p>`+ul(['Give two or three steps at a time','Use the same signals every practice','Switch rules after a short play, not mid-sentence','Praise the effort to stop, wait or look'])+`<h4 class="sp">Praise that builds a growth mindset</h4>`+tbl(['Instead of...','Try...'],[['You are so talented','You tried a new move. How did it feel?'],['That was easy for you','What did you try? What will you try next?'],['You are the best','You helped your teammate. That was kind.'],['Do not cry','It is okay to feel stormy. Take a breath, then rejoin when ready.'],['I cannot do it','You cannot do it yet.']])+`<h4 class="sp">Emotions and social growth</h4>`+ul(['Weather check at arrival and close: sunny, cloudy or stormy','Calm corner: a quiet cone spot with a job to rejoin','Teach stop, say, solve and let children try before stepping in (US Youth Soccer, FA)','Keep instructions short, feedback positive and specific (U.S. Soccer)','Ask questions more than giving answers'])],
 review:['Plan, Do, Review and Game Tally','A simple loop that connects one practice to the next, and a tally sheet that shows how many actions each child had.',()=>`<div class="cols3"><div class="card"><h4>Plan</h4><p>Pick one idea. Read the day card. Set cones. Decide which three children you will watch.</p></div><div class="card"><h4>Do</h4><p>Run the practice. Keep ball-rolling time high. Pause once or twice to ask a question.</p></div><div class="card"><h4>Review</h4><p>After the practice, write three lines: what worked, what was hard, what changes next time.</p></div></div><h4 class="sp">Questions for the closing circle</h4>`+ul(['What went well today?','What was tricky?','What is my own-best goal for next time?'])+`<h4 class="sp">Coach questions after practice</h4>`+ul(['How many minutes did children stand still?','Did every child touch the ball often?','Who did I forget to praise?','What will I change in the next practice with this chapter?'])+`<h4 class="sp">Game tally sheet</h4><p>Copy this for a festival game or a player-led game. Watch three children at a time for 5 minutes. The sheet is for the coach; do not share it with the team.</p>`+tbl(['Child','Touches (estimate)','Shots','1 v 1 attempts','1 v 1 won','Passes','Note'],[1,2,3,4,5,6].map(()=>['','','','','','','']),'grid-t asm')],
 safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints and manage heat.',()=>ul(['Emphasize fundamental movement skills: balance, running, jumping, hopping, throwing, catching','Sprints stay short (10 to 15 yards) with full rest; landing and diving are practiced on soft ground and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practice earlier or later in the day, and watch for cramps, faintness or weakness (CDC guidance for athletes)','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice at this age','Check the field and anchor all goals before each practice','Keep a first-aid kit, emergency contacts and an injury plan on site','Know the signs of a concussion; a child with a suspected head injury leaves the activity and gets checked','Follow your league’s safeguarding policy, including two adults present; FIFA Guardians is FIFA’s child-safeguarding programme and a good model for a club policy','Warm-up: our running start and 2-minute dynamic moves are a simple routine. FIFA’s 11+ Kids programme (tested in a trial in children’s football) is a longer structured option; see the Sources page. For serious injuries follow the FIFA pitchside emergency-care guidance and your club’s medical lead','Children grow at different rates: do not compare or group by size'])],
 team:['Team Chemistry and Extra-Curricular','Run these across the year so belonging keeps growing.',()=>tbl(['Activity','Purpose','When'],[['Team name and chant','Identity and belonging','Weeks 1 to 2'],['Captain jobs','Ownership and responsibility','Every practice'],['Buddy of the week','Friendships across the group','Weekly'],['Shared snack','Social bonding off the field','After festivals'],['Team banner art day','Creative ownership','Mid-year'],['Family fun day','Parents and children play together','Week '+PL.FEST[1].week],['Fair play recognition','Models respect and kindness','Each practice']])],
 parents:['Working with Parents','Clear communication with families all year.',()=>tbl(['When','Team culture','Parents'],WEEKEXP)+ul(['Ask parents to encourage effort and avoid coaching from the sideline','Share one small home activity each week (toe taps, balance, the weather check)','Explain why there are no standings and why every child plays every role','Report progress using the level targets in positive, specific language'])],

 next:['Looking Ahead to 2nd Grade','The next curriculum extends this base.',()=>`<p>2nd grade deepens the same chapters: longer passing patterns, more combinations, more team shape, more decisions and game rules, and the first moves toward larger formats such as 7 v 7. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Roles become more stable in small-sided formats','Players take on more of the planning and the review','A first goalkeeper-specific block can be added for children who want it'])],

  'Tactics board':['A small whiteboard or magnetic board where the team draws a plan before play','Keep the board off the field. Children draw in thirty seconds, not minutes.','Home option: a clipboard with a sheet of paper and a marker'],

  'Medicine ball':['A light soft ball (about 1 to 2 lb, or 0.5 to 1 kg) for throws that train the trunk','Light weight only, throws away from other people, a clear catcher, no overhead throws above the head of a partner.','Home option: a soft, slightly deflated ball or a stuffed sock ball'],

 'Phone tripod':['A phone on a low tripod that films a short clip for review','Only with written parent permission; film the play, not close-ups of faces; keep clips on the coach’s device and delete them at season’s end.','Home option: a phone leaned on a water bottle at the sideline'],

const RULEINFO={
 'Kick-off and restarts':['Law 8','Kick-off at the start and after a goal; the ball moves when kicked','Revisited from 2nd grade; players run it'],
 'Referee signals':['Law 5','Signals for goal, throw-in, goal kick, corner, free kick, advantage and cards','Referee also says one short reason'],
 'Advantage':['Law 5','Play on when the fouled team still has a good chance','Children decide between whistle and play on'],
 'Fouls and cards':['Law 12','Careless, reckless or too strong; yellow caution and red off; cards are signs, never punishments in practice','Carried over from 3rd grade'],
 'Throw-in':['Law 15','Two hands, behind and over the head, both feet on or behind the line','Consolidated; used in restart plans'],

 'Corner kick':['Law 17','Ball at rest in the arc; opponents stay back','Used with three-job set plays'],

  'Kick-off: own half':['Law 8','Players stay in their own half until the ball is kicked; the ball moves forward when kicked','Learned in 4th grade; taught with positions'],
  'Offside: interfering with play':['Law 11','An offside position is only an offence when the player plays the ball, interferes with an opponent or gains an advantage','Learned in 4th grade; added to the full rule'],

  'Yellow and red cards: the ladder':['Law 12','A caution (yellow) is for unsporting behavior or repeated offences, a sending-off (red) is for serious foul play or a second caution','Learned in 5th grade; children learn the ladder as a model of fair play, not to give cards to each other'],
  'Added time':['Law 7','The referee adds time at the end of each half for stoppages','Learned in 5th grade; the child referee counts and announces it'],
  'Offside: no offence from restarts':['Law 11','There is no offside offence when a player receives the ball directly from a goal kick, a throw-in or a corner kick','Learned in 5th grade; added to the full rule'],
 'Offside: deliberate play':['Law 11','A player who receives the ball from an opponent’s deliberate play is not penalised for offside. Deliberate play means the opponent had control and a real chance to pass, win or clear the ball. Signs are a ball that travels from far, a slow ball, an expected direction and time to set the body.','Used in build-up and attacking games where a defender plays a long ball. The referee decides, and children give a one-sentence reason'],

 'Foul severity levels':['Law 12','Careless is a lack of attention and earns no card. Reckless is a disregard for danger and earns a caution. Excessive force goes beyond what is needed or endangers an opponent and earns a sending-off','Taught as a ladder with reasons. Cards are signs in role play and never punishments for children'],

 'Dissent and unsporting behaviour':['Law 12','Dissent and other verbal offences are an indirect free kick, and dissent and unsporting behaviour are cautionable offences. Stopping a promising attack unfairly is a caution for unsporting behaviour','Only the captain may ask the referee a question, calmly. Practised as respectful talk, with no cards for children'],

 'Penalty: encroachment':['Law 14','Other players must be at least 9.15 m from the mark, behind it, inside the field and outside the penalty area until the kick. Encroachment and keeper offences lead to a retake or an indirect free kick, depending on whether a goal was scored. The keeper is warned for a first offence and cautioned after','Waiting players stand in a line behind the mark. A referee checks the keeper’s foot on the line and the waiting line'],
 'No double touch at restarts':['Laws 13, 14 and 15 (idea)','The kicker or thrower may not touch the ball again until another player has touched it. The KNVB 11 v 11 form states that the same player cannot touch the ball twice after a restart, and its O13 form needs two players to touch the ball before a goal after a self-pass','Practised in set plays with a passer and a runner. Check your league for its own wording'],

 'Goalkeeper swap':['Law 3','Any player may swap with the goalkeeper if the referee is told and it happens at a stoppage. An unannounced swap leads to a caution for both players when the ball is next out','Practised with a clear call to the referee and a change of bib at the stoppage. Rotating keepers is part of our plan'],

Object.assign(GUIDE,{
  bridge:['From 5th Grade to 6th Grade','6th grade is built on the fourteen 5th-grade chapters. All fourteen grow in place with faster, bigger and more game-like work. One chapter is new: Athlete Habits. Formats grow from 8 v 8 and 9 v 9 to 9 v 9 and 11 v 11, and children take on more of the leading.',()=>`<h4 class="sp">What changed in the chapter list</h4>`+ul(['Chapters 1 to 8 keep their place and grow: captains run a whole half, sprints are timed with a stopwatch, dribblers use change of pace, receivers decide on one touch or two, passes travel 30 to 35 yards, finishing uses full-size goals, defenders press with cover and attackers meet an organised block','Chapter 9 (Positions) moves to the whole 11 v 11 picture: back four, holding, central and attacking midfield, wide players, striker, and how the jobs change in 4-3-3, 4-4-2, 4-2-3-1 and 3-5-2 shapes','Chapter 10 (Tactics) adds build-up with the keeper as an extra player, pressing signals, block height by score and time, five-second transitions and the match sheet at half time','Chapter 11 (Goalkeeper) adds sweeping, claiming crosses with the hands, 2 v 1 and penalties read instead of guessed','Chapter 12 (Rules) looks at the Laws in detail: severity of fouls, offside deliberate play and gaining an advantage, wall of three, penalty procedure and the goalkeeper swap','Chapter 13 (Set Plays) becomes a full playbook with self-pass restarts and a defending plan for every restart','Chapter 14 (Game Intelligence and Mind) counts scans, sets time limits for decisions and reviews a clip with three questions','Chapter 15 is new: Athlete Habits, covering the warm-up, cool-down, effort scale, growth signs and rest decisions that a young athlete owns'])+`<h4 class="sp">What grew, chapter by chapter</h4>`+tbl(['Chapter','In 5th grade','Now in 6th grade'],CH.map(c=>[`<a href="#/ch/${c.n}">${c.n}. ${c.short}</a>`,c.grew.pre,c.grew.k]))+`<h4 class="sp">What is new in the way we coach</h4>`+ul(['More chapters: fifteen instead of fourteen, so 90 practices (6 levels of 15) instead of 84, and a season that runs about three weeks longer, about 50 weeks including the festival weeks ('+PL.FEST.map(f=>f.week).join(', ')+')','Bigger games: 8 v 8 and 9 v 9 are the main formats, and 11 v 11 appears in the Level 5 and Level 6 finales (see the Rules and Formats page)','More leading by children: captains run halves, fill in the match sheet, referee with a crew and lead the warm-up','Growth awareness: same-age children differ widely in maturity at 11 and 12, so we watch load, rotate groups and track each child against their own results (see the Child Development and Body pages)','More intensity with care: time limits, stopwatch counts and pressure pads raise the tempo; rest stays full after sprints and power work','Eight new tools: full-size goal, pressure pads, stopwatch, foam roller, corner flags, match sheet, effort chart and line rope (see the Tools page)','Twelve new rules: offside deliberate play and gaining an advantage, foul severity levels, serious foul play, dissent and unsporting behaviour, dangerous play, wall of three, penalty encroachment, no double touch at restarts, self-pass restart, goalkeeper swap and the wrong throw-in (see the Rules page)'])+`<h4 class="sp">Check on day one</h4>`+ul(['Can the group hold a 9 v 9 shape (3-3-2 or 2-4-2) for a full round? If not, spend the first weeks of chapters 9 and 10 at Level 1 and 2 pace','Can children name the four moments of the game and give one job in each?','Does every child know the offside rule in full? If not, use the chapter 12 Level 1 and 2 exercises as the refresher','Do you have enough bibs in several colors, numbered bibs and a stopwatch? Roles, numbers and timing are used in most practices','Record birth months and any growth concerns before the first sprint practice, and note which children seem to be in a growth spurt (see the Body and Safety pages)','Get written parent permission before any phone clip is filmed'])],
  develop:['How 11 and 12 Year Olds Develop','What is changing in the child and what each change makes possible in soccer. Every chapter links to this page.',()=>`<p>The Jolles advisory report for the KNVB says that self-evaluation and empathy develop mainly from early adolescence, that a child’s verbal skill can mislead adults about what they understand, and that concrete feedback and small responsibilities work best. It also advises against selecting players before about age 12 and notes that motor development differs widely between about 8 and 14. The FA’s Youth Development Phase pages add that game demands are getting faster, that technical demands apply to all 11 players, that players mature at different rates and that birth date within the year matters. They describe growth across the FA 4 Corner Model (technical, physical, psychological and social) and ask for both challenge and support, so that every young person has positive, memorable experiences.</p><h4 class="sp">Growth spurts and bio-banding</h4><p>Cumming’s bio-banding guide explains that players of the same age differ widely in maturity. Bio-banding groups players by maturity, measured as a percent of predicted adult height, instead of by age. Peak height velocity usually arrives at about 88 to 96 percent of adult height. Early maturers are bigger, stronger and faster, mostly around ages 11 to 14. Late maturers can be disadvantaged in selection, roles and injury risk when they are mismatched in size, but differences in maturity shrink or reverse in adulthood and youth success only weakly predicts adult success. The guide treats bio-banding as an add-on to age-group sport, for example an occasional bio-banded game, and not a replacement. A Premier League trial used players aged 11 to 14 in the 85 to under 90 percent band. During a spurt, temporary awkwardness is common, so the guide suggests screening fundamental movement skills and monitoring training load, because overuse and growth-related injury risk rises.</p><p>A news summary of a University of Bath and AFC Bournemouth study surveyed over 100 young players. Early maturers said bio-banded games gave them more physical and technical challenge and a chance to learn from older players. Late maturers said they had more chance to show technical and tactical skill and to lead. All groups perceived a lower injury risk. These are perceptions, not measured injury outcomes. We use bio-banding as an idea for occasional mixed groups, not as a measurement program: we do not measure children’s height or predict adult height in this plan.</p>`+tbl(['What is developing','What it looks like','What it makes possible','Chapters'],[
   ['Maturity and body size','Same-age children can differ widely; early maturers are often bigger, stronger and faster, late maturers catch up later','Mixed groups, own-best targets, occasional groups by size for some games, no ranking by body','2, 15'],
   ['Self-evaluation and empathy','Grow mainly from early adolescence; children start to see a game from a teammate’s or referee’s side','Peer feedback with one fact and one next step, helper referees, clip review with three questions','1, 12, 14'],
   ['Belonging and status among peers','Peer opinion matters more; comparing with others is common','A written team charter, rotating partners and roles, include-everyone rules','1, 9'],
   ['Coordination in a growth spurt','Temporary awkwardness is common during fast growth','Movement checks, repeated basics, less jumping for a child in pain','2, 3, 4, 15'],
   ['Speed and power','Quick improvement is possible, and fast growth can change balance and strength','Short sprints with full rest, light power work, technique first','2, 15'],
   ['Holding a team picture','In general, children can hold a plan and talk about it, but forget it under pressure','One idea per moment, shapes, roles, the match sheet','9, 10'],
   ['Technical demands for all 11 players','Game demands get faster, and everyone must receive, pass and see the game (FA YDP)','Every player trains first touch, passing, shooting and scanning, including defenders and the keeper','4, 5, 6, 11'],
   ['Deciding under time pressure','Choices are better with practice but suffer with tiredness and noise','Stopwatch limits, scan counts, pressure pads, decision cues','4, 8, 14'],
   ['Planning and responsibility','Can follow a playbook and lead a part of a practice','Set plays, captains, substitutions, half-time plan','1, 10, 13'],
   ['Handling pressure and mistakes','Mistakes in front of peers can sting','Breathing and a set routine, penalty routines, a reset after errors','6, 11, 14'],
   ['Health habits','Old enough to own a routine and to report pain','Four-stage warm-up, cool-down, effort scale, rest decisions','15']
  ])+`<h4 class="sp">Training load</h4><p>The 2014 Lloyd consensus statement on youth resistance training (BJSM) says that work should be supervised, technique comes first, loads stay at bodyweight or light, sessions fall on two or three non-consecutive days and power work needs full rest. A University of Bath abstract on the adolescent growth spurt reports that injury risk is higher around peak growth and that adjusting load may reduce it. We read only the abstract, so it is a pointer. In practice we watch for knee or heel pain, reduce jumping and long runs for a child who reports pain, and never compare children by size.</p><h4 class="sp">The step toward teenage soccer</h4><p>Next year most children turn 12 or 13 and meet the full 11 v 11 game. The FA pitch table for U13 to U14 uses 90 by 55 yards with 21 by 7 foot goals, and the KNVB O13 form uses a full pitch with flying substitutions. This year is the bridge: bigger games, more roles, more responsibility and more care for growing bodies. Each chapter says what it adds toward that step.</p><h4 class="sp">Skill readiness map for 6th grade</h4>`+tbl(['Skill','Ready','Emerging','Not yet'],[
   ['Sprinting and agility','10 to 30 yard sprints with full rest; cuts on a cue; box step-ups and soft landings; timing against own best','Reaction lights; repeated sprints with partner rest; pressure-pad cues','Heavy resistance; long repeated runs without rest'],
   ['Ball control','Control at speed with one touch or two; thigh, chest and instep on higher balls; two feints in a row','First touch away from a pressing defender within a time limit','Heading'],
   ['Passing','Driven and lofted passes of 30 to 35 yards; Y, diamond and box patterns','Disguising a pass; playing through a pressing line in 11 v 11','Long diagonals every time without a miss'],
   ['Shooting and finishing','Placement and power; half-volleys from a feed; finishes from crosses with the feet; penalty routine','Curl around a mannequin; finishing after a sprint','Power shots from distance'],
   ['Defending','Press with cover; recovery runs; zonal marking in a block','Pressing traps with team signals; defending a restart','Sliding tackles'],
   ['Tactics','Four moments; 9 v 9 shapes; build-up with the keeper as an extra player','4-3-3, 4-4-2 and 4-2-3-1 in 11 v 11; changing block by score and time','Complex rotating systems'],
   ['Goalkeeping','Positioning from different angles; claiming crosses with the hands; distribution','Sweeping behind the line; reading penalties; organising the wall','Specialist-only training'],
   ['Habits','Lead a warm-up stage; rate effort; report pain','Lead a whole warm-up and cool-down; decide on rest','Planning training load alone']
  ])+`<p class="note">This readiness map is our own coaching judgement, informed by the sources on the Sources page. Check it against your own group. Children can differ by nearly two years in age and by much more in maturity and size.</p>`],
  theory:['Game Ideas for Ages 11 to 12','Tactics are still taught as ideas inside games, now with fuller language. 6th grade moves toward match-like games, with the 11 v 11 picture, team shape, and decisions under pressure.',()=>`<div class="cols3"><div class="card"><h4>We have the ball</h4><p>Build from the keeper, find the free player, play between the lines, use width and depth, finish. Chapters 5, 8, 10 and 11.</p></div><div class="card"><h4>They have the ball</h4><p>Press on a signal or a trap, cover, stay compact, choose a block, recover goal-side. Chapters 7 and 10.</p></div><div class="card"><h4>Switch and restart</h4><p>Win it and go within five seconds, lose it and press or drop, and plan every restart. Chapters 10 and 13.</p></div></div><p>The FIFA Training Centre’s progressive methodology for ages 12 to 15 has three phases. Technical foundation means many touches, repetition and unopposed competition. Tactical introduction means decision-making and questions. Game application is match-like, with fewer restrictions and the coach stepping back; one example is a 1 v 1 where the player has 5 seconds to attack after winning the ball. In 6th grade our Levels 1 and 2 lean on the first phase, Levels 3 and 4 on the second and Levels 5 and 6 on the third. That mapping is our own coaching judgement.</p><h4 class="sp">What FIFA suggests for ages 12 to 15</h4>`+tbl(['Idea','What the FIFA pages describe','How we use it in 6th grade'],[
   ['Keep the theme central','Keep the session theme central, add competition and use game-like scenarios; use leading questions so that players discover','One chapter theme per practice and a Level 6 game that matches it; coach questions at pauses'],
   ['Success-based design','Design tasks so that players succeed often and the challenge rises gradually','Levels raise space, time and pressure step by step'],
   ['Rondos and keep-away','A rondo with 3 teams of four: two defenders press, attackers make four passes, then switch play; a 5 v 5 with a 4 v 1 in each half','Used in chapters 5 and 9 as pivot and rondo exercises'],
   ['Positioning and shape','Game application links training to matches; the concepts are positioning, off-the-ball movement and team shape','Chapters 9 and 10'],
   ['Overloads','A 3 v 3 plus 2 neutral players in outside corridors','Chapter 8 overload and switch games'],
   ['Zones','An 11 v 11 with the pitch split into defender, midfielder and forward zones; a goal counts only if every zone took part, and roles rotate','The Zone Goal Match in chapter 10'],
   ['Rules that shape behavior','Goal-by-condition scoring, a goalkeeper-only zone, neutral players that cannot be attacked; raise pace and pressure gradually','Twists and bonus points in the Level 5 and 6 games']
  ])+`<h4 class="sp">The four moments of the game</h4>`+tbl(['Moment','Child language','What we practice'],[['In possession','We have the ball','Build from the back, support, width, depth, play between the lines, third-man runs, shoot'],['Out of possession','They have the ball','Press on a signal or a trap, cover, stay compact, choose a block, recover'],['Transition','Switch','Win it and go within five seconds; lose it and press or drop within five seconds'],['Restart','Ball out or foul','Corners, free kicks, throw-ins, goal kicks, kick-off and self-pass restarts as planned moves']])+`<h4 class="sp">Principles, in plain words</h4>`+tbl(['Principle','Plain words','Chapter'],[['Support','Be near enough to help, at an angle the passer can see','5, 8'],['Width','Stretch the field with players near the sidelines','8, 10'],['Depth','Someone stays in front and someone behind the ball','8, 10'],['Between the lines','Find the space between their midfield and their back line','8'],['Overload','Play where you have more players than they do, then switch away from it','8'],['Compactness','Stay close together when they have the ball','7, 10'],['Cover and balance','Stand behind the pressing teammate; the far player guards the far side','7, 10'],['Pressing signal','Everyone presses at the same call or the same trigger','7, 10'],['Scan','Look before you get the ball and again after the first touch, and count your looks','4, 14'],['Rhythm of restarts','A named play, a clear job for each player and one quick option','13']])+`<h4 class="sp">Offside in 6th grade</h4><p>Children have met the idea (stay level), the last 14 yards step and the full rule with interfering with play. This year the details of IFAB Law 11 arrive. An offside position means any part of the head, body or feet is in the opponents’ half (not the halfway line) and nearer to the opponents’ goal line than both the ball and the second-last opponent; hands and arms are disregarded, and level is not offside. An offence needs involvement in active play: interfering with play, interfering with an opponent, or gaining an advantage from a rebound or deflection. Receiving the ball from an opponent’s deliberate play is not an offence, unless it was a deliberate save. There is no offside from a goal kick, a throw-in or a corner kick. Rules differ by association: the KNVB 8 v 8 form for O11 and O12 has no offside, the FFF judges offside from the halfway line at U13, and the NFV framework says offside may be applied to encourage through balls. Check your league.</p><h4 class="sp">Decision cues</h4>`+tbl(['If you see...','Then try...','Chapter'],[['An open teammate facing you','Pass, and move','5'],['The near side is crowded','Switch to the far side','5, 8, 10'],['Empty grass ahead','Dribble and change pace','3'],['A defender in front and a gap behind them','Feint then burst, or a through pass','3, 5'],['An organised block','Find the space between the lines, or overload one side and switch','8'],['A bad touch by them or a back pass','Press signal: go together','7, 10'],['The ball goes wide and your team is behind it','Close the line and press into the trap','7, 10'],['You win the ball','Look forward first and go within five seconds','10'],['You lose the ball','Press for five seconds or drop behind the ball','10'],['The ball is out','Name the restart and the play','13']])+`<h4 class="sp">Questions that teach</h4>`+ul(['What did you see before you got the ball? What did you see after your first touch?','Which option did you choose, and why?','Where was the free player or the space?','What was the plan for this moment? What would you change at half time?'])],
  positions:['Positions: Advanced Roles for 11 v 11 Thinking','Eleven numbered roles taught as jobs, learned by playing them. Chapter 9 teaches them; chapters 10, 11 and 13 use them. Every child still rotates through the roles during the year.',()=>`<p>At this age we teach positions as jobs with and without the ball, not as a place a child is stuck in for life. The Jolles report advises against selecting players early, the FA Youth Development Phase says technical demands apply to all 11 players and growth is uneven, so we rotate. The numbered positions are a common world-wide convention that we use as a shared language: 1 goalkeeper, 2 and 3 full-backs, 4 and 5 center backs, 6 holding midfielder, 7 and 11 wide players, 8 central midfielder, 9 striker, 10 attacking midfielder. The numbers are background knowledge, not a rule. Numbered bibs and position bibs show the job, and bibs are swapped when roles rotate.</p>`+tbl(['Position','With the ball','Without the ball','Good habits to praise','Where in our shapes'],[
   ['Goalkeeper (1)','Start play with a roll, throw or kick; be a safe pass for the defenders; pick the target; a sweeper-keeper may play outside the area to start attacks','Narrow the angle, catch, save, claim crosses with the hands, read balls over the top, organise the wall and the back line','Loud voice, early position, quick release, calm after a mistake','Ch 11; the back player in every shape'],
   ['Full-backs (2, 3)','Overlap or underlap, support the wide player, cross low','Guard the side, stay compact, close the wide player, recover fast','Timing of the run, honest recovery','Wide at the back in a back four'],
   ['Center backs (4, 5)','Pass safely, split to receive from the keeper, step forward with the ball when there is space','Stay goal-side, cover the partner, win duels on the ground, call the line','Calm on the ball, talking, staying on their feet','Two in a back four, three in a back three'],
   ['Holding midfielder (6)','Offer a safe pass, switch the play, turn quickly','Screen the defence, press the first pass, win second balls','Scanning, short passes, staying in position','The base of a midfield three or one of the two in a 4-2-3-1'],
   ['Central midfielder (8)','Link the lines, make third-man runs, arrive in the area','Press as a group, track runners, cover','Running both ways, support angles','Middle in 4-3-3, 4-4-2 and 3-5-2'],
   ['Attacking midfielder (10)','Find space between the lines, play the last pass, shoot','Press the first defender and block the pass into the 6','Vision, quick decisions, first-time passes','Behind the striker in 4-2-3-1'],
   ['Wide players (7, 11)','Stay wide, take on a defender, cross low or cut inside','Track back, help the full-back, stay compact when the ball is on the other side','Staying wide, bravery in 1 v 1, tracking back','Wingers in 4-3-3 and 4-2-3-1, wide midfielders in 4-4-2'],
   ['Wing-back','Run the whole side, overlap high and cross','Drop to form a line of five, with the other wing-back tucked in','Stamina, timing, honest recovery','Both sides in a 3-5-2'],
   ['Striker (9)','Move to open a lane, finish, hold the ball and lay it off','Press the first defender, set the press signal, block the pass','Movement before the pass, finishing, first press','At the front in every shape; two strikers in 4-4-2 and 3-5-2']
  ])+`<h4 class="sp">How roles change with the shape</h4>`+tbl(['Shape','Back to front','What changes for the roles'],[['4-3-3','Four defenders, three midfielders, three forwards','The 6 sits in front of the back four; two 8s link; wingers stay wide and the striker leads the press'],['4-4-2','Four defenders, four midfielders, two strikers','Wide midfielders do both the winger and the 8 job; two strikers press and pair up'],['4-2-3-1','Four defenders, two holding midfielders, three attackers, one striker','Two 6s protect the back four; the 10 plays behind the striker; wide players track back'],['3-5-2','Three defenders, five midfielders, two strikers','Wing-backs run the whole side; the middle three of the midfield link and cover; the back three share the middle']])+`<p class="note">Shape numbers are written back to front without the goalkeeper. In 9 v 9 the same jobs appear in smaller shapes such as 3-3-2 and 2-4-2. These are practice shapes to explain jobs, not a league rule, and the shape your league uses may differ.</p><h4 class="sp">My job, my partner’s job, my line’s job</h4><p>Before a game each child says three things for each phase of play: my job, my partner’s job and my line’s job. A role card in the pocket helps. The FA 4 Corner Model reminds us that each role has technical, physical, psychological and social demands, for example a center back needs calm and voice, and a wing-back needs stamina.</p><h4 class="sp">How we teach positions</h4>`+ul(['Learn the job in a small game first (3 v 3 or 4 v 4), then place it in a 9 v 9 or 11 v 11 shape','Rotate every child through every role, including goalkeeper, across the year; never keep a child in one place because they are big, fast or good','Say the job in one sentence, then show it: “Wing-back: overlap when the winger holds the ball.”','Use role cards and numbered bibs so children can say “my 6” and find each other','Ask the child what the job is before and after the game','Change bibs, not the idea: the same child may wear a defender bib on Tuesday and a striker bib on Thursday','The FIFA zone game for 11 v 11 (a goal counts only if the defender, midfielder and forward zones all took part, and roles rotate) is a good way to teach the shared picture'])],
  tactics:['Tactics: Phases, Blocks, Build-Up and Plans','Game tactics that fit 11 and 12 year olds. They are tools for understanding the game, not scripts.',()=>`<p>The FIFA Training Centre says that for ages 12 to 15 the game application phase is match-like, with fewer restrictions and the coach stepping back, and its optimising game application page lists the tactical concepts as positioning, off-the-ball movement and team shape. The FA 4 Corner Model reminds us that technical, physical, psychological and social growth all matter. We follow these in a children’s version: one idea per moment, short words and many chances to solve problems in games.</p><h4 class="sp">The four moments and what to do in each</h4>`+tbl(['Moment','Team job','Rules we use'],[['In possession','Keep the ball and move it forward','Build from the keeper with the keeper as an extra player, find the free player, spread wide, offer depth, play between the lines, switch when one side is crowded'],['Out of possession','Win the ball back','Press on a team signal or a trap, cover behind the presser, stay compact, keep the ball in front of you'],['Transition to attack','Go fast after winning the ball','Look forward first, go within five seconds, support the ball'],['Transition to defence','Stop the counter after losing the ball','Press the ball for five seconds, or drop behind the ball and re-form']])+`<h4 class="sp">Build-up with the keeper as an extra player</h4><p>The team plays from the keeper into the defenders, then into the midfield, then forward. The keeper joins the passing, so the team has one more player than the pressers. Defenders spread wide, a midfielder offers in the middle and the striker pins the last line. The idea is to find the free player, not to avoid risk. If the other team presses, play long to a target and win the second ball. Practised in chapters 10 and 11.</p><h4 class="sp">Pressing signals and traps</h4><p>A signal tells the team to press together: a bad touch, a back pass, a pass to the sideline or a call from the striker. A trap is a planned signal: leave a pass open on purpose, then close it when the ball goes there. The nearest player presses, the next covers and the others tighten up. When there is no signal the team holds its block. Chapters 7 and 10 practise the signals with a line rope and a stopwatch.</p><h4 class="sp">Block heights</h4>`+tbl(['Block','Where the team defends','When we might choose it'],[['High block','Near the opponents’ goal, with the press starting from their build-up','When we trail, when the opponents build slowly, or when our legs are fresh'],['Mid block','Around the halfway line','A balanced choice at the start of a game'],['Low block','Close to our own goal, with lines tight','When we lead late, or when the opponents are faster than us']])+`<p>Block choice depends on score, time and energy. Our coaching judgement is to let the captains choose with the coach, then review the choice at half time.</p><h4 class="sp">Transitions and the counter</h4><p>Five seconds is the rule of thumb for both directions. After winning the ball, look forward first. If there is a gap, go; if not, keep the ball. After losing it, the nearest players press and the others drop behind the ball. A counter-attack needs three things: a forward pass, a runner and support within five seconds. Chapters 7, 8 and 10 practise this.</p><h4 class="sp">Shapes</h4>`+tbl(['Format','Shape','Why we use it','What it asks of the team'],[['9 v 9','3-3-2','A solid back line with two forwards','Building and pressing as a team'],['9 v 9','2-4-2','A wide midfield with width on both sides','Width and covering the far side'],['9 v 9','3-2-3','Three forwards and a pair of holding midfielders','Pressing high and switching fast'],['11 v 11','4-3-3','Width from two wingers and a midfield three','Wingers track back; the 6 protects the back four'],['11 v 11','4-4-2','Two strikers and two banks of four','Staying compact and pairing the strikers'],['11 v 11','4-2-3-1','Two holding midfielders and a 10 behind the striker','Pressing from the front and covering the middle']])+`<h4 class="sp">The half-time plan and the match sheet</h4><p>At half time the captain fills in the match sheet: one thing that worked, one change and a reason, plus a job for each line. The talk takes about two minutes. The plan must fit on the tactics board. After the game, review with three questions: what worked, what did not, what do we try next.</p><h4 class="sp">Set plays</h4><p>Children plan and run corners, free kicks, throw-ins, goal kicks and self-pass restarts, with a passer, a runner and a decoy. Chapter 13 is dedicated to them. Each play has a name or a color so that the team can call it. The KNVB O13 form requires opponents to be at least 5 m away at a self-pass restart; our practice distances are a coaching choice.</p><h4 class="sp">Coach cautions</h4>`+ul(['Shapes are teaching tools: rotate players through every spot and change shapes often','Do not fix a team in one shape for a whole season','Keep instructions short and ask questions instead of giving every answer','Praise the decision as well as the result','Do not use tactics to hide weaker players; the FA says technical demands apply to all 11 players'])],
  formats:['Rules and Game Formats','The formats used in 6th grade practices and festivals and what some associations publish for this age. Formats vary by association, so check your league’s rules before match days.',()=>tbl(['Topic','6th grade setting','Source and note'],[
   ['Players per team','5 v 5 and 6 v 6 in Level 1, 7 v 7 and 8 v 8 in Levels 2 to 4, 9 v 9 in Level 5 and 11 v 11 in the Level 6 finales; 10 v 10 is a bridge option when you have 20 players (our coaching judgement)','KNVB O13: 11 v 11 (2026/27 match-form infographic, in Dutch). FFF U13: 8 per team plus up to four substitutes, with a minimum of 7 players. FA: 9 v 9 at U11 to U12 and 11 v 11 at U13 to U14. SBFV D-Junioren: 7 v 7 or 9 v 9 in 2024/25 and only 7 v 7 from 2025/26. NFV D-Jugend pilot (2026/27): 6+1 v 6+1. Even inside Germany the choice varies'],
   ['Field size','Practice sizes up to about 80 x 50 yards (9 v 9) and 90 x 55 yards (11 v 11)','KNVB O13 and 11 v 11: 100 to 105 m by 64 to 69 m. FA 9 v 9: 80 x 50 yards. FA 11 v 11 (U13 to U14): 90 x 55 yards. FFF U13: 55 to 70 x 40 to 50 m, or 60 to 65 x 50 m. SBFV 9 v 9: 70 to 80 x 50 to 60 m. NFV 7 v 7: 50 to 65 x 35 to 50 m'],
   ['Goals','Pop-up goals, youth goals and, in the middle and upper levels, full-size goals for finishing and 11 v 11','FA 9 v 9: 16 x 7 ft. FA 11 v 11 (U13 to U14): 21 x 7 ft, with 8 x 24 ft also acceptable. KNVB senior goals: 244 x 732 cm. FFF U13: 6 x 2.10 m. NFV: 5 x 2 m'],
   ['Ball','Size 4 or 5, matching your league','KNVB 11 v 11 (U15 and up): size 5. FFF U13: size 4. NFV: size 4 or 5 (350 g). KNVB 8 v 8: size 5 advised'],
   ['Goalkeepers','Rotate; hands in the own area; back-pass rule; distribution with the hand or off the ground; swap at a stoppage with the referee told','IFAB Law 3: any player may swap with the keeper at a stoppage if the referee is informed. KNVB 11 v 11: no pick-up of a foot back-pass. FFF U13: indirect free kick if the keeper holds more than 6 seconds, touches again after release, handles a deliberate pass or throw-in, or clears with a volley or half-volley. IFAB Law 12: more than 8 seconds is a corner kick to the opponents'],
   ['Game length','Rounds of 12 to 15 minutes in practice; festivals rotate teams','KNVB O13: 2 x 35 minutes (divisions 1 and 2) or 2 x 30. FFF U13: 2 x 30 with a 2-minute coaching pause after about 15 minutes. SBFV: 60 minutes as two halves of 30. NFV: 60 minutes as 4 x 15 or 3 x 20, with at least 75 percent playing time'],
   ['Playing time and rotation','Rotate positions, teams and the goalkeeper; equal playing time','FFF U13: every player plays at least 50 percent. NFV: every squad player plays. Our plan: share time evenly'],
   ['Substitutions','Rolling substitutions at stoppages, entering at the halfway line','KNVB O13: flying substitutions at the halfway line, up to 7 substitutes. FFF U13: at a stoppage with the referee’s permission, and substituted players may return (Tarn-et-Garonne). IFAB Law 3: the outgoing player leaves at the nearest boundary point within 10 seconds, the substitute enters at the halfway line at a stoppage on the referee’s signal; returning substitutes are allowed in youth football only with association approval'],
   ['Referees','Children referee short games with an adult beside them; adult referee and assistants in finales; assistant flag taught','KNVB 11 v 11: assistant referees signal offside and substitutions. Coaches stay in the dugout and players greet the referee with a fist bump'],
   ['Restarts','Throw-in by hand, goal kick from the ground, corner from the arc, free kicks with a wall of three, penalty from the mark, dropped ball, self-pass restart as an option','KNVB O13: self-pass restart with the ball on the line, opponents at least 5 m away and 5 seconds to restart; after a self-pass no direct goal, the ball must touch two players first. NFV: self-pass recommended instead of throw-ins, may extend to all set pieces; penalty from 8 m. FFF U13: opponents 6 m, penalty from 9 m, goal kick placed 9 m from the goal line. IFAB Law 13: opponents at least 9.15 m (10 yards), wall of three or more, attackers 1 m from the wall. IFAB Law 14: penalty procedure. IFAB Law 15: throw-in procedure, opponents 2 m'],
   ['Fouls and cards','Foul severity taught with reasons; no cards for children in practice','KNVB O13: a yellow card is a 5-minute time penalty in this category; two yellows or a direct red is a sending-off with a replacement after 5 or 10 minutes. IFAB Law 12 sets the ladder: careless, reckless (caution) and excessive force (sending-off)'],
   ['Offside','The full rule from Level 3, with deliberate play and gaining an advantage','KNVB 8 v 8: offside does not apply. FFF U13: judged from the halfway line. NFV: offside may be applied to encourage through balls. IFAB Law 11 is the full 11 v 11 rule'],
   ['Heading','No heading practice','The FA guidance (read on a county FA page) has no heading in training in the foundation phase and a graduated approach in the development phase (U12 to U16), with match rules unchanged. Our plan has no heading practice in 6th grade; follow your league'],
   ['Results','No table at festivals; the Level 1 to 6 finale ladder: winners move up and losers move down, so every game stays close','Our plan: the finale ladder runs from smaller games at Level 1 to the biggest games at Level 6']
  ])+ul(['Use a whistle to start and stop, not to stop every mistake','The Law gives the keeper eight seconds; the French district rules give six. Teach “release quickly”','If your league plays 11 v 11 next year, 6th grade is the practice year; one season of 9 v 9 plus 11 v 11 finales is a good bridge','Associations change formats often; the 2026/27 KNVB and NFV pages are a snapshot, so recheck before match days'])],
});
Object.assign(GUIDE,{
  tools:['Training Tools','The tools used in 6th grade, where each first appears in the plan, and how to use it safely. Eight tools are new this year. Each is drawn in the exercise animation.',()=>{const f=firstUse(11);return `<p>Tools add variety, make the idea visible and give children something to explore. None is required: each has a home substitute. “Since” shows whether the tool is new this year or came from an earlier grade. “First seen” is the first practice in the plan where the tool is in an exercise. The power-work tools (bands, plyo boxes, balance pods and the medicine ball) are light on purpose, and the foam roller is used gently; see the Safety and Body pages. The pressure pad is a cue that a defender holds still, never something to push or hit with. The phone tripod is used only with parent permission.</p>`+tbl(['Tool','Since','What it is','First seen','Used in','Safe use','Home option'],Object.keys(TOOLINFO).filter(t=>f[t]).map(t=>{const i=TOOLINFO[t],u=f[t],nw=NEWTOOLS.includes(t);return [`<b>${t}</b>`,nw?'<b>New in 6th grade</b>':'Earlier grade',i[0],`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`,u.cnt+' exercises',i[1],i[2]];}))+`<p class="note">The tool is shown inside the animation of each exercise that uses it, and the exercise card has a New tool line.</p>`;}],
  rules:['Rules of the Game','The real rules of soccer taught inside games, with the matching IFAB Law and the first practice in which each appears. This year adds the details: offside deliberate play and gaining an advantage, foul severity, serious foul play, dissent, dangerous play, the wall of three, penalty encroachment, no double touch at restarts, the self-pass restart, the goalkeeper swap and the wrong throw-in.',()=>{const f=firstUse(12);return `<p>Rules are taught inside games, not by lecture. In 5th grade the card ladder, penalty shoot-outs, denying a goal-scoring chance and the assistant referee arrived. In 6th grade the Laws get closer to the full 11 v 11 game and children use them as referees, assistants and captains. The Law summaries come from theifab.com: Laws 3, 5, 8, 10, 11, 12, 13, 14 and 15 were read. Laws 6, 7, 9, 16 and 17 were not opened here, so the assistant referee flag, added time, ball in and out of play, the goal kick and the corner kick are taught from background knowledge. Check the current Laws before teaching a detail. The self-pass restart comes from KNVB and NFV youth material and is not an IFAB Law. The shorter practice distances are our coaching choice.</p>`+tbl(['Rule','IFAB Law','What children learn','Coach note','First seen','Used in'],Object.keys(RULEINFO).filter(t=>f[t]).map(t=>{const i=RULEINFO[t],u=f[t];return [`<b>${t}</b>`,i[0],i[1],i[2],`Practice ${u.s} (Ch ${u.ch}, Level ${u.lv}): ${u.name}`,u.cnt+' exercises'];}))+`<h4 class="sp">What changes by level</h4>`+tbl(['Level','Rule focus'],[['1 Introduce','Referee signals, ball in and out of play, quick free kick, fouls: tackling and holding, the goalkeeper swap, foul severity levels, dissent, handball, the wrong throw-in, goal kick, corner kick and advantage'],['2 Practice','Substitutions, kick-off in the own half, the eight-second keeper rule, offside deliberate play, the wall of three, goal kick and corner kick'],['3 Develop','The full offside rule, gaining an advantage, dangerous play, penalty encroachment, no double touch, the self-pass restart, quick free kicks and the throw-in'],['4 Challenge','Serious foul play, the back-pass rule, direct and indirect free kicks, the wall of three, no double touch, the self-pass restart and the goalkeeper swap'],['5 Combine','Penalty kick, penalty shoot-out, added time, offside interfering with play and no offence from restarts, dissent, encroachment and several restarts in one game'],['6 Perform','Denying a goal-scoring chance, repeated penalty encroachment checks, no double touch, the self-pass restart, substitutions and advantage in 11 v 11 games run by the players']])+`<p class="note">Rules are applied step by step. Check your league for the age at which the full rules apply and for local variations such as time penalties, self-pass restarts and shorter distances.</p>`;}],
  body:['Body, Movement and Growth','The physical qualities that matter at ages 11 and 12 and how each practice trains them without turning play into fitness.',()=>tbl(['Quality','At ages 11 and 12','How we train it','Chapters'],[['Speed','Short bursts with full rest; the first 10 yards matter most; own-best times','Acceleration starts, cone-sprint grid, timing gates with the stopwatch, reaction lights','2, 3, 7'],['Agility','Changes of direction on a cue; sharp stops and cuts','Angle cuts, dots, ladder, hurdles, pressure-pad cues','2, 3, 4'],['Coordination','May dip for a while during a growth spurt','Two feints in a row, sequences, movement checks, repeat basics','2, 3, 4, 15'],['Balance','Single-leg control and stable landings','Pod hops, box landings, band walks, keeper dives onto a mat','2, 11, 15'],['Flexibility','Dynamic moves before play, easy stretches after','Four-stage warm-up, cool-down circle','15'],['Endurance','Built through games and short rests','Laps, 9 v 9 and 11 v 11 games, repeated sprints with partner rest','all'],['Power','Light and skill-based: low jumps, light bands, a light medicine ball','Step-ups to a box of up to 18 inches, band walks, short throws; few reps, full rest','2, 15'],['Reaction','Improves with practice','Lights, calls, tennis-ball catches, pressure-pad cues','2, 4, 11, 14']])+`<h4 class="sp">What the sources say</h4>`+ul(['Cumming’s bio-banding guide (read): same-age players differ widely in maturity, a growth spurt often brings temporary awkwardness, and coaches should screen fundamental movement skills and monitor training load because overuse and growth-related injury risk rises','The Lloyd 2014 BJSM consensus statement (read): supervised, technique first, bodyweight to light loads, two or three non-consecutive days, full rest for power work','A University of Bath abstract (read, abstract only): injury risk is higher around peak growth, and adjusting load may reduce it; a pointer, not a protocol','The Jolles report (read earlier): motor development differs widely between about 8 and 14, and concrete feedback and small responsibilities suit this age'])+`<h4 class="sp">Sprint dosage</h4><p>Our plan uses short sprints of about 10 to 30 yards, with the first 10 yards given special attention, and a full rest of about ten times the work time. Children time themselves against their own best with the stopwatch, never against each other. A typical block is a small set of runs, with a stop when form slips or the child says a leg hurts. These numbers are our own coaching judgement, not figures from the sources.</p><h4 class="sp">Strength work</h4><p>Low plyo boxes (up to 18 inches, or 45 cm), light resistance bands and a light medicine ball (about 1 to 3 lb, or 0.5 to 1.5 kg) are used for a few controlled repetitions with full rest, as part of a game or circuit, with the focus on landing softly, balance and good form. They are not weight training: no heavy loads, no loaded squats, no maximal lifts and no training to failure. Lloyd’s consensus supports supervised, technique-first work on non-consecutive days; the loads and repetitions here are our own judgement, not figures from that paper.</p><h4 class="sp">Growth spurt monitoring</h4><p>Differences in maturity are biggest around ages 11 to 14, and a spurt can come early or late. Cumming’s guide says that peak height velocity usually arrives at about 88 to 96 percent of adult height. We do not measure height. We watch for signs: new clumsiness, a drop in power, knee or heel pain, or a child who is suddenly much taller. For such a child we reduce jumping, sprints and long runs, keep full rest, and ask the parents to speak to a doctor if pain lasts. The Bath abstract is the reason we reduce load rather than push through.</p><h4 class="sp">Bio-banding in practice</h4><p>Bio-banding is an add-on to age-group sport, not a replacement. In our plan it means occasional mixed groups: sometimes children of similar size play each other, and sometimes mixed sizes play together so that early maturers meet more skill and late maturers get more chances to lead. The Bath and AFC Bournemouth summary reports that players said this gave early maturers more challenge and late maturers more chances to show skill, but it measured perceptions only. Never publish a child’s maturity or size to the group.</p><h4 class="sp">Heading</h4><p>There is no heading practice of any kind in 6th grade. The FA guidance (read on a county FA page) has no heading in training in the foundation phase and a graduated approach to heading training in the development phase (Under 12 to Under 16), with heading rules in matches unchanged. A Training Ground Guru headline reports that the FA bans heading in training for under-12s; we did not open that article. Because 6th graders are 11 and 12, we do not start heading practice. Air passes in this plan are kicked, thrown or controlled with the thigh and chest. Follow your league and the FA guidance for your own country.</p><h4 class="sp">Load and recovery habits</h4><p>Chapter 15 teaches the habits: a four-stage warm-up (raise, activate, mobilise, prepare), a cool-down with slow walking and breathing, a gentle foam roller on calves and thighs, a 1 to 10 effort chart, water breaks, and telling the coach about pain. A structured warm-up such as FIFA 11+ Kids can reduce injuries in children’s football (abstract level). The foam roller and the movement checks are our coaching judgement, not research findings. Coaches give no diet plans and never comment on body size.</p>`+ul(['Mix pairs by size and confidence','Record progress against the child’s own results','Praise effort and strategy, not size or speed','Note birth months in the roster so that you remember the age spread','If a child suddenly looks clumsy or says a leg or knee hurts, reduce jumping and running and talk to the parents'])],
  safety:['Safety and Wellbeing','Practice twice a week with a strong running start and a short warm-up. Protect joints, equipment and children.',()=>ul(['Warm up in four stages (raise, activate, mobilise, prepare) and cool down after hard play; children lead stages from the middle of the year','Sprints stay at about 30 yards or less with full rest; landing and diving are practised on soft ground or a crash mat and never forced','Short running bouts with rests; allow walking','Heat: encourage water before children feel thirsty, shorten the run start, practise earlier or later in the day, and watch for cramps, faintness or weakness','Stop and get help if a child feels faint or weak; get medical care if symptoms are serious','No heading practice this year. Follow your league and the FA guidance (no heading in training in the foundation phase; a graduated approach from Under 12). Air passes in this plan are kicked, thrown or controlled with the thigh and chest, with soft balls where possible','Power work is light: low foam plyo boxes (up to 18 inches, or 45 cm), light bands, a 1 to 3 lb medicine ball; few repetitions, full rest, no maximum effort, no loaded squats and nothing that hurts','Stop a power exercise when form slips: knees falling in, stiff landings or twisting. Do not use a band to pull or launch a child','Medicine-ball throws go away from other people to a clear catcher, never overhead above a partner’s head','Pressure pads are held still as a cue; nobody pushes or hits with a pad. Tackling stays with the inside of the foot, with no sliding','Foam roller: gentle, on calves and thighs only, never over joints or the lower back, and stop at sharp pain','Growth spurts: same-age children differ widely in maturity. Do not compare or group by size without reason; reduce jumping and sprints if a child reports knee or heel pain, and ask the parents to speak to a doctor if pain lasts','Full-size goals and youth goals are anchored or weighed down every time, checked before each practice and moved by two or more adults; never hang or climb on a goal','Corner flags and line ropes are soft and flat; set them outside the play area or mark them so runners see them','Check the field before each practice; use flexible poles, break-away hurdles, soft mannequins, balance pods on flat ground, and clear stray balls at once','Keep a first-aid kit, emergency contacts and an injury plan on site. A child with a suspected head injury leaves the activity and gets checked; a bleeding player leaves until the bleeding has stopped (IFAB Law 5)','Follow your league’s safeguarding policy, including two adults present. Child referees always have an adult beside them; cards are signs in role play, never punishments','Video clips: use the phone tripod only with written parent permission, film play rather than faces, keep clips on the coach’s device and delete them at the end of the season','Wellbeing: say nothing about body size, weight or shape; praise habits and effort. Teenage peer pressure is real, so the charter in chapter 1 and the include-everyone rules are part of safety','Watch for children who are tired, injured or upset after a heavy week and let them rest or move to a lighter role'])],
  next:['Looking Ahead to 7th Grade','The next curriculum extends this base.',()=>`<p>7th grade deepens the same chapters and prepares children for the full 11 v 11 game at ages 12 and 13. Expect the FA’s U13 to U14 pitch of 90 by 55 yards with 21 by 7 foot goals, more stable positions, more detail in pressing and build-up, and more responsibility for the players. The KNVB’s O13 11 v 11 form already uses flying substitutions at the halfway line, self-pass restarts and time penalties for yellow cards, so check what your league plays. Use the level ladder to see which chapters need more time before the group moves on.</p>`+ul(['Chapters stay familiar; each gets a new layer','Positions become more stable, but rotation continues for as long as the league allows','Four moments, pressing signals and set plays become team habits that players call themselves','Athlete habits become routines: children lead their own warm-up and report pain without being asked','Light power work grows slowly and only with good form; growth spurts still decide the load for each child','Heading is not introduced in this plan; ask your league for its rule before any heading practice, and note that the FA describes a graduated approach from Under 12','Offside and the full Laws apply in every game; the match sheet and clip review become normal'])],

function guidePage(id){const g=GUIDE[id]||GUIDE.run;return head('Coaching guide',g[0],g[1])+`<div class="gbody">${g[2]()}</div>`;}

/* ---------- shell ---------- */
$('#nav').innerHTML=`<div class="ng"><h6>Program</h6><a href="#/" data-k="/">Overview</a><a href="#/year" data-k="/year">Sixth Grade Calendar</a><a href="#/levels" data-k="/levels">Level ladder</a></div><div class="ng"><h6>Chapters</h6><div class="cgrid">${CH.map(c=>`<a href="#/ch/${c.n}" data-k="/ch/${c.n}" title="${c.title}">${c.n}</a>`).join('')}</div></div><div class="ng"><h6>Coaching guide</h6>${GORDER.map(g=>`<a href="#/g/${g[0]}" data-k="/g/${g[0]}">${g[1]}</a>`).join('')}</div>`;
function route(){
 const h=(location.hash||'#/').slice(2).split('/').filter(Boolean);let html='';
 CUR=null;buildSchedule();
 if(!h.length)html=overview();
 else if(h[0]==='year')html=yearPage();
 else if(h[0]==='levels')html=levelsPage();
 else if(h[0]==='ch')html=chapterPage(+h[1]||1,h[2]||'preview',+h[3]||0);
 else if(h[0]==='session')html=sessionPage(+h[1]||1);
 else if(h[0]==='festival')html=festivalPage(+h[1]||1,h[2]);
 else if(h[0]==='g')html=guidePage(h[1]);
 else html=overview();
 $('#page').innerHTML=html;calAfter();
 $('#page').scrollTop=0;window.scrollTo(0,0);
 const path='/'+h.slice(0,h[0]==='ch'?2:h[0]==='g'?2:1).join('/');
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(path==='/'?'/':path)||(h[0]==='session'||h[0]==='festival')&&a.dataset.k==='/year'));
 document.body.classList.remove('menu');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.scene svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
}
document.addEventListener('click',e=>{
 const ac=e.target.closest('[data-act]');
 if(ac&&CAL){const act=ac.dataset.act;
  if(act==='prev'||act==='next'){CAL.m+=act==='next'?1:-1;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}renderCal();return;}
  if(act==='today'){const t=new Date();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.view='month';renderCal();return;}
  if(act==='vm'){CAL.view='month';renderCal();return;}if(act==='va'){CAL.view='agenda';renderCal();return;}
  if(act==='ev'){CAL.sel=+ac.dataset.k;CAL.panel=null;const ev=SCH[CAL.sel];if(ev&&CAL.view==='month'){CAL.y=ev.date.getFullYear();CAL.m=ev.date.getMonth();}renderCal();return;}
  if(act==='back'){CAL.sel=null;CAL.panel=null;renderCal();return;}
  if(act==='settings'){CAL.sel=null;CAL.panel='settings';renderCal();return;}
  if(act==='skip'||act==='unskip'){const a=new Set(getSkip());act==='skip'?a.add(ac.dataset.iso):a.delete(ac.dataset.iso);lsSet('rchg6-skip',JSON.stringify([...a]));buildSchedule();CAL.sel=null;renderCal();return;}
 }
 const pp=e.target.closest('.pp');
 if(pp){const sv=document.getElementById(pp.dataset.for).querySelector('svg');if(sv.animationsPaused()){sv.unpauseAnimations();pp.classList.remove('is');}else{sv.pauseAnimations();pp.classList.add('is');}return;}
 const bs=e.target.closest('.bsel,.seg');
 if(bs&&CUR){const i=+bs.dataset.i;document.querySelectorAll('.bsel,.seg').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));$('#bpanel').innerHTML=blockDetail(CUR.p.blocks[i],CUR.id+i);return;}
 if(e.target.id==='copyp'&&CUR){const t=PL.toText(CUR.p),b=e.target;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy plan',1400);};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});return;}
 if(e.target.closest('#menu'))document.body.classList.toggle('menu');
});
document.addEventListener('change',e=>{
 if(e.target.id==='startd'&&e.target.value){lsSet('rchg6-start',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
 if(e.target.id==='firstch'){lsSet('rchg6-first',e.target.value);buildSchedule();CAL=null;initCal();renderCal();}
});
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CAL&&(CAL.sel!==null||CAL.panel)){CAL.sel=null;CAL.panel=null;if($('#drawer'))renderCal();}});
const th=$('#theme');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rchg6-theme',t);}catch(e){}}
th.addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||'light';setTheme(cur==='dark'?'light':'dark');});
try{const t=localStorage.getItem('rchg6-theme');if(t)setTheme(t);}catch(e){}
route();
})();
