reevtwo", "Pop-up goal", ""], ["Whistle Review Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goals, bibs, referee kit", "Play 8 v 8. Stop play at set times and the coach sets up a slow motion challenge with no contact, such as a tackle from behind on a runner. Players vote on what the referee should decide, then play on. Nobody makes real contact in the slow motion.", "Win the ball not the player; learn from the vote; stay calm", "Players act as the referee", "Real contact in the replay: no contact, walk it through", 4, "g", "matchday", "Pop-up goal, Bibs, Referee kit", "Serious foul play"], ["High Block Rope Press", 12, "Groups of 8", "45 x 35 yd", "Line rope, discs, balls, bibs", "Lay a rope 15 yards from the attackers' goal as the high pressing line. Four defenders start on it and press together when the keeper plays out. The attackers try to pass out beyond a second rope. The coach counts wins in 2 minutes.", "Hold the line; go together; shut the middle", "Move the rope back", "Defenders go one by one: go as a line", 5, "s", "pressing", "Line rope", ""], ["Man or Zone Call", 12, "Groups of 8", "30 x 25 yd", "Discs, balls, bibs, cones", "A corner kick is taken with four defenders. Before each kick the coach calls zone or man; zone defenders guard a space, man defenders stay with one attacker. After four kicks the group decides which worked better and explains why.", "Know the call; stay with your job; clear it", "Switch the call after the kick", "Calling late: call before the kick", 5, "s", "goalside", "Discs", ""], ["Delay Wide Final 9 v 9", 15, "9 v 9", "70 x 50 yd", "Youth goal, bibs, referee kit, cones", "Play 9 v 9. Attackers get a point for every successful cross. Defenders score by sending attackers wide, clearing safely or tackling cleanly. Foul calls explain whether each challenge was careless, reckless or too strong, and teams can swap roles after each half.", "Delay, then force wide; cover the middle; defend as a team", "Add a restart penalty for each foul", "Rushed tackle: wait for help", 5, "g", "funino", "Youth goal, Bibs, Referee kit", "Foul severity levels"], ["Duel Recovery Gauntlet", 12, "Groups of 4", "30 x 20 yd", "Cones, balls, discs", "A player starts with a ball 8 yards in front of a goal and a defender starts 3 yards behind. The defender sprints to get goal-side, then jockeys and tackles cleanly. After the tackle, the pair resets. Each player has 6 reps.", "Sprint, then slow; stand side-on; block tackle", "Add a second attacker", "Late reach: jockey until the ball is loose", 6, "s", "duel", "Discs", ""], ["Block Choice Under Clock", 12, "Groups of 6", "40 x 30 yd", "Cones, balls, bibs", "The defending team picks a high, mid or low block as the coach calls out how many seconds the attack has to score. Attackers get 10 seconds from the halfway line. Defenders hold their block and win the ball cleanly.", "Pick one block; stay compact; win cleanly", "Shorten the time", "Block drifts apart: stay within 15 yards", 6, "s", "cover", "", ""], ["Block Battle Final 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, bibs, referee kit", "Play 11 v 11 on a full field. Each team picks a defending block, high, mid or low, for each half. A tackle that wins the ball cleanly is a point, and a defender who stops a clear goal chance by a foul gives a free kick and a talk about the penalty.", "Choose the block; stay compact; tackle cleanly", "Change blocks at half time", "Gaps between lines: close them as a team", 6, "g", "matchday", "Full-size goal, Bibs, Referee kit", "Denying a goal-scoring chance"]], "8": [["Gap Finder Squares", 12, "Groups of 6", "30 x 20 yd", "Discs, bibs, balls", "Set two bands of discs across a 30 x 20 yard grid, with 3 attackers in the middle zone and 3 defenders in a back zone. Attackers pass between the defenders into the middle player, who turns and passes on. Defenders only stand in their zone and do not tackle. Swap roles after 2 minutes.", "Look up before the pass; show for the ball between defenders; turn on first touch", "Defenders may step out and block lanes", "Passer looks down: raise your head before you pass", 1, "s", "pass", "", ""], ["Wing Cross Delivery", 12, "Groups of 4", "30 x 25 yd", "Pop-up goal, balls, corner flags, discs", "Mark the end line with a corner flag at each side and set a pop-up goal in the middle. One player dribbles down the wing to the end line, looks up and crosses low to the two attackers running in. The fourth player waits at the far post. Attackers finish in the goal, then rotate.", "Reach the end line; look before crossing; attackers run at different posts", "Add a passive defender", "Cross hit at the keeper: aim for the space between posts and defender", 1, "s", "shoot", "Corner flags", ""], ["Wide Overload Match 6 v 6", 15, "6 v 6", "45 x 35 yd", "Bibs, pop-up goal, discs, balls", "Play 6 v 6 on a field with a pop-up goal at each end and a wide lane marked by discs on each side. When the ball goes into a wide lane, one extra teammate may join the lane, so the attackers have 3 v 2 there. Defenders stay in the field after a goal. Play normal rules otherwise.", "Pass wide to create the extra player; join the lane late; cross or pass back", "Only one defender may follow into the lane", "Nobody uses the lane: play the first pass wide", 1, "g", "threevtwo", "", ""], ["Cutback Run Finish", 12, "Groups of 4", "30 x 25 yd", "Youth goal, mannequin, balls, discs", "Place a mannequin on the goal line near the post as a defender, with a youth goal in the middle. One player dribbles to the end line past the mannequin and passes the ball back along the ground to the edge of the six yard box. Two teammates time runs to meet it and shoot. Rotate roles every turn.", "Pass back low; arrive as the ball arrives; shoot first time", "Add a passive defender at the penalty spot", "Runners arrive too early: wait until the dribbler turns", 2, "s", "cut", "Mannequin", ""], ["Pattern Wall Combos", 12, "Groups of 3", "25 x 20 yd", "Discs, balls", "Set three discs in a triangle about 12 yards apart. Player A passes to B, B plays the ball first time back to C who has moved into space, and C dribbles to the next disc. Call the pattern before each round: A passes to B then C runs, or A passes to C and B runs. Each player does both patterns on both feet.", "Call the pattern; pass into the path of the runner; use both feet", "Limit each player to two touches", "Pattern falls apart: say the plan before the first pass", 2, "s", "giveandgo", "", ""], ["Two Wing Match 7 v 7", 15, "7 v 7", "50 x 35 yd", "Bibs, pop-up goal, discs, balls", "Play 7 v 7 with a pop-up goal at each end and a disc line marking a wide lane on both sides. A goal scored after a pass from a wide lane counts two. Teams must use both sides of the field before they can score a goal that counts two.", "Pass wide; attack the far side; run in for the cross", "Add a time limit of 8 seconds for each attack", "Play stays in the middle: pass to the lane early", 2, "g", "funino", "", ""], ["Line Rope Timing Runs", 12, "Groups of 4", "35 x 25 yd", "Line rope, discs, balls", "Lay a rope across the field as the offside line, with 1 defender standing on it. Two attackers start behind the rope and a passer stands 15 yards back. When the passer looks up, one attacker runs through the gap beside the defender and receives a ball in front of them. The passer plays when the runner moves, not before. Rotate after each turn.", "Start behind the line; go when the passer looks; stay onside", "Defender steps up at random", "Runner starts early: wait for the passer's head to lift", 3, "s", "sprint", "Line rope", ""], ["Pattern Trigger Circuit", 12, "Groups of 6", "35 x 25 yd", "Discs, bibs, balls", "Mark three small stations with discs, each with a different pattern: a wall pass, a third player run and an overlap. Groups of 2 play each pattern in order and then jog to the next station. A coach calls a trigger word, such as turn, and everyone switches to the pattern for that word. Stay 1 minute at each.", "Know the trigger; move on the pass; keep your head up", "Add a passive defender at each station", "Triggers get missed: listen before you start to move", 3, "s", "stations", "", ""], ["Cross and Cutback Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Bibs, pop-up goal, discs, balls", "Play 8 v 8 with a pop-up goal at each end and two wide zones marked with discs. A goal from a cross or a cutback from the end line counts two. Goals from a normal shot count one. Each team picks one player to start the attack from each side.", "Use both wings; time the late run; cutback to the edge", "Only two touches in the final third", "Everyone crowds the ball: send one runner to the far post", 3, "g", "matchday", "", ""], ["Deliberate Play Runners", 12, "Groups of 5", "35 x 25 yd", "Line rope, mannequin, balls", "Lay a rope across the field as the offside line, with a mannequin standing just in front of it as a defender. An attacker runs behind the rope, and the passer plays a long ball. If the defender clearly controls and passes it, the attacker is not offside even beyond the rope. Play the next ball at once.", "Read who has control; stay ready; chase the second ball", "Add a live defender", "Runner stops: keep going until the whistle", 4, "s", "pass", "Line rope", "Offside: deliberate play"], ["Far Side Escape Grid", 12, "Groups of 7", "35 x 25 yd", "Pressure pads, bibs, discs", "Make a 35 x 25 yard grid with a small end zone on each side. 4 attackers keep the ball against 3 defenders, and one defender holds a pressure pad (a soft pad held out as light pressure, never used to push). After four passes the attackers pass to the far end zone to score. Swap after 2 minutes.", "Scan the grid; draw the defender in; pass to the far side", "Reduce to three touches", "Passes pile up on one side: look for the empty side", 4, "s", "spread", "Pressure pads", ""], ["Win It and Go Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Bibs, pop-up goal, discs, balls", "Play 8 v 8 with a pop-up goal at each end. When a team wins the ball, it has 6 seconds to shoot or the other team gets the ball back. Teams count the seconds aloud. A coach restarts with a new ball from the touchline if needed.", "Look forward at once; one pass to break lines; support the runner", "Cut the time to 5 seconds", "Slow start after winning: pass forward first", 4, "g", "transition", "", ""], ["Corner Run Timing", 12, "Groups of 6", "35 x 30 yd", "Offside flags, balls, discs, bibs", "Set a corner with a coach on the touchline holding an offside flag at the far post. Four attackers wait beyond the penalty spot and time their runs as the corner is played, while two defenders cover. Attackers may stand ahead of the ball because there is no offside from a corner. Finish with a first time shot.", "Time the run; start from outside; hit the near or far post", "Add a third defender", "Runners stand still: start behind and arrive moving", 5, "s", "scan", "Offside flags", "Offside: no offence from restarts"], ["Build Then Strike Sequence", 12, "Groups of 8", "60 x 40 yd", "Mannequin, bibs, balls, pop-up goal", "Set up a keeper in a pop-up goal, a mannequin at the halfway line and 7 other players. The keeper plays out to a defender, the team passes through the middle, and a runner goes beyond the mannequin for the final pass. A runner can be called offside if they interfere with play, so wait for the pass. Finish with a shot.", "Build calmly; pass forward; stay onside", "Add two defenders", "Pass into a crowd: wait for the lane", 5, "s", "buildup", "Mannequin", "Offside: interfering with play"], ["Final Third Match 9 v 9", 15, "9 v 9", "70 x 45 yd", "Bibs, youth goal, discs, balls", "Play 9 v 9 on a field with a youth goal at each end. Each team must complete one pass into the final third and one cross or cutback before it shoots. A team that shoots too early loses the ball. The keeper starts every restart.", "Choose to pass, cross or shoot; switch the play; support the runner", "Limit each team to ten seconds in the final third", "Rushed shots: complete the pattern first", 5, "g", "widthdepth", "", ""], ["Chance Factory Timed", 12, "Groups of 6", "40 x 30 yd", "Discs, pop-up goal, balls", "Two teams of 3 take turns attacking a pop-up goal with a keeper. Each attack starts at a disc 25 yards out and has 12 seconds to shoot. The coach counts out loud. Score one point per goal and one extra point for a goal created with a cutback or a third player run. Play 4 rounds each.", "Pick a pattern; move fast; shoot when ready", "Reduce time to 9 seconds", "Waiting for the count: decide as you receive", 6, "s", "thirds", "", ""], ["Captains Attack Plan", 12, "Groups of 8", "45 x 35 yd", "Tactics board, bibs, pop-up goal, balls", "Choose two captains who use a tactics board to plan one attack pattern, such as an overlap and a cutback. The group of 8 plays it against 4 passive defenders for 3 minutes. The captains then change one detail after each round, and the group keeps score of the chances created.", "Tell the plan clearly; adjust after each try; praise the pass", "Defenders press harder", "Plans stay the same: change one thing each round", 6, "s", "phases", "Tactics board", ""], ["Breakthrough Cup Match 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, bibs, corner flags, balls", "Play 11 v 11 on a full field with a full size goal at each end. The referee signals advantage when the attacking team keeps the ball after a foul, and play goes on. Each team names a captain to organize the attacking patterns. Rotate substitutes through the match.", "Choose patterns; speak to each other; keep the advantage", "Add added time at the end", "Referee stops play: keep playing until the whistle", 6, "g", "formation", "Full-size goal", "Advantage"]], "9": [["Eleven Numbers Walk-Through", 12, "Groups of 8", "30 x 20 yd", "Numbered bibs, tactics board, discs, balls", "Give 8 players numbered bibs and walk them into a 3-3-1 shape (3 defenders, 3 midfielders, 1 forward) on the area. Call a number and that player says the job of the spot, such as protect the defense or score. Show a new shape on the tactics board, walk to the new spots, then swap bibs.", "Say your job aloud; Know your neighbors; Walk before you run", "Jog the shapes when the coach calls a number", "Players stand in clumps: point to the spot on the tactics board", 1, "s", "formation", "Numbered bibs, Tactics board", ""], ["Job Card Pass Lines", 12, "Groups of 4", "25 x 15 yd", "Role cards, discs, balls", "Mark three lines 8 yards apart with discs, with one player on each line and a fourth player with the ball. Each player holds a role card for that line, such as back, midfielder or forward. Pass to the next line and read that player's card job aloud, then follow your pass. Swap cards every 2 minutes.", "Read the job first; Pass to the right foot; Follow your pass", "Add a second ball on the back line", "Cards are ignored: read one verb aloud each pass", 1, "s", "lanes", "Role cards", ""], ["Three Zone Match 6 v 6", 15, "6 v 6", "50 x 32 yd", "Pop-up goals, position bibs, discs, balls", "Play 6 v 6 on a pitch split into three zones with discs. Each team has 2 defenders, 2 midfielders and 2 forwards in position bibs, and each player stays in their own zone. A goal counts only if the ball touched a player in all three zones. Swap bibs at each half.", "Pass into the next zone; Stay in your zone; Call for the ball", "Let one midfielder step into the next zone", "Forwards wait idle: defenders pass to them early", 1, "g", "funino", "Position bibs, Pop-up goal", ""], ["Wing-Back Run Outside", 12, "Groups of 4", "35 x 20 yd", "Channel lines, mannequin, balls", "Set channel lines along one side of the area and a mannequin at midfield as an opponent. A center back passes to a midfielder, who plays wide to the wing-back (a full-back who attacks like a winger). The wing-back runs past the mannequin, crosses to the striker, then sprints back. Rotate roles each round.", "Run wide not inside; Cross early; Sprint back", "Add a chaser behind the wing-back", "Wing-back stays forward: sprint back before the next round", 2, "s", "overlap", "Channel lines, Mannequin", ""], ["Sweeper Keeper Sweep", 12, "Groups of 4", "30 x 25 yd", "Pop-up goal, discs, balls", "Place a pop-up goal and mark a zone 10 yards deep in front of it with discs. A server rolls balls behind two defenders and the keeper runs out to clear each one inside the zone, then passes to a defender. After 4 balls, call swap, tell the coach, and a defender takes the keeper's place.", "Read the ball early; Call keeper; Pass after the clear", "Roll the ball faster and farther", "Keeper stays on the line: start one step higher", 2, "s", "keeper", "", "Goalkeeper swap"], ["Build From the Back Match 8 v 8", 15, "8 v 8", "60 x 42 yd", "Pop-up goals, bibs, balls", "Play 8 v 8 with a keeper, 3 defenders, 3 midfielders and 1 forward on each team. Every attack starts with the keeper passing to a center back. A goal counts double if a full-back played the last pass. Swap roles at each half.", "Full-backs join wide; Midfielders offer angles; Keeper starts it", "Allow only two touches in defense", "Defenders kick long: the keeper waits for a short option", 2, "g", "buildup", "", ""], ["Line Rope Back Four Slide", 12, "Groups of 5", "30 x 25 yd", "Line rope, discs, balls", "Lay a line rope across the area as the back line, and 4 defenders stand on it side by side. A fifth player is the server and passes left, right and center. The defenders slide together to keep the line level, and the nearest one steps to the ball. When the server chips over the rope, the nearest drops back and the others cover.", "Move as one line; Nearest steps out; Cover the gap", "Add one attacker who runs behind", "Line breaks apart: keep one arm length gaps", 3, "s", "cover", "Line rope", ""], ["Six Eight Ten Triangle Turns", 12, "Groups of 5", "20 x 20 yd", "Numbered bibs, discs, balls", "Three players wear numbered bibs 6, 8 and 10 and make a triangle inside the square, with 2 defenders pressing lightly in the middle. The 6 starts and passes to the 8, who moves to open an angle. The 10 receives, turns and dribbles over the end line for a point. Swap bibs every 2 minutes.", "6 passes forward; 8 opens an angle; 10 turns quickly", "Limit the 6 to one touch", "8 stands still: move to a new angle after each pass", 3, "s", "rotate", "Numbered bibs", ""], ["Offside Line Step-Up Match 9 v 9", 15, "9 v 9", "70 x 45 yd", "Pop-up goals, offside flags, bibs, balls", "Play 9 v 9 with a referee and an assistant referee holding an offside flag. Defenders step up together to leave a forward ahead of the last defender when the ball is passed. The forward who is closer to the goal than the ball and the second last defender, and takes part, is offside and the other team gets a free kick.", "Step up together; Time the run; Start level", "Defenders try to hold the line for 10 seconds", "Forward starts too early: wait for the pass", 3, "g", "pressing", "", "Offside: the full rule"], ["Wide Cross Nine Arrival", 12, "Groups of 5", "35 x 30 yd", "Youth goal, discs, balls", "Set a youth goal with a keeper and mark a wide lane with discs. A winger dribbles down the lane with a ball while a 9 and a 10 wait outside the box and one defender marks them with no tackling. The winger crosses and the 9 attacks the near post while the 10 arrives at the penalty spot. Rotate every round.", "Cross before the byline; 9 near post; 10 arrives late", "Defender plays full pressure but no contact", "Both attackers run to the same spot: split near and far", 4, "s", "shoot", "", ""], ["Four Corner Role Check", 12, "Groups of 6", "30 x 30 yd", "Match sheet, discs, balls", "Mark four corners with discs: ball skill, decision, running and mind. Pairs hold a match sheet naming a role, then visit each corner for 90 seconds: pass 10 in a row, pick the free teammate, shuttle run 20 yards, and keep passing after a mistake. Tick how hard each task felt from 1 to 3.", "Match the task to the role; Be honest on the sheet; Reset after mistakes", "Add a 3 second time limit at the decision corner", "Sheets ignored: read the role aloud first", 4, "s", "stations", "Match sheet", ""], ["Dangerous Play Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goals, referee kit, bibs, balls", "Play 8 v 8 with a referee, each team in a 3-3-1 shape, and rotate roles every 5 minutes. Players keep feet low when they contest a ball near others. If a player kicks high near a head or at a ball a keeper holds, the referee gives an indirect free kick.", "Feet low near others; Play the ball; Rotate on the whistle", "Shorten each role turn to 3 minutes", "Wild clearances: pass or control instead", 4, "g", "smallgame", "Referee kit", "Dangerous play"], ["Formation Switch Walk and Play", 12, "Groups of 8", "40 x 30 yd", "Tactics board, bibs, discs, balls", "Show 3-3-1 on the tactics board and have 8 players walk into it with a ball. On the whistle, show 3-2-2 and slide to the new spots while passing the ball around. Say aloud what changed in your job. Repeat with one passive defender.", "Look at the board; Slide with the ball; Say what changed", "Switch shapes on a call from a player", "Players forget spots: check the board", 5, "s", "formation", "Tactics board", ""], ["Pivot Pair Switch Rondo", 12, "6 v 3", "20 x 20 yd", "Bibs, discs, balls", "Six players keep the ball against 3 defenders in a square. Two players in bibs are pivots (holding midfielders) and may touch the ball only twice. After 6 passes including both pivots, play to the far side through a disc gate for a point. Swap defenders after each point.", "Pivots stay open; Two touches; Switch after six", "One touch for the pivots", "Pivots stand still: show for the ball", 5, "s", "rondo", "", ""], ["Shape Shift Match 9 v 9", 15, "9 v 9", "70 x 45 yd", "Youth goals, bibs, balls", "Play 9 v 9 starting in 3-3-2. When the coach calls a new shape such as 3-2-3 or 2-4-2, both teams slide into it while play continues. Substitutes wait at the halfway line and enter when the referee signals, after the replaced player has left, so each change gives someone a new role.", "Slide as a unit; Call your new job; Enter on the signal", "Call two shape changes in a row", "Shape change too slow: move on the call", 5, "g", "phases", "", "Substitutions"], ["Wing-Back Five Across Run", 12, "Groups of 6", "45 x 30 yd", "Discs, balls, stopwatch", "Three center backs and two wing-backs line up across a back line, with a sixth player as striker. A center back passes to the wing-back, who runs the whole side to cross for the striker within 8 seconds on the stopwatch. The other wing-back then drops back to make a back four. Rotate roles.", "Run the full side; Beat the clock; Opposite side drops", "Cut the time to 7 seconds", "Wing-back tires: rest for twice the run time", 6, "s", "widthdepth", "Stopwatch", ""], ["Four Roles One Attack", 12, "Groups of 8", "40 x 30 yd", "Pop-up goals, discs, bibs, balls", "Four attackers, a striker, a winger, a 10 and an 8, play against 4 defenders with a goal on each end. When the defenders win the ball they must pass to a target player within 5 seconds. The attackers press for 5 seconds to win it back. Swap roles after 3 minutes.", "Win it, then pass fast; Press for five seconds; Know your role", "Add a third defender behind", "Attackers ignore roles: say your job before each attack", 6, "s", "transition", "", ""], ["Eleven Roles Match 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, corner flags, role cards, referee kit, balls", "Play 11 v 11 on a large pitch with full-size goals, corner flags and a referee. Each team plays a 4-3-3 or 4-4-2 with a role card for each player. At half time every outfield player swaps role with a partner and the goalkeeper swaps with a teammate.", "Know your job each phase; Support your partner; Talk with your line", "Teams choose a new shape at half time", "Roles forgotten: read the card at every stoppage", 6, "g", "matchday", "Full-size goal, Corner flags, Role cards", ""]], "10": [["Four Moments Walk", 12, "Groups of 8", "40 x 30 yd", "Tactics board, discs, bibs", "Lay out discs for a team in a 3-3-2 and let players walk into their spots. The leader calls one moment: build-up, attack, defend or transition. Each player says the job of their line in that moment, then the group walks it again.", "Name the moment; say your job; stay in your line", "Add a slow ball", "Mixing moments up: check the board", 1, "s", "phases", "Tactics board", ""], ["Keeper Plus One Passing", 12, "Groups of 8", "40 x 25 yd", "Discs, balls, bibs", "The keeper joins the build-up as an extra field player. Set a start disc for the keeper, three defenders and three midfielders walk the ball forward to a target player. The group finds the free player each time, then restarts from the keeper.", "Keeper starts; find the free player; open body", "Jog the passes", "Keeper stays back: step up to pass", 1, "s", "buildup", "", ""], ["Principles Match 9 v 9", 15, "9 v 9", "70 x 50 yd", "Youth goals, bibs", "Play 9 v 9 with a keeper in each goal. Before kick-off each team picks one idea for each moment of the game and says it aloud. After every goal the team checks whether it followed its idea, and the coach asks one question.", "One idea each moment; say it aloud; check after goals", "Pick two ideas per moment", "Forgetting the idea: pause and repeat", 1, "g", "funino", "Youth goal, Bibs", ""], ["Back Four Walk", 12, "Groups of 8", "40 x 30 yd", "Tactics board, discs, bibs", "Four players stand as a back four and four as a midfield line, with discs marking each spot. The coach rolls a ball to the left, then right, and both lines slide across and stay level. Players then swap lines and repeat in a 4-3-3.", "Slide together; stay level; talk the gap", "Walk then jog", "Lines uneven: use the discs", 2, "s", "formation", "Tactics board", ""], ["Rope Line Build-Up", 12, "Groups of 8", "40 x 25 yd", "Line rope, discs, balls", "Lay a rope across the middle as the line the defenders must stay behind at first. The keeper and 3 defenders pass around 2 rope-side defenders and play to a midfielder, who passes to a target in the far third. Then the group swaps roles.", "Pass past the rope; spread wide; find the gap", "Allow one defender over the rope", "Playing into traffic: wait for the gap", 2, "s", "buildup", "Line rope", ""], ["Two Shapes Match 9 v 9", 15, "9 v 9", "70 x 50 yd", "Youth goals, bibs, discs", "One team plays a 3-3-2 and the other a 2-4-2. Each game starts with a kick-off where everyone except the kicker stays in their own half. Swap shapes at half time and tell the coach what felt different in each line.", "Hold your line; start in own half; say the change", "Swap shapes every five minutes", "Shape drifts: reset at stoppages", 2, "g", "funino", "Youth goal, Bibs", "Kick-off: own half"], ["Signal Press Trap", 12, "Groups of 8", "40 x 30 yd", "Discs, bibs, balls", "Four defenders wait in a shape while four attackers play around them. When the leader raises an arm, the nearest defender shows the attackers to one side and the others squeeze in behind. A ball won in the squeeze scores one point.", "Raise the arm; show one side; squeeze together", "Hide the signal and use a word", "Pressing alone: wait for the signal", 3, "s", "pressing", "", ""], ["Five Second Stopwatch", 12, "Groups of 6", "40 x 25 yd", "Stopwatch, pop-up goal, balls", "The coach starts the stopwatch when a team wins the ball. The team must shoot at a pop-up goal inside five seconds, or the other team has five seconds to win it back. Players swap teams every two rounds so everyone attacks and recovers.", "Look forward first; go at once; recover fast", "Cut the time to four seconds", "Slow reaction: first pass forward", 3, "s", "transition", "Stopwatch, Pop-up goal", ""], ["Both Ways Counter 9 v 9", 15, "9 v 9", "70 x 50 yd", "Youth goals, bibs, discs", "Play 9 v 9 where a goal within five seconds of winning the ball counts double. If a team loses the ball, it also has five seconds to win it back or drop behind the ball. A defender who plays the ball deliberately does not make a nearby attacker offside.", "Win it and go; recover or drop; read the pass", "Add a three second limit", "Standing still: sprint to a spot", 3, "g", "transition", "Youth goal, Bibs, Discs", "Offside: deliberate play"], ["Line of Four Shift", 12, "Groups of 8", "45 x 30 yd", "Poles, discs, balls", "Four defenders stand in a line behind two poles that mark the gap between players. Four attackers pass across the front, and the line shifts to keep the ball side tight and the far side close to the middle. Switch roles after three minutes.", "Ball side tight; far side tucks in; keep the gaps", "Add a quick switch pass", "Gaps open: move to the poles", 4, "s", "widthdepth", "Poles", ""], ["Rope Trap Press", 12, "Groups of 8", "45 x 30 yd", "Line rope, bibs, balls", "Lay a rope along one touchline as a channel. Attackers play the ball to the rope side and the defenders squeeze them there, using a team call. If the defenders win the ball inside the channel they pass to a target. Swap roles each round.", "Show the side; trap on the rope; call the squeeze", "Add a second ball to start", "Letting them out: close the middle", 4, "s", "pressing", "Line rope", ""], ["Score and Clock Match 9 v 9", 15, "9 v 9", "70 x 50 yd", "Youth goals, stopwatch, bibs", "Teams play 9 v 9 with a stopwatch on the touchline. The team that leads drops to a low block to protect it. The team that trails presses high. A substitute may come on at a stoppage when the coach calls the block change.", "Lead drops low; trail presses high; change together", "Swap the score after five minutes", "Wrong block: check the score", 4, "g", "matchday", "Youth goal, Bibs, Stopwatch", "Substitutions"], ["Half Time Match Sheet", 12, "Groups of 8", "40 x 30 yd", "Match sheet, tactics board, discs", "Play a short eight minute game and stop it. On a match sheet, players tick what worked and write one change for the second half. They place the change on the tactics board and the group plays four more minutes with it.", "Tick what worked; pick one change; play it", "Add a second change", "Too many changes: choose one", 5, "s", "formation", "Match sheet, Tactics board", ""], ["Shape Change Calls", 12, "Groups of 8", "40 x 30 yd", "Bibs, discs, balls", "Eight players play 4 v 4 in a 4-3-3 against a 4-4-2 pattern. When the leader calls change, one team moves to a new shape in ten seconds without stopping the ball. The team that wins the ball in the change scores a point.", "Call early; move together; keep playing", "Shorten to eight seconds", "Moving late: call before the ball", 5, "s", "rotate", "", ""], ["Zone Goal Match 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, corner flags, bibs, line rope", "Divide the pitch into three zones with a rope across each line. A goal counts only if a player from each zone touched the ball in that move. After an out of play ball a player may restart with a self-pass instead of a throw-in.", "Use every zone; keep roles; take the self-pass", "Roles rotate after each goal", "Skipping a zone: draw them in", 5, "g", "thirds", "Full-size goal, Corner flags, Line rope", "Self-pass restart"], ["Plan Rehearsal Ten Minutes", 12, "Groups of 8", "45 x 30 yd", "Tactics board, discs, balls", "Players draw their game plan in four moments on the board. Then they walk the plan, play it at half speed, and finish with a corner kick routine that fits the plan. Each player states their job at one moment, and the group checks it.", "State your job; link the set play; check the plan", "Play it at full speed", "Plan too long: three sentences", 6, "s", "setpos", "Tactics board", ""], ["Build Under Fire", 12, "Groups of 8", "45 x 30 yd", "Stopwatch, discs, balls", "The keeper and 3 defenders build out against 3 pressers who start near the halfway disc. The stopwatch runs for 40 seconds, and the builders must reach the far disc with the ball. Count passes. Then swap sides.", "Keeper joins in; find the free player; stay calm", "Add a fourth presser", "Panic clearance: take a safe pass", 6, "s", "buildup", "Stopwatch", ""], ["Plan Cup 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, tactics board, match sheet, bibs", "Teams play an 11 v 11 match with their own captain who sets a shape and a pressing height. At half time the captain fills in a match sheet, makes one change on the tactics board and tells the team why. A final review asks three questions.", "Plan, play, review; one change; say why", "Add a score target", "Changing everything: one change only", 6, "g", "matchday", "Full-size goal, Tactics board, Match sheet", ""]], "11": [["Far Post Angle Walk", 12, "Groups of 3", "20 x 15 yd", "Pop-up goal, discs, balls", "Set a pop-up goal and mark a half circle of discs 12 yards out. A shooter walks around the half circle with a ball while the keeper moves to stay on the line between ball and goal center, one step off the line. The shooter stops and passes into the goal; the keeper saves with hands and then swaps.", "Line to the ball; step off the line; hands ready", "Shooter jogs the arc and strikes", "Standing too deep: step out one stride", 1, "s", "keeper", "Pop-up goal, Discs", ""], ["Soft Hands Tennis Drops", 12, "Pairs", "15 x 10 yd", "Tennis balls, discs", "Partners stand 5 yards apart. The thrower drops a tennis ball from shoulder height at a different spot each time, and the keeper catches it with two hands and soft elbows, then tosses it back. Swap roles after 10 balls and keep score of clean catches.", "Eyes on the ball; elbows soft; fingers spread", "Throw with a bounce", "Hands stiff, ball pops out: give with the ball", 1, "s", "cushion", "Tennis balls, Discs", ""], ["Swap Keeper Match 6 v 6", 15, "6 v 6", "45 x 30 yd", "Pop-up goals, bibs", "Play 6 v 6 with a keeper in each pop-up goal. When the ball goes out of play, any teammate may swap with the keeper after telling the referee. A save followed by a throw to a free teammate scores a bonus point.", "Tell the referee first; call before you throw; swap gloves fast", "Swap only at stoppages, every 3 minutes", "Silent swap: tell the referee", 1, "g", "smallgame", "Pop-up goal, Bibs", "Goalkeeper swap"], ["Sweep Behind the Line", 12, "Groups of 4", "30 x 25 yd", "Line rope, discs, balls", "Lay a line rope across the field as a back line, 20 yards from a goal of discs. A server plays balls behind the line and the keeper sprints out to clear or collect the ball before the chaser, who starts on the line, can reach it.", "Read early; call keeper; first touch away from the chaser", "Server plays harder balls", "Waiting to see: leave at the first pass", 2, "s", "cover", "Line rope, Discs", ""], ["Light Out Mat Dives", 12, "Groups of 3", "15 x 10 yd", "Crash mat, reaction lights, balls", "Place a crash mat between two reaction lights 4 yards apart. When a light turns on, the feeder rolls a ball to that side and the keeper dives onto the mat, holds the ball and gets up. Do 6 dives, then swap.", "Push off the near foot; hands lead; hold the ball", "Feeder strikes the ball gently", "Landing on the elbow: land on the side", 2, "s", "dive", "Crash mat, Reaction lights", ""], ["Count Down Keeper 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, referee kit", "Play 8 v 8 with a keeper in each goal. The referee counts the last five seconds aloud when a keeper holds the ball in the hands. A keeper who releases before the count ends earns a point; if the count ends, the other team gets a corner.", "Look up at once; throw to a free player; move on", "Referee starts counting at 6", "Holding to think: pick the target first", 2, "g", "funino", "Pop-up goal, Bibs, Referee kit", "Goalkeeper eight seconds"], ["Full Goal Angle Shots", 12, "Groups of 4", "30 x 25 yd", "Full-size goal, colored cones, balls", "Put colored cones at the left, middle and right, 14 yards from a full-size goal. A shooter calls a cone and strikes from there, and the keeper moves to the position between ball and goal center before each shot. Rotate the keeper after 6 shots.", "Move before the strike; stay big; set your feet", "Shooters choose a cone without telling", "Near post gap: cover it first", 3, "s", "shoot", "Full-size goal, Colored cones", ""], ["Rush Down the 2 v 1", 12, "Groups of 3", "25 x 20 yd", "Pop-up goal, discs, balls", "Two attackers start 25 yards out and run at a pop-up goal against a lone keeper. The keeper advances, stops before the attackers pass, and tries to make the first attacker shoot from a poor angle. After each run rotate all three.", "Come out fast; stop and stand big; shut the shooter", "Add a recovering defender", "Diving early: stay on your feet", 3, "s", "twovone", "Pop-up goal, Discs", ""], ["Rebound Offside Match 9 v 9", 15, "9 v 9", "65 x 42 yd", "Youth goals, bibs, line rope", "Play 9 v 9 with a line rope across the field as the offside line. A teammate who stands past the line when a shot is saved and then plays the rebound is offside, and the other team takes a free kick. Onside players may follow every shot.", "Follow every shot; stay behind the line; keeper holds or pushes wide", "Count only rebound goals", "Waiting too close to goal: start behind the ball", 3, "g", "rebound", "Youth goal, Bibs, Line rope", "Offside: gaining an advantage"], ["Net Corner Distribution", 12, "Groups of 3", "30 x 20 yd", "Target net, Hoops and rings, balls", "Set a target net with its corners marked by hoops 20 yards from the keeper. The keeper throws overarm to hit each corner, then rolls the ball to a partner in a hoop 10 yards away. Score one point per corner hit in 10 tries.", "Eyes on the target; step and throw; follow through", "Time it for 60 seconds", "Throwing flat: lift the elbow", 4, "s", "gkthrow", "Target net, Hoops and rings", ""], ["Press the Restart", 12, "Groups of 4", "30 x 25 yd", "Pressure pads, discs, balls", "A defender holding a pressure pad stands 8 yards from the keeper. A teammate passes back to the keeper, who must play it with the feet because of the back-pass rule. The keeper sends the ball to a free player in a disc gate before the pad arrives.", "Open body first; use the weaker foot; pass early", "Defender may touch the pad to the ball", "Panic clearance: find the free player", 4, "s", "gkthrow", "Pressure pads, Discs", "Back-pass rule"], ["Start Under Pressure 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, stopwatch", "Play 8 v 8. After every goal kick, the team with the ball has 6 seconds on the stopwatch to play it past the half line while one striker presses the keeper. Reaching the line in time scores a point.", "Scan before receiving; play short or long on purpose; stay calm", "Cut the time to 5 seconds", "Rushing the kick: wait for the free player", 4, "g", "buildup", "Pop-up goal, Bibs, Stopwatch", "Goal kick"], ["Early Call Cross Duel", 12, "Groups of 6", "35 x 30 yd", "Full-size goal, pressure pads, balls", "Two attackers stand in the penalty area holding pressure pads as passive traffic, and a feeder crosses from either wing. The keeper calls early and claims the ball, or punches it to the side with two fists only if blocked. Rotate every 5 crosses.", "Call early; take off one foot; punch wide", "Add a runner", "Late call: decide when the ball leaves", 5, "s", "keeper", "Full-size goal, Pressure pads", ""], ["Wall Organiser Free Kicks", 12, "Groups of 6", "30 x 25 yd", "Mannequin wall, discs, balls", "Set a mannequin wall of three, 10 yards from a ball placed in front of a goal of discs. The keeper looks at the ball and tells the wall where to stand to cover the near post. A shooter strikes and the keeper covers the far side.", "Call the wall; cover the far side; stay set", "Add a second shooter", "Wall too narrow: move them to the post", 5, "s", "setpos", "Mannequin wall, Discs", "Free kick: wall of three"], ["Reset After a Goal 9 v 9", 15, "9 v 9", "65 x 42 yd", "Youth goals, bibs, effort chart", "Play 9 v 9. After a goal against, the keeper takes one slow breath, points to a number on the effort chart and calls next ball. The team scores a bonus point if the keeper makes the next save or throw.", "Breathe out; clear your mind; next ball", "Reset within 3 seconds", "Head down after a goal: look up and call", 5, "g", "transition", "Youth goal, Bibs, Effort chart", ""], ["Read the Run-Up Penalties", 12, "Groups of 5", "25 x 20 yd", "Full-size goal, discs, balls", "Shooters take penalties from 12 yards while the keeper watches the hips and the plant foot. The keeper stays on the line until the kick. Other players wait behind the penalty area edge, and if one enters early the kick is retaken.", "Stay on the line; read the plant foot; dive late", "Add a quick run-up", "Guessing early: wait for the strike", 6, "s", "duel", "Full-size goal, Discs", "Penalty: encroachment"], ["Claim and Counter Circuit", 12, "Groups of 6", "40 x 30 yd", "Pop-up goal, discs, balls", "A feeder crosses a ball, the keeper claims it, then throws to a runner in a disc gate at the half line. The runner dribbles into the finish zone and shoots. Each round must finish within 12 seconds.", "Claim high; look up; throw fast", "Add a defender on the runner", "Slow release: throw as soon as you land", 6, "s", "stations", "Pop-up goal, Discs", ""], ["Keeper Rotation Final 9 v 9", 15, "9 v 9", "80 x 50 yd", "Youth goals, bibs, referee kit", "Play a full 9 v 9 with a referee. Each team uses three different keepers, one per 5 minute block, and keepers change at a stoppage after telling the referee. A foul by a defender in the penalty area gives a penalty kick.", "Command the area; call the line; support the back line", "Each keeper takes one penalty", "Late swap: tell the referee early", 6, "g", "matchday", "Youth goal, Bibs, Referee kit", "Penalty kick"]], "12": [["Severity Ladder Role Play", 12, "Groups of 6", "30 x 20 yd", "Referee kit, cones, balls", "Six players stand in a ring of cones. The coach reads a short foul story, such as a late tackle from behind. One player is referee and decides careless, reckless or excessive force. The referee shows no card, yellow or red and says why in one sentence. Rotate the referee after each story.", "Say the reason aloud; name the risk to the player; show the card clearly", "Add a story with two possible answers and let the group vote", "Referee guesses: ask what was the danger to the player", 1, "s", "tackle", "Referee kit", "Foul severity levels"], ["Armpit Line Handball Check", 12, "Groups of 4", "20 x 15 yd", "Bibs, balls, discs", "Work in fours. One player throws or kicks a ball softly at a partner standing 5 yards away. The partner holds the arm in different positions, and the other two players call handball or play on. Check that the upper edge of the arm is the bottom of the armpit, and that a body made unnaturally bigger counts.", "Armpit is the top edge; arm away from body is bigger; call it fast", "Add a ball hit from 3 yards with no time to react", "Always calling handball: ask whether the arm moved to the ball", 1, "s", "pairs", "", "Handball"], ["Fair Play Points Match 6 v 6", 15, "6 v 6", "40 x 30 yd", "Pop-up goal, bibs, match sheet", "Play 6 v 6 into two pop-up goals with a player referee. The team earns a point on the match sheet each time a player helps an opponent up, accepts a call without a word or gives the ball back fairly. A player who argues loudly loses the team a point. Highest total of goals plus fair-play points wins.", "Accept the call; talk calmly; help opponents up", "Captain speaks for the team and the referee explains each call", "Arguing: ask for a calm captain question only", 1, "g", "matchday", "Match sheet", "Dissent and unsporting behaviour"], ["Deliberate or Deflected Rope", 12, "Groups of 6", "35 x 25 yd", "Line rope, discs, balls, bibs", "Lay a line rope across the field as the last defender's line. Two attackers wait level with it while a defender passes or the ball is deflected off a defender. If the defender chose to play the ball with time and control, a receiver beyond the rope is allowed. If it only bounced off, the receiver is offside. Rotate roles.", "Control and time mean deliberate; a bounce is not a choice; say the reason", "Add a goalkeeper who saves the shot", "Treating every touch as deliberate: ask whether the defender had a choice", 2, "s", "freeze", "Line rope", "Offside: deliberate play"], ["Wall of Three Free Kick", 12, "Groups of 6", "30 x 25 yd", "Mannequin wall, discs, balls, pop-up goal", "Place a ball 20 yards from a pop-up goal. Three defenders form a wall about 10 yards away, shown by discs. Attackers must stand at least 1 yard from the wall until the ball is kicked. One attacker kicks, the others follow up. A player standing too close gives away an indirect free kick.", "Three in the wall; attackers one yard back; kicker signals the plan", "Add a keeper and a second ball for a quick restart", "Attackers crowd the wall: mark the one-yard line with discs", 2, "s", "setpos", "Mannequin wall", "Free kick: wall of three"], ["Advantage Whistle Match 7 v 7", 15, "7 v 7", "50 x 35 yd", "Pop-up goal, bibs, cones", "Play 7 v 7 with a player referee. After a foul the referee waits two or three seconds. If the fouled team keeps the ball and attacks, call advantage and play on. If not, blow for the foul. When a player throws the ball in wrongly, the other team takes the throw.", "Count two seconds; call play on loudly; check the throw-in", "Add a second referee who watches only throw-ins", "Stopping at every foul: ask who still has the ball", 2, "g", "matchday", "", "Throw-in: wrong throw"], ["Rebound Gain Offside Lines", 12, "Groups of 7", "40 x 30 yd", "Offside flags, cones, balls, pop-up goal", "Seven players use one goal, a keeper and an assistant with a flag. An attacker waits level with the last defender while a teammate shoots. If the ball rebounds off the keeper or post to the waiting attacker, the assistant raises the flag for offside by gaining an advantage. Rotate roles every three shots.", "Gaining an advantage means a rebound; flag up and hold; rotate every three shots", "Add a second attacker who starts from a new position", "Flag too early: wait until the player plays the ball", 3, "s", "rebound", "Offside flags", "Offside: gaining an advantage"], ["Penalty Procedure Crew", 12, "Groups of 6", "30 x 25 yd", "Corner flags, pop-up goal, discs, balls", "Mark a penalty spot 8 yards from a goal and place corner flags where the other players must stand, behind the ball and outside the box. A keeper keeps one foot on the line. Players who run in before the kick cause a retake if it misses, or the goal stands. One kicker, one referee, others observe. Rotate after each kick.", "Keeper foot on line; others behind the mark; referee calls it", "Add a nervous tally: kicker rates feeling 1 to 10", "Players run in early: place discs they must stay behind", 3, "s", "shoot", "Corner flags", "Penalty: encroachment"], ["Dangerous Play Match 7 v 7", 15, "7 v 7", "50 x 35 yd", "Pop-up goal, referee kit, bibs", "Play 7 v 7 with a player referee. Dangerous play means a high foot or crowding a player who is bending low to reach the ball, even with no contact. The referee stops play with an indirect free kick signal, an arm straight up, and says why. Teams earn a point for each safe challenge.", "Feet low; give room; arm up for indirect", "Add an assistant who calls safe challenges", "Referee only calls contact: ask whether it was unsafe", 3, "g", "matchday", "Referee kit", "Dangerous play"], ["Serious Foul Play Case Files", 12, "Groups of 5", "25 x 20 yd", "Bibs, discs, balls", "Five players sit in a circle of discs. The coach describes a challenge from the side, from behind or with studs showing. The group decides serious foul play, reckless or fair, and names the card. A fair challenge with the ball is not punished just because it hurts. Then two players act it out in slow motion.", "Look at force and danger; slow motion shows contact; red card only when severe", "Add a case with advantage played first", "Red for every foul: ask who was in danger", 4, "s", "circle", "", "Serious foul play"], ["Self-Pass Restart Gates", 12, "Groups of 5", "30 x 20 yd", "Discs, balls, cones", "Set two discs as a gate 10 yards from a free kick ball. One player takes a self-pass restart, dribbling the ball once before passing to a teammate. A defender must stay 5 yards away. If the kicker touches twice before another player, the other team gets an indirect free kick. Rotate every two turns.", "Ball still; touch once then pass; opponents back", "Add a timer: restart within five seconds", "Two touches: say it is a double touch and swap", 4, "s", "follow", "", "Self-pass restart, No double touch at restarts"], ["Substitution Crew Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goal, referee kit, bibs, cones", "Play 8 v 8 with a player referee. Substitutes wait at the halfway line. They enter only after the referee waves them on, once the replaced player has left. A goalkeeper may swap with a teammate only at a stoppage, after telling the referee. An unannounced swap earns both players a talk.", "Tell the referee; swap at a stoppage; enter at halfway", "Add one injury stop in each half", "Swap on the run: stop and restart properly", 4, "g", "matchday", "Referee kit", "Goalkeeper swap"], ["Shoot-Out Calm Routine", 12, "Groups of 6", "30 x 25 yd", "Pop-up goal, discs, balls", "Run a mini shoot-out in teams of three. Teams take turns, one kick each, five in total, and only players on the field kick. The referee tosses a coin first and records scores. If tied after five, play sudden death. Every kicker takes one slow breath and picks a corner before the kick.", "Pick a corner; slow breath; accept the result", "Add crowd noise from the group", "Rushing the kick: wait for the whistle", 5, "s", "shoot", "", "Penalty shoot-out"], ["Stoppage Stopwatch Tally", 12, "Groups of 6", "30 x 20 yd", "Stopwatch, referee kit, discs", "Six players play a short game. The referee starts the stopwatch and adds up time lost for injury, substitution and delays. At the end the referee announces the added time and the group plays it. Rest hurt players until the ball is out, and remind them an injured player returns one minute after restart.", "Count lost seconds; announce added time; play it out", "Add a second timekeeper to compare totals", "Guessing the total: add each stop on paper", 5, "s", "stations", "Stopwatch", "Added time"], ["Whole Laws Match 9 v 9", 15, "9 v 9", "80 x 50 yd", "Youth goal, referee kit, offside flags, bibs", "Play 9 v 9 with a player referee, two assistants with flags and a fourth official who tracks subs and time. Teams use full offside, including deliberate play and gaining an advantage. Each call needs a reason. After ten minutes the referee team meets for a quick feedback talk.", "Reason with every call; flag and whistle together; stay calm", "Referee crew rotates at half time", "Missing late calls: assistant stays level with the last defender", 5, "g", "smallgame", "Offside flags", "Offside: deliberate play"], ["Rules Around Clubs Rotation", 12, "Groups of 6", "40 x 30 yd", "Line rope, stopwatch, cones, balls", "Run three short stations. At one, opponents stay 6 yards from a restart. At the second, a yellow card means a 2-minute rest, as in the Dutch KNVB O13 form. At the third, a self-pass restart has no direct goal. Players compare each rule to the Laws and explain what changes.", "Know the local rule; compare to the Laws; explain it to a teammate", "Add a surprise rule card each round", "Mixing rules: name the competition first", 6, "s", "refsignals", "Line rope", "Self-pass restart"], ["Captain and Referee Talk", 12, "Groups of 8", "30 x 20 yd", "Match sheet, discs, balls", "Eight players role play a stoppage. A captain calmly asks a question about a call, the referee answers with one reason and play restarts. Others watch for dissent such as shouting, pointing or mocking. After each talk, the group scores the tone from 1 to 10 on the match sheet.", "Ask do not argue; calm voice; use the captain only", "Add a second argument for the referee to settle", "Group shouts: only the captain speaks", 6, "s", "circle", "Match sheet", "Dissent and unsporting behaviour"], ["Full Laws Final 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, corner flags, referee kit, offside flags, bibs", "Play 11 v 11 with a full officiating team, goals, corner flags and a coach on the side. Teams practise restarts with no double touch and keep penalties fair, with players behind the mark. Referees explain big calls. A fair-play score is read at the end, and each side names one call it respected.", "Respect calls; lead with calm; explain the reason", "Referee crew changes every five minutes", "Players hurry restarts: slow down and reset", 6, "g", "formation", "Full-size goal, Corner flags", "No double touch at restarts, Penalty: encroachment"]], "13": [["Corner Flag Routines", 12, "Groups of 8", "30 x 25 yd", "Corner flags, role cards, balls", "Set a corner flag at the corner and mark a penalty area with cones. Each corner has a taker, a near post runner, a far post runner and a stayer who guards against a counter. The taker plays the ball low to the runner's feet, and the group swaps jobs after every corner.", "Taker calls the plan; low ball to feet; stayer stays back", "Add a second defender at the near post", "Everyone runs to the ball: give each job a cone start spot", 1, "s", "setpos", "Corner flags, Role cards", "Corner kick"], ["Throw-In Long and Short", 12, "Groups of 4", "25 x 15 yd", "Discs, balls", "One thrower stands on the touchline with two options, one close and one far. The thrower picks an option, throws with both hands over the head, and the option controls the ball and passes it back. Swap jobs after each throw, and the group counts throws that are legal.", "Both feet on the ground; two hands, behind the head; call the name", "Add a passive defender next to the near option", "Foot lifts at release: thrower holds the finish for one second", 1, "s", "throwin", "Discs", "Throw-in: wrong throw"], ["Playbook Basics 7 v 7", 15, "7 v 7", "50 x 32 yd", "Pop-up goals, bibs, balls", "Play 7 v 7 with a keeper on each team. Every goal kick, corner and throw-in must use a plan the team named before kick-off. A goal after a named plan counts two. The coach pauses play after each restart so players can say what job they had.", "Say the plan out loud; know your job; take it on time", "Teams must name a new plan after each goal", "Plans are forgotten: show one card to each taker", 1, "g", "funino", "Pop-up goal, Bibs", "Goal kick"], ["Wall of Three Shots", 12, "Groups of 6", "25 x 20 yd", "Mannequin wall, pop-up goal, balls", "Place three mannequins as a wall 6 yards from the ball and a pop-up goal behind them. The shooter and a partner stand at the ball, and two attackers wait at least 1 yard from the wall. On the signal the shooter curls or drives the ball around the wall, and everyone rotates.", "Attackers stay 1 yard away; clear signal; strike through the ball", "Add a keeper and a time limit of 8 seconds", "Attackers crowd the wall: mark a rope line with discs", 2, "s", "shoot", "Mannequin wall, Pop-up goal", "Free kick: wall of three"], ["Goal Kick Build-Up Squares", 12, "Groups of 7", "40 x 25 yd", "Discs, bibs, balls", "Mark two squares in a row with discs, with a goal kick spot behind the first. The keeper plays the ball on the ground to a defender in square one, who passes to a midfielder in square two. Two opponents wait outside the first square and may press only when the ball is played.", "Choose the free player; ground pass; stay wide", "Opponents start 3 yards closer", "Keeper kicks long: score only passes on the ground", 2, "s", "gkthrow", "Discs, Bibs", "Goal kick"], ["Corner Cards Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Corner flags, bibs, role cards, pop-up goals", "Play 8 v 8 with a corner flag in each corner and a card pack for each team. Before every corner the taker picks a card showing near post, far post or short. A goal from a corner counts two, and the defenders earn a point for clearing the ball to the side.", "Show the card to teammates; low delivery; clear wide", "The taker has only 8 seconds to start", "Same card each time: the coach asks to pick a new one", 2, "g", "matchday", "Corner flags, Role cards, Pop-up goal", "Corner kick"], ["Self-Pass Restart Corridor", 12, "Groups of 5", "25 x 20 yd", "Discs, balls, cones", "Set two cone gates 6 yards from the restart spot. A player takes a restart by dribbling out of the spot, not by passing, and must pass through a gate before a defender comes in. The ball must be touched by a second player before the restarter touches it again, and then the group rotates.", "Dribble before the defender is set; look up; pass through the gate", "Defender is allowed to close from 4 yards", "Players touch the ball twice at once: stop and replay the restart", 3, "s", "gates", "Discs", "Self-pass restart"], ["Near Far Cut-Back Corner", 12, "Groups of 7", "30 x 25 yd", "Corner flags, cross target gates, balls", "Set a corner flag and a cross target gate on the near post and another at the far post. The taker plays a low ball to the near gate. The runner there cuts the ball back to the second runner arriving at the penalty spot, who shoots. The taker may not touch the ball again until a teammate has.", "Time the run; cut back low; shoot first time", "Add two defenders marking by zone", "Runners arrive early: start on the taker's signal", 3, "s", "setpos", "Corner flags, Cross target gates", "No double touch at restarts"], ["Full Goal Restart Match 8 v 8", 15, "8 v 8", "65 x 45 yd", "Full-size goal, Pop-up goal, bibs, balls", "Play 8 v 8 with a keeper in a full-size goal at one end and a pop-up goal at the other. Each team has a planned throw-in, free kick and corner, and the match sheet carries one plan per restart. Any goal that comes from a planned restart within 3 passes counts two.", "Check keeper before shooting; plan three passes; call it", "Teams may change the plan once each half", "Keeper not set: wait for the keeper's call", 3, "g", "matchday", "Full-size goal, Pop-up goal, Bibs", "Throw-in"], ["Zonal or Player Corner Defence", 12, "Groups of 8", "30 x 25 yd", "Corner flags, bibs, balls", "Four attackers take a corner against four defenders and a keeper. The defending team picks zonal (guard an area), player (guard one attacker) or a mix. After the delivery, defenders clear to a wide area with the feet, then the group swaps teams.", "Keeper calls; know your job; clear to the side", "Attackers add a decoy run", "Defenders stand still: each defender calls the attacker or the zone", 4, "s", "goalside", "Corner flags, Bibs", "Corner kick"], ["Free Kick Clock Reps", 12, "Groups of 4", "25 x 20 yd", "Stopwatch, pop-up goal, discs, balls", "Set a pop-up goal and a wall of three players. The group has 8 seconds from the stopwatch to start the free kick, and the shooter chooses a signal with a decoy. Attackers stay 1 yard from the wall. Count goals and shots on target across 6 kicks per player.", "Quick signal; decoy early; strike low", "Time limit goes to 6 seconds", "Late starts: the coach counts down out loud", 4, "s", "shoot", "Stopwatch, Pop-up goal", "Free kick: wall of three"], ["Restart Defence Points 9 v 9", 15, "9 v 9", "65 x 42 yd", "Youth goals, bibs, discs", "Play 9 v 9 with a keeper on each team. The defending team earns a point for clearing a restart to the side and two for winning the ball without a shot. The attackers earn two for a goal from a restart and one for a shot. Free kicks are direct or indirect, shown by the referee's arm.", "Defend your job; clear wide; watch the referee's arm", "Free kicks must be taken within 6 seconds", "Points ignored: referee announces the score after each restart", 4, "g", "matchday", "Youth goal, Bibs, Discs", "Direct and indirect free kicks"], ["Fast or Plan Decision Grid", 12, "Groups of 6", "30 x 25 yd", "Line rope, discs, balls, bibs", "Lay a line rope across the middle as a back line for the defenders. A fouled attacker chooses at once: take a quick free kick, or wait one signal for a planned play. If defenders are not behind the rope, go quickly. Swap who defends after 5 restarts.", "Look before choosing; speak early; go when ready", "Add a second defender behind the rope", "Always fast or always slow: coach shows both options", 5, "s", "lanes", "Line rope, Discs, Bibs", "Quick free kick"], ["Kick-Off Switch Routine", 12, "Groups of 8", "40 x 30 yd", "Discs, bibs, balls", "Teams start in their own half. At kick-off the taker passes back to a midfielder, who switches the ball to a runner on the opposite side. Defenders hold a line 6 yards back until the ball moves. After 3 passes, play a normal live round.", "Pass back first; switch fast; runner times the move", "Defenders press after the second pass", "Runner starts too early: wait for the first pass", 5, "s", "setpos", "Discs, Bibs", "Kick-off: own half"], ["Set Play Rotation Match 9 v 9", 15, "9 v 9", "70 x 45 yd", "Youth goals, bibs, referee kit", "Play 9 v 9 with a keeper on each side. Every restart must use a different planned play than the last one, and teams cannot repeat a play until all four types have been tried. A goal from a planned restart counts two. A defended restart earns one point.", "Change the plan; communicate early; keep shape", "Teams must score within 3 passes", "Same plan twice: referee blows the whistle to change", 5, "g", "matchday", "Youth goal, Bibs, Referee kit", "Corner kick"], ["Playbook Call Circuit", 12, "Groups of 8", "40 x 30 yd", "Tactics board, role cards, discs, balls", "Set three stations with discs: corner, free kick and throw-in. Each group member leads one station and draws the plan on the tactics board. Teams run each plan at game speed against passive defenders, then the leader asks the group what worked.", "Leaders call; explain in one sentence; run at pace", "Defenders add light pressure", "Leaders talk too long: set a 20 second limit", 6, "s", "stations", "Tactics board, Role cards", ""], ["Match Sheet Restart Review", 12, "Groups of 6", "30 x 25 yd", "Match sheet, stopwatch, discs, balls", "Play 3 short rounds of 2 minutes, each timed with the stopwatch. One player records every restart on the match sheet: type, who took it, and the result. After each round the group names one thing to keep and one to change.", "Record honestly; say what worked; choose one change", "Add a second recorder for defending", "Notes are too long: write only type and result", 6, "s", "setpos", "Match sheet, Stopwatch, Discs", ""], ["Set Play Derby 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, bibs, corner flags, referee kit", "Play 11 v 11 on a full-size pitch with a keeper in a full-size goal. Each team has a captain who picks a restart plan before every set piece. A goal from a planned restart counts two, and the team that defends one without a shot earns one. Restarts follow the no double touch rule.", "Captain calls; keep the shape; take restarts quickly", "Teams review at half-time using the match sheet", "Captains argue: the referee decides and play restarts", 6, "g", "matchday", "Full-size goal, Corner flags", "No double touch at restarts"]], "14": [["Shoulder Count Passing", 12, "Groups of 3", "20 x 15 yd", "Balls, discs", "Make a 20 x 15 yard grid. Two players pass back and forth while a third stands behind the receiver and holds up 1 to 3 fingers. The receiver looks over a shoulder before the ball arrives and calls the number. Swap jobs every 2 minutes.", "Look before the ball; call the number; calm first touch", "Hold fingers up later", "Nodding without seeing: call the number out loud", 1, "s", "scan", "", ""], ["Ticking Gate Choice", 12, "Groups of 4", "25 x 15 yd", "Stopwatch, cone gates, balls", "Set two cone gates 4 yards apart at the far end of the grid. A player dribbles in slowly while a partner runs the stopwatch to 4 seconds. The player names the open gate aloud and dribbles through it before time ends.", "Name two gates; head up; go", "Cut the time to 3 seconds", "Choosing late: name the gate before the last second", 1, "s", "gates", "Stopwatch", ""], ["Play On Count Match 6 v 6", 15, "6 v 6", "45 x 30 yd", "Pop-up goals, bibs, discs", "Play 6 v 6 on a wide pitch with two pop-up goals. Before each pass, the passer glances up, and the coach counts the head turns aloud. When a foul is minor and the fouled team keeps the ball, the coach calls play on and the game continues.", "Look before passing; play on if you keep it", "Count only turns that show a free player", "Stopping for small contact: listen for play on", 1, "g", "smallgame", "Pop-up goal, Bibs", "Advantage"], ["Body Open Wall Passes", 12, "Pairs", "15 x 10 yd", "Balls, discs", "One player stands 5 yards from a partner who feeds slow passes. Before each pass arrives, the receiver turns the body half open toward the space they want, then takes the ball into that space. Switch every 6 passes and use both feet.", "Open your body early; take it into space; both feet", "Feed faster passes", "Flat body: turn the hips before the ball comes", 2, "s", "receive", "", ""], ["Spot the Pattern 2 v 1", 12, "Groups of 3", "20 x 12 yd", "Balls, discs, bibs", "Two attackers face one defender and try to pass through a cone gate at the end. Before each attempt the attackers say the pattern aloud, such as two v one, and name who is free. Rotate the defender after every 4 attempts.", "Say the pattern; find the free player; pass early", "Add a recovering second defender", "Waiting too long: pass when the defender commits", 2, "s", "twovone", "", ""], ["Overload Call Match 7 v 7", 15, "7 v 7", "50 x 35 yd", "Pop-up goals, bibs, discs", "Play 7 v 7 with two goals. When one team has more players in an area, such as 3 v 2 near the ball, the player on the ball shouts the overload and passes to the free player. A correct call earns one point on top of any goal.", "See the extra player; call it; use it", "Call it within 2 seconds", "Calling after the moment: call as you look", 2, "g", "funino", "Pop-up goal, Bibs", ""], ["Flash and Choose Lanes", 12, "Groups of 4", "25 x 15 yd", "Reaction lights, cone gates, balls", "Place two reaction lights 10 yards ahead of the player, one to the left and one to the right, each with a gate behind it. One light turns on as the player dribbles forward. The player reads it and dribbles through that gate, then jogs back.", "Eyes up; read the light; go fast", "Add a light that means turn back", "Looking at the ball: lift your head at the start", 3, "s", "lanes", "Reaction lights", ""], ["Box Breath Square Passing", 12, "Groups of 4", "12 x 12 yd", "Effort chart, balls, discs", "Four players stand at the corners of a 12 yard square and pass around it quickly for 40 seconds. At the stop call, everyone takes three slow breaths, then points to their effort number from 1 to 10 on the chart. Repeat 4 rounds.", "Pass fast; breathe slow; be honest on the chart", "Shorten the rest between rounds", "Gasping instead of breathing: breathe in 3, out 4", 3, "s", "circle", "Effort chart", ""], ["Eight Second Win Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goals, stopwatch, bibs", "Play 8 v 8. When a team wins the ball, the coach starts the stopwatch and the team has 8 seconds to shoot or reach the far third. After a foul, the team that was fouled may take a quick free kick right away, before the other team sets up.", "Win it, look, go; use the quick free kick", "Cut to 6 seconds", "Rushing the first pass: look first, then go", 3, "g", "transition", "Stopwatch, Pop-up goal, Bibs", "Quick free kick"], ["Three Second Choice 1 v 1", 12, "Groups of 3", "20 x 15 yd", "Stop  "Offside: deliberate play":"Rule in play: IFAB Law 11. A player who receives the ball from an opponent’s deliberate play is not offside, but only if the opponent had control of the ball with a realistic chance to pass it, win it or clear it. A ball that is only deflected, rebounds or is a deliberate save does not count as deliberate play.",
 "Offside: gaining an advantage":"Rule in play: IFAB Law 11. A player in an offside position who gets the ball after it rebounds or is deflected off the post, the bar, an official or an opponent, or after a deliberate save by an opponent, is gaining an advantage and is offside. An indirect free kick restarts play.",
 "Foul severity levels":"Rule in play: IFAB Law 12 sorts fouls into three levels. Careless means a lack of attention and gives a free kick without a card, reckless means disregard for danger and is a yellow card, and excessive force means going beyond the force needed or endangering the opponent and is a red card.",
 "Serious foul play":"Rule in play: IFAB Law 12. A tackle or challenge that endangers an opponent’s safety or uses excessive force is serious foul play and is a sending-off with a red card. In practice we only talk through it with the mannequin and the cards stay in the pocket.",

 "Dangerous play":"Rule in play: IFAB Law 12. Dangerous play is any action that puts someone at risk of injury, such as a high boot near a head, even when there is no contact; the referee gives an indirect free kick to the other team.",
 "Free kick: wall of three":"Rule in play: IFAB Law 13. When the defending team forms a wall of three or more players, the attackers must stay at least 1 yard (1 m) away from the wall until the ball is in play, otherwise it is an indirect free kick. Opponents stand at least 10 yards (9.15 m) from the ball in the Law.",

function keyExtra(sc){
  const types={};let tools=[],rules=[];
  sc.items.forEach(o=>{types[o.t]=1;
    if(o.t==='label'&&typeof o.text==='string'&&/Tool:|Rule:/.test(o.text)){
      const mt=o.text.match(/Tool:\s*([^|]*)/),mr=o.text.match(/Rule:\s*(.*)$/);
      if(mt)tools=mt[1].split(',').map(x=>x.trim()).filter(Boolean);
      if(mr)rules=mr[1].split(',').map(x=>x.trim()).filter(Boolean);}});
  const r=[];
  r.push(`<li class="kx"><i class="kd ko"><svg viewBox="-8 -8 16 16" width="16" height="16"><circle r="6.5" fill="#fff" stroke="#111" stroke-width="1.6"/><circle r="2.4" fill="#111"/></svg></i><span><b>Ball</b>: the white ball. Players and the ball follow the path in the animation, and it repeats.</span></li>`);
  ['cone','goal','zone','circle','line','link','light','flash','wedge'].forEach(k=>{if(types[k])r.push(`<li class="kx"><i class="kd ko">${KEYOBJ[k][0]}</i><span>${KEYOBJ[k][1]}</span></li>`);});
  tools.forEach(t=>{if(KEYTOOL[t])r.push(`<li class="kx kt"><i class="kd ko tool">T</i><span><b>Tool: ${t}.</b> ${KEYTOOL[t]}</span></li>`);});
  rules.forEach(t=>{if(KEYRULE[t])r.push(`<li class="kx kt"><i class="kd ko rule">R</i><span><b>Rule: ${t}.</b> ${KEYRULE[t]}</span></li>`);});
  return r.join('');
}
window.howTo=function(d){
  const org=String(d[5]||'').split(/(?<=[.!?])\s+/).filter(s=>s&&!/^Rule in play/.test(s));
  const li=[];
  li.push(`<li><b>Set up.</b> Area: ${d[3]}. Players: ${d[2]}. You need: ${d[4]}.</li>`);
  org.forEach((s,i)=>li.push(`<li><b>${i===0?'Start.':'Then.'}</b> ${s}</li>`));
  li.push(`<li><b>Coach says.</b> ${d[6]}</li>`);
  li.push(`<li><b>Make it harder.</b> ${d[7]}</li>`);
  li.push(`<li><b>If it goes wrong.</b> ${d[8]}</li>`);
  return `<section class="how"><h4>How to run it</h4><ol>${li.join('')}</ol></section>`;
};

function keyHTML(sc,name){
  const num={},let_={};let hasK=false;
  sc.items.forEach(o=>{if(o.t!=='p')return;const t=o.team||'a';if(t==='k')hasK=true;const n=o.n==null?'':String(o.n);
    if(n===''||!isNaN(n))num[t]=1;else let_[t+n]=[t,n];});
  const rows=[];
  ['a','b','k','c'].forEach(t=>{if(num[t]){const c=KEYCOL[t];rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">1</i><span><b>${c[0]}</b>: ${KEYNUM[t]}</span></li>`);}});
  Object.values(let_).sort((x,y)=>'abkc'.indexOf(x[0])-'abkc'.indexOf(y[0])).forEach(([t,n])=>{
    if(t==='k'&&n==='K'&&!num.k&&Object.keys(let_).filter(z=>z[0]==='k').length===1){/* fallthrough */}
    let m=(KEYSC[name]&&KEYSC[name][n])||(KEYTC[t]&&KEYTC[t][n])||KEYLET[n];
    if(n==='T'&&!(KEYSC[name]&&KEYSC[name].T))m=hasK?'Thrower (sends the ball to the keeper)':'Tagger (chaser)';
    if(n==='L'&&t==='c')m='Ladder runner';
    if(n==='M'&&t==='a')m='Middle player';
    if(n==='F'&&t==='a')m='Front player';
    if(n==='B'&&t==='a')m='Back player';
    if(!m)return;const c=KEYCOL[t];
    rows.push(`<li><i class="kd" style="background:${c[1]};color:${c[2]}">${n}</i><span><b>${c[0]} ${n}</b>: ${m}</span></li>`);});
  rows.push(keyExtra(sc));
  return `<details class="sc-key" open><summary>Key: colors, letters, tools and markings</summary><ul>${rows.join('')}</ul></details>`;
}

window.renderScene=function(name,id,capOverride){
  const sc=S[name]; if(!sc) return '';
  const cap=capOverride||sc.cap;
  let body=pitch();
  sc.items.forEach(o=>{ body+= o.t==='raw'?o.svg:item(o); });
  return `<figure class="scene" id="${id}"><div class="scene-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cap}">${body}</svg><button class="pp" type="button" aria-label="Pause animation" data-for="${id}"><span class="i-pause"></span></button></div><figcaption>${cap}</figcaption>${keyHTML(sc,name)}</figure>`;
};
})();

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function parse(d,k){

const DRIB=[
 function slalom(s,b,R,k){const n=clamp(4+k%3,4,7),it=[],dx=(b.w-60)/(n-1);const cs=[];

   const pts=[[b.x+30,y],[b.x+b.w/2,y+(k%2?14:-14)],[b.x+b.w-30,y],[b.x+b.w/2,y+(k%2?-14:14)]];
   it.push(cn(b.x+b.w/2,y,COL[p]),P(TM[p%2],p+1,pts,4+p*.8+(k%3)*.5,p*.3),B(pts,4+p*.8+(k%3)*.5,p*.3));}

function build(d,kind,idx,ch){

 if(f==='D'){const i=route(RD,txt,(idx+ch*3)%DRIB.length);items.push(...DRIB[i](s,b,R,idx));}
 else if(f==='P'){const i=route(RP,txt,(idx+ch*2)%PASS.length);items.push(...PASS[i](s,b,R,idx));}
 else if(f==='S'){items.push(...mkShoot(s,b,R,route(RS,txt,idx+ch),false));}

 else {items.push(...MOVE[route(RM,txt,(idx+ch)%MOVE.length)](s,b,R,idx));}

}
