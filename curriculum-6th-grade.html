<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCH 6th Grade Curriculum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed chapter index on the left, long-form coach's reference on the right; tactical boards are the visual centerpiece */
:root{
 --bg:#FFFFFF;--bg2:#F7F9F8;--bg3:#E8EEEA;--ink:#0D1C16;--mute:#52635B;--line:#D2DCD7;--accent:#0B7A49;--accent-ink:#FFFFFF;--hi:#D98E04;
 --turf:#2C7A4D;--turf2:#318455;--tline:#ffffffd0;--ta:#2F6FDE;--tb:#E5484D;--tc:#F5B82E;--tk:#7B5EA7;--cone:#F28C28;
 --c1:#0B7A49;--c2:#2F6FDE;--c3:#D98E04;--c4:#7B5EA7;--c5:#7B8C84;--c6:#E5484D;
 --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}

:root[data-theme="dark"]{--bg:#0A1310;--bg2:#111D18;--bg3:#18271F;--ink:#E7EFEB;--mute:#93A59C;--line:#243830;--accent:#3FCB86;--accent-ink:#06130D;--hi:#F2B33D;--turf:#1F5E3B;--turf2:#236843;--c1:#3FCB86;--c2:#6B9BF0;--c3:#F2B33D;--c4:#A58BD6;--c5:#8DA096;--c6:#F2767A;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:20px 14px 14px;gap:16px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:700 26px/1.05 var(--disp);text-transform:uppercase}
.brand span{font-size:12.5px;color:var(--mute)}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ng h6{margin:0 0 4px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ng>a{font-size:14px;text-decoration:none;padding:6px 10px;border-radius:6px;color:var(--mute);border-left:3px solid transparent}
.ng>a:hover{background:var(--bg3);color:var(--ink)}
.ng>a.on{color:var(--ink);background:var(--bg3);border-left-color:var(--accent);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cgrid a{display:grid;place-items:center;height:32px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cgrid a:hover{border-color:var(--accent);color:var(--ink)}
.cgrid a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#theme{margin-top:auto;font:500 12px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#theme:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:clamp(18px,3vw,40px) clamp(16px,3.5vw,48px) 60px;max-width:1240px;width:100%;min-width:0}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.ph{display:flex;gap:20px;align-items:end;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.ph>div{min-width:0}
h2{font:700 clamp(30px,3.6vw,44px)/1 var(--disp);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h3{font:700 22px var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
h4{font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.lead{font-size:16.5px;margin:0 0 8px;max-width:70ch;color:var(--mute)}
.chh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.ch-no{font:700 64px/.85 var(--disp);color:var(--accent);display:flex;flex-direction:column}
.ch-no span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.chip{font:500 11.5px var(--mono);border:1px solid var(--line);padding:3px 8px;border-radius:99px;text-decoration:none;background:var(--bg2)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.plain{color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;font:500 13px var(--mono);text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.off{opacity:.4;pointer-events:none}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card p{margin:0;font-size:14.5px;color:var(--mute)}
.card ul{margin:0;padding-left:1.1em}.card li{margin:0 0 6px;font-size:14.5px}
.why{border-left:3px solid var(--hi)}
.pts{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px 6px 32px;font-size:14.5px;margin:12px 0 0}
.pts li{margin:0 0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--bg3)}
.kc th[scope=row]{font-weight:600;width:34%}
.grid-t td:first-child{font-weight:600}
.lad td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--bg2)}
.lad{min-width:900px;font-size:13px}
.asm td:nth-child(n+3){width:60px;border-left:1px solid var(--line)}
.sp{margin-top:18px}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.check{margin:14px 0 0;padding:10px 16px;border-left:3px solid var(--hi);background:var(--bg2);border-radius:0 6px 6px 0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:22px}
.hero>div{min-width:0}
.hero h1{font:700 clamp(36px,5vw,62px)/.95 var(--disp);text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--mute);margin:0 0 14px;max-width:54ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--mute)}
.stats b{display:block;font:700 28px var(--disp);color:var(--ink)}
.rhythm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cyc a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-width:84px;flex:1 1 84px;background:var(--bg)}
.cyc a:hover{border-color:var(--accent)}
.cyc b{font:700 18px var(--disp);color:var(--accent)}.cyc span{font-size:12px;color:var(--mute);line-height:1.25}
.loop{flex:1 1 100%;font:500 11.5px var(--mono);color:var(--hi);margin-top:4px}
/* year */
.dateset{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.dateset input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)}
.sp-grid{display:grid;gap:4px;overflow-x:auto;padding-bottom:4px}
.sg-h,.sg-r{display:grid;grid-template-columns:96px repeat(11,minmax(52px,1fr));gap:4px;align-items:stretch;min-width:700px}
.sg-h a{text-align:center;font:600 12px var(--mono);color:var(--mute);text-decoration:none}
.sg-l{display:flex;flex-direction:column;justify-content:center}.sg-l b{font:700 18px var(--disp)}.sg-l span{font-size:11.5px;color:var(--mute)}
.sg-c{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:6px;text-decoration:none;color:var(--ink);border:1px solid transparent;background:color-mix(in srgb,var(--accent) calc(var(--l)*11%),var(--bg2))}
.sg-c b{font:600 14px var(--mono)}.sg-c small{font:500 10px var(--mono);color:var(--mute)}
.sg-c:hover{border-color:var(--ink)}
.lv1{--l:1}.lv2{--l:2}.lv3{--l:3}.lv4{--l:4}.lv5{--l:5}.lv6{--l:6}
.sg-f{min-width:700px;margin:2px 0}.sg-f a{display:block;text-align:center;padding:5px;font:500 12px var(--mono);border:1px dashed var(--hi);border-radius:6px;text-decoration:none;color:var(--hi)}
.sg-f a:hover{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.weeks{margin-top:18px}.wk-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.wk-s{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px}
.wk-s i{height:22px;border-radius:2px;display:grid;place-items:center;font-style:normal;background:var(--c1)}
.wk-s b{font:500 8px var(--mono);color:#fff}
.wk-s .t1{background:var(--c1)}.wk-s .t2{background:var(--c2)}.wk-s .t3{background:var(--c4)}.wk-s .f{background:var(--hi)}.wk-s .o{background:var(--bg3)}.wk-s .o b{color:var(--mute)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}.k.t1{background:var(--c1)}.k.t2{background:var(--c2)}.k.t3{background:var(--c4)}.k.f{background:var(--hi)}.k.o{background:var(--bg3);border:1px solid var(--line)}
.lvh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvh>div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.lvh b{display:block;font:600 12px var(--mono);color:var(--ink);margin-bottom:4px}
/* practice */
.ptl{display:flex;gap:3px;margin-bottom:14px}
.seg{border:0;border-radius:4px;height:26px;cursor:pointer;opacity:.55;color:#fff;font:500 10px var(--mono);padding:0;min-width:0;overflow:hidden}
.seg.on,.seg:hover{opacity:1}.seg span{white-space:nowrap}
.seg.c0{background:var(--c1)}.seg.c1{background:var(--c2)}.seg.c2{background:var(--c3)}.seg.c3{background:var(--c4)}.seg.c4{background:var(--c6)}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.blist{display:flex;flex-direction:column;gap:6px}
.bsel{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.bsel:hover{border-color:var(--accent)}.bsel.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.bm{font:600 12px var(--mono);color:var(--accent)}.bn{font-size:13.5px;line-height:1.3}
.eqp{font-size:12.5px;color:var(--mute);margin:6px 2px 0}
.bpanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;align-items:start}.bd>.bd-h,.bd>.bd-how:not(:first-of-type){grid-column:1/-1}.bd>.scene{grid-column:2;grid-row:2/6}.bd>.bd-how,.bd>.bd-dl,.bd>.pts{grid-column:1}.bd-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.bd-h h3{margin:0}
.bt2{font:600 12px var(--mono);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.bd-how{margin:10px 0}
.bd-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 12px}
.bd-dl dt,.drill dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.bd-dl dd,.drill dd{margin:0;font-size:14px}
/* chapter pages */
.notes h3{font-size:26px}
.pager{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:500 12px var(--mono);color:var(--mute);flex-wrap:wrap}
.pager .dot{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--mute)}
.pager>div:nth-child(2){display:flex;gap:6px}
.pager .dot[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pn{margin-left:auto;display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.detail-grid:not(:has(.vis)){grid-template-columns:minmax(0,70ch)}
.txt p{margin:0 0 12px}
.vis{min-width:0}
.faults td{font-size:14px}
.prog{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:14px}
.stairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stp{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) var(--w),transparent var(--w));border:1px solid var(--line);animation:fillx .6s both;animation-delay:var(--d);transform-origin:left;font-size:13.5px}
.stp b{font:600 12px var(--mono);color:var(--accent)}.sn{font:500 11px var(--mono);color:var(--mute)}.sl{font:500 11px var(--mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.focus li{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;padding:0!important;margin:0!important}
.fb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;display:block}.fb i{display:block;height:100%;background:var(--accent);animation:fillw .8s both}
.focus b{font:500 11px var(--mono);color:var(--mute)}
.drillpage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px}
.dsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;text-decoration:none;font-size:14px}
.dsel small{grid-column:2;font:500 11px var(--mono);color:var(--mute)}.dsel[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.dn{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;align-self:start}
.drill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.drill header h3{margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:5px}.meta span{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.drill dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.drill .scene{margin:0;max-width:640px}
.gbody{max-width:1000px}
/* scenes + charts */
.scene{margin:0}
.scene-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #0003}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption,.chart figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
.sc-t{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px}
.sc-t.big{font:700 34px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-t.w{font-size:12px}
.sc-n{font:600 12px var(--mono);fill:#fff}
.pp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;border:0;background:#0009;color:#fff;cursor:pointer;display:grid;place-items:center}
.i-pause{width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp.is .i-pause{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.chart{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ct{font:600 12.5px var(--mono);margin-bottom:8px}.ct span{color:var(--mute);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.ax{font:11px var(--mono);fill:var(--mute)}
.val{font:600 11px var(--mono);fill:var(--mute)}.val.hi{fill:var(--ink)}
.bar{fill:var(--c2);opacity:.75;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom}.bar.hi{fill:var(--accent);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fillw{from{width:0}}@keyframes fillx{from{transform:scaleX(0)}}
@media (max-width:900px){
 .bd{grid-template-columns:minmax(0,1fr)}.bd>.scene{grid-column:1;grid-row:auto}
 .app{grid-template-columns:minmax(0,1fr)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
 .topbar b{font:700 18px var(--disp);text-transform:uppercase}
 #menu{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:7;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0005}
 body.menu aside{transform:none}
 .hero,.cols3,.pgrid,.detail-grid,.prog,.drillpage,.bd-dl,.drill dl{grid-template-columns:minmax(0,1fr)}
 .lvh{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chh{grid-template-columns:minmax(0,1fr);gap:6px}.ch-no{flex-direction:row;align-items:baseline;gap:12px;font-size:52px}
 .stp{grid-template-columns:30px minmax(0,1fr)}.stp .sn{display:none}.stp .sl{grid-column:2}
 .blist{flex-direction:row;overflow-x:auto}.bsel{min-width:170px}
 .dlist{flex-direction:row;overflow-x:auto}.dsel{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:18px}.next b{font:700 20px var(--disp);text-transform:uppercase}.next span:not(.eyebrow){color:var(--mute);font-size:14px}.next .btn{margin-left:auto}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.sq{padding:7px 11px;font-size:15px;line-height:1}
.calw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.calmain{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}

window.D6={"1": [["Charter Card Builders", 12, "Groups of 5", "20 x 15 yd", "Role cards, discs, balls", "Each group of 5 stands in a circle of discs with one ball. Pass to a teammate and say one promise for the team, such as \"everyone gets touches\". After three promises, write them on role cards and lay them in the middle.", "Listen before you speak; short promises; everyone adds one", "Add a fourth promise about losing well", "One loud voice decides: go round the circle in turn", 1, "s", "circle", "Role cards", ""], ["Mentor Mirror Touches", 12, "Pairs", "15 x 15 yd", "Balls, discs, effort chart", "Partners face each other 5 yards apart. The mentor shows a simple ball skill, such as an inside foot push, and the partner copies it for 30 seconds. Then the partner points to a number on the effort chart for how hard it felt.", "Show slowly; praise one thing; ask a question", "Swap mentor every round", "Mentor does it all: let the partner try first", 1, "s", "mirror", "Effort chart", ""], ["Charter Match 6 v 6", 15, "6 v 6", "40 x 28 yd", "Pop-up goals, bibs, match sheet", "Two teams of 6 play with a pop-up goal each. Before kick-off each team reads its three charter promises aloud. A helper ticks the match sheet each time a promise is kept, and the referee uses the signals for fouls and throw-ins.", "Keep your promises; include everyone; thank the referee", "Add a fourth promise", "Promises forgotten: read them again at half time", 1, "g", "funino", "Pop-up goal, Bibs, Match sheet", "Referee signals"], ["Effort Scale Dribbling", 12, "Groups of 4", "25 x 20 yd", "Balls, cones, effort chart", "Each player dribbles around the grid for 30 seconds at a pace they choose. After each round the player points to a number from 1 to 10 on the effort chart. The group says whether the number matches what they saw.", "Honest number; keep the ball close; look up", "Teammates guess the number first", "Always saying 10: compare with what teammates saw", 2, "s", "follow", "Effort chart", ""], ["Fact and Next Step Pairs", 12, "Pairs", "20 x 15 yd", "Balls, discs", "Partners pass back and forth between two discs 10 yards apart. After every 5 passes the watcher says one fact about what happened and one next step, for example \"the pass was slow, try a firmer push\". Swap roles each round.", "One fact; one next step; thank your partner", "Give feedback after only 3 passes", "Opinion not fact: describe what you saw", 2, "s", "pairs", "", ""], ["Include Everyone 7 v 7", 15, "7 v 7", "50 x 32 yd", "Pop-up goals, bibs, match sheet", "Play 7 v 7 with a pop-up goal each. A goal only counts if every player on the scoring team has touched the ball since the last goal. A helper ticks touches on the match sheet and swaps in a substitute every 3 minutes.", "Find the quiet player; pass and move; make time for others", "Each substitute must touch before a goal", "Strong players dominate: give the ball to teammates who have not had it", 2, "g", "smallgame", "Pop-up goal, Bibs, Match sheet", "Substitutions"], ["Calm Reply Rondo", 12, "5 v 2", "15 x 15 yd", "Bibs, balls, referee kit", "Five players keep the ball from two defenders inside a square. A player acts as referee and blows the whistle for a foul. Anyone who answers back or argues instead of replying \"understood\" gives the ball to the other group.", "Say understood; breathe out; play on quickly", "Referee makes a harder call", "Complaining: reply with one word", 3, "s", "rondo", "Referee kit", "Dissent and unsporting behaviour"], ["Conflict Circle Passing", 12, "Groups of 4", "20 x 20 yd", "Balls, discs, role cards", "Four players pass in a circle of discs. When the coach shows a role card with a problem, such as a pass that was too hard, the group stops and talks in three steps: what happened, how it felt, how to fix it. Then play restarts.", "Use I words; listen fully; agree one fix", "Two problems at once", "Blaming a person: describe the action", 3, "s", "circle", "Role cards", ""], ["Captain's Half Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, match sheet", "Play 8 v 8 for two halves of 6 minutes. In one half each captain runs the lineup, uses the match sheet to plan 2 substitutions and calls them to the referee. The coach stays on the side and speaks only if asked.", "Plan the minutes; call early; share playing time", "Captain gives a one sentence plan", "Substitutes enter too soon: wait for the referee", 3, "g", "matchday", "Pop-up goal, Bibs, Match sheet", "Substitutions"], ["Stopwatch Peer Coach", 12, "Pairs", "20 x 15 yd", "Balls, discs, stopwatch", "One partner dribbles through a line of 4 discs while the other times the run with a stopwatch. The timer then has 20 seconds to give one fact and one next step. Swap roles after 6 runs and compare the first and last times.", "Fact first; one next step; stay kind", "Cut feedback time to 10 seconds", "Talking too long: stop at the time", 4, "s", "mirror", "Stopwatch", ""], ["Foul Level Calls", 12, "Groups of 6", "25 x 20 yd", "Bibs, balls, referee kit", "Play 3 v 3 in the grid with one player as referee. At each foul the referee names the level out loud: careless (free kick), reckless (yellow card) or excessive force (red card). The group says whether it agrees, then the referee rotates.", "Name the level; stay calm; explain in one phrase", "Referee must also give advantage", "Always the same call: look at the contact first", 4, "s", "refsignals", "Referee kit", "Foul severity levels"], ["Respect Test Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, referee kit, match sheet", "Play 8 v 8 with a player-referee crew. If a player shows dissent, meaning arguing with a call, the other team takes an indirect free kick from that spot. A helper records each case on the match sheet and the team reviews it.", "Accept every call; captain asks once; play on", "Two dissent offences lead to a substitution", "Arguing after a call: captain speaks, others stay quiet", 4, "g", "smallgame", "Pop-up goal, Bibs, Referee kit, Match sheet", "Dissent and unsporting behaviour"], ["Scenario Station Relay", 12, "Groups of 6", "30 x 25 yd", "Role cards, cones, balls, stopwatch", "Set 3 stations at 15 yard gaps, each with a role card describing a team problem, such as a group chat mocking a teammate. Dribble to a station, read the card and agree a respectful reply in 30 seconds. Then pass to the next player.", "Treat everyone fairly; speak up; keep it short", "Add a time limit of 20 seconds", "Going along with the crowd: say what you would do", 5, "s", "stations", "Role cards", ""], ["Rotating Leader Possession", 12, "Groups of 8", "30 x 25 yd", "Bibs, balls, numbered bibs", "Play 4 v 4 possession with numbered bibs. Every 90 seconds the coach calls a number and that player becomes leader for their team, choosing where to pass and when to press. Each player leads once, whatever their size or strength.", "Leader speaks first; others support; use names", "Leader also makes the substitute call", "The same voice leads: follow the number list", 5, "s", "rotate", "Numbered bibs", ""], ["Referee Crew Match 9 v 9", 15, "9 v 9", "70 x 45 yd", "Pop-up goals, bibs, referee kit, match sheet", "Play 9 v 9 with three players acting as the referee crew. Dissent costs the team a direct free kick from midfield for the other side. The crew uses signals, the match sheet tracks substitutions and each captain gives a thank you.", "Respect the crew; captain speaks once; keep tempo", "Crew rotates at half time", "Players ignore the referee: captain steps in first", 5, "g", "matchday", "Pop-up goal, Bibs, Referee kit, Match sheet", "Dissent and unsporting behaviour, Referee signals"], ["Mentor Session Triangle", 12, "Groups of 3", "25 x 20 yd", "Balls, discs, stopwatch", "In each group of 3 the mentor leads one newer teammate and one observer through three 90 second tasks timed on the stopwatch. They pass, dribble and shoot at a disc gate. Roles rotate each round and the mentor gives one next step.", "Explain simply; encourage; step back", "Mentor chooses the tasks", "Mentor takes over: let the learner try", 6, "s", "triangle", "Stopwatch", ""], ["Charter Review Circuit", 12, "Groups of 6", "30 x 25 yd", "Match sheet, effort chart, cones, balls", "Groups dribble between 3 cone stations. At each station they check one charter promise on the match sheet, point to the effort chart for how well the team kept it, and agree one action for the next game.", "Be honest; name actions; agree together", "Add a fourth promise", "Blaming: speak about the team", 6, "s", "stations", "Match sheet, Effort chart", ""], ["Captain-Run Match 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, bibs, match sheet, referee kit", "Play 11 v 11 where the two captains run their own half. They set the lineup, make planned substitutions at a stoppage with the match sheet and handle a disputed call by asking the referee once. The coach only watches.", "Lead with calm words; share minutes; accept calls", "Captain also leads half time review", "Captains rush substitutions: use the referee signal", 6, "g", "matchday", "Full-size goal, Bibs, Match sheet, Referee kit", "Substitutions, Referee signals"]], "2": [["First Ten Yards Drive", 12, "Groups of 4", "30 x 10 yd", "Cone sprint grid, stopwatch, cones", "Mark a start line and a cone at 10 yards in the sprint grid. Each child leans forward from a standing start and sprints to the cone on the whistle while a partner times it. Walk back slowly, then swap roles. Everyone records only their own best time.", "Lean forward; push the ground back; long first steps", "Start from a crouch", "Standing up too early: stay low for 3 steps", 1, "s", "sprint", "Cone sprint grid, Stopwatch", ""], ["Soft Landing Steps", 12, "Groups of 5", "20 x 12 yd", "Plyo boxes, crash mat, balls", "Place a plyo box 12 inches high beside a crash mat. Each child steps up, hops off with both feet and lands quietly with bent knees, then holds still for two seconds. Pass a ball to the next child and walk back to the line.", "Knees over toes; land quiet; hold two seconds", "Raise the box to 18 inches", "Knees falling inward: push knees out over toes", 1, "s", "balance", "Plyo boxes, Crash mat", ""], ["Whistle Restart Match 5 v 5", 15, "5 v 5", "40 x 28 yd", "Pop-up goals, bibs, balls", "Play 5 v 5 between two pop-up goals. After every foul whistle the fouled team takes a quick free kick at once, and the player who kicks it sprints forward to join the attack. Defenders must back away and set up fast.", "Restart at once; sprint after the pass; defenders get back", "Play with two touches only", "Waiting for the whistle: kick as soon as the ball is still", 1, "g", "smallgame", "Pop-up goal, Bibs", "Quick free kick"], ["Angle Cut Dots", 12, "Groups of 4", "25 x 15 yd", "Agility dots, colored cones, balls", "Lay six agility dots in a zigzag with 5 yards between them. Each child sprints to a dot, plants the outside foot and cuts at a sharp angle to the next dot. Rest by walking back. Repeat with the other foot leading.", "Plant outside foot; hips low; push off hard", "Call the next dot late", "Cutting too wide: plant close to the dot", 2, "s", "cut", "Agility dots", ""], ["Light and Call Reactions", 12, "Groups of 4", "25 x 15 yd", "Reaction lights, colored cones", "Set two reaction lights 8 yards apart with a cone in front of each. The runner waits in the middle in a ready stance. A partner calls left or right, or a light turns on, and the runner sprints to that cone, touches it and returns.", "Eyes up; light feet; first step quick", "Add a fake call to ignore", "Anticipating: wait for the cue", 2, "s", "trafficlight", "Reaction lights", ""], ["Ball Out Sprint Match 6 v 6", 15, "6 v 6", "40 x 28 yd", "Pop-up goals, bibs, balls, spare balls", "Play 6 v 6 with spare balls at the side. When the ball goes out of play, the player nearest the line sprints to restart with a fresh ball while the others sprint back into shape. A ball counts as out only when all of it crosses the line.", "Sprint to the ball; restart quickly; recover your shape", "Restart within five seconds", "Jogging after the ball: sprint to the line", 2, "g", "funino", "Pop-up goal, Bibs", "Ball in and out of play"], ["Hurdle Rhythm Runs", 12, "Groups of 4", "30 x 10 yd", "Speed hurdles, agility ladder, stopwatch", "Set four low speed hurdles in a row, 3 yards apart, with an agility ladder at the end. Each child runs over the hurdles with quick light steps, then through the ladder, then sprints 10 yards. A partner times the run for a personal best.", "Quick light steps; tall posture; arms drive", "Add a ball at the end", "Stepping heavy: think of hot ground", 3, "s", "ladder", "Speed hurdles, Stopwatch", ""], ["Rotation Throw Pairs", 12, "Pairs", "15 x 10 yd", "Medicine ball, discs, effort chart", "Partners stand 5 yards apart side on. Each throws a 2 pound medicine ball with a hip and trunk turn, aiming at chest height away from the partner's head. After six throws, point to the effort chart to say how hard it felt, then swap.", "Turn hips first; throw below head height; catch with soft arms", "Throw after a short run", "Arm only throws: start the turn from the feet", 3, "s", "pairs", "Medicine ball, Effort chart", ""], ["Six Second Counter Match 7 v 7", 15, "7 v 7", "50 x 32 yd", "Pop-up goals, stopwatch, bibs, balls", "Play 7 v 7. When a team wins the ball, a coach starts the stopwatch and the team has 6 seconds to shoot. The other team sprints back to stop the attack. A goal inside 6 seconds counts double.", "Look up on winning it; sprint forward; recover fast", "Cut the time to five seconds", "Forcing bad shots: keep the pass on if it is better", 3, "g", "transition", "Stopwatch, Pop-up goal, Bibs", ""], ["Single Leg Pod Hops", 12, "Groups of 5", "20 x 15 yd", "Balance pods, plyo boxes, balls", "Place a balance pod 2 yards from an 18 inch plyo box. A child steps off the box, lands on both feet, then hops onto one foot on the pod and holds for five seconds. Pass a ball to the next child. Swap legs each round.", "Land quietly; hold the knee steady; eyes up", "Pass a ball while holding", "Wobbling hip: shorten the hold and rebuild", 4, "s", "balance", "Balance pods, Plyo boxes", ""], ["Pad Cue Starts", 12, "Pairs", "25 x 10 yd", "Pressure pads, cones, stopwatch", "One partner holds a pressure pad low at arm's length as a light cue, never to push or hit. The runner stands 2 yards away in a ready stance and sprints 10 yards the moment the pad is dropped. Swap after four starts.", "Watch the pad; react without moving early; drive off", "Pad moves to a side cue", "Early start: stay still until the drop", 4, "s", "mirror", "Pressure pads", ""], ["Gate Recovery Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, timing gates, bibs, balls", "Play 8 v 8 with a timing gate set 15 yards from each goal. After losing the ball, every player must sprint through the gate before they may tackle. The team that has more players back in 5 seconds wins a point.", "Sprint first; then defend; talk to teammates", "Move the gate farther back", "Chasing the ball only: sprint to the gate", 4, "g", "transition", "Timing gates, Pop-up goal, Bibs", ""], ["Repeat Sprint Sets", 12, "Groups of 4", "35 x 10 yd", "Cone sprint grid, stopwatch, cones", "Each child sprints 20 yards to a cone in the sprint grid while a partner times it. Do four sprints with a full rest of one minute or more between them. Write down every time and look for the best, not the slowest.", "Same form every sprint; full rest; stop if form slips", "Add a turn at the cone", "Rushing the rest: wait for the full minute", 5, "s", "sprint", "Cone sprint grid, Stopwatch", ""], ["Roll Out and Reset", 12, "Groups of 4", "20 x 15 yd", "Foam roller, effort chart, balls", "Groups finish with a calm circuit. At one station children gently roll their calves and thighs over a foam roller for 30 seconds, never on a joint. At the next they pass a ball slowly in pairs. Then point to the effort chart to rate how tired they feel.", "Slow rolls; stop if it hurts; breathe slowly", "Add gentle stretches", "Rolling fast: slow down and breathe", 5, "s", "stations", "Foam roller, Effort chart", ""], ["Athlete Match 9 v 9", 15, "9 v 9", "70 x 45 yd", "Pop-up goals, reaction lights, bibs, balls", "Play 9 v 9. A reaction light starts each period of play: green means a free sprint for the ball from the center line and red means everyone freezes and resets. After a goal, each team jogs back to shape and the keeper restarts.", "Sprint on green; stay balanced; recover to shape", "Add a second light color for a pass only", "Moving on red: freeze quickly", 5, "g", "matchday", "Reaction lights, Pop-up goal, Bibs", ""], ["Own Best Test Stations", 12, "Groups of 4", "30 x 20 yd", "Timing gates, plyo boxes, medicine ball", "Groups rotate through three stations: a 20 yard sprint through timing gates, a jump up to a 12 inch plyo box and a 2 pound medicine ball side throw. Each child records only their own result on a private card and rests fully between stations.", "Record your own best; full rest; clean form", "Add a fourth station", "Comparing with friends: compare with yourself only", 6, "s", "stations", "Timing gates, Plyo boxes, Medicine ball", ""], ["Growth Check Band Lanes", 12, "Groups of 5", "25 x 15 yd", "Resistance bands, balance pods, crash mat", "Each child walks sideways in a light band for 8 yards. Then they hold a one-leg balance on a pod for five seconds and land softly on the mat from a small hop. Anyone who feels sore or clumsy tells the coach and works on balance only.", "Light band only; steady knee; tell the coach", "Add a ball pass at the end", "Hiding soreness: tell an adult early", 6, "s", "lanes", "Resistance bands, Balance pods, Crash mat", ""], ["Fast Break Cup 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, stopwatch, bibs, balls", "Play 11 v 11 with a full-size goal at each end. When a team wins the ball, the coach starts the stopwatch and the team has 8 seconds to shoot. A goal in time counts double. The other team sprints back to defend.", "Win it and go; support the runner; recover as a team", "Cut to seven seconds", "Hopeless shots: pass if a teammate is free", 6, "g", "matchday", "Full-size goal, Stopwatch, Bibs", ""]], "3": [["Open Field Long Touches", 12, "Groups of 4", "30 x 15 yd", "Discs, balls", "Mark a 30 by 15 yard lane for each group of 4 with discs at both ends. One player at a time dribbles the length of the lane with long touches in open space, then returns with short touches around three discs set in the middle. Jog back and pass to the next player. Swap feet every round.", "Head up; long touches in space; short touches near discs", "Add a second ball touch count: 12 touches only", "Ball runs away: push it only as far as you can chase", 1, "s", "tour", "", ""], ["Drag Back Doorways", 12, "Pairs", "20 x 15 yd", "Discs, balls", "Set 4 doorways of two discs, 2 yards wide, spread over the area. Each pair has one ball. The dribbler runs at a doorway, stops the ball with the sole of the foot, drags it back and turns out. The partner counts clean turns, then they swap after 6 doorways.", "Sole on top of ball; turn the hips; quick first step away", "Dribbler turns, then bursts 5 yards", "Foot misses the ball: stand closer and slow down", 1, "s", "turn", "", ""], ["Lane Crossing 6 v 6", 15, "6 v 6", "40 x 30 yd", "Line rope, bibs, discs, balls", "Play 6 v 6 with a line rope laid down the middle as a channel. Teams score by dribbling the ball over the opponents' end line under control. Defenders stay on their side of the channel for the first 2 minutes, then play freely.", "Run with the ball in space; shield when pressed; look up", "Dribble over the line, then a pass counts as 2", "Dribbler never looks up: call out a free teammate", 1, "g", "smallgame", "Line rope", ""], ["Cruyff Turn Squares", 12, "Groups of 4", "20 x 20 yd", "Discs, balls", "Each group has a 20 yard square with one disc in the middle as a pretend defender. A player dribbles at the disc, plants one foot, drags the ball behind that leg with the inside of the other foot (a Cruyff turn) and speeds away. Take 8 turns, then the next player goes.", "Plant beside the ball; inside of foot drags; accelerate away", "Turn at a moving partner who walks", "Turn is slow: finish with a 5 yard sprint", 2, "s", "fake", "", ""], ["Step Over Pole Run", 12, "Groups of 3", "25 x 12 yd", "Poles, balls", "Stand 5 poles in a line, 4 yards apart. A player dribbles to a pole, steps one foot over the ball, then pushes it away with the other foot on the other side and passes the pole at speed. Pick one side per run and swap feet each time.", "Step over wide; push with the outside; burst past", "Add a stopwatch time to beat", "Ball stops after the move: touch it forward at once", 2, "s", "zigzag", "Poles", ""], ["Touchline Takeover 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goal, bibs, discs, balls", "Play 8 v 8 with a pop-up goal at each end. Each team keeps one wide player on each touchline who may not be tackled. When one of them gets the ball and a defender is in front, that player dribbles past, then crosses or shoots. A goal after a take-on counts double.", "Attack the front foot; use the touchline; decide late", "Wide players must beat the defender twice", "Wide player passes too early: take on first", 2, "g", "funino", "", ""], ["Inside Outside Traffic", 12, "All", "30 x 30 yd", "Discs, balls", "Every player has a ball inside a 30 yard square and dribbles among the others. On the coach's call of Switch, everyone plays inside and outside touches with both feet, changing direction every 3 touches. Players avoid bumping and keep their ball close. Stop on the whistle.", "Eyes up; small touches in traffic; both feet", "Add a quick pace change on each call", "Players collide: look up and slow down early", 3, "s", "free", "", ""], ["Pad Gate Attack", 12, "Pairs", "20 x 10 yd", "Pressure pads, discs, balls", "One player in each pair attacks from one end, the partner stands in the middle holding a pressure pad low in front of the body as passive pressure. The attacker beats the pad with an inside outside move and dribbles through a 2 yard gate of discs at the far end. Swap after 5 tries.", "Attack the front foot; decide late; speed after the move", "Defender may step in front of the attacker", "Defender pushes the pad out: keep it low and still", 3, "s", "gates", "Pressure pads", ""], ["Weak Side Match 6 v 6", 15, "6 v 6", "45 x 35 yd", "Pop-up goal, bibs, discs, balls", "Play 6 v 6 to two pop-up goals. A dribbler who pushes a defender onto the weaker foot and gets past scores a bonus point for the team. The coach plays advantage: if a foul happens but the attacker keeps the ball, play goes on.", "Show the defender the wrong side; go past quickly; keep playing", "Bonus only if the attack ends in a shot", "Dribbler stops after contact: play on while you still have the ball", 3, "g", "smallgame", "", "Advantage"], ["Timed Pace Run", 12, "Groups of 4", "30 x 10 yd", "Poles, stopwatch, balls", "Place 3 poles at 10, 15 and 20 yards on a 30 yard lane. One player dribbles slowly to the first pole, runs flat out past the third pole and finishes at the end. A teammate times the run with the stopwatch. Walk back for a full rest of 40 seconds before the next player.", "Slow, slow, burst; small touches then long; head up", "Beat your own time by 0.2 seconds", "Pace never changes: slow down before the first pole", 4, "s", "sprint", "Poles, Stopwatch", ""], ["Weaker Foot Duel", 12, "Pairs", "20 x 12 yd", "Pressure pads, discs, balls", "One player attacks and the other defends with a pressure pad held low as light pressure. The attacker chooses the defender's weaker foot and goes past into a 2 yard gate of discs. The defender never kicks or pushes, and keeps boots low to avoid dangerous play. Swap after 4 tries.", "Read the weaker foot; drive past; boots stay low", "Defender may move the pad slowly", "Defender swings a boot: keep tackles low and slow", 4, "s", "duel", "Pressure pads", "Dangerous play"], ["Five Second Attack 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goal, bibs, discs, balls", "Play 8 v 8 with a pop-up goal at each end. When a team wins the ball it has 5 seconds to take a shot or dribble past a defender. If time runs out the ball goes to the other team. The coach counts out loud.", "Win it, look up, attack; one take-on then decide; act fast", "Make it 4 seconds", "Team passes sideways: attack the nearest defender", 4, "g", "transition", "", ""], ["Beat the Mannequin and Pass", 12, "Groups of 6", "35 x 25 yd", "Mannequin, discs, balls", "Stand 2 mannequins 10 yards apart as defenders. A dribbler beats the first mannequin, passes to a teammate waiting at a 2 yard disc gate, and runs on to take the return. Then the dribbler beats the second mannequin and shoots at a pop-up goal.", "Take on, then look up; pass early; shoot with ease", "Add a defender with a pad", "Dribbler keeps the ball too long: pass after the take-on", 5, "s", "pass", "Mannequin", ""], ["Dribble Decide Finish", 12, "Groups of 4", "30 x 25 yd", "Pop-up goal, discs, balls", "Place a pop-up goal with a keeper. Two attackers wait at the edge, one defender stands in front. The attacker with the ball may dribble, pass to the second attacker or shoot, but must decide within 3 seconds of the defender closing. Rotate roles after each try.", "Look up first; pick quickly; strike with confidence", "Add a second defender", "Attackers freeze: choose one option and go", 5, "s", "shoot", "", ""], ["Two Lane Takeover 9 v 9", 15, "9 v 9", "70 x 50 yd", "Pop-up goal, bibs, discs, balls", "Play 9 v 9 with a full pitch split into a wide lane on each side and a central lane. A player who dribbles past a defender and crosses into another lane scores a bonus point. Teams change lanes at half time.", "Look for 1 v 1 wide; support the dribbler; switch quickly", "Bonus only after two lane changes", "Teams crowd the middle: stay wide and spread out", 5, "g", "matchday", "", ""], ["Personal Best Dribble Test", 12, "Pairs", "30 x 20 yd", "Effort chart, discs, balls", "Set a lane of 6 discs, 5 yards apart. Each player dribbles the lane with a move at every disc, then points to a number on the effort chart from 1 to 10 for how hard they worked. The partner tells how the pace changed. Swap after 3 runs.", "Move at every disc; match effort to the goal; both feet", "Increase to 8 discs", "Same effort every time: change pace on purpose", 6, "s", "laps", "Effort chart", ""], ["Defender Choice Challenge", 12, "Pairs", "25 x 15 yd", "Discs, balls", "The attacker faces a defender who picks to show them to the left or right. The attacker then attacks the other side. Each pair plays 8 rounds, and players score one point for a clean beat. Swap roles and swap who leads after 4 rounds.", "Read the defender; attack the open side; finish with a burst", "Defender may shift once", "Attacker always goes the same way: change the plan", 6, "s", "force", "", ""], ["Dribbler's Cup 11 v 11", 15, "11 v 11", "90 x 55 yd", "Referee kit, bibs, discs, balls", "Play 11 v 11 on a full pitch with players choosing their own roles. A teammate acts as the referee for five minutes, using foul severity levels: careless means a free kick, reckless a caution and excessive force a sending off. Dribblers who beat a defender score a team point.", "Take on, pass or shoot; protect the ball; play fair", "Count only take-ons that end in a shot", "Referee lets everything go: explain the level out loud", 6, "g", "matchday", "Referee kit", "Foul severity levels"]], "4": [["Three Zone Receiving", 12, "Groups of 4", "20 x 15 yd", "Balls, discs", "One player tosses an underarm pass to a receiver standing between two discs. The receiver takes it with the foot, thigh or chest depending on height and returns a pass. Swap jobs after every 6 passes, and call the zone out loud.", "Choose zone early; soft touch; ball stays close", "Add a call for the zone before the pass", "Ball bounces away: let the body give way", 1, "s", "cushion", "", ""], ["Look Then Touch", 12, "Pairs", "15 x 10 yd", "Balls, colored cones", "Stand 8 yards from your partner with a colored cone on each side of you. Your partner holds up a finger count behind you, then passes. Look over your shoulder, say the number, then take your first touch toward the cone of your choice.", "Look first; say the number; touch to the cone", "Partner calls the cone color late", "Eyes stay on the ball: look before the pass", 1, "s", "scan", "Colored cones", ""], ["Easy Touch Match 6 v 6", 15, "6 v 6", "45 x 30 yd", "Pop-up goals, bibs", "Play 6 v 6 with a pop-up goal for each team. Every player must take a look over the shoulder before receiving. A goal after a controlled first touch counts two, and a ball kicked out is restarted from the line by the other team.", "Look before receiving; first touch forward", "Limit each player to two touches", "Rushed touches: scan and slow down", 1, "g", "funino", "Pop-up goal, Bibs", "Ball in and out of play"], ["Rebound Frame Direction", 12, "Groups of 4", "15 x 10 yd", "Rebounder frame, balls, discs", "A player passes the ball into the rebounder frame from 4 yards and controls the return. The first touch must go left or right into one of two disc gates, then the player passes to the next in line and joins the back.", "Set it into the gate; soft ankle; look first", "Call the gate after the ball leaves the frame", "Touch is heavy: cushion with the surface", 2, "s", "rebound", "Rebounder frame, Discs", ""], ["Tennis Ball Drop Control", 12, "Pairs", "15 x 10 yd", "Tennis balls, balls, hoops", "One partner tosses a tennis ball underhand so it bounces once toward the receiver. The receiver lets it drop and controls it with the instep or thigh into a hoop on the ground. Count controlled balls in a row, then swap.", "Let it drop; soft instep; touch into hoop", "Receive with the weaker foot", "Foot too stiff: relax the ankle", 2, "s", "bounce", "Tennis balls", ""], ["Two Zone Passing 7 v 7", 15, "7 v 7", "50 x 32 yd", "Pop-up goals, bibs, discs", "Play 7 v 7 with a disc line across the middle to make two zones. A pass into the far zone must be received with one touch to set the ball and then played on. Goals after a clean control of the incoming pass count two.", "Look; set the ball; play on quickly", "Add a three second limit in the zone", "Waiting for the ball: move toward it", 2, "g", "funino", "Pop-up goal, Bibs, Discs", ""], ["Throw-In Reception Gates", 12, "Groups of 4", "25 x 15 yd", "Balls, discs", "Two players act as throwers on the touchline and two as receivers inside the area, each throw taken with two hands over the head and both feet on the line. The receiver moves toward the throw, controls it and plays through a disc gate to the other receiver.", "Show for it; first touch away; play on", "Add a passive defender to the receiver", "Standing still: take two steps toward the thrower", 3, "s", "throwin", "", "Throw-in"], ["Pad Pressure Turns", 12, "Groups of 3", "15 x 15 yd", "Pressure pads, balls, discs", "A passer plays to a receiver whose back is to a defender holding a pressure pad about one yard behind. The receiver checks the pad, takes a first touch away and turns past the defender with a drag or roll. Then dribble to a disc gate and swap roles.", "Body between ball and pad; turn away; speed up", "Defender steps closer after the pass", "Turning into the pad: touch away from it", 3, "s", "turn", "Pressure pads", ""], ["Escape Touch Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs", "Play 8 v 8 with a pop-up goal for each team and a keeper. A receiver who turns away from a close defender and passes forward within three seconds wins one extra point for the team. Normal goals count one.", "Scan; touch away; play on in time", "Cut the time to two seconds", "Panic touch: look and use the free side", 3, "g", "funino", "Pop-up goal, Bibs", ""], ["Ten Second Escape", 12, "Groups of 4", "20 x 15 yd", "Stopwatch, balls, discs", "A receiver stands in a disc square with a defender who stays passive for two seconds and then closes lightly. The coach starts the stopwatch when the ball is played. The receiver must take a first touch, escape and dribble out through any disc gate before ten seconds end.", "Scan first; escape the side with space; speed", "Reduce the time to eight seconds", "Slow start: decide before the ball arrives", 4, "s", "shield", "Stopwatch", ""], ["Keeper Release Receiving", 12, "Groups of 4", "30 x 20 yd", "Youth goal, balls, discs", "A keeper in a youth goal rolls or throws the ball to a receiver standing wide of the goal. The receiver scans, takes one touch away from a passive defender and passes to a teammate in a disc gate. Rotate all four players through the keeper job.", "Show wide; scan; first touch away", "Defender presses after the keeper throws", "Receiving too close: move wide of the goal", 4, "s", "gkthrow", "Youth goal", ""], ["Wrong Throw Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, discs", "Play 8 v 8 with a pop-up goal for each team. Throw-ins are taken with two hands over the head and both feet on the line. If a throw is wrong, such as one foot lifted or one hand used, the other team takes the throw. A receiver who controls and turns scores a bonus point.", "Throw clean; show for it; first touch away", "Defenders may press from 3 yards", "Foot lifts: keep both feet down", 4, "g", "matchday", "Pop-up goal, Bibs", "Throw-in: wrong throw"], ["Light Signal Touch", 12, "Groups of 4", "20 x 15 yd", "Reaction lights, balls, discs", "Put a reaction light in front of the receiver. When the pass leaves a partner's foot the coach triggers the light. Green means play first time to a disc gate, red means take one touch and then pass. The receiver decides before the ball arrives.", "Look at the light; choose early; touch clean", "Light changes later in the pass", "Late choice: scan sooner", 5, "s", "firsttime", "Reaction lights", ""], ["Pad Back to Goal Duel", 12, "Groups of 4", "20 x 15 yd", "Pressure pads, balls, discs", "A receiver stands with their back to a small goal made from two discs. A defender holding a pressure pad lightly presses from behind after the pass. The receiver shields the ball, turns away and tries to dribble over the end line. Rotate every 6 attempts.", "Shield; turn away; accelerate", "Add a second pad defender", "Turns into pressure: use the free hip", 5, "s", "duel", "Pressure pads", ""], ["Line Breaker Match 9 v 9", 15, "9 v 9", "75 x 48 yd", "Pop-up goals, bibs, discs", "Play 9 v 9 with a disc line across the middle. A pass received just past the line and turned to play forward within two seconds earns two points; goals count one. Each team has a keeper.", "Scan; receive on the half-turn; play forward", "Reduce to one touch beyond the line", "Back to goal: open the body early", 5, "g", "buildup", "Pop-up goal, Bibs, Discs", ""], ["Receive on the Run", 12, "Groups of 4", "30 x 15 yd", "Balls, discs, poles", "Two players stand at each end of a lane marked by discs, with a pole in the middle. A player runs at speed through the lane, receives a pass from the other end, takes the ball past the pole and passes back. Rest fully after every run.", "Move onto the ball; touch ahead; keep speed", "Add a defender at the pole", "Slowing down: touch into stride", 6, "s", "lanes", "Poles", ""], ["Lofted Switch Control", 12, "Groups of 4", "40 x 25 yd", "Soft balls, discs, bibs", "Two players stand 20 yards apart, with a defender wearing a bib between them. One plays a lofted pass over the defender and the receiver controls it with the thigh, chest or instep. The first touch must move the ball away from the defender before passing back.", "Choose the zone; soft touch; away from pressure", "Defender may run toward the receiver", "Ball jumps off: relax and give way", 6, "s", "cushion", "", ""], ["Final Third Touch Match 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, bibs, discs", "Play 11 v 11 on a full-size pitch with a keeper in each goal. A pass received between the lines under pressure and turned within two seconds counts as a point for the team. Normal goals count one. Every player must play in all three thirds.", "Scan; receive turned; play forward", "Add a three touch limit", "Slow decisions: look before the ball", 6, "g", "transition", "Full-size goal, Bibs", ""]], "5": [["Long Drive Hoop Targets", 12, "Pairs", "40 x 10 yd", "Balls, Hoops and rings, cones", "Partners stand 30 to 35 yards apart with a hoop beside each. Each player drives a pass with the laces so it lands in or near the partner's hoop. Switch after 5 passes each, resting between sets.", "Standing foot beside the ball; laces through the middle", "Add a moving partner", "Slicing the ball: strike the middle", 1, "s", "pairs", "Hoops and rings", ""], ["Lofted Pass Over the Rope", 12, "Groups of 3", "35 x 15 yd", "Line rope, balls, discs", "Lay a rope across the middle of the area as a defender line. One player lofts the ball over the rope to a partner at the far end, who controls it and passes back. The third player waits, then rotates in.", "Lean back; strike under the ball", "Raise the distance by 5 yards", "Ball too high: strike lower on the ball", 1, "s", "pass", "Line rope", ""], ["Range Bonus Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, discs", "Two teams play a normal game with pop-up goals. A completed pass of 25 yards or more earns a bonus point, and a goal after it counts double. Rotate who takes the long passes each round.", "Long when open; short when not", "Add a time limit", "Always long: mix it up", 1, "g", "funino", "Pop-up goal, Bibs, Discs", ""], ["Eyes Fake Pass Trios", 12, "Groups of 3", "25 x 15 yd", "Balls, mannequin, discs", "Set a mannequin between two end players and place the third player beside it. The player in the middle looks at the side player but passes to the far end player. Rotate after 6 passes each.", "Look one way; pass another", "Add a passive defender", "Telegraphing: keep the head still", 2, "s", "fake", "Mannequin", ""], ["Bend Through the Arc", 12, "Groups of 4", "30 x 15 yd", "Passing arc, balls, discs", "Place a passing arc 15 yards from the passer. The passer bends a pass with the inside of the foot through the arc to a partner waiting wide. Two players wait at the start and rotate in after each round.", "Wrap the inside foot; aim wide", "Move the arc to the other side", "Straight pass: aim outside the arc", 2, "s", "pass", "Passing arc", ""], ["Three Team Rondo 8 v 4", 15, "8 v 4", "30 x 25 yd", "Bibs, discs", "Four defenders try to win the ball from two teams of four attackers, who play together in a grid. Attackers make four passes, then pass to the far side. The player who loses the ball becomes a defender.", "Four passes then switch; stay wide", "Allow two touches only", "Bunching up: spread to the edges", 2, "g", "rondo", "Bibs, Discs", ""], ["Y Pattern Passing Chain", 12, "Groups of 5", "30 x 25 yd", "Discs, balls", "Place cones in a Y shape. Players pass in a set order around the Y and follow their pass to the next cone. After 6 clean rounds, reverse the order. Call the next name before each pass.", "Pass and move at once; call the name", "Add a time target", "Standing still: run after you pass", 3, "s", "triangle", "Discs", ""], ["Bent Pass to the Runner", 12, "Groups of 3", "30 x 20 yd", "Mannequin, balls, discs", "A passer stands behind a mannequin and bends a pass around it into the path of a runner moving wide. The runner takes it in stride and passes back to the start. Players rotate after 5 passes.", "Bend wide; pass to the runner's path", "Add a passive defender", "Pass behind the runner: lead them", 3, "s", "pairs", "Mannequin", ""], ["Quick Restart Match 8 v 8", 15, "8 v 8", "55 x 38 yd", "Pop-up goals, bibs, discs", "Teams play a normal game. After every free kick, the team that was fouled may play at once if the ball is still, before the other team lines up. A goal from a quick restart counts double.", "Spot the free player; play fast", "Add a time limit of 4 seconds", "Waiting for the wall: play at once", 3, "g", "funino", "Pop-up goal, Bibs, Discs", "Quick free kick"], ["Diamond Pass Against the Clock", 12, "Groups of 4", "20 x 20 yd", "Discs, balls, stopwatch", "Four players stand at the corners of a diamond. They pass around it and follow the ball, with the coach timing 10 clean passes on a stopwatch. Try to beat the time without losing the ball.", "Clean first, then fast; call names", "Beat your best time", "Rushing: slow down to stay clean", 4, "s", "shapes", "Stopwatch", ""], ["Rebound Board Return Passes", 12, "Pairs", "25 x 10 yd", "Rebound board, balls, discs", "One partner passes into a rebound board from 10 yards and the other receives the return and passes it back. Swap jobs every 6 passes. Add a disc gate to pass through on the return.", "Pass firm; control, then pass back", "Play with one touch", "Weak return: pass harder", 4, "s", "rebound", "Rebound board", ""], ["Restart Rhythm 9 v 9", 15, "9 v 9", "65 x 42 yd", "Youth goals, bibs, discs", "Two teams of 9 play with a goal after any restart counting double. At free kicks and throw-ins, the same player may not touch the ball twice in a row, so a teammate must take the second touch.", "Play it short, then move", "Add a time limit", "Double touch: pass to a teammate", 4, "g", "funino", "Youth goal, Bibs, Discs", "No double touch at restarts"], ["Pass Under Pressure Choices", 12, "Groups of 4", "30 x 20 yd", "Balls, discs, mannequin", "A passer receives with a defender 2 yards away. Two targets stand wide and one stands far away. The passer picks a short, bent or long pass, then explains the choice. Rotate roles after each round.", "Scan first; pick the free player", "Add a second defender", "Hurrying: take one look first", 5, "s", "twovone", "", ""], ["Play Through the Press Line", 12, "Groups of 6", "35 x 25 yd", "Line rope, mannequin, balls", "Lay a rope across the middle as the press line with 2 defenders behind it. Four attackers on one side pass until a gap opens, then play through or over the rope to a free teammate. Rotate roles every 4 rounds.", "Find the gap; pass over if blocked", "Add a third defender", "Forcing the pass: wait for the gap", 5, "s", "pressing", "Line rope", ""], ["Deliberate Play Match 9 v 9", 15, "9 v 9", "65 x 42 yd", "Youth goals, bibs, discs, offside flags", "Teams play with offside in use. When a defender plays a long ball to clear, an attacker who receives it is not offside. Attackers score double if they win the second ball and score within 8 seconds.", "Stay onside; react to the clearance", "Add a time limit", "Stopping early: play to the whistle", 5, "g", "funino", "Youth goal, Bibs, Discs, Offside flags", "Offside: deliberate play"], ["Long Pass Control Race", 12, "Groups of 4", "40 x 20 yd", "Balls, discs, Hoops and rings", "Two lines of 2 stand 30 to 35 yards apart. The first player drives a pass to the far line, runs to follow it, and the receiver controls it and returns the pass. Which group finishes 8 clean passes first?", "Clean control; quick return pass", "Add a defender", "Heavy first touch: cushion the ball", 6, "s", "pass", "Hoops and rings", ""], ["Combination Pattern Circuit", 12, "Groups of 6", "40 x 30 yd", "Discs, balls, mannequin", "Set three stations in the area: a Y, a diamond and a 3-man box. Each group of 6 passes through one pattern for 2 minutes, then rotates to the next station. Players lead the pattern and call the next pass.", "Pass, move, call; keep the beat", "Add a passive defender", "Losing count: say the order aloud", 6, "s", "stations", "Mannequin", ""], ["Range and Rhythm 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, bibs, corner flags", "Two teams of 11 play on a large field. A pass through the opponents' press line counts one point, a switch of play counts one point, and a goal after either counts double. Captains meet at half time to set a plan.", "Switch early; break the press", "Add a quick free kick bonus", "Long balls only: mix short and long", 6, "g", "matchday", "Full-size goal, Bibs, Corner flags", ""]], "6": [["Side Foot Corner Targets", 12, "Groups of 4", "25 x 15 yd", "Target net, balls, discs", "Set a target net 12 yards from a line of discs. Each player takes a turn, names a corner, and places the ball there with the inside of the foot. Then the player tries again with the laces for power and counts how many hit the named corner.", "Pick the corner first; locked ankle; follow through to target", "Move the ball from a roll to a pass from a partner", "Hitting the middle: say the corner aloud", 1, "s", "shoot", "Target net", ""], ["Curl Around the Mannequin", 12, "Groups of 4", "25 x 20 yd", "Mannequin, pop-up goal, balls", "Stand a mannequin 6 yards in front of a pop-up goal and place the ball to one side of it. The shooter curves the ball around the mannequin into the far corner using the inside of the foot. Players take two turns each from each side, then swap.", "Strike the ball's side; swing across it; eyes on the ball", "Start further out and use the weaker foot", "Ball hits the mannequin: aim wider and strike lower", 1, "s", "shoot", "Mannequin, Pop-up goal", ""], ["Placement Points Match 6 v 6", 15, "6 v 6", "45 x 30 yd", "Pop-up goals, bibs, balls", "Two teams of six play with a pop-up goal at each end. A goal scored into a corner of the goal, in the bottom third, counts two points. A goal down the middle counts one. The coach calls the score after every goal.", "Look up before you shoot; pick a corner; shoot early", "Add a keeper who can swap after each goal", "Blasting down the middle: pick the low corner", 1, "g", "funino", "Pop-up goal, Bibs", ""], ["Volley Feed Strike Station", 12, "Groups of 3", "20 x 15 yd", "Mini cage, balls, discs", "One player feeds a soft underhand toss from 4 yards. The shooter lets the ball bounce once and strikes it with the laces at a mini cage. The third player collects. Swap roles after five feeds, and use both feet.", "Knee over the ball; head still; hit the top half", "Feed a slightly harder toss from the side", "Leaning back and skying it: lean over the ball", 2, "s", "bounce", "Mini cage, Discs", ""], ["Cutback and Pull-Back Finish", 12, "Groups of 4", "30 x 20 yd", "Cross target gates, pop-up goal, balls", "One player dribbles down the wing to the end line, then pulls the ball back along the ground through the cross target gates at the edge of the box. A second player runs in and shoots first time into the pop-up goal. Rotate after each turn.", "Look for the runner; pass behind the gate; time your run", "Add a second runner for the far side", "Cutback too hard: pass with the inside of the foot", 2, "s", "overlap", "Cross target gates, Pop-up goal", ""], ["Wide Lane Goals Match 7 v 7", 15, "7 v 7", "50 x 35 yd", "Pop-up goals, bibs, channel lines", "Two teams of seven play across a pitch with a wide lane on each side marked by channel lines. A goal scored first time from a pass played back from a wide lane counts two. All other goals count one. Switch teams halfway.", "Get wide; pass back; arrive late", "Limit wide players to two touches", "Everyone stays central: send one player wide", 2, "g", "smallgame", "Pop-up goal, Bibs, Channel lines", ""], ["Chase Every Shot Rebounds", 12, "Groups of 4", "30 x 20 yd", "Full-size goal, balls, discs", "One player shoots at a full-size goal while another plays keeper. The two other players wait at the penalty spot edge and chase every shot that rebounds off the keeper or post, and finish it at once. Rotate shooter, keeper and chasers after four shots.", "Follow the shot; be ready; strike the second ball", "Chasers must start two yards further back", "Watching the shot: move on the strike", 3, "s", "rebound", "Full-size goal, Discs", ""], ["Bounce and Laces Ladder", 12, "Groups of 3", "25 x 20 yd", "Full-size goal, corner flags, balls", "Put three corner flags in a line 12, 16 and 20 yards from the full-size goal. A feeder tosses a soft bounce to each flag in turn. The shooter strikes it on the half volley at goal, and the coach scores one point per ball on target. Rotate after six balls.", "Strike just after the bounce; keep it low; eyes on the ball", "Feeder tosses from the side", "Dragging it high: plant the standing foot level with the ball", 3, "s", "bounce", "Full-size goal, Corner flags", ""], ["Zone Burst Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Full-size goal, pop-up goal, bibs, balls", "Two teams of eight play toward a full-size goal and a pop-up goal. A goal scored within three touches of winning the ball counts two points. Any shot after a rebound counts two as well. The coach keeps score on the whiteboard.", "Shoot early; follow up; keep your head up", "Cut it to two touches after winning the ball", "Passing too long: shoot when the gap opens", 3, "g", "funino", "Full-size goal, Pop-up goal, Bibs", ""], ["Sprint Then Strike Clock", 12, "Groups of 4", "30 x 25 yd", "Stopwatch, full-size goal, discs, balls", "Each player sprints 15 yards to a disc, then receives a rolled ball from a partner and shoots at a full-size goal. A partner times the sprint with the stopwatch and everyone rests for the time of the next three turns. Shoot within five seconds of the disc.", "Sprint, settle, then place it; breathe out; stay tall", "Shorten the time limit to four seconds", "Rushing after the sprint: settle first, then strike", 4, "s", "sprint", "Stopwatch, Full-size goal, Discs", ""], ["Two Attackers Against Keeper", 12, "Groups of 4", "30 x 25 yd", "Full-size goal, mannequin, balls", "Two attackers start 25 yards out with a defender mannequin standing between them and the goal. They pass to beat the mannequin and one shoots. Players decide whether to shoot or square the ball to the other. Rotate attackers, keeper and feeder after each turn.", "Draw the keeper; shoot or pass early; call for it", "Replace the mannequin with a live defender", "Both attackers run together: one goes wide", 4, "s", "twovone", "Full-size goal, Mannequin", ""], ["Second Ball Advantage Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Full-size goal, pop-up goal, line rope, bibs", "Two teams of eight play with a line rope on the ground as the offside line. A player standing past the line when a shot rebounds off the keeper or post can still score if they were not involved earlier. Goals from rebounds count two.", "Stay onside; chase every shot; finish the rebound", "Add a point for scoring on the second touch", "Standing in front of the keeper: step back onside", 4, "g", "smallgame", "Full-size goal, Pop-up goal, Line rope, Bibs", "Offside: gaining an advantage"], ["Pad Pressure Finish", 12, "Groups of 4", "30 x 25 yd", "Full-size goal, pressure pads, balls", "A shooter receives a pass 20 yards out while a defender holds a pressure pad and walks toward them as passive pressure. The shooter takes a touch and finishes at the full-size goal. The pad never touches the shooter. Swap after four turns.", "Open the first touch; look at the goal; strike calmly", "Increase the defender's speed to a jog", "Rushing under pressure: take one calm touch", 5, "s", "shoot", "Full-size goal, Pressure pads", ""], ["Spot Kick Routine Rounds", 12, "Groups of 5", "30 x 25 yd", "Full-size goal, effort chart, balls", "Each kicker walks through the same routine: place the ball, step back, breathe, look, and strike from the penalty mark. The other players wait behind the mark outside the penalty area and anyone who steps in early forces a retake. After each kick the kicker points to a calm score on the effort chart.", "Same steps every time; one breath; pick a corner", "Add a short wait before the whistle", "Rushing the run up: slow your breath first", 5, "s", "circle", "Full-size goal, Effort chart", "Penalty kick, Penalty: encroachment"], ["Crossing Contest 9 v 9", 15, "9 v 9", "70 x 45 yd", "Full-size goal, corner flags, bibs, balls", "Two teams of nine play with a corner flag on each side of the pitch. A goal finished with the feet from a cross counts two. A cutback goal counts two. After every goal the goalkeepers swap with a field player, and the referee is told first.", "Cross early; arrive late; cover the keeper", "Give the keeper two goals to defend", "Crowding the near post: spread across the box", 5, "g", "widthdepth", "Full-size goal, Corner flags, Bibs", "Goalkeeper swap"], ["Late Run Cutback Combination", 12, "Groups of 6", "40 x 30 yd", "Full-size goal, mini cage, balls", "Two wide players and two central runners start on the edge of the box. A winger dribbles to the end line and cuts the ball back. A runner arrives late and finishes into the full-size goal. A second runner follows for any rebound. Rotate after each turn.", "Time the run; pass behind; finish first time", "Add a recovering defender", "Arriving too early: wait for the cutback", 6, "s", "giveandgo", "Full-size goal, Mini cage", ""], ["Spot Kick Team Showdown", 12, "Groups of 6", "30 x 25 yd", "Full-size goal, match sheet, balls", "Two teams of three take turns at penalty kicks while the match sheet records every result. Each kicker uses the full routine and the opposing players stand outside the area. Any early step into the area means a retake. The team with more goals after nine kicks wins.", "Same routine; stay calm; own the kick", "Add a one minute fitness break first", "Encroaching players: stand outside the arc", 6, "s", "keeper", "Full-size goal, Match sheet", "Penalty: encroachment"], ["Finishing Showcase 11 v 11", 15, "11 v 11", "90 x 55 yd", "Full-size goal, match sheet, corner flags, bibs, referee kit", "Two teams of eleven play a full match on a large field. The match sheet counts every shot, cross and rebound, and a goal from a cross or cutback counts two. A coach leads the pregame talk and players choose their own shots.", "Choose placement or power; follow up; keep your calm", "Reduce the time to ten minutes", "Shooting from too far: look for a better angle", 6, "g", "matchday", "Full-size goal, Match sheet, Corner flags, Bibs, Referee kit", ""]], "7": [["Angle of Approach Arcs", 12, "Pairs", "20 x 15 yd", "Poles, balls, cones", "Set two poles 12 yards apart. The attacker dribbles slowly toward a cone line while the defender runs a curved path to arrive on the attacker's side, so the attacker can only go one way. Swap after 5 rounds. The defender stops 2 yards away and stays side-on.", "Curve, do not charge; side-on body; stop at 2 yards", "Attacker speeds up", "Running straight at the ball: curve the run", 1, "s", "jockey", "Poles", ""], ["Block Tackle Pad Reps", 12, "Groups of 3", "15 x 10 yd", "Pressure pads, balls, cones", "One player stands still holding a soft pad low as a pretend defender, nobody pushes it. The attacker dribbles at the pad, the defender steps in beside it and blocks the ball with the inside of the front foot. Rotate jobs every 4 reps.", "Strike the ball not the player; body behind the foot; stay on your feet", "Moving pad holder", "Reaching in with a straight leg: bend and set the foot first", 1, "s", "tackle", "Pressure pads", "Fouls: tackling and holding"], ["Delay and Force Match 6 v 6", 15, "6 v 6", "45 x 30 yd", "Pop-up goals, line rope, bibs", "Play 6 v 6 to two goals. Lay a rope across the middle as the defending line for the team without the ball. Defenders slow the attacker down and send them toward the sideline instead of tackling at once. A won ball scores a point if kept for 3 passes.", "Slow the attack; show them wide; wait for help", "Move the rope forward", "Diving in early: stay on your feet and delay", 1, "g", "funino", "Pop-up goal, Line rope, Bibs", ""], ["Cover and Balance Triangles", 12, "Groups of 3", "25 x 15 yd", "Discs, balls, bibs", "Play 2 v 1 toward a small cone goal. The first defender slows the ball carrier while the second defender stands a few yards behind and to the side, ready to step in. Switch the defender jobs after each attack. Attackers score by dribbling through the goal.", "First defender delays; second defender covers behind; talk the jobs", "Add a third attacker", "Both defenders on the ball: the second one drops back", 2, "s", "twovone", "Discs", ""], ["Recovery Clock Runs", 12, "Groups of 4", "35 x 20 yd", "Stopwatch, cones, balls", "A forward dribbles toward goal from the halfway cone while a defender starts 5 yards behind. The defender sprints to get between the ball and the goal, then slows down. The coach times each run with the stopwatch and the group tries to beat its best time. Full rest between runs.", "Sprint first; reach the goal-side; then slow down", "Start the defender farther back", "Chasing from behind: take the straight line to goal", 2, "s", "sprint", "Stopwatch", ""], ["Mid Block Rope Match 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goals, line rope, bibs", "Play 8 v 8. Lay a rope across the middle of the field as the mid block line; the team without the ball keeps all outfield players behind it until the ball is passed. The referee (coach) says if each foul is careless, reckless or too strong, and the team learns the three levels.", "Hold the line; stay close together; win it cleanly", "Move the rope each round", "Players step out alone: go as a group", 2, "g", "phases", "Pop-up goal, Line rope, Bibs", "Foul severity levels"], ["Trap and Squeeze Wings", 12, "Groups of 6", "40 x 30 yd", "Pressure pads, discs, balls, bibs", "Three attackers keep the ball on one wing, with a defender holding a pad as a quiet passive helper. Defenders push the ball toward the sideline, then squeeze together so the attacker has no safe pass. Count a win when the ball goes out or is stolen in the squeeze.", "Show them to the sideline; close the pass; all move together", "Add a fourth defender", "Defenders spread out: stay within 5 yards", 3, "s", "pressing", "Pressure pads", ""], ["Cross Zone Wall Defence", 12, "Groups of 6", "30 x 25 yd", "Mannequin wall, balls, cones, bibs", "A winger crosses from the side toward a small goal and defenders stand in a line of zones in front of the mannequin wall, each guarding a space. Defenders clear to the sides, never with a raised foot near an attacker. Rotate after 4 crosses.", "Own your space; call the runner; clear wide", "Add a second crosser", "High foot near others: keep the foot low", 3, "s", "goalside", "Mannequin wall", "Dangerous play"], ["Defend the Counter 8 v 8", 15, "8 v 8", "60 x 40 yd", "Pop-up goals, bibs, cones", "Play 8 v 8. When a team loses the ball, the nearest player delays the carrier and the others sprint back goal-side. If they win it within 6 seconds of losing it, they score a bonus point. A normal goal scores a point as usual.", "Delay the ball; sprint back; win it back fast", "Cut the bonus time to 4 seconds", "Everyone chases: one delays, rest recover", 3, "g", "transition", "Pop-up goal, Bibs", ""], ["Trigger Pad Press", 12, "Groups of 6", "35 x 25 yd", "Pressure pads, balls, discs, bibs", "Two attackers pass between three cone gates with a keeper-style server. The pressing pair run on the trigger, a back pass or a heavy touch, with one defender using a pad as soft pressure on the pass. The attackers escape through a gate to win.", "Go on the trigger; second defender covers; stop if no trigger", "Add a light pressing time limit", "Pressing with no trigger: wait and stay compact", 4, "s", "pressing", "Pressure pads", ""], ["Three v Two Balance Squeeze", 12, "Groups of 5", "30 x 25 yd", "Pop-up goal, bibs, balls", "Three attackers face two defenders and a keeper at a pop-up goal. The defenders slow the attack and keep one behind the other so there is always a covering player. After a shot or a won ball, new attackers come in.", "Front defender delays; back defender covers; talk", "Add a fourth attacker late", "Both defenders side by side: one steps behind", 4, "s", "th
